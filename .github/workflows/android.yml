# Builds the Android app (APK) and attaches it to the "latest" release.
# Required secrets (the build fails without them): ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["src/**", "android/**", "build.py", "package*.json", "capacitor.config.json", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: pip install pyyaml
      - run: npm ci
      - name: Build web app and copy it into the Android project
        env:
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          python3 build.py
          node --test test/*.test.js
          npx cap sync android
      - name: Load the signing key from secrets (required)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # stop here if any signing secret is missing; never fall back to another key
          for v in KEYSTORE_B64 KS_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!v}" ]; then echo "::error::Signing secret for $v is not set. Add the ANDROID_* secrets in Settings > Secrets and variables > Actions."; exit 1; fi
          done
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../CMD-Academy.apk
      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: CMD-Academy-apk
          path: CMD-Academy.apk
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest CMD-Academy.apk \
            --title "CMD Academy 1.0.${{ github.run_number }}" \
            --notes "Android app. Download CMD-Academy.apk on your phone and open it to install (allow installing from this source when asked)." \
            --latest
