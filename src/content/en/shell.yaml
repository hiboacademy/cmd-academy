# English teaching notes shown under Simulator output.
# {name} style placeholders are filled by the engine. `code` is shown LTR.

# --- general ---
not_recognized: 'This command doesn''t exist in CMD, or it was mistyped.'
suggest: 'Did you mean `{cmd}`?'
folder_not_command: '`{name}` is the name of a folder, not a command. To go into it, type: `cd {name}`'
file_not_command: '`{name}` is a file. To see the contents of a text file, type: `type {name}`'
file_cmd_missing: 'No file named `{name}` was found here. Use `dir` to see where the batch file is.'
persian_kb: 'It looks like your keyboard is set to Persian. Type commands with English letters.'
typed_prompt: 'You don''t need to type the prompt (like `C:\Users\Student>`). Just type the command.'
usage_note: 'The Windows help is in English. Parts inside [ ] are optional.'
help_footer: 'For help with any command, type the command name followed by `/?`, for example `dir /?`'
invalid_switch: 'This switch isn''t defined for `{cmd}`. Use `{cmd} /?` to see the correct switches.'
syntax: 'This command needs an argument, or it was written the wrong way. For help, type `{cmd} /?`'
later_lesson: '`{cmd}` is taught in lesson {n}.'
danger: '⚠ `{cmd}` is a dangerous command and can destroy data. The simulator never runs any command on a real device.'
need_admin: '`{cmd}` needs administrator rights. In the simulator, use the “Administrator” button at the top of the page (lesson 64).'
winre_only: '`{cmd}` only exists in the Recovery Environment (the Windows repair environment). In the simulator, choose “Recovery” mode (lesson 96).'
gui_app: '{app} is a graphical program. In real CMD its window opens; the simulator is text-only.'
notepad_hint: 'To see the contents of `{name}` right here, type: `type {name}`'
start_note: '`start` opens a new window or program (`{what}`). The simulator has only one window.'
cmd_nested: 'A new CMD started inside the current CMD. In the simulator, both are the same.'
exit: 'In the simulator, `exit` doesn''t close the window. In real CMD, this command closes the CMD window.'
exit_batch: '`exit` without `/b` closes the whole CMD. Inside a batch file, `exit /b` is usually better.'
loop_guard: 'Execution stopped: this command or script repeated too many times (probably an endless loop with `goto`). Check the loop''s exit condition.'
missing_paren: 'A parenthesis `(` was opened but never closed. In real CMD you''ll see `More?` while it waits for the rest of the command.'
double_percent: 'On the command line, a `for` variable is written with one `%` (`%i`). Double `%%` is only needed inside a batch file.'
batch_syntax: 'Syntax error in line {line} of the batch file; the script stopped here.'
batch_only: '`{cmd}` only makes sense inside a batch file.'
goto_interactive: '`goto` only works inside a batch file (lesson 82).'

# --- paths & folders ---
path_not_found: 'This path doesn''t exist. Use `dir` to see which folders are in the current directory, or check the spelling of the name.'
path_spaces: 'Does the folder name have a space? Put it in quotes, like: `cd "Summer 2026"`'
cd_other_drive: 'The current directory of drive {drive} changed, but you are still on drive {cur}. To go there, type `{drive}:` or use `cd /d`.'
dir_name_invalid: '`{name}` is a file, not a folder. `cd` only goes into folders.'
drive_not_found: 'There is no drive with the letter {drive} on this system. Available drives: {list}'
missing_colon: 'To change drives, put a colon after the letter: `{drive}:`'
file_not_found: 'There is no file with this name here. Use `dir` to see the exact name.'
dir_no_match: 'No file here matches the pattern `{pattern}`.'
already_exists: 'A folder or file with this name already exists here.'
bad_name: 'A folder or file name can''t contain these characters: < > : " / \ | ? *'
mkdir_many: 'Because of the spaces, {n} separate folders were created. For one folder with spaces in its name, use quotes: `mkdir "My Folder"`'
popd_empty: 'No path has been saved with `pushd` yet.'
rd_file: '`{name}` is a file. To delete a file, use `del`.'
rd_not_empty: 'The folder `{name}` isn''t empty. `rd /s` deletes the folder and everything in it; look inside with `dir` first.'
rd_in_use: 'You can''t delete or move the folder you are currently in (or a folder above it). First step out with `cd ..`.'
system_protected: 'This folder belongs to Windows itself, and Windows protects it; even an administrator usually can''t delete, move or rename it. The same is true in the simulator.'
system_write: 'Creating or changing files inside Windows folders (like `C:\Windows` and `C:\Program Files`) needs administrator rights. For normal work, keep your files in your own user folder.'
readonly_inside: 'There is a read-only file inside this folder. Unlock it first with `attrib -r`.'

# --- files ---
type_dir: '`{name}` is a folder. `type` only shows the contents of text files.'
type_binary: 'This isn''t a text file (.{ext}), so real CMD shows unreadable characters.'
copy_self: 'The source and destination are the same. Give another folder or a new name as the destination.'
copy_too_many: '`copy` takes two arguments: source and destination. If a name has spaces, put it in quotes.'
copy_concat: '{n} files were joined together and written into one file. If you wanted to copy them separately, the destination must be a folder.'
dest_missing: 'The destination folder doesn''t exist. Create it first with `mkdir`.'
move_spaces: '`move` takes two arguments. Put names with spaces in quotes.'
move_into_self: 'You can''t move a folder into itself.'
move_exists: 'There is already a folder with the same name at the destination.'
ren_spaces: '`ren` takes exactly two names. Put names with spaces in quotes.'
ren_path: 'In `ren`, the second name is only the new name, without a path. To move a file somewhere else, use `move`.'
ren_exists: 'A file named `{name}` already exists here.'
ren_no_ext: 'The new name has no extension. Windows may no longer know which program should open the file.'
del_readonly: 'This file is read-only. It can be deleted with `del /f` or after `attrib -r`.'
del_hidden: 'Hidden files aren''t deleted by a normal `del`. Use `dir /a` to see them.'
attrib_hidden: 'The file is now hidden; a normal `dir` doesn''t show it, but `dir /a` does.'
robocopy_usage: 'Correct form: `robocopy SOURCE DESTINATION`, for example `robocopy C:\Users\Student\Documents D:\Backup /e`'
robocopy_mir: '⚠ `/mir` makes the destination an exact copy of the source: files that aren''t in the source are deleted from the destination.'
robocopy_exit: 'The exit code is {code}. In robocopy, 0 to 7 means success; 8 and above means an error.'

# --- text ---
find_quotes: 'The search text for `find` must be in quotes: `find "Pizza" menu.txt`'
find_no_input: 'This command needs either a file name or the output of another command via `|`. Example: `type menu.txt | find "Pizza"`'
sort_no_input: 'Give a file name, or send another command''s output to `sort` with `|`. Example: `type guests.txt | sort`'
more_no_input: 'Give a file name, or send another command''s output to `more` with `|`.'
clip_no_input: '`clip` takes the output of another command: `dir | clip`'
clip_done: 'The output was copied to the clipboard.'
echo_onoff: '`echo on` and `echo off` are mostly used in batch scripts (lesson 71).'
echo_off_prompt: 'With `echo off`, the prompt is hidden; CMD is still waiting for your command. Bring it back with `echo on`. (This command is mostly used in batch scripts.)'
echo_on_prompt: 'The prompt is shown again.'

# --- variables ---
set_space_name: 'You put a space before `=`, so the variable name became “{name} ” (with a space). Correct: `set name=value` without spaces.'
set_space_value: 'You put a space after `=`; that space became part of the variable''s value.'
seta_error: '`set /a` only understands whole numbers and the operators + - * / % ( ).'
color_same: 'The text color and background color can''t be the same.'
date_set: 'Changing the system time and date needs administrator rights. Use `date /t` to just see the date.'
hostname_set: '`hostname` only shows the computer name; it doesn''t change it.'
whoami_admin: 'This CMD is running with administrator rights (High Mandatory Level).'
whoami_user: 'This is a normal CMD (Medium Mandatory Level). The user is a member of Administrators, but those rights aren''t active until you open CMD with Run as administrator.'

# --- processes & services ---
tasklist_filter: 'Correct filter form: `tasklist /fi "imagename eq notepad.exe"`'
taskkill_need: 'Say which process: `taskkill /im notepad.exe` or `taskkill /pid 7344`'
taskkill_critical: 'This process is essential for Windows and can''t be closed.'
taskkill_force: 'This program isn''t responding (Not Responding). `/f` forces it to close.'
taskkill_self: '⚠ In real CMD, closing cmd.exe closes this very window.'
taskkill_notfound: 'No process with this name is running. Use `tasklist` to see the exact name.'
taskkill_ext: 'Write the process name with its extension, like `notepad.exe`.'
sc_name: 'The service name wasn''t found. Use `sc query` or `net start` to see the names (for example `Spooler`).'
sc_cmds: 'Common commands: `sc query`, `sc query Spooler`, `sc stop Spooler`, `sc start Spooler`'
svc_defender: '⚠ Turning off the antivirus leaves the computer defenseless.'
shutdown_sim: '⚠ On a real computer, Windows {what} after {secs} seconds. The simulator does nothing. To cancel: `shutdown /a`'
shutdown_shutdown: 'shuts down'
shutdown_restart: 'restarts'
shutdown_logoff: 'signs out of the user account'
shutdown_hibernate: 'goes into hibernation'
shutdown_abort: 'The shutdown was canceled.'

# --- network ---
ping_nohost: 'This name couldn''t be turned into an IP. Check the spelling of the address, or use `nslookup` to see whether DNS knows it.'
ping_nohost_dot: 'A website address usually has a dot, like `{t}.com`.'
ping_nonet: 'The computer isn''t connected to a network (it has no IP). Check the status with `ipconfig` and get a new IP with `ipconfig /renew`.'
ping_timeout: 'No reply came back. Either the device is off, or a firewall is blocking ping.'
ping_unreachable: 'No device with this IP was found on the network. Note: this message came from your own computer, not from the destination.'
ping_option: 'ping switches are written with `-`, like `ping -n 2 google.com`'
tracert_timeout: 'The route broke off partway; the destination isn''t answering requests.'
pathping_note: 'The Lost/Sent column shows at which hop packets get lost.'
dns_empty: 'The DNS cache is empty. Run `ping google.com` once and try again.'
ipconfig_released: 'The IP was released, and the computer is no longer connected to the network. Get a new IP with `ipconfig /renew`.'
ipconfig_renewed: 'A new IP was received from the router (DHCP).'
nslookup_none: 'DNS doesn''t know this name. Check the spelling of the address.'
nslookup_interactive: 'nslookup interactive mode: type a domain name, or `exit` to leave.'
netstat_none: 'There are no active connections. To see listening ports, use `netstat -a`.'

# --- disk & repair ---
format_warn: '⚠ `format` erases all data on a drive. Never try it on a real computer. Here, only a virtual drive is erased.'
format_drive: 'Give the drive letter, like `format E: /fs:ntfs /q`'
format_system: 'Windows is running from this drive, so it can''t be formatted.'
format_done: 'Virtual drive {drive}: is now empty. Use “Reset” in the simulator to bring everything back.'
chkdsk_scheduled: 'The drive Windows is on is in use, so the check will run after a restart.'
chkdsk_found: 'Errors were found but not fixed. `chkdsk /f` repairs them.'
sfc_offline: 'In the Recovery Environment you have to give the Windows path: `sfc /scannow /offbootdir=C:\ /offwindir=C:\Windows`'
sfc_repaired: 'Corrupted system files were repaired. A restart is recommended.'
dism_usage: 'Common form: `dism /online /cleanup-image /restorehealth`'
dism_offline: 'DISM needs the internet (Windows Update) to repair. Check your connection.'
diskpart_warn: '⚠ DiskPart can wipe an entire disk in an instant. Here, only virtual disks are changed. Always use `list disk` and `select disk` first to make sure the right disk is selected.'
diskpart_cleaned: '⚠ Disk {n} was completely wiped; all partitions and data are gone. Next: `create partition primary`, `format fs=ntfs quick`, `assign`'
diskpart_protect: 'Windows protects the system disk and partition.'
diskpart_help: 'For a list of commands, type `help`. To leave: `exit`'
bootrec_mbr: 'The MBR (the first part of the disk, which starts the boot) was rewritten.'
bootrec_fixboot: 'This error is common on Windows 10/11. On UEFI systems, use `bcdboot C:\Windows` instead.'
bcdboot_path: 'Give the correct Windows path, for example `bcdboot C:\Windows`'
bcdedit_change: '⚠ Changing the BCD can stop Windows from booting. In the simulator, only `bcdedit /enum` is enabled.'
timeout_cap: 'In the simulator, the maximum wait is 10 seconds.'
