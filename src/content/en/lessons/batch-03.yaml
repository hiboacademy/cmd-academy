    - kind: mcq
      q: 'Which sign keeps the old content of the file?'
      options: ['>>', '>', '<', '|']
      answer: 0
      code_options: true
      explain: '`>>` = Append.'
    - kind: order
      q: 'Put the commands in order to create the file `todo.txt` with the lines “Buy milk” and “Call Ali”.'
      items: ['echo Buy milk > todo.txt', 'echo Call Ali >> todo.txt', 'type todo.txt']
      explain: 'First create it with `>`, then add with `>>`, and finally look at it.'
  recap: '`>` replaces, `>>` adds.'

- n: 30
  term: '2>'
  fullForm: 'stdout (1) · stderr (2)'
  difficulty: 2
  objective: 'Save or hide error messages separately from the normal output.'
  summary: 'CMD has two output streams: number 1 is the normal output (stdout) and number 2 is the error messages (stderr). `2>` sends only the error messages to a file.'
  meaning: '`>` is the same as `1>`. `2>nul` hides errors. `2>&1` means “send the errors to the same place as the normal output”.'
  usage: 'Logging errors to a separate file, hiding an unimportant error message, saving everything in one file.'
  syntax: "command 2> errors.txt\ncommand > all.txt 2>&1\ncommand 2>nul"
  demo:
    start: 'C:\Users\Student\Desktop'
    cmds: ['type missing.txt', 'type missing.txt 2> error.txt', 'type error.txt', 'type missing.txt 2>nul']
  examples:
    - c: 'type missing.txt 2> error.txt'
      d: 'The error message goes to a file instead of the screen.'
    - c: 'dir C:\nothing 2>nul'
      d: 'Hide the error.'
    - c: 'dir Documents nothing > all.txt 2>&1'
      d: 'Both the output and the error in one file.'
    - c: 'type menu.txt > out.txt 2> err.txt'
      d: 'Normal output and errors in two separate files.'
  mistakes:
    - 'A space between 2 and `>`: `2 >` means the argument “2” followed by `>`; it must be `2>`.'
    - 'Writing `2>&1` before `>`: the order matters; first `> file`, then `2>&1`.'
  tip: '`>nul 2>&1` means “show nothing at all”; it is very common in batch files.'
  practice:
    - id: P30a
      start: 'C:\Users\Student\Desktop'
      task: 'The command `type missing.txt` gives an error. Run it so that the error message is saved in the file `error.txt`.'
      checks: [{type: fileContains, path: 'C:\Users\Student\Desktop\error.txt', value: 'cannot find'}, {type: usedOp, value: '2>'}]
      hints:
        - 'The error message comes out of stream number 2 (stderr), not the normal stream. A plain `>` only catches stream 1, so write the number 2 before `>`.'
        - 'Three parts: the command that gives the error (`type missing.txt`), the error redirect sign (`2` stuck to `>`), and the target file (`error.txt`).'
      answer: 'type missing.txt 2> error.txt'
      explain: '`type missing.txt` gives a “file not found” error, and `2>` saves exactly that error message (stream 2) in `error.txt` instead of on the screen.'
    - id: P30b
      start: 'C:\Users\Student'
      task: 'Run the command `dir Documents\nothing` and save both the normal output and the error in the file `all.txt`.'
      checks: [{type: fileContains, path: 'C:\Users\Student\all.txt', value: ['Volume', 'File Not Found']}, {type: usedOp, value: '2>&1'}]
      hints:
        - 'You have to send both streams to one file: first send the normal output to the file with `>`, then say that the error stream (2) should go to the same place as stream 1.'
        - 'In order: the command (`dir Documents\nothing`), then `>` and the file name `all.txt`, and finally the part “send errors to stream 1”: `2>` and then `&1`.'
      answer: 'dir Documents\nothing > all.txt 2>&1'
      explain: '`> all.txt` sends the normal output to the file, and `2>&1` means “send stream 2 (errors) to the same place as stream 1”; so both are saved in `all.txt`.'
  quiz:
    - kind: mcq
      q: 'What is the stream number for error messages in CMD?'
      options: ['2', '1', '0', '3']
      answer: 0
      explain: '0 is input, 1 is normal output, 2 is errors.'
    - kind: predict
      q: 'The file `x.txt` does not exist. What do you see on the screen?'
      code: 'type x.txt 2>nul'
      options: ['Nothing at all', 'The system cannot find the file specified.', 'x.txt', 'nul']
      answer: 0
      explain: 'The error message went to `nul`.'
    - kind: fix
      q: 'The user wants both the output and the errors to go to `log.txt`. What is wrong?'
      code: 'dir C:\nothing 2>&1 > log.txt'
      options: ['`2>&1` must come after `> log.txt`', 'You have to write `>>`', '`2>&1` does not exist', 'You have to write `1>&2`']
      answer: 0
      explain: 'Correct: `dir C:\nothing > log.txt 2>&1`'
  recap: '1 = output, 2 = errors. `2>` sends errors to a file, `2>nul` hides them, `> file 2>&1` puts everything in one file.'

- n: 31
  term: '&   &&   ||'
  fullForm: 'Command chaining'
  difficulty: 2
  objective: 'Run several commands on one line and make the second command depend on whether the first one succeeded or failed.'
  summary: '`&` always runs the second command. `&&` runs it only if the first one succeeded. `||` runs it only if the first one failed.'
  meaning: 'Every command has an exit code after it runs: zero means success. `&&` and `||` check exactly that (lesson 62).'
  usage: '`mkdir X && cd X` (if it was created, go into it), `type file || echo not found` (a friendly message instead of an error).'
  syntax: "cmd1 & cmd2\ncmd1 && cmd2\ncmd1 || cmd2"
  demo:
    start: 'C:\Users\Student'
    cmds: ['mkdir Shop && cd Shop', 'type nofile.txt || echo File not found', 'echo One & echo Two']
  examples:
    - c: 'mkdir Shop && cd Shop'
      d: 'Go into the folder only if creating it worked.'
    - c: 'type a.txt || echo a.txt is missing'
      expectError: true
      d: 'If the file is missing, show your own message.'
    - c: 'cd Documents & dir /b'
      d: 'Two commands in a row, with no condition.'
    - c: 'copy a.txt E:\ && echo OK || echo FAILED'
      expectError: true
      d: 'Report the result of the job in one word.'
  mistakes:
    - 'Confusing `|` (pipe, lesson 33) with `||`.'
    - 'Using `&` when the second command depends on the first: if `cd` fails, `del *.*` runs in the wrong folder! `&&` is safer here.'
  tip: 'Safety rule: before dangerous commands, use `&&` so they only run if the previous step succeeded.'
  restaurant: '`&` means “bring the starter and then the main course”. `&&` means “if you have pizza, bring a soda too”. `||` means “if you have no pizza, bring pasta”.'
  practice:
    - id: P31a
      start: 'C:\Users\Student'
      task: 'On one line, create the folder `Shop` and go into it only if it was created.'
      checks: [{type: cwd, value: 'C:\Users\Student\Shop'}, {type: usedOp, value: '&&'}]
      hints:
        - 'You can join two commands on one line. You need a sign that runs the second command only if the first one succeeded.'
        - 'Three parts: the first command (`mkdir` + the name Shop), the “only if it succeeded” sign (two `&`), the second command (`cd` + the name Shop).'
      answer: 'mkdir Shop && cd Shop'
      explain: '`mkdir Shop` creates the folder, and `&&` runs `cd Shop` only if that worked; if creating it had failed, you would not go into the folder.'
    - id: P31b
      start: 'C:\Users\Student'
      task: 'On one line, show the file `nofile.txt`, and if that fails, print the message `File not found`.'
      checks: [{type: lastOutputIncludes, value: 'File not found'}, {type: usedOp, value: '||'}]
      hints:
        - 'This time the second command should run only if the first one failed. Its sign is two vertical bars (`||`).'
        - 'Three parts: the first command (`type` + the file name nofile.txt), the “only if it failed” sign (`||`), the second command (`echo` + the message File not found).'
      answer: 'type nofile.txt || echo File not found'
      explain: '`type nofile.txt` fails because the file does not exist, and in that case `||` runs `echo File not found` so your own message is printed.'
  quiz:
    - kind: predict
      q: 'The file `a.txt` does not exist. What is printed?'
      code: 'type a.txt && echo YES || echo NO'
      options: ['An error message and then NO', 'YES', 'YES and NO', 'Only an error message']
      answer: 0
      explain: '`type` failed, so `echo YES` did not run and `|| echo NO` did.'
    - kind: mcq
      q: 'Which sign always runs the second command?'
      options: ['&', '&&', '||', '|']
      answer: 0
      code_options: true
      explain: '`&` has no condition.'
    - kind: tf
      q: 'In `mkdir X && cd X`, if the folder X already exists, `cd X` does not run.'
      answer: true
      explain: '`mkdir` gave an error (already exists), so `&&` did not run the second command.'
  recap: '`&` always, `&&` if it succeeded, `||` if it failed. Use `&&` before dangerous jobs.'

