  meaning: 'Every command has two kinds of output: normal output (stdout) and error messages (stderr). `>` only sends the normal output to the file.'
  usage: 'Saving a list of files, creating a text file with `echo`, saving a report of system information.'
  syntax: 'command > file'
  warning: '`>` completely erases the old content of the file. To add to the end of a file, use `>>` (next lesson).'
  demo:
    start: 'C:\Users\Student\Desktop'
    cmds: ['echo Hello CMD > hello.txt', 'type hello.txt', 'dir ..\Documents /b > list.txt', 'type list.txt']
  examples:
    - c: 'echo Hello > hello.txt'
      d: 'Create a file with one line of text.'
    - c: 'dir /b > files.txt'
      d: 'Save a list of files.'
    - c: 'ipconfig > network.txt'
      d: 'Save network information for later.'
  mistakes:
    - 'Using `>` on an important file: its content is erased.'
    - 'Expecting to see the output on the screen: with `>`, nothing is shown.'
  tip: 'Throw the output away with `>nul`: `copy a.txt b.txt >nul` does not show the “copied” message.'
  restaurant: 'Instead of the cook calling out the order loudly, they write it on a slip of paper and put it in the box.'
  practice:
    - id: P28a
      start: 'C:\Users\Student\Desktop'
      task: 'Create a file called `hello.txt` that contains `Hello CMD`.'
      checks: [{type: fileContains, path: 'C:\Users\Student\Desktop\hello.txt', value: 'Hello CMD'}]
      hints:
        - '`echo` prints text. With the `>` sign you can send the output to a file instead of the screen; if the file does not exist, it is created.'
        - 'Three parts, in order: a command that produces output (`echo` + the text Hello CMD), the redirect sign (`>`), and the name of the target file (`hello.txt`).'
      answer: 'echo Hello CMD > hello.txt'
      explain: '`echo Hello CMD` produces the text, and `>` writes it to the file `hello.txt` instead of the screen; the file is created if it does not exist.'
