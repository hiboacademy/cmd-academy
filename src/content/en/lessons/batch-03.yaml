      checks: [{type: fileContains, path: 'C:\Users\Student\Desktop\log.txt', value: ['Day 1', 'Day 2']}]
      hints:
        - '`>` rewrites the file from scratch and the old line is erased. To add to the end of the file, use its double-sign version (`>>`).'
        - 'Three parts: the output command (`echo` + the text Day 2), the append sign (two `>` in a row), the file name (`log.txt`).'
      answer: 'echo Day 2 >> log.txt'
      explain: '`echo Day 2` produces the text and `>>` adds it to the end of `log.txt`; unlike `>`, the line `Day 1` is not erased.'
    - id: P29b
      start: 'C:\Users\Student\Desktop'
      task: 'Create a file called `names.txt` with two lines: `Ali` on the first line and `Sara` on the second.'
      multi: true
      checks: [{type: fileContains, path: 'C:\Users\Student\Desktop\names.txt', value: ['Ali', 'Sara']}, {type: fileLines, path: 'C:\Users\Student\Desktop\names.txt', value: 2}]
      hints:
        - 'You need two `echo` commands. The first must create the file (with `>`) and the second must add a line to its end (with `>>`).'
        - 'Line 1: `echo` + Ali, then `>`, then `names.txt`. Line 2: `echo` + Sara, then `>>`, then the same `names.txt`. If the second line also uses `>`, Ali is erased.'
      answer: ['echo Ali > names.txt', 'echo Sara >> names.txt']
      explain: 'The first line creates the file `names.txt` with `Ali` using `>`, and the second line adds `Sara` on the next line using `>>`; so the file has two lines.'
  quiz:
    - kind: predict
      q: 'After these commands, how many lines does `a.txt` have?'
      code: "echo 1 > a.txt\necho 2 >> a.txt\necho 3 >> a.txt"
