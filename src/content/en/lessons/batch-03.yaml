      hints:
        - 'You can save the output of any command to a file with `>`. First write the command that lists Documents, then send its output to a file.'
        - 'Three parts: the list command (`dir` + the folder name Documents), the `>` sign, the name of the target file (`list.txt`). You will not see anything on the screen; it all goes into the file.'
      answer: 'dir Documents > list.txt'
      explain: '`dir Documents` creates the folder listing, and `>` saves it in `list.txt` (in the current directory) instead of showing it on the screen.'
  quiz:
    - kind: predict
      q: 'After these two commands, what does `a.txt` contain?'
      code: "echo One > a.txt\necho Two > a.txt"
