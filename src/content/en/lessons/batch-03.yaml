  recap: '`command > file` = write the output to a file (replacing it). `>nul` = throw the output away.'

- n: 29
  term: '>>'
  fullForm: 'Redirect output (append)'
  difficulty: 2
  objective: 'Add to the end of a file without erasing its old content.'
  summary: '`>>` adds the output of a command to the end of a file. If the file does not exist, it is created.'
  meaning: 'The main difference: `>` = overwrite (replace), `>>` = append (add).'
  usage: 'Creating a log, writing several lines to one file, collecting the reports of several commands.'
  syntax: 'command >> file'
  demo:
    start: 'C:\Users\Student\Desktop'
    cmds: ['echo Day 1: learned dir > log.txt', 'echo Day 2: learned copy >> log.txt', 'echo Day 3: learned >> >> log.txt', 'type log.txt']
  examples:
    - c: 'echo Ali >> guests.txt'
      d: 'Add a name to the end of the list.'
    - c: 'echo %date% %time% >> log.txt'
      d: 'Record the time in a log (variables come in lesson 46).'
    - c: 'dir D:\Backup >> report.txt'
      d: 'Add the listing of another folder to the report.'
  mistakes:
    - 'Using `>` in the second command and losing the first line.'
    - 'A space between the two signs: `> >` is wrong; it must be `>>`.'
  tip: 'A common pattern: the first line with `>` (a fresh file), the rest with `>>`.'
  daily: '`>` is like writing on a fresh sheet of paper; `>>` is like writing below the earlier lines on the same sheet.'
  practice:
    - id: P29a
      start: 'C:\Users\Student\Desktop'
      files: [{path: 'C:\Users\Student\Desktop\log.txt', content: "Day 1\n"}]
