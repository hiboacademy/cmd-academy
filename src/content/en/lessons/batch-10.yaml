- n: 95
  term: DISM
  fullForm: 'Deployment Image Servicing and Management'
  difficulty: 3
  objective: 'Use DISM to fix the Windows repair source (Component Store) and know the right order of DISM and SFC.'
  summary: '`sfc` repairs files from an internal backup copy. If that backup itself is damaged, DISM repairs it with the help of Windows Update.'
  meaning: 'Three steps: `/checkhealth` (fast, status only), `/scanhealth` (full scan), `/restorehealth` (repair, needs internet). Recommended order when sfc couldn''t repair: first `dism ... /restorehealth`, then `sfc /scannow` again.'
  usage: 'Deep Windows damage, failed updates, when sfc doesn''t succeed.'
  syntax: "dism /online /cleanup-image /checkhealth\ndism /online /cleanup-image /scanhealth\ndism /online /cleanup-image /restorehealth"
  demo:
    admin: true
    setup: {storeCorrupt: true}
    cmds: ['dism /online /cleanup-image /checkhealth', 'dism /online /cleanup-image /restorehealth']
  examples:
    - c: 'dism /online /cleanup-image /checkhealth'
      d: 'A quick check.'
    - c: 'dism /online /cleanup-image /restorehealth'
      d: 'Repair (internet required).'
  mistakes:
    - 'Running restorehealth without internet and getting the error `0x800f081f`.'
    - 'Leaving out `/online` or `/cleanup-image`.'
  tip: 'restorehealth may sit at one percentage for a while; be patient.'
  practice:
    - id: P95a
      start: 'C:\Windows\System32'
      admin: true
      setup: {storeCorrupt: true}
      task: 'With DISM, first quickly check the status of the Component Store, then repair it.'
      multi: true
      checks: [{type: switch, value: '/checkhealth', cmd: dism, anyRun: true}, {type: lastOutputIncludes, value: 'restore operation completed'}]
      hints: ['Do two things in a row with `dism`: first a quick status check with `/checkhealth`, then a repair with `/restorehealth`. Both commands refer to the running Windows (`/online`) and the system image (`/cleanup-image`).', 'Each command has three fixed parts: `dism` → `/online` → `/cleanup-image`, plus a last part that differs: `/checkhealth` in the first command and `/restorehealth` in the second.']
      answer: ['dism /online /cleanup-image /checkhealth', 'dism /online /cleanup-image /restorehealth']
      explain: '`/online` means the Windows that is running right now, and `/cleanup-image` means working on the system image. `/checkhealth` just shows the status quickly, and `/restorehealth` repairs the repair source (Component Store) with the help of Windows Update.'
  quiz:
    - kind: order
      q: 'sfc said it couldn''t repair all files. Put the steps in order.'
      items: ['dism /online /cleanup-image /restorehealth', 'sfc /scannow', 'Restart']
      explain: 'First fix the repair source, then sfc, then restart.'
    - kind: mcq
      q: 'Which DISM option just shows the status quickly?'
      options: ['/checkhealth', '/restorehealth', '/scanhealth', '/scannow']
