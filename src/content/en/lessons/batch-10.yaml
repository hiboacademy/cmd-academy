- n: 99
  term: 'Troubleshooting'
  fullForm: 'A basic Windows troubleshooting workflow'
  difficulty: 3
  objective: 'Have a systematic process for troubleshooting the most common Windows problems.'
  summary: 'Good troubleshooting isn''t guessing: define the problem precisely, gather information, start with the simplest cause, make one change at a time and check the result.'
  meaning: 'The big picture: slowness → `tasklist` (memory), `taskkill` for a frozen program. Internet → the process from lesson 61. Printer → `sc query spooler` and restart the service. System errors → `dism` and `sfc`. Disk errors → `chkdsk`. Windows won''t start → WinRE, rescue files, `bootrec`.'
  usage: 'Tech support for yourself, your family or your workplace.'
  syntax: "tasklist /fi \"memusage gt 100000\"\nsc query spooler\nipconfig & ping 8.8.8.8\nsfc /scannow"
  demo:
    admin: true
    cmds: ['tasklist /fi "status eq not responding"', 'sc query spooler | find "STATE"', 'ping -n 1 8.8.8.8']
  examples:
    - c: 'tasklist /fi "status eq not responding"'
      d: 'Frozen programs.'
    - c: 'systeminfo | find "Boot Time"'
      d: 'Has the computer been restarted recently?'
    - c: 'dir C:\ | find "bytes free"'
      d: 'Free space on C:.'
  mistakes:
    - 'Changing several things at once; then you don''t know which one fixed the problem.'
    - 'Going straight to heavy tools (format, reinstalling).'
  tip: 'Write down everything you did (even with `>>` into a file); if the problem comes back, you know where to start.'
  practice:
    - id: P99a
      start: 'C:\Windows\System32'
      admin: true
      task: 'A user says: “The computer is slow and the printer won''t print.” Find and close the program that isn''t responding, and restart the `Spooler` service.'
      multi: true
      checks: [{type: procGone, value: 'Spotify.exe'}, {type: serviceState, name: Spooler, value: RUNNING}, {type: any, of: [{type: argIncludes, cmd: net, value: 'stop'}, {type: argIncludes, cmd: sc, value: 'stop'}]}, {type: anyCmd, value: tasklist}]
      hints: ['Solve the two problems one by one: 1) use `tasklist` with the filter `/fi` to find the program that isn''t responding (status not responding) and close it with `taskkill`. 2) stop the print service (`Spooler`) with `net` and start it again.', 'The order: `tasklist /fi` with the filter `"status eq not responding"` → read the program name in the output → `taskkill /im` + that program''s name + `/f` → `net stop spooler` → `net start spooler`.']
      answer: ['tasklist /fi "status eq not responding"', 'taskkill /im Spotify.exe /f', 'net stop spooler', 'net start spooler']
      explain: '`tasklist /fi "status eq not responding"` shows only frozen programs (here `Spotify.exe`), and `taskkill /im Spotify.exe /f` forces it to close. `net stop spooler` followed by `net start spooler` restarts the print service so the stuck queue is cleared.'
  quiz:
    - kind: order
      q: 'Put the general troubleshooting process in order.'
      items: ['Define the problem precisely', 'Gather information', 'Try the simplest cause', 'Check the result and write it down']
      explain: 'Define → gather information → simple test → check.'
    - kind: mcq
      q: 'The printer won''t print and the print queue is stuck. What''s a good first command?'
      options: ['sc query spooler', 'format C:', 'bootrec /fixmbr', 'diskpart']
      answer: 0
      code_options: true
      explain: 'Check the status of the print service.'
    - kind: tf
      q: 'It''s best to make only one change at each step.'
      answer: true
      explain: 'So you know which change fixed the problem.'
  recap: 'Define the problem → gather information → simplest cause → one change at a time → check and write it down.'

- n: 100
  term: 'toolbox.bat'
  fullForm: 'Final project'
  difficulty: 3
  objective: 'Combine everything you''ve learned into one complete tool with a menu.'
  summary: 'The final project is a “toolbox”: a menu with `choice` that shows system information, backs up Documents, deletes temporary files and exits.'
  meaning: 'This project uses variables, `choice` and `if errorlevel`, labels and `goto`, `call :function`, `xcopy`, `del` with a wildcard, `>>` for the log and `if exist`. Write and test each part separately, then put them together.'
  usage: 'A real tool you can keep on your own computer and extend.'
  syntax: ":menu\nchoice /c 1234 /m \"Choose\"\nif errorlevel 4 goto end\n...\ncall :log \"message\""
  demo:
    start: 'C:\Users\Student\Desktop'
    inputs: ['1', '4']
    files: [{path: 'C:\Users\Student\Desktop\toolbox.bat', content: "@echo off\ntitle CMD Academy Toolbox\nset \"log=%USERPROFILE%\\Desktop\\toolbox.log\"\n:menu\necho.\necho ===== TOOLBOX =====\necho 1. System info\necho 2. Backup Documents\necho 3. Clean temp files\necho 4. Quit\nchoice /c 1234 /m \"Choose\"\nif errorlevel 4 goto end\nif errorlevel 3 goto clean\nif errorlevel 2 goto backup\n:info\necho Computer: %COMPUTERNAME%   User: %USERNAME%\nipconfig | find \"IPv4\"\ncall :log \"info shown\"\ngoto menu\n:backup\nxcopy \"%USERPROFILE%\\Documents\" \"D:\\Backup\\Documents\" /s /i /y /q\ncall :log \"backup done\"\ngoto menu\n:clean\nif exist \"%TEMP%\\*.tmp\" del /q \"%TEMP%\\*.tmp\"\necho Temp files cleaned.\ncall :log \"temp cleaned\"\ngoto menu\n:end\necho Bye!\ngoto :eof\n\n:log\necho %DATE% %TIME% - %~1 >> \"%log%\"\nexit /b\n"}]
    cmds: ['toolbox.bat']
  examples:
    - c: 'call :log "backup done"'
      d: 'A function for logging.'
      noTry: true
    - c: 'title CMD Academy Toolbox'
      d: 'The window title.'
  mistakes:
    - 'Writing everything at once and then not being able to find the error; build it step by step.'
    - 'Forgetting `goto menu` at the end of each section.'
  tip: 'When you''re done, add a new option of your own, for example “5. Ping Google”.'
  practice:
    - id: P100a
      batch: {file: 'toolbox.bat', starter: "@echo off\n:menu\necho 1. System info\necho 2. Backup Documents\necho 3. Clean temp files\necho 4. Quit\nchoice /c 1234 /m \"Choose\"\n"}
      inputs: ['1', '2', '3', '4']
