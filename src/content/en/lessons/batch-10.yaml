      admin: true
      inputs: ['list disk', 'list volume', 'exit']
      task: 'Enter diskpart, view the list of disks and volumes, and exit. (Don''t change anything.)'
      checks: [{type: anyCmd, value: diskpart}, {type: dpUsed, value: 'list disk'}, {type: dpUsed, value: 'list vol'}, {type: driveExists, value: E}]
      hints: ['First enter the diskpart environment with `diskpart`. Inside it the prompt changes to `DISKPART>` and you can use the read-only `list` commands.', 'At the `DISKPART>` prompt, in order: `list disk` (list of disks) → `list volume` (list of volumes) → `exit` (leave). Don''t use any `select` or `clean` command.']
      answer: 'diskpart'
      explain: '`diskpart` opens the disk management environment; `list disk` and `list volume` only show disks and volumes and don''t change anything. `exit` leaves diskpart and returns to CMD.'
    - id: P98b
      start: 'C:\Windows\System32'
      admin: true
      inputs: ['list disk', 'select disk 1', 'clean', 'create partition primary', 'format fs=ntfs quick label=Backup', 'assign letter=F', 'exit']
      task: 'The USB stick (disk 1, 14GB) is broken. Use diskpart to erase it completely, create a partition, format it with NTFS and the name `Backup`, and give it the letter `F`.'
      checks: [{type: driveExists, value: F}, {type: driveLabel, drive: F, value: Backup}, {type: dpUsed, value: 'select disk 1'}]
      hints: ['After entering with `diskpart`, first look at the disks and make sure which one is the USB stick (14GB). Then select that disk, erase it, partition it, format it and give it a letter.', 'The order at `DISKPART>`: `list disk` → `select disk 1` → `clean` → `create partition primary` → `format` with `fs=ntfs`, `quick` and `label=Backup` → `assign letter=F` → `exit`.']
      answer: 'diskpart'
      explain: '`select disk 1` selects the USB stick, `clean` erases everything on it, and `create partition primary` creates a partition. `format fs=ntfs quick label=Backup` prepares it with NTFS and the name `Backup`, and `assign letter=F` gives it the letter `F` so it shows up in File Explorer.'
  quiz:
