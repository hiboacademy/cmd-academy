    - id: P96b
      mode: winre
      task: 'Before any repair, rescue the important file `C:\Users\Student\Documents\menu.txt` to the USB stick (`E:\`).'
      checks: [{type: fileExists, path: 'E:\menu.txt'}]
      hints: ['Use `copy` to rescue the file. Since you''re on drive `X:`, write the source with its full path (starting with `C:\`) and make the target the root of the USB stick.', 'The parts: `copy` → source `C:\Users\Student\Documents\menu.txt` → a space → target `E:\`.']
      answer: 'copy C:\Users\Student\Documents\menu.txt E:\'
      explain: '`copy` takes the file from the full source path and puts a copy in the root of the USB stick (`E:\`). The full path is needed because in WinRE the current drive is `X:`, not `C:`.'
