# Lessons 88–100 · Chapter 12: real projects and Windows repair

- n: 88
  term: 'organize.bat'
  fullForm: 'File management script'
  difficulty: 3
  objective: 'Write a real script that sorts the files in a folder into separate folders by file type.'
  summary: 'The Downloads folder is usually a mess. This script creates a folder for each file type and moves the files into it.'
  meaning: 'The pattern: go to the folder with `cd /d`, create folders with `if not exist ... mkdir`, and move files with `move` and a wildcard. `>nul` hides extra messages, and `if exist *.pdf` prevents the “file not found” error.'
  usage: 'Tidy up Downloads, the Desktop or your photo folder with one click.'
  syntax: "cd /d \"%USERPROFILE%\\Downloads\"\nif not exist PDF mkdir PDF\nif exist *.pdf move *.pdf PDF >nul"
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\organize.bat', content: "@echo off\nrem Sort Downloads into folders by type\ncd /d \"%USERPROFILE%\\Downloads\"\nfor %%t in (PDF Archives Programs) do if not exist %%t mkdir %%t\nif exist *.pdf move *.pdf PDF >nul\nif exist *.zip move *.zip Archives >nul\nif exist *.exe move *.exe Programs >nul\necho Downloads organized:\ntree /f\n"}]
    cmds: ['organize.bat']
  examples:
    - c: 'if exist *.pdf move *.pdf PDF >nul'
      d: 'Moves files only if there are any.'
      noTry: true
    - c: 'for %%t in (PDF Archives) do if not exist %%t mkdir %%t'
      d: 'Creates several folders with one loop.'
      noTry: true
  mistakes:
    - 'Forgetting `cd /d`: the script moves files around in the wrong folder.'
    - 'Not testing the script on a test copy before running it on the real folder.'
  tip: 'First run the script with `echo move ...` instead of `move ...` to see what it would do, then remove the `echo`.'
  practice:
    - id: P88a
      batch: {file: 'organize.bat', starter: "@echo off\ncd /d \"%USERPROFILE%\\Downloads\"\n"}
      task: 'Complete the script so that in Downloads, `.pdf` files are moved to the `PDF` folder, `.zip` files to `Archives` and `.exe` files to `Programs` (creating the folders if needed).'
      checks: [{type: ranBatch}, {type: fileExists, path: 'C:\Users\Student\Downloads\PDF\invoice.pdf'}, {type: fileExists, path: 'C:\Users\Student\Downloads\Archives\photos.zip'}, {type: fileExists, path: 'C:\Users\Student\Downloads\Programs\setup.exe'}]
      hints: ['Each file type needs two steps: if the target folder doesn''t exist, create it with `if not exist ... mkdir`, then move the files into it with `move` and a wildcard (like `*.pdf`).', 'Repeat this pattern for three types: first create the folders `PDF`, `Archives` and `Programs`; then move `*.pdf` to `PDF`, `*.zip` to `Archives` and `*.exe` to `Programs` (with `>nul` for clean output). At the end you can add `echo Done`.']
      answer: ['@echo off', 'cd /d "%USERPROFILE%\Downloads"', 'if not exist PDF mkdir PDF', 'if not exist Archives mkdir Archives', 'if not exist Programs mkdir Programs', 'move *.pdf PDF >nul', 'move *.zip Archives >nul', 'move *.exe Programs >nul', 'echo Done']
      explain: '`cd /d` takes the script to Downloads, and `if not exist ... mkdir` creates each folder only when needed. Each `move` with a wildcard moves all files of one type into their folder, and `>nul` hides the extra messages.'
  quiz:
    - kind: mcq
      q: 'Why does the script start with `cd /d "%USERPROFILE%\Downloads"`?'
      options: ['To make sure it works in the right folder', 'To make it faster', 'Because move doesn''t work without it', 'To clear the screen']
      answer: 0
      explain: 'The script could be run from any folder.'
    - kind: tf
      q: 'Before running a file-moving script on the real folder, it''s better to test it on a test folder.'
      answer: true
      explain: 'Or put `echo` in front of the commands.'
    - kind: order
      q: 'Put the lines of this script in a logical order.'
      items: ['@echo off', 'cd /d "%USERPROFILE%\Downloads"', 'if not exist PDF mkdir PDF', 'move *.pdf PDF >nul', 'echo Done']
      explain: 'Setup → go to folder → create → move → report.'
  recap: 'Sorting script: `cd /d` → create folders with `if not exist` → `move` with a wildcard.'

- n: 89
  term: 'backup.bat'
  fullForm: 'Backup script'
  difficulty: 3
  objective: 'Write a reliable backup script: a dated target folder, copying, error checking and writing to a log.'
  summary: 'A good backup: source and target in variables, create the target if needed, copy with `xcopy` or `robocopy`, check ERRORLEVEL and write the result to a log file.'
  meaning: 'For a dated folder you use parts of `%DATE%`: `%DATE:~10,4%` is the year, `%DATE:~4,2%` the month, `%DATE:~7,2%` the day (with US date settings). `>>` appends the result of each run to the log.'
  usage: 'A daily backup of Documents to another drive or a USB stick.'
  syntax: "set \"src=%USERPROFILE%\\Documents\"\nset \"dest=D:\\Backup\\Docs\"\nxcopy \"%src%\" \"%dest%\" /s /i /y >nul\nif %errorlevel% equ 0 (echo OK >> log.txt)"
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\backup.bat', content: "@echo off\nset \"src=%USERPROFILE%\\Documents\"\nset \"stamp=%DATE:~10,4%-%DATE:~4,2%-%DATE:~7,2%\"\nset \"dest=D:\\Backup\\%stamp%\"\necho Backing up %src% to %dest% ...\nxcopy \"%src%\" \"%dest%\" /s /i /y /q\nif %errorlevel% equ 0 (\n  echo %DATE% %TIME% Backup OK >> D:\\Backup\\backup.log\n  echo Backup OK\n) else (\n  echo %DATE% %TIME% Backup FAILED >> D:\\Backup\\backup.log\n  echo Backup FAILED\n)\n"}]
    cmds: ['backup.bat', 'type D:\Backup\backup.log']
  examples:
    - c: 'set "stamp=%DATE:~10,4%-%DATE:~4,2%-%DATE:~7,2%"'
      d: 'The date in the form 2026-10-06.'
      noTry: true
    - c: 'robocopy "%src%" "%dest%" /e /r:1 /w:1'
      d: 'The robocopy version (a code below 8 = success).'
      noTry: true
  mistakes:
    - 'Not putting quotes around paths stored in variables.'
    - 'Checking robocopy''s ERRORLEVEL like xcopy''s (for robocopy, use `geq 8` to detect an error).'
  tip: 'Read the log after a few days; if you see a FAILED line, find out why.'
  practice:
    - id: P89a
      batch: {file: 'backup.bat', starter: "@echo off\nset \"src=%USERPROFILE%\\Documents\"\nset \"dest=D:\\Backup\\Docs\"\n"}
      task: 'Complete the script: it should copy Documents with all subfolders to `%dest%` and, if that succeeded, append the line `Backup OK` to the file `D:\Backup\backup.log`.'
      checks: [{type: ranBatch}, {type: fileExists, path: 'D:\Backup\Docs\Work\report.txt'}, {type: fileContains, path: 'D:\Backup\backup.log', value: 'Backup OK'}]
      hints: ['You need two steps: 1) copy Documents with subfolders using `xcopy` from `%src%` to `%dest%`. 2) check for success with `%errorlevel%` and append a line to the log with `>>`.', 'Line 1: `xcopy` → `"%src%"` → `"%dest%"` → the switches `/s` (subfolders), `/i` (the target is a folder) and `/y` (no questions). Line 2: `if %errorlevel% equ 0` → `echo Backup OK` → `>>` to `D:\Backup\backup.log`.']
      answer: ['@echo off', 'set "src=%USERPROFILE%\Documents"', 'set "dest=D:\Backup\Docs"', 'xcopy "%src%" "%dest%" /s /i /y >nul', 'if %errorlevel% equ 0 echo Backup OK >> D:\Backup\backup.log']
      explain: '`xcopy "%src%" "%dest%" /s /i /y` copies all of Documents with subfolders without asking. If the copy succeeds, `%errorlevel%` is zero, and `echo Backup OK >> D:\Backup\backup.log` appends a line to the end of the log.'
  quiz:
    - kind: predict
      q: 'If `%DATE%` is `Tue 10/06/2026`, what does this show?'
      code: 'echo %DATE:~10,4%'
      options: ['2026', '10/0', 'Tue ', '06/2']
      answer: 0
      code_options: true
      explain: 'Starting at position 10, four characters.'
    - kind: mcq
      q: 'Which symbol do you use to append the result of each backup to the log?'
      options: ['>>', '>', '|', '<']
      answer: 0
      code_options: true
      explain: '`>` wipes the previous log.'
    - kind: tf
      q: 'After robocopy, an ERRORLEVEL of 1 means the backup failed.'
      answer: false
      explain: 'For robocopy, anything below 8 means success.'
  recap: 'Backup = source and target variables + xcopy/robocopy + ERRORLEVEL check + `>>` to the log.'

- n: 90
  term: 'rename.bat'
  fullForm: 'Batch rename script'
  difficulty: 3
  objective: 'Rename lots of files at once with a script and a fixed pattern.'
  summary: 'With `for` over the files and `ren`, you can add a prefix or suffix to every file name, e.g. `beach.jpg` → `holiday_beach.jpg`.'
  meaning: 'Technical note: if you rename files inside `for %%f in (*.jpg)`, the loop may see a renamed file again. Safer: first get the list with `for /f ... in (''dir /b *.jpg'')`, then rename.'
  usage: 'Naming photos from a trip, adding a date to reports, making file names consistent.'
  syntax: "for /f \"delims=\" %%f in ('dir /b *.jpg') do ren \"%%f\" \"prefix_%%f\""
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\rename.bat', content: "@echo off\ncd /d \"%USERPROFILE%\\Pictures\"\nfor /f \"delims=\" %%f in ('dir /b *.jpg') do ren \"%%f\" \"holiday_%%f\"\ndir /b\n"}]
    cmds: ['rename.bat']
  examples:
    - c: 'ren *.txt *.bak'
      d: 'Without a script: changes the extension of all of them.'
      noTry: true
    - c: 'for /f "delims=" %%f in (''dir /b *.jpg'') do ren "%%f" "2026_%%f"'
      d: 'Adds a year prefix to all jpg files.'
      noTry: true
  mistakes:
    - 'Not putting quotes around `%%f`, which causes errors for names with spaces.'
    - 'Running the script twice and getting names like `holiday_holiday_beach.jpg`.'
  tip: 'Before the real run, replace `ren` with `echo ren` to see the new names.'
  practice:
    - id: P90a
      batch: {file: 'rename.bat', starter: "@echo off\ncd /d \"%USERPROFILE%\\Pictures\"\n"}
      task: 'Add the prefix `holiday_` to the beginning of the name of every `.jpg` file in Pictures (like `holiday_beach.jpg`). The file `logo.png` must not change.'
      checks: [{type: ranBatch}, {type: fileExists, path: 'C:\Users\Student\Pictures\holiday_beach.jpg'}, {type: fileExists, path: 'C:\Users\Student\Pictures\holiday_cat.jpg'}, {type: fileNotExists, path: 'C:\Users\Student\Pictures\beach.jpg'}, {type: fileExists, path: 'C:\Users\Student\Pictures\logo.png'}, {type: fileNotExists, path: 'C:\Users\Student\Pictures\holiday_holiday_beach.jpg'}]
      hints: ['First get a fixed list of the jpg files with `for /f` and the output of `dir /b *.jpg`, then in each round add the prefix `holiday_` to the file name with `ren`. This prevents files from being renamed twice.', 'The parts: `for /f "delims="` (the whole name, even with spaces) → `%%f` → `in` and the command in single quotes: `(''dir /b *.jpg'')` → `do ren` → the current name `"%%f"` → the new name = `holiday_` joined to `%%f`, in quotes.']
      answer: ['@echo off', 'cd /d "%USERPROFILE%\Pictures"', "for /f \"delims=\" %%f in ('dir /b *.jpg') do ren \"%%f\" \"holiday_%%f\""]
      explain: '`for /f` with `(''dir /b *.jpg'')` first gets the complete list of jpg files, so a renamed file doesn''t come up in the loop again. `ren "%%f" "holiday_%%f"` renames each file with the prefix, and `logo.png` isn''t touched because it isn''t a jpg.'
  quiz:
    - kind: predict
      q: 'What does this line do to the file `cat.jpg`?'
      code: 'ren "cat.jpg" "2026_cat.jpg"'
      options: ['2026_cat.jpg', 'cat_2026.jpg', '2026.jpg', 'An error']
      answer: 0
      code_options: true
      explain: 'The new name is exactly what you typed.'
    - kind: mcq
      q: 'Why is `for /f` with `dir /b` safer for renaming?'
      options: ['The file list is fixed before renaming starts', 'It''s faster', 'It also picks up hidden files', 'You don''t need quotes']
      answer: 0
      explain: 'A renamed file doesn''t come up in the loop again.'
    - kind: tf
      q: 'To see the result without really changing anything, you can put `echo` in front of `ren`.'
      answer: true
      explain: 'The command is only printed.'
  recap: 'Batch renaming: `for /f ... (''dir /b pattern'') do ren "%%f" "new_%%f"`. Test with `echo` first.'

- n: 91
  term: 'search.bat'
  fullForm: 'Search script'
  difficulty: 3
  objective: 'Write a tool that asks the user for a word and searches for it in all files of a folder.'
  summary: 'A combination of `set /p` to ask for the word, `findstr /s /i /m` to search and ERRORLEVEL for a “not found” message.'
  meaning: '`findstr /m` shows only the file names. An exit code of 1 means nothing was found. By checking whether the input is empty, the script doesn''t run for no reason.'
  usage: 'Quickly searching through notes, reports or the code of a project.'
  syntax: "set /p word=Search for: \nfindstr /s /i /m \"%word%\" *.txt\nif errorlevel 1 echo Nothing found."
  demo:
    start: 'C:\Users\Student\Desktop'
    inputs: ['sales']
    files: [{path: 'C:\Users\Student\Desktop\search.bat', content: "@echo off\nset /p word=Search for: \nif \"%word%\"==\"\" (echo Please type a word. & goto :eof)\ncd /d \"%USERPROFILE%\\Documents\"\necho Files that contain \"%word%\":\nfindstr /s /i /m \"%word%\" *.txt\nif errorlevel 1 echo Nothing found.\n"}]
    cmds: ['search.bat']
  examples:
    - c: 'findstr /s /i /m "%word%" *.txt'
      d: 'Names of the files that contain the word.'
      noTry: true
    - c: 'findstr /s /i /n "%word%" *.txt'
      d: 'Shows the line and its line number.'
      noTry: true
  mistakes:
    - 'Forgetting `/i`, so the word isn''t found when its capitalization differs.'
    - 'Searching in the wrong folder; use `cd /d` first.'
  tip: 'To search all kinds of text files, write `*.txt *.log *.bat`.'
  practice:
    - id: P91a
      batch: {file: 'search.bat', starter: "@echo off\ncd /d \"%USERPROFILE%\\Documents\"\n"}
      inputs: ['sales']
      task: 'Write a script that asks the user for a word and shows the names of all `.txt` files (including subfolders) that contain it; if nothing is found, it should say `Nothing found`. (Test it with the word `sales`.)'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\search.bat', value: ['set /p', 'findstr']}, {type: outputIncludes, value: 'report1.txt'}]
      hints: ['You need three steps: get the word from the user with `set /p`, search the `*.txt` files with `findstr`, and show a “not found” message with `if errorlevel`.', 'Line 1: `set /p word=` with a question text like `Search for: `. Line 2: `findstr` with the switches `/s` (subfolders), `/i` (ignore upper/lower case) and `/m` (file names only), then `"%word%"` and `*.txt`. Line 3: `if errorlevel 1` and `echo Nothing found`.']
      answer: ['@echo off', 'cd /d "%USERPROFILE%\Documents"', 'set /p word=Search for: ', 'findstr /s /i /m "%word%" *.txt', 'if errorlevel 1 echo Nothing found']
      explain: '`set /p` stores the user''s word in `word`, and `findstr /s /i /m "%word%" *.txt` shows the names of the files that contain it. If nothing is found, ERRORLEVEL is 1 and `Nothing found` is printed.'
  quiz:
    - kind: mcq
      q: 'Which findstr switch shows only the file names?'
      options: ['/m', '/n', '/s', '/i']
      answer: 0
      code_options: true
      explain: '`/m`'
    - kind: predict
      q: 'The user just pressed Enter (empty input). What happens with this line?'
      code: 'if "%word%"=="" (echo Please type a word. & goto :eof)'
      options: ['The message is printed and the script ends', 'All files are found', 'It shows an error', 'The script asks again']
      answer: 0
      explain: 'The empty input was caught.'
    - kind: tf
      q: 'An exit code of 1 after findstr means the word was not found.'
      answer: true
      explain: '0 = found.'
  recap: 'Search script: `set /p` → check for empty input → `findstr /s /i /m` → `if errorlevel 1`.'

- n: 92
  term: 'Automation'
  fullForm: 'Logs and scheduling'
  difficulty: 3
  objective: 'Write a script that records its work with timestamps in a log, and get to know scheduling and `shutdown`.'
  summary: 'Automation means a script works without you being there: it runs at a set time via Windows Task Scheduler and writes everything it did to a log with `%DATE% %TIME%`.'
  meaning: 'An automatic script must not contain `pause` or questions. `shutdown /s /t 3600` shuts the computer down one hour later, and `shutdown /a` cancels it. Scheduling in Windows is done with Task Scheduler or the `schtasks` command.'
  usage: 'Daily reports, automatically deleting temporary files, nightly backups, timed shutdowns.'
  syntax: "echo %DATE% %TIME% - message >> log.txt\nshutdown /s /t 3600\nshutdown /a"
  warning: 'On a real computer, `shutdown` destroys unsaved work. In the simulator nothing gets shut down.'
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\daily.bat', content: "@echo off\nset \"log=%USERPROFILE%\\Desktop\\activity.log\"\necho %DATE% %TIME% - daily check started >> \"%log%\"\nipconfig | find \"IPv4\" >> \"%log%\"\nif exist \"%TEMP%\\*.tmp\" del /q \"%TEMP%\\*.tmp\"\necho %DATE% %TIME% - temp files cleaned >> \"%log%\"\ntype \"%log%\"\n"}]
    cmds: ['daily.bat', 'shutdown /s /t 3600', 'shutdown /a']
  examples:
    - c: 'echo %DATE% %TIME% - done >> log.txt'
      d: 'One log line with a timestamp.'
      noTry: true
    - c: 'shutdown /r /t 60'
      d: 'Restart after one minute.'
    - c: 'shutdown /a'
      expectError: true
      d: 'Cancel.'
  mistakes:
    - 'Writing the log with `>` and wiping the history.'
    - 'Putting `pause` in an automatic script.'
  tip: 'In Task Scheduler, the option “Run whether user is logged on or not” is useful for nightly scripts.'
  practice:
    - id: P92a
      batch: {file: 'daily.bat', starter: "@echo off\n"}
      task: 'Write a script that appends two lines to the file `%USERPROFILE%\Desktop\activity.log`: the date and time with the text `check done`, and the IPv4 line from the ipconfig output.'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\activity.log', value: ['check done', '192.168.1.24']}, {type: fileContains, path: 'C:\Users\Student\Desktop\daily.bat', value: ['%date%', '>>']}]
      hints: ['To append a line to the end of a file, use `>>`. Build the first line with `echo` and the variables `%DATE%` and `%TIME%`, and the second from the output of `ipconfig`, filtered with `find`.', 'Line 1: `echo %DATE% %TIME% - check done` → `>>` → the log path in quotes. Line 2: `ipconfig` → `|` → `find "IPv4"` → `>>` → the same path `"%USERPROFILE%\Desktop\activity.log"`.']
      answer: ['@echo off', 'echo %DATE% %TIME% - check done >> "%USERPROFILE%\Desktop\activity.log"', 'ipconfig | find "IPv4" >> "%USERPROFILE%\Desktop\activity.log"']
      explain: '`>>` appends each line to the end of `activity.log` without wiping the history. The first line writes the date and time with the text `check done`, and in the second line `find "IPv4"` picks just the IPv4 address line out of the `ipconfig` output.'
    - id: P92b
      start: 'C:\Users\Student'
      task: 'Schedule a shutdown for one hour from now (3600 seconds) and cancel it right away.'
      multi: true
      checks: [{type: switch, value: '/s', cmd: shutdown, anyRun: true}, {type: switch, value: '/a', cmd: shutdown, anyRun: true}, {type: argIncludes, cmd: shutdown, value: '3600'}]
      hints: ['The `shutdown` command shuts down with the switch `/s` and takes the delay in seconds with `/t`. There''s also a separate switch to cancel a scheduled shutdown (Abort).', 'Two commands in a row: 1) `shutdown` + `/s` + `/t` + the number `3600` (one hour). 2) `shutdown` again, but with the switch `/a` to cancel.']
      answer: ['shutdown /s /t 3600', 'shutdown /a']
      explain: '`shutdown /s /t 3600` schedules a shutdown for 3600 seconds (one hour) from now, and `shutdown /a` (Abort) cancels it. In the simulator nothing really shuts down.'
  quiz:
    - kind: mcq
      q: 'Why must an automatic script not contain `pause`?'
      options: ['Nobody is there to press a key, so the script keeps waiting', 'pause is forbidden in Task Scheduler', 'It wipes the log', 'It slows things down']
      answer: 0
      explain: 'The script would wait forever.'
    - kind: type
      q: 'Restart the computer in 10 minutes.'
      accept: ['shutdown /r /t 600', 'shutdown -r -t 600', 'shutdown /t 600 /r']
      show: 'shutdown /r /t 600'
      explain: '600 seconds = 10 minutes.'
    - kind: tf
      q: '`shutdown /a` cancels a scheduled shutdown.'
      answer: true
      explain: 'Abort.'
  recap: 'Automation = a script without questions + a log with `%DATE% %TIME%` and `>>` + scheduling. `shutdown /s /t n` and `/a`.'

- n: 93
  term: chkdsk
  fullForm: 'File System · vol · Check Disk'
  difficulty: 3
  objective: 'Get to know file systems and check and repair a disk with chkdsk.'
  summary: 'A file system is the way files are stored on a disk: NTFS for Windows, FAT32 and exFAT for USB sticks. `vol` shows a drive''s name and serial number. `chkdsk` finds file system errors and repairs them with `/f`.'
  meaning: 'Without `/f`, `chkdsk` only reads (read-only). `/f` fixes errors, and `/r` also searches for bad sectors on the disk (slower). The drive Windows runs on (`C:`) is in use, so chkdsk offers to do the check after a restart. FAT32 does not accept files larger than 4GB.'
  usage: 'A USB stick or disk that shows errors, files that won''t open, after a sudden power cut.'
  syntax: "vol [drive:]\nchkdsk [drive:] [/f] [/r]"
  warning: '`chkdsk /r` can take hours on a large disk, and you must not turn the computer off in the middle. Back up important data before repairing.'
  demo:
    admin: true
    cmds: ['vol E:', 'chkdsk E:']
  examples:
    - c: 'vol'
      d: 'The name and serial number of the current drive.'
    - c: 'chkdsk E:'
      d: 'A read-only check of the USB stick.'
    - c: 'chkdsk E: /f'
      d: 'Check and repair.'
    - c: 'chkdsk C: /f'
      d: 'For C:, scheduled for after a restart.'
  mistakes:
    - 'Running chkdsk in a normal CMD window; it needs administrator rights.'
    - 'Pulling out the USB stick in the middle of chkdsk.'
  tip: 'For a new USB stick, exFAT works with both Windows and Mac and has no 4GB limit.'
  practice:
    - id: P93a
      start: 'C:\Windows\System32'
      admin: true
      task: 'Only check the USB stick (drive E), without repairing it.'
      checks: [{type: anyCmd, value: chkdsk}, {type: argIncludes, cmd: chkdsk, value: 'e:'}, {type: lastOutputIncludes, value: 'FAT32'}, {type: not, check: {type: switch, value: '/f', cmd: chkdsk, anyRun: true}}]
      hints: ['To check a drive''s file system, use `chkdsk`. Since we only want a check, no repair switch is needed.', 'The command has two parts: the command name `chkdsk` and then the drive letter with a colon (`E:`). Don''t write the switch `/f`.']
      answer: 'chkdsk E:'
      explain: 'Without `/f`, `chkdsk E:` only reads drive E and reports (read-only), so nothing changes. The output also shows its file system type (`FAT32`).'
    - id: P93b
      start: 'C:\Windows\System32'
      admin: true
      setup: {diskErrors: {E: true}}
      task: 'The USB stick has a file system error. Check and repair it.'
      checks: [{type: any, of: [{type: switch, value: '/f', cmd: chkdsk, anyRun: true}, {type: switch, value: '/r', cmd: chkdsk, anyRun: true}]}, {type: lastOutputIncludes, value: 'made corrections'}]
      hints: ['You need `chkdsk` again, but this time it should also fix the errors, so add the repair switch.', 'The parts: `chkdsk` → the drive letter `E:` → the repair switch `/f` (from the word fix).']
      answer: 'chkdsk E: /f'
      explain: '`chkdsk E:` checks the USB drive, and `/f` allows it to fix file system errors. The message `made corrections` means the repair was done.'
  quiz:
    - kind: mcq
      q: 'Which file system does not accept files larger than 4GB?'
      options: ['FAT32', 'NTFS', 'exFAT', 'None of them']
      answer: 0
      explain: 'That''s the FAT32 limit.'
    - kind: predict
      q: 'In an administrator CMD: `chkdsk C: /f`. What happens?'
      code: 'chkdsk C: /f'
      options: ['It offers to check after a restart', 'It repairs immediately', 'C: gets erased', 'An Access denied error']
      answer: 0
      explain: 'C: is in use.'
    - kind: tf
      q: 'Without `/f`, `chkdsk` doesn''t change anything.'
      answer: true
      explain: 'It only reads.'
