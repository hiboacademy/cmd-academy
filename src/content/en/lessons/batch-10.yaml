  meaning: 'Ways to get there: hold Shift while clicking Restart; Settings → System → Recovery → Advanced startup; or automatically after two failed boots. Then: Troubleshoot → Advanced options → Command Prompt. Here the current drive is `X:`, and the Windows drive letter may not be `C:`; find it with `dir C:\` and `dir D:\`.'
  usage: 'Windows won''t start, rescuing files before reinstalling, repairing the boot process.'
  syntax: "X:\\Windows\\System32>\ndir C:\\\ncopy C:\\Users\\...\\file E:\\"
  demo:
    mode: winre
    cmds: ['dir C:\ /b', 'whoami']
  examples:
    - c: 'dir C:\'
      d: 'Is Windows on C:?'
    - c: 'dir D:\'
      d: 'The drive letters may have shifted.'
    - c: 'notepad'
      d: 'In a real WinRE, the Open dialog in Notepad works like a simple File Explorer.'
      noTry: true
  mistakes:
    - 'Assuming Windows is always on `C:`.'
    - 'Starting a repair before rescuing important files.'
  tip: 'In the simulator, choose “Recovery” mode on the simulator page.'
  practice:
