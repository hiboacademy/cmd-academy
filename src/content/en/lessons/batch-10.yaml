- n: 97
  term: bootrec
  fullForm: 'bootrec · bcdboot'
  difficulty: 3
  objective: 'Repair boot problems (Windows won''t start) with the WinRE tools.'
  summary: '`bootrec` has four main jobs: `/scanos` finds Windows installations, `/rebuildbcd` rebuilds the boot list, `/fixmbr` and `/fixboot` rewrite the disk''s startup areas. `bcdboot C:\Windows` recreates the boot files from scratch.'
  meaning: 'The BCD (Boot Configuration Data) is a list that tells the computer where Windows is. On newer computers (UEFI), `bootrec /fixboot` often gives `Access is denied`, and `bcdboot` is the better way. These commands only exist in WinRE.'
  usage: 'Errors like “Boot device not found”, “BOOTMGR is missing”, or the computer booting straight into the BIOS.'
  syntax: "bootrec /scanos\nbootrec /rebuildbcd\nbootrec /fixmbr\nbcdboot C:\\Windows"
  warning: 'These commands rewrite vital areas of the disk. On a real computer, only use them when Windows won''t boot, and after making a backup.'
  demo:
    mode: winre
    inputs: ['Y']
    cmds: ['bootrec /scanos', 'bootrec /rebuildbcd', 'bootrec /fixboot', 'bcdboot C:\Windows']
  examples:
    - c: 'bootrec /scanos'
      d: 'Finds Windows installations.'
    - c: 'bootrec /rebuildbcd'
      d: 'Rebuilds the BCD (asks whether to add the installation).'
    - c: 'bcdboot C:\Windows'
      d: 'Creates the boot files; the main method on UEFI.'
  mistakes:
    - 'Running bootrec in normal Windows; it only exists in WinRE.'
    - 'Giving bcdboot the wrong path (if Windows is on D:, use `bcdboot D:\Windows`).'
  tip: 'The usual order: `/scanos` → `/rebuildbcd` → `bcdboot` if needed.'
  practice:
    - id: P97a
      mode: winre
      task: 'Windows won''t start. First, find all Windows installations on the disks.'
      checks: [{type: anyCmd, value: bootrec}, {type: lastOutputIncludes, value: 'Total identified Windows installations: 1'}]
      hints: ['The `bootrec` tool in WinRE is for repairing the boot process. The first step is just finding the installed Windows systems, with the “scan OS” option.', 'The parts: the command `bootrec` → the switch `/scanos` (scan = search, os = operating system).']
      answer: 'bootrec /scanos'
      explain: '`bootrec /scanos` searches all disks for Windows installations and reports how many there are. This step doesn''t change anything; it only shows where Windows is.'
    - id: P97b
      mode: winre
      inputs: ['Y']
      task: 'Rebuild the boot list (BCD) and add the Windows installation that was found.'
      checks: [{type: switch, value: '/rebuildbcd', cmd: bootrec, anyRun: true}, {type: lastOutputIncludes, value: 'completed successfully'}]
      hints: ['The boot list is the BCD. Do this with `bootrec` and the option that rebuilds the BCD from scratch.', 'The parts: `bootrec` → the switch `/rebuildbcd`. When it asks whether to add the Windows installation it found, press `Y`.']
      answer: 'bootrec /rebuildbcd'
      explain: '`bootrec /rebuildbcd` searches the disks and adds the Windows installations it finds to the boot list (BCD). Answering `Y` adds it, and the message `completed successfully` is shown.'
  quiz:
    - kind: mcq
      q: 'On a UEFI computer where `bootrec /fixboot` gives an Access denied error, what is the best alternative?'
      options: ['bcdboot C:\Windows', 'format C:', 'chkdsk /r', 'sfc /scannow']
      answer: 0
      code_options: true
      explain: 'bcdboot creates the boot files.'
    - kind: tf
      q: '`bootrec` also runs in the normal Windows CMD.'
      answer: false
      explain: 'Only in WinRE.'
    - kind: order
      q: 'Put the usual BCD repair steps in order.'
      items: ['bootrec /scanos', 'bootrec /rebuildbcd', 'Restart and test']
      explain: 'Find, rebuild, test.'
  recap: 'WinRE: `bootrec /scanos` → `/rebuildbcd`. On UEFI: `bcdboot C:\Windows`.'

- n: 98
  term: diskpart
  fullForm: 'diskpart · format'
  difficulty: 3
  objective: 'View the structure of disks and partitions with diskpart and prepare a USB stick from scratch, with full attention to safety.'
  summary: '`diskpart` is a separate environment with the prompt `DISKPART>`. First `list disk`, then `select disk n`, and then all actions happen on that disk. `format` in CMD erases a drive and prepares it.'
  meaning: 'Read-only commands: `list disk`, `list volume`, `list partition`, `detail disk`. Dangerous commands: `clean` (erases everything on the disk), `delete partition`, `format`. Preparing a USB stick: `select disk 1` → `clean` → `create partition primary` → `format fs=ntfs quick label=NAME` → `assign`.'
  usage: 'Preparing a new USB stick or hard drive, seeing hidden partitions (EFI, Recovery), fixing a USB stick that doesn''t work properly.'
  syntax: "diskpart\nDISKPART> list disk\nDISKPART> select disk 1\nDISKPART> clean\nformat E: /fs:ntfs /q"
  warning: 'The most important rule: before `clean`, always run `list disk` and use the size to make sure the right disk is selected. Selecting the wrong one means completely erasing your main hard drive. Be extremely careful on a real computer.'
  demo:
    admin: true
    inputs: ['list disk', 'select disk 1', 'list partition', 'list volume', 'exit']
    cmds: ['diskpart']
  examples:
    - c: 'diskpart'
