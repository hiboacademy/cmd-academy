      multi: true
      checks: [{type: drive, value: C}, {type: lastOutputIncludes, value: 'Windows'}]
      hints: ['In WinRE the current drive is `X:`. First you need to change the current drive to `C`, then look at the contents of its root to find the `Windows` folder.', 'Two steps: 1) type just the drive letter with a colon and press Enter; the prompt changes. 2) run the listing command `dir` and look for `Windows` in the output.']
      answer: ['C:', 'dir']
