- n: 41
  term: attrib
  fullForm: Attributes
  difficulty: 2
  objective: See and change file attributes like hidden and read-only.
  summary: 'Every file has several attributes: `H` hidden, `R` read-only, `S` system file and `A` ready for backup (archive). `attrib` shows them and changes them with `+` and `-`.'
  meaning: A hidden file is not visible in a normal `dir`; `dir /a` shows all files. A read-only file cannot be changed or deleted with a normal `del`.
  usage: Finding hidden files, protecting an important file with `+r`, and problems like viruses that hide the files on a USB stick.
  syntax: attrib [+r|-r] [+h|-h] [+s|-s] [file]
  demo:
    start: C:\Users\Student\Documents
    cmds:
    - dir /b
    - dir /a /b
    - attrib secret.txt
  examples:
  - c: dir /a
    d: Show all files, including hidden ones.
  - c: attrib
    d: Show the attributes of the files in the current directory.
  - c: attrib +r guests.txt
    d: Make a file read-only.
  - c: attrib -h secret.txt
    d: Unhide a file.
  mistakes:
  - Thinking a hidden file is safe; anyone can see it with `dir /a`.
  - Changing the attributes of system files (`S`) in `C:\Windows`.
  tip: If a USB stick looks empty after a virus, run `dir /a` first; maybe the files are just hidden.
  practice:
  - id: P41a
    start: C:\Users\Student\Documents
    task: There is a hidden file in this folder. Show all files, including hidden ones.
    checks:
    - type: anyCmd
      value: dir
    - type: lastOutputIncludes
      value: secret.txt
    hints:
    - A hidden file (attribute `H`) is not visible in a normal `dir`. `dir` has a switch that shows all files, whatever their attributes.
    - 'Two parts: what to do? (`dir`) how? (a switch: the first letter of Attribute with `/`). No argument is needed; it shows the current folder.'
    answer: dir /a
    explain: '`dir /a` lists all files regardless of their attributes; so the hidden file `secret.txt` is visible too.'
  - id: P41b
    start: C:\Users\Student\Documents
    task: Make the file `guests.txt` read-only.
    checks:
    - type: fileAttr
      path: C:\Users\Student\Documents\guests.txt
      attr: r
    hints:
    - Use `attrib` to change attributes. The `+` sign adds an attribute and `-` removes it. Find the letter for read-only.
    - 'Three parts: what to do? (`attrib`) what change? (`+` attached to the first letter of Read-only, i.e. `r`) on which file? (`guests.txt`).'
    answer: attrib +r guests.txt
    explain: '`attrib` changes attributes, and `+r` adds the read-only attribute to `guests.txt`, so it can no longer be changed.'
  quiz:
  - kind: mcq
    q: What does the attribute `H` mean?
    options:
    - Hidden
    - Home
    - Hard disk
    - Help
    answer: 0
    explain: H = Hidden.
  - kind: predict
    q: The file `a.txt` is read-only. What is the result of this command?
    code: del a.txt
    options:
    - Access is denied.
    - The file is deleted
    - Could Not Find
    - Are you sure (Y/N)?
    answer: 0
    explain: A read-only file cannot be deleted with a normal `del` (only with `/f`).
  - kind: type
    q: Unhide the file `notes.txt`.
    accept:
    - attrib -h notes.txt
    explain: '`-` removes an attribute.'
  recap: '`attrib` = see and change attributes. `+` = add, `-` = remove. `dir /a` shows hidden files.'
- n: 42
  term: fc
  fullForm: File Compare
  difficulty: 2
  objective: Compare two files and find the differences.
  summary: '`fc` compares two files line by line and shows the places where they differ.'
  meaning: 'If the files are the same, the message `FC: no differences encountered` appears. Otherwise, the differing part of each file is shown between `*****` lines. `/c` ignores upper and lower case and `/n` shows line numbers.'
  usage: Finding out what changed in a settings file, or whether a backup matches the original.
  syntax: fc [/c] [/n] file1 file2
  demo:
    start: C:\Users\Student\Desktop
    files:
    - path: C:\Users\Student\Desktop\menu_old.txt
      content: 'Pizza 8.00

        Pasta 7.00

        Salad 5.50

        '
    - path: C:\Users\Student\Desktop\menu_new.txt
      content: 'Pizza 8.50

        Pasta 7.00

        Salad 5.50

        '
    cmds:
    - fc menu_old.txt menu_new.txt
    - fc menu_new.txt menu_new.txt
  examples:
  - c: fc menu_old.txt menu_new.txt
    noTry: true
    d: Show the lines that differ.
  - c: fc /n a.txt b.txt
    noTry: true
    d: With line numbers.
  - c: fc /c a.txt b.txt
    noTry: true
    d: Ignoring upper and lower case.
  mistakes:
  - Comparing non-text files and expecting readable output.
  tip: 'Exit code of `fc`: zero means identical, 1 means different. Useful in batch files for checking a backup.'
  practice:
  - id: P42a
    start: C:\Users\Student\Desktop
    files:
    - path: C:\Users\Student\Desktop\menu_old.txt
      content: 'Pizza 8.00

        Pasta 7.00

        Salad 5.50

        '
    - path: C:\Users\Student\Desktop\menu_new.txt
      content: 'Pizza 8.50

        Pasta 7.00

        Salad 5.50

        '
    task: Compare the two files `menu_old.txt` and `menu_new.txt` and see which dish has a new price.
    checks:
    - type: anyCmd
      value: fc
      evenIfFailed: true
    - type: lastOutputIncludes
      value: '8.50'
    - type: lastOutputIncludes
      value: '*****'
    hints:
    - Use `fc` (File Compare) to compare two files, and give it both file names one after the other.
    - 'Three parts: what to do? (`fc`) first file? (`menu_old.txt`) second file? (`menu_new.txt`). In the output, the differing lines are shown between `*****`.'
    answer: fc menu_old.txt menu_new.txt
    explain: '`fc` compares the two files line by line and shows only the lines that differ; here the price of Pizza changed from 8.00 to 8.50.'
  - id: P42b
    start: C:\Users\Student\Desktop
    files:
    - path: C:\Users\Student\Desktop\a.txt
      content: 'Hello CMD

        '
    - path: C:\Users\Student\Desktop\b.txt
      content: 'HELLO cmd

        '
    task: Compare `a.txt` and `b.txt` ignoring upper and lower case. (They should be reported as identical.)
    checks:
    - type: switch
      value: /c
      cmd: fc
      anyRun: true
    - type: lastOutputIncludes
      value: no differences
    hints:
    - '`fc` again, but this time you have to say that upper and lower case don''t matter. `fc` has a switch for this.'
    - 'In order: the command (`fc`), the ignore-case switch (`/c` for Case), the first file (`a.txt`), the second file (`b.txt`).'
    answer: fc /c a.txt b.txt
    explain: '`/c` tells `fc` to treat `Hello` and `HELLO` as the same; so the two files are reported as identical and the message `no differences` appears.'
  quiz:
  - kind: mcq
    q: If two files are identical, what does `fc` say?
    options:
    - 'FC: no differences encountered'
    - Files are equal
    - '*****'
    - Nothing
    answer: 0
    explain: The standard fc message.
  - kind: mcq
    q: Which switch shows line numbers?
    options:
    - /n
    - /c
    - /l
    - /b
    answer: 0
    code_options: true
    explain: '`/n` = Number.'
  - kind: tf
    q: An exit code of 0 after `fc` means the files are identical.
    answer: true
    explain: 0 = identical, 1 = different.
  recap: '`fc file1 file2` = compare. `/c` = case, `/n` = line numbers. Exit code 0 means identical.'
- n: 43
  term: xcopy
  fullForm: Extended Copy
  difficulty: 2
  objective: Copy a folder together with its subfolders.
  summary: '`xcopy` is like `copy`, but it also copies folders and subfolders. The most important switches: `/s`, `/e`, `/i` and `/y`.'
  meaning: '`/s` copies non-empty subfolders and `/e` copies even empty ones. `/i` says: if the destination doesn''t exist, assume it is a folder (otherwise xcopy asks “File or Directory?”). `/y` overwrites without asking.'
  usage: Backing up a whole folder, copying a project to a USB stick.
  syntax: xcopy source destination [/s] [/e] [/i] [/y] [/h]
  demo:
    start: C:\Users\Student
    cmds:
    - xcopy Documents D:\DocsBackup /e /i
    - tree D:\DocsBackup /f
  examples:
  - c: xcopy Documents D:\DocsBackup /e /i
    d: Full copy of Documents with subfolders.
  - c: xcopy *.txt E:\Texts /i
    at: C:\Users\Student\Documents
    d: Copy all txt files to a new folder on the USB stick.
  - c: xcopy Documents D:\DocsBackup /s /y
    d: Update a backup without being asked.
  - c: xcopy Documents E:\Docs /e /i /l
    d: '`/l` only shows the list; nothing is copied.'
  mistakes:
  - 'Forgetting `/s` or `/e`: subfolders are not copied.'
  - 'Being surprised by the question `F = file, D = directory`: solved with `/i` or by answering `D`.'
  tip: Hidden files are not copied unless you use `/h`.
  practice:
  - id: P43a
    start: C:\Users\Student
    task: Copy the whole Documents folder including subfolders to `D:\DocsBackup`.
    inputs:
    - d
    checks:
    - type: fileExists
      path: D:\DocsBackup\menu.txt
    - type: fileExists
      path: D:\DocsBackup\Work\report.txt
    hints:
    - '`copy` doesn''t copy subfolders; use `xcopy`. You need one switch to copy all subfolders (even empty ones) and one switch so the destination is assumed to be a folder.'
    - 'In order: the command (`xcopy`), the source (the Documents folder), the destination (`D:\DocsBackup`), the subfolder switch (`/e`), the “destination is a folder” switch (`/i`).'
    answer: xcopy Documents D:\DocsBackup /e /i
    explain: '`xcopy` copies the Documents folder to `D:\DocsBackup`; `/e` also takes all subfolders, even empty ones, and `/i` stops it from asking whether the destination is a file or a directory.'
  quiz:
  - kind: mcq
    q: What is the difference between `/s` and `/e` in xcopy?
    options:
    - '`/e` also copies empty folders'
    - '`/s` is faster'
    - '`/e` copies only files'
    - There is no difference
    answer: 0
    explain: '`/s` skips empty folders.'
  - kind: predict
    q: The destination `D:\New` doesn't exist. What does xcopy do without `/i`?
    code: xcopy Documents D:\New /s
    options:
    - It asks whether the destination is a file or a folder
    - It gives an error and stops
    - It silently creates a folder
    - It puts everything into one file
    answer: 0
    explain: It asks the question `(F = file, D = directory)?`.
  - kind: type
    q: Copy the `Pictures` folder with all its subfolders to `E:\Pics`, without being asked about file or folder.
    accept:
    - xcopy pictures e:\pics /e /i
    - xcopy pictures e:\pics /s /i
    - xcopy pictures e:\pics /e /i /y
    - xcopy pictures e:\pics /i /e
    - xcopy pictures e:\pics /i /s
    show: xcopy Pictures E:\Pics /e /i
    explain: '`/e` = subfolders, `/i` = the destination is a folder.'
  recap: '`xcopy` = copy folders. `/s` or `/e` = subfolders, `/i` = destination is a folder, `/y` = no questions, `/h` = hidden files.'
- n: 44
  term: robocopy
  fullForm: Robust File Copy
  difficulty: 3
  objective: Copy folders safely and smartly with robocopy, and know the danger of `/mir`.
  summary: '`robocopy` is a professional folder-copying tool: it copies only new or changed files, gives a full report and resumes if interrupted.'
  meaning: 'Its syntax is different: first the source folder, then the destination folder, then (optionally) the file pattern. `/e` = subfolders, `/mir` makes the destination a mirror of the source, `/l` only shows the list.'
  usage: Regular backups, syncing folders, moving large amounts of files.
  syntax: robocopy source destination [files] [/e] [/mir] [/l]
  warning: '`/mir` deletes every file from the destination that isn''t in the source. If you swap source and destination, your backup can be wiped.'
  demo:
    start: C:\Users\Student
    cmds:
    - robocopy Documents D:\Sync /e
  examples:
  - c: robocopy Documents D:\Sync /e
    d: Copy a folder with subfolders.
  - c: robocopy Documents D:\Sync *.txt
    d: Only txt files.
  - c: robocopy Documents D:\Sync /e /l
    d: Just show what would be copied.
  - c: robocopy Documents D:\Mirror /mir
    d: Full mirror (dangerous).
    noTry: true
  mistakes:
  - Giving a file name as the source; robocopy always takes a folder.
  - Thinking exit code 1 means an error; in robocopy it means “files were copied”.
  tip: Running the same command again skips files that haven't changed; great for daily backups.
  practice:
  - id: P44a
    start: C:\Users\Student
    task: Use robocopy to copy the whole Pictures folder including subfolders to `E:\PicBackup`.
    checks:
    - type: fileExists
      path: E:\PicBackup\beach.jpg
    - type: fileExists
      path: E:\PicBackup\Holidays\family.jpg
    hints:
    - '`robocopy` takes the source folder first, then the destination folder, and the switches last. You also need a switch to copy subfolders.'
    - 'In order: the command (`robocopy`), the source (the Pictures folder), the destination (`E:\PicBackup`), the subfolder switch (`/e`).'
    answer: robocopy Pictures E:\PicBackup /e
    explain: '`robocopy` copies the contents of `Pictures` to `E:\PicBackup`, and `/e` makes sure subfolders like Holidays are copied too.'
  - id: P44b
    start: C:\Users\Student
    task: Just see which files robocopy would copy from Documents to `D:\Test`, without actually copying them.
    checks:
    - type: anyCmd
      value: robocopy
      evenIfFailed: true
    - type: switch
      value: /l
      cmd: robocopy
      anyRun: true
    - type: fileNotExists
      path: D:\Test\menu.txt
    - type: lastOutputIncludes
      value: menu.txt
    hints:
    - The same `robocopy` structure (source, destination, switch), but with a switch that only lists what would be done and doesn't actually copy any file.
    - 'In order: the command (`robocopy`), the source (Documents), the destination (`D:\Test`), the “list only” switch (`/l` for List).'
    answer: robocopy Documents D:\Test /l
    explain: '`/l` tells `robocopy` to only report which files it would copy from Documents to `D:\Test`; no files are copied.'
  quiz:
  - kind: mcq
    q: What does an exit code of 1 after robocopy mean?
    options:
    - Files were copied successfully
    - An error occurred
    - There were no files
    - Access was denied
    answer: 0
    explain: In robocopy, codes 0 to 7 mean success; 8 and above mean an error.
  - kind: mcq
    q: Which switch makes the destination exactly like the source and deletes the extra files?
    options:
    - /mir
    - /e
    - /l
    - /s
    answer: 0
    code_options: true
    explain: '`/mir` = Mirror; use with care.'
  - kind: fix
    q: This command doesn't work. Why?
    code: robocopy menu.txt D:\Backup
    options:
    - The source must be a folder, and the file name comes after the destination
    - You need to add `/mir`
    - D:\Backup must not exist
    - robocopy doesn't copy txt files
    answer: 0
    explain: 'Correct: `robocopy . D:\Backup menu.txt`'
  recap: '`robocopy source destination [files]`. `/e` = subfolders, `/l` = test run, `/mir` = mirror (dangerous). Exit code below 8 = success.'
