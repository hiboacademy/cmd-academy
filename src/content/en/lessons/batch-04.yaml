# Lessons 33–44 · Chapter 6: pipes, text, search and copying folders

- n: 33
  term: '|'
  fullForm: Pipe
  difficulty: 2
  objective: Send the output of one command straight into the input of another command.
  summary: '`|` sends the output of the command on the left into the input of the command on the right, instead of to the screen. It is like a pipe that connects two commands.'
  meaning: In `type menu.txt | find "Pizza"`, `type` first outputs all the lines; these lines don't appear on the screen but go into `find`, and `find` shows only the line that contains Pizza. Why does this work? Because when `find` gets no file name, it reads its input from the pipe.
  usage: 'Filtering long output: finding the IP in `ipconfig`, finding a program in `tasklist`, sorting lists.'
  syntax: command1 | command2
  demo:
    start: C:\Users\Student\Documents
    cmds:
    - type menu.txt | find "Pizza"
    - ipconfig | find "IPv4"
    - dir /b | sort /r
  examples:
  - c: type menu.txt | find "Pizza"
    d: Only the Pizza line from the menu.
  - c: dir | find ".txt"
    d: Only the lines of the dir output that contain `.txt`.
  - c: ipconfig | find "IPv4"
    d: Only the IPv4 address.
  - c: tasklist | find "chrome"
    d: Only the Chrome processes.
  mistakes:
  - Confusing `|` with `||` (lesson 31).
  - Putting a command that doesn't read input (like `dir`) on the right side of the pipe.
  tip: 'You can chain several pipes in a row: `type guests.txt | sort | more`'
  restaurant: The waiter hands the order straight to the cook, and the cook hands the food straight to the person who garnishes it. Nobody puts the order down on a table.
  practice:
  - id: P33a
    start: C:\Users\Student\Documents
    task: Using `type` and a pipe, show only the line of `menu.txt` that contains `Pasta`.
    checks:
    - type: usedOp
      value: '|'
    - type: lastOutputIncludes
      value: Pasta
    - type: lastOutputExcludes
      value: Pizza
    hints:
    - With a pipe (`|`), the output of one command goes straight into the next command. `type` outputs all the lines of the menu; pass them to `find` so only the line you want is left.
    - 'Three parts: the command on the left (`type` + `menu.txt`), the pipe symbol (`|`), the command on the right (`find` + the word Pasta in quotes).'
    answer: type menu.txt | find "Pasta"
    explain: '`type menu.txt` produces all the lines, and `|` passes them to `find "Pasta"` instead of the screen; `find` shows only the line that contains Pasta.'
  - id: P33b
    start: C:\Users\Student
    task: From the output of `ipconfig`, show only the `IPv4` line.
    checks:
    - type: usedOp
      value: '|'
    - type: lastOutputIncludes
      value: 192.168.1.24
    - type: lastOutputExcludes
      value: Subnet
    hints:
    - '`ipconfig` prints a lot of information. Pipe its output to `find` so only the line containing the word IPv4 is left.'
    - 'Three parts: the first command (`ipconfig`), the `|` symbol, the second command (`find` + the text IPv4 inside `" "`). Write IPv4 with the correct upper and lower case.'
    answer: ipconfig | find "IPv4"
    explain: '`ipconfig` gives all the network settings, and `|` sends them to `find "IPv4"`, which keeps only the line with the IPv4 address.'
  quiz:
  - kind: mcq
    q: In `A | B`, where does the input of command B come from?
    options:
    - From the output of A
    - From the keyboard
    - From a file
    - From the previous command in History
    answer: 0
    explain: A pipe connects the output of A to the input of B.
  - kind: predict
    q: menu.txt contains Pizza, Pasta and Salad. What is the output?
    code: type menu.txt | find "Sa"
    options:
    - Only the Salad line
    - Pasta and Salad
    - All lines
    - Nothing
    answer: 0
    explain: '`find` is case-sensitive; “Pasta” does not contain “Sa” with a capital S.'
  - kind: type
    q: From the output of `tasklist`, show only the `notepad` lines.
    accept:
    - tasklist | find "notepad"
    - tasklist | find /i "notepad"
    - tasklist | findstr notepad
    - tasklist | findstr /i notepad
    - tasklist | find "notepad.exe"
    show: tasklist | find "notepad"
    explain: Pipe the output of tasklist to find.
  - kind: sim
    q: From the list of processes, show only the `notepad` lines.
    start: C:\Users\Student
    checks:
    - type: usedOp
      value: '|'
    - type: lastOutputIncludes
      value: notepad.exe
    - type: lastOutputExcludes
      value: chrome.exe
    answer: tasklist | find /i "notepad"
    explain: The output of `tasklist` is passed to `find` with `|`.
  recap: '`A | B` = the output of A becomes the input of B. Used to filter long output.'
- n: 34
  term: more
  fullForm: More (page by page)
  difficulty: 2
  objective: Read long output one page at a time.
  summary: '`more` shows the output one page at a time and waits. Space shows the next page, Enter the next line, Q quits.'
  meaning: '`more` takes its input either from a file (`more file.txt`) or from a pipe (`help | more`). At the bottom of the screen you see `-- More --` and the percentage read so far.'
  usage: Reading long help texts, logs and the output of commands like `systeminfo`.
  syntax: 'more file

    command | more'
  examples:
  - c: help | more
    d: The list of commands, page by page.
  - c: more C:\Windows\win.ini
    d: Showing a file with more.
  - c: systeminfo | more
    d: Reading the system information at your own pace.
  mistakes:
  - Thinking CMD has frozen; `-- More --` is waiting for you to press a key.
  tip: In the simulator too, when `-- More --` appears, press Space or Enter; press Q to quit.
  practice:
  - id: P34a
    start: C:\Users\Student
    task: Show the list of commands from `help` page by page. (Continue with Space or quit with Q.)
    checks:
    - type: anyCmd
      value: more
    - type: usedOp
      value: '|'
    - type: argIncludes
      cmd: help
      value: ''
    inputs:
    - ' '
    - q
    hints:
    - The output of `help` is long. Pipe it to `more` so it is shown page by page and waits for you to press a key.
    - 'Three parts: a command with long output (`help`), the `|` symbol, the paging command (`more`). Then see the next page with Space and quit with `Q`.'
    answer: help | more
    explain: '`help` gives the list of commands, and `|` sends it to `more`; `more` shows one page at a time and continues when you press Space.'
  quiz:
  - kind: mcq
    q: At `-- More --`, which key moves forward one full page?
    options:
    - Space
    - Enter
    - Q
    - Esc
    answer: 0
    explain: Space = next page, Enter = just one line, Q = quit.
  - kind: type
    q: Show the file `log.txt` page by page.
    accept:
    - more log.txt
    - type log.txt | more
    - more < log.txt
    show: more log.txt
    explain: '`more log.txt` or `type log.txt | more`'
  - kind: tf
    q: '`more` changes the contents of the file.'
    answer: false
    explain: It only displays it.
  recap: '`more` = page by page. Space = page, Enter = line, Q = quit.'
- n: 35
  term: sort
  fullForm: Sort
  difficulty: 2
  objective: Sort the lines of a file or the output of a command alphabetically.
  summary: '`sort` sorts lines from A to Z. With `/r` in reverse (Z to A).'
  meaning: '`sort` is not case-sensitive and does not change the original file; it only shows the sorted output. To save it, use `>` or `/o`.'
  usage: Sorting a list of names, the output of `dir /b`, or data coming from another command.
  syntax: 'sort [/r] [file] [/o outfile]

    command | sort'
  demo:
    start: C:\Users\Student\Documents
    cmds:
    - type guests.txt
    - sort guests.txt
    - sort /r guests.txt
  examples:
  - c: sort guests.txt
    d: Sorted display.
  - c: type guests.txt | sort
    d: The same thing with a pipe.
  - c: sort guests.txt > sorted.txt
    d: Saving the result in a new file.
  - c: dir /b | sort /r
    d: The list of files in reverse order.
  mistakes:
  - 'Writing `sort guests.txt > guests.txt`: the file is emptied before it is read! Always write to a new file.'
  tip: 'Numbers are sorted as text: `10` comes before `9`.'
  practice:
  - id: P35a
    start: C:\Users\Student\Documents
    task: Show the names in `guests.txt` sorted (A to Z).
    checks:
    - type: anyCmd
      value: sort
    - type: outputOrder
      value:
      - Ali
      - David
      - hibo
      - mina
      - Reza
      - Sara
    hints:
    - Use `sort` to sort the lines of a file, and give it the file name as the argument.
    - 'Two parts: what to do? (`sort`) on which file? (`guests.txt`). `sort` ignores upper and lower case, so `hibo` comes between David and mina.'
    answer: sort guests.txt
    explain: '`sort guests.txt` shows the lines of the file in alphabetical order (A to Z); the file itself does not change.'
  - id: P35b
    start: C:\Users\Student\Documents
    task: Save a sorted copy of `guests.txt` in a new file called `sorted.txt`.
    checks:
    - type: fileOrder
      path: C:\Users\Student\Documents\sorted.txt
      value:
      - Ali
      - David
      - hibo
      - mina
      - Reza
      - Sara
    hints:
    - '`sort` only displays the result. To save it, send the output to a new file with a redirect (`>`).'
    - 'Three parts: the sort command (`sort` + `guests.txt`), the `>` symbol, the name of the new file (`sorted.txt`).'
    answer: sort guests.txt > sorted.txt
    explain: '`sort guests.txt` sorts the names, and `>` writes this output to `sorted.txt`; the original `guests.txt` is left untouched.'
  quiz:
  - kind: mcq
    q: Which switch reverses the order?
    options:
    - /r
    - /o
    - /b
    - /s
    answer: 0
    code_options: true
    explain: '`/r` = Reverse.'
  - kind: predict
    q: What is the output of this command with the inputs `b`, `C`, `a`?
    code: sort names.txt
    options:
    - 'a

      b

      C'
    - 'C

      a

      b'
    - 'b

      C

      a'
    - 'a

      C

      b'
    answer: 0
    code_options: true
    explain: sort is not case-sensitive.
  - kind: tf
    q: '`sort guests.txt` saves guests.txt in sorted order.'
    answer: false
    explain: It only displays it; use `>` to save.
  recap: '`sort file` or `... | sort`. `/r` = reverse. The original file does not change.'
- n: 36
  term: <
  fullForm: Input redirection
  difficulty: 2
  objective: Feed a command its input from a file.
  summary: '`<` sends the contents of a file into the input of a command instead of the keyboard. It is the opposite of `>`, which sends output to a file.'
  meaning: '`sort < guests.txt` means “feed guests.txt into the input of sort”. The result is similar to `type guests.txt | sort`, but without running a second command.'
  usage: Feeding files to commands that read from input (sort, find, more), and in batch files for reading the first line of a file with `set /p` (lesson 74).
  syntax: 'command < file

    command < input.txt > output.txt'
  demo:
    start: C:\Users\Student\Documents
    cmds:
    - sort < guests.txt
    - find "Soup" < menu.txt
  examples:
  - c: sort < guests.txt
    d: Sorting the contents of a file.
  - c: find "Pizza" < menu.txt
    d: Searching in input coming from a file.
  - c: sort < guests.txt > sorted.txt
    d: Input from one file, output to another file.
  mistakes:
  - 'Getting the direction backwards: `sort > guests.txt` wipes the file!'
  tip: 'Look at the direction of the arrow: `<` points to the command (input), `>` points to the file (output).'
  daily: '`>` is like pouring water from a glass into a bottle; `<` is like pouring water from a bottle into a glass.'
  practice:
  - id: P36a
    start: C:\Users\Student\Documents
    task: Use `<` to feed the contents of `guests.txt` to `sort` so the names are shown sorted.
    checks:
    - type: usedOp
      value: <
    - type: outputOrder
      value:
      - Ali
      - David
      - Sara
    hints:
    - The `<` symbol sends the contents of a file into a command's input (the opposite of `>`). This time, don't give the file name directly to `sort`; send it through `<`.
    - 'Three parts: the command (`sort`), the input symbol (`<`, which points toward the command), the source file (`guests.txt`).'
    answer: sort < guests.txt
    explain: '`<` gives the contents of `guests.txt` to `sort` as if you had typed them, and `sort` shows them sorted.'
  - id: P36b
    start: C:\Users\Student\Documents
    task: Use `find` and `<` to find the `Soup` line in `menu.txt`.
    checks:
    - type: usedOp
      value: <
    - type: anyCmd
      value: find
    - type: lastOutputIncludes
      value: Soup
    hints:
    - '`find` takes the search text in quotes. Instead of giving the file name as an argument, send the file''s contents into the input of `find` with `<`.'
    - 'Three parts: the command with the search text (`find` + Soup inside `" "`), the `<` symbol, the source file (`menu.txt`).'
    answer: find "Soup" < menu.txt
    explain: '`find "Soup"` looks for the word Soup, and `< menu.txt` sends the contents of the menu into its input; so the Soup line is shown.'
  quiz:
  - kind: mcq
    q: In `sort < a.txt > b.txt`, which file is read?
    options:
    - a.txt
    - b.txt
    - Both
    - Neither
    answer: 0
    explain: '`<` is input and `>` is output.'
  - kind: fix
    q: The user wanted to see the file sorted, but the file was emptied. Why?
    code: sort > guests.txt
    options:
    - The arrow points the wrong way; it should have been `<`
    - '`sort` deletes the file'
    - '`/r` should have been added'
    - '`type` should have been written first'
    answer: 0
    explain: '`>` opens the file for writing and empties it.'
  - kind: type
    q: Feed the contents of `names.txt` to `sort` with `<`.
    accept:
    - sort < names.txt
    - sort <names.txt
    show: sort < names.txt
    explain: '`sort < names.txt`'
  recap: '`command < file` = input from a file. `<` = input, `>` = output, `|` = connects two commands.'
- n: 37
  term: find
  fullForm: Find text
  difficulty: 2
  objective: Find the lines that contain some text in files or in the output of commands.
  summary: '`find "text" file` shows all lines that contain that text. The search text must always be in quotes.'
  meaning: 'Important switches: `/i` ignores upper/lower case, `/c` shows only the number of lines, `/n` shows line numbers, `/v` shows the lines that do NOT contain the text.'
  usage: Searching logs and text files, and filtering command output with a pipe.
  syntax: find [/i] [/c] [/n] [/v] "text" [file...]
  demo:
    start: C:\Users\Student\Documents
    cmds:
    - find "Pizza" menu.txt
    - find /c /i "a" guests.txt
    - find /n "S" guests.txt
  examples:
  - c: find "Pizza" menu.txt
    d: Lines that contain Pizza.
  - c: find /i "pizza" menu.txt
    d: Ignoring upper and lower case.
  - c: find /c "a" guests.txt
    d: Only the number of lines that contain “a”.
  - c: find /v "a" menu.txt
    d: Lines that do not contain “a”.
  mistakes:
  - 'Leaving out the quotes: `find Pizza menu.txt` gives the error `Parameter format not correct`.'
  - Forgetting `/i` and not finding “pizza” with a lowercase p.
  tip: 'Exit code: `0` if something is found, otherwise `1`. So `find ... && echo found` works (lesson 62).'
  practice:
  - id: P37a
    start: C:\Users\Student\Documents
    task: Count how many lines in `guests.txt` contain the letter `a`, ignoring upper and lower case.
    checks:
    - type: anyCmd
      value: find
    - type: switch
      value: /c
      cmd: find
      anyRun: true
    - type: switch
      value: /i
      cmd: find
      anyRun: true
    - type: lastOutputMatches
      value: '(^|: )5\s*$'
    hints:
    - Use `find`, but instead of showing the lines, ask only for how many there are. You need one switch for counting and one switch for ignoring upper and lower case.
    - 'In order: the command (`find`), the count switch (`/c` for Count), the case switch (`/i` for Ignore case), the search text (`a` inside `" "`), and the file (`guests.txt`).'
    answer: find /c /i "a" guests.txt
    explain: '`/c` gives only the number of lines instead of the lines themselves, and `/i` makes `a` and `A` count as the same; `"a"` is the search text and `guests.txt` is the target file.'
  - id: P37b
    start: C:\Users\Student\Documents
    task: Show the lines of `menu.txt` that do not contain the letter `a`.
    checks:
    - type: switch
      value: /v
      cmd: find
      anyRun: true
    - type: lastOutputIncludes
      value: Soup
    - type: lastOutputExcludes
      value: Pizza
    hints:
    - This time you want the lines that do NOT contain the text. `find` has a “reverse” switch that inverts the result.
    - 'In order: the command (`find`), the reverse switch (`/v`), the search text (`a` inside `" "`), the file (`menu.txt`).'
    answer: find /v "a" menu.txt
    explain: '`find` normally shows the lines that contain the text; `/v` reverses this, so only the lines of `menu.txt` without `a` appear, like Soup.'
  quiz:
  - kind: fix
    q: Why does this command give an error?
    code: 'find Pizza menu.txt

      FIND: Parameter format not correct'
    options:
    - The search text has no quotes
    - menu.txt does not exist
    - You need to add `/i`
    - '`find` doesn''t work on files'
    answer: 0
    explain: 'Correct: `find "Pizza" menu.txt`'
  - kind: mcq
    q: Which switch shows only the number of lines found?
    options:
    - /c
    - /n
    - /v
    - /i
    answer: 0
    code_options: true
    explain: '`/c` = Count.'
  - kind: type
    q: In `log.txt`, find the lines that contain `error`, ignoring upper and lower case.
    accept:
    - find /i "error" log.txt
    - find "error" /i log.txt
    - findstr /i error log.txt
    - findstr /i "error" log.txt
    show: find /i "error" log.txt
    explain: '`/i` ignores upper and lower case.'
  - kind: sim
    q: Count the number of lines in `guests.txt` (in Documents).
    start: C:\Users\Student\Documents
    checks:
    - type: cmd
      value: find
    - type: switch
      value: /c
    - type: lastOutputIncludes
      value: ': 6'
    answer: find /c /v "" guests.txt
    explain: '`/v ""` selects all lines and `/c` counts them.'
  recap: '`find "text" file`. `/i` = case, `/c` = count, `/n` = line numbers, `/v` = reverse. Quotes are required.'
- n: 38
  term: findstr
  fullForm: Find String
  difficulty: 2
  objective: Use `findstr` to search for several words at once, in several files and even in subfolders.
  summary: '`findstr` is a more powerful version of `find`: it searches for several words at once, looks in subfolders and understands simple patterns (regular expressions).'
  meaning: '`findstr "Pizza Coffee" menu.txt` means Pizza **or** Coffee. For a complete phrase with spaces, use `/c:"..."`. `/s` means include subfolders. `^` means start of line and `$` means end of line.'
  usage: Searching a whole project, finding files that contain a word, more precise filters.
  syntax: findstr [/i] [/s] [/n] [/m] [/c:"phrase"] "words" files
  demo:
    start: C:\Users\Student\Documents
    cmds:
    - findstr "Pizza Coffee" menu.txt
    - findstr /s /i "sales" *.txt
    - findstr /m /s "Report" *.txt
  examples:
  - c: findstr "Pizza Coffee" menu.txt
    d: Lines that contain Pizza or Coffee.
  - c: findstr /c:"Restaurant Menu" menu.txt
    d: Exactly this phrase.
  - c: findstr /s /i "sales" *.txt
    d: Searching all txt files in this folder and its subfolders.
  - c: findstr /m /s "Report" *.txt
    d: Only the names of files that contain Report.
  - c: findstr "^S" guests.txt
    d: Lines that start with S.
  mistakes:
  - Thinking `"a b"` means the phrase “a b”; in findstr it means a or b. For a phrase, use `/c:`.
  tip: In findstr, `.` means “any character”. To search for an actual dot, write `\.`
  practice:
  - id: P38a
    start: C:\Users\Student\Documents
    task: With one command, show the lines of `menu.txt` that contain `Pizza` or `Coffee`.
    checks:
    - type: anyCmd
      value: findstr
    - type: lastOutputIncludes
      value: Pizza
    - type: lastOutputIncludes
      value: Coffee
    - type: lastOutputExcludes
      value: Pasta
    hints:
    - '`findstr` can search for several words at once: if you write several words separated by spaces inside one pair of quotes, it means “this **or** that”.'
    - 'Three parts: the command (`findstr`), the search words (Pizza and Coffee separated by a space, both inside one pair of `" "`), the file (`menu.txt`).'
    answer: findstr "Pizza Coffee" menu.txt
    explain: In `findstr`, `"Pizza Coffee"` means Pizza or Coffee; so every line of `menu.txt` that contains either of these words is shown.
  - id: P38b
    start: C:\Users\Student\Documents
    task: Search all `.txt` files in this folder and its subfolders for the word `sales`, ignoring upper and lower case.
    checks:
    - type: switch
      value: /s
      cmd: findstr
      anyRun: true
    - type: switch
      value: /i
      cmd: findstr
      anyRun: true
    - type: lastOutputIncludes
      value: report1.txt
    hints:
    - Use `findstr` with the wildcard `*` to search all text files. You need one switch that also searches subfolders and one that ignores upper and lower case.
    - 'In order: the command (`findstr`), the subfolder switch (`/s`), the case switch (`/i`), the search word (sales inside `" "`), the file pattern (`*` and `.txt`).'
    answer: findstr /s /i "sales" *.txt
    explain: '`/s` extends the search to subfolders like Work, `/i` treats upper and lower case as the same, and `*.txt` means all text files.'
  quiz:
  - kind: mcq
    q: What does `findstr "red blue" colors.txt` find?
    options:
    - Lines that contain red or blue
    - Only the phrase “red blue”
    - Lines that contain both
    - It gives an error
    answer: 0
    explain: In findstr, a space means “or”.
  - kind: mcq
    q: Which switch shows only the file names?
    options:
    - /m
    - /n
    - /s
    - /c
    answer: 0
    code_options: true
    explain: '`/m` = file names only.'
  - kind: type
    q: 'Find exactly the phrase `Status: OK` in `report.txt`.'
    accept:
    - 'findstr /c:"Status: OK" report.txt'
    - 'find "Status: OK" report.txt'
    - 'findstr /i /c:"status: ok" report.txt'
    - 'findstr /i /c:"Status: OK" report.txt'
    - 'find /i "status: ok" report.txt'
    - 'find /i "Status: OK" report.txt'
    quotedCase: true
    show: 'findstr /c:"Status: OK" report.txt'
    explain: For a phrase with spaces, use `/c:`.
  recap: '`findstr` = several words (or), `/c:` = exact phrase, `/s` = subfolders, `/m` = file names, `^` and `$` = start and end of line.'
- n: 39
  term: tree
  fullForm: Tree
  difficulty: 2
  objective: See the structure of folders as a tree.
  summary: '`tree` shows all folders and subfolders as a tree. With `/f`, files are shown too.'
  meaning: The `├───` and `└───` lines show which folder each folder is inside. `/a` uses simple ASCII characters instead of these lines (for saving to a file).
  usage: Understanding the structure of a project, before `rd /s` or a backup, and documenting folders.
  syntax: tree [path] [/f] [/a]
  demo:
    start: C:\Users\Student
    cmds:
    - tree Pictures /f
  examples:
  - c: tree
    d: Tree of the current folder.
  - c: tree Documents /f
    d: With files.
  - c: tree /a > structure.txt
    d: Saving the tree to a file with simple characters.
  mistakes:
  - 'Running `tree` in `C:\` on a real computer: the output is thousands of lines. Try a small folder first.'
  tip: Hidden files and folders (like AppData) are not shown in `tree`.
  practice:
  - id: P39a
    start: C:\Users\Student
    task: Show the structure of the Documents folder as a tree, including the file names.
    checks:
    - type: anyCmd
      value: tree
    - type: switch
