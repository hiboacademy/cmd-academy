    - type: lastOutputIncludes
      value: sea.jpg
    - type: lastOutputIncludes
      value: cat.jpg
    hints:
    - Use `where`. To search a folder and all its subfolders you need the switch `/r` (Recursive), followed by the start folder and the file pattern.
    - 'In order: the command (`where`), the switch (`/r`), the start folder (the absolute path `C:\Users\Student`), the file pattern (`*` and `.jpg`).'
    answer: where /r C:\Users\Student *.jpg
    explain: '`where /r` starts at the given folder (`C:\Users\Student`) and finds, in all subfolders, the files that match `*.jpg`.'
