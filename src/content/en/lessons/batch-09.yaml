      answer: ['@echo off', 'if not exist E:\Texts mkdir E:\Texts', 'for %%f in ("%USERPROFILE%\Documents\*.txt") do copy "%%f" E:\Texts >nul']
      explain: 'The loop puts each txt file, one by one, into `%%f`, and `copy "%%f" E:\Texts` copies it to the destination. The quotes around `%%f` are for names with spaces, and `>nul` is for clean output.'
  quiz:
