# Lessons 78–87 · Chapter 11: logic, loops and menus

- n: 78
  term: if
  fullForm: 'if (compare text)'
  difficulty: 3
  objective: 'Make decisions in a script by comparing two pieces of text.'
  summary: '`if "A"=="B" command` runs the command only when both sides are the same. `/i` ignores upper and lower case, and `not` reverses the condition.'
  meaning: 'The quotes around both sides matter: if the variable is empty, `if %x%==yes` turns into `if ==yes` and causes an error; but `if "%x%"=="yes"` turns into `if ""=="yes"`, which works fine.'
  usage: 'Checking the user''s answer, checking whether an argument was given, running different parts of a script.'
  syntax: "if \"%x%\"==\"text\" command\nif /i \"%x%\"==\"y\" command\nif not \"%1\"==\"\" command"
  demo:
    start: 'C:\Users\Student\Desktop'
    inputs: ['Y']
    files: [{path: 'C:\Users\Student\Desktop\like.bat', content: "@echo off\nset /p answer=Do you like CMD? (y/n) \nif /i \"%answer%\"==\"y\" echo Great!\nif /i not \"%answer%\"==\"y\" echo Maybe later.\n"}]
    cmds: ['like.bat']
  examples:
    - c: 'if "%1"=="" echo No name given'
      d: 'Checks whether the argument is empty.'
      noTry: true
    - c: 'if /i "%answer%"=="yes" echo OK'
      d: 'Accepts both yes and YES.'
      noTry: true
  mistakes:
    - 'Leaving out the quotes and getting the error `was unexpected at this time.` when the variable is empty.'
    - 'Using a single `=`; for comparing you need `==`.'
  tip: 'If you need several commands after the condition, put them inside parentheses `( )` (next lesson).'
  practice:
    - id: P78a
      batch: {file: 'like.bat', starter: "@echo off\nset /p answer=Do you like CMD? (y/n) \n"}
      inputs: ['Y']
      task: 'The script asks the user whether they like CMD. If the answer is `y` or `Y`, print `Great!`. (Run it and type `y`.)'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\like.bat', value: ['if', '/i']}, {type: outputIncludes, value: 'Great!'}]
      hints: ['You need to compare the user''s answer, stored in the variable `answer`, with `y`; use `if` for that. Because a capital `Y` must also be accepted, you need the `/i` switch.', 'Add one line at the end of the script with these parts: `if /i` → both sides of the comparison in quotes, i.e. `"%answer%"` and `"y"`, with `==` between them → finally the command to run: `echo` with the text `Great!`.']
      answer: ['@echo off', 'set /p answer=Do you like CMD? (y/n) ', 'if /i "%answer%"=="y" echo Great!']
      explain: '`if /i "%answer%"=="y"` compares the user''s answer with `y`, ignoring upper and lower case, and if they match, `echo Great!` runs. The quotes also prevent an error when the answer is empty.'
    - id: P78b
      batch: {file: 'hello.bat', starter: "@echo off\n", args: ''}
      task: 'Write a script that shows the message `Please give a name` when it is run without an argument. (Run it without an argument.)'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\hello.bat', value: ['if', '%1']}, {type: outputIncludes, value: 'Please give a name'}]
      hints: ['The first argument is in `%1`. If the script runs without an argument, `%1` is empty; so use `if` to check whether `%1` equals “nothing”.', 'Parts of the line: `if` → left side `"%1"` → `==` → right side an empty pair of quotes `""` → then `echo` with the message `Please give a name`.']
      answer: ['@echo off', 'if "%1"=="" echo Please give a name']
      explain: 'When no argument is given, `"%1"` becomes `""` and equals `""`, so `echo` shows the message. The quotes make the line work without an error even when `%1` is empty.'
  quiz:
    - kind: fix
      q: 'This line causes an error when `%x%` is empty. What is the correct fix?'
      code: 'if %x%==yes echo OK'
      options: ['if "%x%"=="yes" echo OK', 'if %x%=yes echo OK', 'if (%x%)==yes echo OK', 'if x==yes echo OK']
      answer: 0
      code_options: true
      explain: 'Quotes around both sides.'
    - kind: mcq
      q: 'What does `/i` do in `if`?'
      options: ['Ignores upper and lower case', 'Reverses the condition', 'Compares numbers', 'Reads input']
      answer: 0
      explain: 'Ignore case.'
    - kind: predict
      q: '`answer` is `NO`. What is the output?'
      code: "if \"%answer%\"==\"no\" echo A\nif /i \"%answer%\"==\"no\" echo B"
      options: ['B', 'A', 'A and B', 'Nothing']
      answer: 0
      explain: 'Only with `/i` are upper and lower case treated as the same.'
  recap: '`if "%x%"=="text" command`. Always use quotes. `/i` for case, `not` to reverse.'

- n: 79
  term: 'if ... else'
  fullForm: 'else · number comparisons'
  difficulty: 3
  objective: 'Build two paths with `else` and compare numbers.'
  summary: '`if condition ( ... ) else ( ... )` runs the first part if the condition is true, otherwise the second part. For numbers, use `equ neq lss leq gtr geq`.'
  meaning: '`) else (` must be on one line. Operators: `equ` equal, `neq` not equal, `lss` less than, `leq` less than or equal, `gtr` greater than, `geq` greater than or equal. If both sides are numbers, the comparison is numeric.'
  usage: 'Decisions based on age, number of files, size, or the result of a calculation.'
  syntax: "if %n% geq 18 (\n  echo Adult\n) else (\n  echo Child\n)"
  demo:
    start: 'C:\Users\Student\Desktop'
    inputs: ['20']
    files: [{path: 'C:\Users\Student\Desktop\age.bat', content: "@echo off\nset /p age=How old are you? \nif %age% geq 18 (\n  echo You are an adult.\n) else (\n  echo You are under 18.\n)\n"}]
    cmds: ['age.bat']
  examples:
    - c: 'if %count% gtr 10 (echo Many) else (echo Few)'
      d: 'Everything on one line.'
      noTry: true
    - c: 'if %errorlevel% neq 0 echo Something failed'
      d: 'Checking for an error (lesson 81).'
      noTry: true
  mistakes:
    - 'Writing `else` on the next line; `) else (` must be on one line.'
    - 'Using `>` to compare: `if %a% > 5` creates a file named 5! Use `gtr`.'
  tip: 'Write the commands inside the parentheses with indentation so the script stays readable.'
  practice:
    - id: P79a
      batch: {file: 'age.bat', starter: "@echo off\nset /p age=How old are you? \n"}
      inputs: ['20']
      task: 'If the age entered is `18` or more, print `Adult`, otherwise print `Child`. (Try it with `20`.)'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\age.bat', value: ['geq', 'else']}, {type: outputIncludes, value: 'Adult'}, {type: outputExcludes, value: 'Child'}]
      hints: ['You need two paths: one for `18` or more and one for everything else. Use `if ... else` and the number operator “greater than or equal”, which is `geq`.', 'Structure: the condition `if %age% geq 18` and an opening parenthesis with `echo Adult` inside → then `) else (` on one line → inside the else part the command `echo Child` → and finally close the parenthesis with `)`.']
      answer: ['@echo off', 'set /p age=How old are you? ', 'if %age% geq 18 (', '  echo Adult', ') else (', '  echo Child', ')']
      explain: '`geq` means “greater than or equal”, so with `20` the condition is true and the first part (`echo Adult`) runs. The part after `else` only runs when the age is less than `18`.'
    - id: P79b
      batch: {file: 'stock.bat', starter: "@echo off\nset /a pizzas=5\n"}
      task: 'If the number of pizzas (`pizzas`) is greater than `3`, print `Enough pizza`, otherwise print `Order more`.'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\stock.bat', value: ['gtr', 'else']}, {type: outputIncludes, value: 'Enough pizza'}]
      hints: ['Compare the value of `pizzas` with the number `3` and use `if ... else` to print one of the two messages. The “greater than” operator is `gtr` (not `>`).', 'Parts on one line: `if` → `%pizzas%` → `gtr 3` → first parenthesis with `echo Enough pizza` → `else` → second parenthesis with `echo Order more`.']
      answer: ['@echo off', 'set /a pizzas=5', 'if %pizzas% gtr 3 (echo Enough pizza) else (echo Order more)']
      explain: '`%pizzas%` is `5` and `5 gtr 3` is true, so the first parenthesis runs and `Enough pizza` is printed. If the number were `3` or less, the `else` part, `Order more`, would run.'
  quiz:
    - kind: mcq
      q: 'Which operator means “less than”?'
      options: ['lss', 'leq', 'gtr', 'neq']
      answer: 0
      code_options: true
      explain: 'less.'
    - kind: fix
      q: 'This script causes an error. Why?'
      code: "if %n% equ 1 (\n  echo one\n)\nelse (\n  echo other\n)"
      options: ['`else` must be on the same line as `)`', '`equ` is wrong', 'The parentheses are unnecessary', 'n is not defined']
      answer: 0
      explain: 'Correct: `) else (`'
    - kind: predict
      q: 'Output?'
      code: "set a=9\nif %a% lss 10 (echo small) else (echo big)"
      options: ['small', 'big', 'small big', 'Error']
      answer: 0
      explain: '9 is less than 10.'
  recap: '`if ... ( ) else ( )` with `) else (` on one line. Numbers: `equ neq lss leq gtr geq`.'

- n: 80
  term: 'if exist'
  fullForm: 'if exist · if defined'
  difficulty: 3
  objective: 'Check whether a file or folder exists before working with it.'
  summary: '`if exist path command` runs the command only if the file or folder exists. `if not exist` does the opposite. `if defined name` checks whether a variable is defined.'
  meaning: 'A very common pattern: `if not exist "%dest%" mkdir "%dest%"` means “if the folder isn''t there, create it”. This prevents the `already exists` error and makes the script safe.'
  usage: 'Creating a folder only when needed, copying only if the file is there, friendly error messages.'
  syntax: "if exist file command\nif not exist folder mkdir folder\nif defined name command"
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\check.bat', content: "@echo off\nif exist \"%USERPROFILE%\\Documents\\menu.txt\" (echo Menu found) else (echo No menu)\nif not exist Reports mkdir Reports\nif exist Reports echo Reports folder is ready\nif defined USERNAME echo USERNAME is defined\n"}]
    cmds: ['check.bat', 'check.bat']
  examples:
    - c: 'if exist menu.txt type menu.txt'
      d: 'Shows the file only if it exists.'
      noTry: true
    - c: 'if not exist "D:\Backup" mkdir "D:\Backup"'
      d: 'Creates the folder only when needed.'
      noTry: true
    - c: 'if exist *.tmp del *.tmp'
      d: 'Works with wildcards too.'
      noTry: true
  mistakes:
    - 'Leaving out the quotes for a path with spaces.'
    - 'Writing `%` in `if defined`: the correct form is `if defined name`, not `if defined %name%`.'
  tip: 'Running a good script a second time should not cause an error; `if not exist` makes sure of that.'
  practice:
    - id: P80a
      batch: {file: 'prepare.bat', starter: "@echo off\n"}
      task: 'Write a script that creates the folder `Reports` on the Desktop only if it doesn''t exist, and then prints `Ready`. (Run it twice; the second run must not cause an error either.)'
      checks: [{type: ranBatch}, {type: dirExists, path: 'C:\Users\Student\Desktop\Reports'}, {type: fileContains, path: 'C:\Users\Student\Desktop\prepare.bat', value: 'if not exist'}, {type: outputIncludes, value: 'Ready'}, {type: outputExcludes, value: 'already exists'}]
      hints: ['You want the folder to be created only when it doesn''t exist; that''s the job of `if not exist`, and to create the folder use `mkdir`. Then print the message.', 'Write two lines: line one = `if not exist` + the folder name `Reports` + the command that creates that folder with `mkdir`. Line two = `echo` with the text `Ready`.']
      answer: ['@echo off', 'if not exist Reports mkdir Reports', 'echo Ready']
      explain: '`if not exist Reports mkdir Reports` creates the folder only when it isn''t there, so the second run does not give the `already exists` error. Then `echo Ready` shows the message in both runs.'
    - id: P80b
      batch: {file: 'menu.bat', starter: "@echo off\n"}
      task: 'If the file `%USERPROFILE%\Documents\menu.txt` exists, print `Menu found`, otherwise print `No menu`.'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\menu.bat', value: 'if exist'}, {type: outputIncludes, value: 'Menu found'}]
      hints: ['Check whether a file exists with `if exist`, and because you need two different messages, use `else` too. Write the path in quotes.', 'Parts: `if exist` → the path `"%USERPROFILE%\Documents\menu.txt"` → first parenthesis with `echo Menu found` → `else` → second parenthesis with `echo No menu`.']
      answer: ['@echo off', 'if exist "%USERPROFILE%\Documents\menu.txt" (echo Menu found) else (echo No menu)']
      explain: '`if exist` checks whether the file `menu.txt` is in Documents; since it is, the first part, `Menu found`, is printed. If the file weren''t there, the `else` part would show the message `No menu`.'
  quiz:
    - kind: mcq
      q: 'Which line creates the Backup folder only if it doesn''t exist?'
      options: ['if not exist Backup mkdir Backup', 'if exist Backup mkdir Backup', 'mkdir Backup if not exist', 'if Backup==none mkdir Backup']
      answer: 0
      code_options: true
      explain: '`if not exist`'
    - kind: fix
      q: 'Which is correct for checking whether the variable `name` is defined?'
      code: 'if defined %name% echo yes'
      options: ['if defined name echo yes', 'if exist name echo yes', 'if "%name%" defined echo yes', 'if name echo yes']
      answer: 0
      code_options: true
      explain: 'The variable name without `%`.'
    - kind: tf
      q: '`if exist` works on folders too.'
      answer: true
      explain: 'File or folder.'
  recap: '`if exist` / `if not exist` for files and folders. `if defined name` for variables.'

- n: 81
  term: 'if errorlevel'
  fullForm: 'Decisions from exit codes'
  difficulty: 3
  objective: 'Make decisions in a script based on whether the previous command succeeded or failed.'
  summary: 'Two ways: `if %errorlevel% neq 0` (exact comparison) and `if errorlevel 1` (meaning 1 **or more**). `&&` and `||` are short ways to do the same thing.'
  meaning: 'Important: `if errorlevel 1` is true for any code that is 1 or greater. That''s why in menus (lesson 87) the conditions are written from largest to smallest.'
  usage: 'Checking whether a copy succeeded, whether text was found, whether a server answered, and reporting errors.'
  syntax: "command\nif %errorlevel% neq 0 (echo failed)\nif errorlevel 1 (echo code 1 or more)"
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\check.bat', content: "@echo off\nfind \"Pizza\" \"%USERPROFILE%\\Documents\\menu.txt\" >nul\nif errorlevel 1 (echo No pizza today) else (echo We have pizza)\nping -n 1 10.0.0.99 >nul\nif %errorlevel% neq 0 echo Server 10.0.0.99 is down\n"}]
    cmds: ['check.bat']
  examples:
    - c: 'if errorlevel 1 goto failed'
      d: 'Jumps to the error section.'
      noTry: true
    - c: 'xcopy a b /s /y >nul || echo Copy failed'
      d: 'The short form with `||`.'
      noTry: true
  mistakes:
    - 'Thinking that `if errorlevel 1` means exactly 1.'
    - 'Running another command between the main command and the ERRORLEVEL check.'
  tip: 'For clean output, hide the command''s output with `>nul` and show only your own message.'
  practice:
    - id: P81a
      batch: {file: 'pizza.bat', starter: "@echo off\nfind \"Pizza\" \"%USERPROFILE%\\Documents\\menu.txt\" >nul\n"}
      task: 'After `find`, print `No pizza` if Pizza was not found and `We have pizza` if it was found (using ERRORLEVEL).'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\pizza.bat', value: 'errorlevel'}, {type: outputIncludes, value: 'We have pizza'}, {type: outputExcludes, value: 'No pizza'}]
      hints: ['If `find` finds the text, it sets ERRORLEVEL to `0`; if not, to `1`. Use `if errorlevel` and `else` to print one of the two messages based on this code.', 'Parts: `if errorlevel 1` (meaning not found) → first parenthesis with `echo No pizza` → `else` → second parenthesis with `echo We have pizza`.']
      answer: ['@echo off', 'find "Pizza" "%USERPROFILE%\Documents\menu.txt" >nul', 'if errorlevel 1 (echo No pizza) else (echo We have pizza)']
      explain: '`if errorlevel 1` means “code 1 or more”, which for `find` means the text was not found. Since Pizza is on the menu, the code is `0` and the `else` part, `We have pizza`, runs.'
    - id: P81b
      batch: {file: 'server.bat', starter: "@echo off\nping -n 1 10.0.0.99 >nul\n"}
      task: 'If the ping was not successful (`%errorlevel%` was not zero), show the message `Server is down`.'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\server.bat', value: '%errorlevel%'}, {type: outputIncludes, value: 'Server is down'}]
      hints: ['After `ping`, the result code is in `%errorlevel%`: `0` means success. Use `if` to check whether this number is “not equal” to zero; the not-equal operator is `neq`.', 'Parts of the line: `if` → `%errorlevel%` → `neq 0` → then `echo` with the message `Server is down`.']
      answer: ['@echo off', 'ping -n 1 10.0.0.99 >nul', 'if %errorlevel% neq 0 echo Server is down']
      explain: 'If `ping` gets no reply, `%errorlevel%` is not zero and the condition `neq 0` is true, so the message `Server is down` is printed. `neq 0` is an exact comparison and catches any error code.'
  quiz:
    - kind: predict
      q: 'ERRORLEVEL is 3. Which lines run?'
      code: "if errorlevel 1 echo A\nif errorlevel 3 echo B\nif errorlevel 5 echo C"
      options: ['A and B', 'Only B', 'A, B and C', 'Only A']
      answer: 0
      explain: '`if errorlevel n` means n or more.'
    - kind: mcq
      q: 'Which is better for checking “not exactly zero”?'
      options: ['if %errorlevel% neq 0', 'if errorlevel 0', 'if errorlevel==0', 'if not errorlevel']
      answer: 0
      code_options: true
      explain: '`if errorlevel 0` is always true!'
    - kind: tf
      q: '`command || echo failed` does the same job as an ERRORLEVEL check, in a short form.'
      answer: true
      explain: '`||` runs when the command fails.'
  recap: '`if %errorlevel% neq 0` is exact. `if errorlevel n` = n or more. `&&` and `||` are short.'

- n: 82
  term: goto
  fullForm: 'goto · :labels'
  difficulty: 3
  objective: 'Jump around in a script and build loops with labels and `goto`.'
  summary: 'A label is a line that starts with `:`, like `:start`. `goto start` moves execution to that line. `goto :eof` goes to the end of the script.'
  meaning: 'With `goto` upwards you build a loop, so you always need an exit condition (`if ... goto end`), otherwise the loop never ends. `goto` downwards is for skipping a section.'
  usage: 'Menus, repeating until you get a result, skipping sections when an error happens.'
  syntax: ":loop\n...\nif condition goto end\ngoto loop\n:end"
  warning: 'A `goto` loop without an exit condition runs forever. In the simulator, stop it with `Ctrl+C`.'
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\countdown.bat', content: "@echo off\nset /a n=3\n:loop\necho %n%...\nset /a n-=1\nif %n% gtr 0 goto loop\necho Liftoff!\n"}]
    cmds: ['countdown.bat']
  examples:
    - c: 'goto end'
      d: 'Jumps to `:end`.'
      noTry: true
    - c: 'goto :eof'
      d: 'End of the script (a built-in label).'
      noTry: true
  mistakes:
    - 'Forgetting the exit condition.'
    - 'Writing `:` in `goto loop` is not needed, but in the label itself it is required.'
    - 'Two labels with the same name: `goto` searches downwards from the line after itself and picks the first label with that name it sees (if it finds none before the end of the file, it continues from the start of the file). The result is confusing; keep your label names unique.'
  tip: 'Give labels meaningful names: `:menu`, `:error`, `:end`.'
  practice:
    - id: P82a
      batch: {file: 'countdown.bat', starter: "@echo off\nset /a n=3\n"}
      task: 'Use a label and `goto` to print the countdown `3`, `2`, `1`, and finally `Liftoff!`.'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\countdown.bat', value: ['goto', ':']}, {type: outputOrder, value: ['3', '2', '1', 'Liftoff!']}]
      hints: ['To repeat, put a label above the part to repeat and jump back to it with `goto`. Each time, print `%n%` and subtract one; don''t forget the exit condition so the loop doesn''t run forever.', 'Order of the lines after `set /a n=3`: the label `:loop` → print `%n%` with `echo` → subtract with `set /a n-=1` → if `%n%` is still `gtr 0`, `goto loop` → after the loop, `echo Liftoff!`.']
      answer: ['@echo off', 'set /a n=3', ':loop', 'echo %n%', 'set /a n-=1', 'if %n% gtr 0 goto loop', 'echo Liftoff!']
      explain: 'The label `:loop` is the start of the loop: each round, `echo %n%` prints the number and `set /a n-=1` subtracts one. `if %n% gtr 0 goto loop` jumps back as long as `n` is greater than zero, and then execution reaches `echo Liftoff!`.'
    - id: P82b
      batch: {file: 'skip.bat', starter: "@echo off\necho Start\necho This line must be skipped\necho End\n"}
      task: 'Use `goto` and a label so that the line `This line must be skipped` does not run, but `Start` and `End` are printed.'
      checks: [{type: ranBatch}, {type: outputIncludes, value: ['Start', 'End']}, {type: outputExcludes, value: 'must be skipped'}]
      hints: ['With `goto` you can jump over a few lines to a label further down. A line between `goto` and the label does not run.', 'Add two lines: after `echo Start`, a `goto` with any name you like (for example `finish`), and right before `echo End`, that same name as a label with `:` at the start of the line.']
      answer: ['@echo off', 'echo Start', 'goto finish', 'echo This line must be skipped', ':finish', 'echo End']
      explain: '`goto finish` sends execution straight to the line `:finish`, so `echo This line must be skipped`, which is between them, does not run. `Start` is printed before the jump and `End` after the label.'
  quiz:
    - kind: predict
      q: 'Output?'
      code: "@echo off\ngoto b\n:a\necho A\n:b\necho B"
      options: ['B', 'A B', 'A', 'Nothing']
      answer: 0
      explain: 'It jumps to `:b`, so A does not run.'
    - kind: mcq
      q: 'What does `goto :eof` do?'
      options: ['Goes to the end of the script and finishes', 'Goes back to the start of the script', 'Causes an error', 'Closes CMD']
      answer: 0
      explain: 'End Of File.'
    - kind: tf
      q: 'A goto loop without an exit condition may run forever.'
      answer: true
      explain: 'Always add an exit condition.'
  recap: '`:label` and `goto label`. Loop = goto upwards + exit condition. `goto :eof` = end.'

- n: 83
  term: 'for'
  fullForm: 'for %%f in (files) do'
  difficulty: 3
  objective: 'Use `for` to repeat a command for all files matching a pattern or all items in a list.'
  summary: '`for %%f in (*.txt) do echo %%f` runs the command once for each txt file and puts the file name in `%%f`.'
  meaning: 'In a batch file, the loop variable is written with two `%%`; at the command line with one (`%f`). Inside the parentheses you can give a pattern (`*.jpg`) or a simple list (`red green blue`). `%%~nf` is just the name without extension, `%%~xf` the extension, and `%%~nxf` the full file name.'
  usage: 'Working on all files: copying, renaming, counting, reporting.'
  syntax: "for %%f in (*.txt) do command %%f\nfor %%c in (red green blue) do echo %%c"
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\photos.bat', content: "@echo off\nfor %%f in (\"%USERPROFILE%\\Pictures\\*.jpg\") do echo Photo: %%~nxf\nfor %%c in (red green blue) do echo Color: %%c\n"}]
    cmds: ['photos.bat', 'for %i in (a b c) do @echo %i']
  examples:
    - c: 'for %i in (*.txt) do @echo %i'
      d: 'At the command line (one `%`).'
    - c: 'for %%f in (*.jpg) do copy "%%f" E:\Photos'
      d: 'In a batch file: copies all jpg files.'
      noTry: true
    - c: 'for %%f in (*.txt) do echo %%~nf'
      d: 'Just the name without extension.'
      noTry: true
  mistakes:
    - 'Writing one `%` in a batch file, or two `%%` at the command line.'
    - 'The loop variable is case-sensitive: `%%f` and `%%F` are two different variables.'
    - 'Leaving out the quotes around `%%f` when file names contain spaces.'
  tip: 'At the command line, `@` before the command after `do` stops each command from being echoed.'
  practice:
    - id: P83a
      batch: {file: 'photos.bat', starter: "@echo off\n"}
      task: 'For every `.jpg` file in the user''s Pictures folder, print `Photo:` followed by the file name.'
