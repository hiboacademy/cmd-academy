      options: ['The conditions must be written from 3 down to 1', 'choice is wrong', 'The labels are wrong', 'You must write %errorlevel%']
      answer: 0
      explain: '`if errorlevel 1` is true for 1, 2 and 3.'
    - kind: mcq
      q: 'What does `timeout /t 10 /nobreak` do?'
      options: ['Waits 10 seconds and can''t be interrupted by a key', 'Waits 10 minutes', 'Waits until a key is pressed', 'Shuts down the computer']
      answer: 0
      explain: '`/nobreak` = ignore key presses.'
  recap: '`choice /c options /m "message"` → ERRORLEVEL = option number. Conditions from largest to smallest. `timeout /t n` waits.'
