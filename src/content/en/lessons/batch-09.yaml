      hints: ['To wait a few seconds in a script, use `timeout`; the `/t` switch takes the number of seconds. This command must come before printing `Done`.', 'After `echo Starting soon...`, add two lines: first `timeout` with `/t` and the number `3`, then `echo Done`.']
      answer: ['@echo off', 'echo Starting soon...', 'timeout /t 3', 'echo Done']
      explain: '`timeout /t 3` waits three seconds and shows the message `Waiting for ...`. Because it comes before `echo Done`, `Done` is printed after the wait is over.'
  quiz:
    - kind: predict
      q: 'In this choice, the user presses the key `C`. What is ERRORLEVEL?'
