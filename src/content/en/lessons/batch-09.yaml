      q: 'What does `%%~nf` give for the file `report.txt`?'
      options: ['report', 'report.txt', '.txt', 'C:\...\report.txt']
      answer: 0
      code_options: true
      explain: '`~n` = name without extension.'
  recap: '`for %%f in (pattern) do command`. One `%` at the command line. `%%~nf` name, `%%~xf` extension, `%%~nxf` both.'

- n: 84
  term: 'for /l · for /f'
  fullForm: 'Counting loops and reading files'
  difficulty: 3
  objective: 'Count with `for /l`, and read a file or a command''s output line by line with `for /f`.'
  summary: '`for /l %%i in (start,step,end)` is a counter. `for /f %%a in (file.txt)` reads each line of a file and can split the line into several parts (tokens).'
  meaning: 'In `for /f` the options go inside quotes: `tokens=1,2` means the first part goes in `%%a` and the second in `%%b`, `delims=,` means the separator is a comma (default is space), `skip=2` means skip the first two lines. With `(''command'')` you read the output of a command.'
  usage: 'Repeating a set number of times, reading lists and CSV files, processing the output of commands.'
  syntax: "for /l %%i in (1,1,5) do echo %%i\nfor /f \"tokens=1,2\" %%a in (file.txt) do echo %%a %%b\nfor /f \"delims=\" %%L in ('dir /b') do echo %%L"
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\loops.bat', content: "@echo off\nfor /l %%i in (1,1,3) do echo Round %%i\nfor /f \"skip=2 tokens=1,2\" %%a in (%USERPROFILE%\\Documents\\menu.txt) do echo %%a costs %%b\n"}]
    cmds: ['loops.bat']
  examples:
    - c: 'for /l %i in (10,-2,0) do @echo %i'
      d: 'Counting down with a negative step.'
    - c: 'for /f "delims=" %%L in (guests.txt) do echo Guest: %%L'
      d: 'Reads each whole line (no splitting).'
      noTry: true
    - c: 'for /f "tokens=2 delims=:" %%a in (''ipconfig ^| find "IPv4"'') do echo IP:%%a'
      d: 'Reads the output of a command; `^|` inside the single quotes.'
      noTry: true
  mistakes:
    - 'The order of numbers in `/l`: (start, step, end), not (start, end, step).'
    - 'Forgetting `delims=` when reading a whole line that contains spaces.'
  tip: 'With `tokens=1,2` the second variable is automatically the next letter: `%%a` and `%%b`.'
  practice:
    - id: P84a
      batch: {file: 'numbers.bat', starter: "@echo off\n"}
      task: 'Use `for /l` to print the numbers 1 to 5 as `Number 1` to `Number 5`.'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\numbers.bat', value: 'for /l'}, {type: outputOrder, value: ['Number 1', 'Number 3', 'Number 5']}, {type: outputExcludes, value: 'Number 6'}]
      hints: ['For counting, use `for /l`; three numbers go inside the parentheses: start, step and end. In each round, print the current number together with the text `Number`.', 'Parts: `for /l %%i in` → parentheses `(1,1,5)`, meaning from 1 in steps of 1 up to 5 → `do echo Number` → finally the loop variable `%%i`.']
      answer: ['@echo off', 'for /l %%i in (1,1,5) do echo Number %%i']
      explain: '`for /l %%i in (1,1,5)` is a counter that increases `%%i` one by one from 1 to 5. In each round, `echo Number %%i` prints a line like `Number 3`.'
    - id: P84b
      batch: {file: 'prices.bat', starter: "@echo off\n"}
      task: 'Read the file `%USERPROFILE%\Documents\menu.txt` with `for /f` (the first two lines are headings) and for each dish write: `Pizza costs 8.50`.'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\prices.bat', value: ['for /f', 'skip=2']}, {type: outputIncludes, value: ['Pizza costs 8.50', 'Coffee costs 2.50']}, {type: outputExcludes, value: 'Restaurant costs'}]
      hints: ['To read a file line by line, use `for /f`. Skip the first two lines with the `skip` option, and use `tokens` to get the dish name and the price separately.', 'Parts: `for /f` → options in quotes: `"skip=2 tokens=1,2"` → the variable `%%a` (the second part automatically goes into `%%b`) → `in` and the file path inside parentheses → `do echo` with `%%a`, the word `costs` and `%%b`.']
      answer: ['@echo off', 'for /f "skip=2 tokens=1,2" %%a in (%USERPROFILE%\Documents\menu.txt) do echo %%a costs %%b']
      explain: '`skip=2` skips the two heading lines, and `tokens=1,2` puts the first part of each line (the dish name) in `%%a` and the second part (the price) in `%%b`. Then `echo %%a costs %%b` builds a sentence like `Pizza costs 8.50`.'
  quiz:
    - kind: predict
      q: 'How many times does this loop run?'
      code: 'for /l %%i in (0,5,20) do echo %%i'
      options: ['5 (0, 5, 10, 15, 20)', '20', '4', '21']
      answer: 0
      explain: 'From 0 in steps of 5 up to 20.'
    - kind: mcq
      q: 'In `for /f "tokens=1,2 delims=," %%a in (data.csv)`, which variable holds the second part of each line?'
      options: ['%%b', '%%a', '%%2', '%%c']
      answer: 0
      code_options: true
      explain: 'Second token = next letter.'
    - kind: tf
      q: '`for /f` can also read the output of a command.'
      answer: true
      explain: 'With single quotes: `(''dir /b'')`.'
  recap: '`for /l (start,step,end)` counts. `for /f "tokens= delims= skip="` reads a file or output line by line.'

- n: 85
  term: '!var!'
  fullForm: 'Delayed Expansion'
  difficulty: 3
  objective: 'Understand the famous problem with variables inside loops and parentheses, and solve it with delayed expansion.'
  summary: 'CMD replaces all `%var%` in a parenthesized block (like the body of a `for` or `if`) **once**, **before it runs**. So a change to a variable inside the loop isn''t visible with `%var%`. The solution: `setlocal enabledelayedexpansion` and writing `!var!`.'
  meaning: '`!var!` reads the current value every time it runs. `setlocal` also keeps variable changes local until `endlocal` (or the end of the script), so they don''t clutter the CMD environment.'
  usage: 'A counter in a loop, building text step by step, any variable that changes inside `( )`.'
  syntax: "setlocal enabledelayedexpansion\nset count=0\nfor %%f in (*.txt) do (\n  set /a count+=1\n  echo !count!. %%f\n)\nendlocal"
  demo:
    start: 'C:\Users\Student\Desktop'
    files:
      - {path: 'C:\Users\Student\Desktop\wrong.bat', content: "@echo off\nset count=0\nfor %%f in (a b c) do (\n  set /a count+=1\n  echo %%f: count is %count%\n)\n"}
      - {path: 'C:\Users\Student\Desktop\right.bat', content: "@echo off\nsetlocal enabledelayedexpansion\nset count=0\nfor %%f in (a b c) do (\n  set /a count+=1\n  echo %%f: count is !count!\n)\nendlocal\n"}
    cmds: ['wrong.bat', 'right.bat']
  examples:
    - c: 'setlocal enabledelayedexpansion'
      d: 'Turns on delayed expansion (usually the second line of the script).'
      noTry: true
    - c: 'echo !count!'
      d: 'Reads the current value.'
      noTry: true
  mistakes:
    - 'Writing `!var!` without `setlocal enabledelayedexpansion`; the text `!var!` itself gets printed.'
    - 'Being surprised that `%count%` inside the loop is always zero.'
  tip: 'Outside the loop, after it has finished, `%count%` correctly shows the final value.'
  practice:
    - id: P85a
      batch: {file: 'list.bat', starter: "@echo off\nset count=0\nfor %%f in (\"%USERPROFILE%\\Documents\\*.txt\") do (\n  set /a count+=1\n  echo %count%. %%~nxf\n)\n"}
      task: 'This script should print a numbered list of files (`1. guests.txt` ...), but all the numbers are `0`. Fix it with delayed expansion.'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\list.bat', value: ['enabledelayedexpansion', '!count!']}, {type: outputIncludes, value: ['1. guests.txt', '3. todo.txt']}]
      hints: ['The problem is that `%count%` inside the loop''s parentheses is read only once, before it runs. You need to turn on delayed expansion and read the current value with `!`.', 'Two changes are needed: 1) right after `@echo off`, the line that turns on delayed expansion: `setlocal enabledelayedexpansion`. 2) inside the loop, change `%count%` to `!count!`. (You can also add `endlocal` at the end.)']
      answer: ['@echo off', 'setlocal enabledelayedexpansion', 'set count=0', 'for %%f in ("%USERPROFILE%\Documents\*.txt") do (', '  set /a count+=1', '  echo !count!. %%~nxf', ')', 'endlocal']
      explain: '`setlocal enabledelayedexpansion` lets `!count!` read the variable''s current value each time, so after every `set /a count+=1` the correct number (1, 2, 3) is printed. `endlocal` at the end keeps the variable changes local.'
  quiz:
    - kind: predict
      q: 'Without delayed expansion, what does the second line print?'
      code: "set x=1\n(set x=2\n echo %x%)"
      options: ['1', '2', '%x%', 'Error']
      answer: 0
      explain: 'The whole parenthesized block was filled in with x=1 before it ran.'
    - kind: mcq
      q: 'Which line is needed to use `!var!`?'
      options: ['setlocal enabledelayedexpansion', 'set /a', 'echo on', 'call']
      answer: 0
      code_options: true
      explain: 'Without it, `!` has no special meaning.'
    - kind: tf
      q: 'The delayed expansion problem only happens inside parenthesized blocks.'
      answer: true
      explain: 'Separate lines are each filled in on their own.'
  recap: 'Inside `( )`, `%var%` is replaced once. `setlocal enabledelayedexpansion` + `!var!` = the current value.'

- n: 86
  term: call
  fullForm: 'call :label · call script.bat'
  difficulty: 3
  objective: 'Use `call` to build reusable parts (functions), and to run another script and come back.'
  summary: '`call :name args` goes to a label, runs it like a function, and when it reaches `goto :eof` or `exit /b` it returns to the line after `call`. `call other.bat` runs another script and then continues.'
  meaning: 'Inside the function, the arguments given to `call` itself are read with `%1`, `%2`. Without `call`, running `other.bat` ends the main script and never comes back. `exit /b 1` can return an error code.'
  usage: 'Avoiding repeated code, splitting a big script into small parts, helper scripts.'
  syntax: "call :greet Ali\ngoto :eof\n:greet\necho Hi %1\nexit /b"
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\func.bat', content: "@echo off\ncall :greet Ali\ncall :greet Mina\necho Done.\ngoto :eof\n\n:greet\necho Hi %1, welcome to the restaurant!\nexit /b\n"}]
    cmds: ['func.bat']
  examples:
    - c: 'call :log "Backup started"'
      d: 'A function that writes a message to a log.'
      noTry: true
    - c: 'call helper.bat hello'
      d: 'Runs another script and comes back.'
      noTry: true
  mistakes:
    - 'Forgetting `goto :eof` before the functions; after the main work, the script falls into the functions and runs them for no reason.'
    - 'Running another script without `call` and being surprised that the rest of the script didn''t run.'
  tip: 'Write the functions at the end of the script and put `goto :eof` right before them.'
  practice:
    - id: P86a
      batch: {file: 'func.bat', starter: "@echo off\n"}
      task: 'Write a function `:greet` that prints `Hi` and its own first argument. Call it once for `Ali` and once for `Mina`, and finally print `Done`.'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\func.bat', value: ['call :greet', ':greet']}, {type: outputOrder, value: ['Hi Ali', 'Hi Mina', 'Done']}]
      hints: ['A function is a label at the bottom of the script that is called with `call :name` and returns with `exit /b`; inside the function the first argument is in `%1`. Put `goto :eof` before the function so the script doesn''t fall into it.', 'Order of the lines: two `call :greet` lines (one with `Ali`, one with `Mina`) → `echo Done` → `goto :eof` → the label `:greet` → `echo Hi` together with `%1` → `exit /b`.']
      answer: ['@echo off', 'call :greet Ali', 'call :greet Mina', 'echo Done', 'goto :eof', ':greet', 'echo Hi %1', 'exit /b']
      explain: 'Each `call :greet` goes to the label `:greet`, `echo Hi %1` prints the given name, and `exit /b` returns to the line after `call`. `goto :eof` after `echo Done` makes sure the script doesn''t fall into the function after the main work.'
    - id: P86b
      batch: {file: 'main.bat', starter: "@echo off\n"}
      files: [{path: 'C:\Users\Student\Desktop\helper.bat', content: "@echo off\necho Helper says %1\n"}]
      task: 'There is a file `helper.bat` on the Desktop. From `main.bat`, call it with the argument `hello`, and then print `Back in main`.'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\main.bat', value: 'call'}, {type: outputOrder, value: ['Helper says hello', 'Back in main']}]
      hints: ['To run another script and come back to the current one, you must use `call`; without it, `main.bat` doesn''t continue after `helper.bat`.', 'Two lines: first `call` + the file name `helper.bat` + the argument `hello`. Second `echo` with the text `Back in main`.']
      answer: ['@echo off', 'call helper.bat hello', 'echo Back in main']
      explain: '`call helper.bat hello` runs the helper file with the argument `hello` (so `%1` in it is `hello`), and then control returns to `main.bat`. That''s why `echo Back in main` runs after it.'
  quiz:
    - kind: predict
      q: 'Output? (main.bat)'
      code: "@echo off\nother.bat\necho After"
      options: ['Only the output of other.bat; After is not printed', 'The output of other.bat, then After', 'Only After', 'Error']
      answer: 0
      explain: 'Without `call`, control doesn''t come back.'
    - kind: mcq
      q: 'Why do we put `goto :eof` before the functions?'
      options: ['So the script doesn''t fall into the functions after the main work', 'To make the functions faster', 'It is required for call', 'To clear the screen']
      answer: 0
      explain: 'Otherwise the functions run one extra time.'
    - kind: tf
      q: 'Inside a function, `%1` is the first argument of the `call` itself, not of the script.'
      answer: true
      explain: 'Each call has its own arguments.'
  recap: '`call :label args` = function, returns with `exit /b`. `call file.bat` = run another script and come back.'

- n: 87
  term: choice
  fullForm: 'choice · timeout · menus'
  difficulty: 3
  objective: 'Build a simple menu where the user chooses with a single key, and pause a script for a few seconds.'
  summary: '`choice /c 123 /m "Choose"` waits for one of the keys 1, 2 or 3 and puts the option number in ERRORLEVEL (first = 1, second = 2 ...). `timeout /t 5` waits five seconds.'
  meaning: 'Because `if errorlevel n` means “n or more”, write the conditions from the largest option to the smallest, or use `if %errorlevel% equ n`. `timeout /t 5 /nobreak` can''t be interrupted by pressing a key.'
  usage: 'Tool menus, asking for Y/N confirmation, waiting before repeating a task.'
  syntax: "choice /c YN /m \"Continue?\"\nif errorlevel 2 goto no\ntimeout /t 5"
  demo:
    start: 'C:\Users\Student\Desktop'
    inputs: ['1', '2', '3']
    files: [{path: 'C:\Users\Student\Desktop\menu.bat', content: "@echo off\n:menu\necho.\necho 1. Show date\necho 2. Show user\necho 3. Quit\nchoice /c 123 /m \"Choose\"\nif errorlevel 3 goto end\nif errorlevel 2 goto user\necho Today is %DATE%\ngoto menu\n:user\necho You are %USERNAME%\ngoto menu\n:end\necho Bye!\n"}]
    cmds: ['menu.bat']
  examples:
    - c: 'choice /c YN /m "Delete old logs?"'
      d: 'A yes/no question.'
      noTry: true
    - c: 'choice /c ABC /t 10 /d A'
      d: 'If no key is pressed within 10 seconds, A is chosen.'
      noTry: true
    - c: 'timeout /t 3'
      d: 'Waits three seconds.'
  mistakes:
    - 'Writing the conditions from smallest to largest with `if errorlevel`: option 1 always wins.'
    - 'Using `timeout` in a script whose input is redirected.'
  tip: 'For a menu: show the options with echo → `choice` → jump with `if errorlevel` → go back with `goto menu`.'
  practice:
