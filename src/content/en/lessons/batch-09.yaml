      hints: ['Give `choice` the allowed keys (`Y` and `N`) with the `/c` switch, and the question text with `/m`. The number of the key pressed goes into ERRORLEVEL: `Y` = 1 and `N` = 2.', 'Two lines: 1) `choice /c YN` + `/m` with the text `"Continue?"`. 2) `if errorlevel 2` (meaning N) → parenthesis with `echo Stopped` → `else` → parenthesis with `echo Continuing`.']
      answer: ['@echo off', 'choice /c YN /m "Continue?"', 'if errorlevel 2 (echo Stopped) else (echo Continuing)']
      explain: '`choice /c YN` waits for `Y` or `N`, and for `N` (the second option) it sets ERRORLEVEL to 2. `if errorlevel 2` is true for 2 or more, so `Stopped` is printed; with `Y`, the `else` part, `Continuing`, would run.'
    - id: P87b
