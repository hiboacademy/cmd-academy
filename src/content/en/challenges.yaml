- id: C17
  level: 2
  after: 41
  title: 'The hidden file'
  story: 'You''ve heard there is a hidden file in Documents that a normal `dir` doesn''t show.'
  task: 'Find the hidden file in Documents, remove its Hidden attribute, and read its contents.'
  start: 'C:\Users\Student\Documents'
