# Challenges: real-world scenarios, checked by the result in the sandbox.
# level 1 = beginner, 2 = intermediate, 3 = advanced (Batch).
# after = the lesson that teaches everything needed.

# ---------------- Level 1 ----------------
- id: C1
  level: 1
  after: 18
  title: 'First day at the restaurant'
  story: 'The restaurant manager has asked you to make a place for the restaurant''s files on the office computer.'
  task: 'In the current folder, create the folder `Restaurant`, and inside it create two folders: `Menu` and `Orders`.'
  start: 'C:\Users\Student'
  multi: true
  checks:
    - {type: dirExists, path: 'C:\Users\Student\Restaurant\Menu'}
    - {type: dirExists, path: 'C:\Users\Student\Restaurant\Orders'}
  hints: ['`mkdir` can create several levels of folders at once.', '`mkdir Restaurant\Menu Restaurant\Orders`']
  answer: 'mkdir Restaurant\Menu Restaurant\Orders'
  tags: ['mkdir', 'folder']

- id: C2
  level: 1
  after: 20
  title: 'Where is the menu?'
  story: 'The chef asks which dishes are on the menu today. The menu file is in the Documents folder of the user Student, but right now you are in the root of drive C.'
  task: 'Without changing folders, show the contents of the file `menu.txt`.'
  start: 'C:\'
  checks:
    - {type: lastOutputIncludes, value: 'Restaurant Menu'}
    - {type: cwd, value: 'C:\'}
  hints: ['Use an absolute path.', '`type C:\Users\Student\Documents\menu.txt`']
  answer: 'type C:\Users\Student\Documents\menu.txt'
  tags: ['type', 'absolute path']

- id: C3
  level: 1
  after: 21
  title: 'Notes on a USB stick'
  story: 'You want to take your notes home with you. The USB stick is drive `E:`.'
  task: 'Copy the file `notes.txt` from the Desktop to the root of the USB stick (`E:\`). The original file must stay where it is.'
  start: 'C:\Users\Student'
  checks:
    - {type: fileExists, path: 'E:\notes.txt'}
    - {type: fileExists, path: 'C:\Users\Student\Desktop\notes.txt'}
  hints: ['`copy SOURCE DESTINATION`', '`copy Desktop\notes.txt E:\`']
  answer: 'copy Desktop\notes.txt E:\'
  tags: ['copy', 'USB stick']

- id: C4
  level: 1
  after: 22
  title: 'The missing invoice'
  story: 'Last month''s purchase invoice is still in Downloads, and the accountant is looking for it in Documents.'
  task: 'Move (don''t copy) the file `invoice.pdf` from Downloads to Documents.'
  start: 'C:\Users\Student\Downloads'
  checks:
    - {type: fileExists, path: 'C:\Users\Student\Documents\invoice.pdf'}
    - {type: fileNotExists, path: 'C:\Users\Student\Downloads\invoice.pdf'}
  hints: ['To move a file, use `move`.', '`move invoice.pdf ..\Documents`']
  answer: 'move invoice.pdf ..\Documents'
  tags: ['move', 'relative path']

- id: C5
  level: 1
  after: 26
  title: 'Cleaning up Downloads'
  story: 'The Downloads folder is full of temporary files. Only the `.tmp` files should be deleted; the other files are important.'
  task: 'Delete all `.tmp` files in Downloads with one command.'
  start: 'C:\Users\Student\Downloads'
  checks:
    - {type: countFiles, path: 'C:\Users\Student\Downloads\*.tmp', value: 0}
    - {type: fileExists, path: 'C:\Users\Student\Downloads\setup.exe'}
    - {type: fileExists, path: 'C:\Users\Student\Downloads\photos.zip'}
  hints: ['Use the wildcard `*`.', 'First use `dir *.tmp` to see which files are selected, then `del *.tmp`.']
  answer: 'del *.tmp'
  tags: ['del', 'wildcard', 'cleanup']

- id: C6
  level: 1
  after: 27
  title: 'Single-digit reports'
  story: 'In `Documents\Work` there are monthly reports: report1, report2 and report10. The manager wants only the reports for single-digit months in the backup.'
  task: 'Copy only `report1.txt` and `report2.txt` to `D:\Backup`; `report10.txt` must not be copied. Use one command and a wildcard.'
  start: 'C:\Users\Student\Documents\Work'
  checks:
    - {type: fileExists, path: 'D:\Backup\report1.txt'}
    - {type: fileExists, path: 'D:\Backup\report2.txt'}
    - {type: fileNotExists, path: 'D:\Backup\report10.txt'}
  hints: ['`*` matches any number of characters, so it would select report10 too.', '`?` matches exactly one character: `copy report?.txt D:\Backup`']
  answer: 'copy report?.txt D:\Backup'
  tags: ['wildcard', '?', 'copy']

- id: C7
  level: 1
  after: 28
  title: 'A file list for a coworker'
  story: 'Your coworker wants to know which files are in Documents, but they can''t access your computer.'
  task: 'Save only the names of the files and folders in Documents (without dates and sizes) to the file `C:\Users\Student\Desktop\files.txt`.'
  start: 'C:\Users\Student'
  checks:
    - {type: fileContains, path: 'C:\Users\Student\Desktop\files.txt', value: ['menu.txt', 'guests.txt', 'Work']}
    - {type: not, check: {type: fileContains, path: 'C:\Users\Student\Desktop\files.txt', value: '<DIR>'}}
  hints: ['`dir /b` gives only the names.', '`dir Documents /b > Desktop\files.txt`']
  answer: 'dir Documents /b > Desktop\files.txt'
  tags: ['dir', '>', 'redirect']

- id: C8
  level: 1
  after: 29
  title: 'The order book'
  story: 'Table 4 has ordered: one Pizza and one Pasta. The orders need to be written down in a text file.'
  task: 'On the Desktop, create the file `orders.txt` with exactly two lines: `Pizza` and then `Pasta`.'
  start: 'C:\Users\Student\Desktop'
  multi: true
  checks:
    - {type: fileOrder, path: 'C:\Users\Student\Desktop\orders.txt', value: ['Pizza', 'Pasta']}
    - {type: fileLines, path: 'C:\Users\Student\Desktop\orders.txt', value: 2}
  hints: ['The first line with `>` and the second line with `>>`.', '`echo Pizza> orders.txt` and then `echo Pasta>> orders.txt`']
  answer: ['echo Pizza> orders.txt', 'echo Pasta>> orders.txt']
  tags: ['echo', '>>', 'append']

- id: C9
  level: 1
  after: 31
  title: 'Only if it was created'
  story: 'You want to create the reports folder and see the message `Ready` only if it was really created.'
  task: 'In one line: create the folder `Reports` and print `Ready` only if that succeeded.'
  start: 'C:\Users\Student'
  checks:
    - {type: dirExists, path: 'C:\Users\Student\Reports'}
    - {type: usedOp, value: '&&'}
    - {type: lastOutputIncludes, value: 'Ready'}
  hints: ['`&&` runs the second command only after the first one succeeds.', '`mkdir Reports && echo Ready`']
  answer: 'mkdir Reports && echo Ready'
  tags: ['&&', 'chaining']

# ---------------- Level 2 ----------------
