- id: C15
  level: 2
  after: 65
  title: 'The printer is stuck'
  story: 'The print queue is stuck and nothing prints. The usual fix: stop the Print Spooler service once and start it again.'
  task: 'Restart the `Spooler` service (stop it and start it again). CMD is open with administrator rights.'
  admin: true
  multi: true
  checks:
    - {type: serviceState, name: Spooler, value: RUNNING}
    - {type: any, of: [{type: outputIncludes, value: 'stopped successfully'}, {type: outputIncludes, value: 'STOP_PENDING'}]}
  hints: ['`net stop` and `net start` with the service name.', '`net stop spooler && net start spooler`']
  answer: 'net stop spooler && net start spooler'
  tags: ['service', 'net', 'sc', 'printer']

