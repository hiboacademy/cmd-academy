- id: C11
  level: 2
  after: 38
  title: 'Sales reports'
  story: 'The accountant asks which txt files in Documents (and its subfolders) contain the word `sales`.'
  task: 'Find only the names of the files that contain the word sales (ignoring upper/lower case) and save them to `C:\Users\Student\Desktop\sales.txt`.'
  start: 'C:\Users\Student\Documents'
  checks:
    - {type: fileContains, path: 'C:\Users\Student\Desktop\sales.txt', value: ['report.txt', 'report1.txt', 'report10.txt']}
    - {type: not, check: {type: fileContains, path: 'C:\Users\Student\Desktop\sales.txt', value: 'menu.txt'}}
  hints: ['`findstr` with `/s` searches subfolders, `/m` shows only file names, and `/i` ignores case.', '`findstr /s /m /i "sales" *.txt > C:\Users\Student\Desktop\sales.txt`']
  answer: 'findstr /s /m /i "sales" *.txt > C:\Users\Student\Desktop\sales.txt'
  tags: ['findstr', 'search']

- id: C12
  level: 2
  after: 54
  title: 'An IP for tech support'
  story: 'Network support only wants your computer''s IPv4 address, not the whole output of `ipconfig`.'
  task: 'Pick out only the IPv4 line from the output of `ipconfig` and save it to `Desktop\ip.txt`.'
  start: 'C:\Users\Student'
  checks:
    - {type: fileContains, path: 'C:\Users\Student\Desktop\ip.txt', value: '192.168.1.24'}
    - {type: not, check: {type: fileContains, path: 'C:\Users\Student\Desktop\ip.txt', value: 'Gateway'}}
  hints: ['Send the output to `find` with `|`.', '`ipconfig | find "IPv4" > Desktop\ip.txt`']
  answer: 'ipconfig | find "IPv4" > Desktop\ip.txt'
  tags: ['ipconfig', 'pipe', 'find']

- id: C13
  level: 2
  after: 52
  title: 'The music app froze'
  story: 'Spotify has frozen and isn''t responding. Chrome is open and must not be closed.'
  task: 'Close only the frozen program.'
  start: 'C:\Users\Student'
  multi: true
  checks:
    - {type: procGone, value: 'Spotify.exe'}
    - {type: not, check: {type: procGone, value: 'chrome.exe'}}
  hints: ['Find the name or PID with `tasklist` or `tasklist /fi "status eq not responding"`.', 'A frozen program doesn''t respond to a normal request: `taskkill /im Spotify.exe /f`']
  answer: ['tasklist /fi "status eq not responding"', 'taskkill /im Spotify.exe /f']
  tags: ['taskkill', 'tasklist', 'frozen']

- id: C14
  level: 2
  after: 56
  title: 'Is the router answering?'
  story: 'The internet is slow. First you need to check whether the connection to the router (Default Gateway) is working.'
  task: 'Find the Default Gateway address and ping it only 2 times.'
  start: 'C:\Users\Student'
  multi: true
  checks:
