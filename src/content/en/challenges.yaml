- id: C21
  level: 3
  after: 76
  title: 'Showing a file with a parameter'
  story: 'You want a script that takes any file name and shows its contents if it exists, or says `Missing` if it doesn''t.'
  task: 'In `show.bat`: if the file given in `%1` exists, `type` it; otherwise print `Missing`. (The test runs with the argument `C:\Users\Student\Documents\menu.txt`.)'
  batch: {file: 'show.bat', starter: "@echo off\n", args: 'C:\Users\Student\Documents\menu.txt'}
  checks:
    - {type: ranBatch}
    - {type: outputIncludes, value: 'Restaurant Menu'}
    - {type: outputExcludes, value: 'Missing'}
  hints: ['`if exist "%~1" (...) else (...)`', '`if exist "%~1" (type "%~1") else (echo Missing)`']
  answer: ['@echo off', 'if exist "%~1" (type "%~1") else (echo Missing)']
  tags: ['%1', 'if exist', 'parameter']

- id: C22
  level: 3
  after: 87
  title: 'A help desk menu'
  story: 'Build a menu for non-technical coworkers: 1 = show IP, 2 = show computer name.'
  task: 'In `helpdesk.bat`, ask with `choice /c 12` and run the chosen option with `if errorlevel` or `%errorlevel%`. Option 1 must show the IP address (the output of `ipconfig`) and option 2 the output of `hostname`. Run the script, and when the menu appears, press the `1` key.'
  batch: {file: 'helpdesk.bat', starter: "@echo off\necho 1. IP address\necho 2. Computer name\n"}
  inputs: ['1']
  checks:
    - {type: ranBatch}
    - {type: outputIncludes, value: '192.168.1.24'}
    - {type: outputExcludes, value: 'ACADEMY-PC'}
  hints: ['`choice /c 12 /m "Choose"` and then `if errorlevel 2 goto name`.', 'Check errorlevel from the largest value to the smallest; put `goto :eof` after each section.']
  answer: ['@echo off', 'echo 1. IP address', 'echo 2. Computer name', 'choice /c 12 /m "Choose"', 'if errorlevel 2 goto name', 'ipconfig', 'goto :eof', ':name', 'hostname']
  tags: ['choice', 'menu', 'goto', 'errorlevel']

- id: C23
  level: 3
  after: 89
  title: 'Backup with a report'
  story: 'The nightly backup must write its result to a log, so that in the morning you know whether it worked.'
  task: 'In `nightly.bat`, copy the txt files in Documents to `D:\Backup\Texts` (create the folder if needed). If it succeeds, append `OK` to the end of `D:\Backup\log.txt`; if not, append `FAILED`.'
  batch: {file: 'nightly.bat', starter: "@echo off\n"}
  checks:
    - {type: ranBatch}
    - {type: fileExists, path: 'D:\Backup\Texts\menu.txt'}
    - {type: fileContains, path: 'D:\Backup\log.txt', value: 'OK'}
    - {type: not, check: {type: fileContains, path: 'D:\Backup\log.txt', value: 'FAILED'}}
  hints: ['`if not exist D:\Backup\Texts mkdir D:\Backup\Texts`', '`copy ... >nul && echo OK>> D:\Backup\log.txt || echo FAILED>> D:\Backup\log.txt`']
  answer: ['@echo off', 'if not exist D:\Backup\Texts mkdir D:\Backup\Texts', 'copy "%USERPROFILE%\Documents\*.txt" D:\Backup\Texts >nul && echo OK>> D:\Backup\log.txt || echo FAILED>> D:\Backup\log.txt']
  tags: ['backup', 'log', '&&', '||']

- id: C24
  level: 3
  after: 92
  title: 'Smart cleanup'
  story: 'The weekly maintenance script must delete the `.tmp` files from Downloads and the user''s Temp folder, but leave every other file alone.'
  task: 'In `cleanup.bat`, quietly delete all `.tmp` files from `%USERPROFILE%\Downloads` and `%TEMP%`, and print `Cleanup done` at the end.'
  batch: {file: 'cleanup.bat', starter: "@echo off\n"}
  checks:
    - {type: ranBatch}
    - {type: countFiles, path: 'C:\Users\Student\Downloads\*.tmp', value: 0}
    - {type: countFiles, path: 'C:\Users\Student\AppData\Local\Temp\*.tmp', value: 0}
    - {type: fileExists, path: 'C:\Users\Student\AppData\Local\Temp\setup_log.txt'}
    - {type: fileExists, path: 'C:\Users\Student\Downloads\setup.exe'}
    - {type: outputIncludes, value: 'Cleanup done'}
  hints: ['`del /q "%TEMP%\*.tmp"`', 'Do the same for both folders, then `echo Cleanup done`.']
  answer: ['@echo off', 'del /q "%USERPROFILE%\Downloads\*.tmp" 2>nul', 'del /q "%TEMP%\*.tmp" 2>nul', 'echo Cleanup done']
  tags: ['del', 'temp', 'maintenance']
