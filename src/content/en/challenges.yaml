# ---------------- Level 3 (Batch) ----------------
- id: C18
  level: 3
  after: 74
  title: 'Welcoming a guest'
  story: 'The restaurant wants a script that asks for the guest''s name and welcomes them.'
  task: 'In `greet.bat`, ask for the guest''s name with `set /p`, then print `Welcome, NAME`. Run the script, and when it asks for the name, enter `Sara`.'
  batch: {file: 'greet.bat', starter: "@echo off\n"}
  inputs: ['Sara']
  checks:
    - {type: ranBatch}
    - {type: outputIncludes, value: 'Welcome, Sara'}
  hints: ['`set /p name=Your name: `', 'Then: `echo Welcome, %name%`']
  answer: ['@echo off', 'set /p name=Your name: ', 'echo Welcome, %name%']
  tags: ['batch', 'set /p', 'input']

- id: C19
  level: 3
  after: 83
  title: 'Table numbers'
  story: 'To print labels for the tables, you need a list from `Table 1` to `Table 8`.'
  task: 'In `tables.bat`, use a `for /l` loop to print the lines `Table 1` to `Table 8`.'
  batch: {file: 'tables.bat', starter: "@echo off\n"}
  checks:
    - {type: ranBatch}
    - {type: outputOrder, value: ['Table 1', 'Table 2', 'Table 8']}
    - {type: outputExcludes, value: 'Table 9'}
    - {type: usedOp, value: 'for'}
  hints: ['`for /l %%i in (start,step,end) do ...`', '`for /l %%i in (1,1,8) do echo Table %%i`']
  answer: ['@echo off', 'for /l %%i in (1,1,8) do echo Table %%i']
  tags: ['for /l', 'loop']

- id: C20
  level: 3
  after: 84
  title: 'Seasonal archive'
  story: 'For the archive, `D:\Archive` needs one folder for each season: Spring, Summer, Autumn and Winter.'
  task: 'In `seasons.bat`, use a `for` loop to create these four folders inside `D:\Archive`.'
