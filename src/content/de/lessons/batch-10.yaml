- n: 99
  term: 'Troubleshooting'
  fullForm: 'A basic Windows troubleshooting workflow'
  difficulty: 3
  objective: 'Einen geordneten Ablauf zur Fehlersuche bei den häufigsten Windows-Problemen haben.'
  summary: 'Gute Fehlersuche ist kein Raten: Beschreibe das Problem genau, sammle Informationen, beginne mit der einfachsten Ursache, ändere jeweils nur eine Sache und prüfe das Ergebnis.'
  meaning: 'Die Übersicht: langsam → `tasklist` (Speicher), `taskkill` für ein hängendes Programm. Internet → der Ablauf aus Lektion 61. Drucker → `sc query spooler` und den Dienst neu starten. Systemfehler → `dism` und `sfc`. Laufwerksfehler → `chkdsk`. Windows startet nicht → WinRE, Dateien retten, `bootrec`.'
  usage: 'Technischer Support für dich selbst, deine Familie oder am Arbeitsplatz.'
  syntax: "tasklist /fi \"memusage gt 100000\"\nsc query spooler\nipconfig & ping 8.8.8.8\nsfc /scannow"
  demo:
    admin: true
    cmds: ['tasklist /fi "status eq not responding"', 'sc query spooler | find "STATE"', 'ping -n 1 8.8.8.8']
  examples:
    - c: 'tasklist /fi "status eq not responding"'
      d: 'Hängende Programme.'
    - c: 'systeminfo | find "Boot Time"'
      d: 'Wurde der Computer vor Kurzem neu gestartet?'
    - c: 'dir C:\ | find "bytes free"'
      d: 'Freier Speicherplatz auf C:.'
  mistakes:
    - 'Mehrere Dinge gleichzeitig ändern – dann weißt du nicht, was das Problem gelöst hat.'
    - 'Direkt zu den schweren Werkzeugen greifen (format, Neuinstallation).'
  tip: 'Notiere alles, was du getan hast (auch einfach mit `>>` in einer Datei). Kommt das Problem zurück, weißt du, wo du anfangen musst.'
  practice:
    - id: P99a
      start: 'C:\Windows\System32'
      admin: true
      task: 'Ein Benutzer sagt: „Der Computer ist langsam und der Drucker druckt nicht.“ Finde das Programm, das nicht reagiert, und beende es, und starte den Dienst `Spooler` neu.'
      multi: true
      checks: [{type: procGone, value: 'Spotify.exe'}, {type: serviceState, name: Spooler, value: RUNNING}, {type: any, of: [{type: argIncludes, cmd: net, value: 'stop'}, {type: argIncludes, cmd: sc, value: 'stop'}]}, {type: anyCmd, value: tasklist}]
      hints: ['Löse die zwei Probleme nacheinander: 1) Finde mit `tasklist` und dem Filter `/fi` das Programm, das nicht reagiert (Status not responding), und beende es mit `taskkill`. 2) Stoppe den Druckdienst (`Spooler`) mit `net` und starte ihn wieder.', 'Die Reihenfolge: `tasklist /fi` mit dem Filter `"status eq not responding"` → in der Ausgabe den Programmnamen ablesen → `taskkill /im` + der Name dieses Programms + `/f` → `net stop spooler` → `net start spooler`.']
      answer: ['tasklist /fi "status eq not responding"', 'taskkill /im Spotify.exe /f', 'net stop spooler', 'net start spooler']
      explain: '`tasklist /fi "status eq not responding"` zeigt nur die hängenden Programme (hier `Spotify.exe`), und `taskkill /im Spotify.exe /f` beendet es zwangsweise. `net stop spooler` und danach `net start spooler` starten den Druckdienst neu, damit die festhängende Warteschlange frei wird.'
  quiz:
    - kind: order
      q: 'Bringe den allgemeinen Ablauf der Fehlersuche in die richtige Reihenfolge.'
      items: ['Das Problem genau beschreiben', 'Informationen sammeln', 'Die einfachste Ursache testen', 'Das Ergebnis prüfen und notieren']
      explain: 'Beschreiben → Informationen → einfacher Test → Prüfung.'
    - kind: mcq
      q: 'Der Drucker druckt nicht, und die Druckwarteschlange hängt. Welcher Befehl passt als Erstes?'
      options: ['sc query spooler', 'format C:', 'bootrec /fixmbr', 'diskpart']
      answer: 0
      code_options: true
      explain: 'Sieh dir den Status des Druckdienstes an.'
    - kind: tf
      q: 'Es ist besser, in jedem Schritt nur eine Sache zu ändern.'
      answer: true
      explain: 'Damit du weißt, welche Änderung das Problem gelöst hat.'
  recap: 'Problem beschreiben → Informationen sammeln → einfachste Ursache → jeweils eine Änderung → prüfen und notieren.'

- n: 100
  term: 'toolbox.bat'
  fullForm: 'Final project'
  difficulty: 3
  objective: 'Alles, was du gelernt hast, in einem vollständigen Werkzeug mit Menü kombinieren.'
  summary: 'Das Abschlussprojekt ist eine „Werkzeugkiste“: ein Menü mit `choice`, das Systeminformationen anzeigt, ein Backup von Documents macht, temporäre Dateien löscht und sich beendet.'
  meaning: 'Dieses Projekt verwendet Variablen, `choice` und `if errorlevel`, Labels und `goto`, `call :function`, `xcopy`, `del` mit Platzhalter, `>>` fürs Log und `if exist`. Schreibe und teste jeden Teil einzeln und setze sie dann zusammen.'
  usage: 'Ein echtes Werkzeug, das du auf deinem eigenen Computer behalten und erweitern kannst.'
  syntax: ":menu\nchoice /c 1234 /m \"Choose\"\nif errorlevel 4 goto end\n...\ncall :log \"message\""
  demo:
    start: 'C:\Users\Student\Desktop'
    inputs: ['1', '4']
    files: [{path: 'C:\Users\Student\Desktop\toolbox.bat', content: "@echo off\ntitle CMD Academy Toolbox\nset \"log=%USERPROFILE%\\Desktop\\toolbox.log\"\n:menu\necho.\necho ===== TOOLBOX =====\necho 1. System info\necho 2. Backup Documents\necho 3. Clean temp files\necho 4. Quit\nchoice /c 1234 /m \"Choose\"\nif errorlevel 4 goto end\nif errorlevel 3 goto clean\nif errorlevel 2 goto backup\n:info\necho Computer: %COMPUTERNAME%   User: %USERNAME%\nipconfig | find \"IPv4\"\ncall :log \"info shown\"\ngoto menu\n:backup\nxcopy \"%USERPROFILE%\\Documents\" \"D:\\Backup\\Documents\" /s /i /y /q\ncall :log \"backup done\"\ngoto menu\n:clean\nif exist \"%TEMP%\\*.tmp\" del /q \"%TEMP%\\*.tmp\"\necho Temp files cleaned.\ncall :log \"temp cleaned\"\ngoto menu\n:end\necho Bye!\ngoto :eof\n\n:log\necho %DATE% %TIME% - %~1 >> \"%log%\"\nexit /b\n"}]
    cmds: ['toolbox.bat']
  examples:
    - c: 'call :log "backup done"'
      d: 'Eine Funktion fürs Log.'
      noTry: true
    - c: 'title CMD Academy Toolbox'
      d: 'Der Fenstertitel.'
  mistakes:
    - 'Alles auf einmal schreiben und dann den Fehler nicht finden – bau es Schritt für Schritt.'
    - '`goto menu` am Ende jedes Abschnitts vergessen.'
  tip: 'Wenn du fertig bist, füge selbst eine neue Option hinzu, z. B. „5. Ping Google“.'
  practice:
    - id: P100a
      batch: {file: 'toolbox.bat', starter: "@echo off\n:menu\necho 1. System info\necho 2. Backup Documents\necho 3. Clean temp files\necho 4. Quit\nchoice /c 1234 /m \"Choose\"\n"}
      inputs: ['1', '2', '3', '4']
      task: 'Vervollständige das Werkzeugkisten-Menü: 1 soll den Computernamen (`%COMPUTERNAME%`) und die IPv4-Zeile anzeigen, 2 den Ordner Documents mit Unterordnern nach `D:\Backup\Documents` kopieren, 3 alle `*.tmp`-Dateien in `%TEMP%` löschen und 4 mit der Meldung `Bye!` beenden. Nach jeder Option geht es zurück zum Menü. (Teste 1, 2, 3 und dann 4.)'
      checks: [{type: ranBatch}, {type: outputIncludes, value: ['ACADEMY-PC', '192.168.1.24', 'Bye!']}, {type: fileExists, path: 'D:\Backup\Documents\Work\report.txt'}, {type: countFiles, path: 'C:\Users\Student\AppData\Local\Temp\*.tmp', value: 0}, {type: fileContains, path: 'C:\Users\Student\Desktop\toolbox.bat', value: ['goto menu', 'errorlevel']}]
      hints: ['Nach `choice` steht die Nummer der Option im ERRORLEVEL. Springe mit `if errorlevel` und `goto` zum Label des jeweiligen Abschnitts. Weil `if errorlevel n` „n oder größer“ bedeutet, schreibst du die Bedingungen von 4 bis 2. Jeder Abschnitt muss mit `goto menu` zum Menü zurückkehren.', 'Aufbau: drei `if errorlevel`-Zeilen (4 → `end`, 3 → `clean`, 2 → `backup`) → der info-Abschnitt direkt darunter (`echo` mit `%COMPUTERNAME%`, `ipconfig | find "IPv4"`, `goto menu`) → `:backup` mit `xcopy` und `/s /i /y` und `goto menu` → `:clean` mit `del /q` auf `"%TEMP%\*.tmp"` und `goto menu` → `:end` mit `echo Bye!`.']
      answer: ['@echo off', ':menu', 'echo 1. System info', 'echo 2. Backup Documents', 'echo 3. Clean temp files', 'echo 4. Quit', 'choice /c 1234 /m "Choose"', 'if errorlevel 4 goto end', 'if errorlevel 3 goto clean', 'if errorlevel 2 goto backup', 'echo Computer: %COMPUTERNAME%', 'ipconfig | find "IPv4"', 'goto menu', ':backup', 'xcopy "%USERPROFILE%\Documents" "D:\Backup\Documents" /s /i /y /q', 'goto menu', ':clean', 'del /q "%TEMP%\*.tmp"', 'echo Temp files cleaned.', 'goto menu', ':end', 'echo Bye!']
      explain: 'Die `if errorlevel`-Bedingungen von groß nach klein schicken jede Option zum richtigen Label, und Option 1 landet direkt im info-Abschnitt darunter. `xcopy ... /s /i /y` macht das Backup, `del /q "%TEMP%\*.tmp"` löscht die temporären Dateien ohne Rückfrage, und `goto menu` am Ende jedes Abschnitts zeigt das Menü erneut an.'
  quiz:
    - kind: order
      q: 'Bringe den Aufbau eines Menüabschnitts in die richtige Reihenfolge.'
      items: [':backup', 'xcopy ... /s /i /y', 'call :log "backup done"', 'goto menu']
      explain: 'Label → Aufgabe → Log → zurück zum Menü.'
    - kind: mcq
      q: 'Was passiert, wenn du `goto menu` am Ende des info-Abschnitts vergisst?'
      options: ['Die Ausführung läuft in den nächsten Abschnitt (backup) weiter', 'Das Skript meldet einen Fehler', 'Das Menü wird erneut angezeigt', 'Nichts']
      answer: 0
      explain: 'Batch läuft Zeile für Zeile weiter.'
    - kind: tf
      q: 'Es ist besser, ein großes Projekt Abschnitt für Abschnitt zu bauen und jeden Abschnitt einzeln zu testen.'
      answer: true
      explain: 'So findest du Fehler viel leichter.'
  recap: 'Glückwunsch! Jetzt arbeitest du mit CMD, verwaltest Dateien und Netzwerk, findest Fehler in Windows und schreibst Batch-Skripte. Mach weiter: Löse die Challenges und bau dein eigenes Werkzeug.'
