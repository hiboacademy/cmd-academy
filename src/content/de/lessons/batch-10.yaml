      answer: 'diskpart'
      explain: '`select disk 1` wählt den USB-Stick aus, `clean` löscht alles darauf, und `create partition primary` legt eine Partition an. `format fs=ntfs quick label=Backup` macht sie mit NTFS und dem Namen `Backup` bereit, und `assign letter=F` gibt ihr den Buchstaben `F`, damit sie im Datei-Explorer erscheint.'
