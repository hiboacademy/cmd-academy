      q: 'Speichere die Ausgabe von `ver` in der Datei `version.txt` in diesem Ordner.'
      start: 'C:\Users\Student\Desktop'
      checks: [{type: fileContains, path: 'C:\Users\Student\Desktop\version.txt', value: 'Microsoft Windows'}]
      answer: 'ver > version.txt'
      explain: '`>` schreibt die Ausgabe statt auf den Bildschirm in die Datei.'
  recap: '`Befehl > Datei` = Ausgabe in eine Datei schreiben (ersetzen). `>nul` = Ausgabe wegwerfen.'

- n: 29
  term: '>>'
  fullForm: 'Redirect output (append)'
  difficulty: 2
  objective: 'Du hängst etwas an das Ende einer Datei an, ohne den bisherigen Inhalt zu löschen.'
  summary: '`>>` hängt die Ausgabe des Befehls an das Ende der Datei an. Gibt es die Datei nicht, wird sie angelegt.'
  meaning: 'Der Hauptunterschied: `>` = Overwrite (ersetzen), `>>` = Append (anhängen).'
  usage: 'Ein Log anlegen, mehrere Zeilen in eine Datei schreiben, die Berichte mehrerer Befehle sammeln.'
  syntax: 'command >> file'
  demo:
    start: 'C:\Users\Student\Desktop'
    cmds: ['echo Day 1: learned dir > log.txt', 'echo Day 2: learned copy >> log.txt', 'echo Day 3: learned >> >> log.txt', 'type log.txt']
  examples:
    - c: 'echo Ali >> guests.txt'
      d: 'Einen Namen am Ende der Liste anhängen.'
    - c: 'echo %date% %time% >> log.txt'
      d: 'Die Uhrzeit im Log festhalten (Variablen in Lektion 46).'
    - c: 'dir D:\Backup >> report.txt'
      d: 'Die Liste eines anderen Ordners an den Bericht anhängen.'
  mistakes:
    - 'Beim zweiten Befehl `>` verwenden, wodurch die erste Zeile gelöscht wird.'
    - 'Ein Leerzeichen zwischen den beiden Zeichen: `> >` ist falsch; es muss `>>` sein.'
  tip: 'Übliches Muster: die erste Zeile mit `>` (neue Datei), alle weiteren mit `>>`.'
  daily: '`>` ist wie Schreiben auf ein neues Blatt; `>>` ist wie Weiterschreiben unter den bisherigen Zeilen desselben Blatts.'
  practice:
    - id: P29a
      start: 'C:\Users\Student\Desktop'
      files: [{path: 'C:\Users\Student\Desktop\log.txt', content: "Day 1\n"}]
      task: 'Die Datei `log.txt` hat eine Zeile (`Day 1`). Hänge die Zeile `Day 2` am Ende an, ohne dass die erste Zeile gelöscht wird.'
      checks: [{type: fileContains, path: 'C:\Users\Student\Desktop\log.txt', value: ['Day 1', 'Day 2']}]
      hints:
        - '`>` schreibt die Datei neu, und die bisherige Zeile wird gelöscht. Um etwas am Ende der Datei anzuhängen, benutze die Version mit zwei Zeichen (`>>`).'
        - 'Drei Teile: der Ausgabe-Befehl (`echo` + der Text Day 2), das Append-Zeichen (zwei `>` direkt hintereinander), der Dateiname (`log.txt`).'
      answer: 'echo Day 2 >> log.txt'
      explain: '`echo Day 2` erzeugt den Text und `>>` hängt ihn an das Ende von `log.txt` an; anders als bei `>` wird die Zeile `Day 1` nicht gelöscht.'
    - id: P29b
      start: 'C:\Users\Student\Desktop'
      task: 'Erstelle eine Datei namens `names.txt` mit zwei Zeilen: in der ersten Zeile `Ali` und in der zweiten Zeile `Sara`.'
      multi: true
      checks: [{type: fileContains, path: 'C:\Users\Student\Desktop\names.txt', value: ['Ali', 'Sara']}, {type: fileLines, path: 'C:\Users\Student\Desktop\names.txt', value: 2}]
      hints:
        - 'Du brauchst zwei `echo`-Befehle. Der erste muss die Datei anlegen (mit `>`), der zweite eine Zeile am Ende anhängen (mit `>>`).'
        - 'Zeile 1: `echo` + Ali, dann `>`, dann `names.txt`. Zeile 2: `echo` + Sara, dann `>>`, dann wieder `names.txt`. Wenn auch Zeile 2 `>` benutzt, wird Ali gelöscht.'
      answer: ['echo Ali > names.txt', 'echo Sara >> names.txt']
      explain: 'Die erste Zeile legt mit `>` die Datei `names.txt` mit `Ali` an, und die zweite fügt mit `>>` das Wort `Sara` in der nächsten Zeile hinzu; die Datei hat also zwei Zeilen.'
  quiz:
    - kind: predict
      q: 'Wie viele Zeilen hat `a.txt` nach diesen Befehlen?'
      code: "echo 1 > a.txt\necho 2 >> a.txt\necho 3 >> a.txt"
      options: ['3', '1', '2', '0']
      answer: 0
      explain: 'Die erste Zeile hat die Datei angelegt, und die zwei weiteren wurden angehängt.'
    - kind: mcq
      q: 'Welches Zeichen behält den bisherigen Inhalt der Datei?'
      options: ['>>', '>', '<', '|']
      answer: 0
      code_options: true
      explain: '`>>` = Append.'
    - kind: order
      q: 'Bring die Befehle in die richtige Reihenfolge, um die Datei `todo.txt` mit den Zeilen „Buy milk“ und „Call Ali“ zu erstellen.'
      items: ['echo Buy milk > todo.txt', 'echo Call Ali >> todo.txt', 'type todo.txt']
      explain: 'Zuerst mit `>` anlegen, dann mit `>>` anhängen, zum Schluss ansehen.'
  recap: '`>` ersetzt, `>>` hängt an.'

- n: 30
  term: '2>'
  fullForm: 'stdout (1) · stderr (2)'
  difficulty: 2
  objective: 'Du speicherst oder versteckst Fehlermeldungen getrennt von der normalen Ausgabe.'
  summary: 'CMD hat zwei Ausgabekanäle: Nummer 1 ist die normale Ausgabe (stdout) und Nummer 2 sind Fehlermeldungen (stderr). `2>` leitet nur die Fehlermeldungen in eine Datei um.'
  meaning: '`>` ist dasselbe wie `1>`. `2>nul` versteckt Fehler. `2>&1` bedeutet „schick die Fehler dorthin, wohin auch die normale Ausgabe geht“.'
  usage: 'Fehler in einer eigenen Datei festhalten, unwichtige Fehlermeldungen verstecken, alles in einer Datei speichern.'
  syntax: "command 2> errors.txt\ncommand > all.txt 2>&1\ncommand 2>nul"
  demo:
    start: 'C:\Users\Student\Desktop'
    cmds: ['type missing.txt', 'type missing.txt 2> error.txt', 'type error.txt', 'type missing.txt 2>nul']
  examples:
    - c: 'type missing.txt 2> error.txt'
      d: 'Die Fehlermeldung geht in die Datei statt auf den Bildschirm.'
    - c: 'dir C:\nothing 2>nul'
      d: 'Den Fehler verstecken.'
    - c: 'dir Documents nothing > all.txt 2>&1'
      d: 'Ausgabe und Fehler beide in einer Datei.'
    - c: 'type menu.txt > out.txt 2> err.txt'
      d: 'Normale Ausgabe und Fehler in zwei getrennten Dateien.'
  mistakes:
    - 'Ein Leerzeichen zwischen 2 und `>`: `2 >` bedeutet das Argument „2“ und danach `>`; es muss `2>` sein.'
    - '`2>&1` vor `>` schreiben: Die Reihenfolge ist wichtig; zuerst `> file`, dann `2>&1`.'
  tip: '`>nul 2>&1` heißt „zeig gar nichts an“; das ist in Batch-Skripten sehr verbreitet.'
  practice:
    - id: P30a
      start: 'C:\Users\Student\Desktop'
      task: 'Der Befehl `type missing.txt` gibt einen Fehler aus. Führe ihn so aus, dass die Fehlermeldung in der Datei `error.txt` gespeichert wird.'
      checks: [{type: fileContains, path: 'C:\Users\Student\Desktop\error.txt', value: 'cannot find'}, {type: usedOp, value: '2>'}]
      hints:
        - 'Die Fehlermeldung kommt aus Kanal Nummer 2 (stderr), nicht aus dem normalen Kanal. Das normale `>` erfasst nur Kanal 1; schreib also die 2 vor das `>`.'
        - 'Drei Teile: der Befehl, der den Fehler erzeugt (`type missing.txt`), das Redirect-Zeichen für Fehler (`2` direkt an `>`), und die Zieldatei (`error.txt`).'
      answer: 'type missing.txt 2> error.txt'
      explain: '`type missing.txt` erzeugt den Fehler „Datei nicht gefunden“, und `2>` speichert genau diese Fehlermeldung (Kanal 2) statt auf dem Bildschirm in `error.txt`.'
    - id: P30b
      start: 'C:\Users\Student'
      task: 'Führe den Befehl `dir Documents\nothing` aus und speichere sowohl die normale Ausgabe als auch den Fehler in der Datei `all.txt`.'
      checks: [{type: fileContains, path: 'C:\Users\Student\all.txt', value: ['Volume', 'File Not Found']}, {type: usedOp, value: '2>&1'}]
      hints:
        - 'Du musst beide Kanäle in eine Datei schicken: Leite zuerst die normale Ausgabe mit `>` in die Datei um und sag dann, dass der Fehlerkanal (2) dorthin gehen soll, wo auch Kanal 1 hingeht.'
        - 'Der Reihe nach: der Befehl (`dir Documents\nothing`), dann `>` und der Dateiname `all.txt`, und zum Schluss der Teil „Fehler zu Kanal 1 schicken“: `2>` und dann `&1`.'
      answer: 'dir Documents\nothing > all.txt 2>&1'
      explain: '`> all.txt` schickt die normale Ausgabe in die Datei, und `2>&1` heißt „schick Kanal 2 (Fehler) dorthin, wo Kanal 1 hingeht“; also landet beides in `all.txt`.'
  quiz:
    - kind: mcq
      q: 'Welche Kanalnummer haben Fehlermeldungen in CMD?'
      options: ['2', '1', '0', '3']
      answer: 0
      explain: '0 Eingabe, 1 normale Ausgabe, 2 Fehler.'
    - kind: predict
      q: 'Die Datei `x.txt` existiert nicht. Was ist auf dem Bildschirm zu sehen?'
      code: 'type x.txt 2>nul'
      options: ['Gar nichts', 'The system cannot find the file specified.', 'x.txt', 'nul']
      answer: 0
      explain: 'Die Fehlermeldung ging nach `nul`.'
    - kind: fix
      q: 'Jemand möchte, dass Ausgabe und Fehler beide in `log.txt` landen. Wo ist der Fehler?'
      code: 'dir C:\nothing 2>&1 > log.txt'
      options: ['`2>&1` muss nach `> log.txt` kommen', 'Man muss `>>` schreiben', '`2>&1` gibt es nicht', 'Man muss `1>&2` schreiben']
      answer: 0
      explain: 'Richtig: `dir C:\nothing > log.txt 2>&1`'
  recap: '1 = Ausgabe, 2 = Fehler. `2>` Fehler in eine Datei, `2>nul` verstecken, `> file 2>&1` alles in eine Datei.'

- n: 31
  term: '&   &&   ||'
  fullForm: 'Command chaining'
  difficulty: 2
  objective: 'Du führst mehrere Befehle in einer Zeile aus und machst den zweiten Befehl vom Erfolg oder Misserfolg des ersten abhängig.'
  summary: '`&` führt den zweiten Befehl immer aus. `&&` nur, wenn der erste erfolgreich war. `||` nur, wenn der erste fehlgeschlagen ist.'
  meaning: 'Jeder Befehl hat nach dem Ausführen einen Exit Code: Null heißt erfolgreich. `&&` und `||` prüfen genau das (Lektion 62).'
  usage: '`mkdir X && cd X` (wenn er angelegt wurde, hineinwechseln), `type file || echo nicht gefunden` (eine freundliche Meldung statt eines Fehlers).'
  syntax: "cmd1 & cmd2\ncmd1 && cmd2\ncmd1 || cmd2"
  demo:
    start: 'C:\Users\Student'
    cmds: ['mkdir Shop && cd Shop', 'type nofile.txt || echo File not found', 'echo One & echo Two']
  examples:
    - c: 'mkdir Shop && cd Shop'
      d: 'Nur wenn das Anlegen geklappt hat, in den Ordner wechseln.'
    - c: 'type a.txt || echo a.txt is missing'
      expectError: true
      d: 'Wenn die Datei fehlt, deine eigene Meldung anzeigen.'
    - c: 'cd Documents & dir /b'
      d: 'Zwei Befehle nacheinander, ohne Bedingung.'
    - c: 'copy a.txt E:\ && echo OK || echo FAILED'
      expectError: true
      d: 'Das Ergebnis mit einem einzigen Wort melden.'
  mistakes:
    - '`|` (Pipe, Lektion 33) mit `||` verwechseln.'
    - '`&` verwenden, wenn der zweite Befehl vom ersten abhängt: Wenn `cd` fehlschlägt, läuft `del *.*` im falschen Ordner! Hier ist `&&` sicherer.'
  tip: 'Sicherheitsregel: Benutze vor gefährlichen Befehlen `&&`, damit sie nur laufen, wenn der vorige Schritt erfolgreich war.'
  restaurant: '`&` heißt „bring die Vorspeise und danach das Hauptgericht“. `&&` heißt „wenn ihr Pizza habt, bring auch eine Limo“. `||` heißt „wenn ihr keine Pizza habt, bring Pasta“.'
  practice:
    - id: P31a
      start: 'C:\Users\Student'
      task: 'Lege in einer Zeile den Ordner `Shop` an und wechsle nur dann hinein, wenn er angelegt wurde.'
      checks: [{type: cwd, value: 'C:\Users\Student\Shop'}, {type: usedOp, value: '&&'}]
      hints:
        - 'Zwei Befehle lassen sich in einer Zeile verbinden. Du brauchst ein Zeichen, das den zweiten Befehl nur ausführt, wenn der erste erfolgreich war.'
        - 'Drei Teile: der erste Befehl (`mkdir` + der Name Shop), das Zeichen „nur wenn erfolgreich“ (zwei `&`), der zweite Befehl (`cd` + der Name Shop).'
      answer: 'mkdir Shop && cd Shop'
      explain: '`mkdir Shop` legt den Ordner an, und `&&` führt `cd Shop` nur aus, wenn das geklappt hat; wäre das Anlegen fehlgeschlagen, wärst du nicht in den Ordner gewechselt.'
    - id: P31b
      start: 'C:\Users\Student'
      task: 'Zeige in einer Zeile die Datei `nofile.txt` an und gib, falls das fehlschlägt, die Meldung `File not found` aus.'
      checks: [{type: lastOutputIncludes, value: 'File not found'}, {type: usedOp, value: '||'}]
      hints:
        - 'Diesmal soll der zweite Befehl nur laufen, wenn der erste fehlgeschlagen ist. Das Zeichen dafür sind zwei senkrechte Striche (`||`).'
        - 'Drei Teile: der erste Befehl (`type` + der Dateiname nofile.txt), das Zeichen „nur wenn fehlgeschlagen“ (`||`), der zweite Befehl (`echo` + die Meldung File not found).'
      answer: 'type nofile.txt || echo File not found'
      explain: '`type nofile.txt` schlägt fehl, weil die Datei nicht existiert, und `||` führt in diesem Fall `echo File not found` aus, sodass deine eigene Meldung erscheint.'
  quiz:
    - kind: predict
      q: 'Die Datei `a.txt` existiert nicht. Was wird ausgegeben?'
      code: 'type a.txt && echo YES || echo NO'
      options: ['Eine Fehlermeldung und dann NO', 'YES', 'YES und NO', 'Nur die Fehlermeldung']
      answer: 0
      explain: '`type` ist fehlgeschlagen, also lief `echo YES` nicht, aber `|| echo NO` lief.'
    - kind: mcq
      q: 'Welches Zeichen führt den zweiten Befehl immer aus?'
      options: ['&', '&&', '||', '|']
      answer: 0
      code_options: true
      explain: '`&` hat keine Bedingung.'
    - kind: tf
      q: 'Wenn der Ordner X in `mkdir X && cd X` schon existiert, wird `cd X` nicht ausgeführt.'
      answer: true
      explain: '`mkdir` hat einen Fehler gemeldet (already exists), also hat `&&` den zweiten Befehl nicht ausgeführt.'
  recap: '`&` immer, `&&` wenn erfolgreich, `||` wenn fehlgeschlagen. Benutze vor gefährlichen Aktionen `&&`.'

- n: 32
  term: 'Level 1 Practice'
  fullForm: 'Combining what you learned'
  difficulty: 2
  objective: 'Du kombinierst die Befehle aus Level 1 für eine echte Aufgabe.'
  summary: 'In dieser Lektion verwendest du Pfade, Ordner, Kopieren, Wildcards und Redirect zusammen, um eine vollständige Aufgabe zu erledigen.'
  meaning: 'Eine echte Aufgabe hat meistens mehrere Schritte: an den richtigen Ort gehen, den Inhalt ansehen, das Ziel anlegen, die Arbeit erledigen und das Ergebnis prüfen.'
  usage: 'Allgemeines Muster: `cd` → `dir` → `mkdir` → `copy`/`move` → `dir` zur Kontrolle.'
  syntax: "cd folder\nmkdir target\ncopy *.ext target\ndir target"
  demo:
    start: 'C:\Users\Student\Documents'
    cmds: ['mkdir Archive', 'copy *.txt Archive', 'dir Archive /b']
  examples:
    - c: 'mkdir Archive && copy *.txt Archive'
      d: 'Einen Ordner anlegen und alle Textdateien hineinkopieren, in einer Zeile.'
    - c: 'copy ..\Pictures\*.jpg E:\Photos'
      d: 'Alle jpgs auf den USB-Stick kopieren.'
    - c: 'dir E:\Photos /b > E:\photos.txt'
      d: 'Die Liste für später speichern.'
  mistakes:
    - 'Loslegen, ohne auf den Prompt zu schauen; wisse immer, in welchem Ordner du bist.'
    - 'Das Ergebnis nicht mit `dir` prüfen.'
  tip: 'Teile jede große Aufgabe in kleine Schritte und schau dir nach jedem Schritt das Ergebnis an.'
  practice:
    - id: P32a
      start: 'C:\Users\Student\Documents'
      task: 'Lege in Documents einen Ordner namens `Archive` an, kopiere alle `.txt`-Dateien hinein und sieh dir zum Schluss den Inhalt von Archive an.'
      multi: true
      checks: [{type: fileExists, path: 'C:\Users\Student\Documents\Archive\menu.txt'}, {type: fileExists, path: 'C:\Users\Student\Documents\Archive\todo.txt'}, {type: fileExists, path: 'C:\Users\Student\Documents\Archive\guests.txt'}, {type: argIncludes, cmd: dir, value: archive}]
      hints:
        - 'Drei Schritte nacheinander: Lege zuerst den Ordner Archive an, kopiere dann alle `.txt`-Dateien mit der Wildcard `*` hinein und sieh dir zum Schluss den Inhalt an.'
        - 'Zeile 1: `mkdir` + Ordnername. Zeile 2: `copy` + Muster für alle txt-Dateien (`*` und `.txt`) + Zielordner. Zeile 3: `dir` + der Name desselben Ordners.'
      answer: ['mkdir Archive', 'copy *.txt Archive', 'dir Archive']
      explain: '`mkdir Archive` legt den Ordner an, `copy *.txt Archive` kopiert alle Textdateien hinein und `dir Archive` zeigt, dass die Kopien angekommen sind.'
    - id: P32b
      start: 'C:\Users\Student\Pictures'
      task: 'Kopiere alle `.jpg`-Bilder in diesem Ordner nach `E:\Photos` und speichere die Dateiliste dieses Ordners in `E:\photos.txt`.'
      multi: true
      checks: [{type: fileExists, path: 'E:\Photos\beach.jpg'}, {type: fileExists, path: 'E:\Photos\cat.jpg'}, {type: fileContains, path: 'E:\photos.txt', value: 'beach.jpg'}]
      hints:
        - 'Zwei Schritte: Schick zuerst alle `.jpg`-Bilder mit `copy` und Wildcard in den Ordner auf dem USB-Stick, und speichere dann die Liste dieses Ordners mit `dir` und `>` in einer Datei.'
        - 'Zeile 1: `copy` + Muster für jpgs + Ziel `E:\Photos`. Zeile 2: `dir` + dasselbe `E:\Photos` + das Zeichen `>` + Zieldatei `E:\photos.txt`.'
      answer: ['copy *.jpg E:\Photos', 'dir E:\Photos > E:\photos.txt']
      explain: '`copy *.jpg E:\Photos` bringt alle jpgs auf den USB-Stick. Danach erzeugt `dir E:\Photos` die Liste dieses Ordners und `>` schreibt sie in `E:\photos.txt`.'
  quiz:
    - kind: order
      q: 'Bring die Befehle in die richtige Reihenfolge, um alle `.pdf`-Dateien aus Downloads in einen neuen Ordner `Docs` zu verschieben. (Du startest in `C:\Users\Student`.)'
      items: ['cd Downloads', 'mkdir Docs', 'move *.pdf Docs', 'dir Docs']
      explain: 'Zuerst hingehen, das Ziel anlegen, verschieben, das Ergebnis ansehen.'
    - kind: predict
      q: 'Current Directory: `C:\Users\Student`. Was ist das Ergebnis dieser Zeile?'
      code: 'cd Nothing && del *.*'
      options: ['cd meldet einen Fehler und del wird nicht ausgeführt', 'Alle Dateien in Student werden gelöscht', 'Der Ordner Nothing wird angelegt', 'del wird in C:\ ausgeführt']
      answer: 0
      explain: 'Darum ist `&&` so wichtig: Mit `&` wären die Dateien im falschen Ordner gelöscht worden.'
    - kind: mcq
      q: 'Welcher Befehl hängt die Dateiliste von E:\ an das Ende von `report.txt` an?'
      options: ['dir E:\ >> report.txt', 'dir E:\ > report.txt', 'type E:\ >> report.txt', 'copy E:\ report.txt']
      answer: 0
      code_options: true
      explain: '`>>` hängt an.'
  recap: 'Echte Aufgabe = kleine Schritte: hingehen, ansehen, anlegen, erledigen, prüfen. `&&` verhindert gefährliche Fehler.'
