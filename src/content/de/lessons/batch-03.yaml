# Lessons 21–32 · file management, wildcards, redirection, chaining

- n: 21
  term: copy
  fullForm: 'Copy'
  difficulty: 1
  objective: 'Du erstellst eine Kopie einer Datei, kopierst sie in einen anderen Ordner oder auf ein anderes Laufwerk und verstehst die Meldungen von copy.'
  summary: '`copy` kopiert eine oder mehrere Dateien von einem Ort an einen anderen. Die Originaldatei bleibt, wo sie ist.'
  meaning: 'Das erste Argument ist die Quelle, das zweite das Ziel. Das Ziel kann ein Ordner (Folder) sein (die Datei wird mit demselben Namen kopiert) oder ein neuer Name.'
  usage: 'Eine Sicherungskopie anlegen, eine Datei auf einen USB-Stick bringen, vor dem Bearbeiten eine zweite Version erstellen.'
  syntax: 'copy source [destination] [/y]'
  demo:
    start: 'C:\Users\Student\Documents'
    cmds: ['copy todo.txt todo_backup.txt', 'copy menu.txt E:\', 'dir E:\ /b']
  examples:
    - c: 'copy todo.txt todo_backup.txt'
      d: 'Eine zweite Version mit neuem Namen im selben Ordner.'
    - c: 'copy menu.txt D:\Backup'
      d: 'Kopieren in einen Ordner auf einem anderen Laufwerk; der Dateiname bleibt gleich.'
    - c: 'copy menu.txt E:\menu_old.txt'
      d: 'Kopieren auf den USB-Stick mit neuem Namen.'
    - c: 'copy /y todo.txt D:\Backup'
      d: '`/y` bedeutet: Wenn die Datei im Ziel schon existiert, ohne Nachfrage ersetzen.'
  mistakes:
    - 'Eine Datei auf sich selbst kopieren: `copy todo.txt .` liefert den Fehler `The file cannot be copied onto itself.`'
    - 'Ein Ziel, das nicht existiert: Wenn der Zielordner fehlt, legt copy ihn nicht an.'
    - 'Erwarten, dass ein ganzer Ordner mit Unterordnern kopiert wird; dafür brauchst du `xcopy` oder `robocopy` (Lektion 43 und 44).'
  tip: 'Wenn die Datei im Ziel schon existiert, fragt CMD `Overwrite ...? (Yes/No/All)`. `Y` heißt ja, `N` nein, `A` heißt für alle.'
  restaurant: 'Du schickst eine Fotokopie des Originalrezepts an eine andere Filiale; das Original bleibt in deinem eigenen Rezeptbuch.'
  practice:
    - id: P21a
      start: 'C:\Users\Student\Documents'
      task: 'Erstelle von der Datei `todo.txt` eine Kopie mit dem Namen `todo_backup.txt` im selben Ordner.'
      checks: [{type: fileExists, path: 'C:\Users\Student\Documents\todo_backup.txt'}, {type: fileExists, path: 'C:\Users\Student\Documents\todo.txt'}]
      hints:
        - 'Um eine zweite Version einer Datei zu erstellen, benutzt du `copy`. `copy` nimmt zwei Argumente: zuerst die Quelldatei (was?), dann den Zielnamen (wohin oder mit welchem Namen?).'
        - 'Drei Teile: Was tun? (`copy`) Quelle? (die Originaldatei `todo.txt`) Ziel? (der Name der neuen Kopie `todo_backup.txt`). Die Reihenfolge ist wichtig: zuerst Quelle, dann Ziel.'
      answer: 'copy todo.txt todo_backup.txt'
      explain: '`copy` liest die erste Datei (`todo.txt`) und erstellt im selben Ordner eine Kopie mit dem zweiten Namen (`todo_backup.txt`); die Originaldatei bleibt unverändert.'
    - id: P21b
      start: 'C:\Users\Student\Documents'
      task: 'Kopiere die Datei `menu.txt` in das Stammverzeichnis des USB-Sticks (Laufwerk E).'
      checks: [{type: fileExists, path: 'E:\menu.txt'}]
      hints:
        - 'Wieder `copy` mit Quelle und Ziel. Diesmal ist das Ziel kein Dateiname, sondern das Stammverzeichnis eines anderen Laufwerks; der Dateiname bleibt gleich.'
        - 'Drei Teile: Was tun? (`copy`) Quelle? (`menu.txt`) Ziel? (Stammverzeichnis von Laufwerk E: Laufwerksbuchstabe, Doppelpunkt und ein `\`).'
      answer: 'copy menu.txt E:\'
      explain: '`copy` nimmt die Datei `menu.txt`, und weil das Ziel `E:\` ein Ordner ist (das Stammverzeichnis des USB-Sticks), legt es dort eine Kopie mit demselben Namen an.'
  quiz:
    - kind: mcq
      q: 'Was passiert nach `copy a.txt D:\Backup` mit der Originaldatei `a.txt`?'
      options: ['Sie bleibt, wo sie ist', 'Sie wird gelöscht', 'Ihr Name ändert sich', 'Sie wird geleert']
      answer: 0
      explain: '`copy` erstellt eine Kopie; zum Verschieben brauchst du `move`.'
    - kind: predict
      q: 'Der Ordner `D:\Old` existiert nicht. Was ist das Ergebnis dieses Befehls?'
      code: 'copy menu.txt D:\Old\menu.txt'
      options: ['The system cannot find the path specified.', 'Der Ordner Old wird angelegt und die Datei kopiert', '1 file(s) copied.', 'Access is denied.']
      answer: 0
      explain: '`copy` legt den Zielordner nicht an; erstelle ihn zuerst mit `mkdir`.'
    - kind: type
      q: 'Kopiere die Datei `todo.txt` in den Ordner `D:\Backup`.'
      accept: ['copy todo.txt d:\backup', 'copy todo.txt d:\backup\', 'copy todo.txt d:\backup\todo.txt']
      show: 'copy todo.txt D:\Backup'
      explain: 'Quelle, Leerzeichen, Ziel.'
    - kind: sim
      q: 'Kopiere die Datei `menu.txt` aus Documents nach `D:\Backup`.'
      start: 'C:\Users\Student'
      checks: [{type: fileExists, path: 'D:\Backup\menu.txt'}, {type: fileExists, path: 'C:\Users\Student\Documents\menu.txt'}]
      answer: 'copy Documents\menu.txt D:\Backup'
      explain: '`copy Quelle Ziel`; die Originaldatei bleibt, wo sie ist.'
  recap: '`copy Quelle Ziel`. Das Original bleibt erhalten. Der Zielordner muss existieren. `/y` = ohne Nachfrage.'

- n: 22
  term: move
  fullForm: 'Move'
  difficulty: 1
  objective: 'Du verschiebst eine Datei oder einen Ordner an einen anderen Ort.'
  summary: '`move` nimmt eine Datei oder einen Ordner vom aktuellen Ort weg und legt sie im Ziel ab. Danach ist sie am alten Ort nicht mehr vorhanden.'
  meaning: 'Ist das Ziel ein Ordner, kommt die Datei in diesen Ordner. Ist das Ziel ein neuer Name, wird die Datei unter diesem Namen verschoben.'
  usage: 'Dateien aufräumen, Downloads in den richtigen Ordner bringen, Ordner verschieben.'
  syntax: 'move [/y] source destination'
  demo:
    start: 'C:\Users\Student\Downloads'
    cmds: ['move invoice.pdf ..\Documents', 'dir /b', 'dir ..\Documents /b']
  examples:
    - c: 'move invoice.pdf ..\Documents'
      d: 'Die Datei in den Ordner Documents verschieben.'
    - c: 'move todo.txt Work\tasks.txt'
      at: 'C:\Users\Student\Documents'
      d: 'In den Ordner Work verschieben, mit neuem Namen.'
    - c: 'move Work Office'
      at: 'C:\Users\Student\Documents'
      d: 'Wenn Office nicht existiert, wird der Ordner Work umbenannt.'
  mistakes:
    - 'Denken, dass `move` eine Kopie anlegt; die Datei verschwindet vom alten Ort.'
    - 'Einen Ordner verschieben, in dem du dich gerade befindest.'
  tip: 'Wenn im Ziel schon eine Datei mit demselben Namen liegt, fragt CMD vor dem Ersetzen nach.'
  daily: '`copy` heißt, ein Blatt zu fotokopieren; `move` heißt, das Blatt selbst aus der einen Schublade zu nehmen und in eine andere zu legen.'
  practice:
    - id: P22a
      start: 'C:\Users\Student\Documents'
      task: 'Verschiebe die Datei `todo.txt` in den Ordner `Work`.'
      checks: [{type: fileExists, path: 'C:\Users\Student\Documents\Work\todo.txt'}, {type: fileNotExists, path: 'C:\Users\Student\Documents\todo.txt'}]
      hints:
        - '`move` nimmt wie `copy` Quelle und Ziel, nur dass die Datei vom ersten Ort entfernt wird. Das Ziel ist hier ein Ordner.'
        - 'Drei Teile: Was tun? (`move`) Welche Datei? (`todo.txt`) Wohin? (der Name des Ordners Work, der hier in Documents liegt).'
      answer: 'move todo.txt Work'
      explain: '`move` bringt die Datei `todo.txt` in den Ordner `Work`; anders als bei `copy` bleibt in Documents keine Kopie zurück.'
    - id: P22b
      start: 'C:\Users\Student'
      task: 'Verschiebe die Datei `invoice.pdf` von Downloads nach Documents, ohne in die Ordner zu wechseln.'
      checks: [{type: fileExists, path: 'C:\Users\Student\Documents\invoice.pdf'}, {type: fileNotExists, path: 'C:\Users\Student\Downloads\invoice.pdf'}]
      hints:
        - 'Benutze `move`, aber weil du in `C:\Users\Student` bist, schreibst du Quelle und Ziel als Relative Path (von hier aus).'
        - 'Drei Teile: Was tun? (`move`) Quelle? (Pfad der Datei: Ordner `Downloads`, `\`, dann `invoice.pdf`) Ziel? (der Name des Ordners Documents).'
      answer: 'move Downloads\invoice.pdf Documents'
      explain: '`move` nimmt die Datei aus `Downloads\invoice.pdf` und legt sie in den Ordner `Documents`. Beide Pfade werden relativ zu `C:\Users\Student` gerechnet.'
  quiz:
    - kind: tf
      q: 'Nach `move` bleibt die Datei auch an ihrem ursprünglichen Ort.'
      answer: false
      explain: '`move` verschiebt, es kopiert nicht.'
    - kind: mcq
      q: 'Welcher Befehl bringt die Datei `a.txt` in den Ordner `Archive`?'
      options: ['move a.txt Archive', 'copy a.txt Archive', 'ren a.txt Archive', 'cd a.txt Archive']
      answer: 0
      code_options: true
      explain: '`move` nimmt die Quelle weg und legt sie im Ziel ab.'
    - kind: predict
      q: 'Im aktuellen Ordner gibt es nur die Datei `old.txt`. Was hast du nach diesem Befehl?'
      code: 'move old.txt new.txt'
      options: ['Nur new.txt', 'old.txt und new.txt', 'Nur old.txt', 'Fehler']
      answer: 0
      explain: 'Verschieben auf einen neuen Namen im selben Ordner ist ein Umbenennen.'
  recap: '`move Quelle Ziel` = verschieben. Die Datei bleibt nicht am alten Ort.'

- n: 23
  term: ren
  fullForm: 'Rename'
  difficulty: 1
  objective: 'Du benennst eine Datei oder einen Ordner um und kennst die Grenzen von `ren`.'
  summary: '`ren` (oder `rename`) ändert nur den Namen; die Datei bleibt im selben Ordner.'
  meaning: 'Das erste Argument ist die aktuelle Datei (mit Pfad, falls nötig). Das zweite Argument ist nur der neue Name, ohne Pfad.'
  usage: 'Namen korrigieren, ein Datum an den Namen anhängen, die Extension (Dateiendung) ändern.'
  syntax: 'ren [drive:][path]oldname newname'
  demo:
    start: 'C:\Users\Student\Desktop'
    cmds: ['ren notes.txt ideas.txt', 'dir /b']
  examples:
    - c: 'ren notes.txt ideas.txt'
      d: 'Eine Datei umbenennen.'
    - c: 'ren Work Office'
      at: 'C:\Users\Student\Documents'
      d: 'Einen Ordner umbenennen.'
    - c: 'ren Documents\menu.txt menu_2026.txt'
      at: 'C:\Users\Student'
      d: 'Ein Pfad steht nur beim ersten Namen.'
  mistakes:
    - 'Einen Pfad in den neuen Namen schreiben: `ren a.txt D:\b.txt` gibt einen Fehler. Um etwas an einen anderen Ort zu bringen, benutze `move`.'
    - 'Ein neuer Name, der schon existiert: `A duplicate file name exists...`'
    - 'Die Extension vergessen: `ren notes.txt ideas` erzeugt eine Datei ohne `.txt`.'
  tip: 'In Lektion 26 siehst du, dass `ren *.txt *.bak` alle Extensions auf einmal ändert.'
  practice:
    - id: P23a
      start: 'C:\Users\Student\Desktop'
      task: 'Benenne die Datei `notes.txt` in `ideas.txt` um.'
      checks: [{type: fileExists, path: 'C:\Users\Student\Desktop\ideas.txt'}, {type: fileNotExists, path: 'C:\Users\Student\Desktop\notes.txt'}]
      hints:
        - 'Zum Umbenennen benutzt du `ren` (Rename). Zuerst gibst du den aktuellen Dateinamen an, dann den neuen.'
        - 'Drei Teile: Was tun? (`ren`) Aktueller Name? (`notes.txt`) Neuer Name? (`ideas.txt`). Schreib die Extension bei beiden Namen.'
      answer: 'ren notes.txt ideas.txt'
      explain: '`ren` ändert den Namen der ersten Datei (`notes.txt`) in den zweiten Namen (`ideas.txt`); Inhalt und Ort der Datei bleiben gleich.'
    - id: P23b
      start: 'C:\Users\Student\Documents'
      task: 'Benenne den Ordner `Work` in `Office` um.'
      checks: [{type: dirExists, path: 'C:\Users\Student\Documents\Office'}, {type: dirNotExists, path: 'C:\Users\Student\Documents\Work'}]
      hints:
        - '`ren` ist nicht nur für Dateien; es funktioniert auch bei Ordnern. Wieder dieselbe Reihenfolge: aktueller Name, dann neuer Name.'
        - 'Drei Teile: Was tun? (`ren`) Aktueller Ordnername? (Work) Neuer Name? (Office). Ein Ordner hat keine Extension.'
      answer: 'ren Work Office'
      explain: '`ren` benennt den Ordner `Work` in `Office` um, und alle Dateien darin bleiben an ihrem Platz.'
  quiz:
    - kind: fix
      q: 'Dieser Befehl gibt den Fehler `The syntax of the command is incorrect.` aus. Warum?'
      code: 'ren report.txt D:\report.txt'
      options: ['Der neue Name darf keinen Pfad haben', 'Man muss `rename` schreiben', 'Die Datei existiert nicht', 'Laufwerk D ist voll']
      answer: 0
      explain: '`ren` ändert nur den Namen. Zum Verschieben: `move`.'
    - kind: tf
      q: '`rename` und `ren` sind derselbe Befehl.'
      answer: true
      explain: '`ren` ist die Kurzform von `rename`.'
    - kind: type
      q: 'Benenne `draft.txt` in `final.txt` um.'
      accept: ['ren draft.txt final.txt', 'rename draft.txt final.txt']
      explain: '`ren alt neu`'
  recap: '`ren alt neu` ändert nur den Namen. Der neue Name steht ohne Pfad.'

- n: 24
  term: del
  fullForm: 'Delete'
  difficulty: 1
  objective: 'Du löschst eine Datei mit `del` und kennst die Gefahr dabei.'
  summary: '`del` (oder `erase`) löscht eine Datei. Die Datei landet nicht im Recycle Bin (Papierkorb) und lässt sich nur sehr schwer wiederherstellen.'
  meaning: '`del` löscht nur Dateien, keine Ordner. Wenn du den Namen eines Ordners angibst, löscht es die Dateien darin und fragt vorher nach.'
  usage: 'Temporäre Dateien, alte Ausgaben und nicht mehr benötigte Dateien entfernen.'
  syntax: 'del [/p] [/q] [/f] [/s] names'
  warning: 'Eine mit `del` gelöschte Datei landet nicht im Recycle Bin. Lies Namen und Pfad vor dem Drücken von Enter noch einmal. Auf einem echten Computer prüfst du dasselbe Muster zuerst mit `dir`.'
  demo:
    start: 'C:\Users\Student\Downloads'
    cmds: ['del temp1.tmp', 'dir /b', 'del nothing.txt']
  examples:
    - c: 'del temp1.tmp'
      d: 'Eine Datei löschen.'
    - c: 'del /p photos.zip'
      d: '`/p` fragt vor dem Löschen jeder Datei nach.'
    - c: 'del Old'
      d: 'Wenn Old ein Ordner ist: Die Dateien darin werden gelöscht (nach einer Nachfrage).'
      noTry: true
  mistakes:
    - 'Denken, dass die Datei im Recycle Bin liegt.'
    - 'Im falschen Ordner löschen; schau immer auf den Prompt (Eingabeaufforderung).'
    - 'Erwarten, dass `del` einen Ordner löscht; Ordner löschst du mit `rd` (nächste Lektion).'
  tip: 'Wenn die Datei nicht gefunden wird, meldet `del` `Could Not Find ...` und es wird nichts gelöscht.'
  practice:
    - id: P24a
      start: 'C:\Users\Student\Downloads'
      task: 'Lösche die Datei `temp1.tmp`.'
      checks: [{type: fileNotExists, path: 'C:\Users\Student\Downloads\temp1.tmp'}, {type: fileExists, path: 'C:\Users\Student\Downloads\temp2.tmp'}]
      hints:
        - 'Zum Löschen einer Datei benutzt du `del` (Delete) und gibst genau den Namen der Datei an, die weg soll; die anderen Dateien müssen bleiben.'
        - 'Zwei Teile: Was tun? (`del`) Welche Datei? (der vollständige Name `temp1.tmp` mit Extension). Pass auf, dass du nicht `temp2.tmp` schreibst.'
      answer: 'del temp1.tmp'
      explain: '`del` löscht nur genau die Datei, deren Name angegeben ist (`temp1.tmp`). Eine mit `del` gelöschte Datei landet nicht im Recycle Bin.'
    - id: P24b
      start: 'C:\Users\Student'
      task: 'Lösche die Datei `photos.zip` in Downloads, ohne in diesen Ordner zu wechseln.'
      checks: [{type: fileNotExists, path: 'C:\Users\Student\Downloads\photos.zip'}, {type: cwd, value: 'C:\Users\Student'}]
      hints:
        - 'Wieder `del`, aber die Datei liegt im Ordner Downloads und du bist in `C:\Users\Student`. Gib `del` einen Relative Path.'
        - 'Zwei Teile: Was tun? (`del`) Welche Datei? (Pfad: Ordner `Downloads`, Trennzeichen `\`, dann `photos.zip`).'
      answer: 'del Downloads\photos.zip'
      explain: '`del` löscht die Datei unter `Downloads\photos.zip`; der Pfad wird vom aktuellen Ordner (Current Directory) aus gerechnet, du musst also nicht wechseln.'
  quiz:
    - kind: tf
      q: 'Eine mit `del` gelöschte Datei landet im Recycle Bin.'
      answer: false
      explain: 'Sie wird direkt gelöscht.'
    - kind: mcq
      q: 'Welcher Switch (Schalter) fragt vor dem Löschen jeder Datei nach?'
      options: ['/p', '/q', '/s', '/f']
      answer: 0
      code_options: true
      explain: '`/p` = Prompt. `/q` macht das Gegenteil und löscht ohne Nachfrage.'
    - kind: predict
      q: 'Die Datei `x.txt` existiert nicht. Was ist die Ausgabe?'
      code: 'del x.txt'
      options: ['Could Not Find C:\...\x.txt', 'File deleted.', 'Access is denied.', 'Nichts']
      answer: 0
      explain: '`del` meldet, dass es die Datei nicht gefunden hat.'
    - kind: sim
      q: 'Lösche die Datei `draft.tmp` aus `Documents\Work`; die Berichte müssen bleiben.'
      start: 'C:\Users\Student\Documents'
      checks: [{type: fileNotExists, path: 'C:\Users\Student\Documents\Work\draft.tmp'}, {type: fileExists, path: 'C:\Users\Student\Documents\Work\report.txt'}]
      answer: 'del Work\draft.tmp'
      explain: 'Relativer Pfad von Documents aus: `Work\draft.tmp`.'
  recap: '`del Datei` = löschen ohne Recycle Bin. `/p` fragt nach, `/q` nicht. Ordner löscht es nicht.'

- n: 25
  term: rmdir
  fullForm: 'Remove Directory (rd)'
  difficulty: 1
  objective: 'Du löschst leere und volle Ordner und kennst den Unterschied zwischen `/s` und `/q`.'
  summary: '`rmdir` (oder `rd`) löscht einen Ordner. Ohne Switch wird nur ein leerer Ordner gelöscht.'
  meaning: '`/s` löscht den Ordner mit allen Dateien und Unterordnern und fragt vorher nach. `/q` heißt: nicht nachfragen.'
  usage: 'Alte oder temporäre Ordner und abgeschlossene Projekte entfernen.'
  syntax: 'rd [/s] [/q] path'
  warning: '`rd /s /q` löscht einen ganzen Ordner mit allem Inhalt ohne jede Nachfrage. Führe es niemals bei einem Ordner aus, bei dem du dir nicht sicher bist.'
  demo:
    start: 'C:\Users\Student'
    cmds: ['mkdir Empty', 'rd Empty', 'rd Pictures']
  examples:
    - c: 'rd Empty'
      noTry: true
      d: 'Einen leeren Ordner löschen.'
    - c: 'rd /s OldProject'
      d: 'Einen Ordner mit allem Inhalt löschen; vorher fragt es `Are you sure (Y/N)?`'
      noTry: true
    - c: 'rd /s /q Temp'
      d: 'Löschen ohne Nachfrage. Gefährlich!'
      noTry: true
  mistakes:
    - 'Einen Ordner löschen, in dem du dich gerade befindest: Geh zuerst mit `cd ..` hinaus.'
    - '`del` zum Löschen eines Ordners verwenden.'
  tip: 'Schau vor `rd /s` mit `dir` oder `tree` nach, was in dem Ordner ist.'
  practice:
    - id: P25a
      start: 'C:\Users\Student'
      setup: {mkdir: ['C:\Users\Student\Empty']}
      task: 'Hier gibt es einen leeren Ordner namens `Empty`. Lösche ihn.'
      checks: [{type: dirNotExists, path: 'C:\Users\Student\Empty'}]
      hints:
        - 'Zum Löschen eines Ordners benutzt du `rd` (oder `rmdir`). Weil der Ordner leer ist, brauchst du keinen Switch.'
        - 'Zwei Teile: Was tun? (`rd`) Welcher Ordner? (Ordnername: Empty). `del` funktioniert hier nicht; das ist für Dateien.'
      answer: 'rd Empty'
      explain: '`rd` (Remove Directory) löscht den leeren Ordner `Empty`. Wäre der Ordner nicht leer, gäbe es ohne Switch einen Fehler.'
    - id: P25b
      start: 'C:\Users\Student'
      task: 'Lösche den Ordner `Pictures\Holidays` samt der Datei darin. (Wenn eine Frage kommt, beantworte sie.)'
      checks: [{type: dirNotExists, path: 'C:\Users\Student\Pictures\Holidays'}, {type: dirExists, path: 'C:\Users\Student\Pictures'}]
      inputs: ['y']
      hints:
        - 'Der Ordner Holidays ist nicht leer, also löscht `rd` allein ihn nicht. Du brauchst einen Switch, der den Ordner mit allem Inhalt löscht.'
        - 'Drei Teile: Was tun? (`rd`) Wie? (Switch mit dem Buchstaben `s` und `/`) Welcher Ordner? (Pfad `Pictures\Holidays`). Wenn `Are you sure (Y/N)?` kommt, antworte mit `Y`.'
      answer: 'rd /s Pictures\Holidays'
      explain: '`rd` löscht Ordner, `/s` bedeutet samt allen Dateien und Unterordnern, und `Pictures\Holidays` ist der Zielordner. Die Antwort `Y` bestätigt das Löschen, und Pictures bleibt unversehrt.'
  quiz:
    - kind: predict
      q: 'Der Ordner `Work` enthält zwei Dateien. Was ist die Ausgabe dieses Befehls?'
      code: 'rd Work'
      options: ['The directory is not empty.', 'Ordner und Dateien werden gelöscht', 'Nur die Dateien werden gelöscht', 'Are you sure (Y/N)?']
      answer: 0
      explain: 'Ohne `/s` wird nur ein leerer Ordner gelöscht.'
    - kind: mcq
      q: 'Welcher Befehl löscht einen Ordner mit allem Inhalt ohne Nachfrage?'
      options: ['rd /s /q Temp', 'rd Temp', 'rd /s Temp', 'del Temp']
      answer: 0
      code_options: true
      explain: '`/s` allen Inhalt, `/q` ohne Nachfrage.'
    - kind: tf
      q: '`rd` und `rmdir` sind derselbe Befehl.'
      answer: true
      explain: '`rd` ist die Kurzform.'
  recap: '`rd Ordner` = leeren Ordner löschen. `/s` = mit Inhalt. `/q` = ohne Nachfrage. Erst nachsehen, dann löschen.'

- n: 26
  term: '*'
  fullForm: 'Wildcard: any characters'
  difficulty: 2
  objective: 'Du wählst mit `*` eine ganze Gruppe von Dateien auf einmal aus.'
  summary: '`*` bedeutet „beliebig viele Zeichen, auch gar keins“. `*.jpg` heißt: alle Dateien, die auf `.jpg` enden.'
  meaning: 'Den Platzhalter (Wildcard) kannst du mit `dir`, `copy`, `move`, `del` und `ren` verwenden. `report*` heißt alles, was mit report beginnt. `*.*` heißt alle Dateien.'
  usage: 'Mit einem Befehl mit mehreren gleichartigen Dateien arbeiten: alle Fotos kopieren, alle temporären Dateien löschen.'
  syntax: "dir *.jpg\ncopy *.txt D:\\Backup\ndel *.tmp"
  warning: '`del *.*` löscht alle Dateien im Ordner. Teste dasselbe Muster immer zuerst mit `dir`.'
  demo:
    start: 'C:\Users\Student\Pictures'
    cmds: ['dir *.jpg /b', 'dir *.* /b']
  examples:
    - c: 'dir *.jpg'
      d: 'Nur jpg-Dateien.'
    - c: 'copy *.txt E:\'
      at: 'C:\Users\Student\Documents'
      d: 'Alle Textdateien auf den USB-Stick kopieren.'
    - c: 'del *.tmp'
      d: 'Alle temporären Dateien löschen.'
      noTry: true
    - c: 'ren *.txt *.bak'
      d: 'Die Extension aller txt-Dateien ändern.'
      noTry: true
  mistakes:
    - '`del` mit Wildcard ausführen, ohne vorher mit `dir` zu testen.'
