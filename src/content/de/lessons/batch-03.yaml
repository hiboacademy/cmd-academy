- n: 28
  term: '>'
  fullForm: 'Redirect output (overwrite)'
  difficulty: 2
  objective: 'Du schreibst die Ausgabe eines Befehls in eine Datei statt auf den Bildschirm.'
  summary: '`>` schreibt die Ausgabe des Befehls in eine Datei. Gibt es die Datei nicht, wird sie angelegt; gibt es sie schon, wird ihr bisheriger Inhalt gelöscht und ersetzt.'
  meaning: 'Jeder Befehl hat zwei Arten von Ausgabe: die normale Ausgabe (stdout) und Fehlermeldungen (stderr). `>` leitet nur die normale Ausgabe in die Datei um (Redirect).'
  usage: 'Eine Dateiliste speichern, mit `echo` eine Textdatei erstellen, einen Bericht mit Systeminformationen erzeugen.'
  syntax: 'command > file'
  warning: '`>` löscht den bisherigen Inhalt der Datei komplett. Um etwas am Ende der Datei anzuhängen, benutze `>>` (nächste Lektion).'
  demo:
    start: 'C:\Users\Student\Desktop'
    cmds: ['echo Hello CMD > hello.txt', 'type hello.txt', 'dir ..\Documents /b > list.txt', 'type list.txt']
  examples:
    - c: 'echo Hello > hello.txt'
      d: 'Eine Datei mit einer Textzeile erstellen.'
    - c: 'dir /b > files.txt'
      d: 'Die Dateiliste speichern.'
    - c: 'ipconfig > network.txt'
      d: 'Netzwerkinformationen für später speichern.'
  mistakes:
    - '`>` auf eine wichtige Datei anwenden: Ihr Inhalt wird gelöscht.'
    - 'Erwarten, die Ausgabe auf dem Bildschirm zu sehen: Mit `>` wird nichts angezeigt.'
  tip: 'Mit `>nul` wirfst du die Ausgabe weg: `copy a.txt b.txt >nul` zeigt die Meldung „copied“ nicht an.'
  restaurant: 'Statt die Bestellung laut auszurufen, schreibt der Koch sie auf einen Zettel und legt ihn in die Kasse.'
  practice:
    - id: P28a
      start: 'C:\Users\Student\Desktop'
      task: 'Erstelle eine Datei namens `hello.txt`, in der `Hello CMD` steht.'
      checks: [{type: fileContains, path: 'C:\Users\Student\Desktop\hello.txt', value: 'Hello CMD'}]
      hints:
        - '`echo` gibt Text aus. Mit dem Zeichen `>` kannst du die Ausgabe statt auf den Bildschirm in eine Datei schicken; gibt es die Datei nicht, wird sie angelegt.'
        - 'Drei Teile der Reihe nach: ein Befehl mit Ausgabe (`echo` + der Text Hello CMD), das Redirect-Zeichen (`>`) und der Name der Zieldatei (`hello.txt`).'
      answer: 'echo Hello CMD > hello.txt'
      explain: '`echo Hello CMD` erzeugt den Text und `>` schreibt ihn statt auf den Bildschirm in die Datei `hello.txt`; gibt es die Datei nicht, wird sie angelegt.'
    - id: P28b
