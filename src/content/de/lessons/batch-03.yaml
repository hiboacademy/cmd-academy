      task: 'Speichere die Dateiliste von Documents in einer Datei namens `list.txt` (in diesem Ordner).'
      checks: [{type: fileContains, path: 'C:\Users\Student\list.txt', value: 'menu.txt'}, {type: usedOp, value: '>'}]
      hints:
        - 'Die Ausgabe jedes Befehls lässt sich mit `>` in einer Datei speichern. Schreib zuerst den Befehl, der die Liste von Documents liefert, und schick dann seine Ausgabe in die Datei.'
        - 'Drei Teile: der Listen-Befehl (`dir` + der Ordnername Documents), das Zeichen `>`, der Name der Zieldatei (`list.txt`). Auf dem Bildschirm siehst du nichts; alles geht in die Datei.'
      answer: 'dir Documents > list.txt'
      explain: '`dir Documents` erzeugt die Liste des Ordners und `>` speichert sie in `list.txt` (im aktuellen Ordner), statt sie auf dem Bildschirm anzuzeigen.'
  quiz:
    - kind: predict
      q: 'Was steht nach diesen beiden Befehlen in `a.txt`?'
      code: "echo One > a.txt\necho Two > a.txt"
      options: ['Nur Two', 'One und Two', 'Nur One', 'Sie ist leer']
      answer: 0
      explain: '`>` löscht jedes Mal den bisherigen Inhalt.'
