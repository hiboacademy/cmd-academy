      hints:
        - 'Die Datei liegt im Ordner Desktop, du bist aber in `C:\Users\Student`. Statt zum Desktop zu wechseln, gib `type` einen relativen Pfad (Relative Path).'
        - 'Zwei Teile: Was tun? (`type`) Worauf? (Pfad: Ordnername `Desktop`, Trennzeichen `\`, dann Dateiname `notes.txt`).'
      answer: 'type Desktop\notes.txt'
      explain: '`type` liest die Datei, und `Desktop\notes.txt` wird vom aktuellen Ordner aus gerechnet; so wird die Datei angezeigt, und du bleibst, wo du bist.'
