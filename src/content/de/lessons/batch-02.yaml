      options: ['Die Endung (`.txt`) fehlt', '`type` ist falsch', 'Man muss `cd report` eingeben', 'Die Datei ist beschädigt']
      answer: 0
      explain: 'Der vollständige Dateiname ist nötig: `type report.txt`'
    - kind: type
      q: 'Zeige den Inhalt von `todo.txt` an.'
      accept: ['type todo.txt', 'type .\todo.txt']
      explain: '`type todo.txt`'
  recap: '`type Datei` = Textdatei lesen. Schreib den vollständigen Namen mit Endung.'
