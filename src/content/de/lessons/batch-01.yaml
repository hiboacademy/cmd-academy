- n: 8
  term: 'Path'
  fullForm: 'C:\Users\Student\Documents\todo.txt'
  difficulty: 1
  objective: 'Du verstehst den Aufbau eines Pfads (Path) und die Rolle von `\`.'
  summary: 'Ein Pfad (Path) ist die Adresse einer Datei oder eines Ordners. Die Ordnernamen werden mit `\` (Backslash) getrennt.'
  meaning: 'Lies den Pfad von links nach rechts: Laufwerk `C:` → Ordner `Users` → `Student` → `Documents` → Datei `todo.txt`.'
  usage: 'Jedes Mal, wenn du CMD sagst, mit welcher Datei oder welchem Ordner es arbeiten soll, gibst du eigentlich einen Pfad an.'
  syntax: 'Drive:\Folder\Folder\File'
  terminal:
    - {p: 'C:\Users\Student>', c: 'cd Documents\Work'}
    - {p: 'C:\Users\Student\Documents\Work>', c: ''}
  tip: 'Windows benutzt für Pfade `\`. Das Zeichen `/` ist in CMD für Switches da.'
  daily: 'Ein Pfad ist wie eine Postadresse: Stadt, Straße, Hausnummer, Wohnung. Jeder Teil bringt dich einen Schritt näher ans Ziel.'
  examples:
    - c: 'dir C:\Users\Student\Documents'
      d: 'Inhalt eines Ordners mit vollständigem Pfad.'
    - c: 'type C:\Users\Student\Desktop\notes.txt'
      d: 'Eine Datei mit vollständigem Pfad lesen.'
  mistakes:
    - '`/` statt `\` im Pfad benutzen.'
    - 'Die Anführungszeichen bei einem Pfad mit Leerzeichen vergessen, zum Beispiel `"shopping list.txt"`.'
  practice:
    - id: P8a
      start: 'C:\Users\Student'
      task: 'Wechsle in den Ordner Documents.'
      checks: [{type: cwd, value: 'C:\Users\Student\Documents'}]
      hints:
        - 'Um in einen Ordner hineinzugehen, benutzt du `cd` (Change Directory) und sagst ihm, welcher Ordner das Ziel ist.'
        - 'Zwei Teile: Was tun? (`cd`) Wohin? (Name des Zielordners; Documents liegt direkt in diesem Ordner, also reicht der Name). Danach ändert sich der Prompt.'
      answer: 'cd Documents'
      explain: '`cd` heißt „wechsle den Ordner“ und `Documents` ist das Ziel. Weil Documents direkt in `C:\Users\Student` liegt, reicht sein Name.'
    - id: P8b
      start: 'C:\Users\Student'
      task: 'Wechsle mit einem einzigen Befehl direkt in den Ordner Work, der in Documents liegt.'
      checks: [{type: cwd, value: 'C:\Users\Student\Documents\Work'}, {type: cmd, value: cd}]
      hints:
        - 'Work liegt in Documents. Statt zweimal `cd` kannst du einen Pfad angeben, der beide Ordner hintereinander enthält.'
        - 'Zwei Teile: Was tun? (`cd`) Wohin? (ein Pfad: zuerst `Documents`, dann das Trennzeichen `\`, dann `Work`). Benutze nicht `/`, das ist für Switches.'
      answer: 'cd Documents\Work'
      explain: '`cd` mit dem Pfad `Documents\Work` geht in einem Schritt zwei Ebenen tiefer: zuerst in Documents, dann in Work. Das Zeichen `\` trennt die Ordnernamen.'
  quiz:
    - kind: mcq
      q: 'Welches Zeichen trennt in einem Windows-Pfad die Ordner?'
      options: ['\', '/', '-', '|']
      answer: 0
      code_options: true
      explain: 'Windows benutzt den Backslash.'
    - kind: predict
      q: 'Wie heißt die Datei in diesem Pfad?'
      code: 'C:\Users\Student\Pictures\cat.jpg'
      options: ['cat.jpg', 'Pictures', 'Student', 'C:']
      answer: 0
      code_options: true
      explain: 'Der letzte Teil des Pfads ist die Datei selbst.'
    - kind: mcq
      q: 'In welchem Ordner liegt die Datei `cat.jpg` im Pfad oben?'
      options: ['Pictures', 'Users', 'Student', 'C:']
      answer: 0
      code_options: true
      explain: 'Der Teil direkt vor dem Dateinamen ist ihr Ordner.'
  recap: 'Pfad (Path) = Adresse einer Datei oder eines Ordners. Die Teile werden mit `\` getrennt. Pfade mit Leerzeichen kommen in `" "`.'

- n: 9
  term: 'Absolute Path'
  fullForm: 'C:\Users\Student\Pictures'
  difficulty: 1
  objective: 'Du kennst den absoluten Pfad (Absolute Path) und kommst damit von überall überallhin.'
  summary: 'Ein absoluter Pfad (Absolute Path) ist die vollständige Adresse. Er beginnt mit dem Laufwerk oder mit dem Stammordner `\`. Egal, wo du gerade bist: Er führt immer zum selben Ziel.'
  meaning: 'Wenn ein Pfad mit einem Laufwerksbuchstaben (wie `C:\`) oder mit `\` beginnt, ist er absolut.'
  usage: 'Wenn du nicht weißt, wo du gerade bist, oder das Ziel weit weg ist, ist der absolute Pfad der sicherste Weg.'
  syntax: 'cd C:\Folder\Folder'
  terminal:
    - {p: 'C:\Windows\System32>', c: 'cd C:\Users\Student\Pictures'}
    - {p: 'C:\Users\Student\Pictures>', c: ''}
  tip: '`cd` allein wechselt nicht das Laufwerk. Wenn das Ziel auf einem anderen Laufwerk liegt, benutze `cd /d` (Lektion 14).'
  daily: 'Wenn du einem Kurier die vollständige Postadresse gibst, kommt er von jedem Ort der Stadt zum selben Haus.'
  restaurant: '„Filiale C, Etage Users, Saal Student, Tisch Pictures.“ Jeder Kellner, der diese Adresse hört, findet von überall im Restaurant genau diesen Tisch.'
  examples:
    - c: 'cd C:\Users\Student\Pictures'
      d: 'Von überall direkt nach Pictures.'
    - c: 'dir C:\Windows'
      d: 'C:\Windows ansehen, ohne dorthin zu wechseln.'
  mistakes:
    - 'Den Laufwerksbuchstaben oder das `\` am Anfang vergessen; dann wird der Pfad relativ (Relative).'
    - 'Mit `cd` zu einem anderen Laufwerk wollen, ohne das Laufwerk zu wechseln.'
  practice:
    - id: P9a
      start: 'C:\Windows\System32'
      task: 'Du bist gerade in `C:\Windows\System32`. Wechsle mit einem absoluten Pfad nach `C:\Users\Student\Pictures`.'
      checks: [{type: cwd, value: 'C:\Users\Student\Pictures'}, {type: usedCd, value: absolute}]
      hints:
        - 'Ein absoluter Pfad beginnt mit dem Laufwerksbuchstaben und enthält alle Ordner bis zum Ziel hintereinander. Gib so einen Pfad an `cd`.'
        - 'Zwei Teile: Was tun? (`cd`) Wohin? (der vollständige Pfad der Reihe nach: `C:\` → `Users` → `Student` → `Pictures`, mit `\` zwischen den Ordnern).'
      answer: 'cd C:\Users\Student\Pictures'
      explain: '`cd` arbeitet mit dem absoluten Pfad `C:\Users\Student\Pictures`. Weil der Pfad mit `C:\` beginnt, ist es egal, dass du gerade in System32 bist.'
    - id: P9b
      start: 'C:\Users\Student\Documents\Work'
      task: 'Wechsle zum Stammordner (Root) von Laufwerk C, also nach `C:\`'
      checks: [{type: cwd, value: 'C:\'}, {type: usedCd, value: absolute}]
      hints:
        - 'Der Stammordner ist die oberste Stelle eines Laufwerks. In einem Pfad schreibt man ihn als einzelnes Zeichen: das Trennzeichen zwischen Ordnern.'
        - 'Zwei Teile: Was tun? (`cd`) Wohin? (zum Stammordner, also nur ein `\` oder der vollständige Pfad `C:\`).'
      answer: 'cd \'
      explain: '`\` allein bedeutet der Stammordner des aktuellen Laufwerks. Also bringt dich `cd \` aus jeder Tiefe direkt nach `C:\`.'
  quiz:
    - kind: mcq
      q: 'Welche Antwort ist ein absoluter Pfad (Absolute Path)?'
      options: ['C:\Users\Student\Music', 'Music', '..\Music', 'Student\Music']
      answer: 0
      code_options: true
      explain: 'Ein absoluter Pfad beginnt mit einem Laufwerk oder mit `\`.'
    - kind: tf
      q: 'Ein absoluter Pfad führt von jedem aktuellen Ordner aus zum selben Ergebnis.'
      answer: true
      explain: 'Denn er ist die vollständige Adresse und hängt nicht davon ab, wo du gerade bist.'
    - kind: type
      q: 'Wechsle mit einem absoluten Pfad in den Ordner `C:\Windows`.'
      show: 'cd C:\Windows'
      accept: ['cd c:\windows', 'cd \windows', 'chdir c:\windows', 'cd /d c:\windows']
      explain: '`cd C:\Windows`'
  recap: 'Ein absoluter Pfad beginnt mit dem Laufwerksbuchstaben und funktioniert von überall.'

- n: 10
  term: 'Relative Path'
  fullForm: 'Documents\Work · ..'
  difficulty: 1
  objective: 'Du benutzt den relativen Pfad (Relative Path) sowie `.` und `..` richtig.'
  summary: 'Ein relativer Pfad (Relative Path) wird vom aktuellen Ordner aus berechnet. Er beginnt nicht mit einem Laufwerk oder `\`, und sein Ergebnis hängt davon ab, wo du gerade bist.'
  meaning: 'Wenn du in `C:\Users\Student` bist, bedeutet `cd Documents` dasselbe wie `C:\Users\Student\Documents`. Die zwei Punkte `..` bedeuten den übergeordneten Ordner (Parent).'
  usage: 'Für kurze Wechsel zwischen nahe beieinander liegenden Ordnern ist das der schnellste Weg.'
  syntax: 'cd Folder\Folder'
  terminal:
    - {p: 'C:\Users\Student\Documents>', c: 'cd Work'}
    - {p: 'C:\Users\Student\Documents\Work>', c: 'cd ..'}
    - {p: 'C:\Users\Student\Documents>', c: ''}
  tip: 'Wenn du den Fehler `The system cannot find the path specified.` siehst, prüf zuerst mit `cd`, wo du bist.'
  daily: '„Zwei Türen weiter von diesem Zimmer.“ Diese Adresse ergibt nur Sinn, wenn du weißt, in welchem Zimmer du gerade bist.'
  restaurant: '„Wisch den Nachbartisch ab.“ Welchen Tisch? Das hängt davon ab, an welchem Tisch der Kellner gerade steht.'
  examples:
    - c: 'cd Documents'
      at: 'C:\Users\Student'
      d: 'In einen Ordner innerhalb des aktuellen Ordners wechseln.'
    - c: 'cd ..'
      d: 'In den übergeordneten Ordner wechseln.'
    - c: 'dir ..\Pictures'
      d: 'Den Nachbarordner ansehen.'
  mistakes:
    - 'Einen relativen Pfad benutzen, während du im falschen Ordner bist.'
    - '`cd..` ohne Leerzeichen schreiben: Das funktioniert in CMD, aber die richtige Gewohnheit ist `cd ..`.'
  practice:
    - id: P10a
      start: 'C:\Users\Student\Documents'
      task: 'Du bist in Documents. Wechsle mit einem relativen Pfad in den Ordner Work.'
      checks: [{type: cwd, value: 'C:\Users\Student\Documents\Work'}, {type: usedCd, value: relative}]
      hints:
        - 'Bei einem relativen Pfad rechnest du die Adresse von dort aus, wo du gerade bist. Work liegt direkt in diesem Ordner, also reicht sein Name.'
        - 'Zwei Teile: Was tun? (`cd`) Wohin? (nur der Ordnername, ohne `C:\` und ohne `\` am Anfang). Wenn du mit `C:\` beginnst, wird der Pfad absolut.'
      answer: 'cd Work'
      explain: '`Work` beginnt weder mit einem Laufwerk noch mit `\`, ist also relativ. CMD hängt es an den aktuellen Ordner an: `C:\Users\Student\Documents\Work`.'
    - id: P10b
      start: 'C:\Users\Student\Documents'
      task: 'Wechsle von Documents mit einem relativen Pfad in den Ordner Pictures und sieh dir seinen Inhalt an. (Pictures liegt neben Documents, nicht darin.)'
      checks: [{type: cwd, value: 'C:\Users\Student\Pictures'}, {type: usedCd, value: relative}, {type: cmd, value: dir}, {type: ok}]
      hints:
        - 'Pictures liegt neben Documents, nicht darin. Du musst also zuerst einen Ordner nach oben gehen (`..`) und von dort in Pictures wechseln; danach siehst du dir den Inhalt an.'
        - 'Zeile 1: `cd` mit einem zweiteiligen Pfad: „einen Ordner höher“ (`..`), das Trennzeichen `\`, dann der Name Pictures. Zeile 2: der Befehl zum Anzeigen des Inhalts.'
      multi: true
      answer: ['cd ..\Pictures', 'dir']
      explain: '`..\Pictures` heißt „einen Ordner nach oben (zu Student) und dann in Pictures hinein“. Danach zeigt `dir` den Inhalt von Pictures.'
  quiz:
    - kind: mcq
      q: 'Welche Antwort ist ein relativer Pfad (Relative Path)?'
      options: ['Documents\Work', 'C:\Users', '\Windows', 'D:\Backup']
      answer: 0
      code_options: true
      explain: 'Er beginnt weder mit einem Laufwerk noch mit `\`.'
    - kind: predict
      q: 'Aktueller Ordner: `C:\Users\Student`. Wohin bringt dich dieser Befehl?'
      code: 'cd Music'
      options: ['C:\Users\Student\Music', 'C:\Music', 'D:\Music', 'Er gibt einen Fehler aus']
      answer: 0
      code_options: true
      explain: 'Ein relativer Pfad wird an den aktuellen Ordner angehängt.'
    - kind: predict
      q: 'Aktueller Ordner: `C:\Users`. Was ist das Ergebnis dieses Befehls?'
      code: 'cd Music'
      options: ['Fehler: Ordner wird nicht gefunden', 'C:\Users\Music', 'C:\Users\Student\Music', 'C:\Music']
      answer: 0
      explain: 'In `C:\Users` gibt es keinen Ordner namens Music, also meldet CMD `The system cannot find the path specified.`'
  recap: 'Ein relativer Pfad wird vom aktuellen Ordner aus berechnet. `.` = genau hier, `..` = einen Ordner höher.'
