      hints:
        - 'Durchsuche mit `findstr` und dem Platzhalter (Wildcard) `*` alle Textdateien. Du brauchst einen Switch (Schalter), der auch Unterordner durchsucht, und einen, der Groß- und Kleinschreibung ignoriert.'
        - 'Der Reihe nach: Befehl (`findstr`), Switch für Unterordner (`/s`), Switch für die Schreibweise (`/i`), Suchwort (sales in `" "`), Dateimuster (`*` und `.txt`).'
      answer: 'findstr /s /i "sales" *.txt'
      explain: '`/s` führt die Suche auch in Unterordner wie Work, `/i` behandelt Groß- und Kleinbuchstaben gleich, und `*.txt` heißt alle Textdateien.'
  quiz:
    - kind: mcq
      q: 'Was findet `findstr "red blue" colors.txt`?'
