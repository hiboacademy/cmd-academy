      quotedCase: true
      show: 'findstr /c:"Status: OK" report.txt'
      explain: 'Für einen Ausdruck mit Leerzeichen nimmst du `/c:`.'
  recap: '`findstr` = mehrere Wörter (oder), `/c:` ganzer Ausdruck, `/s` Unterordner, `/m` Dateinamen, `^` und `$` Zeilenanfang und -ende.'

- n: 39
  term: tree
  fullForm: 'Tree'
  difficulty: 2
  objective: 'Du siehst die Ordnerstruktur als Baum.'
  summary: '`tree` zeigt alle Ordner (Folder) und Unterordner als Baum. Mit `/f` werden auch die Dateien angezeigt.'
  meaning: 'Die Linien `├───` und `└───` zeigen, in welchem Ordner jeder Ordner liegt. `/a` nimmt statt dieser Linien einfache ASCII-Zeichen (gut zum Speichern in einer Datei).'
  usage: 'Die Struktur eines Projekts verstehen, vor `rd /s` oder einem Backup nachsehen und Ordner dokumentieren.'
  syntax: 'tree [path] [/f] [/a]'
  demo:
    start: 'C:\Users\Student'
    cmds: ['tree Pictures /f']
  examples:
    - c: 'tree'
      d: 'Baum der Ordner im aktuellen Ordner.'
    - c: 'tree Documents /f'
      d: 'Mit Dateien.'
    - c: 'tree /a > structure.txt'
      d: 'Den Baum mit einfachen Zeichen in einer Datei speichern.'
  mistakes:
    - '`tree` auf einem echten Computer in `C:\` ausführen: Die Ausgabe hat Tausende Zeilen. Probier es zuerst mit einem kleinen Ordner.'
  tip: 'Versteckte Dateien und Ordner (wie AppData) zeigt `tree` nicht an.'
  practice:
    - id: P39a
      start: 'C:\Users\Student'
      task: 'Zeige die Struktur des Ordners Documents samt Dateinamen als Baum an.'
      checks: [{type: anyCmd, value: tree}, {type: switch, value: '/f', cmd: tree, anyRun: true}, {type: lastOutputIncludes, value: 'menu.txt'}, {type: lastOutputIncludes, value: 'Work'}]
      hints:
        - '`tree` zeigt die Ordnerstruktur als Baum, standardmäßig aber nur Ordner. Du brauchst einen Switch (Schalter), damit auch die Dateinamen erscheinen.'
        - 'Drei Teile: Was tun? (`tree`) Mit welchem Ordner? (Documents) Wie? (Switch mit dem Anfangsbuchstaben von File, mit `/`).'
      answer: 'tree Documents /f'
      explain: '`tree Documents` zeichnet den Baum des Ordners Documents, und `/f` (Files) zeigt zusätzlich die Dateinamen in jedem Ordner.'
  quiz:
    - kind: mcq
      q: 'Welcher Switch zeigt auch die Dateien im Baum?'
      options: ['/f', '/a', '/s', '/b']
      answer: 0
      code_options: true
      explain: '`/f` = Files.'
    - kind: tf
      q: '`tree` verschiebt Dateien.'
      answer: false
      explain: 'Es zeigt nur an.'
    - kind: type
      q: 'Speichere den Baum des aktuellen Ordners mit einfachen Zeichen in der Datei `tree.txt`.'
      accept: ['tree /a > tree.txt', 'tree /a >tree.txt', 'tree /f /a > tree.txt', 'tree /a /f > tree.txt']
      show: 'tree /a > tree.txt'
      explain: '`/a` eignet sich besser für Dateien.'
  recap: '`tree` = Ordnerbaum. `/f` Dateien, `/a` einfache Zeichen.'

- n: 40
  term: where
  fullForm: 'Where (locate files)'
  difficulty: 2
  objective: 'Du findest heraus, wo ein Programm liegt, und suchst Dateien in Unterordnern.'
  summary: '`where` sagt dir, wo ein Programm installiert ist. Mit `/r` findet es Dateien in einem Ordner und allen seinen Unterordnern.'
  meaning: 'Ohne `/r` sucht `where` im aktuellen Ordner (Current Directory) und in den PATH-Ordnern (Lektion 48), also genau dort, wo CMD nach Programmen zum Ausführen sucht. Platzhalter (Wildcards) sind auch erlaubt.'
  usage: 'Herausfinden, von wo `ping` oder `notepad` gestartet wird, alle Bilder oder alle Dateien eines Typs finden.'
  syntax: "where name\nwhere /r folder pattern"
  demo:
    start: 'C:\Users\Student'
    cmds: ['where notepad', 'where /r C:\Users\Student *.jpg', 'where nothing']
  examples:
    - c: 'where ping'
      d: 'Wo die Datei ping.exe liegt.'
    - c: 'where /r C:\Users\Student *.jpg'
      d: 'Alle jpg-Dateien im Benutzerordner und seinen Unterordnern.'
    - c: 'dir /s /b *.jpg'
      d: 'Ein anderer Weg: dir mit `/s` (Unterordner) und `/b`.'
  mistakes:
    - '`/r` vergessen, wenn du in Unterordnern suchen willst.'
  tip: 'Wird nichts gefunden, erscheint die Meldung `INFO: Could not find files...` und der Exit Code ist 1.'
  practice:
    - id: P40a
      start: 'C:\Users\Student'
      task: 'Finde heraus, wo das Programm `ping` installiert ist.'
      checks: [{type: anyCmd, value: where}, {type: lastOutputIncludes, value: 'C:\Windows\System32\ping.exe'}]
      hints:
        - 'Du willst wissen, wo die Programmdatei auf der Festplatte liegt. Der Befehl (Command) dieser Lektion ist genau das englische Wort für „wo“.'
        - 'Zwei Teile: Was tun? (`where`) Welches Programm? (der Name `ping`; `.exe` musst du nicht schreiben).'
      answer: 'where ping'
      explain: '`where ping` sucht im aktuellen Ordner und in den Ordnern, in denen CMD nach Programmen sucht, und zeigt den vollständigen Pfad von `ping.exe`.'
    - id: P40b
      start: 'C:\Users\Student'
      task: 'Finde alle `.jpg`-Dateien in `C:\Users\Student` und allen Unterordnern.'
      checks: [{type: lastOutputIncludes, value: 'family.jpg'}, {type: lastOutputIncludes, value: 'sea.jpg'}, {type: lastOutputIncludes, value: 'cat.jpg'}]
      hints:
        - 'Nimm `where`. Um einen Ordner und alle Unterordner zu durchsuchen, brauchst du den Switch (Schalter) `/r` (Recursive), danach kommen der Startordner und das Dateimuster.'
        - 'Der Reihe nach: Befehl (`where`), Switch (`/r`), Startordner (absoluter Pfad `C:\Users\Student`), Dateimuster (`*` und `.jpg`).'
      answer: 'where /r C:\Users\Student *.jpg'
      explain: '`where /r` beginnt im angegebenen Ordner (`C:\Users\Student`) und findet in allen Unterordnern die Dateien, die zu `*.jpg` passen.'
  quiz:
    - kind: mcq
      q: 'Was macht der Switch `/r` bei `where`?'
      options: ['Sucht im Ordner und in allen Unterordnern', 'Löscht die gefundenen Dateien', 'Zeigt die Dateigröße', 'Sucht nur im PATH']
      answer: 0
      explain: '`/r` = Recursive.'
    - kind: type
      q: 'Finde heraus, wo das Programm `notepad` liegt.'
      accept: ['where notepad', 'where notepad.exe']
      explain: '`where notepad`'
    - kind: tf
      q: 'Auch `dir /s /b *.jpg` kann jpg-Dateien in Unterordnern finden.'
      answer: true
      explain: '`/s` bedeutet bei dir: Unterordner.'
  recap: '`where Programm` = wo das Programm liegt. `where /r Ordner Muster` = Suche in Unterordnern.'

- n: 41
  term: attrib
  fullForm: 'Attributes'
  difficulty: 2
  objective: 'Du siehst und änderst Dateieigenschaften wie „versteckt“ und „schreibgeschützt“.'
  summary: 'Jede Datei hat mehrere Eigenschaften (Attributes): `H` versteckt, `R` schreibgeschützt, `S` Systemdatei und `A` bereit fürs Backup. `attrib` zeigt sie an und ändert sie mit `+` und `-`.'
  meaning: 'Eine versteckte Datei siehst du mit normalem `dir` nicht; `dir /a` zeigt alle Dateien. Eine Read-only-Datei kannst du nicht ändern und nicht mit normalem `del` löschen.'
  usage: 'Versteckte Dateien finden, eine wichtige Datei mit `+r` schützen und Probleme lösen, etwa Viren, die Dateien auf dem USB-Stick verstecken.'
  syntax: 'attrib [+r|-r] [+h|-h] [+s|-s] [file]'
  demo:
    start: 'C:\Users\Student\Documents'
    cmds: ['dir /b', 'dir /a /b', 'attrib secret.txt']
  examples:
    - c: 'dir /a'
      d: 'Alle Dateien anzeigen, auch versteckte.'
    - c: 'attrib'
      d: 'Die Attribute der Dateien im aktuellen Ordner anzeigen.'
    - c: 'attrib +r guests.txt'
      d: 'Eine Datei schreibgeschützt machen.'
    - c: 'attrib -h secret.txt'
      d: 'Eine Datei wieder sichtbar machen.'
  mistakes:
    - 'Denken, eine versteckte Datei sei sicher; jeder sieht sie mit `dir /a`.'
    - 'Die Attribute von Systemdateien (`S`) in `C:\Windows` ändern.'
  tip: 'Wenn dein USB-Stick nach einem Virus leer aussieht, tippe zuerst `dir /a`; vielleicht sind die Dateien nur versteckt.'
  practice:
    - id: P41a
      start: 'C:\Users\Student\Documents'
      task: 'In diesem Ordner gibt es eine versteckte Datei. Zeige alle Dateien an, auch die versteckten.'
      checks: [{type: anyCmd, value: dir}, {type: lastOutputIncludes, value: 'secret.txt'}]
      hints:
        - 'Eine versteckte Datei (Attribut `H`) siehst du mit normalem `dir` nicht. `dir` hat einen Switch (Schalter), der alle Dateien zeigt, egal mit welchem Attribut.'
        - 'Zwei Teile: Was tun? (`dir`) Wie? (Switch mit dem Anfangsbuchstaben von Attribute, mit `/`). Ein Argument brauchst du nicht; es zeigt diesen Ordner.'
      answer: 'dir /a'
      explain: '`dir /a` listet alle Dateien unabhängig von ihren Attributen auf; deshalb siehst du auch die versteckte Datei `secret.txt`.'
    - id: P41b
      start: 'C:\Users\Student\Documents'
      task: 'Mach die Datei `guests.txt` schreibgeschützt (Read-only).'
      checks: [{type: fileAttr, path: 'C:\Users\Student\Documents\guests.txt', attr: r}]
      hints:
        - 'Zum Ändern von Attributen nimmst du `attrib`. Das Zeichen `+` fügt ein Attribut hinzu, `-` entfernt es. Finde den Buchstaben für Read-only.'
        - 'Drei Teile: Was tun? (`attrib`) Welche Änderung? (`+` direkt vor dem Anfangsbuchstaben von Read-only, also `r`) Welche Datei? (`guests.txt`).'
      answer: 'attrib +r guests.txt'
      explain: '`attrib` ändert Attribute, und `+r` fügt `guests.txt` die Eigenschaft Read-only hinzu; danach kann die Datei nicht mehr geändert werden.'
  quiz:
    - kind: mcq
      q: 'Was bedeutet das Attribut `H`?'
      options: ['Hidden (versteckt)', 'Home', 'Hard disk', 'Help']
      answer: 0
      explain: 'H = Hidden.'
    - kind: predict
      q: 'Die Datei `a.txt` ist Read-only. Was passiert bei diesem Befehl?'
      code: 'del a.txt'
      options: ['Access is denied.', 'Die Datei wird gelöscht', 'Could Not Find', 'Are you sure (Y/N)?']
      answer: 0
      explain: 'Eine Read-only-Datei lässt sich mit normalem `del` nicht löschen (außer mit `/f`).'
    - kind: type
      q: 'Mach die Datei `notes.txt` wieder sichtbar (nicht mehr versteckt).'
      accept: ['attrib -h notes.txt']
      explain: '`-` entfernt ein Attribut.'
  recap: '`attrib` = Eigenschaften ansehen und ändern. `+` hinzufügen, `-` entfernen. `dir /a` zeigt versteckte Dateien.'

- n: 42
  term: fc
  fullForm: 'File Compare'
  difficulty: 2
  objective: 'Du vergleichst zwei Dateien und findest die Unterschiede.'
  summary: '`fc` vergleicht zwei Dateien Zeile für Zeile und zeigt die Stellen, an denen sie sich unterscheiden.'
  meaning: 'Sind die Dateien gleich, erscheint die Meldung `FC: no differences encountered`. Sonst wird der unterschiedliche Teil jeder Datei zwischen `*****`-Zeilen angezeigt. `/c` ignoriert Groß- und Kleinschreibung, `/n` zeigt Zeilennummern.'
  usage: 'Herausfinden, was sich in einer Konfigurationsdatei geändert hat, oder prüfen, ob ein Backup mit dem Original übereinstimmt.'
  syntax: 'fc [/c] [/n] file1 file2'
  demo:
    start: 'C:\Users\Student\Desktop'
    files:
      - {path: 'C:\Users\Student\Desktop\menu_old.txt', content: "Pizza 8.00\nPasta 7.00\nSalad 5.50\n"}
      - {path: 'C:\Users\Student\Desktop\menu_new.txt', content: "Pizza 8.50\nPasta 7.00\nSalad 5.50\n"}
    cmds: ['fc menu_old.txt menu_new.txt', 'fc menu_new.txt menu_new.txt']
  examples:
    - c: 'fc menu_old.txt menu_new.txt'
      noTry: true
      d: 'Die unterschiedlichen Zeilen anzeigen.'
    - c: 'fc /n a.txt b.txt'
      noTry: true
      d: 'Mit Zeilennummern.'
    - c: 'fc /c a.txt b.txt'
      noTry: true
      d: 'Ohne Rücksicht auf Groß- und Kleinschreibung.'
  mistakes:
    - 'Dateien vergleichen, die keine Textdateien sind, und eine lesbare Ausgabe erwarten.'
  tip: 'Exit Code von `fc`: 0 heißt gleich, 1 heißt unterschiedlich. In Batch-Skripten praktisch, um ein Backup zu prüfen.'
  practice:
    - id: P42a
      start: 'C:\Users\Student\Desktop'
      files:
        - {path: 'C:\Users\Student\Desktop\menu_old.txt', content: "Pizza 8.00\nPasta 7.00\nSalad 5.50\n"}
        - {path: 'C:\Users\Student\Desktop\menu_new.txt', content: "Pizza 8.50\nPasta 7.00\nSalad 5.50\n"}
      task: 'Vergleiche die Dateien `menu_old.txt` und `menu_new.txt` und finde heraus, bei welchem Gericht sich der Preis geändert hat.'
      checks: [{type: anyCmd, value: fc, evenIfFailed: true}, {type: lastOutputIncludes, value: '8.50'}, {type: lastOutputIncludes, value: '*****'}]
      hints:
        - 'Zum Vergleichen zweier Dateien nimmst du `fc` (File Compare) und gibst ihm beide Dateinamen hintereinander.'
        - 'Drei Teile: Was tun? (`fc`) Erste Datei? (`menu_old.txt`) Zweite Datei? (`menu_new.txt`). In der Ausgabe stehen die unterschiedlichen Zeilen zwischen `*****`.'
      answer: 'fc menu_old.txt menu_new.txt'
      explain: '`fc` vergleicht die beiden Dateien Zeile für Zeile und zeigt nur die unterschiedlichen Zeilen; hier hat sich der Preis von Pizza von 8.00 auf 8.50 geändert.'
    - id: P42b
      start: 'C:\Users\Student\Desktop'
      files:
        - {path: 'C:\Users\Student\Desktop\a.txt', content: "Hello CMD\n"}
        - {path: 'C:\Users\Student\Desktop\b.txt', content: "HELLO cmd\n"}
      task: 'Vergleiche `a.txt` und `b.txt`, ohne auf Groß- und Kleinschreibung zu achten. (Sie sollen als gleich erkannt werden.)'
      checks: [{type: switch, value: '/c', cmd: fc, anyRun: true}, {type: lastOutputIncludes, value: 'no differences'}]
      hints:
        - 'Wieder `fc`, aber diesmal musst du sagen, dass Groß- und Kleinschreibung egal ist. Dafür hat `fc` einen Switch (Schalter).'
        - 'Der Reihe nach: Befehl (`fc`), Switch zum Ignorieren der Schreibweise (`/c` von Case), erste Datei (`a.txt`), zweite Datei (`b.txt`).'
      answer: 'fc /c a.txt b.txt'
      explain: '`/c` sagt `fc`, dass `Hello` und `HELLO` gleich sind; also gelten die beiden Dateien als gleich, und die Meldung `no differences` erscheint.'
  quiz:
    - kind: mcq
      q: 'Was meldet `fc`, wenn zwei Dateien gleich sind?'
      options: ['FC: no differences encountered', 'Files are equal', '*****', 'Nichts']
      answer: 0
      explain: 'Die Standardmeldung von fc.'
    - kind: mcq
      q: 'Welcher Switch zeigt die Zeilennummern?'
      options: ['/n', '/c', '/l', '/b']
      answer: 0
      code_options: true
      explain: '`/n` = Number.'
    - kind: tf
      q: 'Exit Code 0 nach `fc` bedeutet, dass die Dateien gleich sind.'
      answer: true
      explain: '0 = gleich, 1 = unterschiedlich.'
  recap: '`fc Datei1 Datei2` = vergleichen. `/c` Schreibweise egal, `/n` Zeilennummern. Exit Code 0 heißt gleich.'

- n: 43
  term: xcopy
  fullForm: 'Extended Copy'
  difficulty: 2
  objective: 'Du kopierst einen Ordner samt Unterordnern.'
  summary: '`xcopy` ist wie `copy`, kopiert aber auch Ordner und Unterordner. Die wichtigsten Switches (Schalter): `/s`, `/e`, `/i` und `/y`.'
  meaning: '`/s` kopiert nicht leere Unterordner, `/e` sogar die leeren. `/i` sagt: Wenn das Ziel nicht existiert, nimm an, dass es ein Ordner ist (sonst fragt xcopy „File oder Directory?“). `/y` überschreibt ohne Nachfrage.'
  usage: 'Ein Backup von einem ganzen Ordner machen, ein Projekt auf den USB-Stick kopieren.'
  syntax: 'xcopy source destination [/s] [/e] [/i] [/y] [/h]'
  demo:
    start: 'C:\Users\Student'
    cmds: ['xcopy Documents D:\DocsBackup /e /i', 'tree D:\DocsBackup /f']
  examples:
    - c: 'xcopy Documents D:\DocsBackup /e /i'
      d: 'Documents komplett mit Unterordnern kopieren.'
    - c: 'xcopy *.txt E:\Texts /i'
      at: 'C:\Users\Student\Documents'
      d: 'Alle txt-Dateien in einen neuen Ordner auf dem USB-Stick kopieren.'
    - c: 'xcopy Documents D:\DocsBackup /s /y'
      d: 'Das Backup ohne Nachfrage aktualisieren.'
    - c: 'xcopy Documents E:\Docs /e /i /l'
      d: '`/l` zeigt nur die Liste, kopiert aber nichts.'
  mistakes:
    - '`/s` oder `/e` vergessen: Die Unterordner werden nicht kopiert.'
    - 'Sich über die Frage `F = file, D = directory` wundern: Mit `/i` oder der Antwort `D` ist das gelöst.'
  tip: 'Versteckte Dateien werden nur mit `/h` kopiert.'
  practice:
    - id: P43a
      start: 'C:\Users\Student'
      task: 'Kopiere den ganzen Ordner Documents samt Unterordnern nach `D:\DocsBackup`.'
      inputs: ['d']
      checks: [{type: fileExists, path: 'D:\DocsBackup\menu.txt'}, {type: fileExists, path: 'D:\DocsBackup\Work\report.txt'}]
      hints:
        - '`copy` kopiert keine Unterordner; nimm `xcopy`. Du brauchst einen Switch, der alle Unterordner kopiert (auch leere), und einen Switch, der das Ziel als Ordner behandelt.'
        - 'Der Reihe nach: Befehl (Command, `xcopy`), Quelle (Ordner Documents), Ziel (`D:\DocsBackup`), Switch für Unterordner (`/e`), Switch „Ziel ist ein Ordner“ (`/i`).'
      answer: 'xcopy Documents D:\DocsBackup /e /i'
      explain: '`xcopy` kopiert den Ordner Documents nach `D:\DocsBackup`; `/e` nimmt alle Unterordner mit, auch leere, und `/i` verhindert die Frage, ob das Ziel File oder Directory ist.'
  quiz:
    - kind: mcq
      q: 'Was ist der Unterschied zwischen `/s` und `/e` bei xcopy?'
      options: ['`/e` kopiert auch leere Ordner', '`/s` ist schneller', '`/e` kopiert nur Dateien', 'Es gibt keinen Unterschied']
      answer: 0
      explain: '`/s` lässt leere Ordner aus.'
    - kind: predict
      q: 'Das Ziel `D:\New` existiert nicht. Was macht xcopy ohne `/i`?'
      code: 'xcopy Documents D:\New /s'
      options: ['Es fragt, ob das Ziel eine Datei oder ein Ordner ist', 'Es gibt einen Fehler aus und bricht ab', 'Es legt still einen Ordner an', 'Es schreibt alles in eine einzige Datei']
      answer: 0
      explain: 'Es stellt die Frage `(F = file, D = directory)?`.'
    - kind: type
      q: 'Kopiere den Ordner `Pictures` mit allen Unterordnern nach `E:\Pics`, ohne Nachfrage, ob Datei oder Ordner.'
      accept: ['xcopy pictures e:\pics /e /i', 'xcopy pictures e:\pics /s /i', 'xcopy pictures e:\pics /e /i /y', 'xcopy pictures e:\pics /i /e', 'xcopy pictures e:\pics /i /s']
      show: 'xcopy Pictures E:\Pics /e /i'
      explain: '`/e` = Unterordner, `/i` = Ziel ist ein Ordner.'
  recap: '`xcopy` = Ordner kopieren. `/s` oder `/e` Unterordner, `/i` Ziel ist ein Ordner, `/y` ohne Nachfrage, `/h` versteckte Dateien.'

- n: 44
  term: robocopy
  fullForm: 'Robust File Copy'
  difficulty: 3
  objective: 'Du kopierst Ordner mit robocopy zuverlässig und clever und kennst die Gefahr von `/mir`.'
  summary: '`robocopy` ist das Profi-Werkzeug zum Kopieren von Ordnern: Es kopiert nur neue oder geänderte Dateien, liefert einen ausführlichen Bericht und macht nach einer Unterbrechung weiter.'
  meaning: 'Die Syntax ist anders: zuerst der Quellordner, dann der Zielordner, dann (optional) das Dateimuster. `/e` = Unterordner, `/mir` macht das Ziel zum Spiegelbild der Quelle, `/l` zeigt nur die Liste.'
  usage: 'Regelmäßige Backups, Ordner synchronisieren, große Datenmengen übertragen.'
  syntax: 'robocopy source destination [files] [/e] [/mir] [/l]'
  warning: '`/mir` löscht im Ziel jede Datei, die es in der Quelle nicht gibt. Wenn du Quelle und Ziel vertauschst, kann dein Backup gelöscht werden.'
  demo:
    start: 'C:\Users\Student'
    cmds: ['robocopy Documents D:\Sync /e']
  examples:
    - c: 'robocopy Documents D:\Sync /e'
      d: 'Einen Ordner mit Unterordnern kopieren.'
    - c: 'robocopy Documents D:\Sync *.txt'
      d: 'Nur die txt-Dateien.'
    - c: 'robocopy Documents D:\Sync /e /l'
      d: 'Nur zeigen, was kopiert würde.'
    - c: 'robocopy Documents D:\Mirror /mir'
      d: 'Vollständiger Spiegel (gefährlich).'
      noTry: true
  mistakes:
    - 'Einen Dateinamen als Quelle angeben; robocopy erwartet immer einen Ordner.'
    - 'Denken, Exit Code 1 bedeute einen Fehler; bei robocopy heißt er „Dateien wurden kopiert“.'
  tip: 'Führst du denselben Befehl noch einmal aus, überspringt (Skip) er unveränderte Dateien; ideal für tägliche Backups.'
  practice:
    - id: P44a
      start: 'C:\Users\Student'
      task: 'Kopiere mit robocopy den ganzen Ordner Pictures samt Unterordnern nach `E:\PicBackup`.'
      checks: [{type: fileExists, path: 'E:\PicBackup\beach.jpg'}, {type: fileExists, path: 'E:\PicBackup\Holidays\family.jpg'}]
      hints:
        - '`robocopy` bekommt zuerst den Quellordner, dann den Zielordner und zum Schluss die Switches (Schalter). Für die Unterordner brauchst du auch einen Switch.'
        - 'Der Reihe nach: Befehl (Command, `robocopy`), Quelle (Ordner Pictures), Ziel (`E:\PicBackup`), Switch für Unterordner (`/e`).'
      answer: 'robocopy Pictures E:\PicBackup /e'
      explain: '`robocopy` kopiert den Inhalt von `Pictures` nach `E:\PicBackup`, und `/e` sorgt dafür, dass auch Unterordner wie Holidays mitkopiert werden.'
    - id: P44b
      start: 'C:\Users\Student'
      task: 'Schau nur nach, welche Dateien robocopy beim Kopieren von Documents nach `D:\Test` kopieren würde, ohne wirklich zu kopieren.'
      checks: [{type: anyCmd, value: robocopy, evenIfFailed: true}, {type: switch, value: '/l', cmd: robocopy, anyRun: true}, {type: fileNotExists, path: 'D:\Test\menu.txt'}, {type: lastOutputIncludes, value: 'menu.txt'}]
      hints:
        - 'Derselbe Aufbau von `robocopy` (Quelle, Ziel, Switch), aber mit einem Switch, der nur die Liste der Aktionen zeigt und keine Datei wirklich kopiert.'
        - 'Der Reihe nach: Befehl (`robocopy`), Quelle (Documents), Ziel (`D:\Test`), Switch „nur auflisten“ (`/l` von List).'
      answer: 'robocopy Documents D:\Test /l'
      explain: '`/l` sagt `robocopy`, dass es nur berichten soll, welche Dateien es von Documents nach `D:\Test` kopieren würde; es wird keine Datei kopiert.'
  quiz:
    - kind: mcq
      q: 'Was bedeutet Exit Code 1 nach robocopy?'
      options: ['Die Dateien wurden erfolgreich kopiert', 'Ein Fehler ist aufgetreten', 'Es gab keine Dateien', 'Zugriff verweigert']
      answer: 0
      explain: 'Bei robocopy bedeuten die Codes 0 bis 7 Erfolg; 8 und höher heißt Fehler.'
    - kind: mcq
      q: 'Welcher Switch macht das Ziel genau wie die Quelle und löscht überzählige Dateien?'
      options: ['/mir', '/e', '/l', '/s']
      answer: 0
      code_options: true
      explain: '`/mir` = Mirror (Spiegel); mit Vorsicht verwenden.'
    - kind: fix
      q: 'Dieser Befehl funktioniert nicht. Warum?'
      code: 'robocopy menu.txt D:\Backup'
      options: ['Die Quelle muss ein Ordner sein, und der Dateiname kommt nach dem Ziel', 'Es fehlt `/mir`', 'D:\Backup darf nicht existieren', 'robocopy kopiert keine txt-Dateien']
      answer: 0
      explain: 'Richtig: `robocopy . D:\Backup menu.txt`'
  recap: '`robocopy Quelle Ziel [Dateien]`. `/e` Unterordner, `/l` Probelauf, `/mir` Spiegel (gefährlich). Exit Code unter 8 = Erfolg.'
