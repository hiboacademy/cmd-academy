# Lessons 33–44 · Chapter 6: pipes, text, search and copying folders

- n: 33
  term: '|'
  fullForm: 'Pipe'
  difficulty: 2
  objective: 'Du gibst die Ausgabe eines Befehls (Command) direkt als Eingabe an einen anderen Befehl weiter.'
  summary: '`|` schickt die Ausgabe des linken Befehls nicht auf den Bildschirm, sondern in die Eingabe des rechten Befehls. Wie ein Rohr, das zwei Befehle verbindet.'
  meaning: 'Bei `type menu.txt | find "Pizza"` gibt zuerst `type` alle Zeilen aus. Diese Zeilen erscheinen nicht auf dem Bildschirm, sondern gehen in `find`, und `find` zeigt nur die Zeile mit Pizza. Warum funktioniert das? Wenn `find` keinen Dateinamen bekommt, liest es seine Eingabe aus der Pipe.'
  usage: 'Lange Ausgaben filtern: die IP-Adresse in `ipconfig` finden, ein Programm in `tasklist` finden, Listen sortieren.'
  syntax: 'command1 | command2'
  demo:
    start: 'C:\Users\Student\Documents'
    cmds: ['type menu.txt | find "Pizza"', 'ipconfig | find "IPv4"', 'dir /b | sort /r']
  examples:
    - c: 'type menu.txt | find "Pizza"'
      d: 'Nur die Pizza-Zeile aus der Speisekarte.'
    - c: 'dir | find ".txt"'
      d: 'Nur die Zeilen der dir-Ausgabe, die `.txt` enthalten.'
    - c: 'ipconfig | find "IPv4"'
      d: 'Nur die IPv4-Adresse.'
    - c: 'tasklist | find "chrome"'
      d: 'Nur die Chrome-Prozesse.'
  mistakes:
    - '`|` mit `||` verwechseln (Lektion 31).'
    - 'Einen Befehl, der keine Eingabe liest (wie `dir`), rechts von der Pipe setzen.'
  tip: 'Du kannst mehrere Pipes hintereinander setzen: `type guests.txt | sort | more`'
  restaurant: 'Der Kellner gibt die Bestellung direkt an den Koch, der Koch gibt das Essen direkt an den, der es anrichtet. Niemand legt die Bestellung zwischendurch auf einem Tisch ab.'
  practice:
    - id: P33a
      start: 'C:\Users\Student\Documents'
      task: 'Zeige mit `type` und einer Pipe nur die Zeile aus `menu.txt`, die `Pasta` enthält.'
      checks: [{type: usedOp, value: '|'}, {type: lastOutputIncludes, value: 'Pasta'}, {type: lastOutputExcludes, value: 'Pizza'}]
      hints:
        - 'Mit der Pipe (`|`) geht die Ausgabe eines Befehls direkt in den nächsten Befehl. `type` gibt alle Zeilen der Speisekarte aus; gib sie an `find` weiter, damit nur die gesuchte Zeile übrig bleibt.'
        - 'Drei Teile: der linke Befehl (`type` + `menu.txt`), das Pipe-Zeichen (`|`), der rechte Befehl (`find` + das Wort Pasta in Anführungszeichen).'
      answer: 'type menu.txt | find "Pasta"'
      explain: '`type menu.txt` erzeugt alle Zeilen, und `|` gibt sie statt an den Bildschirm an `find "Pasta"` weiter; `find` zeigt nur die Zeile mit Pasta.'
    - id: P33b
      start: 'C:\Users\Student'
      task: 'Zeige aus der Ausgabe von `ipconfig` nur die Zeile `IPv4`.'
      checks: [{type: usedOp, value: '|'}, {type: lastOutputIncludes, value: '192.168.1.24'}, {type: lastOutputExcludes, value: 'Subnet'}]
      hints:
        - '`ipconfig` gibt sehr viele Infos aus. Gib die Ausgabe per Pipe an `find`, damit nur die Zeile mit dem Wort IPv4 übrig bleibt.'
        - 'Drei Teile: erster Befehl (`ipconfig`), das Zeichen `|`, zweiter Befehl (`find` + der Text IPv4 in `" "`). Achte auf die richtige Groß- und Kleinschreibung von IPv4.'
      answer: 'ipconfig | find "IPv4"'
      explain: '`ipconfig` liefert alle Netzwerkeinstellungen, und `|` schickt sie an `find "IPv4"`, das nur die Zeile mit der IPv4-Adresse behält.'
  quiz:
    - kind: mcq
      q: 'Woher kommt bei `A | B` die Eingabe von Befehl B?'
      options: ['Aus der Ausgabe von A', 'Von der Tastatur', 'Aus einer Datei', 'Vom vorherigen Befehl in der History']
      answer: 0
      explain: 'Die Pipe verbindet die Ausgabe von A mit der Eingabe von B.'
    - kind: predict
      q: 'menu.txt enthält Pizza, Pasta und Salad. Was ist die Ausgabe?'
      code: 'type menu.txt | find "Sa"'
      options: ['Nur die Zeile Salad', 'Pasta und Salad', 'Alle Zeilen', 'Nichts']
      answer: 0
      explain: '`find` unterscheidet Groß- und Kleinschreibung; „Pasta“ enthält kein „Sa“ mit großem S.'
    - kind: type
      q: 'Zeige aus der Ausgabe von `tasklist` nur die Zeilen mit `notepad`.'
      accept: ['tasklist | find "notepad"', 'tasklist | find /i "notepad"', 'tasklist | findstr notepad', 'tasklist | findstr /i notepad', 'tasklist | find "notepad.exe"']
      show: 'tasklist | find "notepad"'
      explain: 'Gib die Ausgabe von tasklist an find weiter.'
    - kind: sim
      q: 'Zeige aus der Prozessliste nur die Zeilen mit `notepad`.'
      start: 'C:\Users\Student'
      checks: [{type: usedOp, value: '|'}, {type: lastOutputIncludes, value: 'notepad.exe'}, {type: lastOutputExcludes, value: 'chrome.exe'}]
      answer: 'tasklist | find /i "notepad"'
      explain: 'Die Ausgabe von `tasklist` wird mit `|` an `find` weitergegeben.'
  recap: '`A | B` = die Ausgabe von A wird zur Eingabe von B. Ideal zum Filtern langer Ausgaben.'

- n: 34
  term: more
  fullForm: 'More (page by page)'
  difficulty: 2
  objective: 'Du liest lange Ausgaben Seite für Seite.'
  summary: '`more` zeigt die Ausgabe seitenweise an und wartet. Leertaste (Space) = nächste Seite, Enter = nächste Zeile, Q = beenden.'
  meaning: '`more` bekommt seine Eingabe entweder aus einer Datei (`more file.txt`) oder aus einer Pipe (`help | more`). Unten auf dem Bildschirm siehst du `-- More --` und wie viel Prozent schon gelesen ist.'
  usage: 'Lange Hilfetexte, Logs und die Ausgabe von Befehlen wie `systeminfo` lesen.'
  syntax: "more file\ncommand | more"
  examples:
    - c: 'help | more'
      d: 'Die Befehlsliste Seite für Seite.'
    - c: 'more C:\Windows\win.ini'
      d: 'Eine Datei mit more anzeigen.'
    - c: 'systeminfo | more'
      d: 'Systeminfos in Ruhe lesen.'
  mistakes:
    - 'Denken, CMD hängt fest; `-- More --` wartet nur auf deinen Tastendruck.'
  tip: 'Auch im Simulator gilt: Wenn `-- More --` erscheint, drücke Space oder Enter; zum Beenden Q.'
  practice:
    - id: P34a
      start: 'C:\Users\Student'
      task: 'Zeige die Befehlsliste von `help` Seite für Seite an. (Mit Space weiterblättern oder mit Q beenden.)'
      checks: [{type: anyCmd, value: more}, {type: usedOp, value: '|'}, {type: argIncludes, cmd: help, value: ''}]
      inputs: [' ', 'q']
      hints:
        - 'Die Ausgabe von `help` ist lang. Gib sie per Pipe an `more`, damit sie seitenweise angezeigt wird und auf deinen Tastendruck wartet.'
        - 'Drei Teile: der Befehl mit der langen Ausgabe (`help`), das Zeichen `|`, der Befehl zum seitenweisen Anzeigen (`more`). Dann mit Space die nächste Seite ansehen und mit `Q` beenden.'
      answer: 'help | more'
      explain: '`help` liefert die Befehlsliste, und `|` schickt sie an `more`; `more` zeigt jeweils eine Seite und blättert mit Space weiter.'
  quiz:
    - kind: mcq
      q: 'Welche Taste blättert bei `-- More --` eine ganze Seite weiter?'
      options: ['Space', 'Enter', 'Q', 'Esc']
      answer: 0
      explain: 'Space = nächste Seite, Enter = nur eine Zeile, Q = beenden.'
    - kind: type
      q: 'Zeige die Datei `log.txt` Seite für Seite an.'
      accept: ['more log.txt', 'type log.txt | more', 'more < log.txt']
      show: 'more log.txt'
      explain: '`more log.txt` oder `type log.txt | more`'
    - kind: tf
      q: '`more` verändert den Inhalt der Datei.'
      answer: false
      explain: 'Es zeigt ihn nur an.'
  recap: '`more` = Seite für Seite. Space = Seite, Enter = Zeile, Q = beenden.'

- n: 35
  term: sort
  fullForm: 'Sort'
  difficulty: 2
  objective: 'Du sortierst die Zeilen einer Datei oder einer Befehlsausgabe alphabetisch.'
  summary: '`sort` sortiert Zeilen von A bis Z. Mit `/r` umgekehrt (Z bis A).'
  meaning: '`sort` achtet nicht auf Groß- und Kleinschreibung und verändert die Originaldatei nicht; es zeigt nur die sortierte Ausgabe. Zum Speichern nimmst du `>` oder `/o`.'
  usage: 'Namenslisten sortieren, die Ausgabe von `dir /b` sortieren oder Daten, die von einem anderen Befehl kommen.'
  syntax: "sort [/r] [file] [/o outfile]\ncommand | sort"
  demo:
    start: 'C:\Users\Student\Documents'
    cmds: ['type guests.txt', 'sort guests.txt', 'sort /r guests.txt']
  examples:
    - c: 'sort guests.txt'
      d: 'Sortiert anzeigen.'
    - c: 'type guests.txt | sort'
      d: 'Dasselbe mit einer Pipe.'
    - c: 'sort guests.txt > sorted.txt'
      d: 'Das Ergebnis in einer neuen Datei speichern.'
    - c: 'dir /b | sort /r'
      d: 'Dateiliste in umgekehrter Reihenfolge.'
  mistakes:
    - '`sort guests.txt > guests.txt` schreiben: Die Datei wird geleert, bevor sie gelesen wird! Schreib immer in eine neue Datei.'
  tip: 'Zahlen werden als Text sortiert: `10` kommt vor `9`.'
  practice:
    - id: P35a
      start: 'C:\Users\Student\Documents'
      task: 'Zeige die Namen aus `guests.txt` sortiert (A bis Z) an.'
      checks: [{type: anyCmd, value: sort}, {type: outputOrder, value: ['Ali', 'David', 'hibo', 'mina', 'Reza', 'Sara']}]
      hints:
        - 'Zum Sortieren der Zeilen einer Datei nimmst du `sort` und gibst ihm den Dateinamen als Argument (Ziel).'
        - 'Zwei Teile: Was tun? (`sort`) Mit welcher Datei? (`guests.txt`). `sort` ignoriert Groß- und Kleinschreibung, deshalb steht `hibo` zwischen David und mina.'
      answer: 'sort guests.txt'
      explain: '`sort guests.txt` zeigt die Zeilen der Datei alphabetisch (A bis Z); die Datei selbst bleibt unverändert.'
    - id: P35b
      start: 'C:\Users\Student\Documents'
      task: 'Speichere die sortierte Version von `guests.txt` in der neuen Datei `sorted.txt`.'
      checks: [{type: fileOrder, path: 'C:\Users\Student\Documents\sorted.txt', value: ['Ali', 'David', 'hibo', 'mina', 'Reza', 'Sara']}]
      hints:
        - '`sort` zeigt das Ergebnis nur an. Um es zu speichern, leitest du die Ausgabe mit einer Umleitung (Redirect, `>`) in eine neue Datei um.'
        - 'Drei Teile: der Sortierbefehl (`sort` + `guests.txt`), das Zeichen `>`, der Name der neuen Datei (`sorted.txt`).'
      answer: 'sort guests.txt > sorted.txt'
      explain: '`sort guests.txt` sortiert die Namen, und `>` schreibt diese Ausgabe in `sorted.txt`; das Original `guests.txt` bleibt unberührt.'
  quiz:
    - kind: mcq
      q: 'Welcher Switch (Schalter) kehrt die Reihenfolge um?'
      options: ['/r', '/o', '/b', '/s']
      answer: 0
      code_options: true
      explain: '`/r` = Reverse.'
    - kind: predict
      q: 'Was gibt dieser Befehl bei den Eingabezeilen `b`, `C`, `a` aus?'
      code: 'sort names.txt'
      options: ["a\nb\nC", "C\na\nb", "b\nC\na", "a\nC\nb"]
      answer: 0
      code_options: true
      explain: 'sort achtet nicht auf Groß- und Kleinschreibung.'
    - kind: tf
      q: '`sort guests.txt` speichert die Datei guests.txt sortiert ab.'
      answer: false
      explain: 'Es zeigt nur an; zum Speichern nimmst du `>`.'
  recap: '`sort Datei` oder `... | sort`. `/r` = umgekehrt. Die Originaldatei bleibt unverändert.'

- n: 36
  term: '<'
  fullForm: 'Input redirection'
  difficulty: 2
  objective: 'Du gibst einem Befehl (Command) seine Eingabe aus einer Datei.'
  summary: '`<` schickt den Inhalt einer Datei statt der Tastatur in die Eingabe eines Befehls. Das Gegenteil von `>`, das die Ausgabe in eine Datei schreibt.'
  meaning: '`sort < guests.txt` heißt: „Gib guests.txt als Eingabe an sort.“ Das Ergebnis ist wie bei `type guests.txt | sort`, aber ohne einen zweiten Befehl auszuführen.'
  usage: 'Dateien an Befehle geben, die von der Eingabe lesen (sort, find, more), und in Batch-Skripten die erste Zeile einer Datei mit `set /p` lesen (Lektion 74).'
  syntax: "command < file\ncommand < input.txt > output.txt"
  demo:
    start: 'C:\Users\Student\Documents'
    cmds: ['sort < guests.txt', 'find "Soup" < menu.txt']
  examples:
    - c: 'sort < guests.txt'
      d: 'Den Dateiinhalt sortieren.'
    - c: 'find "Pizza" < menu.txt'
      d: 'In der Eingabe aus einer Datei suchen.'
    - c: 'sort < guests.txt > sorted.txt'
      d: 'Eingabe aus einer Datei, Ausgabe in eine andere Datei.'
  mistakes:
    - 'Die Richtung verkehrt herum schreiben: `sort > guests.txt` leert die Datei!'
  tip: 'Schau auf die Pfeilrichtung: `<` zeigt zum Befehl (Eingabe), `>` zeigt zur Datei (Ausgabe).'
  daily: '`>` ist wie Wasser aus dem Glas in die Flasche gießen; `<` ist wie Wasser aus der Flasche ins Glas gießen.'
  practice:
    - id: P36a
      start: 'C:\Users\Student\Documents'
      task: 'Gib mit `<` den Inhalt von `guests.txt` an `sort`, damit die Namen sortiert angezeigt werden.'
      checks: [{type: usedOp, value: '<'}, {type: outputOrder, value: ['Ali', 'David', 'Sara']}]
      hints:
        - 'Das Zeichen `<` schickt den Inhalt einer Datei in die Eingabe eines Befehls (das Gegenteil von `>`). Gib den Dateinamen diesmal nicht direkt an `sort`, sondern schick ihn über `<`.'
        - 'Drei Teile: der Befehl (`sort`), das Eingabezeichen (`<`, das zum Befehl zeigt), die Quelldatei (`guests.txt`).'
      answer: 'sort < guests.txt'
      explain: '`<` gibt den Inhalt von `guests.txt` an `sort`, als hättest du ihn eingetippt, und `sort` zeigt ihn sortiert an.'
    - id: P36b
      start: 'C:\Users\Student\Documents'
      task: 'Finde mit `find` und `<` die Zeile `Soup` in `menu.txt`.'
      checks: [{type: usedOp, value: '<'}, {type: anyCmd, value: find}, {type: lastOutputIncludes, value: 'Soup'}]
      hints:
        - '`find` bekommt den Suchtext in Anführungszeichen. Statt den Dateinamen als Argument anzugeben, schickst du den Dateiinhalt mit `<` in die Eingabe von `find`.'
        - 'Drei Teile: der Befehl mit dem Suchtext (`find` + Soup in `" "`), das Zeichen `<`, die Quelldatei (`menu.txt`).'
      answer: 'find "Soup" < menu.txt'
      explain: '`find "Soup"` sucht nach dem Wort Soup, und `< menu.txt` schickt den Inhalt der Speisekarte in seine Eingabe; also wird die Zeile mit Soup angezeigt.'
  quiz:
    - kind: mcq
      q: 'Welche Datei wird bei `sort < a.txt > b.txt` gelesen?'
      options: ['a.txt', 'b.txt', 'Beide', 'Keine']
      answer: 0
      explain: '`<` ist die Eingabe und `>` die Ausgabe.'
    - kind: fix
      q: 'Der Benutzer wollte die Datei sortiert sehen, aber jetzt ist sie leer. Warum?'
      code: 'sort > guests.txt'
      options: ['Die Pfeilrichtung ist falsch; es hätte `<` sein müssen', '`sort` löscht die Datei', 'Es fehlte `/r`', 'Zuerst hätte `type` stehen müssen']
      answer: 0
      explain: '`>` öffnet die Datei zum Schreiben und leert sie dabei.'
    - kind: type
      q: 'Gib den Inhalt von `names.txt` mit `<` an `sort`.'
      accept: ['sort < names.txt', 'sort <names.txt']
      show: 'sort < names.txt'
      explain: '`sort < names.txt`'
  recap: '`Befehl < Datei` = Eingabe aus einer Datei. `<` Eingabe, `>` Ausgabe, `|` verbindet zwei Befehle.'

- n: 37
  term: find
  fullForm: 'Find text'
  difficulty: 2
  objective: 'Du findest Zeilen mit einem bestimmten Text in Dateien oder in Befehlsausgaben.'
  summary: '`find "Text" Datei` zeigt alle Zeilen, die diesen Text enthalten. Der Suchtext steht immer in Anführungszeichen.'
  meaning: 'Wichtige Switches (Schalter): `/i` ohne Rücksicht auf Groß- und Kleinschreibung, `/c` nur die Anzahl der Zeilen, `/n` Zeilennummern, `/v` Zeilen, die den Text NICHT enthalten.'
  usage: 'In Logs und Textdateien suchen und Befehlsausgaben mit einer Pipe filtern.'
  syntax: 'find [/i] [/c] [/n] [/v] "text" [file...]'
  demo:
    start: 'C:\Users\Student\Documents'
    cmds: ['find "Pizza" menu.txt', 'find /c /i "a" guests.txt', 'find /n "S" guests.txt']
  examples:
    - c: 'find "Pizza" menu.txt'
      d: 'Zeilen, die Pizza enthalten.'
    - c: 'find /i "pizza" menu.txt'
      d: 'Ohne Rücksicht auf Groß- und Kleinschreibung.'
    - c: 'find /c "a" guests.txt'
      d: 'Nur die Anzahl der Zeilen, die „a“ enthalten.'
    - c: 'find /v "a" menu.txt'
      d: 'Zeilen, die kein „a“ enthalten.'
  mistakes:
    - 'Die Anführungszeichen weglassen: `find Pizza menu.txt` ergibt den Fehler `Parameter format not correct`.'
    - '`/i` vergessen und deshalb „pizza“ mit kleinem p nicht finden.'
  tip: 'Exit Code: Wird etwas gefunden, ist er `0`, sonst `1`. Deshalb funktioniert `find ... && echo found` (Lektion 62).'
  practice:
    - id: P37a
      start: 'C:\Users\Student\Documents'
      task: 'Zähle, wie viele Zeilen in `guests.txt` den Buchstaben `a` enthalten, egal ob groß oder klein.'
      checks: [{type: anyCmd, value: find}, {type: switch, value: '/c', cmd: find, anyRun: true}, {type: switch, value: '/i', cmd: find, anyRun: true}, {type: lastOutputMatches, value: '(^|: )5\s*$'}]
      hints:
        - 'Nimm `find`, aber lass dir statt der Zeilen nur ihre Anzahl zeigen. Du brauchst einen Switch zum Zählen und einen Switch, der Groß- und Kleinschreibung ignoriert.'
        - 'Der Reihe nach: Befehl (`find`), Zähl-Switch (`/c` von Count), Switch für die Schreibweise (`/i` von Ignore case), Suchtext (`a` in `" "`) und die Datei (`guests.txt`).'
      answer: 'find /c /i "a" guests.txt'
      explain: '`/c` liefert statt der Zeilen nur ihre Anzahl, und `/i` sorgt dafür, dass `a` und `A` gleich zählen; `"a"` ist der Suchtext und `guests.txt` die Zieldatei.'
    - id: P37b
      start: 'C:\Users\Student\Documents'
      task: 'Zeige die Zeilen aus `menu.txt`, die den Buchstaben `a` NICHT enthalten.'
      checks: [{type: switch, value: '/v', cmd: find, anyRun: true}, {type: lastOutputIncludes, value: 'Soup'}, {type: lastOutputExcludes, value: 'Pizza'}]
      hints:
        - 'Diesmal willst du die Zeilen, die den Text nicht enthalten. `find` hat einen „Umkehr“-Switch, der das Ergebnis umdreht.'
        - 'Der Reihe nach: Befehl (`find`), Umkehr-Switch (`/v`), Suchtext (`a` in `" "`), Datei (`menu.txt`).'
      answer: 'find /v "a" menu.txt'
      explain: 'Normalerweise zeigt `find` die Zeilen mit dem Text; `/v` dreht das um, und es erscheinen nur Zeilen aus `menu.txt` ohne `a`, zum Beispiel Soup.'
  quiz:
    - kind: fix
      q: 'Warum gibt dieser Befehl einen Fehler aus?'
      code: "find Pizza menu.txt\nFIND: Parameter format not correct"
      options: ['Der Suchtext hat keine Anführungszeichen', 'menu.txt existiert nicht', 'Es fehlt `/i`', '`find` funktioniert nicht mit Dateien']
      answer: 0
      explain: 'Richtig: `find "Pizza" menu.txt`'
    - kind: mcq
      q: 'Welcher Switch zeigt nur die Anzahl der gefundenen Zeilen?'
      options: ['/c', '/n', '/v', '/i']
      answer: 0
      code_options: true
      explain: '`/c` = Count.'
    - kind: type
      q: 'Finde in `log.txt` die Zeilen mit `error`, egal ob groß oder klein geschrieben.'
      accept: ['find /i "error" log.txt', 'find "error" /i log.txt', 'findstr /i error log.txt', 'findstr /i "error" log.txt']
      show: 'find /i "error" log.txt'
      explain: '`/i` ignoriert Groß- und Kleinschreibung.'
    - kind: sim
      q: 'Zähle die Zeilen von `guests.txt` (in Documents).'
      start: 'C:\Users\Student\Documents'
      checks: [{type: cmd, value: find}, {type: switch, value: '/c'}, {type: lastOutputIncludes, value: ': 6'}]
      answer: 'find /c /v "" guests.txt'
      explain: '`/v ""` wählt alle Zeilen aus, und `/c` zählt sie.'
  recap: '`find "Text" Datei`. `/i` Schreibweise egal, `/c` Anzahl, `/n` Zeilennummer, `/v` umgekehrt. Anführungszeichen sind Pflicht.'

- n: 38
  term: findstr
  fullForm: 'Find String'
  difficulty: 2
  objective: 'Du suchst mit `findstr` nach mehreren Wörtern gleichzeitig, in mehreren Dateien und sogar in Unterordnern.'
  summary: '`findstr` ist die stärkere Version von `find`: Es sucht mehrere Wörter auf einmal, durchsucht Unterordner und versteht einfache Muster (Regular Expressions).'
  meaning: '`findstr "Pizza Coffee" menu.txt` heißt Pizza **oder** Coffee. Für einen ganzen Ausdruck mit Leerzeichen nimmst du `/c:"..."`. `/s` heißt: Unterordner auch. `^` heißt Zeilenanfang und `$` Zeilenende.'
  usage: 'Ein ganzes Projekt durchsuchen, Dateien finden, die ein bestimmtes Wort enthalten, genauer filtern.'
  syntax: 'findstr [/i] [/s] [/n] [/m] [/c:"phrase"] "words" files'
  demo:
    start: 'C:\Users\Student\Documents'
    cmds: ['findstr "Pizza Coffee" menu.txt', 'findstr /s /i "sales" *.txt', 'findstr /m /s "Report" *.txt']
  examples:
    - c: 'findstr "Pizza Coffee" menu.txt'
      d: 'Zeilen, die Pizza oder Coffee enthalten.'
    - c: 'findstr /c:"Restaurant Menu" menu.txt'
      d: 'Genau dieser Ausdruck.'
    - c: 'findstr /s /i "sales" *.txt'
      d: 'Suche in allen txt-Dateien, in diesem Ordner und in Unterordnern.'
    - c: 'findstr /m /s "Report" *.txt'
      d: 'Nur die Namen der Dateien, die Report enthalten.'
    - c: 'findstr "^S" guests.txt'
      d: 'Zeilen, die mit S beginnen.'
  mistakes:
    - 'Denken, dass `"a b"` den Ausdruck „a b“ bedeutet; in findstr heißt es a oder b. Für einen Ausdruck nimmst du `/c:`.'
  tip: 'In findstr bedeutet `.` „ein beliebiges Zeichen“. Um nach einem echten Punkt zu suchen, schreib `\.`'
  practice:
    - id: P38a
      start: 'C:\Users\Student\Documents'
      task: 'Zeige mit einem einzigen Befehl die Zeilen aus `menu.txt`, die `Pizza` oder `Coffee` enthalten.'
      checks: [{type: anyCmd, value: findstr}, {type: lastOutputIncludes, value: 'Pizza'}, {type: lastOutputIncludes, value: 'Coffee'}, {type: lastOutputExcludes, value: 'Pasta'}]
      hints:
        - '`findstr` kann mehrere Wörter gleichzeitig suchen: Wenn du in ein Paar Anführungszeichen mehrere Wörter mit Leerzeichen schreibst, heißt das „dies **oder** das“.'
        - 'Drei Teile: Befehl (Command, `findstr`), Suchwörter (Pizza und Coffee mit einem Leerzeichen, beide in einem Paar `" "`), Datei (`menu.txt`).'
      answer: 'findstr "Pizza Coffee" menu.txt'
      explain: 'In `findstr` bedeutet `"Pizza Coffee"` Pizza oder Coffee; also wird jede Zeile aus `menu.txt` angezeigt, die eines der beiden Wörter enthält.'
    - id: P38b
