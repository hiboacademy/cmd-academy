      d: 'فقط نام بدون پسوند.'
      noTry: true
  mistakes:
    - 'نوشتن یک `%` در فایل Batch یا دو `%%` در خط فرمان.'
    - 'متغیر حلقه به بزرگی حروف حساس است: `%%f` و `%%F` دو متغیرند.'
    - 'ننوشتن Quotes دور `%%f` وقتی نام فایل‌ها فاصله دارند.'
  tip: '`@` قبل از دستور بعد از `do` در خط فرمان، تکرار نمایش دستور را حذف می‌کند.'
  practice:
