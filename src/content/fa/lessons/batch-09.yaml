  objective: 'با `call` بخش‌های قابل استفاده دوباره (تابع) بسازی و Script دیگری را اجرا کنی و برگردی.'
  summary: '`call :name args` به یک Label می‌رود، آن را مثل یک تابع اجرا می‌کند و با رسیدن به `goto :eof` یا `exit /b` به خط بعد از `call` برمی‌گردد. `call other.bat` یک Script دیگر را اجرا می‌کند و بعد ادامه می‌دهد.'
