# Lessons 78–87 · Chapter 11: logic, loops and menus

- n: 78
  term: if
  fullForm: 'if (compare text)'
  difficulty: 3
  objective: 'در Script بر اساس مقایسه دو متن تصمیم بگیری.'
  summary: '`if "A"=="B" دستور` فقط وقتی دستور را اجرا می‌کند که دو طرف یکی باشند. `/i` بزرگی حروف را نادیده می‌گیرد و `not` شرط را برعکس می‌کند.'
  meaning: 'Quotes دور دو طرف مهم است: اگر متغیر خالی باشد، `if %x%==yes` به `if ==yes` تبدیل می‌شود و خطا می‌دهد؛ ولی `if "%x%"=="yes"` به `if ""=="yes"` تبدیل می‌شود که درست کار می‌کند.'
  usage: 'بررسی جواب کاربر، بررسی اینکه Argument داده شده یا نه، اجرای بخش‌های مختلف Script.'
  syntax: "if \"%x%\"==\"text\" command\nif /i \"%x%\"==\"y\" command\nif not \"%1\"==\"\" command"
  demo:
    start: 'C:\Users\Student\Desktop'
    inputs: ['Y']
    files: [{path: 'C:\Users\Student\Desktop\like.bat', content: "@echo off\nset /p answer=Do you like CMD? (y/n) \nif /i \"%answer%\"==\"y\" echo Great!\nif /i not \"%answer%\"==\"y\" echo Maybe later.\n"}]
    cmds: ['like.bat']
  examples:
    - c: 'if "%1"=="" echo No name given'
      d: 'بررسی خالی بودن Argument.'
      noTry: true
    - c: 'if /i "%answer%"=="yes" echo OK'
      d: 'yes و YES هر دو قبول.'
      noTry: true
  mistakes:
    - 'ننوشتن Quotes و خطای `was unexpected at this time.` وقتی متغیر خالی است.'
    - 'استفاده از یک `=`؛ برای مقایسه باید `==` باشد.'
  tip: 'اگر بعد از شرط چند دستور لازم است، آن‌ها را داخل پرانتز `( )` بگذار (درس بعد).'
  practice:
    - id: P78a
      batch: {file: 'like.bat', starter: "@echo off\nset /p answer=Do you like CMD? (y/n) \n"}
      inputs: ['Y']
      task: 'Script از کاربر می‌پرسد CMD را دوست دارد یا نه. اگر جواب `y` یا `Y` بود، `Great!` چاپ کن. (اجرا کن و `y` بزن.)'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\like.bat', value: ['if', '/i']}, {type: outputIncludes, value: 'Great!'}]
      hints: ['برای قبول y و Y از `/i` استفاده کن.', '`if /i "%answer%"=="y" echo Great!`']
      answer: ['@echo off', 'set /p answer=Do you like CMD? (y/n) ', 'if /i "%answer%"=="y" echo Great!']
    - id: P78b
      batch: {file: 'hello.bat', starter: "@echo off\n", args: ''}
      task: 'Script بنویس که اگر بدون Argument اجرا شد، پیام `Please give a name` را نشان دهد. (بدون Argument اجرا کن.)'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\hello.bat', value: ['if', '%1']}, {type: outputIncludes, value: 'Please give a name'}]
      hints: ['خالی بودن `%1` را با Quotes بررسی کن.', '`if "%1"=="" echo Please give a name`']
      answer: ['@echo off', 'if "%1"=="" echo Please give a name']
  quiz:
    - kind: fix
      q: 'وقتی `%x%` خالی است این خط خطا می‌دهد. اصلاح درست کدام است؟'
      code: 'if %x%==yes echo OK'
      options: ['if "%x%"=="yes" echo OK', 'if %x%=yes echo OK', 'if (%x%)==yes echo OK', 'if x==yes echo OK']
      answer: 0
      code_options: true
      explain: 'Quotes دور دو طرف.'
    - kind: mcq
      q: '`/i` در `if` چه می‌کند؟'
      options: ['بزرگی و کوچکی حروف را نادیده می‌گیرد', 'شرط را برعکس می‌کند', 'عدد را مقایسه می‌کند', 'ورودی می‌گیرد']
      answer: 0
      explain: 'Ignore case.'
    - kind: predict
      q: '`answer` برابر `NO` است. خروجی چیست؟'
      code: "if \"%answer%\"==\"no\" echo A\nif /i \"%answer%\"==\"no\" echo B"
      options: ['B', 'A', 'A و B', 'هیچ']
      answer: 0
      explain: 'فقط با `/i` حروف بزرگ و کوچک یکی حساب می‌شوند.'
  recap: '`if "%x%"=="متن" دستور`. Quotes همیشه. `/i` حروف، `not` برعکس.'

- n: 79
  term: 'if ... else'
  fullForm: 'else · number comparisons'
  difficulty: 3
  objective: 'با `else` دو مسیر بسازی و اعداد را مقایسه کنی.'
  summary: '`if شرط ( ... ) else ( ... )` اگر شرط درست باشد بخش اول و وگرنه بخش دوم را اجرا می‌کند. برای اعداد از `equ neq lss leq gtr geq` استفاده کن.'
  meaning: '`) else (` باید در یک خط باشد. عملگرها: `equ` مساوی، `neq` نامساوی، `lss` کمتر، `leq` کمتر یا مساوی، `gtr` بیشتر، `geq` بیشتر یا مساوی. اگر هر دو طرف عدد باشند، مقایسه عددی است.'
  usage: 'تصمیم بر اساس سن، تعداد فایل، اندازه، نتیجه محاسبه.'
  syntax: "if %n% geq 18 (\n  echo Adult\n) else (\n  echo Child\n)"
  demo:
    start: 'C:\Users\Student\Desktop'
    inputs: ['20']
    files: [{path: 'C:\Users\Student\Desktop\age.bat', content: "@echo off\nset /p age=How old are you? \nif %age% geq 18 (\n  echo You are an adult.\n) else (\n  echo You are under 18.\n)\n"}]
    cmds: ['age.bat']
  examples:
    - c: 'if %count% gtr 10 (echo Many) else (echo Few)'
      d: 'همه در یک خط.'
      noTry: true
    - c: 'if %errorlevel% neq 0 echo Something failed'
      d: 'بررسی خطا (درس ۸۱).'
      noTry: true
  mistakes:
    - 'نوشتن `else` در خط بعدی؛ باید `) else (` در یک خط باشد.'
    - 'استفاده از `>` برای مقایسه: `if %a% > 5` فایلی به نام 5 می‌سازد! از `gtr` استفاده کن.'
  tip: 'دستورها را داخل پرانتز با تورفتگی بنویس تا Script خوانا باشد.'
  practice:
    - id: P79a
      batch: {file: 'age.bat', starter: "@echo off\nset /p age=How old are you? \n"}
      inputs: ['20']
      task: 'اگر سن وارد شده `18` یا بیشتر بود `Adult` و وگرنه `Child` چاپ کن. (با `20` امتحان کن.)'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\age.bat', value: ['geq', 'else']}, {type: outputIncludes, value: 'Adult'}, {type: outputExcludes, value: 'Child'}]
      hints: ['عملگر «بیشتر یا مساوی» `geq` است.', '`if %age% geq 18 (echo Adult) else (echo Child)`']
      answer: ['@echo off', 'set /p age=How old are you? ', 'if %age% geq 18 (', '  echo Adult', ') else (', '  echo Child', ')']
    - id: P79b
      batch: {file: 'stock.bat', starter: "@echo off\nset /a pizzas=5\n"}
      task: 'اگر تعداد پیتزاها (`pizzas`) بیشتر از `3` است `Enough pizza` و وگرنه `Order more` چاپ کن.'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\stock.bat', value: ['gtr', 'else']}, {type: outputIncludes, value: 'Enough pizza'}]
      hints: ['عملگر «بیشتر» `gtr` است.', '`if %pizzas% gtr 3 (echo Enough pizza) else (echo Order more)`']
      answer: ['@echo off', 'set /a pizzas=5', 'if %pizzas% gtr 3 (echo Enough pizza) else (echo Order more)']
  quiz:
    - kind: mcq
      q: 'کدام عملگر یعنی «کمتر از»؟'
      options: ['lss', 'leq', 'gtr', 'neq']
      answer: 0
      code_options: true
      explain: 'less.'
    - kind: fix
      q: 'این Script خطا می‌دهد. چرا؟'
      code: "if %n% equ 1 (\n  echo one\n)\nelse (\n  echo other\n)"
      options: ['`else` باید در همان خط `)` باشد', '`equ` اشتباه است', 'پرانتزها اضافه‌اند', 'n تعریف نشده']
      answer: 0
      explain: 'درست: `) else (`'
    - kind: predict
      q: 'خروجی؟'
      code: "set a=9\nif %a% lss 10 (echo small) else (echo big)"
      options: ['small', 'big', 'small big', 'خطا']
      answer: 0
      explain: '9 کمتر از 10 است.'
  recap: '`if ... ( ) else ( )` با `) else (` در یک خط. اعداد: `equ neq lss leq gtr geq`.'

- n: 80
  term: 'if exist'
  fullForm: 'if exist · if defined'
  difficulty: 3
  objective: 'قبل از کار با فایل یا پوشه بررسی کنی که وجود دارد یا نه.'
  summary: '`if exist مسیر دستور` فقط اگر فایل یا پوشه وجود داشته باشد دستور را اجرا می‌کند. `if not exist` برعکس. `if defined name` بررسی می‌کند متغیری تعریف شده یا نه.'
  meaning: 'الگوی بسیار رایج: `if not exist "%dest%" mkdir "%dest%"` یعنی «اگر پوشه نیست، بسازش». این جلوی خطای `already exists` را می‌گیرد و Script را امن می‌کند.'
  usage: 'ساختن پوشه فقط در صورت نیاز، کپی فقط اگر فایل هست، پیام خطای دوستانه.'
  syntax: "if exist file command\nif not exist folder mkdir folder\nif defined name command"
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\check.bat', content: "@echo off\nif exist \"%USERPROFILE%\\Documents\\menu.txt\" (echo Menu found) else (echo No menu)\nif not exist Reports mkdir Reports\nif exist Reports echo Reports folder is ready\nif defined USERNAME echo USERNAME is defined\n"}]
    cmds: ['check.bat', 'check.bat']
  examples:
    - c: 'if exist menu.txt type menu.txt'
      d: 'نمایش فقط اگر فایل هست.'
      noTry: true
    - c: 'if not exist "D:\Backup" mkdir "D:\Backup"'
      d: 'ساختن فقط در صورت نیاز.'
      noTry: true
    - c: 'if exist *.tmp del *.tmp'
      d: 'با Wildcard هم کار می‌کند.'
      noTry: true
  mistakes:
    - 'ننوشتن Quotes برای مسیر فاصله‌دار.'
    - 'نوشتن `%` در `if defined`: درست `if defined name` است، نه `if defined %name%`.'
  tip: 'اجرای دوباره یک Script خوب نباید خطا بدهد؛ `if not exist` این را تضمین می‌کند.'
  practice:
    - id: P80a
      batch: {file: 'prepare.bat', starter: "@echo off\n"}
      task: 'Script بنویس که پوشه `Reports` را روی Desktop فقط اگر وجود ندارد بسازد و بعد `Ready` چاپ کند. (دو بار اجرا کن؛ بار دوم هم نباید خطا بدهد.)'
      checks: [{type: ranBatch}, {type: dirExists, path: 'C:\Users\Student\Desktop\Reports'}, {type: fileContains, path: 'C:\Users\Student\Desktop\prepare.bat', value: 'if not exist'}, {type: outputIncludes, value: 'Ready'}, {type: outputExcludes, value: 'already exists'}]
      hints: ['`if not exist Reports mkdir Reports`', 'بعد `echo Ready`']
      answer: ['@echo off', 'if not exist Reports mkdir Reports', 'echo Ready']
    - id: P80b
      batch: {file: 'menu.bat', starter: "@echo off\n"}
      task: 'اگر فایل `%USERPROFILE%\Documents\menu.txt` وجود دارد `Menu found` و وگرنه `No menu` چاپ کن.'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\menu.bat', value: 'if exist'}, {type: outputIncludes, value: 'Menu found'}]
      hints: ['`if exist "مسیر" ( ... ) else ( ... )`', '`if exist "%USERPROFILE%\Documents\menu.txt" (echo Menu found) else (echo No menu)`']
      answer: ['@echo off', 'if exist "%USERPROFILE%\Documents\menu.txt" (echo Menu found) else (echo No menu)']
  quiz:
    - kind: mcq
      q: 'کدام خط پوشه Backup را فقط اگر وجود ندارد می‌سازد؟'
      options: ['if not exist Backup mkdir Backup', 'if exist Backup mkdir Backup', 'mkdir Backup if not exist', 'if Backup==none mkdir Backup']
      answer: 0
      code_options: true
      explain: '`if not exist`'
    - kind: fix
      q: 'برای بررسی تعریف بودن متغیر `name`، کدام درست است؟'
      code: 'if defined %name% echo yes'
      options: ['if defined name echo yes', 'if exist name echo yes', 'if "%name%" defined echo yes', 'if name echo yes']
      answer: 0
      code_options: true
      explain: 'نام متغیر بدون `%`.'
    - kind: tf
      q: '`if exist` روی پوشه‌ها هم کار می‌کند.'
      answer: true
      explain: 'فایل یا پوشه.'
  recap: '`if exist` / `if not exist` برای فایل و پوشه. `if defined name` برای متغیر.'

- n: 81
  term: 'if errorlevel'
  fullForm: 'Decisions from exit codes'
  difficulty: 3
  objective: 'در Script بر اساس موفقیت یا شکست دستور قبلی تصمیم بگیری.'
  summary: 'دو روش: `if %errorlevel% neq 0` (مقایسه دقیق) و `if errorlevel 1` (یعنی ۱ **یا بیشتر**). `&&` و `||` هم راه کوتاه همین کارند.'
  meaning: 'نکته مهم: `if errorlevel 1` برای هر کدی که 1 یا بزرگ‌تر باشد درست است. برای همین در منوها (درس ۸۷) شرط‌ها را از بزرگ به کوچک می‌نویسند.'
  usage: 'بررسی موفقیت کپی، پیدا شدن متن، جواب دادن سرور، و گزارش خطا.'
  syntax: "command\nif %errorlevel% neq 0 (echo failed)\nif errorlevel 1 (echo code 1 or more)"
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\check.bat', content: "@echo off\nfind \"Pizza\" \"%USERPROFILE%\\Documents\\menu.txt\" >nul\nif errorlevel 1 (echo No pizza today) else (echo We have pizza)\nping -n 1 10.0.0.99 >nul\nif %errorlevel% neq 0 echo Server 10.0.0.99 is down\n"}]
    cmds: ['check.bat']
  examples:
    - c: 'if errorlevel 1 goto failed'
      d: 'پرش به بخش خطا.'
      noTry: true
    - c: 'xcopy a b /s /y >nul || echo Copy failed'
      d: 'شکل کوتاه با `||`.'
      noTry: true
  mistakes:
    - 'فکر کردن اینکه `if errorlevel 1` یعنی دقیقاً 1.'
    - 'اجرای یک دستور دیگر بین دستور اصلی و بررسی ERRORLEVEL.'
  tip: 'برای خروجی تمیز، خروجی دستور را با `>nul` پنهان کن و فقط پیام خودت را نشان بده.'
  practice:
    - id: P81a
      batch: {file: 'pizza.bat', starter: "@echo off\nfind \"Pizza\" \"%USERPROFILE%\\Documents\\menu.txt\" >nul\n"}
      task: 'بعد از `find`، اگر Pizza پیدا نشد `No pizza` و اگر پیدا شد `We have pizza` چاپ کن (با ERRORLEVEL).'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\pizza.bat', value: 'errorlevel'}, {type: outputIncludes, value: 'We have pizza'}, {type: outputExcludes, value: 'No pizza'}]
      hints: ['`find` اگر پیدا نکند کد 1 می‌دهد.', '`if errorlevel 1 (echo No pizza) else (echo We have pizza)`']
      answer: ['@echo off', 'find "Pizza" "%USERPROFILE%\Documents\menu.txt" >nul', 'if errorlevel 1 (echo No pizza) else (echo We have pizza)']
    - id: P81b
      batch: {file: 'server.bat', starter: "@echo off\nping -n 1 10.0.0.99 >nul\n"}
      task: 'اگر ping موفق نبود (`%errorlevel%` صفر نبود)، پیام `Server is down` را نشان بده.'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\server.bat', value: '%errorlevel%'}, {type: outputIncludes, value: 'Server is down'}]
      hints: ['مقایسه دقیق با `neq 0`.', '`if %errorlevel% neq 0 echo Server is down`']
      answer: ['@echo off', 'ping -n 1 10.0.0.99 >nul', 'if %errorlevel% neq 0 echo Server is down']
  quiz:
    - kind: predict
      q: 'ERRORLEVEL برابر 3 است. کدام خط‌ها اجرا می‌شوند؟'
      code: "if errorlevel 1 echo A\nif errorlevel 3 echo B\nif errorlevel 5 echo C"
      options: ['A و B', 'فقط B', 'A، B و C', 'فقط A']
      answer: 0
      explain: '`if errorlevel n` یعنی n یا بیشتر.'
    - kind: mcq
      q: 'برای بررسی «دقیقاً صفر نیست» کدام بهتر است؟'
      options: ['if %errorlevel% neq 0', 'if errorlevel 0', 'if errorlevel==0', 'if not errorlevel']
      answer: 0
      code_options: true
      explain: '`if errorlevel 0` همیشه درست است!'
    - kind: tf
      q: '`command || echo failed` همان کار بررسی ERRORLEVEL را به شکل کوتاه انجام می‌دهد.'
      answer: true
      explain: '`||` وقتی دستور شکست بخورد اجرا می‌شود.'
  recap: '`if %errorlevel% neq 0` دقیق. `if errorlevel n` = n یا بیشتر. `&&` و `||` کوتاه.'

- n: 82
  term: goto
  fullForm: 'goto · :labels'
  difficulty: 3
  objective: 'با Label و `goto` در Script پرش کنی و حلقه بسازی.'
  summary: 'Label خطی است که با `:` شروع می‌شود، مثل `:start`. `goto start` اجرا را به آن خط می‌برد. `goto :eof` به آخر Script می‌رود.'
  meaning: 'با `goto` به بالاتر، حلقه می‌سازی؛ پس حتماً یک شرط خروج (`if ... goto end`) لازم است، وگرنه حلقه بی‌پایان می‌شود. `goto` به پایین‌تر برای رد کردن یک بخش است.'
  usage: 'منوها، تکرار تا رسیدن به نتیجه، رد کردن بخش‌ها هنگام خطا.'
  syntax: ":loop\n...\nif condition goto end\ngoto loop\n:end"
  warning: 'حلقه `goto` بدون شرط خروج تا ابد اجرا می‌شود. در Simulator با `Ctrl+C` متوقفش کن.'
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\countdown.bat', content: "@echo off\nset /a n=3\n:loop\necho %n%...\nset /a n-=1\nif %n% gtr 0 goto loop\necho Liftoff!\n"}]
    cmds: ['countdown.bat']
  examples:
    - c: 'goto end'
      d: 'پرش به `:end`.'
      noTry: true
    - c: 'goto :eof'
      d: 'پایان Script (Label آماده).'
      noTry: true
  mistakes:
    - 'فراموش کردن شرط خروج.'
    - 'نوشتن `:` در `goto loop` لازم نیست ولی در خود Label الزامی است.'
    - 'دو Label با یک نام: `goto` از خط بعد از خودش به پایین می‌گردد و اولین Label هم‌نامی را که ببیند انتخاب می‌کند (اگر تا آخر فایل پیدا نکند، از اول فایل). نتیجه گیج‌کننده است؛ نام Label‌ها را یکتا نگه دار.'
  tip: 'Labelها را با حروف معنی‌دار نام بگذار: `:menu`، `:error`، `:end`.'
  practice:
    - id: P82a
      batch: {file: 'countdown.bat', starter: "@echo off\nset /a n=3\n"}
      task: 'با Label و `goto` شمارش معکوس `3`، `2`، `1` را چاپ کن و در آخر `Liftoff!`.'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\countdown.bat', value: ['goto', ':']}, {type: outputOrder, value: ['3', '2', '1', 'Liftoff!']}]
      hints: ['Label `:loop`، چاپ `%n%`، کم کردن با `set /a n-=1`.', '`if %n% gtr 0 goto loop` و بعد `echo Liftoff!`']
      answer: ['@echo off', 'set /a n=3', ':loop', 'echo %n%', 'set /a n-=1', 'if %n% gtr 0 goto loop', 'echo Liftoff!']
    - id: P82b
      batch: {file: 'skip.bat', starter: "@echo off\necho Start\necho This line must be skipped\necho End\n"}
      task: 'با `goto` و یک Label کاری کن که خط `This line must be skipped` اجرا نشود ولی `Start` و `End` چاپ شوند.'
      checks: [{type: ranBatch}, {type: outputIncludes, value: ['Start', 'End']}, {type: outputExcludes, value: 'must be skipped'}]
      hints: ['بعد از Start بنویس `goto finish` و قبل از End یک Label `:finish` بگذار.', 'خط وسط بین goto و Label می‌ماند و اجرا نمی‌شود.']
      answer: ['@echo off', 'echo Start', 'goto finish', 'echo This line must be skipped', ':finish', 'echo End']
  quiz:
    - kind: predict
      q: 'خروجی؟'
      code: "@echo off\ngoto b\n:a\necho A\n:b\necho B"
      options: ['B', 'A B', 'A', 'هیچ']
      answer: 0
