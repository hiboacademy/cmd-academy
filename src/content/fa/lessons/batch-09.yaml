  recap: '`for %%f in (الگو) do دستور`. در خط فرمان یک `%`. `%%~nf` نام، `%%~xf` پسوند، `%%~nxf` هر دو.'

- n: 84
  term: 'for /l · for /f'
  fullForm: 'Counting loops and reading files'
  difficulty: 3
  objective: 'با `for /l` شمارش کنی و با `for /f` فایل یا خروجی دستور را خط‌به‌خط بخوانی.'
  summary: '`for /l %%i in (شروع,گام,پایان)` یک شمارنده است. `for /f %%a in (file.txt)` هر خط فایل را می‌خواند و می‌تواند خط را به چند بخش (Token) تقسیم کند.'
  meaning: 'در `for /f` گزینه‌ها داخل Quotes می‌آیند: `tokens=1,2` یعنی بخش اول در `%%a` و دوم در `%%b`، `delims=,` یعنی جداکننده ویرگول (پیش‌فرض فاصله)، `skip=2` یعنی دو خط اول را رد کن. با `(''command'')` خروجی یک دستور را می‌خوانی.'
  usage: 'تکرار به تعداد مشخص، خواندن فهرست‌ها و فایل‌های CSV، پردازش خروجی دستورها.'
  syntax: "for /l %%i in (1,1,5) do echo %%i\nfor /f \"tokens=1,2\" %%a in (file.txt) do echo %%a %%b\nfor /f \"delims=\" %%L in ('dir /b') do echo %%L"
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\loops.bat', content: "@echo off\nfor /l %%i in (1,1,3) do echo Round %%i\nfor /f \"skip=2 tokens=1,2\" %%a in (%USERPROFILE%\\Documents\\menu.txt) do echo %%a costs %%b\n"}]
    cmds: ['loops.bat']
  examples:
    - c: 'for /l %i in (10,-2,0) do @echo %i'
      d: 'شمارش معکوس با گام منفی.'
    - c: 'for /f "delims=" %%L in (guests.txt) do echo Guest: %%L'
      d: 'خواندن کل هر خط (بدون تقسیم).'
      noTry: true
    - c: 'for /f "tokens=2 delims=:" %%a in (''ipconfig ^| find "IPv4"'') do echo IP:%%a'
      d: 'خواندن خروجی یک دستور؛ `^|` داخل Quote تکی.'
      noTry: true
  mistakes:
    - 'ترتیب اعداد در `/l`: (شروع, گام, پایان) نه (شروع, پایان, گام).'
    - 'فراموش کردن `delims=` برای خواندن کامل خطی که فاصله دارد.'
  tip: 'با `tokens=1,2` متغیر دوم خودکار حرف بعدی است: `%%a` و `%%b`.'
  practice:
    - id: P84a
      batch: {file: 'numbers.bat', starter: "@echo off\n"}
      task: 'با `for /l` عددهای 1 تا 5 را به شکل `Number 1` تا `Number 5` چاپ کن.'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\numbers.bat', value: 'for /l'}, {type: outputOrder, value: ['Number 1', 'Number 3', 'Number 5']}, {type: outputExcludes, value: 'Number 6'}]
      hints: ['(1,1,5) یعنی از 1 با گام 1 تا 5.', '`for /l %%i in (1,1,5) do echo Number %%i`']
      answer: ['@echo off', 'for /l %%i in (1,1,5) do echo Number %%i']
    - id: P84b
      batch: {file: 'prices.bat', starter: "@echo off\n"}
      task: 'فایل `%USERPROFILE%\Documents\menu.txt` را با `for /f` بخوان (دو خط اول عنوان‌اند) و برای هر غذا بنویس: `Pizza costs 8.50`.'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\prices.bat', value: ['for /f', 'skip=2']}, {type: outputIncludes, value: ['Pizza costs 8.50', 'Coffee costs 2.50']}, {type: outputExcludes, value: 'Restaurant costs'}]
      hints: ['گزینه‌ها: `"skip=2 tokens=1,2"`', '`for /f "skip=2 tokens=1,2" %%a in (%USERPROFILE%\Documents\menu.txt) do echo %%a costs %%b`']
      answer: ['@echo off', 'for /f "skip=2 tokens=1,2" %%a in (%USERPROFILE%\Documents\menu.txt) do echo %%a costs %%b']
  quiz:
    - kind: predict
      q: 'این حلقه چند بار اجرا می‌شود؟'
      code: 'for /l %%i in (0,5,20) do echo %%i'
      options: ['5 (0, 5, 10, 15, 20)', '20', '4', '21']
      answer: 0
      explain: 'از 0 با گام 5 تا 20.'
    - kind: mcq
      q: 'در `for /f "tokens=1,2 delims=," %%a in (data.csv)`، بخش دوم هر خط در کدام متغیر است؟'
      options: ['%%b', '%%a', '%%2', '%%c']
      answer: 0
      code_options: true
      explain: 'Token دوم = حرف بعدی.'
    - kind: tf
      q: '`for /f` می‌تواند خروجی یک دستور را هم بخواند.'
      answer: true
      explain: 'با Quote تکی: `(''dir /b'')`.'
  recap: '`for /l (شروع,گام,پایان)` شمارش. `for /f "tokens= delims= skip="` خواندن خط‌به‌خط فایل یا خروجی.'

- n: 85
  term: '!var!'
  fullForm: 'Delayed Expansion'
  difficulty: 3
  objective: 'مشکل معروف متغیرها داخل حلقه و پرانتز را بفهمی و با Delayed Expansion حلش کنی.'
  summary: 'CMD همه `%var%`های یک بلوک پرانتزی (مثل بدنه `for` یا `if`) را **یک بار** و **قبل از اجرا** جایگزین می‌کند. پس تغییر متغیر داخل حلقه با `%var%` دیده نمی‌شود. راه‌حل: `setlocal enabledelayedexpansion` و نوشتن `!var!`.'
  meaning: '`!var!` هر بار که اجرا می‌شود مقدار فعلی را می‌خواند. `setlocal` همچنین باعث می‌شود تغییر متغیرها تا `endlocal` (یا پایان Script) محلی بماند و محیط CMD را شلوغ نکند.'
  usage: 'شمارنده در حلقه، ساختن متن مرحله‌به‌مرحله، هر متغیری که داخل `( )` تغییر می‌کند.'
  syntax: "setlocal enabledelayedexpansion\nset count=0\nfor %%f in (*.txt) do (\n  set /a count+=1\n  echo !count!. %%f\n)\nendlocal"
  demo:
    start: 'C:\Users\Student\Desktop'
    files:
      - {path: 'C:\Users\Student\Desktop\wrong.bat', content: "@echo off\nset count=0\nfor %%f in (a b c) do (\n  set /a count+=1\n  echo %%f: count is %count%\n)\n"}
      - {path: 'C:\Users\Student\Desktop\right.bat', content: "@echo off\nsetlocal enabledelayedexpansion\nset count=0\nfor %%f in (a b c) do (\n  set /a count+=1\n  echo %%f: count is !count!\n)\nendlocal\n"}
    cmds: ['wrong.bat', 'right.bat']
  examples:
    - c: 'setlocal enabledelayedexpansion'
      d: 'روشن کردن Delayed Expansion (معمولاً خط دوم Script).'
      noTry: true
    - c: 'echo !count!'
      d: 'خواندن مقدار فعلی.'
      noTry: true
  mistakes:
    - 'نوشتن `!var!` بدون `setlocal enabledelayedexpansion`؛ خود متن `!var!` چاپ می‌شود.'
    - 'تعجب از اینکه `%count%` داخل حلقه همیشه صفر است.'
  tip: 'بیرون از حلقه بعد از تمام شدنش، `%count%` مقدار نهایی را درست نشان می‌دهد.'
  practice:
    - id: P85a
      batch: {file: 'list.bat', starter: "@echo off\nset count=0\nfor %%f in (\"%USERPROFILE%\\Documents\\*.txt\") do (\n  set /a count+=1\n  echo %count%. %%~nxf\n)\n"}
      task: 'این Script باید فهرست شماره‌دار فایل‌ها را چاپ کند (`1. guests.txt` ...) ولی همه شماره‌ها `0` است. با Delayed Expansion درستش کن.'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\list.bat', value: ['enabledelayedexpansion', '!count!']}, {type: outputIncludes, value: ['1. guests.txt', '3. todo.txt']}]
      hints: ['بعد از `@echo off` بنویس `setlocal enabledelayedexpansion`.', 'داخل حلقه `%count%` را به `!count!` تغییر بده.']
      answer: ['@echo off', 'setlocal enabledelayedexpansion', 'set count=0', 'for %%f in ("%USERPROFILE%\Documents\*.txt") do (', '  set /a count+=1', '  echo !count!. %%~nxf', ')', 'endlocal']
  quiz:
    - kind: predict
      q: 'بدون Delayed Expansion، خروجی خط دوم چیست؟'
      code: "set x=1\n(set x=2\n echo %x%)"
      options: ['1', '2', '%x%', 'خطا']
      answer: 0
      explain: 'کل پرانتز قبل از اجرا با x=1 جایگزین شد.'
    - kind: mcq
      q: 'کدام خط برای استفاده از `!var!` لازم است؟'
      options: ['setlocal enabledelayedexpansion', 'set /a', 'echo on', 'call']
      answer: 0
      code_options: true
      explain: 'بدون آن `!` معنای خاصی ندارد.'
    - kind: tf
      q: 'مشکل Delayed Expansion فقط داخل بلوک‌های پرانتزی پیش می‌آید.'
      answer: true
      explain: 'خطوط جدا هر کدام جداگانه جایگزین می‌شوند.'
  recap: 'داخل `( )`، `%var%` یک بار جایگزین می‌شود. `setlocal enabledelayedexpansion` + `!var!` = مقدار لحظه‌ای.'

