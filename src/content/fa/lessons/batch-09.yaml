- n: 83
  term: 'for'
  fullForm: 'for %%f in (files) do'
  difficulty: 3
  objective: 'با `for` یک دستور را برای همه فایل‌های یک الگو یا همه موارد یک فهرست تکرار کنی.'
  summary: '`for %%f in (*.txt) do echo %%f` برای هر فایل txt یک بار دستور را اجرا می‌کند و نام فایل را در `%%f` می‌گذارد.'
  meaning: 'در فایل Batch متغیر حلقه با دو `%%` نوشته می‌شود و در خط فرمان با یکی (`%f`). داخل پرانتز می‌توانی الگو (`*.jpg`) یا فهرست ساده (`red green blue`) بدهی. `%%~nf` فقط نام بدون پسوند، `%%~xf` پسوند و `%%~nxf` نام کامل فایل است.'
  usage: 'کار روی همه فایل‌ها: کپی، تغییر نام، شمردن، گزارش.'
  syntax: "for %%f in (*.txt) do command %%f\nfor %%c in (red green blue) do echo %%c"
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\photos.bat', content: "@echo off\nfor %%f in (\"%USERPROFILE%\\Pictures\\*.jpg\") do echo Photo: %%~nxf\nfor %%c in (red green blue) do echo Color: %%c\n"}]
    cmds: ['photos.bat', 'for %i in (a b c) do @echo %i']
  examples:
    - c: 'for %i in (*.txt) do @echo %i'
