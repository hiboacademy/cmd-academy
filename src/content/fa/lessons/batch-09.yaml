- n: 87
  term: choice
  fullForm: 'choice · timeout · menus'
  difficulty: 3
  objective: 'منوی ساده بسازی که کاربر با یک کلید انتخاب کند، و Script را برای چند ثانیه متوقف کنی.'
  summary: '`choice /c 123 /m "Choose"` منتظر یکی از کلیدهای 1، 2 یا 3 می‌ماند و شماره گزینه را در ERRORLEVEL می‌گذارد (اولی 1، دومی 2 ...). `timeout /t 5` پنج ثانیه صبر می‌کند.'
  meaning: 'چون `if errorlevel n` یعنی «n یا بیشتر»، شرط‌ها را از بزرگ‌ترین گزینه به کوچک‌ترین بنویس، یا از `if %errorlevel% equ n` استفاده کن. `timeout /t 5 /nobreak` با کلید قطع نمی‌شود.'
  usage: 'منوهای ابزار، پرسیدن تأیید Y/N، صبر قبل از تکرار یک کار.'
  syntax: "choice /c YN /m \"Continue?\"\nif errorlevel 2 goto no\ntimeout /t 5"
  demo:
    start: 'C:\Users\Student\Desktop'
    inputs: ['1', '2', '3']
    files: [{path: 'C:\Users\Student\Desktop\menu.bat', content: "@echo off\n:menu\necho.\necho 1. Show date\necho 2. Show user\necho 3. Quit\nchoice /c 123 /m \"Choose\"\nif errorlevel 3 goto end\nif errorlevel 2 goto user\necho Today is %DATE%\ngoto menu\n:user\necho You are %USERNAME%\ngoto menu\n:end\necho Bye!\n"}]
    cmds: ['menu.bat']
  examples:
    - c: 'choice /c YN /m "Delete old logs?"'
