# Lessons 62–67 · Chapter 9: exit codes, permissions, admin, services, errors

- n: 62
  term: '%ERRORLEVEL%'
  fullForm: 'Exit Code'
  difficulty: 2
  objective: 'بفهمی هر دستور بعد از اجرا یک عدد نتیجه برمی‌گرداند و آن را بخوانی.'
  summary: 'هر دستور بعد از تمام شدن یک Exit Code می‌دهد. `0` یعنی موفق و عدد دیگر یعنی مشکل. آخرین Exit Code در متغیر `%ERRORLEVEL%` است.'
  meaning: 'معنی اعداد به هر دستور بستگی دارد: `find` اگر چیزی پیدا نکند 1 می‌دهد، `ping` اگر جوابی نیاید 1، و `robocopy` با 1 یعنی «فایل کپی شد». `&&` و `||` (درس ۳۱) هم بر اساس همین عدد کار می‌کنند.'
  usage: 'فهمیدن نتیجه دستورها در Batch Script و تصمیم‌گیری بر اساس آن (درس ۸۱).'
  syntax: "command\necho %ERRORLEVEL%"
  demo:
    start: 'C:\Users\Student\Documents'
    expectError: true
    cmds: ['find "Pizza" menu.txt >nul', 'echo %ERRORLEVEL%', 'find "Burger" menu.txt >nul', 'echo %ERRORLEVEL%', 'xyz', 'echo %ERRORLEVEL%']
  examples:
    - c: 'echo %ERRORLEVEL%'
      d: 'نتیجه آخرین دستور.'
    - c: 'find "Burger" menu.txt & echo %ERRORLEVEL%'
      d: 'اگر Burger نباشد: 1.'
      noTry: true
    - c: 'ping -n 1 10.0.0.99 >nul || echo Host is down'
      d: 'استفاده مستقیم از نتیجه با `||`.'
  mistakes:
    - 'فرض اینکه همه دستورها با خطا عدد 1 می‌دهند؛ مثلاً دستور ناشناخته 9009 می‌دهد.'
    - 'فراموش کردن اینکه `echo` بعدی خودش ERRORLEVEL را تغییر نمی‌دهد ولی دستورهای دیگر تغییر می‌دهند؛ ERRORLEVEL را بلافاصله بخوان.'
  tip: 'در robocopy عددهای کمتر از 8 یعنی موفقیت؛ این استثنای معروف است.'
  practice:
    - id: P62a
      start: 'C:\Users\Student\Documents'
      task: 'در `menu.txt` دنبال کلمه `Burger` بگرد (وجود ندارد) و بلافاصله Exit Code آن را چاپ کن.'
      multi: true
      checks: [{type: anyCmd, value: find, evenIfFailed: true}, {type: inputIncludes, value: '%errorlevel%'}, {type: lastOutputIncludes, value: '1'}]
      hints: ['دو قدم داری: اول با `find` دنبال کلمه بگرد، بعد بلافاصله مقدار Variable `%ERRORLEVEL%` را چاپ کن تا Exit Code همان `find` را ببینی.', 'خط اول: `find` + کلمه `"Burger"` داخل Quotes + نام فایل `menu.txt`. خط دوم: `echo` و بعد `%ERRORLEVEL%`. بین این دو هیچ Command دیگری اجرا نکن.']
      answer: ['find "Burger" menu.txt', 'echo %ERRORLEVEL%']
      explain: '`find` چون `Burger` را پیدا نمی‌کند Exit Code برابر 1 برمی‌گرداند و `echo %ERRORLEVEL%` بلافاصله همان عدد را چاپ می‌کند.'
    - id: P62b
      start: 'C:\Users\Student'
      task: 'یک بار Router (`192.168.1.1`) را ping کن و بعد Exit Code را چاپ کن. (باید 0 باشد.)'
      multi: true
      checks: [{type: anyCmd, value: ping}, {type: inputIncludes, value: '%errorlevel%'}, {type: errorlevel, value: 0}, {type: lastOutputIncludes, value: '0'}]
      hints: ['اول با `ping` و Switch `-n` فقط یک بسته به Router بفرست، بعد مقدار Variable `%ERRORLEVEL%` را چاپ کن.', 'خط اول: `ping` + `-n 1` + IP Router یعنی `192.168.1.1`. خط دوم: `echo` با `%ERRORLEVEL%`. چون Router جواب می‌دهد، عدد باید `0` باشد.']
      answer: ['ping -n 1 192.168.1.1', 'echo %ERRORLEVEL%']
      explain: '`ping -n 1` یک بسته می‌فرستد و چون جواب می‌آید Exit Code برابر 0 (موفق) است؛ `echo %ERRORLEVEL%` همین عدد را نشان می‌دهد.'
  quiz:
    - kind: mcq
      q: 'Exit Code برابر `0` معمولاً یعنی چه؟'
      options: ['دستور موفق بود', 'دستور شکست خورد', 'دستور اجرا نشد', 'فایل خالی است']
      answer: 0
      explain: '0 = بدون خطا.'
    - kind: predict
      q: 'خروجی آخر چیست؟'
      code: "notacommand\necho %ERRORLEVEL%"
      options: ['9009', '0', '1', '%ERRORLEVEL%']
      answer: 0
      code_options: true
      explain: 'دستور ناشناخته کد 9009 دارد.'
    - kind: tf
      q: 'بعد از robocopy، ERRORLEVEL برابر 1 یعنی کپی شکست خورد.'
      answer: false
      explain: 'در robocopy یعنی فایل‌ها کپی شدند.'
  recap: '`%ERRORLEVEL%` = نتیجه آخرین دستور. 0 = موفق. معنی بقیه عددها به هر دستور بستگی دارد.'

- n: 63
  term: 'Access is denied.'
  fullForm: 'Permissions · UAC'
  difficulty: 2
  objective: 'دلیل خطای `Access is denied` را بفهمی و راه‌های درست رفع آن را بشناسی.'
  summary: 'Windows برای هر فایل و هر کار تعیین می‌کند چه کسی اجازه دارد. کاربر عادی نمی‌تواند فایل‌های سیستمی را تغییر دهد یا ابزارهای تعمیر را اجرا کند.'
  meaning: 'حتی اگر عضو Administrators باشی، CMD معمولی با سطح Medium اجرا می‌شود (UAC). `whoami /groups` جلوی Administrators می‌نویسد `Group used for deny only`. دلیل‌های دیگر خطا: فایل Read-only، فایلی که برنامه دیگری باز کرده، یا پوشه‌ای که مال کاربر دیگری است.'
  usage: 'تشخیص اینکه مشکل از دسترسی است یا از اشتباه در دستور.'
  syntax: "whoami /groups\nattrib file"
  demo:
    cmds: ['sfc /scannow', 'whoami /groups']
  examples:
    - c: 'whoami /groups'
      d: 'سطح دسترسی فعلی.'
    - c: 'attrib notes.txt'
      at: 'C:\Users\Student\Desktop'
      d: 'آیا فایل Read-only است؟'
    - c: 'attrib -r notes.txt'
      at: 'C:\Users\Student\Desktop'
      d: 'برداشتن Read-only (اگر مال خودت است).'
  mistakes:
    - 'تغییر دسترسی فایل‌های `C:\Windows` برای حل یک خطا؛ این کار امنیت سیستم را از بین می‌برد.'
    - 'همیشه اجرای CMD با Administrator؛ فقط وقتی لازم است.'
  tip: 'قاعده: اول ببین فایل Read-only است یا در حال استفاده؛ اگر کار سیستمی است، CMD را Administrator باز کن (درس بعد).'
  practice:
    - id: P63a
      start: 'C:\Users\Student'
      task: 'بررسی کن این CMD با دسترسی کامل Administrator اجرا شده یا نه (گروه‌های کاربر را ببین).'
      checks: [{type: switch, value: '/groups', cmd: whoami, anyRun: true}, {type: lastOutputIncludes, value: 'deny only'}]
      hints: ['سطح دسترسی CMD را `whoami` نشان می‌دهد، ولی فقط وقتی گروه‌های کاربر را هم ببینی. `whoami` برای این کار یک Switch دارد.', 'بعد از `whoami` Switch `/groups` را بنویس. در خروجی دنبال خط Administrators بگرد: `Group used for deny only` یعنی دسترسی کامل نیست.']
      answer: 'whoami /groups'
      explain: '`whoami /groups` گروه‌های کاربر را نشان می‌دهد و عبارت `deny only` جلوی Administrators یعنی این CMD با Run as administrator باز نشده است.'
    - id: P63b
      start: 'C:\Users\Student\Desktop'
      setup: {readonly: ['C:\Users\Student\Desktop\notes.txt']}
      task: 'خط `Buy bread` را به آخر `notes.txt` اضافه کن. (اگر `Access is denied` دیدی، دلیلش را پیدا و رفع کن.)'
      multi: true
      checks: [{type: fileContains, path: 'C:\Users\Student\Desktop\notes.txt', value: ['Remember', 'Buy bread']}]
      hints: ['اضافه کردن متن خطای `Access is denied` می‌دهد چون فایل Read-only است. اول با `attrib` این ویژگی را بردار، بعد متن را به آخر فایل اضافه کن.', 'قدم ۱: `attrib` با `-r` (حذف Read-only) روی `notes.txt`. قدم ۲: `echo` با متن `Buy bread`، بعد `>>` و نام فایل (نه `>` که محتوای قبلی را پاک می‌کند).']
      answer: ['attrib -r notes.txt', 'echo Buy bread >> notes.txt']
      explain: '`attrib -r` ویژگی Read-only را برمی‌دارد تا فایل قابل تغییر شود، و `>>` خط `Buy bread` را به آخر فایل اضافه می‌کند بدون اینکه خط قبلی (`Remember`) پاک شود.'
  quiz:
    - kind: mcq
      q: 'کدام دلیل باعث `Access is denied` نمی‌شود؟'
      options: ['اشتباه تایپی در نام دستور', 'فایل Read-only', 'کار سیستمی بدون Administrator', 'فایل باز در برنامه دیگر']
      answer: 0
      explain: 'دستور اشتباه خطای `is not recognized` می‌دهد.'
    - kind: tf
      q: 'کاربر عضو Administrators در CMD معمولی هم همه دسترسی‌ها را دارد.'
      answer: false
      explain: 'UAC تا وقتی CMD را Run as administrator باز نکنی دسترسی کامل نمی‌دهد.'
    - kind: type
      q: 'Read-only بودن `report.txt` را بردار.'
      accept: ['attrib -r report.txt']
      explain: '`attrib -r`'
  recap: '`Access is denied` = اجازه نداری: Read-only، فایل در حال استفاده، یا کار سیستمی بدون Administrator.'

- n: 64
  term: 'Administrator CMD'
  fullForm: 'Run as administrator'
  difficulty: 2
  objective: 'CMD را با دسترسی Administrator باز کنی و آن را از CMD معمولی تشخیص دهی.'
  summary: 'برای ابزارهای سیستمی مثل `sfc`، `chkdsk` و `diskpart` باید CMD را با Run as administrator باز کنی. عنوان پنجره با `Administrator:` شروع می‌شود.'
  meaning: 'راه‌ها: Start ← تایپ `cmd` ← Run as administrator؛ یا Start ← تایپ `cmd` ← `Ctrl + Shift + Enter`؛ یا Win + X ← Terminal (Admin). Windows پنجره UAC را نشان می‌دهد و باید Yes بزنی. CMD ادمین معمولاً در `C:\Windows\System32` باز می‌شود.'
  usage: 'تعمیر سیستم، مدیریت سرویس‌ها و دیسک‌ها، تغییر تنظیمات شبکه.'
  syntax: "(Start → cmd → Ctrl+Shift+Enter)\nwhoami /groups"
  warning: 'در CMD ادمین هر اشتباهی می‌تواند به سیستم آسیب بزند. فقط وقتی لازم است از آن استفاده کن و کارت که تمام شد، پنجره را ببند.'
  demo:
    admin: true
    cmds: ['whoami /groups', 'sfc /scannow']
  examples:
    - c: 'sfc /scannow'
      d: 'فقط در CMD ادمین کار می‌کند.'
    - c: 'whoami /groups | find "Mandatory Label"'
      d: 'High یعنی ادمین، Medium یعنی معمولی.'
  mistakes:
    - 'فراموش کردن اینکه CMD ادمین در System32 باز می‌شود؛ قبل از کار با فایل‌ها `cd` کن.'
  tip: 'در Simulator، بالای صفحه Simulator حالت «Administrator» را انتخاب کن.'
  practice:
    - id: P64a
      start: 'C:\Windows\System32'
      admin: true
      task: 'این CMD با Administrator باز شده. با `whoami` ثابت کن سطح دسترسی High است.'
      checks: [{type: switch, value: '/groups', cmd: whoami, anyRun: true}, {type: lastOutputIncludes, value: 'High Mandatory'}]
      hints: ['سطح دسترسی (Mandatory Level) در فهرست گروه‌های کاربر آمده است. همان `whoami` را با Switch مخصوص گروه‌ها اجرا کن.', '`whoami` + Switch `/groups`. در خروجی خط `Mandatory Label` را ببین: `High Mandatory Level` یعنی Administrator و `Medium` یعنی معمولی.']
      answer: 'whoami /groups'
      explain: 'در CMD ادمین، `whoami /groups` خط `High Mandatory Level` را نشان می‌دهد که ثابت می‌کند دسترسی کامل Administrator فعال است.'
    - id: P64b
      start: 'C:\Windows\System32'
      admin: true
      task: 'فایل‌های سیستمی Windows را با ابزار System File Checker بررسی کن.'
      checks: [{type: anyCmd, value: sfc}, {type: lastOutputIncludes, value: 'integrity violations'}]
      hints: ['ابزار System File Checker با Command `sfc` اجرا می‌شود و یک Switch برای «همین حالا اسکن کن» دارد. این ابزار فقط در CMD ادمین کار می‌کند.', 'بعد از `sfc` یک فاصله و بعد Switch را بنویس: `/` + `scan` + `now` (همه به هم چسبیده).']
      answer: 'sfc /scannow'
      explain: '`sfc /scannow` همه فایل‌های سیستمی Windows را بررسی می‌کند و نتیجه را با عبارت `integrity violations` گزارش می‌دهد.'
  quiz:
    - kind: mcq
      q: 'میانبر باز کردن CMD با Administrator از منوی Start کدام است؟'
      options: ['Ctrl + Shift + Enter', 'Ctrl + Enter', 'Alt + Enter', 'Shift + Enter']
      answer: 0
      explain: 'بعد از تایپ cmd در Start.'
    - kind: tf
      q: 'عنوان پنجره CMD ادمین با `Administrator:` شروع می‌شود.'
      answer: true
      explain: 'راه سریع تشخیص.'
    - kind: mcq
      q: 'CMD ادمین معمولاً در کدام پوشه باز می‌شود؟'
      options: ['C:\Windows\System32', 'C:\Users\Student', 'C:\', 'D:\']
      answer: 0
      code_options: true
      explain: 'به همین دلیل قبل از کار با فایل‌ها cd کن.'
  recap: 'Run as administrator (Ctrl+Shift+Enter) برای ابزارهای سیستمی. عنوان `Administrator:`. فقط وقتی لازم است.'

- n: 65
  term: 'sc · net start'
  fullForm: 'Windows Services'
  difficulty: 3
  objective: 'سرویس‌های Windows را ببینی، وضعیتشان را بررسی کنی و (با Administrator) متوقف یا اجرا کنی.'
  summary: 'سرویس (Service) برنامه‌ای است که بدون پنجره در پس‌زمینه کار می‌کند، مثل Print Spooler (چاپ) یا Windows Update. `sc query` و `net start` وضعیت را نشان می‌دهند.'
  meaning: 'هر سرویس یک نام کوتاه (مثل `Spooler`) و یک نام نمایشی (Print Spooler) دارد. `net stop` و `net start` یا `sc stop` و `sc start` آن را متوقف یا اجرا می‌کنند و به Administrator نیاز دارند.'
  usage: 'رفع مشکل پرینتری که چاپ نمی‌کند (Restart سرویس Spooler)، بررسی اینکه یک سرویس اجرا می‌شود.'
  syntax: "sc query [name]\nnet start\nnet stop name\nnet start name"
  warning: 'متوقف کردن سرویس‌های امنیتی (مثل WinDefend) یا سیستمی کامپیوتر را آسیب‌پذیر یا ناپایدار می‌کند.'
  demo:
    cmds: ['sc query spooler', 'net start', 'net stop spooler']
  examples:
    - c: 'sc query spooler'
      d: 'وضعیت سرویس چاپ.'
    - c: 'net start'
      d: 'فهرست سرویس‌های در حال اجرا.'
    - c: 'net stop spooler && net start spooler'
      mode: admin
      d: 'Restart سرویس چاپ (Administrator).'
  mistakes:
    - 'استفاده از نام نمایشی بدون Quotes: `net stop Print Spooler` ← `net stop "Print Spooler"` یا `net stop spooler`.'
  tip: '`sc query` فقط سرویس‌های در حال اجرا را نشان می‌دهد؛ برای همه: `sc query state= all` (با فاصله بعد از `=`).'
  practice:
    - id: P65a
      start: 'C:\Users\Student'
      task: 'وضعیت سرویس Print Spooler (نام کوتاه: `Spooler`) را ببین.'
      checks: [{type: anyCmd, value: sc}, {type: lastOutputIncludes, value: 'RUNNING'}, {type: lastOutputIncludes, value: 'Spooler'}]
      hints: ['وضعیت سرویس‌ها با `sc` دیده می‌شود. کلمه‌ای که بعد از `sc` می‌آید می‌گوید چه کاری کند؛ اینجا می‌خواهی وضعیت را «بپرسی» (query).', 'سه بخش: `sc`، بعد کار `query`، بعد نام کوتاه سرویس `spooler`. در خروجی خط `STATE` را ببین.']
      answer: 'sc query spooler'
      explain: '`sc query` وضعیت سرویس را می‌پرسد و با نام کوتاه `spooler` فقط Print Spooler را نشان می‌دهد که `RUNNING` است.'
    - id: P65b
      start: 'C:\Windows\System32'
      admin: true
      task: 'پرینتر گیر کرده است. سرویس `Spooler` را متوقف و دوباره اجرا کن (Restart).'
      multi: true
      checks: [{type: serviceState, name: Spooler, value: RUNNING}, {type: any, of: [{type: argIncludes, cmd: net, value: 'stop'}, {type: argIncludes, cmd: sc, value: 'stop'}]}]
      hints: ['Restart یعنی دو کار پشت هم: اول سرویس را متوقف کن، بعد دوباره اجرا کن. Command `net` برای هر کدام یک کلمه دارد: `stop` و `start`.', 'خط اول: `net` + `stop` + نام کوتاه سرویس `spooler`. خط دوم: همین، ولی با `start`. چون CMD ادمین است، اجازه این کار را داری.']
      answer: ['net stop spooler', 'net start spooler']
      explain: '`net stop spooler` سرویس چاپ را متوقف می‌کند و `net start spooler` آن را دوباره اجرا می‌کند؛ این Restart صف چاپ گیرکرده را آزاد می‌کند.'
  quiz:
    - kind: mcq
      q: 'سرویس چیست؟'
      options: ['برنامه‌ای که بدون پنجره در پس‌زمینه کار می‌کند', 'یک فایل Batch', 'یک کاربر Windows', 'یک Drive']
      answer: 0
      explain: 'مثل Print Spooler یا DNS Client.'
    - kind: predict
      q: 'کاربر عادی این را اجرا می‌کند. نتیجه؟'
      code: 'net stop spooler'
      options: ['System error 5 has occurred. Access is denied.', 'سرویس متوقف می‌شود', 'The service name is invalid.', 'هیچ']
      answer: 0
      explain: 'به Administrator نیاز دارد.'
    - kind: type
      q: 'فهرست سرویس‌های در حال اجرا را نشان بده.'
      accept: ['net start', 'sc query']
      explain: '`net start` یا `sc query`'
  recap: 'سرویس = برنامه پس‌زمینه. `sc query` و `net start` = وضعیت. `net stop/start نام` = کنترل (Administrator).'

- n: 66
  term: 'Common errors'
  fullForm: 'Reading CMD error messages'
  difficulty: 2
  objective: 'پیام‌های خطای رایج CMD را بخوانی و سریع رفعشان کنی.'
  summary: 'بیشتر خطاهای CMD چند پیام تکراری‌اند. اگر بدانی هر کدام چه می‌گوید، نصف عیب‌یابی را انجام داده‌ای.'
  meaning: '`is not recognized` ← اشتباه تایپی یا برنامه در PATH نیست. `cannot find the path` ← مسیر اشتباه است. `cannot find the file` ← نام فایل اشتباه است. `syntax ... incorrect` ← شکل دستور اشتباه است (اغلب Quotes جاافتاده). `Access is denied` ← اجازه نداری. `already exists` ← از قبل هست. `being used by another process` ← فایل یا پوشه در حال استفاده است.'
  usage: 'خواندن دقیق پیام قبل از تغییر دستور.'
  syntax: "command /?\ndir\ncd"
  demo:
    start: 'C:\Users\Student'
    expectError: true
    cmds: ['dri', 'cd Nowhere', 'type Desktop\shopping list.txt', 'mkdir Documents', 'rd C:\Users\Student']
  examples:
    - c: 'dir /?'
      d: 'وقتی شکل درست دستور یادت نیست.'
    - c: 'cd'
      d: 'وقتی نمی‌دانی کجا هستی.'
    - c: 'dir'
