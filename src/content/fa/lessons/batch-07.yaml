- n: 67
  term: 'Level 2 Practice'
  fullForm: 'Real tasks with combined commands'
  difficulty: 3
  objective: 'دستورهای Level 2 را برای کارهای واقعی پشتیبانی فنی ترکیب کنی.'
  summary: 'در کار واقعی معمولاً باید اطلاعاتی را از چند دستور جمع کنی، فیلتر کنی و در یک گزارش ذخیره کنی.'
  meaning: 'ابزارها: `>` و `>>` برای گزارش، `|` و `find` برای فیلتر، متغیرها برای مسیرها، `&&` برای ایمنی.'
  usage: 'گزارش وضعیت کامپیوتر برای پشتیبانی، Backup سریع، پیدا کردن و جمع کردن فایل‌ها.'
  syntax: "hostname > report.txt\nipconfig | find \"IPv4\" >> report.txt"
  demo:
    start: 'C:\Users\Student\Desktop'
    cmds: ['hostname > report.txt', 'whoami >> report.txt', 'ipconfig | find "IPv4" >> report.txt', 'type report.txt']
  examples:
    - c: 'echo Report %DATE% > report.txt'
      d: 'شروع گزارش با تاریخ.'
    - c: 'tasklist | find "chrome" >> report.txt'
      d: 'اضافه کردن Processهای Chrome.'
    - c: 'robocopy Pictures E:\AllPhotos *.jpg /s'
      at: 'C:\Users\Student'
      d: 'جمع کردن همه jpgها (با ساختار پوشه‌ها).'
  mistakes:
    - 'استفاده از `>` به‌جای `>>` در خطوط بعدی گزارش و پاک شدن خط‌های قبلی.'
  tip: 'هر خط گزارش را جدا امتحان کن، بعد با `>>` به فایل اضافه کن.'
  practice:
    - id: P67a
      start: 'C:\Users\Student\Desktop'
      task: 'فایل `report.txt` بساز که این‌ها را داشته باشد: نام کامپیوتر، نام کاربر، خط IPv4 و Processهای `chrome`.'
      multi: true
      checks: [{type: fileContains, path: 'C:\Users\Student\Desktop\report.txt', value: ['ACADEMY-PC', 'student', '192.168.1.24', 'chrome.exe']}]
      hints: ['گزارش را خط به خط بساز: خروجی هر Command را با Redirect به `report.txt` بفرست. اولین خط با `>` (فایل تازه)، بقیه با `>>` (اضافه به آخر). برای IPv4 و chrome، خروجی را با `|` و `find` فیلتر کن.', 'ترتیب: ۱) `hostname` با `>` ۲) `whoami` با `>>` ۳) `ipconfig` فیلترشده با `find "IPv4"` و بعد `>>` ۴) `tasklist` فیلترشده با `find "chrome"` و بعد `>>`. مقصد همه `report.txt` است.']
      answer: ['hostname > report.txt', 'whoami >> report.txt', 'ipconfig | find "IPv4" >> report.txt', 'tasklist | find "chrome" >> report.txt']
      explain: '`>` فایل را از نو می‌سازد و نام کامپیوتر را در آن می‌نویسد، `>>` بقیه خروجی‌ها را به آخر آن اضافه می‌کند، و `| find` فقط خط IPv4 و Processهای chrome را نگه می‌دارد.'
    - id: P67b
      start: 'C:\Users\Student'
      task: 'همه عکس‌های `.jpg` پوشه Pictures و زیرپوشه‌هایش را به `E:\AllPhotos` کپی کن.'
      checks: [{type: fileExists, path: 'E:\AllPhotos\beach.jpg'}, {type: any, of: [{type: fileExists, path: 'E:\AllPhotos\Holidays\family.jpg'}, {type: fileExists, path: 'E:\AllPhotos\family.jpg'}]}, {type: fileNotExists, path: 'E:\AllPhotos\logo.png'}]
      hints: ['برای کپی فقط یک نوع فایل همراه با زیرپوشه‌ها، `robocopy` مناسب است: مبدأ، مقصد، الگوی فایل‌ها و یک Switch برای زیرپوشه‌ها.', 'ترتیب در `robocopy`: اول پوشه مبدأ `Pictures`، بعد مقصد `E:\AllPhotos`، بعد الگوی `*.jpg`، و در آخر Switch `/s` (Subdirectories).']
      answer: 'robocopy Pictures E:\AllPhotos *.jpg /s'
      explain: '`robocopy` از `Pictures` به `E:\AllPhotos` فقط فایل‌های `*.jpg` را کپی می‌کند و `/s` زیرپوشه‌ها (مثل `Holidays`) را هم با همان ساختار می‌آورد؛ پس `logo.png` کپی نمی‌شود.'
