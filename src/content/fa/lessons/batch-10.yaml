- n: 97
  term: bootrec
  fullForm: 'bootrec · bcdboot'
  difficulty: 3
  objective: 'مشکلات Boot (بالا نیامدن Windows) را با ابزارهای WinRE تعمیر کنی.'
  summary: '`bootrec` چهار کار اصلی دارد: `/scanos` پیدا کردن Windowsها، `/rebuildbcd` ساختن دوباره فهرست Boot، `/fixmbr` و `/fixboot` نوشتن دوباره بخش‌های شروع دیسک. `bcdboot C:\Windows` فایل‌های Boot را از نو می‌سازد.'
  meaning: 'BCD (Boot Configuration Data) فهرستی است که می‌گوید Windows کجاست. در کامپیوترهای جدید (UEFI)، `bootrec /fixboot` اغلب `Access is denied` می‌دهد و `bcdboot` راه بهتری است. این دستورها فقط در WinRE هستند.'
  usage: 'خطاهایی مثل «Boot device not found»، «BOOTMGR is missing» یا Boot شدن مستقیم به BIOS.'
  syntax: "bootrec /scanos\nbootrec /rebuildbcd\nbootrec /fixmbr\nbcdboot C:\\Windows"
  warning: 'این دستورها بخش‌های حیاتی دیسک را بازنویسی می‌کنند. روی کامپیوتر واقعی فقط وقتی Windows Boot نمی‌شود و بعد از Backup از آن‌ها استفاده کن.'
  demo:
    mode: winre
    inputs: ['Y']
    cmds: ['bootrec /scanos', 'bootrec /rebuildbcd', 'bootrec /fixboot', 'bcdboot C:\Windows']
  examples:
    - c: 'bootrec /scanos'
      d: 'یافتن Windowsها.'
    - c: 'bootrec /rebuildbcd'
      d: 'ساختن دوباره BCD (می‌پرسد اضافه شود یا نه).'
    - c: 'bcdboot C:\Windows'
      d: 'ساختن فایل‌های Boot؛ راه اصلی در UEFI.'
  mistakes:
    - 'اجرای bootrec در Windows معمولی؛ فقط در WinRE وجود دارد.'
    - 'دادن مسیر اشتباه به bcdboot (اگر Windows روی D: است: `bcdboot D:\Windows`).'
  tip: 'ترتیب رایج: `/scanos` → `/rebuildbcd` → در صورت نیاز `bcdboot`.'
  practice:
    - id: P97a
      mode: winre
      task: 'Windows بالا نمی‌آید. اول همه نصب‌های Windows را روی دیسک‌ها پیدا کن.'
      checks: [{type: anyCmd, value: bootrec}, {type: lastOutputIncludes, value: 'Total identified Windows installations: 1'}]
      hints: ['گزینه «اسکن سیستم‌عامل» bootrec.', '`bootrec /scanos`']
      answer: 'bootrec /scanos'
    - id: P97b
      mode: winre
      inputs: ['Y']
      task: 'فهرست Boot (BCD) را دوباره بساز و Windows پیدا شده را به آن اضافه کن.'
      checks: [{type: switch, value: '/rebuildbcd', cmd: bootrec, anyRun: true}, {type: lastOutputIncludes, value: 'completed successfully'}]
      hints: ['`bootrec /rebuildbcd`', 'وقتی پرسید، `Y` بزن.']
      answer: 'bootrec /rebuildbcd'
  quiz:
    - kind: mcq
      q: 'در کامپیوتر UEFI که `bootrec /fixboot` خطای Access denied می‌دهد، بهترین جایگزین چیست؟'
      options: ['bcdboot C:\Windows', 'format C:', 'chkdsk /r', 'sfc /scannow']
      answer: 0
      code_options: true
      explain: 'bcdboot فایل‌های Boot را می‌سازد.'
    - kind: tf
      q: '`bootrec` در CMD عادی Windows هم اجرا می‌شود.'
      answer: false
      explain: 'فقط در WinRE.'
    - kind: order
      q: 'ترتیب رایج تعمیر BCD را مرتب کن.'
      items: ['bootrec /scanos', 'bootrec /rebuildbcd', 'Restart و امتحان']
      explain: 'پیدا کن، بساز، امتحان کن.'
  recap: 'WinRE: `bootrec /scanos` → `/rebuildbcd`. در UEFI: `bcdboot C:\Windows`.'

- n: 98
  term: diskpart
  fullForm: 'diskpart · format'
  difficulty: 3
  objective: 'ساختار دیسک‌ها و پارتیشن‌ها را با diskpart ببینی و یک USB را از نو آماده کنی، با رعایت کامل ایمنی.'
  summary: '`diskpart` یک محیط جداست با Prompt `DISKPART>`. اول `list disk`، بعد `select disk n` و بعد کارها روی همان دیسک انجام می‌شوند. `format` در CMD یک Drive را پاک و آماده می‌کند.'
  meaning: 'دستورهای خواندنی: `list disk`، `list volume`، `list partition`، `detail disk`. دستورهای خطرناک: `clean` (همه چیز دیسک را پاک می‌کند)، `delete partition`، `format`. آماده کردن USB: `select disk 1` → `clean` → `create partition primary` → `format fs=ntfs quick label=NAME` → `assign`.'
  usage: 'آماده کردن USB یا هارد جدید، دیدن پارتیشن‌های مخفی (EFI، Recovery)، رفع USBی که درست کار نمی‌کند.'
  syntax: "diskpart\nDISKPART> list disk\nDISKPART> select disk 1\nDISKPART> clean\nformat E: /fs:ntfs /q"
  warning: 'مهم‌ترین قانون: قبل از `clean` همیشه `list disk` بزن و از اندازه مطمئن شو دیسک درست انتخاب شده است. انتخاب اشتباه یعنی پاک شدن کامل هارد اصلی. روی کامپیوتر واقعی با احتیاط کامل.'
  demo:
    admin: true
    inputs: ['list disk', 'select disk 1', 'list partition', 'list volume', 'exit']
    cmds: ['diskpart']
  examples:
    - c: 'diskpart'
      d: 'ورود به diskpart (Administrator).'
    - c: 'format E: /fs:exfat /q /v:USB'
      d: 'Quick Format USB با exFAT.'
      noTry: true
  mistakes:
    - '`select disk 0` و `clean` به‌جای دیسک USB: پاک شدن Windows.'
    - 'فراموش کردن `assign`؛ دیسک آماده است ولی در File Explorer دیده نمی‌شود.'
  tip: 'در Simulator، Windows اجازه `clean` روی دیسک سیستم را نمی‌دهد (مثل واقعیت)، ولی دیسک USB را واقعاً (به‌طور مجازی) پاک می‌کند. با «ریست» همه چیز برمی‌گردد.'
  practice:
    - id: P98a
      start: 'C:\Windows\System32'
      admin: true
      inputs: ['list disk', 'list volume', 'exit']
      task: 'وارد diskpart شو، فهرست دیسک‌ها و Volumeها را ببین و خارج شو. (هیچ تغییری نده.)'
      checks: [{type: anyCmd, value: diskpart}, {type: dpUsed, value: 'list disk'}, {type: dpUsed, value: 'list vol'}, {type: driveExists, value: E}]
      hints: ['بعد از `diskpart` در Prompt `DISKPART>` بنویس `list disk`.', 'بعد `list volume` و در آخر `exit`.']
      answer: 'diskpart'
      explain: 'در DISKPART>: list disk ← list volume ← exit'
    - id: P98b
      start: 'C:\Windows\System32'
