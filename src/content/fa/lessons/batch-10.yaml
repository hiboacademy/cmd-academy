  difficulty: 3
  objective: 'بدانی Recovery Environment چیست، چطور به آن برسی و در CMD آن جهت‌یابی کنی.'
  summary: 'WinRE یک Windows کوچک جداگانه برای تعمیر است. وقتی Windows اصلی بالا نمی‌آید، از اینجا می‌توانی CMD باز کنی، فایل‌ها را نجات دهی و Boot را تعمیر کنی.'
  meaning: 'راه‌های رسیدن: نگه داشتن Shift هنگام زدن Restart؛ Settings → System → Recovery → Advanced startup؛ یا خودکار بعد از دو بار Boot ناموفق. بعد: Troubleshoot → Advanced options → Command Prompt. در اینجا Drive فعلی `X:` است و حرف Drive ویندوز ممکن است `C:` نباشد؛ با `dir C:\` و `dir D:\` پیدایش کن.'
  usage: 'Windows بالا نمی‌آید، نجات فایل‌ها قبل از نصب مجدد، تعمیر Boot.'
  syntax: "X:\\Windows\\System32>\ndir C:\\\ncopy C:\\Users\\...\\file E:\\"
  demo:
