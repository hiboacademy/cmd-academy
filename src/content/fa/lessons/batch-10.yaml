# Lessons 88–100 · Chapter 12: real projects and Windows repair

- n: 88
  term: 'organize.bat'
  fullForm: 'File management script'
  difficulty: 3
  objective: 'یک Script واقعی بنویسی که فایل‌های یک پوشه را بر اساس نوع، در پوشه‌های جدا مرتب کند.'
  summary: 'پوشه Downloads معمولاً شلوغ است. این Script برای هر نوع فایل یک پوشه می‌سازد و فایل‌ها را به آن منتقل می‌کند.'
  meaning: 'الگو: رفتن به پوشه با `cd /d`، ساختن پوشه‌ها با `if not exist ... mkdir`، و انتقال با `move` و Wildcard. `>nul` پیام‌های اضافی را پنهان می‌کند و `if exist *.pdf` جلوی خطای «فایل پیدا نشد» را می‌گیرد.'
  usage: 'مرتب کردن Downloads، Desktop یا پوشه عکس‌ها با یک کلیک.'
  syntax: "cd /d \"%USERPROFILE%\\Downloads\"\nif not exist PDF mkdir PDF\nif exist *.pdf move *.pdf PDF >nul"
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\organize.bat', content: "@echo off\nrem Sort Downloads into folders by type\ncd /d \"%USERPROFILE%\\Downloads\"\nfor %%t in (PDF Archives Programs) do if not exist %%t mkdir %%t\nif exist *.pdf move *.pdf PDF >nul\nif exist *.zip move *.zip Archives >nul\nif exist *.exe move *.exe Programs >nul\necho Downloads organized:\ntree /f\n"}]
    cmds: ['organize.bat']
  examples:
    - c: 'if exist *.pdf move *.pdf PDF >nul'
      d: 'انتقال فقط اگر فایلی هست.'
      noTry: true
    - c: 'for %%t in (PDF Archives) do if not exist %%t mkdir %%t'
      d: 'ساختن چند پوشه با یک حلقه.'
      noTry: true
  mistakes:
    - 'فراموش کردن `cd /d`؛ Script در پوشه اشتباه فایل جابه‌جا می‌کند.'
    - 'امتحان نکردن Script روی یک کپی آزمایشی قبل از پوشه واقعی.'
  tip: 'اول Script را با `echo move ...` به‌جای `move ...` اجرا کن تا ببینی چه می‌کند، بعد `echo` را بردار.'
  practice:
    - id: P88a
      batch: {file: 'organize.bat', starter: "@echo off\ncd /d \"%USERPROFILE%\\Downloads\"\n"}
      task: 'Script را کامل کن تا در Downloads فایل‌های `.pdf` به پوشه `PDF`، `.zip` به `Archives` و `.exe` به `Programs` منتقل شوند (پوشه‌ها را در صورت نیاز بسازد).'
      checks: [{type: ranBatch}, {type: fileExists, path: 'C:\Users\Student\Downloads\PDF\invoice.pdf'}, {type: fileExists, path: 'C:\Users\Student\Downloads\Archives\photos.zip'}, {type: fileExists, path: 'C:\Users\Student\Downloads\Programs\setup.exe'}]
      hints: ['برای هر نوع: `if not exist PDF mkdir PDF` و `move *.pdf PDF`.', 'سه بار تکرار برای PDF، Archives و Programs.']
      answer: ['@echo off', 'cd /d "%USERPROFILE%\Downloads"', 'if not exist PDF mkdir PDF', 'if not exist Archives mkdir Archives', 'if not exist Programs mkdir Programs', 'move *.pdf PDF >nul', 'move *.zip Archives >nul', 'move *.exe Programs >nul', 'echo Done']
  quiz:
    - kind: mcq
      q: 'چرا Script با `cd /d "%USERPROFILE%\Downloads"` شروع می‌شود؟'
      options: ['تا مطمئن شویم در پوشه درست کار می‌کند', 'برای سرعت بیشتر', 'چون move بدون آن کار نمی‌کند', 'برای پاک کردن صفحه']
      answer: 0
      explain: 'Script ممکن است از هر پوشه‌ای اجرا شود.'
    - kind: tf
      q: 'قبل از اجرای Script جابه‌جایی روی پوشه واقعی، بهتر است آن را روی یک پوشه آزمایشی امتحان کنی.'
      answer: true
      explain: 'یا با `echo` جلوی دستورها.'
    - kind: order
      q: 'ترتیب منطقی خطوط این Script را بچین.'
      items: ['@echo off', 'cd /d "%USERPROFILE%\Downloads"', 'if not exist PDF mkdir PDF', 'move *.pdf PDF >nul', 'echo Done']
      explain: 'تنظیم → رفتن → ساختن → انتقال → گزارش.'
  recap: 'Script مرتب‌سازی: `cd /d` → ساختن پوشه‌ها با `if not exist` → `move` با Wildcard.'

- n: 89
  term: 'backup.bat'
  fullForm: 'Backup script'
  difficulty: 3
  objective: 'یک Backup Script قابل اعتماد بنویسی: پوشه مقصد با تاریخ، کپی، بررسی خطا و ثبت در Log.'
  summary: 'یک Backup خوب: مبدأ و مقصد در متغیر، ساختن مقصد در صورت نیاز، کپی با `xcopy` یا `robocopy`، بررسی ERRORLEVEL و نوشتن نتیجه در فایل Log.'
  meaning: 'برای پوشه با تاریخ از قسمت‌هایی از `%DATE%` استفاده می‌شود: `%DATE:~10,4%` سال، `%DATE:~4,2%` ماه، `%DATE:~7,2%` روز (در تنظیمات تاریخ آمریکایی). `>>` نتیجه هر اجرا را به Log اضافه می‌کند.'
  usage: 'Backup روزانه Documents روی Drive دیگر یا USB.'
  syntax: "set \"src=%USERPROFILE%\\Documents\"\nset \"dest=D:\\Backup\\Docs\"\nxcopy \"%src%\" \"%dest%\" /s /i /y >nul\nif %errorlevel% equ 0 (echo OK >> log.txt)"
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\backup.bat', content: "@echo off\nset \"src=%USERPROFILE%\\Documents\"\nset \"stamp=%DATE:~10,4%-%DATE:~4,2%-%DATE:~7,2%\"\nset \"dest=D:\\Backup\\%stamp%\"\necho Backing up %src% to %dest% ...\nxcopy \"%src%\" \"%dest%\" /s /i /y /q\nif %errorlevel% equ 0 (\n  echo %DATE% %TIME% Backup OK >> D:\\Backup\\backup.log\n  echo Backup OK\n) else (\n  echo %DATE% %TIME% Backup FAILED >> D:\\Backup\\backup.log\n  echo Backup FAILED\n)\n"}]
    cmds: ['backup.bat', 'type D:\Backup\backup.log']
  examples:
    - c: 'set "stamp=%DATE:~10,4%-%DATE:~4,2%-%DATE:~7,2%"'
      d: 'تاریخ به شکل 2026-10-06.'
      noTry: true
    - c: 'robocopy "%src%" "%dest%" /e /r:1 /w:1'
      d: 'نسخه robocopy (کد کمتر از 8 = موفق).'
      noTry: true
  mistakes:
    - 'ننوشتن Quotes دور مسیرهای متغیر.'
    - 'بررسی ERRORLEVEL robocopy مثل xcopy (برای robocopy از `geq 8` برای خطا استفاده کن).'
  tip: 'Log را بعد از چند روز بخوان؛ اگر خط FAILED دیدی، دلیلش را پیدا کن.'
  practice:
    - id: P89a
      batch: {file: 'backup.bat', starter: "@echo off\nset \"src=%USERPROFILE%\\Documents\"\nset \"dest=D:\\Backup\\Docs\"\n"}
      task: 'Script را کامل کن: Documents را با زیرپوشه‌ها به `%dest%` کپی کند و اگر موفق بود، خط `Backup OK` را به فایل `D:\Backup\backup.log` اضافه کند.'
      checks: [{type: ranBatch}, {type: fileExists, path: 'D:\Backup\Docs\Work\report.txt'}, {type: fileContains, path: 'D:\Backup\backup.log', value: 'Backup OK'}]
      hints: ['`xcopy "%src%" "%dest%" /s /i /y`', '`if %errorlevel% equ 0 echo Backup OK >> D:\Backup\backup.log`']
      answer: ['@echo off', 'set "src=%USERPROFILE%\Documents"', 'set "dest=D:\Backup\Docs"', 'xcopy "%src%" "%dest%" /s /i /y >nul', 'if %errorlevel% equ 0 echo Backup OK >> D:\Backup\backup.log']
  quiz:
    - kind: predict
      q: 'اگر `%DATE%` برابر `Tue 10/06/2026` باشد، این چیست؟'
      code: 'echo %DATE:~10,4%'
      options: ['2026', '10/0', 'Tue ', '06/2']
      answer: 0
      code_options: true
      explain: 'از کاراکتر دهم، چهار کاراکتر.'
    - kind: mcq
      q: 'برای اضافه کردن نتیجه هر Backup به Log از کدام علامت استفاده می‌کنی؟'
      options: ['>>', '>', '|', '<']
      answer: 0
      code_options: true
      explain: '`>` Log قبلی را پاک می‌کند.'
    - kind: tf
      q: 'بعد از robocopy، ERRORLEVEL برابر 1 یعنی Backup شکست خورد.'
      answer: false
      explain: 'برای robocopy کمتر از 8 یعنی موفق.'
  recap: 'Backup = متغیر مبدأ و مقصد + xcopy/robocopy + بررسی ERRORLEVEL + `>>` به Log.'

- n: 90
  term: 'rename.bat'
  fullForm: 'Batch rename script'
  difficulty: 3
  objective: 'نام تعداد زیادی فایل را با یک Script و یک الگوی ثابت عوض کنی.'
  summary: 'با `for` روی فایل‌ها و `ren` می‌شود به نام همه فایل‌ها پیشوند یا پسوند اضافه کرد، مثلاً `beach.jpg` → `holiday_beach.jpg`.'
  meaning: 'نکته فنی: اگر هنگام `for %%f in (*.jpg)` نام فایل‌ها را عوض کنی، ممکن است حلقه فایل تغییرنام‌یافته را دوباره ببیند. امن‌تر: اول فهرست را با `for /f ... in (''dir /b *.jpg'')` بگیر و بعد تغییر نام بده.'
  usage: 'نام‌گذاری عکس‌های یک سفر، اضافه کردن تاریخ به گزارش‌ها، یکدست کردن نام فایل‌ها.'
  syntax: "for /f \"delims=\" %%f in ('dir /b *.jpg') do ren \"%%f\" \"prefix_%%f\""
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\rename.bat', content: "@echo off\ncd /d \"%USERPROFILE%\\Pictures\"\nfor /f \"delims=\" %%f in ('dir /b *.jpg') do ren \"%%f\" \"holiday_%%f\"\ndir /b\n"}]
    cmds: ['rename.bat']
  examples:
    - c: 'ren *.txt *.bak'
      d: 'بدون Script: عوض کردن پسوند همه.'
      noTry: true
    - c: 'for /f "delims=" %%f in (''dir /b *.jpg'') do ren "%%f" "2026_%%f"'
      d: 'پیشوند سال برای همه jpgها.'
      noTry: true
  mistakes:
    - 'ننوشتن Quotes دور `%%f` و خطا برای نام‌های فاصله‌دار.'
    - 'اجرای Script دو بار و گرفتن نام‌هایی مثل `holiday_holiday_beach.jpg`.'
  tip: 'قبل از اجرای واقعی، `ren` را با `echo ren` عوض کن تا نام‌های جدید را ببینی.'
  practice:
    - id: P90a
      batch: {file: 'rename.bat', starter: "@echo off\ncd /d \"%USERPROFILE%\\Pictures\"\n"}
      task: 'به ابتدای نام همه فایل‌های `.jpg` در Pictures پیشوند `holiday_` اضافه کن (مثل `holiday_beach.jpg`). فایل `logo.png` نباید تغییر کند.'
      checks: [{type: ranBatch}, {type: fileExists, path: 'C:\Users\Student\Pictures\holiday_beach.jpg'}, {type: fileExists, path: 'C:\Users\Student\Pictures\holiday_cat.jpg'}, {type: fileNotExists, path: 'C:\Users\Student\Pictures\beach.jpg'}, {type: fileExists, path: 'C:\Users\Student\Pictures\logo.png'}, {type: fileNotExists, path: 'C:\Users\Student\Pictures\holiday_holiday_beach.jpg'}]
      hints: ['فهرست jpgها را با `for /f` و `dir /b *.jpg` بگیر.', '`for /f "delims=" %%f in (''dir /b *.jpg'') do ren "%%f" "holiday_%%f"`']
      answer: ['@echo off', 'cd /d "%USERPROFILE%\Pictures"', "for /f \"delims=\" %%f in ('dir /b *.jpg') do ren \"%%f\" \"holiday_%%f\""]
  quiz:
    - kind: predict
      q: 'نتیجه این خط روی فایل `cat.jpg` چیست؟'
      code: 'ren "cat.jpg" "2026_cat.jpg"'
      options: ['2026_cat.jpg', 'cat_2026.jpg', '2026.jpg', 'خطا']
      answer: 0
      code_options: true
      explain: 'نام جدید دقیقاً همان است که نوشتی.'
    - kind: mcq
      q: 'چرا `for /f` با `dir /b` برای تغییر نام امن‌تر است؟'
      options: ['فهرست فایل‌ها قبل از تغییر نام ثابت می‌شود', 'سریع‌تر است', 'فایل‌های مخفی را هم می‌گیرد', 'لازم نیست Quotes بگذاری']
      answer: 0
      explain: 'فایل تغییرنام‌یافته دوباره در حلقه نمی‌آید.'
    - kind: tf
      q: 'برای دیدن نتیجه بدون تغییر واقعی، می‌شود جلوی `ren` یک `echo` گذاشت.'
      answer: true
      explain: 'دستور فقط چاپ می‌شود.'
  recap: 'تغییر نام گروهی: `for /f ... (''dir /b الگو'') do ren "%%f" "جدید_%%f"`. اول با `echo` امتحان کن.'

- n: 91
  term: 'search.bat'
  fullForm: 'Search script'
  difficulty: 3
  objective: 'ابزاری بنویسی که از کاربر کلمه بگیرد و آن را در همه فایل‌های یک پوشه جستجو کند.'
  summary: 'ترکیب `set /p` برای پرسیدن کلمه، `findstr /s /i /m` برای جستجو و ERRORLEVEL برای پیام «پیدا نشد».'
  meaning: '`findstr /m` فقط نام فایل‌ها را نشان می‌دهد. Exit Code برابر 1 یعنی چیزی پیدا نشد. با بررسی خالی بودن ورودی، Script بی‌دلیل اجرا نمی‌شود.'
  usage: 'جستجوی سریع در یادداشت‌ها، گزارش‌ها یا کدهای یک پروژه.'
  syntax: "set /p word=Search for: \nfindstr /s /i /m \"%word%\" *.txt\nif errorlevel 1 echo Nothing found."
  demo:
    start: 'C:\Users\Student\Desktop'
    inputs: ['sales']
    files: [{path: 'C:\Users\Student\Desktop\search.bat', content: "@echo off\nset /p word=Search for: \nif \"%word%\"==\"\" (echo Please type a word. & goto :eof)\ncd /d \"%USERPROFILE%\\Documents\"\necho Files that contain \"%word%\":\nfindstr /s /i /m \"%word%\" *.txt\nif errorlevel 1 echo Nothing found.\n"}]
    cmds: ['search.bat']
  examples:
    - c: 'findstr /s /i /m "%word%" *.txt'
      d: 'نام فایل‌هایی که کلمه را دارند.'
      noTry: true
    - c: 'findstr /s /i /n "%word%" *.txt'
      d: 'با نمایش خط و شماره خط.'
      noTry: true
  mistakes:
    - 'فراموش کردن `/i` و پیدا نکردن کلمه با حروف متفاوت.'
    - 'جستجو در پوشه اشتباه؛ اول `cd /d`.'
  tip: 'برای جستجو در همه نوع فایل متنی بنویس `*.txt *.log *.bat`.'
  practice:
    - id: P91a
      batch: {file: 'search.bat', starter: "@echo off\ncd /d \"%USERPROFILE%\\Documents\"\n"}
      inputs: ['sales']
      task: 'Script بنویس که یک کلمه از کاربر بپرسد و نام همه فایل‌های `.txt` (با زیرپوشه‌ها) را که آن کلمه را دارند نشان دهد؛ اگر چیزی پیدا نشد بگوید `Nothing found`. (با کلمه `sales` امتحان کن.)'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\search.bat', value: ['set /p', 'findstr']}, {type: outputIncludes, value: 'report1.txt'}]
      hints: ['`set /p word=Search for: `', '`findstr /s /i /m "%word%" *.txt` و بعد `if errorlevel 1 echo Nothing found`']
      answer: ['@echo off', 'cd /d "%USERPROFILE%\Documents"', 'set /p word=Search for: ', 'findstr /s /i /m "%word%" *.txt', 'if errorlevel 1 echo Nothing found']
  quiz:
    - kind: mcq
      q: 'کدام Switch در findstr فقط نام فایل‌ها را نشان می‌دهد؟'
      options: ['/m', '/n', '/s', '/i']
      answer: 0
      code_options: true
      explain: '`/m`'
    - kind: predict
      q: 'کاربر فقط Enter زد (ورودی خالی). با این خط چه می‌شود؟'
      code: 'if "%word%"=="" (echo Please type a word. & goto :eof)'
      options: ['پیام چاپ و Script تمام می‌شود', 'همه فایل‌ها پیدا می‌شوند', 'خطا می‌دهد', 'Script دوباره می‌پرسد']
      answer: 0
      explain: 'ورودی خالی بررسی شد.'
    - kind: tf
      q: 'Exit Code برابر 1 بعد از findstr یعنی کلمه پیدا نشد.'
      answer: true
      explain: '0 = پیدا شد.'
  recap: 'Script جستجو: `set /p` → بررسی خالی بودن → `findstr /s /i /m` → `if errorlevel 1`.'

- n: 92
  term: 'Automation'
  fullForm: 'Logs and scheduling'
  difficulty: 3
  objective: 'Scriptی بنویسی که کارش را با زمان در Log ثبت کند، و با زمان‌بندی و `shutdown` آشنا شوی.'
  summary: 'Automation یعنی Script بدون حضور تو کار کند: با Task Scheduler ویندوز در ساعت مشخص اجرا شود و هر کاری کرد را با `%DATE% %TIME%` در یک Log بنویسد.'
  meaning: 'Script خودکار نباید `pause` یا سؤال داشته باشد. `shutdown /s /t 3600` کامپیوتر را یک ساعت بعد خاموش می‌کند و `shutdown /a` آن را لغو می‌کند. زمان‌بندی در Windows با Task Scheduler یا دستور `schtasks` انجام می‌شود.'
  usage: 'گزارش روزانه، پاک کردن خودکار فایل‌های موقت، Backup شبانه، خاموش کردن زمان‌دار.'
  syntax: "echo %DATE% %TIME% - message >> log.txt\nshutdown /s /t 3600\nshutdown /a"
  warning: '`shutdown` روی کامپیوتر واقعی کارهای ذخیره‌نشده را از بین می‌برد. در Simulator هیچ چیزی خاموش نمی‌شود.'
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\daily.bat', content: "@echo off\nset \"log=%USERPROFILE%\\Desktop\\activity.log\"\necho %DATE% %TIME% - daily check started >> \"%log%\"\nipconfig | find \"IPv4\" >> \"%log%\"\nif exist \"%TEMP%\\*.tmp\" del /q \"%TEMP%\\*.tmp\"\necho %DATE% %TIME% - temp files cleaned >> \"%log%\"\ntype \"%log%\"\n"}]
    cmds: ['daily.bat', 'shutdown /s /t 3600', 'shutdown /a']
  examples:
    - c: 'echo %DATE% %TIME% - done >> log.txt'
      d: 'یک خط Log با زمان.'
      noTry: true
    - c: 'shutdown /r /t 60'
      d: 'Restart بعد از یک دقیقه.'
    - c: 'shutdown /a'
      d: 'لغو.'
  mistakes:
    - 'نوشتن Log با `>` و پاک شدن سابقه.'
    - 'گذاشتن `pause` در Script خودکار.'
  tip: 'در Task Scheduler گزینه «Run whether user is logged on or not» برای Scriptهای شبانه مفید است.'
  practice:
    - id: P92a
      batch: {file: 'daily.bat', starter: "@echo off\n"}
      task: 'Script بنویس که به فایل `%USERPROFILE%\Desktop\activity.log` دو خط اضافه کند: تاریخ و ساعت با متن `check done` و خط IPv4 خروجی ipconfig.'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\activity.log', value: ['check done', '192.168.1.24']}, {type: fileContains, path: 'C:\Users\Student\Desktop\daily.bat', value: ['%date%', '>>']}]
      hints: ['`echo %DATE% %TIME% - check done >> "%USERPROFILE%\Desktop\activity.log"`', '`ipconfig | find "IPv4" >> "%USERPROFILE%\Desktop\activity.log"`']
      answer: ['@echo off', 'echo %DATE% %TIME% - check done >> "%USERPROFILE%\Desktop\activity.log"', 'ipconfig | find "IPv4" >> "%USERPROFILE%\Desktop\activity.log"']
    - id: P92b
      start: 'C:\Users\Student'
      task: 'یک خاموش شدن زمان‌دار برای یک ساعت بعد (3600 ثانیه) تنظیم کن و بلافاصله لغوش کن.'
      multi: true
      checks: [{type: switch, value: '/s', cmd: shutdown, anyRun: true}, {type: switch, value: '/a', cmd: shutdown, anyRun: true}, {type: argIncludes, cmd: shutdown, value: '3600'}]
      hints: ['`shutdown /s /t 3600`', 'بعد `shutdown /a`']
      answer: ['shutdown /s /t 3600', 'shutdown /a']
  quiz:
    - kind: mcq
      q: 'چرا Script خودکار نباید `pause` داشته باشد؟'
      options: ['کسی نیست که کلید بزند و Script منتظر می‌ماند', 'pause در Task Scheduler ممنوع است', 'Log را پاک می‌کند', 'سرعت را کم می‌کند']
      answer: 0
      explain: 'Script تا ابد منتظر می‌ماند.'
    - kind: type
      q: 'کامپیوتر را ۱۰ دقیقه بعد Restart کن.'
      accept: ['shutdown /r /t 600', 'shutdown -r -t 600', 'shutdown /t 600 /r']
      show: 'shutdown /r /t 600'
      explain: '600 ثانیه = 10 دقیقه.'
    - kind: tf
      q: '`shutdown /a` یک خاموش شدن زمان‌دار را لغو می‌کند.'
      answer: true
      explain: 'Abort.'
  recap: 'Automation = Script بدون سؤال + Log با `%DATE% %TIME%` و `>>` + زمان‌بندی. `shutdown /s /t n` و `/a`.'

- n: 93
  term: chkdsk
  fullForm: 'File System · vol · Check Disk'
  difficulty: 3
  objective: 'File Systemها را بشناسی و دیسک را با chkdsk بررسی و تعمیر کنی.'
  summary: 'File System روش ذخیره فایل روی دیسک است: NTFS برای Windows، FAT32 و exFAT برای USB. `vol` نام و شماره Drive را نشان می‌دهد. `chkdsk` خطاهای File System را پیدا و با `/f` تعمیر می‌کند.'
  meaning: '`chkdsk` بدون `/f` فقط می‌خواند (Read-only). `/f` خطاها را تعمیر می‌کند و `/r` بخش‌های خراب دیسک را هم می‌گردد (کندتر). Driveی که Windows روی آن است (`C:`) در حال استفاده است، پس chkdsk پیشنهاد می‌کند بعد از Restart انجام شود. FAT32 فایل بزرگ‌تر از 4GB را قبول نمی‌کند.'
  usage: 'USB یا دیسکی که خطا می‌دهد، فایل‌هایی که باز نمی‌شوند، بعد از قطع ناگهانی برق.'
  syntax: "vol [drive:]\nchkdsk [drive:] [/f] [/r]"
  warning: '`chkdsk /r` روی دیسک بزرگ ممکن است ساعت‌ها طول بکشد و نباید وسطش کامپیوتر را خاموش کنی. قبل از تعمیر از اطلاعات مهم Backup بگیر.'
  demo:
    admin: true
    cmds: ['vol E:', 'chkdsk E:']
  examples:
    - c: 'vol'
      d: 'نام و Serial Number Drive فعلی.'
    - c: 'chkdsk E:'
      d: 'بررسی فقط‌خواندنی USB.'
    - c: 'chkdsk E: /f'
      d: 'بررسی و تعمیر.'
    - c: 'chkdsk C: /f'
      d: 'برای C: زمان‌بندی بعد از Restart.'
  mistakes:
    - 'اجرای chkdsk در CMD معمولی؛ به Administrator نیاز دارد.'
    - 'بیرون کشیدن USB وسط chkdsk.'
  tip: 'برای USB جدید، exFAT هم با Windows و هم با Mac کار می‌کند و محدودیت 4GB ندارد.'
  practice:
    - id: P93a
      start: 'C:\Windows\System32'
      admin: true
      task: 'USB (Drive E) را فقط بررسی کن (بدون تعمیر).'
      checks: [{type: anyCmd, value: chkdsk}, {type: argIncludes, cmd: chkdsk, value: 'e:'}, {type: lastOutputIncludes, value: 'FAT32'}, {type: not, check: {type: switch, value: '/f', cmd: chkdsk, anyRun: true}}]
      hints: ['chkdsk و حرف Drive.', '`chkdsk E:`']
      answer: 'chkdsk E:'
    - id: P93b
      start: 'C:\Windows\System32'
      admin: true
      setup: {diskErrors: {E: true}}
      task: 'USB خطای File System دارد. آن را بررسی و تعمیر کن.'
      checks: [{type: switch, value: '/f', cmd: chkdsk, anyRun: true}, {type: lastOutputIncludes, value: 'made corrections'}]
      hints: ['Switch تعمیر `/f` است.', '`chkdsk E: /f`']
      answer: 'chkdsk E: /f'
  quiz:
    - kind: mcq
      q: 'کدام File System فایل بزرگ‌تر از 4GB را قبول نمی‌کند؟'
      options: ['FAT32', 'NTFS', 'exFAT', 'هیچ‌کدام']
      answer: 0
      explain: 'محدودیت FAT32.'
    - kind: predict
      q: 'در CMD ادمین: `chkdsk C: /f`. نتیجه؟'
      code: 'chkdsk C: /f'
      options: ['پیشنهاد بررسی بعد از Restart', 'فوراً تعمیر می‌شود', 'C: پاک می‌شود', 'خطای Access denied']
      answer: 0
      explain: 'C: در حال استفاده است.'
    - kind: tf
      q: '`chkdsk` بدون `/f` چیزی را تغییر نمی‌دهد.'
      answer: true
      explain: 'فقط می‌خواند.'
  recap: 'NTFS برای Windows، FAT32/exFAT برای USB. `vol` = مشخصات. `chkdsk` بررسی، `/f` تعمیر، `/r` بخش خراب (Administrator).'

