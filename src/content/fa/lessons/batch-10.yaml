- n: 99
  term: 'Troubleshooting'
  fullForm: 'A basic Windows troubleshooting workflow'
  difficulty: 3
  objective: 'یک روند منظم برای عیب‌یابی رایج‌ترین مشکلات Windows داشته باشی.'
  summary: 'عیب‌یابی خوب حدس زدن نیست: مشکل را دقیق مشخص کن، اطلاعات جمع کن، از ساده‌ترین علت شروع کن، یک تغییر در هر بار بده و نتیجه را بسنج.'
  meaning: 'نقشه کلی: کندی → `tasklist` (حافظه)، `taskkill` برنامه هنگ‌کرده. اینترنت → روند درس ۶۱. پرینتر → `sc query spooler` و Restart سرویس. خطاهای سیستمی → `dism` و `sfc`. خطای دیسک → `chkdsk`. Windows بالا نمی‌آید → WinRE، نجات فایل‌ها، `bootrec`.'
  usage: 'پشتیبانی فنی برای خودت، خانواده یا محل کار.'
  syntax: "tasklist /fi \"memusage gt 100000\"\nsc query spooler\nipconfig & ping 8.8.8.8\nsfc /scannow"
  demo:
    admin: true
    cmds: ['tasklist /fi "status eq not responding"', 'sc query spooler | find "STATE"', 'ping -n 1 8.8.8.8']
  examples:
    - c: 'tasklist /fi "status eq not responding"'
      d: 'برنامه‌های هنگ‌کرده.'
    - c: 'systeminfo | find "Boot Time"'
      d: 'آیا کامپیوتر اخیراً Restart شده؟'
    - c: 'dir C:\ | find "bytes free"'
      d: 'فضای خالی C:.'
  mistakes:
    - 'تغییر چند چیز با هم؛ نمی‌فهمی کدام مشکل را حل کرد.'
    - 'رفتن مستقیم سراغ ابزارهای سنگین (format، نصب مجدد).'
  tip: 'هر کاری کردی را یادداشت کن (حتی با `>>` در یک فایل)؛ اگر مشکل برگشت، می‌دانی از کجا شروع کنی.'
  practice:
    - id: P99a
      start: 'C:\Windows\System32'
      admin: true
      task: 'کاربر می‌گوید «کامپیوتر کند است و پرینتر چاپ نمی‌کند». برنامه‌ای را که جواب نمی‌دهد پیدا و ببند، و سرویس `Spooler` را Restart کن.'
      multi: true
      checks: [{type: procGone, value: 'Spotify.exe'}, {type: serviceState, name: Spooler, value: RUNNING}, {type: any, of: [{type: argIncludes, cmd: net, value: 'stop'}, {type: argIncludes, cmd: sc, value: 'stop'}]}, {type: anyCmd, value: tasklist}]
      hints: ['`tasklist /fi "status eq not responding"` برنامه هنگ‌کرده را نشان می‌دهد؛ با `taskkill /im ... /f` ببندش.', 'بعد `net stop spooler` و `net start spooler`.']
      answer: ['tasklist /fi "status eq not responding"', 'taskkill /im Spotify.exe /f', 'net stop spooler', 'net start spooler']
  quiz:
    - kind: order
      q: 'روند کلی عیب‌یابی را مرتب کن.'
      items: ['مشکل را دقیق مشخص کن', 'اطلاعات جمع کن', 'ساده‌ترین علت را امتحان کن', 'نتیجه را بسنج و یادداشت کن']
      explain: 'تعریف → اطلاعات → تست ساده → بررسی.'
    - kind: mcq
      q: 'پرینتر چاپ نمی‌کند و صف چاپ گیر کرده. اولین دستور مناسب؟'
      options: ['sc query spooler', 'format C:', 'bootrec /fixmbr', 'diskpart']
      answer: 0
      code_options: true
      explain: 'وضعیت سرویس چاپ را ببین.'
    - kind: tf
      q: 'بهتر است در هر مرحله فقط یک تغییر بدهی.'
      answer: true
      explain: 'تا بدانی کدام تغییر مشکل را حل کرد.'
  recap: 'تعریف مشکل → جمع اطلاعات → ساده‌ترین علت → یک تغییر در هر بار → بررسی و یادداشت.'

- n: 100
  term: 'toolbox.bat'
  fullForm: 'Final project'
  difficulty: 3
  objective: 'همه چیزهایی را که یاد گرفتی در یک ابزار کامل با منو ترکیب کنی.'
  summary: 'پروژه نهایی یک «جعبه‌ابزار» است: منویی با `choice` که اطلاعات سیستم را نشان می‌دهد، از Documents Backup می‌گیرد، فایل‌های موقت را پاک می‌کند و خارج می‌شود.'
  meaning: 'این پروژه از متغیرها، `choice` و `if errorlevel`، Labelها و `goto`، `call :function`، `xcopy`، `del` با Wildcard، `>>` برای Log و `if exist` استفاده می‌کند. هر بخش را جدا بنویس و امتحان کن، بعد کنار هم بگذار.'
  usage: 'یک ابزار واقعی که می‌توانی روی کامپیوتر خودت نگه داری و گسترش دهی.'
  syntax: ":menu\nchoice /c 1234 /m \"Choose\"\nif errorlevel 4 goto end\n...\ncall :log \"message\""
  demo:
    start: 'C:\Users\Student\Desktop'
    inputs: ['1', '4']
    files: [{path: 'C:\Users\Student\Desktop\toolbox.bat', content: "@echo off\ntitle CMD Academy Toolbox\nset \"log=%USERPROFILE%\\Desktop\\toolbox.log\"\n:menu\necho.\necho ===== TOOLBOX =====\necho 1. System info\necho 2. Backup Documents\necho 3. Clean temp files\necho 4. Quit\nchoice /c 1234 /m \"Choose\"\nif errorlevel 4 goto end\nif errorlevel 3 goto clean\nif errorlevel 2 goto backup\n:info\necho Computer: %COMPUTERNAME%   User: %USERNAME%\nipconfig | find \"IPv4\"\ncall :log \"info shown\"\ngoto menu\n:backup\nxcopy \"%USERPROFILE%\\Documents\" \"D:\\Backup\\Documents\" /s /i /y /q\ncall :log \"backup done\"\ngoto menu\n:clean\nif exist \"%TEMP%\\*.tmp\" del /q \"%TEMP%\\*.tmp\"\necho Temp files cleaned.\ncall :log \"temp cleaned\"\ngoto menu\n:end\necho Bye!\ngoto :eof\n\n:log\necho %DATE% %TIME% - %~1 >> \"%log%\"\nexit /b\n"}]
    cmds: ['toolbox.bat']
  examples:
    - c: 'call :log "backup done"'
      d: 'یک تابع برای Log.'
      noTry: true
    - c: 'title CMD Academy Toolbox'
      d: 'عنوان پنجره.'
  mistakes:
    - 'نوشتن همه چیز با هم و بعد پیدا نکردن خطا؛ قدم‌به‌قدم بساز.'
    - 'فراموش کردن `goto menu` در آخر هر بخش.'
  tip: 'بعد از تمام کردن، یک گزینه جدید خودت اضافه کن؛ مثلاً «5. Ping Google».'
  practice:
    - id: P100a
      batch: {file: 'toolbox.bat', starter: "@echo off\n:menu\necho 1. System info\necho 2. Backup Documents\necho 3. Clean temp files\necho 4. Quit\nchoice /c 1234 /m \"Choose\"\n"}
      inputs: ['1', '2', '3', '4']
      task: 'منوی جعبه‌ابزار را کامل کن: 1 نام کامپیوتر (`%COMPUTERNAME%`) و خط IPv4 را نشان دهد، 2 پوشه Documents را با زیرپوشه‌ها به `D:\Backup\Documents` کپی کند، 3 همه `*.tmp`های `%TEMP%` را حذف کند و 4 با پیام `Bye!` خارج شود. بعد از هر گزینه به منو برگرد. (1، 2، 3 و بعد 4 را امتحان کن.)'
      checks: [{type: ranBatch}, {type: outputIncludes, value: ['ACADEMY-PC', '192.168.1.24', 'Bye!']}, {type: fileExists, path: 'D:\Backup\Documents\Work\report.txt'}, {type: countFiles, path: 'C:\Users\Student\AppData\Local\Temp\*.tmp', value: 0}, {type: fileContains, path: 'C:\Users\Student\Desktop\toolbox.bat', value: ['goto menu', 'errorlevel']}]
      hints: ['بعد از choice: `if errorlevel 4 goto end`، `if errorlevel 3 goto clean`، `if errorlevel 2 goto backup` و بعد بخش info.', 'هر بخش با Label شروع و با `goto menu` تمام شود: `:backup` → `xcopy "%USERPROFILE%\Documents" "D:\Backup\Documents" /s /i /y` → `goto menu`.']
      answer: ['@echo off', ':menu', 'echo 1. System info', 'echo 2. Backup Documents', 'echo 3. Clean temp files', 'echo 4. Quit', 'choice /c 1234 /m "Choose"', 'if errorlevel 4 goto end', 'if errorlevel 3 goto clean', 'if errorlevel 2 goto backup', 'echo Computer: %COMPUTERNAME%', 'ipconfig | find "IPv4"', 'goto menu', ':backup', 'xcopy "%USERPROFILE%\Documents" "D:\Backup\Documents" /s /i /y /q', 'goto menu', ':clean', 'del /q "%TEMP%\*.tmp"', 'echo Temp files cleaned.', 'goto menu', ':end', 'echo Bye!']
  quiz:
    - kind: order
      q: 'ساختار هر بخش منو را مرتب کن.'
      items: [':backup', 'xcopy ... /s /i /y', 'call :log "backup done"', 'goto menu']
      explain: 'Label → کار → Log → برگشت به منو.'
    - kind: mcq
      q: 'اگر `goto menu` را در آخر بخش info فراموش کنی چه می‌شود؟'
      options: ['اجرا به بخش بعدی (backup) ادامه پیدا می‌کند', 'Script خطا می‌دهد', 'منو دوباره نمایش داده می‌شود', 'هیچ']
      answer: 0
      explain: 'Batch خط‌به‌خط ادامه می‌دهد.'
    - kind: tf
      q: 'بهتر است پروژه بزرگ را بخش‌به‌بخش بسازی و هر بخش را جدا امتحان کنی.'
      answer: true
      explain: 'پیدا کردن خطا آسان‌تر می‌شود.'
  recap: 'تبریک! حالا با CMD کار می‌کنی، فایل‌ها و شبکه را مدیریت می‌کنی، Windows را عیب‌یابی می‌کنی و Batch Script می‌نویسی. ادامه بده: Challengeها را حل کن و ابزار خودت را بساز.'
