  meaning: 'سه مرحله: `/checkhealth` (سریع، فقط وضعیت)، `/scanhealth` (بررسی کامل)، `/restorehealth` (تعمیر، نیاز به اینترنت). ترتیب پیشنهادی وقتی sfc نتوانست تعمیر کند: اول `dism ... /restorehealth`، بعد دوباره `sfc /scannow`.'
  usage: 'خرابی‌های عمیق Windows، شکست به‌روزرسانی‌ها، وقتی sfc موفق نمی‌شود.'
