      checks: [{type: ranBatch}, {type: outputIncludes, value: 'Total: 24'}, {type: fileContains, path: 'C:\Users\Student\Desktop\price.bat', value: 'set /a'}]
      hints: ['محاسبه با `set /a` انجام می‌شود: نتیجه یک عبارت ریاضی را در یک Variable تازه می‌گذارد. داخل `set /a` نام Variableها بدون `%` هم کار می‌کنند و ضرب با `*` است.', 'خط تازه: `set /a`، Variable نتیجه (`total`)، `=`، و ضرب `price` در `qty`. خط آخر: `echo Total:` و بعد `%total%`.']
      answer: ['@echo off', 'set price=8', 'set qty=3', 'set /a total=price*qty', 'echo Total: %total%']
