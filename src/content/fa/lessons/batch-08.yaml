      answer: ['@echo off', 'set count=0', 'set /a count+=1', 'set /a count+=1', 'set /a count+=1', 'echo Count: %count%']
      explain: 'هر `set /a count+=1` یکی به `count` اضافه می‌کند، پس از 0 به 3 می‌رسد و `echo Count: %count%` عدد 3 را نشان می‌دهد.'
