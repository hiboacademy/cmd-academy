- n: 76
  term: '%1 %2 %*'
  fullForm: 'Arguments'
  difficulty: 3
  objective: 'به Script ورودی بدهی و Scriptهای قابل استفاده دوباره بنویسی.'
  summary: 'هر چیزی که بعد از نام Script بنویسی، Argument است. `%1` اولی، `%2` دومی، تا `%9`. `%*` همه Argumentها و `%0` نام خود Script است.'
  meaning: 'مثلاً `greet.bat Ali Sara` → `%1` = Ali و `%2` = Sara. Argument فاصله‌دار را داخل Quotes بده و برای حذف Quotes از `%~1` استفاده کن. `%~nx1` فقط نام و پسوند یک مسیر را می‌دهد.'
  usage: 'Scriptهایی مثل `backup.bat مبدأ مقصد` که برای هر بار اجرا ورودی متفاوت می‌گیرند.'
  syntax: "script.bat arg1 arg2\necho %1 %2\necho %*"
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\greet.bat', content: "@echo off\necho Script: %~nx0\necho Hello %1\necho Second: %2\necho All: %*\n"}]
    cmds: ['greet.bat Ali Sara Reza']
  examples:
    - c: 'greet.bat Ali'
      d: '`%1` = Ali.'
      noTry: true
    - c: 'copyto.bat "my file.txt" E:\'
      d: 'Argument فاصله‌دار با Quotes.'
      noTry: true
  mistakes:
    - 'استفاده از `%10`؛ فقط `%0` تا `%9` وجود دارد (برای بیشتر: `shift`، درس بعد).'
    - 'فرض اینکه کاربر Argument داده؛ با `if "%1"==""` بررسی کن (درس ۷۸).'
  tip: 'در Batch Editor، Argumentها را در کادر «Arguments» بنویس.'
  practice:
    - id: P76a
      batch: {file: 'greet.bat', starter: "@echo off\n", args: 'Ali'}
      task: 'Script بنویس که با اولین Argument سلام کند. با Argument `Ali` اجرا کن تا `Hello Ali` چاپ شود.'
      checks: [{type: ranBatch}, {type: outputIncludes, value: 'Hello Ali'}, {type: fileContains, path: 'C:\Users\Student\Desktop\greet.bat', value: '%1'}]
      hints: ['Argument چیزی است که بعد از نام Script نوشته می‌شود. داخل Script اولین Argument با `%1` خوانده می‌شود؛ آن را در جمله `echo` بگذار.', 'بعد از `@echo off` یک خط: `echo`، کلمه `Hello`، و بعد `%1`. در کادر Arguments مقدار `Ali` باشد و اجرا کن.']
      answer: ['@echo off', 'echo Hello %1']
      explain: 'هنگام اجرا با Argument `Ali`، CMD به‌جای `%1` کلمه `Ali` را می‌گذارد و `Hello Ali` چاپ می‌شود.'
