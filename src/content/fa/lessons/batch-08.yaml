- n: 77
  term: shift
  fullForm: 'Shift arguments'
  difficulty: 3
  objective: 'با `shift` Argumentها را یکی به چپ جابه‌جا کنی تا به همه آن‌ها دسترسی داشته باشی.'
  summary: 'بعد از `shift`، `%2` جای `%1` می‌آید، `%3` جای `%2` و همین‌طور تا آخر. Argument اول کنار گذاشته می‌شود.'
  meaning: 'با `shift` می‌توانی بیش از ۹ Argument را پردازش کنی، یا Argument اول را (مثلاً یک تنظیم) جدا کنی و بقیه را بعداً بخوانی. معمولاً همراه حلقه `goto` استفاده می‌شود (درس ۸۲).'
  usage: 'Scriptهایی که تعداد نامعلومی فایل یا نام می‌گیرند.'
  syntax: "echo %1\nshift\necho %1"
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\colors.bat', content: "@echo off\necho First: %1\nshift\necho Now first: %1\nshift\necho Now first: %1\n"}]
    cmds: ['colors.bat red green blue']
  examples:
    - c: 'shift'
      d: 'یک جابه‌جایی.'
      noTry: true
  mistakes:
    - 'انتظار اینکه `%*` بعد از `shift` تغییر کند؛ `%*` همیشه همه Argumentهای اول را نشان می‌دهد.'
  tip: 'الگوی رایج: `if "%1"=="" goto end` بعد پردازش `%1` و بعد `shift` و `goto` به اول حلقه.'
  practice:
    - id: P77a
      batch: {file: 'colors.bat', starter: "@echo off\necho First: %1\n", args: 'red green blue'}
      task: 'Script الان اولین رنگ را چاپ می‌کند. با `shift` کاری کن که بعدش `Then: green` هم چاپ شود (با Argumentهای `red green blue`).'
      checks: [{type: ranBatch}, {type: outputIncludes, value: ['First: red', 'Then: green']}, {type: fileContains, path: 'C:\Users\Student\Desktop\colors.bat', value: 'shift'}]
      hints: ['`shift` همه Argumentها را یکی به چپ می‌برد: بعد از آن، Argument دوم (`green`) در `%1` قرار می‌گیرد. پس بعد از `shift` دوباره `%1` را چاپ کن.', 'بعد از خط `echo First: %1` دو خط اضافه کن: ۱) Command `shift` ۲) `echo` با متن `Then:` و `%1`.']
      answer: ['@echo off', 'echo First: %1', 'shift', 'echo Then: %1']
      explain: 'خط اول `red` را چاپ می‌کند؛ `shift` Argumentها را جابه‌جا می‌کند تا `%1` برابر `green` شود و `echo Then: %1` چاپ می‌کند `Then: green`.'
  quiz:
