# Lessons 68–77 · Chapter 10: Batch basics
# Practice tasks with "batch:" open the script editor. "answer" is a working script.

- n: 68
  term: '.bat'
  fullForm: 'Batch Script'
  difficulty: 2
  objective: 'بفهمی Batch Script چیست و چرا کار با CMD را خودکار می‌کند.'
  summary: 'Batch Script یک فایل متنی با پسوند `.bat` است که داخلش چند دستور CMD نوشته شده. با اجرای فایل، دستورها یکی‌یکی از بالا به پایین اجرا می‌شوند.'
  meaning: 'هر کاری که در CMD تایپ می‌کنی را می‌شود در یک فایل Batch نوشت. Batch علاوه بر آن، متغیر، شرط (`if`)، حلقه (`for`) و پرش (`goto`) دارد؛ پس می‌تواند تصمیم بگیرد و تکرار کند.'
  usage: 'کارهای تکراری: Backup روزانه، مرتب کردن فایل‌ها، نصب و تنظیم چند کامپیوتر، گزارش‌گیری.'
  syntax: "file.bat\n(each line = one command)"
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\first.bat', content: "echo Hello Batch\nver\n"}]
    cmds: ['type first.bat', 'first.bat']
  examples:
    - c: 'first.bat'
      noTry: true
      d: 'اجرای یک Batch در پوشه فعلی.'
    - c: 'first'
      noTry: true
      d: 'بدون پسوند هم اجرا می‌شود.'
    - c: 'type first.bat'
      noTry: true
      d: 'دیدن محتوای Script.'
  mistakes:
    - 'ذخیره فایل در Notepad با نام `first.bat.txt`؛ در پنجره Save، نوع فایل را All Files بگذار.'
  tip: 'در CMD Academy، Batch Editor (از صفحه تمرین) جای امن نوشتن و اجرای Script است.'
  restaurant: 'Batch مثل برگه سفارش یک مهمانی است: به‌جای اینکه گارسون ده بار بیاید، همه سفارش‌ها را روی یک برگه می‌نویسی و آشپزخانه به ترتیب آماده می‌کند.'
  practice:
    - id: P68a
      batch: {file: 'first.bat', starter: "echo Hello Batch\n"}
      task: 'این Script یک خط دارد. خط دوم را اضافه کن که نسخه Windows را نشان بدهد (`ver`)، بعد اجرایش کن.'
      checks: [{type: ranBatch}, {type: outputIncludes, value: ['Hello Batch', 'Microsoft Windows']}]
      hints: ['هر خط Batch Script یک Command است و خط‌ها به ترتیب از بالا اجرا می‌شوند. Command نمایش نسخه Windows را در یک خط تازه، زیر خط `echo`، بنویس.', 'خط ۱ همان `echo Hello Batch` بماند؛ خط ۲: Command `ver`. بعد دکمه «اجرا» را بزن تا هر دو خروجی را ببینی.']
      answer: ['echo Hello Batch', 'ver']
      explain: 'Script اول `echo Hello Batch` را اجرا می‌کند و متن را چاپ می‌کند، بعد `ver` نسخه Windows (`Microsoft Windows ...`) را نشان می‌دهد.'
    - id: P68b
      start: 'C:\Users\Student\Desktop'
      task: 'بدون ویرایشگر و فقط با CMD، فایل `hi.bat` بساز که دستور `echo Hi from a file` داخلش باشد، و بعد آن را اجرا کن.'
      multi: true
      checks: [{type: fileContains, path: 'C:\Users\Student\Desktop\hi.bat', value: 'echo Hi from a file'}, {type: ranBatch}, {type: outputIncludes, value: 'Hi from a file'}]
      hints: ['دو قدم: اول با `echo` و Redirect (`>`) یک خط متن را در فایل `hi.bat` بنویس؛ آن متن خودش یک Command است. بعد فایل را با نامش اجرا کن.', 'خط اول سه بخش دارد: `echo` + متنی که باید داخل فایل برود (`echo Hi from a file`) + `>` و نام فایل `hi.bat`. خط دوم: فقط نام فایل `hi.bat`.']
      answer: ['echo echo Hi from a file > hi.bat', 'hi.bat']
      explain: '`echo` اول، متن `echo Hi from a file` را با `>` در `hi.bat` می‌نویسد؛ وقتی `hi.bat` را اجرا می‌کنی، همان خط اجرا می‌شود و `Hi from a file` چاپ می‌شود.'
  quiz:
    - kind: mcq
      q: 'دستورهای یک Batch Script به چه ترتیبی اجرا می‌شوند؟'
      options: ['از بالا به پایین، یکی‌یکی', 'همه با هم', 'از پایین به بالا', 'به ترتیب الفبا']
      answer: 0
      explain: 'مگر اینکه `goto` یا `call` ترتیب را عوض کند.'
    - kind: tf
      q: 'هر دستوری که در CMD کار می‌کند، داخل Batch هم کار می‌کند.'
      answer: true
      explain: 'Batch همان دستورهای CMD است، به‌علاوه امکانات Script.'
    - kind: type
      q: 'Script `backup.bat` را که در پوشه فعلی است اجرا کن.'
      accept: ['backup.bat', 'backup', 'call backup.bat', '.\backup.bat']
      explain: 'نام فایل را بنویس.'
  recap: 'Batch = فایل `.bat` با چند دستور که به ترتیب اجرا می‌شوند. با نام فایل اجرا می‌شود.'

- n: 69
  term: '.bat · .cmd'
  fullForm: 'Batch file types'
  difficulty: 2
  objective: 'تفاوت `.bat` و `.cmd` را بدانی و هر دو را اجرا کنی.'
  summary: '`.bat` و `.cmd` هر دو فایل Batch هستند و در Windows امروزی تقریباً یکسان اجرا می‌شوند.'
  meaning: '`.bat` از زمان MS-DOS مانده و `.cmd` برای Windows NT به بعد ساخته شد. تفاوت کوچک: در `.cmd` بعضی دستورها مثل `set` همیشه ERRORLEVEL را صفر می‌کنند. برای یادگیری، `.bat` کافی است.'
  usage: 'شناختن هر دو نوع وقتی Scriptهای دیگران را می‌بینی.'
  syntax: "script.bat\nscript.cmd"
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\tools.cmd', content: "@echo off\necho This is a .cmd script\n"}]
    cmds: ['tools', 'tools.cmd']
  examples:
    - c: 'tools.cmd'
      noTry: true
      d: 'اجرای فایل .cmd.'
    - c: 'tools'
      noTry: true
      d: 'بدون پسوند؛ CMD خودش .bat یا .cmd را پیدا می‌کند.'
  mistakes:
    - 'داشتن `tools.bat` و `tools.cmd` با هم در یک پوشه؛ با نوشتن `tools` معلوم نیست کدام اجرا شود.'
  tip: 'هیچ‌وقت نام Script را هم‌نام یک دستور (مثل `dir.bat` یا `ping.bat`) نگذار؛ گیج‌کننده و خطرناک است.'
  practice:
    - id: P69a
      start: 'C:\Users\Student\Desktop'
      files: [{path: 'C:\Users\Student\Desktop\tools.cmd', content: "@echo off\necho This is a .cmd script\n"}]
      task: 'روی Desktop فایل `tools.cmd` هست. آن را فقط با نوشتن نامش، بدون پسوند، اجرا کن.'
      checks: [{type: ranBatch}, {type: outputIncludes, value: 'This is a .cmd script'}, {type: not, check: {type: inputIncludes, value: '.cmd'}}]
      hints: ['وقتی نام یک Script را بدون پسوند بنویسی، CMD خودش در پوشه فعلی دنبال فایل `.bat` یا `.cmd` با همان نام می‌گردد.', 'نام فایل `tools.cmd` است؛ فقط بخش قبل از نقطه را بنویس و Enter بزن. `.cmd` را ننویس.']
      answer: 'tools'
      explain: 'CMD برای `tools` پسوندهای اجرایی مثل `.cmd` را امتحان می‌کند، `tools.cmd` را پیدا و اجرا می‌کند و پیامش چاپ می‌شود.'
    - id: P69b
      batch: {file: 'info.cmd', starter: "@echo off\n"}
      task: 'یک Script با پسوند `.cmd` بنویس که نام کاربر را با متغیر `%USERNAME%` چاپ کند.'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\info.cmd', value: '%username%'}, {type: outputIncludes, value: 'Student'}]
      hints: ['نام کاربر فعلی در Variable آماده `%USERNAME%` است. با `echo` می‌توانی یک متن و این Variable را با هم چاپ کنی.', 'خط اولِ آماده را دست نزن. خط دوم: `echo`، یک برچسب مثل `User:`، و بعد `%USERNAME%` (با `%` در دو طرف).']
      answer: ['@echo off', 'echo User: %USERNAME%']
      explain: 'در اجرای `echo User: %USERNAME%`، CMD به‌جای `%USERNAME%` نام کاربر (`Student`) را می‌گذارد و بعد کل جمله را چاپ می‌کند.'
  quiz:
    - kind: tf
      q: 'فایل `.cmd` هم مثل `.bat` با نوشتن نامش اجرا می‌شود.'
      answer: true
      explain: 'هر دو Batch هستند.'
    - kind: mcq
      q: 'کدام پسوند قدیمی‌تر است و از MS-DOS مانده؟'
      options: ['.bat', '.cmd', '.ps1', '.exe']
      answer: 0
      code_options: true
      explain: '`.cmd` برای Windows NT آمد.'
    - kind: mcq
      q: 'چرا نام Script نباید `ping.bat` باشد؟'
      options: ['ممکن است به‌جای دستور ping اجرا شود و گیج‌کننده باشد', 'نام‌های چهارحرفی ممنوع است', 'Windows آن را پاک می‌کند', 'فرقی ندارد']
      answer: 0
      explain: 'CMD اول پوشه فعلی را می‌گردد.'
  recap: '`.bat` و `.cmd` هر دو Batch‌اند. نام Script را هم‌نام دستورها نگذار.'

- n: 70
  term: 'hello.bat'
  fullForm: 'Your first batch file'
  difficulty: 2
  objective: 'اولین Script واقعی‌ات را بنویسی، ذخیره و اجرا کنی.'
  summary: 'در Windows واقعی: Notepad را باز کن، دستورها را بنویس، با نام `hello.bat` و نوع All Files ذخیره کن و آن را از CMD یا با دو بار کلیک اجرا کن.'
  meaning: 'وقتی با دو بار کلیک اجرا کنی، پنجره بعد از آخرین دستور فوراً بسته می‌شود؛ برای همین Scriptها معمولاً در آخر `pause` دارند (درس ۷۲). اجرای Script از داخل CMD پنجره را باز نگه می‌دارد.'
  usage: 'هر Script با همین چرخه ساخته می‌شود: نوشتن، ذخیره، اجرا، اصلاح.'
  syntax: "echo ...\ndir ...\n(save as hello.bat)"
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\hello.bat', content: "echo Hello, World!\necho Today is %DATE%\ndir /b\n"}]
    cmds: ['hello.bat']
  examples:
    - c: 'notepad hello.bat'
      d: 'در Windows واقعی Notepad فایل را برای ویرایش باز می‌کند.'
      noTry: true
    - c: 'hello'
      noTry: true
      d: 'اجرای Script.'
  mistakes:
    - 'ذخیره به‌صورت `hello.bat.txt`.'
    - 'فراموش کردن ذخیره قبل از اجرا (در Batch Editor دکمه اجرا خودش ذخیره می‌کند).'
  tip: 'در Script، `%DATE%` و `%USERNAME%` مثل خط فرمان کار می‌کنند.'
  practice:
    - id: P70a
      batch: {file: 'hello.bat', starter: ""}
      task: 'Script `hello.bat` را بنویس: اول `Hello, World!` را چاپ کند و بعد خط `Today is` به همراه تاریخ (`%DATE%`).'
      checks: [{type: ranBatch}, {type: outputIncludes, value: ['Hello, World!', 'Today is']}, {type: fileContains, path: 'C:\Users\Student\Desktop\hello.bat', value: '%date%'}]
      hints: ['هر چیزی که باید چاپ شود یک خط `echo` جدا می‌خواهد. تاریخ امروز در Variable آماده `%DATE%` است.', 'خط ۱: `echo` + متن `Hello, World!`. خط ۲: `echo` + متن `Today is` + فاصله + `%DATE%`.']
      answer: ['echo Hello, World!', 'echo Today is %DATE%']
      explain: 'خط اول متن خوشامد را چاپ می‌کند و در خط دوم CMD به‌جای `%DATE%` تاریخ امروز را می‌گذارد، پس `Today is` همراه تاریخ چاپ می‌شود.'
  quiz:
    - kind: mcq
      q: 'چرا وقتی روی Script دو بار کلیک می‌کنی، پنجره سریع بسته می‌شود؟'
      options: ['Script تمام شده و CMD هم بسته می‌شود', 'Script خراب است', 'Windows آن را مسدود کرد', 'پسوند اشتباه است']
      answer: 0
      explain: 'برای دیدن نتیجه از `pause` استفاده کن.'
    - kind: tf
      q: 'در Notepad باید نوع فایل را All Files بگذاری تا `.txt` به نام اضافه نشود.'
      answer: true
      explain: 'وگرنه فایل `hello.bat.txt` می‌شود.'
    - kind: order
      q: 'چرخه ساخت Script را مرتب کن.'
      items: ['نوشتن دستورها', 'ذخیره با پسوند .bat', 'اجرا', 'خواندن خروجی و اصلاح']
      explain: 'نوشتن → ذخیره → اجرا → اصلاح.'
  recap: 'نوشتن → ذخیره `.bat` → اجرا. دو بار کلیک پنجره را می‌بندد؛ `pause` لازم است.'

- n: 71
  term: '@echo off'
  fullForm: 'echo off · rem · ::'
  difficulty: 2
  objective: 'نمایش خود دستورها را خاموش کنی و در Script توضیح بنویسی.'
  summary: 'به‌طور پیش‌فرض، Batch هر دستور را قبل از اجرا با Prompt نشان می‌دهد. `@echo off` در خط اول این نمایش را خاموش می‌کند. `rem` و `::` برای نوشتن توضیح (Comment) هستند.'
  meaning: '`echo off` نمایش دستورها را خاموش می‌کند و `@` قبل از هر خط، نمایش همان یک خط را. پس `@echo off` یعنی «از اینجا به بعد دستورها را نشان نده، خود این خط را هم نه». Comment اجرا نمی‌شود و فقط برای خواننده است.'
  usage: 'تقریباً همه Scriptها با `@echo off` شروع می‌شوند. Comment کمک می‌کند بعدها بفهمی هر بخش چه می‌کند.'
  syntax: "@echo off\nrem comment\n:: comment"
  demo:
    start: 'C:\Users\Student\Desktop'
    files:
      - {path: 'C:\Users\Student\Desktop\noisy.bat', content: "echo Step 1\necho Step 2\n"}
      - {path: 'C:\Users\Student\Desktop\quiet.bat', content: "@echo off\nrem This line is a comment\necho Step 1\necho Step 2\n"}
    cmds: ['noisy.bat', 'quiet.bat']
  examples:
    - c: '@echo off'
      d: 'خط اول تقریباً همه Scriptها.'
      noTry: true
    - c: 'rem Backup of Documents'
      d: 'یک توضیح.'
      noTry: true
    - c: ':: Step 2: copy files'
      d: 'شکل دیگر توضیح.'
      noTry: true
  mistakes:
    - 'نوشتن `echo off` بدون `@`: خود این خط یک بار نمایش داده می‌شود.'
    - 'استفاده از `::` داخل پرانتز `( )`؛ آنجا `rem` امن‌تر است.'
  tip: 'برای عیب‌یابی Script، موقتاً `@echo off` را به `@echo on` تغییر بده تا ببینی کدام خط اجرا می‌شود.'
  practice:
    - id: P71a
      batch: {file: 'steps.bat', starter: "echo Step 1: check files\ndir /b\necho Step 2: done\n"}
      task: 'این Script هنگام اجرا خود دستورها را هم نشان می‌دهد. کاری کن که فقط خروجی‌ها نمایش داده شوند و یک خط توضیح با `rem` هم اضافه کن.'
      checks: [{type: ranBatch}, {type: fileContains, path: 'C:\Users\Student\Desktop\steps.bat', value: ['@echo off', 'rem']}, {type: outputIncludes, value: 'Step 2: done'}, {type: outputExcludes, value: '>echo'}]
      hints: ['دو چیز لازم است: یک خط در بالای Script که نمایش خود دستورها را خاموش کند (`echo off` همراه `@`)، و یک خط Comment که با `rem` شروع شود و اجرا نشود.', 'خط ۱ (بالاترین خط): `@echo off`. خط ۲: `rem` و بعد یک توضیح کوتاه انگلیسی درباره کار Script. بقیه خط‌های قبلی بدون تغییر بمانند.']
      answer: ['@echo off', 'rem List the desktop files', 'echo Step 1: check files', 'dir /b', 'echo Step 2: done']
      explain: '`@echo off` باعث می‌شود دستورها قبل از اجرا با Prompt نمایش داده نشوند (و `@` خود این خط را هم پنهان می‌کند)؛ خط `rem` فقط توضیح است و اجرا نمی‌شود.'
  quiz:
    - kind: mcq
      q: '`@` در ابتدای یک خط Batch چه می‌کند؟'
      options: ['نمایش همان خط را خاموش می‌کند', 'خط را Comment می‌کند', 'خط را دو بار اجرا می‌کند', 'خط را با Administrator اجرا می‌کند']
      answer: 0
      explain: '`@echo off` = خاموش کردن نمایش + پنهان کردن خود این خط.'
    - kind: tf
      q: 'خطی که با `rem` شروع می‌شود اجرا نمی‌شود.'
      answer: true
      explain: 'Comment است.'
    - kind: predict
      q: 'خروجی این Script (بدون @echo off) چه شکلی است؟'
      code: "echo Hi"
      options: ["C:\\...>echo Hi\nHi", 'Hi', 'echo Hi', 'هیچ']
      answer: 0
      code_options: true
      explain: 'با echo روشن، اول خود دستور با Prompt دیده می‌شود.'
  recap: '`@echo off` در خط اول. `rem` یا `::` برای توضیح.'

- n: 72
  term: pause
  fullForm: 'Pause'
  difficulty: 2
  objective: 'Script را متوقف کنی تا کاربر نتیجه را ببیند یا آماده ادامه شود.'
  summary: '`pause` پیام `Press any key to continue . . .` را نشان می‌دهد و تا فشردن یک کلید منتظر می‌ماند.'
  meaning: '`pause >nul` بدون نمایش پیام منتظر می‌ماند؛ می‌توانی قبلش پیام خودت را با `echo` بنویسی.'
  usage: 'آخر Scriptهایی که با دو بار کلیک اجرا می‌شوند، یا قبل از کار مهم («برای شروع Backup یک کلید بزن»).'
  syntax: "pause\necho message & pause >nul"
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\wait.bat', content: "@echo off\necho Ready?\npause\necho Go!\n"}]
    cmds: ['wait.bat']
  examples:
    - c: 'pause'
      d: 'پیام استاندارد و انتظار.'
      noTry: true
    - c: 'echo Press any key to start the backup... & pause >nul'
      d: 'پیام فارسی یا دلخواه خودت.'
      noTry: true
  mistakes:
    - 'گذاشتن `pause` در Scriptهایی که خودکار (مثلاً با Task Scheduler) اجرا می‌شوند؛ Script تا ابد منتظر می‌ماند.'
  tip: 'در Simulator وقتی `pause` منتظر است، هر کلیدی را بزن.'
  practice:
    - id: P72a
      batch: {file: 'wait.bat', starter: "@echo off\necho Ready?\necho Go!\n"}
      task: 'Script را طوری تغییر بده که بعد از `Ready?` منتظر فشردن کلید بماند و بعد `Go!` را چاپ کند.'
      checks: [{type: ranBatch}, {type: outputOrder, value: ['Ready?', 'Press any key to continue', 'Go!']}]
      hints: ['Commandی لازم داری که Script را نگه دارد تا کاربر یک کلید بزند. جایش مهم است: باید بین چاپ `Ready?` و چاپ `Go!` باشد.', 'یک خط تازه بعد از `echo Ready?` و قبل از `echo Go!` باز کن و Command `pause` را تنها در آن خط بنویس.']
      answer: ['@echo off', 'echo Ready?', 'pause', 'echo Go!']
      explain: '`pause` بعد از `Ready?` پیام `Press any key to continue . . .` را نشان می‌دهد و تا فشردن کلید صبر می‌کند؛ بعد Script ادامه می‌دهد و `Go!` چاپ می‌شود.'
    - id: P72b
      batch: {file: 'start.bat', starter: "@echo off\n"}
