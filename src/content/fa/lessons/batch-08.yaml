- n: 75
  term: 'set /a'
  fullForm: 'Arithmetic'
  difficulty: 2
  objective: 'در Batch با اعداد محاسبه کنی و شمارنده بسازی.'
  summary: '`set /a` عبارت ریاضی را حساب می‌کند: `set /a total=price*qty`. فقط عدد صحیح؛ اعشار ندارد.'
  meaning: 'داخل `set /a` نام متغیرها بدون `%` هم کار می‌کنند. عملگرها: `+ - * /` و `%` برای باقیمانده (در فایل Batch باید `%%` بنویسی). `+=` و `-=` برای افزایش و کاهش. تقسیم اعشار را دور می‌ریزد: `7/2` می‌شود `3`.'
  usage: 'شمارنده در حلقه‌ها، حساب کردن تعداد فایل‌ها، محاسبه ساده قیمت.'
  syntax: "set /a x=5+3\nset /a total=price*qty\nset /a count+=1\nset /a r=10%%3"
  demo:
    start: 'C:\Users\Student\Desktop'
    files: [{path: 'C:\Users\Student\Desktop\math.bat', content: "@echo off\nset price=8\nset qty=3\nset /a total=price*qty\necho Total: %total%\nset /a half=7/2\necho 7/2 = %half%\nset /a rest=7%%2\necho 7 mod 2 = %rest%\n"}]
    cmds: ['math.bat', 'set /a 10*4+2']
  examples:
    - c: 'set /a 10*4+2'
      d: 'در خط فرمان، نتیجه را هم چاپ می‌کند.'
    - c: 'set /a count+=1'
      d: 'یکی اضافه کن.'
      noTry: true
    - c: 'set /a "x=(2+3)*4"'
      d: 'پرانتز؛ داخل Quotes امن‌تر است.'
  mistakes:
    - 'انتظار اعشار: `set /a x=5/2` نتیجه 2 است، نه 2.5.'
    - 'نوشتن `%` تکی برای باقیمانده داخل فایل Batch؛ باید `%%` باشد.'
  tip: 'اگر مقدار متغیر عدد نباشد، `set /a` آن را صفر حساب می‌کند.'
