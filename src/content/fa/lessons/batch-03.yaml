      hints: ['اول خروجی عادی را با `>` به فایل ببر.', 'بعد `2>&1` را اضافه کن: `dir Documents\nothing > all.txt 2>&1`']
      answer: 'dir Documents\nothing > all.txt 2>&1'
  quiz:
    - kind: mcq
      q: 'شماره جریان پیام‌های خطا در CMD کدام است؟'
      options: ['2', '1', '0', '3']
      answer: 0
      explain: '0 ورودی، 1 خروجی عادی، 2 خطا.'
    - kind: predict
      q: 'فایل `x.txt` وجود ندارد. روی صفحه چه دیده می‌شود؟'
      code: 'type x.txt 2>nul'
      options: ['هیچ چیز', 'The system cannot find the file specified.', 'x.txt', 'nul']
      answer: 0
      explain: 'پیام خطا به `nul` رفت.'
    - kind: fix
      q: 'کاربر می‌خواهد خروجی و خطا هر دو در `log.txt` بروند. اشکال کجاست؟'
      code: 'dir C:\nothing 2>&1 > log.txt'
      options: ['`2>&1` باید بعد از `> log.txt` بیاید', 'باید `>>` نوشت', '`2>&1` وجود ندارد', 'باید `1>&2` نوشت']
      answer: 0
      explain: 'درست: `dir C:\nothing > log.txt 2>&1`'
  recap: '1 = خروجی، 2 = خطا. `2>` خطا به فایل، `2>nul` پنهان، `> file 2>&1` همه در یک فایل.'

- n: 31
  term: '&   &&   ||'
  fullForm: 'Command chaining'
  difficulty: 2
  objective: 'چند دستور را در یک خط اجرا کنی و اجرای دستور دوم را به موفقیت یا شکست اولی وابسته کنی.'
  summary: '`&` دستور دوم را همیشه اجرا می‌کند. `&&` فقط اگر اولی موفق بود. `||` فقط اگر اولی شکست خورد.'
  meaning: 'هر دستور بعد از اجرا یک Exit Code دارد: صفر یعنی موفق. `&&` و `||` همین را بررسی می‌کنند (درس ۶۲).'
  usage: '`mkdir X && cd X` (اگر ساخته شد، برو داخلش)، `type file || echo پیدا نشد` (پیام دوستانه به‌جای خطا).'
  syntax: "cmd1 & cmd2\ncmd1 && cmd2\ncmd1 || cmd2"
  demo:
    start: 'C:\Users\Student'
    cmds: ['mkdir Shop && cd Shop', 'type nofile.txt || echo File not found', 'echo One & echo Two']
  examples:
    - c: 'mkdir Shop && cd Shop'
      d: 'فقط اگر ساختن موفق بود، وارد پوشه شو.'
    - c: 'type a.txt || echo a.txt is missing'
      expectError: true
      d: 'اگر فایل نبود، پیام خودت را نشان بده.'
    - c: 'cd Documents & dir /b'
      d: 'دو دستور پشت‌سرهم، بدون شرط.'
    - c: 'copy a.txt E:\ && echo OK || echo FAILED'
      expectError: true
      d: 'نتیجه کار را با یک کلمه گزارش کن.'
  mistakes:
