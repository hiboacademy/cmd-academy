    - 'استفاده از `&` وقتی دستور دوم به اولی وابسته است: اگر `cd` شکست بخورد، `del *.*` در پوشه اشتباه اجرا می‌شود! اینجا `&&` امن‌تر است.'
  tip: 'قانون امنیت: قبل از دستورهای خطرناک، از `&&` استفاده کن تا فقط در صورت موفقیت مرحله قبل اجرا شوند.'
  restaurant: '`&` یعنی «پیش‌غذا و بعد غذای اصلی را بیاور». `&&` یعنی «اگر پیتزا داشتید، نوشابه هم بیاور». `||` یعنی «اگر پیتزا نداشتید، پاستا بیاور».'
  practice:
