# Lessons 21–32 · file management, wildcards, redirection, chaining

- n: 21
  term: copy
  fullForm: 'Copy'
  difficulty: 1
  objective: 'از یک فایل نسخه بگیری، آن را به پوشه یا Drive دیگر کپی کنی و پیام‌های copy را بفهمی.'
  summary: '`copy` یک یا چند فایل را از جایی به جای دیگر کپی می‌کند. فایل اصلی سر جایش می‌ماند.'
  meaning: 'اولین Argument مبدأ است و دومی مقصد. مقصد می‌تواند یک پوشه باشد (فایل با همان نام کپی می‌شود) یا یک نام جدید.'
  usage: 'گرفتن نسخه پشتیبان، بردن فایل به USB، ساختن نسخه دوم قبل از ویرایش.'
  syntax: 'copy source [destination] [/y]'
  demo:
    start: 'C:\Users\Student\Documents'
    cmds: ['copy todo.txt todo_backup.txt', 'copy menu.txt E:\', 'dir E:\ /b']
  examples:
    - c: 'copy todo.txt todo_backup.txt'
      d: 'نسخه دوم با نام جدید در همین پوشه.'
    - c: 'copy menu.txt D:\Backup'
      d: 'کپی به یک پوشه در Drive دیگر؛ نام فایل همان می‌ماند.'
    - c: 'copy menu.txt E:\menu_old.txt'
      d: 'کپی به USB با نام جدید.'
    - c: 'copy /y todo.txt D:\Backup'
      d: '`/y` یعنی اگر فایل در مقصد بود، بدون پرسیدن جایگزین کن.'
  mistakes:
    - 'کپی فایل روی خودش: `copy todo.txt .` خطای `The file cannot be copied onto itself.` می‌دهد.'
    - 'مقصدی که وجود ندارد: اگر پوشه مقصد نباشد، copy آن را نمی‌سازد.'
    - 'انتظار کپی کل پوشه با زیرپوشه‌ها؛ برای آن `xcopy` یا `robocopy` لازم است (درس ۴۳ و ۴۴).'
  tip: 'وقتی فایل در مقصد هست، CMD می‌پرسد `Overwrite ...? (Yes/No/All)`. `Y` یعنی بله، `N` نه، `A` یعنی برای همه.'
  restaurant: 'از دستور غذای اصلی یک فتوکپی برای شعبه دیگر می‌فرستی؛ اصل در دفتر خودت می‌ماند.'
  practice:
    - id: P21a
      start: 'C:\Users\Student\Documents'
      task: 'از فایل `todo.txt` یک نسخه به نام `todo_backup.txt` در همین پوشه بساز.'
      checks: [{type: fileExists, path: 'C:\Users\Student\Documents\todo_backup.txt'}, {type: fileExists, path: 'C:\Users\Student\Documents\todo.txt'}]
      hints: ['دستور `copy` دو Argument می‌گیرد: مبدأ و مقصد.', '`copy todo.txt todo_backup.txt`']
      answer: 'copy todo.txt todo_backup.txt'
    - id: P21b
      start: 'C:\Users\Student\Documents'
      task: 'فایل `menu.txt` را به ریشه USB (Drive E) کپی کن.'
      checks: [{type: fileExists, path: 'E:\menu.txt'}]
      hints: ['مقصد ریشه Drive E است: `E:\`', '`copy menu.txt E:\`']
      answer: 'copy menu.txt E:\'
  quiz:
    - kind: mcq
      q: 'بعد از `copy a.txt D:\Backup`، فایل `a.txt` اصلی چه می‌شود؟'
      options: ['سر جایش می‌ماند', 'پاک می‌شود', 'نامش عوض می‌شود', 'خالی می‌شود']
      answer: 0
      explain: '`copy` نسخه می‌سازد؛ برای جابه‌جایی `move` لازم است.'
    - kind: predict
      q: 'پوشه `D:\Old` وجود ندارد. نتیجه این دستور چیست؟'
      code: 'copy menu.txt D:\Old\menu.txt'
      options: ['The system cannot find the path specified.', 'پوشه Old ساخته و فایل کپی می‌شود', '1 file(s) copied.', 'Access is denied.']
      answer: 0
      explain: '`copy` پوشه مقصد را نمی‌سازد؛ اول با `mkdir` بسازش.'
    - kind: type
      q: 'فایل `todo.txt` را به پوشه `D:\Backup` کپی کن.'
      accept: ['copy todo.txt d:\backup', 'copy todo.txt d:\backup\', 'copy todo.txt d:\backup\todo.txt']
      show: 'copy todo.txt D:\Backup'
      explain: 'مبدأ، فاصله، مقصد.'
    - kind: sim
      q: 'فایل `menu.txt` را از Documents به `D:\Backup` کپی کن.'
      start: 'C:\Users\Student'
      checks: [{type: fileExists, path: 'D:\Backup\menu.txt'}, {type: fileExists, path: 'C:\Users\Student\Documents\menu.txt'}]
      answer: 'copy Documents\menu.txt D:\Backup'
      explain: '`copy مبدأ مقصد`؛ فایل اصلی سر جایش می‌ماند.'
  recap: '`copy مبدأ مقصد`. اصل فایل می‌ماند. پوشه مقصد باید وجود داشته باشد. `/y` = بدون پرسیدن.'

- n: 22
  term: move
  fullForm: 'Move'
  difficulty: 1
  objective: 'فایل یا پوشه را به جای دیگر منتقل کنی.'
  summary: '`move` فایل یا پوشه را از جای فعلی برمی‌دارد و در مقصد می‌گذارد. بعد از آن، در جای قبلی دیگر نیست.'
  meaning: 'اگر مقصد یک پوشه باشد، فایل به داخل آن می‌رود. اگر مقصد یک نام جدید باشد، فایل با آن نام منتقل می‌شود.'
  usage: 'مرتب کردن فایل‌ها، بردن دانلودها به پوشه درست، جابه‌جا کردن پوشه‌ها.'
  syntax: 'move [/y] source destination'
  demo:
    start: 'C:\Users\Student\Downloads'
    cmds: ['move invoice.pdf ..\Documents', 'dir /b', 'dir ..\Documents /b']
  examples:
    - c: 'move invoice.pdf ..\Documents'
      d: 'بردن فایل به پوشه Documents.'
    - c: 'move todo.txt Work\tasks.txt'
      at: 'C:\Users\Student\Documents'
      d: 'انتقال به پوشه Work با نام جدید.'
    - c: 'move Work Office'
      at: 'C:\Users\Student\Documents'
      d: 'اگر Office وجود نداشته باشد، نام پوشه Work عوض می‌شود.'
  mistakes:
    - 'فکر کردن اینکه `move` کپی می‌گیرد؛ فایل از جای قبلی حذف می‌شود.'
    - 'جابه‌جا کردن پوشه‌ای که الان داخلش هستی.'
  tip: 'اگر فایلی با همان نام در مقصد باشد، CMD قبل از جایگزینی می‌پرسد.'
  daily: '`copy` یعنی کپی گرفتن از یک برگه؛ `move` یعنی خود برگه را از کشو برداری و در کشوی دیگر بگذاری.'
  practice:
    - id: P22a
      start: 'C:\Users\Student\Documents'
      task: 'فایل `todo.txt` را به داخل پوشه `Work` منتقل کن.'
      checks: [{type: fileExists, path: 'C:\Users\Student\Documents\Work\todo.txt'}, {type: fileNotExists, path: 'C:\Users\Student\Documents\todo.txt'}]
      hints: ['`move` مثل `copy` مبدأ و مقصد می‌گیرد.', '`move todo.txt Work`']
      answer: 'move todo.txt Work'
    - id: P22b
      start: 'C:\Users\Student'
      task: 'بدون رفتن به پوشه‌ها، فایل `invoice.pdf` را از Downloads به Documents منتقل کن.'
      checks: [{type: fileExists, path: 'C:\Users\Student\Documents\invoice.pdf'}, {type: fileNotExists, path: 'C:\Users\Student\Downloads\invoice.pdf'}]
      hints: ['مبدأ: `Downloads\invoice.pdf`', '`move Downloads\invoice.pdf Documents`']
      answer: 'move Downloads\invoice.pdf Documents'
  quiz:
    - kind: tf
      q: 'بعد از `move`، فایل در جای اولش هم باقی می‌ماند.'
      answer: false
      explain: '`move` منتقل می‌کند، کپی نمی‌گیرد.'
    - kind: mcq
      q: 'کدام دستور فایل `a.txt` را به پوشه `Archive` می‌برد؟'
      options: ['move a.txt Archive', 'copy a.txt Archive', 'ren a.txt Archive', 'cd a.txt Archive']
      answer: 0
      code_options: true
      explain: '`move` مبدأ را برمی‌دارد و در مقصد می‌گذارد.'
    - kind: predict
      q: 'در پوشه فعلی فقط فایل `old.txt` هست. بعد از این دستور چه داری؟'
      code: 'move old.txt new.txt'
      options: ['فقط new.txt', 'old.txt و new.txt', 'فقط old.txt', 'خطا']
      answer: 0
      explain: 'انتقال به نام جدید در همان پوشه یعنی تغییر نام.'
  recap: '`move مبدأ مقصد` = انتقال. فایل در جای قبلی نمی‌ماند.'

- n: 23
  term: ren
  fullForm: 'Rename'
  difficulty: 1
  objective: 'نام فایل یا پوشه را عوض کنی و محدودیت `ren` را بدانی.'
  summary: '`ren` (یا `rename`) فقط نام را عوض می‌کند؛ فایل در همان پوشه می‌ماند.'
  meaning: 'Argument اول فایل فعلی است (با Path اگر لازم است). Argument دوم فقط نام جدید است، بدون Path.'
  usage: 'اصلاح نام، اضافه کردن تاریخ به نام، تغییر Extension.'
  syntax: 'ren [drive:][path]oldname newname'
  demo:
    start: 'C:\Users\Student\Desktop'
    cmds: ['ren notes.txt ideas.txt', 'dir /b']
  examples:
    - c: 'ren notes.txt ideas.txt'
      d: 'تغییر نام یک فایل.'
    - c: 'ren Work Office'
      at: 'C:\Users\Student\Documents'
      d: 'تغییر نام یک پوشه.'
    - c: 'ren Documents\menu.txt menu_2026.txt'
      at: 'C:\Users\Student'
      d: 'Path فقط در نام اول می‌آید.'
  mistakes:
    - 'گذاشتن Path در نام جدید: `ren a.txt D:\b.txt` خطا می‌دهد. برای بردن به جای دیگر از `move` استفاده کن.'
    - 'نام جدیدی که از قبل وجود دارد: `A duplicate file name exists...`'
    - 'جا انداختن Extension: `ren notes.txt ideas` فایلی بدون `.txt` می‌سازد.'
  tip: 'در درس ۲۶ می‌بینی که `ren *.txt *.bak` همه Extensionها را با هم عوض می‌کند.'
  practice:
    - id: P23a
      start: 'C:\Users\Student\Desktop'
      task: 'نام فایل `notes.txt` را به `ideas.txt` تغییر بده.'
      checks: [{type: fileExists, path: 'C:\Users\Student\Desktop\ideas.txt'}, {type: fileNotExists, path: 'C:\Users\Student\Desktop\notes.txt'}]
      hints: ['دستور تغییر نام سه حرف است.', '`ren notes.txt ideas.txt`']
      answer: 'ren notes.txt ideas.txt'
    - id: P23b
      start: 'C:\Users\Student\Documents'
      task: 'نام پوشه `Work` را به `Office` تغییر بده.'
      checks: [{type: dirExists, path: 'C:\Users\Student\Documents\Office'}, {type: dirNotExists, path: 'C:\Users\Student\Documents\Work'}]
      hints: ['`ren` روی پوشه هم کار می‌کند.', '`ren Work Office`']
      answer: 'ren Work Office'
  quiz:
    - kind: fix
      q: 'این دستور خطای `The syntax of the command is incorrect.` می‌دهد. چرا؟'
      code: 'ren report.txt D:\report.txt'
      options: ['نام جدید نباید Path داشته باشد', 'باید `rename` نوشت', 'فایل وجود ندارد', 'Drive D پر است']
      answer: 0
      explain: '`ren` فقط نام را عوض می‌کند. برای جابه‌جایی: `move`.'
    - kind: tf
      q: '`rename` و `ren` یک دستورند.'
      answer: true
      explain: '`ren` شکل کوتاه `rename` است.'
    - kind: type
      q: 'نام `draft.txt` را به `final.txt` تغییر بده.'
      accept: ['ren draft.txt final.txt', 'rename draft.txt final.txt']
      explain: '`ren قدیمی جدید`'
  recap: '`ren قدیمی جدید` فقط نام را عوض می‌کند. نام جدید بدون Path.'

- n: 24
  term: del
  fullForm: 'Delete'
  difficulty: 1
  objective: 'فایل را با `del` حذف کنی و خطر آن را بشناسی.'
  summary: '`del` (یا `erase`) فایل را حذف می‌کند. فایل به Recycle Bin نمی‌رود و برگرداندنش بسیار سخت است.'
  meaning: '`del` فقط فایل حذف می‌کند، نه پوشه. اگر نام یک پوشه را بدهی، فایل‌های داخلش را حذف می‌کند و قبلش سؤال می‌پرسد.'
  usage: 'پاک کردن فایل‌های موقت، خروجی‌های قدیمی و فایل‌هایی که دیگر لازم نیستند.'
  syntax: 'del [/p] [/q] [/f] [/s] names'
  warning: 'فایلی که با `del` حذف شود به Recycle Bin نمی‌رود. قبل از Enter، نام و مسیر را دوباره بخوان. روی کامپیوتر واقعی اول با `dir` همان الگو را ببین.'
  demo:
    start: 'C:\Users\Student\Downloads'
    cmds: ['del temp1.tmp', 'dir /b', 'del nothing.txt']
  examples:
    - c: 'del temp1.tmp'
      d: 'حذف یک فایل.'
    - c: 'del /p photos.zip'
      d: '`/p` قبل از حذف هر فایل می‌پرسد.'
    - c: 'del Old'
      d: 'اگر Old پوشه باشد: فایل‌های داخلش حذف می‌شوند (بعد از سؤال).'
      noTry: true
  mistakes:
    - 'فکر کردن اینکه فایل در Recycle Bin است.'
    - 'حذف در پوشه اشتباه؛ همیشه Prompt را نگاه کن.'
    - 'انتظار حذف پوشه با `del`؛ پوشه با `rd` حذف می‌شود (درس بعد).'
  tip: 'اگر فایل پیدا نشود، `del` می‌گوید `Could Not Find ...` و چیزی حذف نمی‌شود.'
  practice:
    - id: P24a
      start: 'C:\Users\Student\Downloads'
      task: 'فایل `temp1.tmp` را حذف کن.'
      checks: [{type: fileNotExists, path: 'C:\Users\Student\Downloads\temp1.tmp'}, {type: fileExists, path: 'C:\Users\Student\Downloads\temp2.tmp'}]
      hints: ['دستور حذف فایل سه حرف است.', '`del temp1.tmp`']
      answer: 'del temp1.tmp'
    - id: P24b
      start: 'C:\Users\Student'
      task: 'بدون رفتن به Downloads، فایل `photos.zip` داخل آن را حذف کن.'
      checks: [{type: fileNotExists, path: 'C:\Users\Student\Downloads\photos.zip'}, {type: cwd, value: 'C:\Users\Student'}]
      hints: ['از Path نسبی استفاده کن.', '`del Downloads\photos.zip`']
      answer: 'del Downloads\photos.zip'
  quiz:
    - kind: tf
      q: 'فایلی که با `del` حذف شود به Recycle Bin می‌رود.'
      answer: false
      explain: 'مستقیم حذف می‌شود.'
    - kind: mcq
      q: 'کدام Switch قبل از حذف هر فایل سؤال می‌پرسد؟'
      options: ['/p', '/q', '/s', '/f']
      answer: 0
      code_options: true
      explain: '`/p` = Prompt. `/q` برعکس، بی‌صدا حذف می‌کند.'
    - kind: predict
      q: 'فایل `x.txt` وجود ندارد. خروجی چیست؟'
      code: 'del x.txt'
      options: ['Could Not Find C:\...\x.txt', 'File deleted.', 'Access is denied.', 'هیچ']
      answer: 0
      explain: '`del` می‌گوید فایل را پیدا نکرد.'
    - kind: sim
      q: 'فایل `draft.tmp` را از `Documents\Work` حذف کن؛ گزارش‌ها باید بمانند.'
      start: 'C:\Users\Student\Documents'
      checks: [{type: fileNotExists, path: 'C:\Users\Student\Documents\Work\draft.tmp'}, {type: fileExists, path: 'C:\Users\Student\Documents\Work\report.txt'}]
      answer: 'del Work\draft.tmp'
      explain: 'Path نسبی از Documents: `Work\draft.tmp`.'
  recap: '`del فایل` = حذف بدون Recycle Bin. `/p` می‌پرسد، `/q` نمی‌پرسد. پوشه را حذف نمی‌کند.'

- n: 25
  term: rmdir
  fullForm: 'Remove Directory (rd)'
  difficulty: 1
  objective: 'پوشه خالی و پوشه پر را حذف کنی و تفاوت `/s` و `/q` را بدانی.'
  summary: '`rmdir` (یا `rd`) پوشه را حذف می‌کند. بدون Switch فقط پوشه خالی حذف می‌شود.'
  meaning: '`/s` پوشه را با همه فایل‌ها و زیرپوشه‌هایش حذف می‌کند و قبلش می‌پرسد. `/q` یعنی نپرس.'
  usage: 'پاک کردن پوشه‌های قدیمی، موقت یا پروژه‌های تمام‌شده.'
  syntax: 'rd [/s] [/q] path'
  warning: '`rd /s /q` بدون هیچ سؤالی یک پوشه کامل را با همه محتوایش پاک می‌کند. هرگز آن را روی پوشه‌ای که مطمئن نیستی اجرا نکن.'
  demo:
    start: 'C:\Users\Student'
    cmds: ['mkdir Empty', 'rd Empty', 'rd Pictures']
  examples:
    - c: 'rd Empty'
      noTry: true
      d: 'حذف پوشه خالی.'
    - c: 'rd /s OldProject'
      d: 'حذف پوشه با همه محتوا؛ قبلش می‌پرسد `Are you sure (Y/N)?`'
      noTry: true
    - c: 'rd /s /q Temp'
      d: 'حذف بدون سؤال. خطرناک!'
      noTry: true
  mistakes:
    - 'حذف پوشه‌ای که الان داخلش هستی: اول با `cd ..` بیرون بیا.'
    - 'استفاده از `del` برای حذف پوشه.'
  tip: 'قبل از `rd /s` با `dir` یا `tree` ببین داخل پوشه چیست.'
  practice:
    - id: P25a
      start: 'C:\Users\Student'
      setup: {mkdir: ['C:\Users\Student\Empty']}
      task: 'یک پوشه خالی به نام `Empty` اینجا هست. آن را حذف کن.'
      checks: [{type: dirNotExists, path: 'C:\Users\Student\Empty'}]
      hints: ['دستور حذف پوشه `rd` یا `rmdir` است.', '`rd Empty`']
      answer: 'rd Empty'
    - id: P25b
      start: 'C:\Users\Student'
      task: 'پوشه `Pictures\Holidays` را با فایل داخلش حذف کن. (اگر سؤال پرسید، جواب بده.)'
      checks: [{type: dirNotExists, path: 'C:\Users\Student\Pictures\Holidays'}, {type: dirExists, path: 'C:\Users\Student\Pictures'}]
      inputs: ['y']
      hints: ['پوشه خالی نیست؛ یک Switch لازم داری.', '`rd /s Pictures\Holidays` و بعد `Y`']
      answer: 'rd /s Pictures\Holidays'
  quiz:
    - kind: predict
      q: 'پوشه `Work` دو فایل دارد. خروجی این دستور چیست؟'
      code: 'rd Work'
      options: ['The directory is not empty.', 'پوشه و فایل‌ها حذف می‌شوند', 'فقط فایل‌ها حذف می‌شوند', 'Are you sure (Y/N)?']
      answer: 0
      explain: 'بدون `/s` فقط پوشه خالی حذف می‌شود.'
    - kind: mcq
      q: 'کدام دستور بدون پرسیدن، پوشه را با همه محتوایش حذف می‌کند؟'
      options: ['rd /s /q Temp', 'rd Temp', 'rd /s Temp', 'del Temp']
      answer: 0
      code_options: true
      explain: '`/s` همه محتوا، `/q` بدون سؤال.'
    - kind: tf
      q: '`rd` و `rmdir` یک دستورند.'
      answer: true
      explain: '`rd` شکل کوتاه است.'
  recap: '`rd پوشه` = حذف پوشه خالی. `/s` = با محتوا. `/q` = بدون سؤال. اول ببین، بعد حذف کن.'

- n: 26
  term: '*'
  fullForm: 'Wildcard: any characters'
  difficulty: 2
  objective: 'با `*` یک گروه از فایل‌ها را با هم انتخاب کنی.'
  summary: '`*` یعنی «هر تعداد کاراکتر، حتی هیچ». `*.jpg` یعنی همه فایل‌هایی که با `.jpg` تمام می‌شوند.'
  meaning: 'Wildcard را می‌شود با `dir`، `copy`، `move`، `del` و `ren` استفاده کرد. `report*` یعنی هر چیزی که با report شروع شود. `*.*` یعنی همه فایل‌ها.'
  usage: 'کار با چند فایل هم‌نوع با یک دستور: کپی همه عکس‌ها، حذف همه فایل‌های موقت.'
  syntax: "dir *.jpg\ncopy *.txt D:\\Backup\ndel *.tmp"
