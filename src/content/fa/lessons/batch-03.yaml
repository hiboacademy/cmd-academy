- n: 30
  term: '2>'
  fullForm: 'stdout (1) · stderr (2)'
  difficulty: 2
  objective: 'پیام‌های خطا را جدا از خروجی عادی ذخیره یا پنهان کنی.'
  summary: 'CMD دو جریان خروجی دارد: شماره 1 خروجی عادی (stdout) و شماره 2 پیام‌های خطا (stderr). `2>` فقط پیام‌های خطا را به فایل می‌برد.'
  meaning: '`>` همان `1>` است. `2>nul` خطاها را پنهان می‌کند. `2>&1` یعنی «خطاها را هم همان جایی بفرست که خروجی عادی می‌رود».'
  usage: 'ثبت خطاها در فایل جدا، پنهان کردن پیام خطای بی‌اهمیت، ذخیره همه چیز در یک فایل.'
  syntax: "command 2> errors.txt\ncommand > all.txt 2>&1\ncommand 2>nul"
  demo:
    start: 'C:\Users\Student\Desktop'
    cmds: ['type missing.txt', 'type missing.txt 2> error.txt', 'type error.txt', 'type missing.txt 2>nul']
  examples:
    - c: 'type missing.txt 2> error.txt'
      d: 'پیام خطا به جای صفحه در فایل.'
    - c: 'dir C:\nothing 2>nul'
      d: 'پنهان کردن خطا.'
    - c: 'dir Documents nothing > all.txt 2>&1'
      d: 'خروجی و خطا هر دو در یک فایل.'
    - c: 'type menu.txt > out.txt 2> err.txt'
      d: 'خروجی عادی و خطا در دو فایل جدا.'
  mistakes:
    - 'فاصله بین 2 و `>`: `2 >` یعنی Argument «2» و بعد `>`؛ باید `2>` باشد.'
    - 'نوشتن `2>&1` قبل از `>`: ترتیب مهم است؛ اول `> file` بعد `2>&1`.'
  tip: '`>nul 2>&1` یعنی «هیچ چیزی نشان نده»؛ در Batch بسیار رایج است.'
  practice:
    - id: P30a
      start: 'C:\Users\Student\Desktop'
      task: 'دستور `type missing.txt` خطا می‌دهد. آن را طوری اجرا کن که پیام خطا در فایل `error.txt` ذخیره شود.'
      checks: [{type: fileContains, path: 'C:\Users\Student\Desktop\error.txt', value: 'cannot find'}, {type: usedOp, value: '2>'}]
      hints: ['پیام خطا جریان شماره 2 است.', '`type missing.txt 2> error.txt`']
      answer: 'type missing.txt 2> error.txt'
    - id: P30b
      start: 'C:\Users\Student'
      task: 'دستور `dir Documents\nothing` را اجرا کن و هم خروجی عادی و هم خطا را در فایل `all.txt` ذخیره کن.'
