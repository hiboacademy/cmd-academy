      checks: [{type: lastOutputIncludes, value: 'File not found'}, {type: usedOp, value: '||'}]
      hints: ['علامت «فقط اگر شکست خورد» دو `|` است.', '`type nofile.txt || echo File not found`']
      answer: 'type nofile.txt || echo File not found'
  quiz:
    - kind: predict
      q: 'فایل `a.txt` وجود ندارد. چه چیزی چاپ می‌شود؟'
      code: 'type a.txt && echo YES || echo NO'
      options: ['پیام خطا و بعد NO', 'YES', 'YES و NO', 'فقط پیام خطا']
      answer: 0
      explain: '`type` شکست خورد، پس `echo YES` اجرا نشد و `|| echo NO` اجرا شد.'
    - kind: mcq
      q: 'کدام علامت دستور دوم را همیشه اجرا می‌کند؟'
      options: ['&', '&&', '||', '|']
      answer: 0
      code_options: true
      explain: '`&` شرط ندارد.'
    - kind: tf
      q: 'در `mkdir X && cd X`، اگر پوشه X از قبل باشد، `cd X` اجرا نمی‌شود.'
      answer: true
      explain: '`mkdir` خطا داد (already exists)، پس `&&` دستور دوم را اجرا نکرد.'
  recap: '`&` همیشه، `&&` اگر موفق، `||` اگر شکست. قبل از کارهای خطرناک از `&&` استفاده کن.'

