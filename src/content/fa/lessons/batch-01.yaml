- n: 1
  term: CMD
  fullForm: 'Command Prompt (cmd.exe)'
  difficulty: 1
  objective: 'بفهمی CMD چیست و اولین Command خودت را اجرا کنی.'
  summary: 'CMD برنامه‌ای در Windows است که به‌جای کلیک کردن، با نوشتن دستور با کامپیوتر کار می‌کنی.'
  meaning: 'خط فرمان ویندوز؛ پنجره‌ای که دستور (Command) را می‌گیرد، اجرا می‌کند و نتیجه را نشان می‌دهد.'
  usage: 'کار سریع با فایل‌ها، دیدن اطلاعات سیستم و شبکه، عیب‌یابی و خودکار کردن کارهای تکراری.'
  terminal:
    - {p: 'C:\Users\Student>', c: 'ver'}
    - {o: ''}
    - {o: 'Microsoft Windows [Version 10.0.22631.4317]'}
  tip: 'CMD به بزرگی و کوچکی حروف حساس نیست؛ `DIR` و `dir` یکی‌اند.'
  daily: 'کلیک کردن مثل انتخاب غذا از روی عکس منو است. CMD مثل این است که دقیق بگویی چه می‌خواهی؛ سریع‌تر و دقیق‌تر، اگر زبانش را بلد باشی.'
  restaurant: 'CMD مثل گارسون است: تو سفارش (Command) را می‌گویی، او آن را به آشپزخانه (Windows) می‌برد و نتیجه را برایت می‌آورد.'
  examples:
    - c: 'ver'
      d: 'نسخه Windows را نشان می‌دهد.'
    - c: 'VER'
      d: 'همان نتیجه؛ بزرگی و کوچکی حروف مهم نیست.'
  mistakes:
    - 'تایپ کردن دستور در File Explorer یا مرورگر به‌جای پنجره CMD.'
    - 'ترس از خراب شدن سیستم: دستورهای خواندنی مثل `ver` هیچ چیزی را تغییر نمی‌دهند.'
  practice:
    - id: P1a
      start: 'C:\Users\Student'
      task: 'اولین Command زندگی‌ات را بنویس: نسخه Windows را نمایش بده.'
      checks: [{type: cmd, value: ver}, {type: ok}]
      hints:
        - 'می‌خواهی Windows نسخه (Version) خودش را به تو بگوید. Command این کار، کوتاه‌شده همین کلمه انگلیسی Version است.'
        - 'فقط یک کلمه لازم است: سه حرف اول Version. آن را بنویس و بعد Enter بزن تا CMD اجرایش کند.'
      answer: 'ver'
      explain: '`ver` کوتاه‌شده Version است. این Command به چیز دیگری نیاز ندارد و فقط نسخه Windows را چاپ می‌کند.'
  quiz:
    - kind: mcq
      q: 'CMD در Windows برای چیست؟'
      options: ['کار با کامپیوتر از طریق نوشتن دستور', 'ویرایش عکس', 'مرور اینترنت', 'پخش موسیقی']
      answer: 0
      explain: 'در CMD به‌جای کلیک، دستور می‌نویسی.'
    - kind: tf
      q: 'در CMD، دستور `DIR` با `dir` فرق دارد.'
      answer: false
      explain: 'CMD به بزرگی و کوچکی حروف حساس نیست.'
    - kind: type
      q: 'دستوری بنویس که نسخه Windows را نشان دهد.'
      accept: ['ver']
      explain: '`ver` کوتاه‌شده Version است.'
  recap: 'CMD = کار با Windows از راه نوشتن دستور. هر دستور را بنویس و Enter بزن.'

- n: 2
  term: 'Terminal · Shell'
  fullForm: 'Command Line Interface (CLI)'
  difficulty: 1
  objective: 'فرق Terminal، Shell و Command Line را بدانی.'
  summary: 'Command Line یعنی کار با نوشتن دستور. Terminal پنجره‌ای است که در آن تایپ می‌کنی. Shell برنامه‌ای است که دستور را می‌فهمد و اجرا می‌کند.'
  meaning: 'Terminal = پنجره. Shell = مغزی که دستور را اجرا می‌کند. در Windows، `CMD` و `PowerShell` دو Shell هستند و Windows Terminal پنجره‌ای است که هر دو را نشان می‌دهد.'
  usage: 'وقتی بدانی کدام بخش چه کاری می‌کند، راحت‌تر می‌فهمی چرا یک دستور در CMD کار می‌کند ولی در PowerShell یا Linux نه.'
  terminal:
    - {p: 'C:\Users\Student>', c: 'echo Hello'}
    - {o: 'Hello'}
  tip: 'در Windows 11 معمولاً CMD داخل Windows Terminal باز می‌شود. ظاهر فرق دارد ولی دستورها همان‌اند.'
  restaurant: 'Terminal میز و منوی رستوران است؛ جایی که سفارش می‌دهی. Shell گارسونی است که سفارش را می‌فهمد. Windows آشپزخانه‌ای است که کار اصلی را انجام می‌دهد.'
  examples:
    - c: 'echo Hello'
      d: 'Shell متن Hello را چاپ می‌کند.'
    - c: 'echo CMD Academy'
      d: 'هر متنی بعد از `echo` نمایش داده می‌شود.'
  mistakes:
    - 'یکی دانستن CMD و PowerShell: هر دو Shell هستند، ولی همه دستورهایشان یکی نیست.'
    - 'اجرای دستورهای Linux مثل `ls` در CMD.'
  practice:
    - id: P2a
      start: 'C:\Users\Student'
      task: 'به Shell بگو کلمه Hello را چاپ کند. برای چاپ متن از دستور `echo` استفاده کن.'
      checks: [{type: cmd, value: echo}, {type: argIncludes, value: hello}]
      hints:
        - 'برای اینکه Shell متنی را روی صفحه چاپ کند، از `echo` استفاده کن. متنی که می‌خواهی دیده شود را بعد از آن می‌نویسی.'
        - 'دو بخش: چه کاری؟ (`echo`، یعنی «چاپ کن») چه چیزی؟ (کلمه Hello). این دو با یک Space از هم جدا می‌شوند.'
      answer: 'echo Hello'
      explain: '`echo` به Shell می‌گوید «چاپ کن» و هر چیزی که بعدش بیاید، اینجا `Hello`، همان‌طور روی صفحه نمایش داده می‌شود.'
  quiz:
    - kind: mcq
      q: 'کدام گزینه یک Shell است؟'
      options: ['CMD', 'Monitor', 'Keyboard', 'File Explorer']
      answer: 0
      explain: 'CMD دستور را می‌فهمد و اجرا می‌کند، پس Shell است.'
    - kind: mcq
      q: 'Terminal چیست؟'
      options: ['پنجره‌ای که در آن دستور تایپ می‌کنی', 'یک نوع فایل', 'یک Drive', 'یک ویروس']
      answer: 0
      explain: 'Terminal رابط نمایشی است؛ Shell داخل آن کار می‌کند.'
    - kind: tf
      q: 'PowerShell هم یک Shell است.'
      answer: true
      explain: 'PowerShell یک Shell دیگر در Windows است که بعداً در CMD Academy به آن می‌رسیم.'
  recap: 'Terminal = پنجره. Shell = اجراکننده دستور. CMD یک Shell در Windows است.'

- n: 3
  term: 'Win + R'
  fullForm: 'Run · cmd · Enter'
  difficulty: 1
  objective: 'CMD را باز کنی و بفهمی Prompt چیست.'
  summary: 'ساده‌ترین راه باز کردن CMD سه قدم دارد. وقتی CMD باز شد، خطی مثل `C:\Users\Student>` می‌بینی. این خط Prompt نام دارد و یعنی CMD آماده است تا دستور تو را بگیرد.'
  steps:
    - 'کلیدهای `Win` و `R` را با هم بزن. پنجره کوچکی به نام Run باز می‌شود.'
    - 'در پنجره Run بنویس: `cmd`'
    - 'کلید `Enter` را بزن.'
    - 'پنجره Command Prompt باز می‌شود و Prompt را می‌بینی: `C:\Users\Student>`'
  meaning: 'Prompt دو چیز به تو می‌گوید: ۱) CMD آماده است و منتظر دستور توست. ۲) الان در کدام پوشه هستی؛ اینجا پوشه `C:\Users\Student`. علامت `>` آخر Prompt یعنی «از اینجا بنویس».'
  usage: 'راه‌های دیگر باز کردن CMD: منوی Start را باز کن، `cmd` را تایپ کن و Enter بزن؛ یا در نوار آدرس File Explorer بنویس `cmd` تا CMD در همان پوشه باز شود.'
  terminal:
    - {o: 'Microsoft Windows [Version 10.0.22631.4317]'}
    - {o: '(c) Microsoft Corporation. All rights reserved.'}
    - {o: ''}
    - {p: 'C:\Users\Student>', c: ''}
  tip: 'Prompt جزو دستور نیست و آن را تایپ نمی‌کنی؛ CMD خودش آن را نشان می‌دهد. تو فقط بعد از علامت `>` می‌نویسی.'
  daily: 'Prompt مثل چراغ «آماده» روی دستگاه کارت‌خوان است: وقتی روشن است، یعنی دستگاه منتظر توست.'
  restaurant: 'باز کردن CMD مثل نشستن پشت میز رستوران است و Prompt مثل گارسونی که کنار میز ایستاده و می‌پرسد: «چه سفارشی دارید؟»'
  examples:
    - c: 'ver'
      d: 'بعد از Prompt یک دستور بنویس، مثلاً `ver` از درس ۱، و Enter بزن. CMD جواب را چاپ می‌کند و دوباره Prompt را نشان می‌دهد.'
  mistakes:
    - 'تایپ کردن خود Prompt قبل از دستور، مثل `C:\Users\Student>ver`. فقط `ver` را بنویس.'
    - 'نوشتن `cmd` در نوار جست‌وجوی مرورگر به‌جای پنجره Run.'
  practice:
    - id: P3a
      start: 'C:\Users\Student'
      task: 'CMD باز است و Prompt (`C:\Users\Student>`) آماده است. بعد از Prompt، دستور `ver` را که در درس ۱ دیدی بنویس و Enter بزن. خود Prompt را تایپ نکن.'
      checks: [{type: cmd, value: ver}, {type: ok}]
      hints:
        - 'Prompt را CMD خودش نشان می‌دهد. تو فقط دستور را بعد از علامت `>` می‌نویسی.'
        - 'فقط سه حرف دستوری را که نسخه Windows را نشان می‌دهد (کوتاه‌شده Version) تایپ کن، بدون `C:\Users\Student>`، و بعد Enter بزن.'
      answer: 'ver'
      explain: 'CMD منتظر دستور بود (Prompt آماده بود). تو فقط دستور `ver` را نوشتی و CMD نسخه Windows را نشان داد.'
  quiz:
    - kind: mcq
      q: 'کدام کلید میانبر پنجره Run را باز می‌کند؟'
      options: ['Win + R', 'Ctrl + C', 'Alt + F4', 'Win + D']
      answer: 0
      explain: 'Win + R پنجره Run را باز می‌کند؛ بعد `cmd` را می‌نویسی و Enter می‌زنی.'
    - kind: tf
      q: 'باید عبارت `C:\Users\Student>` را هم خودت تایپ کنی.'
      answer: false
      explain: 'این Prompt است و CMD خودش آن را نمایش می‌دهد. تو فقط بعد از `>` می‌نویسی.'
    - kind: mcq
      q: 'در پنجره Run چه بنویسیم تا CMD باز شود؟'
      options: ['cmd', 'run', 'open', 'start']
      answer: 0
      code_options: true
      explain: 'نام برنامه `cmd` است.'
    - kind: order
      q: 'قدم‌های باز کردن CMD را به ترتیب بچین.'
      items: ['Win + R', 'cmd', 'Enter']
      explain: 'اول پنجره Run با Win + R، بعد نوشتن `cmd`، در آخر Enter.'
    - kind: mcq
      q: 'Prompt (مثل `C:\Users\Student>`) یعنی چه؟'
      options: ['CMD آماده است تا دستور بگیرد', 'یک پیام خطا', 'دستوری که باید تایپ کنی', 'نام فایلی که باز شده']
      answer: 0
      explain: 'Prompt یعنی CMD منتظر دستور توست و نشان می‌دهد در کدام پوشه هستی.'
  recap: 'باز کردن CMD در سه قدم: قدم ۱ `Win + R`، قدم ۲ `cmd`، قدم ۳ `Enter`. Prompt یعنی CMD آماده است؛ تو فقط بعد از `>` می‌نویسی.'

- n: 4
  term: 'dir Pictures /w'
  fullForm: 'Command · Argument · Switch'
  difficulty: 1
  objective: 'سه بخش یک دستور را بشناسی: Command، Argument و Switch.'
  summary: 'بیشتر دستورهای CMD از چند بخش ساخته می‌شوند که با Space از هم جدا می‌شوند: Command (چه کاری)، Argument یا Target (روی چه چیزی) و Switch (چطور). همه دستورها همه بخش‌ها را ندارند.'
  anatomy:
    cmd: 'dir Pictures /w'
    parts:
      - {t: 'dir', role: command, d: 'Command: کاری که CMD باید انجام دهد. `dir` یعنی «محتوای پوشه را فهرست کن».'}
      - {t: 'Pictures', role: argument, d: 'Argument / Target: چیزی که دستور روی آن کار می‌کند. اینجا پوشه Pictures.'}
      - {t: '/w', role: switch, d: 'Switch: گزینه‌ای که نحوه کار یا نمایش نتیجه را عوض می‌کند. `/w` یعنی فهرست فشرده در چند ستون (Wide).'}
  meaning: 'Switch یعنی گزینه‌ای که طرز کار یک دستور را تغییر می‌دهد. خود دستور همان کار را می‌کند، فقط نتیجه را جور دیگری انجام می‌دهد یا نشان می‌دهد. بیشتر Switchهای CMD با `/` شروع می‌شوند (مثل `/w` یا `/?`)، ولی بعضی دستورها Switch را با `-` می‌نویسند، مثل `ping -n 2`.'
  usage: 'وقتی ساختار را بشناسی، هر دستور جدید را راحت می‌خوانی و راهنمای Windows (`/?`) را می‌فهمی.'
  syntax: 'command [argument] [/switch]'
  terminal:
    - {p: 'C:\Users\Student>', c: 'dir Pictures /w'}
  tip: 'بین بخش‌ها Space لازم است. `dirPictures` یک کلمه ناشناخته است. با `/?` بعد از هر دستور، راهنمای آن را می‌بینی.'
  restaurant: '«قهوه بیار، بدون شکر». «بیار» Command است (چه کاری)، «قهوه» Argument (روی چه چیزی) و «بدون شکر» Switch (چطور).'
  examples:
    - c: 'dir'
      d: 'فقط Command: محتوای پوشه فعلی.'
    - c: 'dir Documents'
      d: 'Command + Argument: محتوای پوشه Documents.'
    - c: 'dir /w'
      d: 'Command + Switch: محتوای پوشه فعلی، فشرده.'
    - c: 'dir Documents /w'
      d: 'Command + Argument + Switch: محتوای Documents، فشرده.'
  mistakes:
    - 'چسباندن Argument به Command بدون Space، مثل `dirDocuments`.'
    - 'استفاده از `\` به‌جای `/` برای Switch، مثل `dir \w`.'
  practice:
    - id: P4a
      start: 'C:\Users\Student'
      task: 'محتوای پوشه Documents را به شکل فشرده (Wide) ببین.'
      checks: [{type: cmd, value: dir}, {type: argIncludes, value: documents}, {type: switch, value: '/w'}, {type: ok}]
      hints:
        - 'برای دیدن محتوای یک پوشه از `dir` استفاده کن. بعد نام پوشه را بنویس و در آخر Switchی را اضافه کن که نمایش را فشرده (Wide) می‌کند.'
        - 'سه سؤال، سه بخش: چه کاری؟ (`dir`) روی چه چیزی؟ (نام پوشه) چطور نمایش بدهد؟ (Switch حرف اول Wide با `/`). بینشان Space بگذار.'
      answer: 'dir Documents /w'
      explain: '`dir` کار را مشخص می‌کند (فهرست محتوا)، `Documents` می‌گوید کدام پوشه، و `/w` نتیجه را فشرده در چند ستون نشان می‌دهد.'
    - id: P4b
      start: 'C:\Users\Student'
      task: 'راهنمای دستور `cd` را ببین. Switch راهنما در CMD `/?` است.'
      checks: [{type: cmd, value: cd}, {type: switch, value: '/?'}]
      hints:
        - 'راهنما هم یک Switch است: Command را بنویس و Switch راهنما را بعدش اضافه کن.'
        - 'Command اینجا `cd` است و Switch از `/` و علامت سؤال ساخته می‌شود. بینشان یک Space بگذار.'
      answer: 'cd /?'
      explain: '`cd` Command است و `/?` Switchی که به‌جای اجرای دستور، راهنمای آن را نشان می‌دهد.'
  quiz:
    - kind: predict
      q: 'در این دستور کدام بخش Switch است؟'
      code: 'dir Pictures /w'
      options: ['/w', 'dir', 'Pictures', 'هیچ‌کدام']
      answer: 0
      code_options: true
      explain: '`/w` گزینه‌ای است که نحوه نمایش را عوض می‌کند، پس Switch است. `dir` Command و `Pictures` Argument است.'
    - kind: fix
      q: 'این دستور چه مشکلی دارد؟'
      code: 'dirPictures'
      options: ['بین Command و Argument فاصله نیست', 'Pictures باید بزرگ نوشته شود', 'Switch ندارد', 'مشکلی ندارد']
      answer: 0
      explain: 'CMD کل `dirPictures` را یک نام دستور ناشناخته می‌بیند.'
    - kind: tf
      q: 'در CMD، Switchها معمولاً با `/` شروع می‌شوند.'
      answer: true
      explain: 'بیشتر Switchها مثل `/w` یا `/?` با `/` شروع می‌شوند، ولی همیشه نه؛ مثلاً `ping` از `-n` استفاده می‌کند.'
    - kind: mcq
      q: 'در `dir Pictures /w`، بخش `Pictures` چه نقشی دارد؟'
      options: ['Argument (روی چه چیزی)', 'Command (چه کاری)', 'Switch (چطور)', 'Prompt']
      answer: 0
      explain: '`Pictures` چیزی است که `dir` روی آن کار می‌کند: Argument یا Target.'
  recap: 'Command = چه کاری، Argument = روی چه چیزی، Switch = چطور. مثال: `dir` + `Pictures` + `/w`.'

- n: 5
  term: 'File · Folder'
  fullForm: 'File · Folder (Directory)'
  difficulty: 1
  objective: 'فرق File و Folder و نقش Extension را بدانی.'
  summary: 'File یک سند، عکس یا برنامه است. Folder جعبه‌ای است که File و Folderهای دیگر را نگه می‌دارد.'
  meaning: 'نام File معمولاً دو بخش دارد: نام و Extension، مثل `report.txt`. در خروجی `dir`، پوشه‌ها با `<DIR>` مشخص می‌شوند.'
  usage: 'تقریباً همه کارهای CMD با File و Folder است: دیدن، ساختن، کپی، جابه‌جا کردن و حذف.'
  terminal:
    - {p: 'C:\Users\Student\Documents>', c: 'dir'}
    - {o: '09/28/2026  10:15 AM    <DIR>          Work'}
    - {o: '10/01/2026  06:40 PM                80 menu.txt'}
    - {o: '10/01/2026  06:40 PM                55 todo.txt'}
  tip: 'Extension نوع File را نشان می‌دهد: `.txt` متن، `.jpg` عکس، `.mp3` صدا، `.exe` برنامه.'
  daily: 'کمد لباس: هر کشو یک Folder است و هر لباس یک File. کشو می‌تواند کشوی کوچک‌تری هم داخلش داشته باشد.'
  restaurant: 'در آشپزخانه، قفسه‌ها Folder هستند و ظرف‌های مواد File. برچسب روی ظرف (شکر، نمک) مثل Extension است: می‌گوید داخلش چه نوع چیزی است.'
  examples:
    - c: 'dir'
      d: 'پوشه‌ها با `<DIR>` و فایل‌ها با اندازه نمایش داده می‌شوند.'
    - c: 'dir *.txt'
      d: 'فقط فایل‌های با Extension متنی.'
  mistakes:
    - 'جا انداختن Extension در نام فایل، مثل `type notes` به‌جای `type notes.txt`.'
    - 'تصور اینکه تغییر Extension نوع واقعی فایل را عوض می‌کند.'
  practice:
