- n: 4
  term: 'command  argument  /switch'
  fullForm: 'Command · Argument · Switch'
  summary: 'هر Command سه بخش دارد: نام دستور، Argument (روی چه چیزی) و Switch (چطور). بین بخش‌ها Space می‌گذاریم.'
  meaning: 'Command: کاری که می‌خواهی انجام شود. Argument: روی چه فایل یا پوشه‌ای. Switch: تنظیم نحوه انجام کار؛ در CMD با `/` شروع می‌شود.'
  usage: 'وقتی ساختار را بشناسی، هر دستور جدید را راحت می‌خوانی و راهنمای Windows را می‌فهمی.'
  syntax: 'command [argument] [/switch]'
  terminal:
    - {p: 'C:\Users\Student>', c: 'dir Documents /w'}
  tip: 'بین بخش‌ها Space لازم است. `dirDocuments` یک کلمه ناشناخته است. با `/?` بعد از هر دستور، راهنمای آن را می‌بینی.'
  restaurant: '«قهوه بیار، بدون شکر». «بیار» Command است، «قهوه» Argument (چه چیزی) و «بدون شکر» Switch (چطور).'
  practice:
    - id: P4a
      start: 'C:\Users\Student'
      task: 'محتوای پوشه Documents را به شکل فشرده ببین. Command: `dir`، Argument: `Documents`، Switch: `/w`'
      checks: [{type: cmd, value: dir}, {type: argIncludes, value: documents}, {type: switch, value: '/w'}, {type: ok}]
      hints:
        - 'سه بخش را به ترتیب بنویس و بینشان Space بگذار.'
        - 'اول `dir`، بعد نام پوشه، بعد Switch.'
      answer: 'dir Documents /w'
    - id: P4b
      start: 'C:\Users\Student'
      task: 'راهنمای دستور `cd` را ببین. (Switch راهنما `/?` است.)'
      checks: [{type: cmd, value: cd}, {type: switch, value: '/?'}]
      hints:
        - 'نام دستور، یک Space، بعد Switch راهنما.'
        - 'Switch راهنما از `/` و علامت سؤال درست شده است.'
      answer: 'cd /?'
  quiz:
    - kind: predict
      q: 'در این دستور کدام بخش Switch است؟'
      code: 'dir Pictures /w'
      options: ['/w', 'dir', 'Pictures', 'هیچ‌کدام']
      answer: 0
      code_options: true
      explain: 'Switch با `/` شروع می‌شود.'
    - kind: fix
      q: 'این دستور چه مشکلی دارد؟'
      code: 'dirPictures'
      options: ['بین Command و Argument فاصله نیست', 'Pictures باید بزرگ نوشته شود', 'Switch ندارد', 'مشکلی ندارد']
      answer: 0
      explain: 'CMD کل `dirPictures` را یک نام دستور ناشناخته می‌بیند.'
    - kind: tf
      q: 'در CMD، Switchها معمولاً با `/` شروع می‌شوند.'
      answer: true
      explain: 'مثل `/w` یا `/?`'

- n: 5
  term: 'File · Folder'
  fullForm: 'File · Folder (Directory)'
  summary: 'File یک سند، عکس یا برنامه است. Folder جعبه‌ای است که File و Folderهای دیگر را نگه می‌دارد.'
  meaning: 'نام File معمولاً دو بخش دارد: نام و Extension، مثل `report.txt`. در خروجی `dir`، پوشه‌ها با `<DIR>` مشخص می‌شوند.'
  usage: 'تقریباً همه کارهای CMD با File و Folder است: دیدن، ساختن، کپی، جابه‌جا کردن و حذف.'
  terminal:
    - {p: 'C:\Users\Student\Documents>', c: 'dir'}
    - {o: '09/28/2026  10:15 AM    <DIR>          Work'}
    - {o: '10/01/2026  06:40 PM                80 menu.txt'}
    - {o: '10/01/2026  06:40 PM                55 todo.txt'}
  tip: 'Extension نوع File را نشان می‌دهد: `.txt` متن، `.jpg` عکس، `.mp3` صدا، `.exe` برنامه.'
  daily: 'کمد لباس: هر کشو یک Folder است و هر لباس یک File. کشو می‌تواند کشوی کوچک‌تری هم داخلش داشته باشد.'
  restaurant: 'در آشپزخانه، قفسه‌ها Folder هستند و ظرف‌های مواد File. برچسب روی ظرف (شکر، نمک) مثل Extension است: می‌گوید داخلش چه نوع چیزی است.'
  practice:
    - id: P5a
      start: 'C:\Users\Student\Documents'
      task: 'داخل Documents هستی. ببین چه File و Folderهایی اینجاست.'
      checks: [{type: cmd, value: dir}, {type: ok}, {type: cwd, value: 'C:\Users\Student\Documents'}]
      hints:
        - 'دستوری که در درس‌های قبل برای دیدن محتوا دیدی.'
        - 'سه حرف: Directory'
      answer: 'dir'
    - id: P5b
      start: 'C:\Users\Student\Documents'
      task: 'محتوای فایل `todo.txt` را نمایش بده. (دستور `type` محتوای فایل متنی را نشان می‌دهد.)'
      checks: [{type: cmd, value: type}, {type: argIncludes, value: todo.txt}, {type: ok}]
      hints:
        - 'نام دستور، Space، بعد نام کامل فایل همراه Extension.'
        - 'شکل کلی: `type` و بعد نام فایل.'
      answer: 'type todo.txt'
  quiz:
    - kind: mcq
      q: 'در خروجی `dir`، عبارت `<DIR>` یعنی چه؟'
      options: ['این مورد یک Folder است', 'فایل خراب است', 'فایل مخفی است', 'این یک Drive است']
      answer: 0
      explain: '`<DIR>` یعنی Directory، همان Folder.'
    - kind: mcq
      q: 'Extension فایل `song.mp3` کدام است؟'
      options: ['.mp3', 'song', 'song.mp3', 'mp']
      answer: 0
      code_options: true
      explain: 'بخش بعد از آخرین نقطه، Extension است.'
    - kind: predict
      q: 'در این خروجی چند Folder هست؟'
      code: "<DIR>          Work\n<DIR>          Photos\n          80 menu.txt"
      options: ['2', '1', '3', '0']
      answer: 0
      explain: 'دو خط `<DIR>` دارند: Work و Photos.'

