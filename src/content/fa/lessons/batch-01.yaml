  summary: 'سه راه ساده برای باز کردن CMD وجود دارد. وقتی باز شد، خطی مثل `C:\Users\Student>` می‌بینی که یعنی CMD آماده دستور است.'
  meaning: 'روش ۱: منوی Start ← تایپ `cmd` ← Enter. روش ۲: کلید Win + R ← تایپ `cmd` ← Enter. روش ۳: در نوار آدرس File Explorer بنویس `cmd` تا CMD در همان پوشه باز شود.'
  usage: 'خط `C:\Users\Student>` را Prompt می‌گویند. Prompt نشان می‌دهد الان کجا هستی و CMD منتظر دستور توست.'
  terminal:
    - {o: 'Microsoft Windows [Version 10.0.22631.4317]'}
    - {o: '(c) Microsoft Corporation. All rights reserved.'}
    - {o: ''}
    - {p: 'C:\Users\Student>', c: ''}
  tip: 'Prompt جزو دستور نیست. فقط بعد از علامت `>` تایپ کن.'
  daily: 'Prompt مثل چراغ «آماده» روی دستگاه کارت‌خوان است: تا روشن نباشد، کارت نکش.'
  practice:
