- n: 1
  term: CMD
  fullForm: 'Command Prompt (cmd.exe)'
  summary: 'CMD برنامه‌ای در Windows است که به‌جای کلیک کردن، با نوشتن دستور با کامپیوتر کار می‌کنی.'
  meaning: 'خط فرمان ویندوز؛ پنجره‌ای که دستور (Command) را می‌گیرد، اجرا می‌کند و نتیجه را نشان می‌دهد.'
  usage: 'کار سریع با فایل‌ها، دیدن اطلاعات سیستم و شبکه، عیب‌یابی و خودکار کردن کارهای تکراری.'
  terminal:
    - {p: 'C:\Users\Student>', c: 'ver'}
    - {o: ''}
    - {o: 'Microsoft Windows [Version 10.0.22631.4317]'}
  tip: 'CMD به بزرگی و کوچکی حروف حساس نیست؛ `DIR` و `dir` یکی‌اند.'
  daily: 'کلیک کردن مثل انتخاب غذا از روی عکس منو است. CMD مثل این است که دقیق بگویی چه می‌خواهی؛ سریع‌تر و دقیق‌تر، اگر زبانش را بلد باشی.'
  restaurant: 'CMD مثل گارسون است: تو سفارش (Command) را می‌گویی، او آن را به آشپزخانه (Windows) می‌برد و نتیجه را برایت می‌آورد.'
  practice:
    - id: P1a
      start: 'C:\Users\Student'
      task: 'اولین Command زندگی‌ات را بنویس: نسخه Windows را نمایش بده.'
      checks: [{type: cmd, value: ver}, {type: ok}]
      hints:
        - 'Command موردنظر کوتاه‌شده کلمه Version است.'
        - 'سه حرف اول Version را بنویس و Enter بزن.'
      answer: 'ver'
  quiz:
    - kind: mcq
      q: 'CMD در Windows برای چیست؟'
      options: ['کار با کامپیوتر از طریق نوشتن دستور', 'ویرایش عکس', 'مرور اینترنت', 'پخش موسیقی']
      answer: 0
      explain: 'در CMD به‌جای کلیک، دستور می‌نویسی.'
    - kind: tf
      q: 'در CMD، دستور `DIR` با `dir` فرق دارد.'
      answer: false
      explain: 'CMD به بزرگی و کوچکی حروف حساس نیست.'
    - kind: type
      q: 'دستوری بنویس که نسخه Windows را نشان دهد.'
      accept: ['ver']
      explain: '`ver` کوتاه‌شده Version است.'

- n: 2
  term: 'Terminal · Shell'
  fullForm: 'Command Line Interface (CLI)'
  summary: 'Command Line یعنی کار با نوشتن دستور. Terminal پنجره‌ای است که در آن تایپ می‌کنی. Shell برنامه‌ای است که دستور را می‌فهمد و اجرا می‌کند.'
  meaning: 'Terminal = پنجره. Shell = مغزی که دستور را اجرا می‌کند. در Windows، `CMD` و `PowerShell` دو Shell هستند و Windows Terminal پنجره‌ای است که هر دو را نشان می‌دهد.'
  usage: 'وقتی بدانی کدام بخش چه کاری می‌کند، راحت‌تر می‌فهمی چرا یک دستور در CMD کار می‌کند ولی در PowerShell یا Linux نه.'
  terminal:
    - {p: 'C:\Users\Student>', c: 'echo Hello'}
    - {o: 'Hello'}
  tip: 'در Windows 11 معمولاً CMD داخل Windows Terminal باز می‌شود. ظاهر فرق دارد ولی دستورها همان‌اند.'
  restaurant: 'Terminal میز و منوی رستوران است؛ جایی که سفارش می‌دهی. Shell گارسونی است که سفارش را می‌فهمد. Windows آشپزخانه‌ای است که کار اصلی را انجام می‌دهد.'
  practice:
    - id: P2a
      start: 'C:\Users\Student'
      task: 'به Shell بگو کلمه Hello را چاپ کند. برای چاپ متن از دستور `echo` استفاده کن.'
      checks: [{type: cmd, value: echo}, {type: argIncludes, value: hello}]
      hints:
        - 'اول نام دستور، بعد یک Space، بعد متنی که می‌خواهی نمایش داده شود.'
        - 'شکل کلی: `echo` و بعد متن.'
      answer: 'echo Hello'
  quiz:
    - kind: mcq
      q: 'کدام گزینه یک Shell است؟'
      options: ['CMD', 'Monitor', 'Keyboard', 'File Explorer']
      answer: 0
      explain: 'CMD دستور را می‌فهمد و اجرا می‌کند، پس Shell است.'
    - kind: mcq
      q: 'Terminal چیست؟'
      options: ['پنجره‌ای که در آن دستور تایپ می‌کنی', 'یک نوع فایل', 'یک Drive', 'یک ویروس']
      answer: 0
      explain: 'Terminal رابط نمایشی است؛ Shell داخل آن کار می‌کند.'
    - kind: tf
      q: 'PowerShell هم یک Shell است.'
      answer: true
      explain: 'PowerShell یک Shell دیگر در Windows است که بعداً در CMD Academy به آن می‌رسیم.'

