  difficulty: 3
  objective: 'با robocopy پوشه‌ها را مطمئن و هوشمند کپی کنی و خطر `/mir` را بشناسی.'
  summary: '`robocopy` ابزار حرفه‌ای کپی پوشه است: فقط فایل‌های جدید یا تغییرکرده را کپی می‌کند، گزارش کامل می‌دهد و در صورت قطع شدن ادامه می‌دهد.'
  meaning: 'Syntax آن فرق دارد: اول پوشه مبدأ، بعد پوشه مقصد، بعد (اختیاری) الگوی فایل‌ها. `/e` زیرپوشه‌ها، `/mir` مقصد را آینه مبدأ می‌کند، `/l` فقط فهرست را نشان می‌دهد.'
  usage: 'Backup منظم، همگام‌سازی پوشه‌ها، انتقال حجم زیاد فایل.'
  syntax: 'robocopy source destination [files] [/e] [/mir] [/l]'
  warning: '`/mir` هر فایلی را که در مبدأ نیست از مقصد حذف می‌کند. اگر مبدأ و مقصد را جابه‌جا بنویسی، Backup ممکن است پاک شود.'
  demo:
    start: 'C:\Users\Student'
    cmds: ['robocopy Documents D:\Sync /e']
  examples:
    - c: 'robocopy Documents D:\Sync /e'
      d: 'کپی پوشه با زیرپوشه‌ها.'
    - c: 'robocopy Documents D:\Sync *.txt'
      d: 'فقط فایل‌های txt.'
    - c: 'robocopy Documents D:\Sync /e /l'
      d: 'فقط نشان بده چه چیزی کپی می‌شد.'
    - c: 'robocopy Documents D:\Mirror /mir'
      d: 'آینه کامل (خطرناک).'
      noTry: true
  mistakes:
    - 'دادن نام فایل به‌عنوان مبدأ؛ robocopy همیشه پوشه می‌گیرد.'
    - 'فکر کردن اینکه Exit Code 1 یعنی خطا؛ در robocopy یعنی «فایل کپی شد».'
  tip: 'اجرای دوباره همان دستور، فایل‌هایی را که تغییر نکرده‌اند Skip می‌کند؛ برای Backup روزانه عالی است.'
  practice:
    - id: P44a
      start: 'C:\Users\Student'
      task: 'با robocopy کل پوشه Pictures را همراه با زیرپوشه‌ها به `E:\PicBackup` کپی کن.'
      checks: [{type: fileExists, path: 'E:\PicBackup\beach.jpg'}, {type: fileExists, path: 'E:\PicBackup\Holidays\family.jpg'}]
      hints: ['ترتیب: robocopy مبدأ مقصد Switch.', '`robocopy Pictures E:\PicBackup /e`']
      answer: 'robocopy Pictures E:\PicBackup /e'
    - id: P44b
      start: 'C:\Users\Student'
      task: 'فقط ببین robocopy برای کپی Documents به `D:\Test` چه فایل‌هایی را کپی می‌کرد، بدون اینکه واقعاً کپی کند.'
      checks: [{type: anyCmd, value: robocopy, evenIfFailed: true}, {type: switch, value: '/l', cmd: robocopy, anyRun: true}, {type: fileNotExists, path: 'D:\Test\menu.txt'}, {type: lastOutputIncludes, value: 'menu.txt'}]
      hints: ['Switch «فقط فهرست» در robocopy `/l` است.', '`robocopy Documents D:\Test /l`']
      answer: 'robocopy Documents D:\Test /l'
  quiz:
    - kind: mcq
      q: 'Exit Code برابر 1 بعد از robocopy یعنی چه؟'
      options: ['فایل‌ها با موفقیت کپی شدند', 'خطا رخ داد', 'هیچ فایلی نبود', 'دسترسی رد شد']
      answer: 0
      explain: 'در robocopy کدهای 0 تا 7 موفقیت‌اند؛ 8 و بیشتر یعنی خطا.'
    - kind: mcq
      q: 'کدام Switch مقصد را دقیقاً شبیه مبدأ می‌کند و فایل‌های اضافه را حذف می‌کند؟'
      options: ['/mir', '/e', '/l', '/s']
      answer: 0
      code_options: true
      explain: '`/mir` = Mirror؛ با احتیاط.'
    - kind: fix
      q: 'این دستور کار نمی‌کند. چرا؟'
      code: 'robocopy menu.txt D:\Backup'
      options: ['مبدأ باید پوشه باشد و نام فایل بعد از مقصد بیاید', 'باید `/mir` بگذاری', 'D:\Backup باید وجود نداشته باشد', 'robocopy فایل txt را کپی نمی‌کند']
      answer: 0
      explain: 'درست: `robocopy . D:\Backup menu.txt`'
  recap: '`robocopy مبدأ مقصد [فایل‌ها]`. `/e` زیرپوشه‌ها، `/l` آزمایشی، `/mir` آینه (خطرناک). Exit Code کمتر از 8 = موفق.'
