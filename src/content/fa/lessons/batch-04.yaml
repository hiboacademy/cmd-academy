- n: 40
  term: where
  fullForm: 'Where (locate files)'
  difficulty: 2
  objective: 'محل یک برنامه را پیدا کنی و فایل‌ها را در زیرپوشه‌ها جستجو کنی.'
  summary: '`where` می‌گوید یک برنامه کجا نصب است. با `/r` در یک پوشه و همه زیرپوشه‌هایش فایل پیدا می‌کند.'
  meaning: 'بدون `/r`، `where` در پوشه فعلی و پوشه‌های PATH (درس ۴۸) می‌گردد؛ همان جاهایی که CMD برای اجرای برنامه نگاه می‌کند. Wildcard هم قبول می‌کند.'
  usage: 'فهمیدن اینکه `ping` یا `notepad` از کجا اجرا می‌شود، پیدا کردن همه عکس‌ها یا فایل‌های یک نوع.'
  syntax: "where name\nwhere /r folder pattern"
  demo:
    start: 'C:\Users\Student'
    cmds: ['where notepad', 'where /r C:\Users\Student *.jpg', 'where nothing']
  examples:
    - c: 'where ping'
      d: 'محل فایل ping.exe.'
    - c: 'where /r C:\Users\Student *.jpg'
      d: 'همه jpgهای پوشه کاربر و زیرپوشه‌ها.'
    - c: 'dir /s /b *.jpg'
      d: 'راه دیگر: dir با `/s` (زیرپوشه‌ها) و `/b`.'
  mistakes:
    - 'فراموش کردن `/r` برای جستجو در زیرپوشه‌ها.'
  tip: 'اگر چیزی پیدا نشود، پیام `INFO: Could not find files...` می‌آید و Exit Code برابر 1 است.'
  practice:
    - id: P40a
      start: 'C:\Users\Student'
      task: 'پیدا کن برنامه `ping` کجا نصب شده است.'
      checks: [{type: anyCmd, value: where}, {type: lastOutputIncludes, value: 'C:\Windows\System32\ping.exe'}]
      hints: ['دستوری که «کجا» را جواب می‌دهد.', '`where ping`']
      answer: 'where ping'
    - id: P40b
      start: 'C:\Users\Student'
      task: 'همه فایل‌های `.jpg` را در `C:\Users\Student` و همه زیرپوشه‌هایش پیدا کن.'
      checks: [{type: lastOutputIncludes, value: 'family.jpg'}, {type: lastOutputIncludes, value: 'sea.jpg'}, {type: lastOutputIncludes, value: 'cat.jpg'}]
      hints: ['`where` با `/r` در زیرپوشه‌ها می‌گردد (یا `dir /s /b`).', '`where /r C:\Users\Student *.jpg`']
      answer: 'where /r C:\Users\Student *.jpg'
  quiz:
    - kind: mcq
      q: 'Switch `/r` در `where` چه کار می‌کند؟'
      options: ['جستجو در پوشه و همه زیرپوشه‌ها', 'حذف فایل‌های پیدا شده', 'نمایش اندازه فایل', 'جستجو فقط در PATH']
      answer: 0
      explain: '`/r` = Recursive.'
    - kind: type
      q: 'محل برنامه `notepad` را پیدا کن.'
      accept: ['where notepad', 'where notepad.exe']
      explain: '`where notepad`'
    - kind: tf
      q: '`dir /s /b *.jpg` هم می‌تواند jpgهای زیرپوشه‌ها را پیدا کند.'
      answer: true
      explain: '`/s` در dir یعنی زیرپوشه‌ها.'
  recap: '`where برنامه` = محل برنامه. `where /r پوشه الگو` = جستجو در زیرپوشه‌ها.'

- n: 41
  term: attrib
  fullForm: 'Attributes'
  difficulty: 2
  objective: 'ویژگی‌های فایل مثل مخفی و فقط‌خواندنی را ببینی و تغییر دهی.'
  summary: 'هر فایل چند ویژگی (Attribute) دارد: `H` مخفی، `R` فقط‌خواندنی، `S` فایل سیستمی و `A` آماده Backup. `attrib` آن‌ها را نشان می‌دهد و با `+` و `-` تغییر می‌دهد.'
  meaning: 'فایل مخفی در `dir` معمولی دیده نمی‌شود؛ `dir /a` همه فایل‌ها را نشان می‌دهد. فایل Read-only را نمی‌شود تغییر داد یا با `del` معمولی حذف کرد.'
  usage: 'پیدا کردن فایل‌های مخفی، محافظت از فایل مهم با `+r`، و مشکلاتی مثل ویروس‌هایی که فایل‌های USB را مخفی می‌کنند.'
  syntax: 'attrib [+r|-r] [+h|-h] [+s|-s] [file]'
  demo:
    start: 'C:\Users\Student\Documents'
    cmds: ['dir /b', 'dir /a /b', 'attrib secret.txt']
  examples:
    - c: 'dir /a'
      d: 'نمایش همه فایل‌ها، از جمله مخفی‌ها.'
    - c: 'attrib'
      d: 'نمایش Attribute فایل‌های پوشه فعلی.'
    - c: 'attrib +r guests.txt'
      d: 'فقط‌خواندنی کردن فایل.'
    - c: 'attrib -h secret.txt'
      d: 'خارج کردن فایل از حالت مخفی.'
  mistakes:
    - 'فکر کردن اینکه فایل مخفی امن است؛ هر کسی با `dir /a` آن را می‌بیند.'
    - 'تغییر Attribute فایل‌های سیستمی (`S`) در `C:\Windows`.'
  tip: 'اگر USB بعد از ویروس خالی به نظر می‌رسد، اول `dir /a` بزن؛ شاید فایل‌ها فقط مخفی شده‌اند.'
  practice:
    - id: P41a
      start: 'C:\Users\Student\Documents'
      task: 'در این پوشه یک فایل مخفی هست. همه فایل‌ها، از جمله مخفی‌ها را نمایش بده.'
      checks: [{type: anyCmd, value: dir}, {type: lastOutputIncludes, value: 'secret.txt'}]
      hints: ['`dir` یک Switch برای نمایش همه Attributeها دارد.', '`dir /a`']
      answer: 'dir /a'
    - id: P41b
      start: 'C:\Users\Student\Documents'
      task: 'فایل `guests.txt` را فقط‌خواندنی (Read-only) کن.'
      checks: [{type: fileAttr, path: 'C:\Users\Student\Documents\guests.txt', attr: r}]
      hints: ['`+` یک Attribute را اضافه می‌کند. حرف Read-only چیست؟', '`attrib +r guests.txt`']
      answer: 'attrib +r guests.txt'
  quiz:
    - kind: mcq
      q: 'Attribute `H` یعنی چه؟'
      options: ['Hidden (مخفی)', 'Home', 'Hard disk', 'Help']
      answer: 0
      explain: 'H = Hidden.'
    - kind: predict
      q: 'فایل `a.txt` Read-only است. نتیجه این دستور؟'
      code: 'del a.txt'
      options: ['Access is denied.', 'فایل حذف می‌شود', 'Could Not Find', 'Are you sure (Y/N)?']
      answer: 0
      explain: 'فایل Read-only با `del` معمولی حذف نمی‌شود (مگر با `/f`).'
    - kind: type
      q: 'فایل `notes.txt` را از حالت مخفی خارج کن.'
      accept: ['attrib -h notes.txt']
      explain: '`-` یک Attribute را برمی‌دارد.'
  recap: '`attrib` = دیدن و تغییر ویژگی‌ها. `+` اضافه، `-` حذف. `dir /a` فایل‌های مخفی را نشان می‌دهد.'

- n: 42
  term: fc
  fullForm: 'File Compare'
  difficulty: 2
  objective: 'دو فایل را مقایسه کنی و تفاوت‌ها را پیدا کنی.'
  summary: '`fc` دو فایل را خط‌به‌خط مقایسه می‌کند و جاهایی را که فرق دارند نشان می‌دهد.'
  meaning: 'اگر فایل‌ها یکی باشند پیام `FC: no differences encountered` می‌آید. وگرنه، بخش متفاوت هر فایل بین خطوط `*****` نمایش داده می‌شود. `/c` بزرگی حروف را نادیده می‌گیرد و `/n` شماره خط را نشان می‌دهد.'
  usage: 'فهمیدن اینکه چه چیزی در یک فایل تنظیمات عوض شده، یا اینکه Backup با اصل یکی است.'
  syntax: 'fc [/c] [/n] file1 file2'
  demo:
    start: 'C:\Users\Student\Desktop'
    files:
      - {path: 'C:\Users\Student\Desktop\menu_old.txt', content: "Pizza 8.00\nPasta 7.00\nSalad 5.50\n"}
      - {path: 'C:\Users\Student\Desktop\menu_new.txt', content: "Pizza 8.50\nPasta 7.00\nSalad 5.50\n"}
    cmds: ['fc menu_old.txt menu_new.txt', 'fc menu_new.txt menu_new.txt']
  examples:
    - c: 'fc menu_old.txt menu_new.txt'
      d: 'نمایش خطوط متفاوت.'
    - c: 'fc /n a.txt b.txt'
      d: 'با شماره خط.'
    - c: 'fc /c a.txt b.txt'
      d: 'بدون توجه به حروف بزرگ و کوچک.'
  mistakes:
    - 'مقایسه فایل‌های غیرمتنی و انتظار خروجی قابل خواندن.'
  tip: 'Exit Code `fc`: صفر یعنی یکسان، 1 یعنی متفاوت. در Batch برای بررسی Backup مفید است.'
  practice:
    - id: P42a
      start: 'C:\Users\Student\Desktop'
      files:
        - {path: 'C:\Users\Student\Desktop\menu_old.txt', content: "Pizza 8.00\nPasta 7.00\nSalad 5.50\n"}
        - {path: 'C:\Users\Student\Desktop\menu_new.txt', content: "Pizza 8.50\nPasta 7.00\nSalad 5.50\n"}
      task: 'دو فایل `menu_old.txt` و `menu_new.txt` را مقایسه کن و ببین قیمت کدام غذا عوض شده است.'
      checks: [{type: anyCmd, value: fc, evenIfFailed: true}, {type: lastOutputIncludes, value: '8.50'}, {type: lastOutputIncludes, value: '*****'}]
      hints: ['دستور مقایسه دو حرف است.', '`fc menu_old.txt menu_new.txt`']
      answer: 'fc menu_old.txt menu_new.txt'
    - id: P42b
      start: 'C:\Users\Student\Desktop'
      files:
        - {path: 'C:\Users\Student\Desktop\a.txt', content: "Hello CMD\n"}
        - {path: 'C:\Users\Student\Desktop\b.txt', content: "HELLO cmd\n"}
      task: '`a.txt` و `b.txt` را بدون توجه به حروف بزرگ و کوچک مقایسه کن. (باید یکسان شناخته شوند.)'
      checks: [{type: switch, value: '/c', cmd: fc, anyRun: true}, {type: lastOutputIncludes, value: 'no differences'}]
      hints: ['یک Switch بزرگی حروف را نادیده می‌گیرد.', '`fc /c a.txt b.txt`']
      answer: 'fc /c a.txt b.txt'
  quiz:
    - kind: mcq
      q: 'اگر دو فایل یکسان باشند، `fc` چه می‌گوید؟'
      options: ['FC: no differences encountered', 'Files are equal', '*****', 'هیچ']
      answer: 0
      explain: 'پیام استاندارد fc.'
    - kind: mcq
      q: 'کدام Switch شماره خطوط را نشان می‌دهد؟'
      options: ['/n', '/c', '/l', '/b']
      answer: 0
      code_options: true
      explain: '`/n` = Number.'
    - kind: tf
      q: 'Exit Code برابر 0 بعد از `fc` یعنی فایل‌ها یکسان‌اند.'
      answer: true
      explain: '0 یکسان، 1 متفاوت.'
  recap: '`fc فایل۱ فایل۲` = مقایسه. `/c` حروف، `/n` شماره خط. Exit Code 0 یعنی یکسان.'

- n: 43
  term: xcopy
  fullForm: 'Extended Copy'
  difficulty: 2
  objective: 'یک پوشه را همراه با زیرپوشه‌ها کپی کنی.'
  summary: '`xcopy` مثل `copy` است ولی پوشه‌ها و زیرپوشه‌ها را هم کپی می‌کند. مهم‌ترین Switchها: `/s`، `/e`، `/i` و `/y`.'
  meaning: '`/s` زیرپوشه‌های غیرخالی را کپی می‌کند و `/e` حتی خالی‌ها را. `/i` می‌گوید اگر مقصد وجود ندارد، آن را پوشه فرض کن (وگرنه xcopy می‌پرسد «File یا Directory؟»). `/y` بدون سؤال جایگزین می‌کند.'
  usage: 'Backup گرفتن از یک پوشه کامل، کپی پروژه به USB.'
  syntax: 'xcopy source destination [/s] [/e] [/i] [/y] [/h]'
  demo:
    start: 'C:\Users\Student'
    cmds: ['xcopy Documents D:\DocsBackup /e /i', 'tree D:\DocsBackup /f']
  examples:
    - c: 'xcopy Documents D:\DocsBackup /e /i'
      d: 'کپی کامل Documents با زیرپوشه‌ها.'
    - c: 'xcopy *.txt E:\Texts /i'
      d: 'کپی همه txtها به پوشه جدید روی USB.'
    - c: 'xcopy Documents D:\DocsBackup /s /y'
      d: 'به‌روزرسانی Backup بدون سؤال.'
    - c: 'xcopy Documents E:\Docs /e /i /l'
      d: '`/l` فقط فهرست را نشان می‌دهد، چیزی کپی نمی‌کند.'
  mistakes:
    - 'فراموش کردن `/s` یا `/e`: زیرپوشه‌ها کپی نمی‌شوند.'
    - 'تعجب از سؤال `F = file, D = directory`: با `/i` یا جواب `D` حل می‌شود.'
  tip: 'فایل‌های مخفی کپی نمی‌شوند مگر با `/h`.'
  practice:
    - id: P43a
      start: 'C:\Users\Student'
      task: 'کل پوشه Documents را همراه با زیرپوشه‌ها به `D:\DocsBackup` کپی کن.'
      inputs: ['d']
      checks: [{type: fileExists, path: 'D:\DocsBackup\menu.txt'}, {type: fileExists, path: 'D:\DocsBackup\Work\report.txt'}]
      hints: ['`copy` زیرپوشه‌ها را کپی نمی‌کند؛ از `xcopy` استفاده کن.', '`xcopy Documents D:\DocsBackup /e /i`']
      answer: 'xcopy Documents D:\DocsBackup /e /i'
  quiz:
    - kind: mcq
      q: 'تفاوت `/s` و `/e` در xcopy چیست؟'
      options: ['`/e` پوشه‌های خالی را هم کپی می‌کند', '`/s` سریع‌تر است', '`/e` فقط فایل‌ها را کپی می‌کند', 'فرقی ندارند']
      answer: 0
      explain: '`/s` پوشه‌های خالی را جا می‌اندازد.'
    - kind: predict
      q: 'مقصد `D:\New` وجود ندارد. xcopy بدون `/i` چه می‌کند؟'
      code: 'xcopy Documents D:\New /s'
      options: ['می‌پرسد مقصد فایل است یا پوشه', 'خطا می‌دهد و متوقف می‌شود', 'بی‌صدا پوشه می‌سازد', 'همه را در یک فایل می‌ریزد']
      answer: 0
      explain: 'سؤال `(F = file, D = directory)?` را می‌پرسد.'
    - kind: type
      q: 'پوشه `Pictures` را با همه زیرپوشه‌ها به `E:\Pics` کپی کن، بدون سؤال درباره فایل یا پوشه.'
      accept: ['xcopy pictures e:\pics /e /i', 'xcopy pictures e:\pics /s /i', 'xcopy pictures e:\pics /e /i /y', 'xcopy pictures e:\pics /i /e', 'xcopy pictures e:\pics /i /s']
      show: 'xcopy Pictures E:\Pics /e /i'
      explain: '`/e` زیرپوشه‌ها، `/i` مقصد پوشه است.'
  recap: '`xcopy` = کپی پوشه‌ها. `/s` یا `/e` زیرپوشه‌ها، `/i` مقصد پوشه، `/y` بدون سؤال، `/h` فایل مخفی.'

