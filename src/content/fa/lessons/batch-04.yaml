# Lessons 33–44 · Chapter 6: pipes, text, search and copying folders

- n: 33
  term: '|'
  fullForm: 'Pipe'
  difficulty: 2
  objective: 'خروجی یک دستور را مستقیم به ورودی دستور دیگر بدهی.'
  summary: '`|` خروجی دستور سمت چپ را به‌جای صفحه، به ورودی دستور سمت راست می‌فرستد. مثل لوله‌ای که دو دستور را به هم وصل می‌کند.'
  meaning: 'در `type menu.txt | find "Pizza"`، اول `type` همه خطوط را بیرون می‌دهد؛ این خطوط روی صفحه نمی‌آیند، بلکه وارد `find` می‌شوند و `find` فقط خطی را که Pizza دارد نشان می‌دهد. چرا کار می‌کند؟ چون `find` وقتی نام فایل نگیرد، ورودی‌اش را از Pipe می‌خواند.'
  usage: 'فیلتر کردن خروجی‌های طولانی: پیدا کردن IP در `ipconfig`، پیدا کردن یک برنامه در `tasklist`، مرتب کردن فهرست‌ها.'
  syntax: 'command1 | command2'
  demo:
    start: 'C:\Users\Student\Documents'
    cmds: ['type menu.txt | find "Pizza"', 'ipconfig | find "IPv4"', 'dir /b | sort /r']
  examples:
    - c: 'type menu.txt | find "Pizza"'
      d: 'فقط خط Pizza از منو.'
    - c: 'dir | find ".txt"'
      d: 'فقط خط‌هایی از خروجی dir که `.txt` دارند.'
    - c: 'ipconfig | find "IPv4"'
      d: 'فقط آدرس IPv4.'
    - c: 'tasklist | find "chrome"'
      d: 'فقط Processهای Chrome.'
  mistakes:
    - 'اشتباه گرفتن `|` با `||` (درس ۳۱).'
    - 'گذاشتن دستوری که ورودی نمی‌خواند (مثل `dir`) در سمت راست Pipe.'
  tip: 'می‌توانی چند Pipe پشت‌سرهم بگذاری: `type guests.txt | sort | more`'
  restaurant: 'گارسون سفارش را مستقیم به آشپز می‌دهد، آشپز غذا را مستقیم به تزئین‌کننده. هیچ‌کس سفارش را روی میز نمی‌گذارد.'
  practice:
    - id: P33a
      start: 'C:\Users\Student\Documents'
      task: 'با `type` و یک Pipe، فقط خطی از `menu.txt` را نشان بده که `Pasta` دارد.'
      checks: [{type: usedOp, value: '|'}, {type: lastOutputIncludes, value: 'Pasta'}, {type: lastOutputExcludes, value: 'Pizza'}]
      hints: ['خروجی `type menu.txt` را به `find` بده.', '`type menu.txt | find "Pasta"`']
      answer: 'type menu.txt | find "Pasta"'
    - id: P33b
      start: 'C:\Users\Student'
      task: 'از خروجی `ipconfig` فقط خط `IPv4` را نمایش بده.'
      checks: [{type: usedOp, value: '|'}, {type: lastOutputIncludes, value: '192.168.1.24'}, {type: lastOutputExcludes, value: 'Subnet'}]
      hints: ['`ipconfig | find ...`', '`ipconfig | find "IPv4"`']
      answer: 'ipconfig | find "IPv4"'
  quiz:
    - kind: mcq
      q: 'در `A | B`، ورودی دستور B از کجا می‌آید؟'
      options: ['از خروجی A', 'از صفحه‌کلید', 'از یک فایل', 'از دستور قبلی در History']
      answer: 0
      explain: 'Pipe خروجی A را به ورودی B وصل می‌کند.'
    - kind: predict
      q: 'menu.txt شامل Pizza، Pasta و Salad است. خروجی چیست؟'
      code: 'type menu.txt | find "Sa"'
      options: ['فقط خط Salad', 'Pasta و Salad', 'همه خطوط', 'هیچ']
      answer: 0
      explain: '`find` به حروف بزرگ و کوچک حساس است؛ «Pasta» شامل «Sa» با S بزرگ نیست.'
    - kind: type
      q: 'از خروجی `tasklist` فقط خط‌های `notepad` را نشان بده.'
      accept: ['tasklist | find "notepad"', 'tasklist | find /i "notepad"', 'tasklist | findstr notepad', 'tasklist | findstr /i notepad', 'tasklist | find "notepad.exe"']
      show: 'tasklist | find "notepad"'
      explain: 'خروجی tasklist را به find بده.'
  recap: '`A | B` = خروجی A ورودی B می‌شود. برای فیلتر کردن خروجی‌های طولانی.'

- n: 34
  term: more
  fullForm: 'More (page by page)'
  difficulty: 2
  objective: 'خروجی‌های طولانی را صفحه‌به‌صفحه بخوانی.'
  summary: '`more` خروجی را یک صفحه نشان می‌دهد و منتظر می‌ماند. Space صفحه بعد، Enter یک خط بعد، Q خروج.'
  meaning: '`more` ورودی را یا از فایل می‌گیرد (`more file.txt`) یا از Pipe (`help | more`). در پایین صفحه `-- More --` و درصد خوانده‌شده را می‌بینی.'
  usage: 'خواندن راهنماهای بلند، Logها و خروجی دستورهایی مثل `systeminfo`.'
  syntax: "more file\ncommand | more"
  examples:
    - c: 'help | more'
      d: 'فهرست دستورها صفحه‌به‌صفحه.'
    - c: 'more C:\Windows\win.ini'
      d: 'نمایش یک فایل با more.'
    - c: 'systeminfo | more'
      d: 'خواندن اطلاعات سیستم با آرامش.'
  mistakes:
    - 'فکر کردن اینکه CMD قفل شده؛ `-- More --` منتظر کلید توست.'
  tip: 'در Simulator هم وقتی `-- More --` آمد، Space یا Enter بزن؛ برای خروج Q.'
  practice:
    - id: P34a
      start: 'C:\Users\Student'
      task: 'فهرست دستورهای `help` را صفحه‌به‌صفحه نمایش بده. (با Space ادامه بده یا با Q خارج شو.)'
      checks: [{type: anyCmd, value: more}, {type: usedOp, value: '|'}, {type: argIncludes, cmd: help, value: ''}]
      inputs: [' ', 'q']
      hints: ['خروجی `help` را با Pipe به `more` بده.', '`help | more`']
      answer: 'help | more'
  quiz:
    - kind: mcq
      q: 'در `-- More --` کدام کلید یک صفحه کامل جلو می‌رود؟'
      options: ['Space', 'Enter', 'Q', 'Esc']
      answer: 0
      explain: 'Space صفحه بعد، Enter فقط یک خط، Q خروج.'
    - kind: type
      q: 'فایل `log.txt` را صفحه‌به‌صفحه نمایش بده.'
      accept: ['more log.txt', 'type log.txt | more', 'more < log.txt']
      show: 'more log.txt'
      explain: '`more log.txt` یا `type log.txt | more`'
    - kind: tf
      q: '`more` محتوای فایل را تغییر می‌دهد.'
      answer: false
      explain: 'فقط نمایش می‌دهد.'
  recap: '`more` = صفحه‌به‌صفحه. Space صفحه، Enter خط، Q خروج.'

- n: 35
  term: sort
  fullForm: 'Sort'
  difficulty: 2
  objective: 'خطوط یک فایل یا خروجی یک دستور را به ترتیب الفبا مرتب کنی.'
  summary: '`sort` خطوط را از A تا Z مرتب می‌کند. با `/r` برعکس (Z تا A).'
  meaning: '`sort` به بزرگی و کوچکی حروف حساس نیست و فایل اصلی را تغییر نمی‌دهد؛ فقط خروجی مرتب‌شده را نشان می‌دهد. برای ذخیره از `>` یا `/o` استفاده کن.'
  usage: 'مرتب کردن فهرست نام‌ها، خروجی `dir /b`، یا داده‌هایی که از دستور دیگری می‌آید.'
  syntax: "sort [/r] [file] [/o outfile]\ncommand | sort"
  demo:
    start: 'C:\Users\Student\Documents'
    cmds: ['type guests.txt', 'sort guests.txt', 'sort /r guests.txt']
  examples:
    - c: 'sort guests.txt'
      d: 'نمایش مرتب‌شده.'
    - c: 'type guests.txt | sort'
      d: 'همان کار با Pipe.'
    - c: 'sort guests.txt > sorted.txt'
      d: 'ذخیره نتیجه در فایل جدید.'
    - c: 'dir /b | sort /r'
      d: 'فهرست فایل‌ها به ترتیب برعکس.'
  mistakes:
    - 'نوشتن `sort guests.txt > guests.txt`: فایل قبل از خوانده شدن خالی می‌شود! همیشه در فایل جدید بنویس.'
  tip: 'اعداد به‌صورت متن مرتب می‌شوند: `10` قبل از `9` می‌آید.'
  practice:
    - id: P35a
      start: 'C:\Users\Student\Documents'
      task: 'نام‌های داخل `guests.txt` را مرتب‌شده (A تا Z) نمایش بده.'
      checks: [{type: anyCmd, value: sort}, {type: outputOrder, value: ['Ali', 'David', 'hibo', 'mina', 'Reza', 'Sara']}]
      hints: ['دستور مرتب‌سازی `sort` است.', '`sort guests.txt`']
      answer: 'sort guests.txt'
    - id: P35b
      start: 'C:\Users\Student\Documents'
      task: 'نسخه مرتب‌شده `guests.txt` را در فایل جدید `sorted.txt` ذخیره کن.'
      checks: [{type: fileOrder, path: 'C:\Users\Student\Documents\sorted.txt', value: ['Ali', 'David', 'hibo', 'mina', 'Reza', 'Sara']}]
      hints: ['خروجی `sort` را با `>` به فایل ببر.', '`sort guests.txt > sorted.txt`']
      answer: 'sort guests.txt > sorted.txt'
  quiz:
    - kind: mcq
      q: 'کدام Switch ترتیب را برعکس می‌کند؟'
      options: ['/r', '/o', '/b', '/s']
      answer: 0
      code_options: true
      explain: '`/r` = Reverse.'
    - kind: predict
      q: 'خروجی این دستور با ورودی‌های `b`، `C`، `a` چیست؟'
      code: 'sort names.txt'
      options: ["a\nb\nC", "C\na\nb", "b\nC\na", "a\nC\nb"]
      answer: 0
      code_options: true
      explain: 'sort به بزرگی حروف حساس نیست.'
    - kind: tf
      q: '`sort guests.txt` فایل guests.txt را مرتب‌شده ذخیره می‌کند.'
      answer: false
      explain: 'فقط نمایش می‌دهد؛ برای ذخیره از `>` استفاده کن.'
  recap: '`sort فایل` یا `... | sort`. `/r` برعکس. فایل اصلی تغییر نمی‌کند.'

- n: 36
  term: '<'
  fullForm: 'Input redirection'
  difficulty: 2
  objective: 'ورودی یک دستور را از یک فایل بدهی.'
  summary: '`<` محتوای یک فایل را به‌جای صفحه‌کلید، به ورودی دستور می‌فرستد. برعکس `>` که خروجی را به فایل می‌برد.'
  meaning: '`sort < guests.txt` یعنی «guests.txt را به ورودی sort بده». نتیجه شبیه `type guests.txt | sort` است، ولی بدون اجرای دستور دوم.'
  usage: 'دادن فایل به دستورهایی که از ورودی می‌خوانند (sort، find، more)، و در Batch برای خواندن خط اول فایل با `set /p` (درس ۷۴).'
  syntax: "command < file\ncommand < input.txt > output.txt"
  demo:
    start: 'C:\Users\Student\Documents'
    cmds: ['sort < guests.txt', 'find "Soup" < menu.txt']
  examples:
    - c: 'sort < guests.txt'
      d: 'مرتب کردن محتوای فایل.'
    - c: 'find "Pizza" < menu.txt'
      d: 'جستجو در ورودی آمده از فایل.'
    - c: 'sort < guests.txt > sorted.txt'
      d: 'ورودی از یک فایل، خروجی به فایل دیگر.'
  mistakes:
    - 'برعکس نوشتن جهت: `sort > guests.txt` فایل را پاک می‌کند!'
  tip: 'جهت فلش را ببین: `<` به سمت دستور (ورودی)، `>` به سمت فایل (خروجی).'
  daily: '`>` مثل ریختن آب از لیوان در بطری است؛ `<` مثل ریختن آب از بطری در لیوان.'
  practice:
    - id: P36a
      start: 'C:\Users\Student\Documents'
      task: 'با `<` محتوای `guests.txt` را به `sort` بده تا نام‌ها مرتب‌شده نمایش داده شوند.'
      checks: [{type: usedOp, value: '<'}, {type: outputOrder, value: ['Ali', 'David', 'Sara']}]
      hints: ['دستور اول، بعد `<`، بعد نام فایل.', '`sort < guests.txt`']
      answer: 'sort < guests.txt'
    - id: P36b
      start: 'C:\Users\Student\Documents'
      task: 'با `find` و `<` خط `Soup` را در `menu.txt` پیدا کن.'
      checks: [{type: usedOp, value: '<'}, {type: anyCmd, value: find}, {type: lastOutputIncludes, value: 'Soup'}]
      hints: ['متن جستجو در `find` داخل Quotes است.', '`find "Soup" < menu.txt`']
      answer: 'find "Soup" < menu.txt'
  quiz:
    - kind: mcq
      q: 'در `sort < a.txt > b.txt` کدام فایل خوانده می‌شود؟'
      options: ['a.txt', 'b.txt', 'هر دو', 'هیچ‌کدام']
      answer: 0
      explain: '`<` ورودی و `>` خروجی است.'
    - kind: fix
      q: 'کاربر می‌خواست فایل را مرتب ببیند ولی فایلش خالی شد. چرا؟'
      code: 'sort > guests.txt'
      options: ['جهت فلش اشتباه است؛ باید `<` می‌نوشت', '`sort` فایل را پاک می‌کند', 'باید `/r` می‌گذاشت', 'باید `type` را اول می‌نوشت']
      answer: 0
      explain: '`>` فایل را برای نوشتن باز و خالی می‌کند.'
    - kind: type
      q: 'محتوای `names.txt` را با `<` به `sort` بده.'
      accept: ['sort < names.txt', 'sort <names.txt']
      show: 'sort < names.txt'
      explain: '`sort < names.txt`'
  recap: '`دستور < فایل` = ورودی از فایل. `<` ورودی، `>` خروجی، `|` اتصال دو دستور.'

- n: 37
  term: find
  fullForm: 'Find text'
  difficulty: 2
  objective: 'خطوط شامل یک متن را در فایل‌ها یا خروجی دستورها پیدا کنی.'
  summary: '`find "متن" فایل` همه خطوطی را که آن متن را دارند نشان می‌دهد. متن جستجو حتماً داخل Quotes است.'
  meaning: 'Switchهای مهم: `/i` بدون توجه به بزرگی حروف، `/c` فقط تعداد خطوط، `/n` شماره خط، `/v` خطوطی که آن متن را ندارند.'
  usage: 'جستجو در Log و فایل‌های متنی، و فیلتر کردن خروجی دستورها با Pipe.'
  syntax: 'find [/i] [/c] [/n] [/v] "text" [file...]'
  demo:
    start: 'C:\Users\Student\Documents'
    cmds: ['find "Pizza" menu.txt', 'find /c /i "a" guests.txt', 'find /n "S" guests.txt']
  examples:
    - c: 'find "Pizza" menu.txt'
      d: 'خط‌هایی که Pizza دارند.'
    - c: 'find /i "pizza" menu.txt'
      d: 'بدون توجه به حروف بزرگ و کوچک.'
    - c: 'find /c "a" guests.txt'
      d: 'فقط تعداد خطوطی که «a» دارند.'
    - c: 'find /v "a" menu.txt'
      d: 'خطوطی که «a» ندارند.'
  mistakes:
    - 'ننوشتن Quotes: `find Pizza menu.txt` خطای `Parameter format not correct` می‌دهد.'
    - 'فراموش کردن `/i` و پیدا نکردن «pizza» با p کوچک.'
  tip: 'Exit Code: اگر چیزی پیدا شود `0`، وگرنه `1`. پس `find ... && echo found` کار می‌کند (درس ۶۲).'
  practice:
    - id: P37a
      start: 'C:\Users\Student\Documents'
      task: 'بشمار در `guests.txt` چند خط حرف `a` دارند، بدون توجه به بزرگی و کوچکی حرف.'
      checks: [{type: anyCmd, value: find}, {type: switch, value: '/c', cmd: find, anyRun: true}, {type: switch, value: '/i', cmd: find, anyRun: true}, {type: lastOutputIncludes, value: ': 5'}]
      hints: ['دو Switch لازم است: یکی برای شمارش، یکی برای نادیده گرفتن بزرگی حروف.', '`find /c /i "a" guests.txt`']
      answer: 'find /c /i "a" guests.txt'
    - id: P37b
      start: 'C:\Users\Student\Documents'
      task: 'خطوطی از `menu.txt` را نشان بده که حرف `a` ندارند.'
      checks: [{type: switch, value: '/v', cmd: find, anyRun: true}, {type: lastOutputIncludes, value: 'Soup'}, {type: lastOutputExcludes, value: 'Pizza'}]
      hints: ['Switch «برعکس» در find کدام است؟', '`find /v "a" menu.txt`']
      answer: 'find /v "a" menu.txt'
  quiz:
    - kind: fix
      q: 'چرا این دستور خطا می‌دهد؟'
      code: "find Pizza menu.txt\nFIND: Parameter format not correct"
      options: ['متن جستجو Quotes ندارد', 'menu.txt وجود ندارد', 'باید `/i` بگذاری', '`find` روی فایل کار نمی‌کند']
      answer: 0
      explain: 'درست: `find "Pizza" menu.txt`'
    - kind: mcq
      q: 'کدام Switch فقط تعداد خطوط پیدا شده را نشان می‌دهد؟'
      options: ['/c', '/n', '/v', '/i']
      answer: 0
      code_options: true
      explain: '`/c` = Count.'
    - kind: type
      q: 'در `log.txt` خطوطی را پیدا کن که `error` دارند، بدون توجه به بزرگی حروف.'
      accept: ['find /i "error" log.txt', 'find "error" /i log.txt', 'findstr /i error log.txt', 'findstr /i "error" log.txt']
      show: 'find /i "error" log.txt'
      explain: '`/i` برای نادیده گرفتن بزرگی حروف.'
  recap: '`find "متن" فایل`. `/i` حروف، `/c` تعداد، `/n` شماره خط، `/v` برعکس. Quotes الزامی است.'

- n: 38
  term: findstr
  fullForm: 'Find String'
  difficulty: 2
  objective: 'با `findstr` چند کلمه را با هم، در چند فایل و حتی در زیرپوشه‌ها جستجو کنی.'
  summary: '`findstr` نسخه قوی‌تر `find` است: چند کلمه را با هم جستجو می‌کند، در زیرپوشه‌ها می‌گردد و الگوهای ساده (Regular Expression) را می‌فهمد.'
  meaning: '`findstr "Pizza Coffee" menu.txt` یعنی Pizza **یا** Coffee. برای یک عبارت کامل با فاصله از `/c:"..."` استفاده کن. `/s` یعنی زیرپوشه‌ها هم. `^` یعنی اول خط و `$` یعنی آخر خط.'
  usage: 'جستجو در کل یک پروژه، پیدا کردن فایل‌هایی که یک کلمه دارند، فیلترهای دقیق‌تر.'
  syntax: 'findstr [/i] [/s] [/n] [/m] [/c:"phrase"] "words" files'
  demo:
    start: 'C:\Users\Student\Documents'
    cmds: ['findstr "Pizza Coffee" menu.txt', 'findstr /s /i "sales" *.txt', 'findstr /m /s "Report" *.txt']
  examples:
    - c: 'findstr "Pizza Coffee" menu.txt'
      d: 'خطوطی که Pizza یا Coffee دارند.'
    - c: 'findstr /c:"Restaurant Menu" menu.txt'
      d: 'دقیقاً همین عبارت.'
    - c: 'findstr /s /i "sales" *.txt'
      d: 'جستجو در همه txtها، در این پوشه و زیرپوشه‌ها.'
    - c: 'findstr /m /s "Report" *.txt'
      d: 'فقط نام فایل‌هایی که Report دارند.'
    - c: 'findstr "^S" guests.txt'
      d: 'خطوطی که با S شروع می‌شوند.'
  mistakes:
    - 'فکر کردن اینکه `"a b"` یعنی عبارت «a b»؛ در findstr یعنی a یا b. برای عبارت از `/c:` استفاده کن.'
  tip: 'در findstr، `.` یعنی «هر کاراکتر». برای جستجوی خود نقطه بنویس `\.`'
  practice:
    - id: P38a
      start: 'C:\Users\Student\Documents'
      task: 'با یک دستور خطوطی از `menu.txt` را نشان بده که `Pizza` یا `Coffee` دارند.'
      checks: [{type: anyCmd, value: findstr}, {type: lastOutputIncludes, value: 'Pizza'}, {type: lastOutputIncludes, value: 'Coffee'}, {type: lastOutputExcludes, value: 'Pasta'}]
      hints: ['در findstr کلمه‌ها را با فاصله جدا کن.', '`findstr "Pizza Coffee" menu.txt`']
      answer: 'findstr "Pizza Coffee" menu.txt'
