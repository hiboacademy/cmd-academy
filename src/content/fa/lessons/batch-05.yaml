# Lessons 45–52 · Chapter 7: variables and system information

- n: 45
  term: set
  fullForm: 'Variables'
  difficulty: 2
  objective: 'متغیر بسازی، مقدارش را بخوانی و تغییر دهی یا حذفش کنی.'
  summary: 'Variable یک نام است که یک مقدار را نگه می‌دارد. با `set name=value` می‌سازی و با `%name%` استفاده می‌کنی.'
  meaning: 'CMD قبل از اجرای هر خط، `%name%` را با مقدار متغیر جایگزین می‌کند. `set` بدون Argument همه متغیرها را نشان می‌دهد. `set name=` (بدون مقدار) متغیر را حذف می‌کند.'
  usage: 'نگه داشتن مسیرها و مقدارهایی که چند بار لازم داری، و پایه کار با Batch Script.'
  syntax: "set name=value\necho %name%\nset name=\nset [prefix]"
  demo:
    cmds: ['set city=Vienna', 'echo I live in %city%', 'set ci', 'set city=', 'echo %city%']
  examples:
    - c: 'set city=Vienna'
      d: 'ساختن متغیر.'
    - c: 'echo %city%'
      d: 'استفاده از مقدار.'
    - c: 'set c'
      d: 'همه متغیرهایی که با c شروع می‌شوند.'
    - c: 'set "msg=Hello World"'
      d: 'Quote دور کل عبارت؛ امن‌ترین روش برای مقدار با فاصله.'
  mistakes:
    - 'فاصله قبل از `=`: `set city =Vienna` متغیری به نام «city » (با فاصله) می‌سازد و `%city%` کار نمی‌کند.'
    - 'فاصله بعد از `=`: `set city= Vienna` مقدار را « Vienna» با فاصله می‌کند.'
    - 'فراموش کردن `%`ها: `echo city` خود کلمه city را چاپ می‌کند.'
  tip: 'متغیرهایی که در یک پنجره CMD می‌سازی فقط تا بسته شدن همان پنجره باقی می‌مانند.'
  restaurant: 'متغیر مثل برچسب روی ظرف است: «سس امروز = قارچ». هر کسی بگوید «سس امروز»، می‌دانیم منظور قارچ است.'
  practice:
    - id: P45a
      start: 'C:\Users\Student'
      task: 'متغیری به نام `city` با مقدار `Vienna` بساز و بعد با `echo` مقدارش را چاپ کن.'
      multi: true
      checks: [{type: envEquals, name: city, value: Vienna}, {type: inputIncludes, value: '%city%'}, {type: lastOutputIncludes, value: 'Vienna'}]
      hints:
        - 'دو قدم: اول با `set` یک Variable بساز (نام، علامت `=`، مقدار)، بعد با `echo` مقدارش را چاپ کن. برای استفاده از مقدار، نام متغیر را بین دو `%` می‌گذاری.'
        - 'خط ۱: `set`، Space، بعد نام city و `=` و Vienna، همه چسبیده (دور `=` فاصله نگذار). خط ۲: `echo` و نام city بین دو علامت `%`.'
      answer: ['set city=Vienna', 'echo %city%']
      explain: '`set city=Vienna` متغیر `city` را با مقدار Vienna می‌سازد. در خط دوم، CMD قبل از اجرا `%city%` را با Vienna جایگزین می‌کند و `echo` آن را چاپ می‌کند.'
    - id: P45b
      start: 'C:\Users\Student'
      task: 'همه متغیرهایی را که نامشان با `user` شروع می‌شود نمایش بده.'
      checks: [{type: anyCmd, value: set}, {type: lastOutputIncludes, value: 'USERNAME='}, {type: lastOutputIncludes, value: 'USERPROFILE='}]
      hints:
        - '`set` اگر فقط ابتدای یک نام را بگیرد، همه متغیرهایی را نشان می‌دهد که نامشان با همان حروف شروع می‌شود.'
        - 'دو بخش: چه کاری؟ (`set`) چه پیشوندی؟ (حروف user). علامت `=` و `%` لازم نیست؛ اینجا چیزی نمی‌سازی، فقط نگاه می‌کنی.'
      answer: 'set user'
      explain: '`set user` همه متغیرهایی را که نامشان با `user` شروع می‌شود، مثل `USERNAME` و `USERPROFILE`، همراه مقدارشان نشان می‌دهد.'
  quiz:
    - kind: fix
      q: 'چرا `echo %food%` چیزی جز `%food%` چاپ نمی‌کند؟'
      code: "set food =Pizza\necho %food%"
      options: ['فاصله قبل از `=` جزو نام متغیر شده', 'باید `set /a` نوشت', 'متغیر باید با حروف بزرگ باشد', 'Pizza کلمه رزرو شده است']
      answer: 0
      explain: 'نام متغیر «food » شد. درست: `set food=Pizza`'
    - kind: predict
      q: 'خروجی چیست؟'
      code: "set x=5\nset x=7\necho %x%"
      options: ['7', '5', '57', '%x%']
      answer: 0
      explain: 'مقدار دوم جای اولی را می‌گیرد.'
    - kind: type
      q: 'متغیر `color` را حذف کن.'
      accept: ['set color=', 'set "color="']
      show: 'set color='
      explain: '`set name=` بدون مقدار.'
    - kind: sim
      q: 'متغیر `table` را با مقدار `12` بساز.'
      start: 'C:\Users\Student'
      checks: [{type: envEquals, name: table, value: '12'}]
      answer: 'set table=12'
      explain: 'دور `=` فاصله نگذار.'
  recap: '`set name=value` بدون فاصله دور `=`. `%name%` = مقدار. `set name=` = حذف. `set` = فهرست.'

- n: 46
  term: '%VAR%'
  fullForm: 'Environment Variables'
  difficulty: 2
  objective: 'متغیرهای آماده Windows را بشناسی و از آن‌ها در دستورها استفاده کنی.'
  summary: 'Windows خودش ده‌ها متغیر آماده دارد که اطلاعات سیستم را نگه می‌دارند، مثل `%COMPUTERNAME%`، `%OS%`، `%windir%` و `%DATE%`.'
  meaning: 'این‌ها Environment Variable هستند. بعضی‌ها مثل `%DATE%`، `%TIME%`، `%RANDOM%`، `%CD%` و `%ERRORLEVEL%` پویا هستند و هر بار مقدار جدیدی دارند. نام متغیرها به بزرگی حروف حساس نیست.'
  usage: 'نوشتن دستورهایی که روی هر کامپیوتری کار کنند، بدون اینکه مسیر یا نام را دستی بنویسی.'
  syntax: "echo %COMPUTERNAME%\ncd %windir%\necho %DATE% %TIME%"
  demo:
    cmds: ['echo %COMPUTERNAME%', 'echo %OS%', 'echo %windir%', 'echo %CD%', 'echo %RANDOM%']
  examples:
    - c: 'echo %COMPUTERNAME%'
      d: 'نام کامپیوتر.'
    - c: 'cd %windir%'
      d: 'رفتن به پوشه Windows، هر جا که نصب باشد.'
    - c: 'echo %DATE% %TIME%'
      d: 'تاریخ و ساعت فعلی.'
    - c: 'echo %RANDOM%'
      d: 'یک عدد تصادفی بین 0 و 32767.'
  mistakes:
    - 'نوشتن `$COMPUTERNAME` (سبک PowerShell یا Linux). در CMD: `%COMPUTERNAME%`'
    - 'جا انداختن `%` آخر.'
  tip: 'اگر متغیری وجود نداشته باشد، CMD خود متن `%NAME%` را دست‌نخورده چاپ می‌کند.'
  practice:
    - id: P46a
      start: 'C:\Users\Student'
      task: 'نام کامپیوتر را با یک Environment Variable چاپ کن.'
      checks: [{type: inputIncludes, value: '%computername%'}, {type: lastOutputIncludes, value: 'ACADEMY-PC'}]
      hints:
        - 'Windows نام کامپیوتر را در یک Environment Variable آماده نگه داشته. با `echo` مقدار آن را چاپ کن؛ نام متغیر COMPUTERNAME است.'
        - 'دو بخش: چه کاری؟ (`echo`) چه چیزی؟ (نام متغیر COMPUTERNAME بین دو `%`). بدون `%`، خود کلمه COMPUTERNAME چاپ می‌شود.'
      answer: 'echo %COMPUTERNAME%'
      explain: 'CMD قبل از اجرا `%COMPUTERNAME%` را با نام واقعی کامپیوتر (`ACADEMY-PC`) جایگزین می‌کند و `echo` آن را نمایش می‌دهد.'
    - id: P46b
      start: 'C:\Users\Student'
      task: 'با متغیر `%windir%` به پوشه Windows برو.'
      checks: [{type: cwd, value: 'C:\Windows'}, {type: inputIncludes, value: '%windir%'}]
      hints:
        - 'متغیر `%windir%` مسیر پوشه Windows را در خود دارد. می‌توانی آن را به‌جای Path به `cd` بدهی.'
        - 'دو بخش: چه کاری؟ (`cd`) به کجا؟ (به‌جای نوشتن مسیر، متغیر windir بین دو `%`).'
      answer: 'cd %windir%'
      explain: 'CMD اول `%windir%` را با `C:\Windows` جایگزین می‌کند و بعد `cd` تو را به همان پوشه می‌برد.'
  quiz:
    - kind: mcq
      q: 'کدام متغیر هر بار عدد متفاوتی می‌دهد؟'
      options: ['%RANDOM%', '%OS%', '%COMPUTERNAME%', '%windir%']
      answer: 0
      code_options: true
      explain: '`%RANDOM%` یک عدد تصادفی است.'
    - kind: tf
      q: '`%windir%` و `%WINDIR%` یک متغیرند.'
      answer: true
      explain: 'نام متغیرها به بزرگی حروف حساس نیست.'
    - kind: predict
      q: 'متغیر `ABC` وجود ندارد. خروجی چیست؟'
      code: 'echo %ABC%'
      options: ['%ABC%', 'خط خالی', 'ABC', 'خطا']
      answer: 0
      code_options: true
      explain: 'در خط فرمان، متغیر ناموجود دست‌نخورده چاپ می‌شود.'
  recap: 'Windows متغیرهای آماده دارد: `%COMPUTERNAME%` `%OS%` `%windir%` `%DATE%` `%TIME%` `%RANDOM%` `%CD%`.'

- n: 47
  term: '%USERPROFILE%'
  fullForm: '%USERNAME% · %USERPROFILE% · %TEMP%'
  difficulty: 2
  objective: 'با متغیرهای کاربر به پوشه‌های شخصی و Temp برسی.'
  summary: '`%USERNAME%` نام کاربر فعلی است، `%USERPROFILE%` پوشه شخصی او (مثل `C:\Users\Student`) و `%TEMP%` پوشه فایل‌های موقت.'
  meaning: 'چون این مسیرها روی هر کامپیوتر فرق دارند، Scriptهای حرفه‌ای همیشه از متغیر استفاده می‌کنند، نه از مسیر ثابت.'
  usage: 'رفتن سریع به پوشه کاربر، پاک کردن فایل‌های موقت، نوشتن Backup Script برای هر کاربری.'
  syntax: "cd %USERPROFILE%\ndir %TEMP%\necho Hello %USERNAME%"
  demo:
    start: 'C:\'
    cmds: ['echo Hello %USERNAME%', 'cd %USERPROFILE%', 'dir %TEMP% /b']
  examples:
    - c: 'cd %USERPROFILE%\Documents'
      d: 'رفتن به Documents کاربر فعلی.'
    - c: 'dir %TEMP%'
      d: 'دیدن فایل‌های موقت.'
    - c: 'copy notes.txt %USERPROFILE%\Desktop'
      noTry: true
      d: 'کپی به Desktop هر کاربری.'
  mistakes:
    - 'نوشتن مسیر ثابت `C:\Users\Ali` در Script؛ روی کامپیوتر دیگر کار نمی‌کند.'
  tip: 'اگر مسیر فاصله داشته باشد، کل آن را با متغیر داخل Quotes بگذار: `cd "%USERPROFILE%\My Files"`'
  practice:
    - id: P47a
      start: 'C:\'
      task: 'از `C:\` با متغیر `%USERPROFILE%` به پوشه شخصی کاربر برو.'
      checks: [{type: cwd, value: 'C:\Users\Student'}, {type: inputIncludes, value: '%userprofile%'}]
      hints:
        - 'متغیر `%USERPROFILE%` مسیر پوشه شخصی کاربر فعلی را نگه می‌دارد. آن را به‌عنوان مقصد به `cd` بده.'
        - 'دو بخش: چه کاری؟ (`cd`) به کجا؟ (متغیر USERPROFILE بین دو `%`). لازم نیست نام کاربر را بدانی.'
      answer: 'cd %USERPROFILE%'
      explain: '`%USERPROFILE%` به `C:\Users\Student` تبدیل می‌شود و `cd` تو را از `C:\` به همان پوشه شخصی می‌برد.'
    - id: P47b
      start: 'C:\Users\Student'
      task: 'محتوای پوشه فایل‌های موقت را با متغیر `%TEMP%` نمایش بده.'
      checks: [{type: inputIncludes, value: '%temp%'}, {type: lastOutputIncludes, value: 'log1.tmp'}]
      hints:
        - 'متغیر `%TEMP%` مسیر پوشه فایل‌های موقت را دارد. به‌جای تایپ کردن آن مسیر طولانی، متغیر را به `dir` بده.'
        - 'دو بخش: چه کاری؟ (`dir`) روی چه پوشه‌ای؟ (متغیر TEMP بین دو `%`).'
      answer: 'dir %TEMP%'
      explain: 'CMD `%TEMP%` را با مسیر پوشه موقت جایگزین می‌کند و `dir` محتوای آن، مثل `log1.tmp`، را فهرست می‌کند.'
  quiz:
    - kind: mcq
      q: 'روی کامپیوتری که کاربرش Sara است، `%USERPROFILE%` معمولاً چیست؟'
      options: ['C:\Users\Sara', 'C:\Sara', 'C:\Windows\Sara', 'Sara']
      answer: 0
      code_options: true
      explain: 'پوشه شخصی هر کاربر داخل `C:\Users` است.'
    - kind: type
      q: 'به Desktop کاربر فعلی برو (با متغیر).'
      accept: ['cd %userprofile%\desktop', 'cd "%userprofile%\desktop"', 'cd /d %userprofile%\desktop', 'cd /d "%userprofile%\desktop"']
      show: 'cd %USERPROFILE%\Desktop'
      explain: 'متغیر + `\Desktop`'
    - kind: tf
      q: 'استفاده از `%USERPROFILE%` در Script بهتر از نوشتن `C:\Users\Student` است.'
      answer: true
      explain: 'Script روی هر کامپیوتر و هر کاربری کار می‌کند.'
  recap: '`%USERNAME%` نام کاربر، `%USERPROFILE%` پوشه کاربر، `%TEMP%` پوشه موقت.'

- n: 48
  term: '%PATH%'
  fullForm: 'PATH'
  difficulty: 2
  objective: 'بفهمی CMD برنامه‌ها را از کجا پیدا می‌کند و چطور یک پوشه را به PATH اضافه کنی.'
  summary: 'PATH فهرستی از پوشه‌هاست که با `;` از هم جدا شده‌اند. وقتی یک دستور می‌نویسی، CMD اول در پوشه فعلی و بعد در همین پوشه‌ها دنبال برنامه‌اش می‌گردد.'
  meaning: 'به همین دلیل `ping` را از هر پوشه‌ای می‌توانی اجرا کنی: `ping.exe` در `C:\Windows\System32` است و این پوشه در PATH هست. `set PATH=%PATH%;C:\Tools` یک پوشه را (فقط برای همین پنجره) اضافه می‌کند.'
  usage: 'اجرای ابزارها و Scriptهای خودت از هر جا، و فهمیدن خطای `is not recognized`.'
  syntax: "echo %PATH%\npath\nset PATH=%PATH%;C:\\Tools"
  demo:
    cmds: ['path', 'where ping']
  examples:
    - c: 'echo %PATH%'
      d: 'نمایش PATH.'
    - c: 'path'
      d: 'همین کار به شکل کوتاه.'
    - c: 'set PATH=%PATH%;C:\Tools'
      d: 'اضافه کردن C:\Tools برای همین پنجره.'
  mistakes:
    - '`set PATH=C:\Tools` بدون `%PATH%;`: همه مسیرهای قبلی پاک می‌شوند و بیشتر دستورها دیگر پیدا نمی‌شوند.'
  tip: 'برای تغییر دائمی PATH از تنظیمات Windows یا دستور `setx` استفاده می‌شود؛ با احتیاط.'
  daily: 'PATH مثل فهرست قفسه‌هایی است که فروشنده برای پیدا کردن جنس نگاه می‌کند. اگر جنس در هیچ‌کدام نباشد، می‌گوید «نداریم».'
  practice:
    - id: P48a
      start: 'C:\Users\Student'
      task: 'مقدار PATH را نمایش بده.'
      checks: [{type: lastOutputIncludes, value: 'C:\Windows\system32'}]
      hints:
        - 'PATH هم یک Environment Variable است. مقدارش را می‌توانی مثل هر متغیر دیگری با `echo` چاپ کنی (یا با دستور کوتاه `path`).'
        - 'دو بخش: چه کاری؟ (`echo`) چه چیزی؟ (نام متغیر PATH بین دو `%`). خروجی، فهرست پوشه‌هایی است که با `;` جدا شده‌اند.'
      answer: 'echo %PATH%'
      explain: '`%PATH%` با فهرست پوشه‌های جست‌وجوی CMD جایگزین می‌شود و `echo` آن را چاپ می‌کند؛ پوشه‌ها با `;` از هم جدا شده‌اند.'
    - id: P48b
      start: 'C:\Users\Student'
      files: [{path: 'C:\Tools\hello.bat', content: "@echo off\necho Hello from Tools\n"}]
      task: 'در `C:\Tools` یک Script به نام `hello.bat` هست. پوشه `C:\Tools` را به PATH اضافه کن (بدون پاک کردن مسیرهای قبلی) و بعد از همین‌جا فقط با نوشتن `hello` آن را اجرا کن.'
      multi: true
      checks: [{type: envIncludes, name: PATH, value: 'C:\Tools'}, {type: envIncludes, name: PATH, value: 'System32'}, {type: lastOutputIncludes, value: 'Hello from Tools'}]
      hints:
        - 'مقدار جدید PATH باید «PATH فعلی + `;` + پوشه جدید» باشد، وگرنه مسیرهای قبلی پاک می‌شوند. بعد از تغییر، برنامه `hello` را فقط با نامش اجرا کن.'
        - 'خط ۱: `set`، بعد `PATH=`، بعد مقدار فعلی (`%PATH%`)، بعد `;` و `C:\Tools`. خط ۲: فقط نام Script، بدون Path و بدون `.bat`.'
      answer: ['set PATH=%PATH%;C:\Tools', 'hello']
      explain: 'در خط اول `%PATH%` مقدار قبلی را نگه می‌دارد و `;C:\Tools` پوشه جدید را به آخرش اضافه می‌کند. حالا CMD در `C:\Tools` هم می‌گردد و `hello` را پیدا و اجرا می‌کند.'
  quiz:
    - kind: mcq
      q: 'پوشه‌ها در PATH با چه علامتی از هم جدا می‌شوند؟'
      options: [';', ',', '|', '\']
      answer: 0
      code_options: true
      explain: 'نقطه‌ویرگول.'
    - kind: fix
      q: 'بعد از این دستور، `ping` کار نمی‌کند. چرا؟'
      code: 'set PATH=C:\Tools'
      options: ['همه مسیرهای قبلی PATH پاک شدند', 'C:\Tools وجود ندارد', 'ping حذف شد', 'باید Restart کرد']
      answer: 0
      explain: 'درست: `set PATH=%PATH%;C:\Tools`'
    - kind: tf
      q: 'CMD قبل از PATH، در پوشه فعلی دنبال برنامه می‌گردد.'
      answer: true
      explain: 'اول پوشه فعلی، بعد پوشه‌های PATH.'
  recap: 'PATH = پوشه‌هایی که CMD در آن‌ها برنامه پیدا می‌کند. اضافه کردن: `set PATH=%PATH%;پوشه`'

- n: 49
  term: whoami
  fullForm: 'whoami · hostname'
  difficulty: 2
  objective: 'بفهمی با چه کاربری و روی کدام کامپیوتر کار می‌کنی.'
  summary: '`whoami` نام کاربر را به شکل `computer\user` نشان می‌دهد. `hostname` فقط نام کامپیوتر را.'
  meaning: '`whoami /groups` نشان می‌دهد کاربر عضو کدام گروه‌هاست، مثلاً Administrators. این در عیب‌یابی خطای `Access is denied` مهم است (درس ۶۳).'
  usage: 'عیب‌یابی دسترسی، گزارش برای پشتیبانی فنی، اطمینان از اینکه روی کامپیوتر درست کار می‌کنی.'
  syntax: "whoami [/user] [/groups]\nhostname"
  demo:
    cmds: ['whoami', 'hostname', 'whoami /user']
  examples:
    - c: 'whoami'
      d: 'کاربر فعلی.'
    - c: 'hostname'
      d: 'نام کامپیوتر.'
    - c: 'whoami /groups'
