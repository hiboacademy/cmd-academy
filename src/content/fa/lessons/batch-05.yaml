  recap: '`whoami` = کاربر، `whoami /groups` = گروه‌ها، `hostname` = نام کامپیوتر.'

- n: 50
  term: systeminfo
  fullForm: 'ver · systeminfo'
  difficulty: 2
  objective: 'نسخه Windows و مشخصات کامل سیستم را ببینی و فقط بخش لازم را جدا کنی.'
  summary: '`ver` شماره نسخه Windows را نشان می‌دهد. `systeminfo` گزارش کاملی از سیستم می‌دهد: نسخه، زمان نصب، حافظه، شبکه و Hotfixها.'
  meaning: 'خروجی `systeminfo` طولانی است؛ معمولاً آن را با `find` یا `findstr` فیلتر می‌کنند.'
  usage: 'گزارش برای پشتیبانی، بررسی حافظه و نسخه قبل از نصب برنامه، فهمیدن زمان آخرین Restart.'
  syntax: "ver\nsysteminfo\nsysteminfo | find \"Memory\""
  demo:
    cmds: ['ver', 'systeminfo | find "OS Name"', 'systeminfo | findstr /c:"Total Physical Memory"']
  examples:
    - c: 'ver'
      d: 'شماره نسخه.'
    - c: 'systeminfo'
      d: 'گزارش کامل.'
    - c: 'systeminfo | find "Boot Time"'
      d: 'کامپیوتر کی روشن شده است؟'
    - c: 'systeminfo > info.txt'
      d: 'ذخیره گزارش.'
  mistakes:
    - 'خواندن کل خروجی به‌جای فیلتر کردن.'
  tip: '`systeminfo | more` هم برای خواندن صفحه‌به‌صفحه خوب است.'
  practice:
    - id: P50a
      start: 'C:\Users\Student'
      task: 'از خروجی `systeminfo` فقط خط نام سیستم‌عامل (`OS Name`) را نمایش بده.'
      checks: [{type: usedOp, value: '|'}, {type: lastOutputIncludes, value: 'Windows 11'}, {type: lastOutputExcludes, value: 'Host Name'}]
      hints:
        - 'خروجی `systeminfo` خیلی بلند است. آن را با Pipe به `find` بده تا فقط خطی بماند که عبارت OS Name را دارد.'
        - 'سه بخش: دستور اطلاعات سیستم (`systeminfo`)، علامت `|`، دستور فیلتر (`find` + عبارت OS Name داخل `" "`). چون عبارت Space دارد، Quotes لازم است.'
      answer: 'systeminfo | find "OS Name"'
      explain: '`systeminfo` همه اطلاعات سیستم را می‌دهد و `|` آن را به `find "OS Name"` می‌فرستد که فقط خط نام سیستم‌عامل را نگه می‌دارد.'
    - id: P50b
      start: 'C:\Users\Student'
      task: 'نسخه Windows را با کوتاه‌ترین دستور نمایش بده.'
      checks: [{type: anyCmd, value: ver}]
      hints:
        - '`systeminfo` اطلاعات زیادی می‌دهد، ولی برای دیدن فقط نسخه Windows یک دستور خیلی کوتاه‌تر هست؛ همان که در درس ۱ دیدی.'
        - 'یک کلمه، بدون Argument: سه حرف اول Version.'
      answer: 'ver'
      explain: '`ver` کوتاه‌شده Version است و فقط یک خط، یعنی نسخه Windows، را نشان می‌دهد.'
  quiz:
    - kind: mcq
      q: 'کدام دستور زمان آخرین روشن شدن کامپیوتر را نشان می‌دهد؟'
      options: ['systeminfo | find "Boot Time"', 'ver', 'hostname', 'time /t']
      answer: 0
      code_options: true
      explain: '`System Boot Time` در systeminfo.'
    - kind: type
      q: 'گزارش کامل systeminfo را در فایل `info.txt` ذخیره کن.'
      accept: ['systeminfo > info.txt', 'systeminfo >info.txt']
      show: 'systeminfo > info.txt'
      explain: 'Redirect با `>`.'
    - kind: tf
      q: '`ver` اطلاعات حافظه RAM را نشان می‌دهد.'
      answer: false
      explain: 'فقط نسخه؛ حافظه در systeminfo است.'
  recap: '`ver` = نسخه. `systeminfo` = همه چیز؛ با `find` فیلترش کن.'

- n: 51
  term: tasklist
  fullForm: 'Task List'
  difficulty: 2
  objective: 'برنامه‌های در حال اجرا را ببینی و PID یک برنامه را پیدا کنی.'
  summary: '`tasklist` همه Processها (برنامه‌های در حال اجرا) را با نام، PID و مصرف حافظه نشان می‌دهد.'
  meaning: 'PID (Process ID) شماره یکتای هر Process است. یک برنامه مثل Chrome ممکن است چند Process داشته باشد. `/fi` فیلتر می‌کند، مثلاً `"imagename eq notepad.exe"` یا `"memusage gt 100000"`.'
  usage: 'پیدا کردن برنامه‌ای که کامپیوتر را کند کرده، پیدا کردن PID برای `taskkill`.'
  syntax: "tasklist\ntasklist /fi \"imagename eq name.exe\"\ntasklist | find \"name\""
  demo:
    cmds: ['tasklist /fi "imagename eq notepad.exe"', 'tasklist | find "chrome"']
  examples:
    - c: 'tasklist'
      d: 'همه Processها.'
    - c: 'tasklist /fi "imagename eq chrome.exe"'
      d: 'فقط Chrome.'
    - c: 'tasklist /fi "memusage gt 100000"'
      d: 'Processهایی که بیش از ۱۰۰ مگابایت حافظه مصرف می‌کنند.'
    - c: 'tasklist /fi "status eq not responding"'
      d: 'برنامه‌هایی که جواب نمی‌دهند.'
  mistakes:
    - 'فراموش کردن Quotes دور فیلتر.'
    - 'نوشتن نام بدون `.exe` در فیلتر `imagename eq`.'
  tip: '`eq` یعنی مساوی، `ne` نامساوی، `gt` بزرگ‌تر و `lt` کوچک‌تر.'
  practice:
    - id: P51a
      start: 'C:\Users\Student'
      task: 'PID برنامه Notepad (`notepad.exe`) را پیدا کن.'
      checks: [{type: anyCmd, value: tasklist}, {type: lastOutputIncludes, value: '7344'}, {type: lastOutputExcludes, value: 'chrome'}]
      hints:
        - '`tasklist` همه Processها را نشان می‌دهد. با Switch `/fi` (Filter) می‌توانی فقط Processی را نگه داری که نام فایلش (imagename) مساوی (`eq`) `notepad.exe` است.'
        - 'به ترتیب: Command (`tasklist`)، Switch فیلتر (`/fi`)، و شرط داخل `" "`: کلمه imagename، بعد `eq`، بعد `notepad.exe`. PID در ستون دوم خروجی است.'
      answer: 'tasklist /fi "imagename eq notepad.exe"'
      explain: '`/fi` خروجی `tasklist` را فیلتر می‌کند و شرط `"imagename eq notepad.exe"` یعنی «فقط Processی که نامش notepad.exe است»؛ پس PID آن (7344) دیده می‌شود.'
    - id: P51b
      start: 'C:\Users\Student'
      task: 'فقط Processهایی را نشان بده که بیش از `100000` کیلوبایت حافظه مصرف می‌کنند.'
      checks: [{type: anyCmd, value: tasklist}, {type: lastOutputIncludes, value: 'MsMpEng.exe'}, {type: lastOutputExcludes, value: 'notepad.exe'}]
      hints:
        - 'باز هم `tasklist` با Switch `/fi`، ولی این بار فیلتر روی حافظه (memusage) است و شرط «بزرگ‌تر از» (`gt`) لازم داری.'
        - 'به ترتیب: Command (`tasklist`)، Switch (`/fi`)، و شرط داخل `" "`: memusage، بعد `gt`، بعد عدد 100000 (بدون KB و بدون ویرگول).'
      answer: 'tasklist /fi "memusage gt 100000"'
      explain: 'شرط `"memusage gt 100000"` یعنی «مصرف حافظه بیشتر از 100000 کیلوبایت»؛ پس فقط Processهای پرمصرف مثل `MsMpEng.exe` می‌مانند.'
  quiz:
    - kind: mcq
      q: 'PID چیست؟'
      options: ['شماره یکتای هر Process', 'رمز عبور برنامه', 'اندازه برنامه', 'مسیر نصب برنامه']
      answer: 0
      explain: 'Process ID.'
    - kind: tf
      q: 'یک برنامه می‌تواند چند Process با PIDهای مختلف داشته باشد.'
      answer: true
      explain: 'مثل Chrome که برای هر Tab یک Process دارد.'
    - kind: type
      q: 'فقط Processهای `explorer.exe` را با فیلتر نمایش بده.'
      accept: ['tasklist /fi "imagename eq explorer.exe"', 'tasklist /fi "imagename eq explorer.exe" /v']
      show: 'tasklist /fi "imagename eq explorer.exe"'
      explain: 'فیلتر `imagename eq`.'
  recap: '`tasklist` = برنامه‌های در حال اجرا. PID شماره هر Process است. `/fi "..."` فیلتر.'

- n: 52
  term: taskkill
  fullForm: 'Task Kill'
  difficulty: 2
  objective: 'یک برنامه را با نام یا PID ببندی و بدانی کدام Processها را نباید ببندی.'
  summary: '`taskkill` یک Process را می‌بندد: با `/im` بر اساس نام یا با `/pid` بر اساس شماره. `/f` برنامه را به‌اجبار می‌بندد.'
  meaning: 'بدون `/f`، به برنامه پیام «بسته شو» فرستاده می‌شود (فرصت ذخیره). برنامه‌ای که جواب نمی‌دهد (Not Responding) فقط با `/f` بسته می‌شود. Processهای حیاتی Windows اصلاً بسته نمی‌شوند.'
  usage: 'بستن برنامه هنگ‌کرده، بستن همه پنجره‌های یک برنامه با یک دستور.'
  syntax: "taskkill /im name.exe [/f]\ntaskkill /pid number [/f]"
  warning: 'با `/f` کارهای ذخیره‌نشده آن برنامه از بین می‌روند. روی کامپیوتر واقعی هرگز Processهای سیستمی مثل `csrss.exe`، `winlogon.exe` یا `svchost.exe` را نبند.'
  demo:
    cmds: ['taskkill /im notepad.exe', 'taskkill /pid 7810', 'taskkill /pid 7810 /f', 'taskkill /im csrss.exe']
  examples:
    - c: 'taskkill /im notepad.exe'
      d: 'بستن Notepad.'
    - c: 'taskkill /pid 7810 /f'
      d: 'بستن اجباری یک Process با PID.'
    - c: 'taskkill /im chrome.exe /f'
      d: 'بستن همه Processهای Chrome.'
  mistakes:
    - 'نوشتن نام بدون `.exe`: `taskkill /im notepad` پیدا نمی‌کند.'
    - 'استفاده از `/f` قبل از امتحان بستن عادی.'
  tip: 'اول با `tasklist` PID را پیدا کن، بعد با `taskkill /pid` ببند. این از بستن اشتباهی جلوگیری می‌کند.'
  practice:
    - id: P52a
      start: 'C:\Users\Student'
      task: 'برنامه Notepad (`notepad.exe`) را با نام آن ببند.'
      checks: [{type: procGone, value: 'notepad.exe'}]
      hints:
        - 'برای بستن یک Process از `taskkill` استفاده کن. با Switch `/im` (Image name) می‌گویی کدام برنامه را بر اساس نامش ببندد.'
        - 'سه بخش: چه کاری؟ (`taskkill`) چطور شناسایی شود؟ (Switch `/im`) کدام برنامه؟ (نام فایل `notepad.exe`).'
      answer: 'taskkill /im notepad.exe'
      explain: '`taskkill` Process را می‌بندد و `/im notepad.exe` می‌گوید Processی را که نامش notepad.exe است ببندد.'
    - id: P52b
      start: 'C:\Users\Student'
      task: 'Spotify هنگ کرده (Not Responding). اول PID آن را پیدا کن و بعد با PID به‌اجبار ببندش.'
      multi: true
      checks: [{type: procGone, value: 'Spotify.exe'}, {type: anyCmd, value: tasklist}, {type: switch, value: '/f', cmd: taskkill, anyRun: true}, {type: argIncludes, cmd: taskkill, value: '7810'}]
      hints:
        - 'دو قدم: اول با `tasklist` و یک Pipe به `find` خط Spotify و PID آن را پیدا کن. بعد با `taskkill` و Switch `/pid` آن را ببند؛ برنامه هنگ‌کرده فقط با Switch اجباری `/f` بسته می‌شود.'
        - 'خط ۱: `tasklist`، علامت `|`، بعد `find` + Spotify داخل `" "`. خط ۲: `taskkill`، Switch `/pid` + شماره‌ای که در خط ۱ دیدی، و در آخر `/f`.'
      answer: ['tasklist | find "Spotify"', 'taskkill /pid 7810 /f']
      explain: '`tasklist | find "Spotify"` خط Spotify را با PID آن (7810) نشان می‌دهد. بعد `taskkill /pid 7810 /f` همان Process را با شماره‌اش پیدا می‌کند و `/f` آن را به‌اجبار می‌بندد.'
  quiz:
    - kind: predict
      q: 'برنامه X جواب نمی‌دهد. نتیجه این دستور؟'
      code: 'taskkill /im X.exe'
      options: ['خطا: فقط با /F بسته می‌شود', 'بسته می‌شود', 'Restart می‌شود', 'کامپیوتر خاموش می‌شود']
      answer: 0
      explain: 'برنامه Not Responding به پیام عادی جواب نمی‌دهد.'
    - kind: mcq
      q: 'کدام دستور Process با PID برابر 4321 را به‌اجبار می‌بندد؟'
      options: ['taskkill /pid 4321 /f', 'taskkill /im 4321', 'tasklist /pid 4321', 'taskkill 4321']
      answer: 0
      code_options: true
      explain: '`/pid` برای شماره، `/f` برای اجبار.'
    - kind: tf
      q: 'می‌شود `csrss.exe` را با `taskkill /f` بست تا کامپیوتر سریع‌تر شود.'
      answer: false
      explain: 'Processهای حیاتی بسته نمی‌شوند و تلاش برایش خطرناک است.'
    - kind: sim
      q: 'Notepad را ببند؛ بقیه برنامه‌ها باید باز بمانند.'
      start: 'C:\Users\Student'
      checks: [{type: procGone, value: 'notepad.exe'}, {type: not, check: {type: procGone, value: 'chrome.exe'}}]
      answer: 'taskkill /im notepad.exe'
      explain: '`/im` با نام برنامه.'
  recap: '`taskkill /im نام.exe` یا `/pid شماره`. `/f` اجباری. Processهای سیستمی را نبند.'
