        - 'سه بخش: دستوری که نام کامپیوتر را می‌دهد (`hostname`)، علامت `>`، نام فایل مقصد (`pcname.txt`).'
      answer: 'hostname > pcname.txt'
      explain: '`hostname` نام کامپیوتر (`ACADEMY-PC`) را تولید می‌کند و `>` آن را به‌جای صفحه در `pcname.txt` می‌نویسد.'
  quiz:
