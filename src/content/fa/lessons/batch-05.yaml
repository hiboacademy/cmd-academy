      start: 'C:\Users\Student'
      task: 'نام کاربر فعلی را با دستور مخصوصش نمایش بده.'
      checks: [{type: anyCmd, value: whoami}, {type: lastOutputIncludes, value: 'student'}]
      hints:
        - 'یک دستور مخصوص هست که فقط جواب می‌دهد «من کی هستم؟». نامش همین جمله انگلیسی است که به هم چسبیده.'
        - 'یک کلمه، بدون Argument: who و am و i، بدون Space بینشان.'
      answer: 'whoami'
      explain: '`whoami` (Who am I) نام کاربر فعلی را نشان می‌دهد؛ معمولاً به شکل «نام کامپیوتر\نام کاربر».'
    - id: P49b
