  difficulty: 1
  objective: 'صفحه را پاک کنی و با کلیدهای میانبر CMD سریع‌تر کار کنی.'
  summary: '`cls` = صفحه قابل‌مشاهده Command Prompt را پاک می‌کند. هیچ فایل یا پوشه‌ای حذف نمی‌شود؛ فقط متن روی صفحه تمیز می‌شود.'
  warning: '`cls` هیچ فایل یا پوشه‌ای را حذف نمی‌کند و چیزی را خراب نمی‌کند. فقط متن‌های روی صفحه پاک می‌شوند و Prompt دوباره بالای صفحه می‌آید.'
  meaning: 'بعد از `cls` فقط Prompt در بالای صفحه باقی می‌ماند. Current Directory هم عوض نمی‌شود.'
  usage: 'وقتی خروجی دستورهای قبلی شلوغ کرده و می‌خواهی تمرکز کنی.'
  syntax: 'cls'
  examples:
    - c: 'cls'
      d: 'پاک کردن صفحه.'
    - c: 'dir & cls'
      d: 'اجرای دو دستور پشت‌سرهم (`&` در درس ۳۱).'
      noTry: true
  mistakes:
    - 'فکر کردن اینکه `cls` فایل‌ها را پاک می‌کند. نه، فقط صفحه را.'
    - 'نوشتن `clear`: این دستور مال Linux است.'
  tip: 'کلیدهای مفید: ↑ و ↓ برای دستورهای قبلی، Tab برای کامل کردن نام، Esc برای پاک کردن خطی که می‌نویسی. در Simulator دکمه ↑ و Tab هم هست.'
  practice:
    - id: P15a
      start: 'C:\Users\Student'
      task: 'اول محتوای پوشه را با `dir` ببین، بعد صفحه را پاک کن.'
      multi: true
      checks: [{type: cmd, value: cls}, {type: anyCmd, value: dir}]
      hints:
        - 'اول با `dir` چیزی روی صفحه بیاور، بعد صفحه را با Command این درس (Clear Screen) تمیز کن.'
        - 'دو خط به ترتیب: خط ۱: `dir` برای دیدن محتوا. خط ۲: Command سه‌حرفی که از حروف Clear Screen ساخته شده.'
      answer: ['dir', 'cls']
      explain: '`dir` محتوای پوشه را چاپ می‌کند و `cls` (Clear Screen) همه متن‌های صفحه را پاک می‌کند تا فقط Prompt بماند. فایل‌ها تغییری نمی‌کنند.'
  quiz:
    - kind: tf
      q: '`cls` فایل‌های پوشه فعلی را پاک می‌کند.'
      answer: false
      explain: 'فقط صفحه نمایش پاک می‌شود.'
    - kind: mcq
      q: 'برای آوردن دوباره دستور قبلی کدام کلید را می‌زنی؟'
      options: ['↑ (فلش بالا)', 'Esc', 'Delete', 'F1']
      answer: 0
      explain: 'فلش بالا دستورهای قبلی را یکی‌یکی برمی‌گرداند.'
    - kind: mcq
      q: 'بعد از `cls`، Current Directory چه می‌شود؟'
      options: ['همان قبلی می‌ماند', 'به `C:\` می‌رود', 'به Desktop می‌رود', 'پاک می‌شود']
      answer: 0
      explain: '`cls` فقط نمایش را پاک می‌کند.'
  recap: '`cls` صفحه را تمیز می‌کند، نه فایل‌ها را. ↑ دستور قبلی، Tab کامل کردن نام.'

- n: 16
  term: 'help   /?'
  fullForm: 'Help'
  difficulty: 1
  objective: 'برای هر دستوری خودت راهنما بگیری و خروجی راهنما را بخوانی.'
  summary: '`help` فهرست دستورهای CMD را نشان می‌دهد. `دستور /?` راهنمای کامل همان دستور را نشان می‌دهد.'
  meaning: 'در راهنما، بخش‌های داخل `[ ]` اختیاری‌اند و `|` یعنی «یکی از این‌ها». مثلاً `DIR [/W] [/B]` یعنی `/w` و `/b` اختیاری‌اند.'
  usage: 'مهم‌ترین مهارت یک کاربر CMD: هر وقت Switch یادت رفت، `/?` بزن.'
  syntax: "help\nhelp command\ncommand /?"
  demo:
    cmds: ['mkdir /?']
  examples:
    - c: 'help'
      d: 'فهرست همه دستورها با یک خط توضیح.'
    - c: 'copy /?'
      d: 'راهنمای کامل `copy`.'
    - c: 'help dir'
      d: 'همان `dir /?`.'
  mistakes:
    - 'نوشتن `-?` یا `--help`: در CMD درستش `/?` است.'
  tip: 'راهنمای Windows انگلیسی است؛ کافی است دنبال Switchها و کلمه‌های کلیدی بگردی.'
  practice:
    - id: P16a
      start: 'C:\Users\Student'
      task: 'فهرست دستورهای CMD را ببین.'
      checks: [{type: cmd, value: help}, {type: noArgs}]
      hints:
        - 'CMD خودش یک فهرست از دستورهایش دارد. Command آن همان کلمه انگلیسی «کمک» است.'
        - 'فقط یک بخش: چه کاری؟ (کلمه Help). Argument لازم نیست؛ اگر نام دستوری بعدش بنویسی، به‌جای فهرست کامل، فقط راهنمای همان دستور را می‌بینی.'
      answer: 'help'
      explain: '`help` بدون Argument فهرست دستورهای CMD را همراه توضیح کوتاه هر کدام نشان می‌دهد.'
    - id: P16b
      start: 'C:\Users\Student'
      task: 'راهنمای دستور `copy` را ببین.'
      checks: [{type: any, of: [{type: switch, value: '/?', cmd: copy, anyRun: true}, {type: argIncludes, cmd: help, value: copy}]}]
      hints:
        - 'برای دیدن راهنمای یک دستور، نام دستور را بنویس و Switch راهنما (`/?`) را بعدش بگذار. (راه دیگر: `help` و بعد نام دستور.)'
        - 'دو بخش: چه کاری؟ (نام دستوری که راهنمایش را می‌خواهی، `copy`) چطور؟ (Switch راهنما: `/` و علامت سؤال)، با یک Space بینشان.'
      answer: 'copy /?'
      explain: '`copy` نام دستور است و `/?` به آن می‌گوید به‌جای کپی کردن، راهنمای خودش را نشان بدهد.'
  quiz:
    - kind: mcq
      q: 'در راهنمای CMD، `[ ]` دور یک بخش یعنی چه؟'
      options: ['آن بخش اختیاری است', 'آن بخش الزامی است', 'باید `[ ]` را هم تایپ کنی', 'آن بخش قدیمی است']
      answer: 0
      explain: 'بخش‌های داخل کروشه اختیاری‌اند.'
    - kind: type
      q: 'راهنمای دستور `dir` را ببین.'
      accept: ['dir /?', 'help dir']
      explain: '`dir /?` یا `help dir`'
    - kind: tf
      q: 'در CMD، `dir --help` راهنما را نشان می‌دهد.'
      answer: false
      explain: 'در CMD از `/?` استفاده می‌شود.'
  recap: '`help` = فهرست دستورها. `دستور /?` = راهنمای همان دستور. `[ ]` = اختیاری.'

- n: 17
  term: '"quotes"'
