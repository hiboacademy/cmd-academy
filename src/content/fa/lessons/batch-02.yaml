        - 'دو بخش: چه کاری؟ (`type`) روی چه چیزی؟ (نام کامل فایل همراه Extension، یعنی shopping list.txt، داخل یک جفت `"`).'
      answer: 'type "shopping list.txt"'
      explain: '`type` محتوای فایل را نشان می‌دهد و `"shopping list.txt"` به لطف Quotes یک نام کامل حساب می‌شود؛ بدون Quotes، CMD دنبال فایلی به نام `shopping` می‌گشت.'
