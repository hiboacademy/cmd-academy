- n: 11
  term: dir
  fullForm: 'Directory (list)'
  difficulty: 1
  objective: 'محتوای هر پوشه را ببینی و خروجی `dir` را بخوانی.'
  summary: '`dir` فهرست فایل‌ها و پوشه‌های داخل یک پوشه را نشان می‌دهد. بدون Argument، محتوای Current Directory را نشان می‌دهد.'
  meaning: 'هر خط خروجی یعنی یک فایل یا پوشه: تاریخ، ساعت، `<DIR>` برای پوشه یا اندازه فایل به بایت، و نام. پایین خروجی تعداد فایل‌ها و فضای خالی Drive آمده است.'
  usage: 'قبل از هر کاری با فایل‌ها، با `dir` ببین چه چیزی و با چه نام دقیقی آنجاست.'
  syntax: 'dir [path] [/w] [/b]'
  demo:
    start: 'C:\Users\Student\Documents'
    cmds: ['dir']
  examples:
    - c: 'dir'
      d: 'محتوای پوشه فعلی.'
    - c: 'dir Pictures'
      at: 'C:\Users\Student'
      d: 'محتوای پوشه Pictures، بدون اینکه وارد آن شوی.'
    - c: 'dir /w'
      d: 'نمایش فشرده در چند ستون؛ پوشه‌ها داخل `[ ]` هستند.'
    - c: 'dir /b'
      d: 'فقط نام‌ها (Bare)، بدون تاریخ و اندازه.'
  mistakes:
    - 'نوشتن `ls`: این دستور مال Linux است. در CMD از `dir` استفاده کن.'
    - 'فراموش کردن فاصله: `dir/w` کار می‌کند، ولی `dirPictures` نه.'
  tip: '`.` یعنی همین پوشه و `..` یعنی پوشه بالاتر؛ این دو در هر پوشه‌ای غیر از ریشه دیده می‌شوند.'
  restaurant: '`dir` مثل نگاه کردن به منوی میز است: قبل از سفارش، می‌بینی چه چیزهایی موجود است.'
  practice:
    - id: P11a
      start: 'C:\Users\Student\Pictures'
      task: 'داخل Pictures هستی. ببین چه فایل‌ها و پوشه‌هایی اینجاست.'
      checks: [{type: cmd, value: dir}, {type: ok}, {type: cwd, value: 'C:\Users\Student\Pictures'}]
      hints:
        - 'می‌خواهی فهرست فایل‌ها و پوشه‌های همین پوشه فعلی را ببینی. Command این درس، `dir`، بدون Argument دقیقاً همین کار را می‌کند.'
        - 'فقط یک بخش: چه کاری؟ (`dir`). روی چه چیزی؟ لازم نیست بنویسی؛ وقتی Argument ندهی، `dir` محتوای Current Directory (Pictures) را نشان می‌دهد.'
      answer: 'dir'
      explain: '`dir` بدون Argument، محتوای Current Directory را فهرست می‌کند؛ اینجا یعنی `C:\Users\Student\Pictures`.'
    - id: P11b
      start: 'C:\Users\Student'
      task: 'بدون رفتن به پوشه Documents، فقط نام فایل‌ها و پوشه‌های داخلش را ببین (فرمت Bare).'
      checks: [{type: cmd, value: dir}, {type: argIncludes, value: documents}, {type: switch, value: '/b'}, {type: ok}]
      hints:
        - 'لازم نیست وارد Documents شوی: نام پوشه را به‌عنوان Argument به `dir` بده. برای اینکه فقط نام‌ها بیایند، یک Switch مخصوص «Bare» هم لازم است.'
        - 'سه بخش: چه کاری؟ (`dir`) روی چه چیزی؟ (نام پوشه Documents) چطور؟ (Switch حرف اول Bare با `/`، که تاریخ و اندازه را حذف می‌کند).'
      answer: 'dir Documents /b'
      explain: '`dir` فهرست می‌دهد، `Documents` می‌گوید فهرست کدام پوشه، و `/b` (Bare) فقط نام‌ها را بدون تاریخ و اندازه نشان می‌دهد.'
  quiz:
    - kind: mcq
      q: 'در خروجی `dir`، عدد کنار نام فایل چیست؟'
      options: ['اندازه فایل به بایت', 'تعداد خط‌های فایل', 'شماره فایل', 'سن فایل به روز']
      answer: 0
      explain: 'برای فایل‌ها اندازه به بایت نوشته می‌شود و برای پوشه‌ها `<DIR>`.'
    - kind: mcq
      q: 'کدام دستور فقط نام‌ها را بدون تاریخ و اندازه نشان می‌دهد؟'
      options: ['dir /b', 'dir /w', 'dir', 'dir /s']
      answer: 0
      code_options: true
      explain: '`/b` یعنی Bare: فقط نام.'
    - kind: type
      q: 'محتوای پوشه Music را ببین، بدون اینکه وارد آن شوی. (الان در `C:\Users\Student` هستی.)'
      accept: ['dir music', 'dir music\', 'dir .\music', 'dir c:\users\student\music']
      show: 'dir Music'
      explain: 'نام پوشه را به‌عنوان Argument به `dir` بده.'
    - kind: sim
      q: 'فقط نام فایل‌ها و پوشه‌های Downloads را ببین، بدون تاریخ و اندازه.'
      start: 'C:\Users\Student'
      checks: [{type: cmd, value: dir}, {type: switch, value: '/b'}, {type: lastOutputIncludes, value: 'invoice.pdf'}]
      answer: 'dir Downloads /b'
      explain: '`/b` فقط نام‌ها را نشان می‌دهد.'
  recap: '`dir` = دیدن محتوا. `/w` فشرده، `/b` فقط نام‌ها. پوشه‌ها با `<DIR>` مشخص می‌شوند.'

- n: 12
  term: cd
  fullForm: 'Change Directory'
  difficulty: 1
  objective: 'با `cd` وارد هر پوشه‌ای شوی و بدانی الان کجا هستی.'
  summary: '`cd` Current Directory را عوض می‌کند. بعد از اجرای آن، Prompt مسیر جدید را نشان می‌دهد.'
  meaning: '`cd` همراه یک Path (نسبی یا مطلق) تو را به آن پوشه می‌برد. `cd` بدون Argument فقط مسیر فعلی را چاپ می‌کند.'
  usage: 'تقریباً هر کاری در CMD با رفتن به پوشه درست شروع می‌شود.'
  syntax: 'cd [path]'
  demo:
    cmds: ['cd Documents', 'cd Work', 'cd']
  examples:
    - c: 'cd Documents'
      d: 'رفتن به پوشه Documents که داخل پوشه فعلی است.'
    - c: 'cd Documents\Work'
      d: 'رفتن مستقیم دو پوشه به داخل.'
    - c: 'cd C:\Windows'
      d: 'رفتن با Absolute Path.'
    - c: 'chdir'
      d: '`chdir` همان `cd` است؛ مسیر فعلی را نشان می‌دهد.'
  mistakes:
    - 'نوشتن نام پوشه به‌تنهایی (`Documents`): CMD آن را دستور فرض می‌کند و خطا می‌دهد.'
    - '`cd` به فایل: `cd todo.txt` خطای `The directory name is invalid.` می‌دهد.'
    - 'اشتباه تایپی در نام پوشه؛ با `dir` نام دقیق را چک کن.'
  tip: 'بعد از چند حرف اول نام پوشه کلید Tab را بزن تا CMD بقیه نام را کامل کند (در Simulator هم کار می‌کند).'
  restaurant: '`cd` یعنی گارسون از میز ۱ به میز ۲ برود. هر سفارشی که بعد از آن بگیری، مال میز جدید است.'
  practice:
    - id: P12a
      start: 'C:\Users\Student'
      task: 'وارد پوشه Downloads شو.'
      checks: [{type: cwd, value: 'C:\Users\Student\Downloads'}]
      hints:
        - 'برای رفتن به یک پوشه از `cd` (Change Directory) استفاده کن. Downloads داخل همین پوشه است، پس نامش را به‌عنوان مقصد بده.'
        - 'دو بخش: چه کاری؟ (`cd`) به کجا؟ (نام پوشه Downloads). بعد از Enter، Prompt باید به `C:\Users\Student\Downloads>` تغییر کند.'
      answer: 'cd Downloads'
      explain: '`cd` Current Directory را عوض می‌کند و `Downloads` مقصد است؛ چون Relative Path است، به `C:\Users\Student` اضافه می‌شود.'
    - id: P12b
      start: 'C:\Users\Student'
      task: 'با یک دستور وارد پوشه Holidays شو که داخل Pictures است، بعد مسیر فعلی را چاپ کن.'
      multi: true
      checks: [{type: cwd, value: 'C:\Users\Student\Pictures\Holidays'}, {type: cmd, value: cd}, {type: noArgs}]
      hints:
        - 'دو کار پشت‌سرهم: اول با `cd` و یک Path دوقسمتی (پوشه بیرونی، بعد پوشه داخلی) برو، بعد با همان `cd` بپرس الان کجا هستی.'
        - 'خط ۱: `cd` + Path (نام `Pictures`، جداکننده `\`، نام `Holidays`). خط ۲: `cd` تنها، بدون هیچ Argument، تا مسیر فعلی چاپ شود.'
      answer: ['cd Pictures\Holidays', 'cd']
      explain: '`cd Pictures\Holidays` با یک Path دو پله پایین می‌رود. بعد `cd` بدون Argument فقط مسیر فعلی را چاپ می‌کند و جایی نمی‌رود.'
  quiz:
    - kind: mcq
      q: '`cd` مخفف چیست؟'
      options: ['Change Directory', 'Copy Data', 'Create Directory', 'Clear Display']
      answer: 0
      code_options: true
      explain: 'Change Directory: عوض کردن پوشه فعلی.'
    - kind: fix
      q: 'کاربر می‌خواهد وارد Music شود. چه اشتباهی کرده است؟'
      code: "C:\\Users\\Student>Music\n'Music' is not recognized as an internal or external command,"
      options: ['`cd` را قبل از نام پوشه ننوشته', 'Music باید با حروف کوچک باشد', 'Music وجود ندارد', 'باید اول `dir` بزند']
      answer: 0
      explain: 'نام پوشه دستور نیست؛ درست: `cd Music`'
    - kind: type
      q: 'از `C:\Users\Student` با یک دستور وارد `Documents\Work` شو.'
      accept: ['cd documents\work', 'chdir documents\work', 'cd .\documents\work', 'cd c:\users\student\documents\work']
      show: 'cd Documents\Work'
      explain: 'نام پوشه‌ها را با `\` به هم وصل کن.'
  recap: '`cd پوشه` = رفتن. `cd` تنها = نشان دادن مسیر فعلی.'

- n: 13
  term: 'cd ..   cd \'
  fullForm: 'Parent · Root'
  difficulty: 1
  objective: 'به پوشه بالاتر برگردی و مستقیم به ریشه Drive بروی.'
  summary: '`cd ..` یک پوشه بالا می‌رود (به Parent). `cd \` مستقیم به ریشه Drive می‌رود، مثل `C:\`.'
  meaning: '`..` در هر Path یعنی «پوشه بالاتر». می‌توانی آن را تکرار کنی: `..\..` یعنی دو پوشه بالاتر. `\` در ابتدای Path یعنی ریشه همین Drive.'
  usage: 'برای برگشتن از پوشه‌های عمیق، یا شروع یک مسیر از اول Drive.'
  syntax: "cd ..\ncd ..\\..\ncd \\"
  demo:
    start: 'C:\Users\Student\Documents\Work'
    cmds: ['cd ..', 'cd ..\..', 'cd \']
  examples:
    - c: 'cd ..'
      d: 'یک پوشه بالاتر.'
    - c: 'cd ..\..'
      d: 'دو پوشه بالاتر.'
    - c: 'cd ..\Music'
      at: 'C:\Users\Student\Documents'
      d: 'بالا برو و بعد وارد پوشه کناری Music شو.'
    - c: 'cd \'
      d: 'مستقیم به ریشه Drive فعلی.'
  mistakes:
    - '`cd..` (بدون فاصله) هم کار می‌کند، ولی `cd...` با سه نقطه را نیاموز؛ در Windows استاندارد نیست.'
    - 'اشتباه گرفتن `\` با `/`: ریشه با Backslash است: `cd \`'
  tip: 'در ریشه (`C:\`) دیگر بالاتری وجود ندارد؛ `cd ..` آنجا کاری نمی‌کند.'
  daily: 'در ساختمان: `..` یعنی یک طبقه پایین‌تر به سمت لابی، `\` یعنی مستقیم برو لابی.'
  practice:
    - id: P13a
      start: 'C:\Users\Student\Documents\Work'
      task: 'داخل `Documents\Work` هستی. با یک دستور دو پوشه بالاتر برو (به `C:\Users\Student`).'
      checks: [{type: cwd, value: 'C:\Users\Student'}, {type: cmd, value: cd}]
      hints:
        - '`..` یعنی «یک پوشه بالاتر» (Parent). تو دو پله بالا رفتن لازم داری، پس باید دو تا `..` را در یک Path به هم وصل کنی و به `cd` بدهی.'
        - 'دو بخش: چه کاری؟ (`cd`) به کجا؟ (Path: اولین `..`، جداکننده `\`، دومین `..`). پله اول به Documents می‌رسی، پله دوم به Student.'
      answer: 'cd ..\..'
      explain: '`..\..` یعنی «Parent و بعد Parent آن». از `Documents\Work` اول به `Documents` و بعد به `C:\Users\Student` می‌رسی.'
    - id: P13b
      start: 'C:\Users\Student\Pictures\Holidays'
      task: 'با کوتاه‌ترین دستور به ریشه Drive C برو.'
      checks: [{type: cwd, value: 'C:\'}]
      hints:
        - 'ریشه Drive با یک علامت تنها نشان داده می‌شود: همان Backslash که پوشه‌ها را جدا می‌کند. آن را به `cd` بده.'
        - 'دو بخش: چه کاری؟ (`cd`) به کجا؟ (ریشه، فقط یک `\`). لازم نیست `..` را چند بار تکرار کنی یا Path کامل بنویسی.'
      answer: 'cd \'
      explain: '`\` به‌تنهایی یعنی ریشه Drive فعلی، پس `cd \` از هر عمقی با یک دستور به `C:\` می‌رود.'
  quiz:
    - kind: predict
      q: 'Current Directory: `C:\Users\Student\Music` — بعد از این دستور کجا هستی؟'
      code: 'cd ..\Pictures'
      options: ['C:\Users\Student\Pictures', 'C:\Pictures', 'C:\Users\Pictures', 'C:\Users\Student\Music\Pictures']
      answer: 0
      code_options: true
      explain: 'اول یک پوشه بالا (Student) و بعد وارد Pictures.'
    - kind: tf
      q: '`cd \` همیشه به ریشه Drive فعلی می‌رود.'
      answer: true
      explain: '`\` در ابتدای Path یعنی ریشه.'
    - kind: type
      q: 'یک پوشه بالاتر برو.'
      accept: ['cd ..', 'cd..', 'chdir ..', 'cd ..\']
      explain: '`cd ..`'
    - kind: sim
      q: 'از `Documents\Work` با یک دستور به پوشه Music برو.'
      start: 'C:\Users\Student\Documents\Work'
      checks: [{type: cwd, value: 'C:\Users\Student\Music'}]
      answer: 'cd ..\..\Music'
      explain: 'دو بار `..` تا Student و بعد Music؛ یا Absolute Path.'
  recap: '`cd ..` = یک پوشه بالا. `cd ..\..` = دو پوشه. `cd \` = ریشه Drive.'

- n: 14
  term: 'D:   cd /d'
  fullForm: 'Change drive'
  difficulty: 1
  objective: 'بین Driveها جابه‌جا شوی و با یک دستور به پوشه‌ای در Drive دیگر بروی.'
  summary: 'برای رفتن به Drive دیگر حرف آن را با دو نقطه بنویس، مثل `D:`. برای رفتن به یک پوشه در Drive دیگر از `cd /d` استفاده کن.'
  meaning: 'هر Drive مسیر فعلی خودش را به خاطر دارد. `cd D:\Backup` فقط مسیر D را عوض می‌کند و تو روی C می‌مانی؛ `cd /d D:\Backup` هم Drive و هم پوشه را عوض می‌کند.'
  usage: 'کار با USB، هارد دوم یا Backup روی Drive دیگر.'
  syntax: "D:\ncd /d D:\\folder"
  demo:
    cmds: ['D:', 'dir /b', 'C:', 'cd /d D:\Projects']
  examples:
    - c: 'E:'
      d: 'رفتن به USB مجازی.'
    - c: 'cd /d D:\Backup'
      d: 'رفتن به پوشه Backup روی Drive D، با یک دستور.'
    - c: 'pushd D:\Projects'
      d: 'مسیر فعلی را ذخیره می‌کند و می‌رود؛ `popd` تو را برمی‌گرداند.'
  mistakes:
    - '`cd D:\Backup` بدون `/d`: Prompt هنوز C را نشان می‌دهد و فکر می‌کنی دستور کار نکرده.'
    - 'نوشتن `D` بدون دو نقطه.'
  tip: '`pushd` و `popd` مثل نشانک (Bookmark) هستند: با `pushd` جایی برو و با `popd` به جای قبلی برگرد.'
  restaurant: 'رستوران چند شعبه دارد. `D:` یعنی رفتن به شعبه D. `cd /d D:\Backup` یعنی «برو شعبه D، سالن Backup» با یک حرکت.'
  practice:
    - id: P14a
      start: 'C:\Users\Student'
      task: 'با یک دستور به پوشه `D:\Projects` برو.'
      checks: [{type: drive, value: D}, {type: cwd, value: 'D:\Projects'}]
      hints:
        - 'مقصد روی Drive دیگری است. `cd` به‌تنهایی Drive را عوض نمی‌کند؛ باید یک Switch به آن اضافه کنی تا هم Drive و هم پوشه با هم عوض شوند.'
        - 'سه بخش: چه کاری؟ (`cd`) چطور؟ (Switch حرف `d` با `/`، برای Drive) به کجا؟ (Absolute Path کامل، از `D:\` تا `Projects`).'
      answer: 'cd /d D:\Projects'
      explain: '`cd` پوشه را عوض می‌کند، `/d` اجازه می‌دهد Drive هم عوض شود و `D:\Projects` مقصد کامل است؛ پس با یک دستور به آنجا می‌رسی.'
    - id: P14b
      start: 'C:\Users\Student'
      task: 'به USB (Drive E) برو، محتوایش را ببین و دوباره به Drive C برگرد.'
      multi: true
      checks: [{type: drive, value: C}, {type: any, of: [{type: argIncludes, cmd: drive, value: 'E:'}, {type: argIncludes, cmd: cd, value: 'E:'}, {type: argIncludes, cmd: pushd, value: 'E:'}]}, {type: anyCmd, value: dir}]
      hints:
        - 'سه قدم: رفتن به Drive E، دیدن محتوای آن، و برگشتن به Drive C. برای عوض کردن Drive فقط حرف آن و دو نقطه لازم است.'
        - 'خط ۱: حرف Drive USB با دو نقطه. خط ۲: Command دیدن محتوا. خط ۳: حرف Drive اصلی Windows با دو نقطه.'
      answer: ['E:', 'dir', 'C:']
      explain: '`E:` به USB می‌رود، `dir` محتوای آن را نشان می‌دهد و `C:` تو را به Drive C برمی‌گرداند؛ همان پوشه‌ای که قبلاً روی C بودی.'
  quiz:
    - kind: predict
      q: 'الان در `C:\Users\Student` هستی. بعد از این دستور، Prompt چه نشان می‌دهد؟'
      code: 'cd D:\Backup'
      options: ['C:\Users\Student>', 'D:\Backup>', 'D:\>', 'خطا می‌دهد']
      answer: 0
      code_options: true
      explain: 'بدون `/d` فقط مسیر Drive D عوض می‌شود و تو روی C می‌مانی.'
    - kind: type
      q: 'با یک دستور به `D:\Backup` برو.'
      accept: ['cd /d d:\backup', 'chdir /d d:\backup', 'pushd d:\backup']
      show: 'cd /d D:\Backup'
      explain: '`/d` یعنی Drive را هم عوض کن.'
    - kind: order
      q: 'برای رفتن به USB، دیدن محتوا و برگشتن به C، این دستورها را مرتب کن.'
      items: ['E:', 'dir', 'C:']
      explain: 'اول Drive را عوض کن، بعد کار کن، بعد برگرد.'
  recap: '`D:` = رفتن به Drive. `cd /d مسیر` = Drive + پوشه با هم. هر Drive مسیر خودش را یادش می‌ماند.'

