      checks: [{type: dirExists, path: 'C:\Users\Student\Documents\Restaurant'}]
      hints:
        - 'برای ساختن Folder از `mkdir` (Make Directory) استفاده کن و نام پوشه جدید را به‌عنوان Argument بده.'
        - 'دو بخش: چه کاری؟ (`mkdir`) چه چیزی؟ (نام پوشه جدید: Restaurant). پوشه داخل Current Directory، یعنی Documents، ساخته می‌شود.'
      answer: 'mkdir Restaurant'
      explain: '`mkdir` پوشه می‌سازد و `Restaurant` نام آن است؛ چون Path نسبی است، پوشه داخل `C:\Users\Student\Documents` ساخته می‌شود.'
    - id: P18b
