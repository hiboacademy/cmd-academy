- n: 19
  term: echo
  fullForm: 'Echo'
  difficulty: 1
  objective: 'متن دلخواه چاپ کنی و برای ساختن فایل آماده شوی.'
  summary: '`echo` هر متنی که بعدش بنویسی را نمایش می‌دهد. `echo.` یک خط خالی چاپ می‌کند.'
  meaning: '`echo` در Scriptها برای پیام دادن به کاربر استفاده می‌شود. در درس ۲۸ می‌بینی که با `>` می‌شود خروجی آن را در فایل نوشت.'
  usage: 'نمایش پیام، ساختن فایل متنی ساده (با `>`)، و نمایش مقدار متغیرها.'
  syntax: "echo message\necho."
  demo:
    cmds: ['echo Hello CMD Academy', 'echo.', 'echo Bye!']
  examples:
    - c: 'echo Welcome to my restaurant'
      d: 'نمایش یک جمله.'
    - c: 'echo.'
      d: 'یک خط خالی.'
    - c: 'echo'
      d: 'بدون متن، وضعیت echo را نشان می‌دهد: `ECHO is on.`'
  mistakes:
    - 'فاصله بین `echo` و نقطه: `echo .` یک نقطه چاپ می‌کند، نه خط خالی.'
    - 'گذاشتن Quotes بی‌دلیل: `echo "Hi"` خود Quoteها را هم چاپ می‌کند.'
  tip: 'متن فارسی هم با `echo` چاپ می‌شود، ولی خود دستورها همیشه انگلیسی‌اند.'
  practice:
    - id: P19a
      start: 'C:\Users\Student'
      task: 'جمله `Welcome to CMD Academy` را چاپ کن.'
      checks: [{type: cmd, value: echo}, {type: argIncludes, value: 'welcome to cmd academy'}]
      hints:
        - 'برای چاپ متن از `echo` استفاده کن. هر چیزی که بعد از آن بنویسی، حتی چند کلمه با Space، همان‌طور چاپ می‌شود.'
        - 'دو بخش: چه کاری؟ (`echo`) چه متنی؟ (کل جمله Welcome to CMD Academy). Quotes لازم نیست؛ اگر بگذاری، خود `"` هم چاپ می‌شود.'
      answer: 'echo Welcome to CMD Academy'
      explain: '`echo` هر چیزی را که بعدش آمده، اینجا کل جمله `Welcome to CMD Academy`، روی صفحه چاپ می‌کند.'
    - id: P19b
      start: 'C:\Users\Student'
      task: 'یک خط خالی چاپ کن.'
      checks: [{type: cmd, value: echo}, {type: noArgs}, {type: not, check: {type: lastOutputIncludes, value: 'ECHO is'}}]
      hints:
        - '`echo` بدون متن، به‌جای خط خالی می‌نویسد `ECHO is on.` برای خط خالی، باید بلافاصله بعد از `echo`، بدون Space، یک علامت کوچک بگذاری.'
        - 'یک کلمه: `echo` و چسبیده به آن یک نقطه (`.`). بین `echo` و نقطه Space نگذار.'
      answer: 'echo.'
      explain: '`echo.` یعنی «هیچ متنی چاپ نکن جز یک خط خالی». نقطه چسبیده نمی‌گذارد CMD وضعیت `ECHO is on.` را نشان دهد.'
  quiz:
    - kind: predict
      q: 'خروجی این دستور چیست؟'
      code: 'echo "Hi"'
      options: ['"Hi"', 'Hi', 'خطا', 'خط خالی']
      answer: 0
      code_options: true
      explain: '`echo` Quoteها را هم چاپ می‌کند.'
    - kind: mcq
      q: 'کدام دستور یک خط خالی چاپ می‌کند؟'
      options: ['echo.', 'echo', 'echo off', 'echo " "']
      answer: 0
      code_options: true
      explain: '`echo` تنها، پیام `ECHO is on.` را نشان می‌دهد.'
    - kind: type
      q: 'کلمه `Ready` را چاپ کن.'
      accept: ['echo ready']
      show: 'echo Ready'
      explain: '`echo Ready`'
  recap: '`echo متن` = چاپ متن. `echo.` = خط خالی.'

