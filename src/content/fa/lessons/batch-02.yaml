- n: 18
  term: mkdir
  fullForm: 'Make Directory'
  difficulty: 1
  objective: 'پوشه جدید، چند پوشه و پوشه‌های تودرتو بسازی.'
  summary: '`mkdir` (یا کوتاه‌تر `md`) یک پوشه جدید در جایی که مشخص کنی می‌سازد.'
  meaning: 'با یک نام، پوشه در Current Directory ساخته می‌شود. با Path کامل، هر جا که بخواهی. پوشه‌های میانی هم خودکار ساخته می‌شوند.'
  usage: 'آماده کردن پوشه برای پروژه، Backup یا مرتب کردن فایل‌ها.'
  syntax: 'mkdir [drive:]path'
  demo:
    start: 'C:\Users\Student\Documents'
