        - 'دو بخش: چه کاری؟ (`mkdir`) چه چیزی؟ (یک Path سه‌تکه: `Projects`، بعد `Web`، بعد `Images`، با `\` بین هر کدام).'
      answer: 'mkdir Projects\Web\Images'
      explain: '`mkdir Projects\Web\Images` همه پوشه‌های این Path را که وجود ندارند، به ترتیب و تودرتو، با یک دستور می‌سازد.'
