      d: 'یک پوشه در پوشه فعلی.'
    - c: 'md Menu Orders'
      d: 'دو پوشه: Menu و Orders.'
    - c: 'mkdir Projects\Web\Images'
      d: 'سه سطح پوشه با یک دستور.'
