  difficulty: 1
  objective: 'محتوای فایل‌های متنی را در CMD بخوانی.'
  summary: '`type` محتوای یک فایل متنی را روی صفحه چاپ می‌کند، بدون اینکه آن را باز یا تغییر دهد.'
  meaning: 'برای فایل‌های متنی مثل `.txt`، `.bat`، `.ini` و `.log` مناسب است. برای عکس یا برنامه کاراکترهای نامفهوم نشان می‌دهد.'
  usage: 'خواندن سریع یادداشت، تنظیمات، Log و بعداً Batch Scriptها.'
  syntax: 'type [drive:][path]filename'
  demo:
    start: 'C:\Users\Student\Documents'
    cmds: ['type todo.txt']
  examples:
    - c: 'type todo.txt'
      d: 'نمایش محتوای todo.txt.'
    - c: 'type Documents\menu.txt'
      at: 'C:\Users\Student'
      d: 'خواندن فایل در پوشه دیگر با Path نسبی.'
    - c: 'type C:\Windows\win.ini'
      d: 'خواندن با Path مطلق.'
  mistakes:
    - 'ننوشتن Extension: `type todo` فایل را پیدا نمی‌کند؛ درست `type todo.txt` است.'
    - '`type` روی پوشه: خطای `Access is denied.`'
  tip: 'اگر فایل خیلی طولانی است، در درس ۳۴ با `more` صفحه‌به‌صفحه می‌خوانیمش.'
  practice:
    - id: P20a
      start: 'C:\Users\Student\Documents'
      task: 'محتوای فایل `menu.txt` را نمایش بده.'
      checks: [{type: cmd, value: type}, {type: ok}, {type: argIncludes, value: 'menu.txt'}]
      hints:
        - 'برای نمایش محتوای یک فایل متنی از `type` استفاده کن و نام کامل فایل را، همراه Extension، به آن بده.'
        - 'دو بخش: چه کاری؟ (`type`) روی چه فایلی؟ (نام menu با Extension `.txt`). فایل در Current Directory است، پس نامش کافی است.'
      answer: 'type menu.txt'
      explain: '`type` محتوای فایل را روی صفحه چاپ می‌کند و `menu.txt` فایلی است که در همین پوشه Documents قرار دارد.'
    - id: P20b
      start: 'C:\Users\Student'
      task: 'بدون رفتن به Desktop، محتوای `notes.txt` داخل Desktop را نمایش بده.'
      checks: [{type: cmd, value: type}, {type: ok}, {type: argIncludes, value: 'notes.txt'}, {type: cwd, value: 'C:\Users\Student'}]
      hints:
        - 'فایل داخل پوشه Desktop است، ولی تو در `C:\Users\Student` هستی. به‌جای رفتن به Desktop، به `type` یک Relative Path بده.'
        - 'دو بخش: چه کاری؟ (`type`) روی چه چیزی؟ (Path: نام پوشه `Desktop`، جداکننده `\`، بعد نام فایل `notes.txt`).'
      answer: 'type Desktop\notes.txt'
      explain: '`type` فایل را می‌خواند و `Desktop\notes.txt` از Current Directory حساب می‌شود؛ پس فایل نمایش داده می‌شود و تو جابه‌جا نمی‌شوی.'
  quiz:
    - kind: mcq
      q: '`type` روی کدام فایل نتیجه قابل خواندن می‌دهد؟'
      options: ['notes.txt', 'beach.jpg', 'setup.exe', 'song.mp3']
      answer: 0
      code_options: true
      explain: '`type` برای فایل‌های متنی است.'
    - kind: fix
      q: 'فایل `report.txt` وجود دارد، ولی این دستور خطا می‌دهد. چرا؟'
      code: "type report\nThe system cannot find the file specified."
      options: ['Extension (`.txt`) نوشته نشده', '`type` اشتباه است', 'باید `cd report` زد', 'فایل خراب است']
      answer: 0
      explain: 'نام کامل فایل لازم است: `type report.txt`'
    - kind: type
      q: 'محتوای `todo.txt` را نمایش بده.'
      accept: ['type todo.txt', 'type .\todo.txt']
      explain: '`type todo.txt`'
  recap: '`type فایل` = خواندن فایل متنی. نام کامل با Extension را بنویس.'
