      hints:
        - 'نام پوشه یک Space دارد؛ CMD آن را دو تکه جدا می‌بیند. باید کل نام را داخل Quotes (`" "`) بگذاری تا یک Argument حساب شود.'
        - 'دو بخش: چه کاری؟ (`cd`) به کجا؟ (کل نام پوشه، یعنی Summer و Space و 2026، داخل یک جفت `"`).'
      answer: 'cd "Summer 2026"'
      explain: '`cd` پوشه را عوض می‌کند و `"Summer 2026"` داخل Quotes است، پس CMD آن را یک نام کامل می‌بیند، نه دو Argument جدا.'
    - id: P17b
