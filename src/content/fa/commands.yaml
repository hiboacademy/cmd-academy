    summary: 'تاریخ سیستم را نشان می‌دهد.'
    syntax: 'date /t'
    examples:
      - {c: 'date /t', d: 'فقط نمایش تاریخ.'}
      - {c: 'echo %DATE%', d: 'تاریخ از متغیر DATE.'}
    related: [time]
    keywords: ['تاریخ', 'امروز']

  - name: time
