# ---------------- processes ----------------
  - name: tasklist
    category: processes
    level: 2
    full: 'Task list'
    summary: 'برنامه‌ها و Process‌های در حال اجرا را با PID و مصرف حافظه نشان می‌دهد.'
    syntax: 'tasklist [/fi "filter"] [/svc] [/v] [/fo table|list|csv]'
    switches:
      - {s: '/fi', d: 'فیلتر: `/fi "imagename eq chrome.exe"` یا `/fi "status eq not responding"`.'}
      - {s: '/svc', d: 'سرویس‌های داخل هر Process.'}
      - {s: '/v', d: 'جزئیات بیشتر، مثل وضعیت.'}
      - {s: '/fo', d: 'فرمت خروجی.'}
    examples:
      - {c: 'tasklist', d: 'همه Process‌ها.'}
      - {c: 'tasklist | find /i "chrome"', d: 'فقط chrome.'}
      - {c: 'tasklist /fi "status eq not responding"', d: 'برنامه‌های هنگ‌کرده.'}
    related: [taskkill, systeminfo]
    keywords: ['task manager', 'برنامه‌های باز', 'process', 'pid']

  - name: taskkill
    category: processes
    level: 2
    danger: danger
    full: 'Kill a task'
    summary: 'یک برنامه را با نام یا PID می‌بندد.'
    details: 'بدون `/f` به برنامه پیام بستن داده می‌شود؛ برنامه هنگ‌کرده به آن جواب نمی‌دهد. Process‌های حیاتی Windows را نبند.'
    syntax: 'taskkill /im name.exe | /pid n [/f] [/t]'
    switches:
      - {s: '/im', d: 'بر اساس نام برنامه.'}
      - {s: '/pid', d: 'بر اساس شماره Process.'}
      - {s: '/f', d: 'بستن اجباری.'}
      - {s: '/t', d: 'همراه با Process‌های فرزند.'}
    examples:
      - {c: 'taskkill /im notepad.exe', d: 'بستن Notepad.'}
      - {c: 'taskkill /pid 7810 /f', d: 'بستن اجباری Spotify هنگ‌کرده.'}
      - {c: 'taskkill /im chrome.exe /f /t', d: 'بستن همه پنجره‌های Chrome.'}
    warning: 'کارهای ذخیره‌نشده آن برنامه از بین می‌روند. بستن Process‌هایی مثل csrss یا winlogon سیستم را از کار می‌اندازد.'
    related: [tasklist]
    keywords: ['بستن برنامه', 'kill', 'هنگ']

