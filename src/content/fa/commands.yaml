  - name: color
    category: console
    level: 2
    full: 'Console colors'
    summary: 'رنگ پس‌زمینه و متن CMD را عوض می‌کند.'
    details: 'دو رقم Hex: اولی پس‌زمینه و دومی متن. `0` سیاه، `a` سبز روشن، `e` زرد، `c` قرمز روشن، `f` سفید. `color` تنها رنگ پیش‌فرض را برمی‌گرداند.'
    syntax: 'color [bg][fg]'
    examples:
      - {c: 'color 0a', d: 'متن سبز روی سیاه.'}
      - {c: 'color', d: 'برگشت به رنگ پیش‌فرض.'}
    related: [title, prompt]
    keywords: ['رنگ']

  - name: prompt
    category: console
    level: 2
    full: 'Change prompt'
    summary: 'شکل Prompt را عوض می‌کند.'
    details: '`$P` مسیر فعلی، `$G` علامت `>`، `$T` ساعت و `$D` تاریخ است. `prompt` تنها، Prompt پیش‌فرض را برمی‌گرداند.'
    syntax: 'prompt [text]'
    examples:
      - {c: 'prompt $T $P$G', d: 'ساعت قبل از مسیر.'}
      - {c: 'prompt', d: 'برگشت به حالت عادی.'}
    related: [title, set]
    keywords: ['پرامپت']

  - name: set
    category: console
    level: 2
    full: 'Environment variables'
    summary: 'متغیرها را می‌سازد، تغییر می‌دهد یا نمایش می‌دهد.'
    details: 'دور `=` فاصله نگذار: `set name=Ali`. مقدار متغیر با `%name%` خوانده می‌شود. `/a` محاسبه عددی و `/p` گرفتن ورودی از کاربر است.'
    syntax: 'set [name[=value]]  ·  set /a expr  ·  set /p name=prompt'
    switches:
      - {s: '/a', d: 'محاسبه: `set /a total=5*3`.'}
      - {s: '/p', d: 'پرسیدن از کاربر: `set /p name=Your name: `'}
    examples:
      - {c: 'set', d: 'همه متغیرها.'}
      - {c: 'set user', d: 'متغیرهایی که با user شروع می‌شوند.'}
      - {c: 'set "city=Tehran" & set city', d: 'ساختن متغیر و دیدن مقدارش. کوتیشن جلوی Space اضافه آخر مقدار را می‌گیرد. در خط بعد با `echo %city%` بخوانش.'}
      - {c: 'set /a 12*4+2', d: 'محاسبه عددی.'}
    related: [echo, path, setlocal, if]
    keywords: ['متغیر', 'variable', 'محیط']

  - name: path
    category: console
    level: 2
    full: 'Search path'
    summary: 'فهرست پوشه‌هایی که CMD برای پیدا کردن برنامه‌ها می‌گردد.'
    details: 'وقتی نام یک برنامه را می‌نویسی، CMD اول پوشه فعلی و بعد پوشه‌های PATH را می‌گردد. تغییر PATH در CMD فقط برای همان پنجره است.'
    syntax: 'path [dir;dir...]  ·  path %PATH%;newdir'
    examples:
      - {c: 'path', d: 'نمایش PATH.'}
      - {c: 'echo %PATH%', d: 'همان مقدار، با echo.'}
      - {c: 'path %PATH%;D:\Projects', d: 'افزودن یک پوشه به PATH (فقط این پنجره).'}
    related: [where, set]
    lessons: [48]
    keywords: ['مسیر برنامه‌ها', 'environment']

  - name: date
    category: console
    level: 1
