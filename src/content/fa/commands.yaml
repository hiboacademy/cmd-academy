    switches:
      - {s: '/s', d: 'خاموش کردن.'}
      - {s: '/r', d: 'Restart.'}
      - {s: '/t sec', d: 'تأخیر به ثانیه.'}
      - {s: '/a', d: 'لغو خاموشی زمان‌بندی‌شده.'}
    examples:
      - {c: 'shutdown /s /t 600', d: 'خاموشی ۱۰ دقیقه دیگر.'}
      - {c: 'shutdown /r /t 60 & shutdown /a', d: 'زمان‌بندی Restart و لغو آن.'}
    warning: 'روی کامپیوتر واقعی، کارهای ذخیره‌نشده از بین می‌روند.'
