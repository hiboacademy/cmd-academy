    related: [date]
    keywords: ['ساعت', 'زمان']

  - name: doskey
    category: console
    level: 2
    full: 'Command history'
    summary: 'تاریخچه دستورهای این پنجره را نشان می‌دهد.'
    details: 'کلید ↑ دستور قبلی را برمی‌گرداند. `doskey /history` همه را با هم نشان می‌دهد.'
    syntax: 'doskey /history'
    examples:
      - {c: 'echo one & doskey /history', d: 'دیدن تاریخچه.'}
