      - {s: '/release /renew', d: 'پس دادن و گرفتن دوباره IP از Router.'}
      - {s: '/flushdns', d: 'پاک کردن DNS Cache.'}
      - {s: '/displaydns', d: 'نمایش DNS Cache.'}
    examples:
      - {c: 'ipconfig', d: 'IP و Gateway.'}
      - {c: 'ipconfig /all', d: 'جزئیات کامل.'}
      - {c: 'ipconfig | find "IPv4"', d: 'فقط IP.'}
      - {c: 'ipconfig /flushdns', d: 'وقتی سایتی با آدرس قدیمی باز می‌شود.'}
    related: [ping, getmac, nslookup, arp]
    keywords: ['آی‌پی', 'ip', 'شبکه', 'gateway']

  - name: ping
    category: network
    level: 2
    full: 'Packet INternet Groper'
    summary: 'بررسی می‌کند یک دستگاه یا سایت در دسترس است یا نه و زمان پاسخ چقدر است.'
    details: '`Reply from` یعنی ارتباط برقرار است. `Request timed out` یعنی پاسخی نیامد و `could not find host` یعنی نام پیدا نشد (مشکل DNS).'
    syntax: 'ping [-n count] [-t] [-l size] [-a] host'
    switches:
      - {s: '-n', d: 'تعداد بسته‌ها (پیش‌فرض 4).'}
      - {s: '-t', d: 'بی‌وقفه تا Ctrl+C.'}
      - {s: '-l', d: 'اندازه بسته.'}
      - {s: '-a', d: 'نام دستگاه را از روی IP پیدا کن.'}
    examples:
      - {c: 'ping google.com', d: 'آیا اینترنت کار می‌کند؟'}
      - {c: 'ping -n 2 192.168.1.1', d: 'دو بسته به Router.'}
      - {c: 'ping 10.0.0.99', d: 'دستگاهی که جواب نمی‌دهد.'}
    related: [tracert, pathping, ipconfig, nslookup]
    keywords: ['اینترنت', 'اتصال', 'تست شبکه']

  - name: tracert
    category: network
    level: 3
    full: 'Trace route'
    summary: 'مسیر بسته‌ها تا مقصد را مرحله به مرحله (Hop) نشان می‌دهد.'
    syntax: 'tracert [-d] [-h max] host'
    switches:
      - {s: '-d', d: 'نام Hop‌ها را پیدا نکن (سریع‌تر).'}
      - {s: '-h', d: 'حداکثر تعداد Hop.'}
    examples:
      - {c: 'tracert google.com', d: 'مسیر تا Google.'}
      - {c: 'tracert -d -h 5 google.com', d: 'سریع و حداکثر ۵ مرحله.'}
    related: [ping, pathping]
    keywords: ['مسیر شبکه', 'hop', 'traceroute']

  - name: pathping
    category: network
    level: 3
    full: 'Path ping'
    summary: 'ترکیب `tracert` و `ping`: درصد از دست رفتن بسته در هر Hop.'
    syntax: 'pathping host'
    examples:
      - {c: 'pathping google.com', d: 'کجای مسیر بسته گم می‌شود؟'}
    related: [tracert, ping]
    keywords: ['packet loss']

  - name: nslookup
    category: network
    level: 3
    full: 'Name server lookup'
    summary: 'از DNS می‌پرسد یک نام دامنه چه IP دارد.'
    syntax: 'nslookup name [server]'
    examples:
      - {c: 'nslookup google.com', d: 'IP سایت Google.'}
      - {c: 'nslookup google.com 8.8.8.8', d: 'پرسیدن از DNS گوگل.'}
    related: [ping, ipconfig]
    keywords: ['dns', 'دامنه']

  - name: netstat
    category: network
    level: 3
    full: 'Network statistics'
    summary: 'اتصال‌های شبکه و Port‌های باز را نشان می‌دهد.'
    syntax: 'netstat [-a] [-n] [-o] [-b] [-r]'
    switches:
      - {s: '-a', d: 'همه اتصال‌ها و Port‌های در حال گوش دادن.'}
      - {s: '-n', d: 'عدد به‌جای نام (سریع‌تر).'}
      - {s: '-o', d: 'PID برنامه صاحب اتصال.'}
      - {s: '-b', d: 'نام برنامه (Admin لازم است).'}
      - {s: '-r', d: 'جدول Route.'}
    examples:
      - {c: 'netstat -an', d: 'همه اتصال‌ها با عدد.'}
      - {c: 'netstat -ano | find "LISTENING"', d: 'Port‌های باز و PID.'}
    related: [tasklist, route]
    keywords: ['پورت', 'port', 'اتصال']

  - name: arp
    category: network
    level: 3
    full: 'Address Resolution Protocol'
    summary: 'جدول IP به MAC دستگاه‌های شبکه محلی.'
    syntax: 'arp -a'
    examples:
      - {c: 'arp -a', d: 'دستگاه‌هایی که اخیراً با آن‌ها ارتباط داشتی.'}
    related: [getmac, ipconfig]
    keywords: ['mac', 'شبکه محلی']

  - name: route
    category: network
    level: 3
    full: 'Routing table'
    summary: 'جدول مسیریابی را نشان می‌دهد.'
    syntax: 'route print'
    examples:
      - {c: 'route print', d: 'جدول Route و Gateway پیش‌فرض.'}
    related: [netstat, ipconfig]
    keywords: ['مسیریابی', 'gateway']

  - name: getmac
    category: network
    level: 2
    full: 'Get MAC address'
    summary: 'آدرس MAC کارت‌های شبکه را نشان می‌دهد.'
    syntax: 'getmac [/v]'
    examples:
      - {c: 'getmac', d: 'MAC کارت‌ها.'}
      - {c: 'getmac /v', d: 'همراه با نام کارت شبکه.'}
    related: [ipconfig, arp]
    keywords: ['mac', 'آدرس فیزیکی']

# ---------------- disk ----------------
  - name: vol
    category: disk
    level: 1
    full: 'Volume'
    summary: 'نام (Label) و شماره سریال یک Drive را نشان می‌دهد.'
    syntax: 'vol [drive:]'
    examples:
      - {c: 'vol', d: 'Drive فعلی.'}
      - {c: 'vol E:', d: 'Drive فلش.'}
    related: [label, chkdsk]
    keywords: ['درایو', 'label']

  - name: label
    category: disk
    level: 2
    danger: caution
    full: 'Volume label'
    summary: 'نام یک Drive را عوض می‌کند. دسترسی Administrator لازم است.'
    syntax: 'label [drive:] [name]'
    examples:
      - {c: 'label E: BACKUP', d: 'تغییر نام فلش به BACKUP.', mode: admin}
    related: [vol, format]
    keywords: ['نام درایو']

  - name: chkdsk
    category: disk
    level: 3
    danger: caution
    full: 'Check Disk'
    summary: 'File System یک Drive را بررسی و خطاهایش را تعمیر می‌کند.'
    details: 'بدون Switch فقط گزارش می‌دهد. `/f` تعمیر می‌کند و برای Drive سیستم (C:) کار را به Restart بعدی موکول می‌کند. دسترسی Admin لازم است.'
    syntax: 'chkdsk [drive:] [/f] [/r]'
    switches:
      - {s: '/f', d: 'تعمیر خطاها.'}
      - {s: '/r', d: 'پیدا کردن Bad Sector و بازیابی اطلاعات (طولانی).'}
    examples:
      - {c: 'chkdsk E:', d: 'فقط بررسی فلش.', mode: admin}
      - {c: 'chkdsk E: /f', d: 'بررسی و تعمیر فلش.', mode: admin}
    warning: 'وسط `chkdsk /r` کامپیوتر را خاموش نکن.'
    related: [sfc, vol]
    keywords: ['تعمیر دیسک', 'خطای دیسک']

  - name: sfc
    category: disk
    level: 3
    full: 'System File Checker'
    summary: 'فایل‌های سیستمی Windows را بررسی و فایل‌های خراب را تعمیر می‌کند.'
    syntax: 'sfc /scannow | /verifyonly'
    switches:
      - {s: '/scannow', d: 'بررسی و تعمیر.'}
      - {s: '/verifyonly', d: 'فقط بررسی.'}
    examples:
      - {c: 'sfc /scannow', d: 'بررسی و تعمیر فایل‌های سیستمی.', mode: admin}
    related: [dism, chkdsk]
    keywords: ['تعمیر ویندوز', 'فایل سیستمی خراب']

  - name: dism
    category: disk
    level: 3
    full: 'Deployment Image Servicing and Management'
    summary: 'Image ویندوز (منبع تعمیر `sfc`) را بررسی و تعمیر می‌کند.'
    details: 'وقتی `sfc` نمی‌تواند فایل‌ها را تعمیر کند، اول DISM را اجرا کن و بعد دوباره `sfc`. RestoreHealth به اینترنت نیاز دارد.'
    syntax: 'dism /online /cleanup-image /checkhealth | /scanhealth | /restorehealth'
    examples:
      - {c: 'dism /online /cleanup-image /checkhealth', d: 'بررسی سریع.', mode: admin}
      - {c: 'dism /online /cleanup-image /restorehealth', d: 'تعمیر Image.', mode: admin}
    related: [sfc]
    keywords: ['تعمیر ویندوز', 'image']

  - name: format
    category: disk
    level: 3
    danger: danger
    full: 'Format'
    summary: 'یک Drive را فرمت می‌کند: همه اطلاعاتش پاک می‌شود.'
    syntax: 'format drive: [/fs:ntfs|fat32|exfat] [/q] [/v:label]'
    switches:
      - {s: '/fs:', d: 'نوع File System.'}
      - {s: '/q', d: 'Quick Format.'}
      - {s: '/v:', d: 'نام Drive.'}
    examples:
      - {c: 'format E: /fs:exfat /q /v:USB', d: 'فرمت سریع فلش (در Simulator).', mode: admin}
    warning: 'همه فایل‌های آن Drive پاک می‌شوند. قبل از Enter، حرف Drive را دوباره با `vol` بررسی کن.'
    related: [diskpart, label, vol]
    keywords: ['فرمت', 'پاک کردن فلش']

  - name: diskpart
    category: disk
    level: 3
    danger: danger
    full: 'Disk partitioning'
    summary: 'ابزار تعاملی مدیریت دیسک و پارتیشن.'
    details: 'بعد از اجرا، Prompt به `DISKPART>` تغییر می‌کند. ترتیب کار: `list disk` ← `select disk N` ← `detail disk` ← دستور. `clean` همه پارتیشن‌های دیسک انتخاب‌شده را پاک می‌کند. با `exit` خارج شو.'
    syntax: 'diskpart  →  list disk | select disk n | list volume | clean | create partition primary | format fs=ntfs quick | assign letter=x | exit'
    examples:
      - {c: 'diskpart', d: 'ورود به DiskPart.', mode: admin}
    warning: 'انتخاب دیسک اشتباه و `clean` یعنی از دست رفتن همه اطلاعات آن دیسک. همیشه قبلش `detail disk` بزن.'
    related: [format, chkdsk]
    keywords: ['پارتیشن', 'partition', 'دیسک']

  - name: bootrec
    category: disk
    level: 3
    danger: danger
    full: 'Boot recovery'
    summary: 'تعمیر بوت Windows؛ فقط در محیط Recovery.'
    syntax: 'bootrec /fixmbr | /fixboot | /scanos | /rebuildbcd'
    switches:
      - {s: '/scanos', d: 'جست‌وجوی نصب‌های Windows.'}
      - {s: '/rebuildbcd', d: 'ساختن دوباره فهرست بوت.'}
      - {s: '/fixmbr', d: 'نوشتن MBR جدید.'}
      - {s: '/fixboot', d: 'نوشتن Boot Sector جدید.'}
    examples:
      - {c: 'bootrec /scanos', d: 'پیدا کردن Windows.', mode: winre}
      - {c: 'bootrec /rebuildbcd', d: 'بازسازی BCD.', mode: winre}
    warning: 'فقط وقتی Windows بالا نمی‌آید و مطمئنی مشکل از بوت است.'
    related: [bcdboot, bcdedit, diskpart]
    keywords: ['بوت', 'ویندوز بالا نمی‌آید', 'recovery']

  - name: bcdboot
    category: disk
    level: 3
    danger: danger
    full: 'Boot files'
    summary: 'فایل‌های بوت را از روی پوشه Windows دوباره می‌سازد.'
    syntax: 'bcdboot C:\Windows [/s drive:]'
    examples:
      - {c: 'bcdboot C:\Windows', d: 'ساختن دوباره فایل‌های بوت.', mode: winre}
    related: [bootrec, bcdedit]
    keywords: ['بوت']

  - name: bcdedit
    category: disk
    level: 3
    danger: danger
    full: 'Boot configuration editor'
    summary: 'تنظیمات بوت (BCD) را نشان می‌دهد یا ویرایش می‌کند.'
    syntax: 'bcdedit [/enum]'
    examples:
      - {c: 'bcdedit', d: 'نمایش تنظیمات بوت.', mode: admin}
    warning: 'ویرایش اشتباه BCD باعث می‌شود Windows بالا نیاید.'
    related: [bootrec, bcdboot]
    keywords: ['بوت', 'bcd']

# ---------------- batch ----------------
  - name: rem
    category: batch
    level: 2
    full: 'Remark'
    summary: 'توضیح (Comment) در Batch Script؛ اجرا نمی‌شود.'
    details: '`::` هم برای توضیح استفاده می‌شود، ولی داخل پرانتز `rem` امن‌تر است.'
    syntax: 'rem text  ·  :: text'
    examples:
      - {c: 'rem This line does nothing', d: 'هیچ خروجی ندارد.'}
    related: [echo, pause]
    keywords: ['توضیح', 'comment']

  - name: pause
    category: batch
    level: 2
    full: 'Pause'
    summary: 'Script را متوقف می‌کند تا کاربر کلیدی بزند.'
    syntax: 'pause  ·  pause > nul'
    examples:
      - {c: 'pause', d: 'Press any key to continue . . .'}
      - {c: 'echo Press a key to start & pause > nul', d: 'متن خودت، بدون پیام پیش‌فرض.'}
    related: [timeout, choice]
    keywords: ['توقف', 'منتظر کلید']

  - name: if
    category: batch
    level: 3
    full: 'Conditional'
    summary: 'اگر شرطی درست باشد، دستوری را اجرا می‌کند.'
    details: 'شرط‌ها: `exist file`، `"%a%"=="%b%"`، `defined var`، `errorlevel n` و مقایسه عددی با `equ neq lss leq gtr geq`. `/i` حساسیت به حروف را برمی‌دارد. `else` باید روی همان خط پرانتز بسته باشد: `) else (`.'
    syntax: 'if [/i] [not] condition command [else command]'
    switches:
      - {s: '/i', d: 'مقایسه متن بدون حساسیت به حروف.'}
      - {s: 'not', d: 'برعکس کردن شرط.'}
    examples:
      - {c: 'if exist Desktop\notes.txt echo Found', d: 'آیا فایل وجود دارد؟'}
      - {c: 'if 7 gtr 5 echo big', d: 'مقایسه عددی با `gtr` (بزرگ‌تر از).'}
      - {c: 'if /i "YES"=="yes" (echo same) else (echo different)', d: 'مقایسه متن با else.'}
      - {c: 'if not defined city echo city is empty', d: 'آیا متغیر تعریف شده؟'}
    related: [goto, set, for, choice]
    keywords: ['شرط', 'اگر', 'else']

  - name: for
    category: batch
    level: 3
    full: 'Loop'
    summary: 'یک دستور را برای هر فایل، عدد، خط یا کلمه تکرار می‌کند.'
    details: 'در خط فرمان `%f` و در فایل Batch `%%f` بنویس. `/l` شمارش عددی، `/d` پوشه‌ها، `/r` همه زیرپوشه‌ها و `/f` خواندن خط‌های فایل یا خروجی یک دستور است.'
    syntax: 'for %v in (set) do command  ·  for /l %v in (start,step,end) do ...  ·  for /f "tokens=1,2 delims=," %v in (file) do ...'
    switches:
      - {s: '/l', d: 'شمارنده عددی.'}
      - {s: '/d', d: 'فقط پوشه‌ها.'}
      - {s: '/r', d: 'پیمایش زیرپوشه‌ها.'}
      - {s: '/f', d: 'خواندن خط‌ها و تقسیم آن‌ها با tokens و delims.'}
    examples:
      - {c: 'for %f in (Documents\*.txt) do @echo %f', d: 'هر فایل txt.'}
      - {c: 'for /l %i in (1,1,5) do @echo Table %i', d: 'شمارش ۱ تا ۵.'}
      - {c: 'for /d %d in (*) do @echo %d', d: 'همه پوشه‌ها.'}
      - {c: 'for /f "tokens=1" %a in (Documents\guests.txt) do @echo %a', d: 'اولین کلمه هر خط.'}
    related: [if, set, setlocal, call]
    keywords: ['حلقه', 'loop', 'تکرار']

  - name: goto
    category: batch
    level: 3
    full: 'Jump to label'
    summary: 'اجرای Script را به یک Label (مثل `:menu`) می‌برد.'
    details: '`goto :eof` یعنی پایان Script یا تابع. با `goto` و `if` منو و حلقه می‌سازی.'
    syntax: 'goto label  ·  goto :eof'
    examples:
      - {c: 'goto /?', d: 'راهنما؛ `goto` فقط داخل فایل Batch معنا دارد.'}
    related: [call, if, choice]
    keywords: ['پرش', 'label', 'منو']

  - name: call
    category: batch
    level: 3
    full: 'Call'
    summary: 'یک Batch دیگر یا یک تابع (`:label`) را اجرا می‌کند و بعد برمی‌گردد.'
    syntax: 'call file.bat [args]  ·  call :label [args]'
    examples:
      - {c: 'call /?', d: 'راهنما.'}
    related: [goto, exit, shift]
    keywords: ['تابع', 'function', 'زیربرنامه']

  - name: shift
    category: batch
    level: 3
    full: 'Shift parameters'
    summary: 'پارامترهای `%1`، `%2`... را یکی به چپ می‌برد.'
    syntax: 'shift'
    examples:
      - {c: 'shift /?', d: 'راهنما؛ فقط داخل Batch معنا دارد.'}
    related: [call, for]
    keywords: ['پارامتر', 'argument']

  - name: setlocal
    aliases: [endlocal]
    category: batch
    level: 3
    full: 'Local variables'
    summary: 'تغییر متغیرها را محلی می‌کند و Delayed Expansion (`!var!`) را روشن می‌کند.'
    details: 'بعد از `endlocal` یا پایان Script، متغیرها به حالت قبل برمی‌گردند. داخل حلقه و پرانتز، برای خواندن مقدار جدید متغیر از `!var!` استفاده کن.'
    syntax: 'setlocal [enabledelayedexpansion]  ·  endlocal'
    examples:
      - {c: 'setlocal /?', d: 'راهنما.'}
    related: [set, for, if]
    keywords: ['delayed expansion', 'متغیر محلی']

  - name: choice
    category: batch
    level: 3
    full: 'Choice'
    summary: 'از کاربر می‌خواهد یکی از کلیدهای مشخص را بزند؛ شماره انتخاب در ErrorLevel می‌آید.'
    syntax: 'choice [/c keys] [/n] [/t sec /d key] [/m "text"]'
    switches:
      - {s: '/c', d: 'کلیدهای مجاز، مثل `/c ync`.'}
      - {s: '/m', d: 'متن سؤال.'}
      - {s: '/t /d', d: 'زمان انتظار و کلید پیش‌فرض.'}
      - {s: '/n', d: 'کلیدها را در سؤال نشان نده.'}
    examples:
      - {c: 'choice /c yn /m "Continue"', d: 'انتخاب بله یا نه.'}
      - {c: 'choice /c abc /t 5 /d a', d: 'اگر ۵ ثانیه جوابی نیامد، a.'}
    related: [if, timeout, set]
    keywords: ['منو', 'انتخاب', 'errorlevel']

  - name: timeout
    category: batch
    level: 2
    full: 'Timeout'
    summary: 'چند ثانیه صبر می‌کند (با کلیدی قطع می‌شود، مگر با `/nobreak`).'
    syntax: 'timeout /t sec [/nobreak]'
    examples:
      - {c: 'timeout /t 3', d: 'سه ثانیه صبر.'}
      - {c: 'timeout /t 3 /nobreak > nul', d: 'صبر بی‌صدا و غیرقابل قطع.'}
    related: [pause, choice]
    keywords: ['صبر', 'تأخیر', 'sleep']

# ---------------- operators ----------------
  - name: '>'
    category: operators
    engine: false
    level: 2
    full: 'Redirect output'
    summary: 'خروجی دستور را به‌جای صفحه در فایل می‌نویسد؛ فایل قبلی جایگزین می‌شود.'
    syntax: 'command > file'
    examples:
      - {c: 'dir /b > list.txt', d: 'فهرست نام‌ها در فایل.'}
      - {c: 'ipconfig > net.txt', d: 'ذخیره اطلاعات شبکه.'}
      - {c: 'echo test > nul', d: '`nul` یعنی دور ریختن خروجی.'}
    warning: 'اگر فایل وجود داشته باشد، محتوای قبلی‌اش پاک می‌شود.'
    related: ['>>', '<', '2>', echo]
    lessons: [28]
    keywords: ['redirect', 'ذخیره خروجی', 'نوشتن در فایل']

  - name: '>>'
    category: operators
    engine: false
    level: 2
    full: 'Append output'
    summary: 'خروجی را به آخر فایل اضافه می‌کند.'
    syntax: 'command >> file'
    examples:
      - {c: 'echo Day 1 >> log.txt', d: 'افزودن یک خط به گزارش.'}
      - {c: 'date /t >> log.txt', d: 'افزودن تاریخ.'}
    related: ['>', echo]
    lessons: [29]
    keywords: ['append', 'اضافه کردن']

  - name: '<'
    category: operators
    engine: false
    level: 2
    full: 'Redirect input'
    summary: 'محتوای فایل را به‌عنوان ورودی به دستور می‌دهد.'
    syntax: 'command < file'
    examples:
      - {c: 'sort < Documents\guests.txt', d: 'مرتب‌سازی با ورودی از فایل.'}
      - {c: 'find "Pizza" < Documents\menu.txt', d: 'جست‌وجو در ورودی.'}
    related: ['>', '|', sort]
    lessons: [36]
    keywords: ['ورودی', 'input']

  - name: '2>'
    category: operators
    engine: false
    level: 2
    full: 'Redirect errors'
    summary: 'پیام‌های خطا (stderr) را به فایل یا `nul` می‌فرستد.'
    details: '`2>&1` خطاها را به همان جای خروجی عادی می‌فرستد؛ مثلاً `> all.txt 2>&1`. `2>>` خطاها را به آخر فایل اضافه می‌کند.'
    syntax: 'command 2> file  ·  command > file 2>&1  ·  command 2>> file'
    examples:
      - {c: 'dir NoSuchFolder 2> errors.txt', d: 'خطا در فایل، نه روی صفحه.'}
      - {c: 'del nothing.txt 2> nul', d: 'پنهان کردن پیام خطا.'}
      - {c: 'dir Documents NoSuch > all.txt 2>&1', d: 'خروجی و خطا با هم در یک فایل.'}
    related: ['>', '>>', '||']
    lessons: [30]
    keywords: ['stderr', 'خطا', 'error']

  - name: '|'
    category: operators
    engine: false
    level: 2
    full: 'Pipe'
    summary: 'خروجی یک دستور را ورودی دستور بعدی می‌کند.'
    syntax: 'command1 | command2'
    examples:
      - {c: 'tasklist | find "chrome"', d: 'فیلتر Process‌ها.'}
      - {c: 'type Documents\guests.txt | sort', d: 'مرتب‌سازی محتوای فایل.'}
      - {c: 'dir /b /s *.txt | find /c /v ""', d: 'شمردن همه فایل‌های txt.'}
    related: [find, sort, more, clip]
    lessons: [33]
    keywords: ['pipe', 'لوله', 'زنجیر خروجی']

  - name: '&'
    category: operators
    engine: false
    level: 2
    full: 'Run both'
    summary: 'دو دستور را پشت سر هم اجرا می‌کند؛ نتیجه اولی مهم نیست.'
    syntax: 'command1 & command2'
    examples:
      - {c: 'cd Documents & dir /b', d: 'رفتن و دیدن محتوا.'}
    related: ['&&', '||']
    lessons: [31]
    keywords: ['چند دستور']

  - name: '&&'
    category: operators
    engine: false
    level: 2
    full: 'Run if success'
    summary: 'دستور دوم فقط اگر اولی موفق بود اجرا می‌شود.'
    syntax: 'command1 && command2'
    examples:
      - {c: 'mkdir Report && echo Created', d: 'پیام فقط اگر پوشه ساخته شد.'}
      - {c: 'cd /d D:\Backup && dir /b', d: 'دیدن محتوا فقط اگر رفتن موفق بود.'}
    related: ['&', '||', if]
    lessons: [31]
    keywords: ['اگر موفق', 'and']

  - name: '||'
    category: operators
    engine: false
    level: 2
    full: 'Run if failure'
    summary: 'دستور دوم فقط اگر اولی شکست خورد اجرا می‌شود.'
    syntax: 'command1 || command2'
    examples:
      - {c: 'type a.txt || echo a.txt is missing', d: 'فایل نیست، پس پیام دوم چاپ می‌شود.', expectError: true}
      - {c: 'ping -n 1 10.0.0.99 > nul || echo Device is offline', d: 'گزارش وقتی دستگاه جواب نمی‌دهد.'}
    related: ['&&', '&', '2>']
    lessons: [31]
    keywords: ['اگر شکست', 'or', 'خطا']

  - name: '*'
    aliases: ['?']
    category: operators
    engine: false
    level: 1
    full: 'Wildcards'
    summary: '`*` یعنی «هر چند حرف» و `?` یعنی «دقیقاً یک حرف» در نام فایل.'
    syntax: '*.txt  ·  report*.txt  ·  temp?.tmp  ·  *.*'
    examples:
      - {c: 'dir Documents\*.txt', d: 'همه فایل‌های txt.'}
      - {c: 'dir Downloads\temp?.tmp', d: 'temp1.tmp و temp2.tmp.'}
      - {c: 'dir Documents\Work\report*', d: 'هر چیزی که با report شروع شود.'}
    warning: 'با `del` و Wildcard همیشه اول همان الگو را با `dir` امتحان کن.'
    related: [dir, del, copy]
    lessons: [26, 27]
    keywords: ['wildcard', 'ستاره', 'الگو', 'همه فایل‌ها']
