      - {c: 'net start', d: 'سرویس‌های در حال اجرا.'}
      - {c: 'net stop spooler && net start spooler', d: 'Restart سرویس چاپ.', mode: admin}
      - {c: 'net use', d: 'Drive‌های شبکه وصل‌شده.'}
    related: [sc, whoami]
    keywords: ['کاربر', 'سرویس', 'اشتراک']

  - name: shutdown
