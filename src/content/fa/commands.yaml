      - {c: 'sc qc spooler', d: 'تنظیمات سرویس (نوع شروع).'}
      - {c: 'sc stop spooler', d: 'توقف سرویس چاپ.', mode: admin}
    warning: 'متوقف کردن سرویس‌های امنیتی یا سیستمی (مثل WinDefend) سیستم را ناامن یا ناپایدار می‌کند.'
    related: [net, tasklist]
    keywords: ['سرویس', 'service']

  - name: net
