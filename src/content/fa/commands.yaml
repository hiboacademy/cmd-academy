    syntax: 'start [program | file | "title" command]'
    examples:
      - {c: 'start notepad', d: 'باز کردن Notepad (در Simulator فقط پیام نشان داده می‌شود).'}
      - {c: 'start Documents', d: 'باز کردن پوشه در File Explorer.'}
    related: [cmd, tasklist]
    keywords: ['باز کردن برنامه', 'اجرا']

