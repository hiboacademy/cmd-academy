# Command Library
# Every example runs in a fresh Simulator at C:\Users\Student unless it has
# `at:` (start folder), `mode:` (admin | winre) or `noTry: true`.
# danger: caution = may change or overwrite data, danger = can destroy data or stop the system.
# engine: false = not a command (operators); no "open /? in sim" button.

categories:
  - {id: navigation, title: 'جابه‌جایی و دیدن'}
  - {id: files, title: 'فایل و پوشه'}
  - {id: text, title: 'متن و جست‌وجو'}
  - {id: console, title: 'محیط CMD'}
  - {id: system, title: 'سیستم و سرویس'}
  - {id: processes, title: 'برنامه‌ها و Process'}
  - {id: network, title: 'شبکه'}
  - {id: disk, title: 'دیسک و تعمیر'}
  - {id: batch, title: 'Batch Script'}
  - {id: operators, title: 'عملگرها'}

commands:
# ---------------- navigation ----------------
  - name: dir
    category: navigation
    level: 1
    full: 'Directory listing'
    summary: 'فهرست فایل‌ها و پوشه‌های یک پوشه را نشان می‌دهد.'
    details: 'بدون Argument، محتوای Current Directory را نشان می‌دهد. پوشه‌ها با `<DIR>` و فایل‌ها با اندازه به بایت مشخص می‌شوند. با Wildcard می‌توانی فقط بخشی از فایل‌ها را ببینی.'
    syntax: 'dir [path] [/w] [/b] [/s] [/a[:attr]] [/o[:order]]'
    switches:
      - {s: '/w', d: 'نمایش فشرده در چند ستون.'}
      - {s: '/b', d: 'فقط نام‌ها (Bare)، مناسب برای `>` و `for`.'}
      - {s: '/s', d: 'جست‌وجو در همه زیرپوشه‌ها.'}
      - {s: '/a', d: 'نمایش همه، حتی فایل‌های Hidden. `/a:d` فقط پوشه‌ها، `/a:h` فقط Hidden.'}
      - {s: '/o', d: 'مرتب‌سازی: `/o:n` نام، `/o:s` اندازه، `/o:d` تاریخ، `/o:-s` از بزرگ به کوچک.'}
    examples:
      - {c: 'dir', d: 'محتوای پوشه فعلی.'}
      - {c: 'dir Documents /b', d: 'فقط نام‌های داخل Documents.'}
      - {c: 'dir *.txt /s', d: 'همه فایل‌های txt در این پوشه و زیرپوشه‌ها.'}
      - {c: 'dir Documents /a:h', d: 'فایل‌های Hidden داخل Documents.'}
      - {c: 'dir Downloads /o:-s', d: 'فایل‌های Downloads از بزرگ به کوچک.'}
    related: [cd, tree, where, attrib]
    keywords: ['فهرست', 'لیست', 'ls', 'محتوا', 'پوشه']

  - name: cd
    aliases: [chdir]
    category: navigation
    level: 1
    full: 'Change Directory'
    summary: 'به پوشه دیگری می‌رود یا مسیر فعلی را نشان می‌دهد.'
    details: '`cd` تنها مسیر فعلی را چاپ می‌کند. `..` یعنی پوشه بالاتر و `\` یعنی ریشه Drive. برای رفتن هم‌زمان به Drive و پوشه دیگر از `/d` استفاده کن.'
    syntax: 'cd [/d] [drive:][path]'
    switches:
      - {s: '/d', d: 'Drive را هم عوض می‌کند، مثل `cd /d D:\Projects`.'}
      - {s: '..', d: 'یک پوشه بالاتر.'}
      - {s: '\', d: 'ریشه همین Drive.'}
    examples:
      - {c: 'cd Documents', d: 'رفتن به Documents (Relative Path).'}
      - {c: 'cd ..', d: 'رفتن به پوشه بالاتر.'}
      - {c: 'cd \', d: 'رفتن به ریشه Drive.'}
      - {c: 'cd /d D:\Projects', d: 'رفتن به Drive D و پوشه Projects با یک دستور.'}
      - {c: 'cd "Pictures\Summer 2026"', d: 'Path دارای Space داخل کوتیشن.'}
    related: [dir, pushd, popd, tree]
    keywords: ['رفتن', 'تغییر مسیر', 'پوشه بالا', 'مسیر فعلی']

  - name: pushd
    category: navigation
    level: 2
    full: 'Push Directory'
    summary: 'مسیر فعلی را به خاطر می‌سپارد و به پوشه جدید می‌رود.'
    details: 'با `popd` دقیقاً به همان جای قبلی برمی‌گردی؛ حتی اگر Drive عوض شده باشد. در Batch برای کار موقت در پوشه دیگر بسیار مفید است.'
    syntax: 'pushd [path]'
    examples:
      - {c: 'pushd D:\Backup', d: 'رفتن به D:\Backup و به خاطر سپردن مسیر قبلی.'}
      - {c: 'pushd Documents & dir /b & popd', d: 'سر زدن به Documents و برگشتن.'}
    related: [popd, cd]
    lessons: [14]
    keywords: ['برگشت', 'یادآوری مسیر']

  - name: popd
    category: navigation
    level: 2
    full: 'Pop Directory'
    summary: 'به مسیری که `pushd` به خاطر سپرده برمی‌گردد.'
    syntax: 'popd'
    examples:
      - {c: 'pushd E:\ & popd', d: 'رفتن به E: و برگشت به پوشه قبلی.'}
    related: [pushd, cd]
    lessons: [14]
    keywords: ['برگشت']

  - name: tree
    category: navigation
    level: 1
    full: 'Folder tree'
    summary: 'ساختار پوشه‌ها را به شکل درخت نشان می‌دهد.'
    syntax: 'tree [path] [/f] [/a]'
    switches:
      - {s: '/f', d: 'فایل‌ها را هم نشان می‌دهد.'}
      - {s: '/a', d: 'به‌جای خط‌های گرافیکی از ASCII استفاده می‌کند؛ مناسب ذخیره در فایل.'}
    examples:
      - {c: 'tree Documents', d: 'درخت پوشه‌های Documents.'}
      - {c: 'tree D:\Projects /f', d: 'درخت همراه با فایل‌ها.'}
      - {c: 'tree Documents /f /a > tree.txt', d: 'ذخیره درخت در فایل متنی.'}
    related: [dir, cd]
    keywords: ['درخت', 'ساختار']

  - name: where
    category: navigation
    level: 2
    full: 'Locate files'
    summary: 'محل یک برنامه یا فایل را پیدا می‌کند.'
    details: 'بدون Switch در پوشه فعلی و پوشه‌های PATH می‌گردد. با `/r` در یک پوشه و همه زیرپوشه‌هایش جست‌وجو می‌کند.'
    syntax: 'where [/r dir] pattern'
    switches:
      - {s: '/r dir', d: 'جست‌وجو در پوشه و زیرپوشه‌ها.'}
    examples:
      - {c: 'where notepad', d: 'notepad.exe کجاست؟'}
      - {c: 'where /r C:\Users\Student *.jpg', d: 'همه عکس‌های jpg در پوشه کاربر.'}
    related: [dir, path]
    keywords: ['پیدا کردن', 'محل برنامه', 'which']

# ---------------- files ----------------
  - name: type
    category: files
    level: 1
    full: 'Display file content'
    summary: 'محتوای یک فایل متنی را نمایش می‌دهد.'
    details: 'برای فایل‌های باینری (exe، jpg، zip) خروجی بی‌معنی است. برای فایل‌های بلند آن را به `more` بده.'
    syntax: 'type file [file2 ...]'
    examples:
      - {c: 'type Documents\menu.txt', d: 'نمایش منوی رستوران.'}
      - {c: 'type Documents\*.txt', d: 'نمایش همه فایل‌های txt پشت سر هم.'}
      - {c: 'type "Desktop\shopping list.txt"', d: 'نام دارای Space داخل کوتیشن.'}
    related: [more, find, echo, copy]
    keywords: ['خواندن فایل', 'cat', 'نمایش محتوا']

  - name: mkdir
    aliases: [md]
    category: files
    level: 1
    full: 'Make Directory'
    summary: 'پوشه جدید می‌سازد؛ حتی چند سطح با هم.'
    syntax: 'mkdir path [path2 ...]'
    examples:
      - {c: 'mkdir Reports', d: 'ساختن پوشه Reports.'}
      - {c: 'md Projects\2026\April', d: 'ساختن چند سطح پوشه با یک دستور.'}
      - {c: 'mkdir "New Folder"', d: 'نام دارای Space.'}
      - {c: 'mkdir A B C', d: 'سه پوشه با یک دستور.'}
    related: [rmdir, cd, tree]
    keywords: ['ساخت پوشه', 'پوشه جدید']

  - name: rmdir
    aliases: [rd]
    category: files
    level: 1
    danger: danger
    full: 'Remove Directory'
    summary: 'پوشه را حذف می‌کند. با `/s` همه محتوایش را هم حذف می‌کند.'
    details: 'بدون `/s` فقط پوشه خالی حذف می‌شود. حذف با `rd` به Recycle Bin نمی‌رود.'
    syntax: 'rmdir [/s] [/q] path'
    switches:
      - {s: '/s', d: 'حذف پوشه همراه با همه فایل‌ها و زیرپوشه‌ها.'}
      - {s: '/q', d: 'بدون پرسیدن تأیید؛ بسیار خطرناک.'}
    examples:
      - {c: 'mkdir Empty & rd Empty', d: 'ساختن و حذف یک پوشه خالی.'}
      - {c: 'rd Documents', d: 'خطا می‌دهد چون Documents خالی نیست.', expectError: true}
      - {c: 'rd /s D:\Backup', d: 'حذف پوشه و محتوایش؛ اول تأیید می‌خواهد.'}
    warning: '`rd /s /q` بدون هیچ سؤالی همه چیز را پاک می‌کند و برگشت ندارد. قبلش با `dir` مطمئن شو کجا هستی.'
    related: [mkdir, del, dir]
    keywords: ['حذف پوشه', 'پاک کردن پوشه']

  - name: copy
    category: files
    level: 1
    danger: caution
    full: 'Copy files'
    summary: 'یک یا چند فایل را کپی می‌کند.'
    details: 'اگر مقصد پوشه باشد، فایل با همان نام کپی می‌شود. اگر فایلی با همان نام وجود داشته باشد، CMD می‌پرسد Overwrite کند یا نه. `copy` پوشه را کپی نمی‌کند؛ برای پوشه از `xcopy` یا `robocopy` استفاده کن.'
    syntax: 'copy [/y] source [destination]'
    switches:
      - {s: '/y', d: 'بدون پرسیدن روی فایل موجود می‌نویسد.'}
      - {s: '/-y', d: 'قبل از Overwrite حتماً می‌پرسد.'}
      - {s: 'a+b', d: 'چسباندن چند فایل به هم: `copy a.txt+b.txt all.txt`.'}
    examples:
      - {c: 'copy Desktop\notes.txt D:\Backup', d: 'کپی یک فایل به پوشه دیگر.'}
      - {c: 'copy Documents\*.txt E:\', d: 'کپی همه فایل‌های txt به فلش.'}
      - {c: 'copy Documents\menu.txt Documents\menu_backup.txt', d: 'کپی با نام جدید.'}
      - {c: 'copy Documents\menu.txt+Documents\guests.txt all.txt', d: 'چسباندن دو فایل در یک فایل.'}
    warning: 'با `/y` فایل مقصد بدون سؤال جایگزین می‌شود.'
    related: [xcopy, robocopy, move]
    keywords: ['کپی', 'رونوشت', 'cp']

  - name: move
    category: files
    level: 1
    danger: caution
    full: 'Move files'
    summary: 'فایل یا پوشه را جابه‌جا می‌کند یا نامش را عوض می‌کند.'
    syntax: 'move [/y] source destination'
    switches:
      - {s: '/y', d: 'بدون پرسیدن روی فایل موجود می‌نویسد.'}
    examples:
      - {c: 'move Downloads\invoice.pdf Documents', d: 'انتقال فاکتور به Documents.'}
      - {c: 'move Downloads\*.tmp D:\Backup', d: 'انتقال همه فایل‌های tmp.'}
      - {c: 'move Documents\Work Documents\Office', d: 'تغییر نام پوشه با move.'}
    related: [copy, ren]
    keywords: ['انتقال', 'جابه‌جایی', 'mv']

  - name: ren
    aliases: [rename]
    category: files
    level: 1
    danger: caution
    full: 'Rename'
    summary: 'نام فایل یا پوشه را عوض می‌کند (در همان پوشه).'
    details: 'نام جدید فقط نام است، نه Path. با Wildcard می‌توان Extension چند فایل را با هم عوض کرد.'
    syntax: 'ren oldname newname'
    examples:
      - {c: 'ren Documents\menu.txt menu_2026.txt', d: 'تغییر نام فایل.'}
      - {c: 'ren Documents\Work Office', d: 'تغییر نام پوشه.'}
      - {c: 'ren *.tmp *.bak', d: 'عوض کردن Extension همه فایل‌های tmp.', at: 'C:\Users\Student\Downloads'}
    related: [move, copy]
    keywords: ['تغییر نام', 'نام جدید']

  - name: del
    aliases: [erase]
    category: files
    level: 1
    danger: danger
    full: 'Delete files'
    summary: 'فایل‌ها را حذف می‌کند؛ بدون Recycle Bin.'
    details: '`del` فقط فایل حذف می‌کند، نه پوشه. با Wildcard چند فایل حذف می‌شوند. وقتی همه فایل‌های یک پوشه را حذف کنی (`*.*`)، CMD تأیید می‌خواهد.'
    syntax: 'del [/p] [/q] [/s] [/f] files'
    switches:
      - {s: '/p', d: 'قبل از حذف هر فایل می‌پرسد.'}
      - {s: '/q', d: 'بدون پرسیدن.'}
      - {s: '/s', d: 'در زیرپوشه‌ها هم حذف می‌کند.'}
      - {s: '/f', d: 'فایل‌های Read-only را هم حذف می‌کند.'}
    examples:
      - {c: 'del Documents\Work\draft.tmp', d: 'حذف یک فایل.'}
      - {c: 'del Downloads\*.tmp', d: 'حذف همه فایل‌های موقت Downloads.'}
      - {c: 'del /p Downloads\*.tmp', d: 'حذف با پرسیدن برای هر فایل.'}
      - {c: 'dir *.tmp /s /b', d: 'قبل از `del /s`، اول ببین چه چیزی حذف می‌شود.'}
    warning: 'فایل حذف‌شده با `del` به Recycle Bin نمی‌رود. همیشه اول با `dir` و همان الگو ببین چه فایل‌هایی انتخاب می‌شوند.'
    related: [rmdir, dir, attrib]
    keywords: ['حذف', 'پاک کردن', 'rm']

  - name: xcopy
    category: files
    level: 2
    danger: caution
    full: 'Extended copy'
    summary: 'فایل‌ها و پوشه‌ها را همراه با زیرپوشه‌ها کپی می‌کند.'
    syntax: 'xcopy source [destination] [/s] [/e] [/i] [/y] [/h] [/l]'
    switches:
      - {s: '/s', d: 'زیرپوشه‌ها را هم کپی می‌کند (به‌جز پوشه‌های خالی).'}
      - {s: '/e', d: 'همه زیرپوشه‌ها، حتی خالی.'}
      - {s: '/i', d: 'اگر مقصد وجود ندارد، آن را پوشه فرض کن (سؤال F/D نپرس).'}
      - {s: '/y', d: 'بدون پرسیدن Overwrite.'}
      - {s: '/h', d: 'فایل‌های Hidden و System را هم کپی کن.'}
      - {s: '/l', d: 'فقط نشان بده چه چیزی کپی می‌شود؛ هیچ کپی انجام نمی‌شود.'}
    examples:
      - {c: 'xcopy Documents D:\Backup\Docs /e /i', d: 'کپی کامل Documents.'}
      - {c: 'xcopy Pictures E:\Pictures /s /i /l', d: 'پیش‌نمایش کپی، بدون انجام دادن.'}
      - {c: 'xcopy Documents\*.txt E:\Texts /i', d: 'کپی فایل‌های txt به پوشه جدید.'}
    related: [copy, robocopy]
    keywords: ['کپی پوشه', 'پشتیبان']

  - name: robocopy
    category: files
    level: 2
    danger: danger
    full: 'Robust File Copy'
    summary: 'کپی و همگام‌سازی حرفه‌ای پوشه‌ها، با گزارش کامل.'
    details: 'برخلاف بقیه دستورها، کد خروج 0 تا 7 یعنی موفقیت (مثلاً 1 یعنی فایل‌هایی کپی شدند). کد 8 یا بیشتر یعنی خطا. `/mir` مقصد را دقیقاً شبیه مبدأ می‌کند و فایل‌های اضافه مقصد را حذف می‌کند.'
    syntax: 'robocopy source destination [files] [/e] [/s] [/mir] [/mov] [/l]'
    switches:
      - {s: '/e', d: 'همه زیرپوشه‌ها، حتی خالی.'}
      - {s: '/s', d: 'زیرپوشه‌ها، به‌جز خالی.'}
      - {s: '/mir', d: 'آینه: مقصد = مبدأ. فایل‌هایی که در مبدأ نیستند از مقصد حذف می‌شوند.'}
      - {s: '/mov', d: 'انتقال فایل‌ها (کپی و حذف از مبدأ).'}
      - {s: '/l', d: 'فقط گزارش؛ هیچ تغییری انجام نمی‌شود.'}
    examples:
      - {c: 'robocopy Documents D:\Backup\Docs /e', d: 'پشتیبان کامل Documents.'}
      - {c: 'robocopy Pictures E:\AllPhotos *.jpg /s', d: 'فقط عکس‌های jpg، از همه زیرپوشه‌ها.'}
      - {c: 'robocopy Documents D:\Backup\Docs /mir /l', d: 'ببین `/mir` چه می‌کند، بدون تغییر.'}
    warning: '`/mir` با مبدأ و مقصد جابه‌جا، پوشه اصلی تو را پاک می‌کند. اول با `/l` امتحان کن.'
    related: [xcopy, copy]
    keywords: ['پشتیبان', 'همگام‌سازی', 'backup', 'mirror']

  - name: attrib
    category: files
    level: 2
    danger: caution
    full: 'File attributes'
    summary: 'ویژگی‌های فایل (Read-only، Hidden، System، Archive) را نشان می‌دهد یا تغییر می‌دهد.'
    syntax: 'attrib [+r|-r] [+h|-h] [+s|-s] [+a|-a] [file] [/s] [/d]'
    switches:
      - {s: '+r / -r', d: 'روشن یا خاموش کردن Read-only.'}
      - {s: '+h / -h', d: 'مخفی کردن یا نمایان کردن.'}
      - {s: '+s / -s', d: 'فایل سیستمی.'}
      - {s: '/s', d: 'در زیرپوشه‌ها هم.'}
    examples:
      - {c: 'attrib Documents\*.*', d: 'دیدن ویژگی فایل‌های Documents.'}
      - {c: 'attrib +r Desktop\notes.txt', d: 'فقط‌خواندنی کردن notes.txt.'}
      - {c: 'attrib -h Documents\secret.txt', d: 'نمایان کردن فایل مخفی.'}
    related: [dir, del]
    keywords: ['مخفی', 'فقط خواندنی', 'hidden', 'read-only']

  - name: fc
    category: files
    level: 2
    full: 'File Compare'
    summary: 'دو فایل را مقایسه می‌کند و تفاوت‌ها را نشان می‌دهد.'
    syntax: 'fc [/n] [/c] file1 file2'
    switches:
      - {s: '/n', d: 'شماره خط‌ها را نشان می‌دهد.'}
      - {s: '/c', d: 'بزرگی و کوچکی حروف را نادیده می‌گیرد.'}
    examples:
      - {c: 'copy Documents\menu.txt m2.txt & fc Documents\menu.txt m2.txt', d: 'دو فایل یکسان: no differences encountered.'}
      - {c: 'fc /n Documents\menu.txt Documents\guests.txt', d: 'دو فایل متفاوت با شماره خط.'}
    related: [find, type]
    keywords: ['مقایسه', 'تفاوت', 'diff']

# ---------------- text ----------------
  - name: echo
    category: text
    level: 1
    full: 'Display text'
    summary: 'متن را نمایش می‌دهد یا در فایل می‌نویسد.'
    details: 'با `>` متن در فایل نوشته می‌شود و با `>>` به آخر فایل اضافه می‌شود. `echo.` یک خط خالی چاپ می‌کند. در Batch، `@echo off` نمایش خود دستورها را خاموش می‌کند.'
    syntax: 'echo [text] | echo on | echo off | echo.'
    examples:
      - {c: 'echo Hello CMD', d: 'چاپ متن.'}
      - {c: 'echo Pizza > order.txt', d: 'ساختن فایل با یک خط.'}
      - {c: 'echo Salad >> order.txt', d: 'افزودن خط به آخر فایل.'}
      - {c: 'echo %USERNAME%', d: 'نمایش مقدار یک متغیر.'}
      - {c: 'echo.', d: 'یک خط خالی.'}
    related: [type, set, '>', '>>']
    keywords: ['چاپ', 'نمایش متن', 'نوشتن در فایل']

  - name: find
    category: text
    level: 2
    full: 'Find text'
    summary: 'خط‌هایی را که یک متن مشخص دارند پیدا می‌کند.'
    details: 'متن جست‌وجو حتماً باید داخل کوتیشن دوتایی باشد. معمولاً بعد از `|` برای فیلتر کردن خروجی دستور دیگر استفاده می‌شود.'
    syntax: 'find [/i] [/v] [/c] [/n] "text" [file]'
    switches:
      - {s: '/i', d: 'بزرگی و کوچکی حروف مهم نیست.'}
      - {s: '/v', d: 'خط‌هایی که این متن را ندارند.'}
      - {s: '/c', d: 'فقط تعداد خط‌ها.'}
      - {s: '/n', d: 'با شماره خط.'}
    examples:
      - {c: 'find "Pizza" Documents\menu.txt', d: 'جست‌وجو در فایل.'}
      - {c: 'type Documents\menu.txt | find /i "pizza"', d: 'فیلتر خروجی، بدون حساسیت به حروف.'}
      - {c: 'find /c /v "" Documents\guests.txt', d: 'شمردن همه خط‌های فایل.'}
      - {c: 'ipconfig | find "IPv4"', d: 'فقط خط آدرس IP.'}
    related: [findstr, sort, more, '|']
    keywords: ['جست‌وجو', 'grep', 'فیلتر']

  - name: findstr
    category: text
    level: 2
    full: 'Find strings'
    summary: 'جست‌وجوی پیشرفته متن: چند کلمه، Regex، در زیرپوشه‌ها.'
    details: 'برخلاف `find`، کلمه‌های جداشده با Space را «یا» حساب می‌کند: `findstr "pizza pasta"` خط‌های دارای هر کدام را می‌دهد. برای عبارت دقیق از `/c:` استفاده کن.'
    syntax: 'findstr [/i] [/s] [/n] [/m] [/r] [/c:"text"] strings [files]'
    switches:
      - {s: '/i', d: 'بدون حساسیت به حروف.'}
      - {s: '/s', d: 'جست‌وجو در زیرپوشه‌ها.'}
      - {s: '/n', d: 'با شماره خط.'}
      - {s: '/m', d: 'فقط نام فایل‌هایی که متن را دارند.'}
      - {s: '/c:"..."', d: 'عبارت دقیق، همراه با Space.'}
      - {s: '/b /e', d: 'شروع یا پایان خط.'}
      - {s: '/r', d: 'Regex: `.` هر حرف، `*` تکرار، `^` شروع، `$` پایان، `[0-9]` بازه.'}
    examples:
      - {c: 'findstr /i "pizza pasta" Documents\menu.txt', d: 'خط‌های دارای pizza یا pasta.'}
      - {c: 'findstr /s /m /i "report" *.txt', d: 'کدام فایل‌ها کلمه report دارند؟'}
      - {c: 'findstr /n /c:"Restaurant Menu" Documents\menu.txt', d: 'عبارت دقیق با شماره خط.'}
      - {c: 'findstr /r "^[0-9]" Documents\todo.txt', d: 'خط‌هایی که با عدد شروع می‌شوند.'}
    related: [find, sort]
    keywords: ['regex', 'جست‌وجو پیشرفته', 'grep']

  - name: sort
    category: text
    level: 2
    full: 'Sort lines'
    summary: 'خط‌ها را به ترتیب الفبا مرتب می‌کند.'
    syntax: 'sort [/r] [/o outfile] [file]'
    switches:
      - {s: '/r', d: 'ترتیب معکوس (Z تا A).'}
      - {s: '/o file', d: 'نتیجه را در فایل ذخیره می‌کند.'}
    examples:
      - {c: 'sort Documents\guests.txt', d: 'مرتب‌سازی فهرست مهمان‌ها.'}
      - {c: 'sort /r Documents\guests.txt', d: 'برعکس.'}
      - {c: 'dir /b Documents | sort', d: 'مرتب کردن خروجی یک دستور دیگر.'}
    related: [find, more, '|']
    keywords: ['مرتب', 'ترتیب الفبا']

  - name: more
    category: text
    level: 2
    full: 'Page output'
    summary: 'خروجی بلند را صفحه به صفحه نشان می‌دهد.'
    details: 'Space یعنی صفحه بعد، Enter یعنی یک خط بعد و `q` یعنی خروج.'
    syntax: 'command | more  ·  more file'
    examples:
      - {c: 'help | more', d: 'دیدن فهرست دستورها صفحه به صفحه.'}
      - {c: 'more Documents\menu.txt', d: 'نمایش فایل صفحه به صفحه.'}
    related: [type, find, '|']
    keywords: ['صفحه به صفحه', 'less']

  - name: clip
    category: text
    level: 2
    full: 'Copy to clipboard'
    summary: 'خروجی یک دستور را در Clipboard کپی می‌کند تا جای دیگری Paste کنی.'
    syntax: 'command | clip'
    examples:
      - {c: 'ipconfig | clip', d: 'کپی اطلاعات شبکه برای فرستادن به پشتیبانی.'}
      - {c: 'dir /b Documents | clip', d: 'کپی فهرست نام فایل‌ها.'}
    related: ['|', echo]
    keywords: ['کلیپ‌بورد', 'کپی خروجی']

