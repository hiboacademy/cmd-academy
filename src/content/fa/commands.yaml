    full: 'Service Control'
    summary: 'وضعیت سرویس‌های Windows را می‌بیند، آن‌ها را شروع یا متوقف می‌کند.'
    details: 'دیدن وضعیت دسترسی Admin نمی‌خواهد، ولی start و stop می‌خواهد. توجه کن: در `sc` بعد از `=` حتماً Space بگذار.'
