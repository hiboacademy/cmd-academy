/* ============================================================
   ui/styles.css — CMD Academy design tokens + layout
   Layout: phone = single column + bottom nav;
           ≥ 960px = sidebar on the right (RTL start) + wide content.
   Themes: dark (default), light, or follow the system.
   The terminal stays dark in every theme, like a real console.
   Font sizes use rem so the "text size" setting scales them.
   ============================================================ */
:root {
  --bg: #0b0d0e;
  --surface: #131618;
  --surface-2: #1a1e21;
  --line: #262c30;
  --line-strong: #39424a;
  --fg: #e8ebed;
  --muted: #8e979e;
  --green: #4fd18b;
  --on-green: #06120b;
  --green-soft: rgba(79, 209, 139, 0.12);
  --blue: #6cb2ff;
  --blue-soft: rgba(108, 178, 255, 0.12);
  --warn: #f2b54e;
  --warn-soft: rgba(242, 181, 78, 0.12);
  --danger: #ff6f6f;
  --danger-soft: rgba(255, 111, 111, 0.12);
  --nav-bg: rgba(11, 13, 14, 0.94);

  /* terminal: identical in both themes */
  --term: #08090a;
  --term-bar: #131618;
  --term-line: #262c30;
  --term-fg: #e8ebed;
  --term-muted: #8e979e;
  --term-green: #4fd18b;
  --term-err: #ff9a9a;
  --term-note-bg: rgba(108, 178, 255, 0.13);
  --term-note-fg: #cfe5ff;
  --term-note-b: #6cb2ff;
  --term-warn-bg: rgba(255, 111, 111, 0.14);
  --term-warn-fg: #ffd0d0;
  --term-warn-b: #ff6f6f;

  --font-fa: "Vazirmatn", "Tahoma", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, "Courier New", monospace;

  --r-sm: 8px;
  --r-md: 12px;
  --nav-h: 64px;
  --gutter: 16px;
  color-scheme: dark;
}
:root[data-ui="light"] {
  --bg: #f3f5f6;
  --surface: #ffffff;
  --surface-2: #eceff1;
  --line: #d8dee2;
  --line-strong: #b9c2c8;
  --fg: #151a1d;
  --muted: #5a656d;
  --green: #11804d;
  --on-green: #ffffff;
  --green-soft: rgba(17, 128, 77, 0.1);
  --blue: #1b5fbf;
  --blue-soft: rgba(27, 95, 191, 0.09);
  --warn: #946000;
  --warn-soft: rgba(196, 128, 0, 0.12);
  --danger: #c22c2c;
  --danger-soft: rgba(194, 44, 44, 0.09);
  --nav-bg: rgba(255, 255, 255, 0.95);
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root[data-ui="system"] {
    --bg: #f3f5f6; --surface: #ffffff; --surface-2: #eceff1; --line: #d8dee2; --line-strong: #b9c2c8;
    --fg: #151a1d; --muted: #5a656d; --green: #11804d; --on-green: #ffffff; --green-soft: rgba(17, 128, 77, 0.1);
    --blue: #1b5fbf; --blue-soft: rgba(27, 95, 191, 0.09); --warn: #946000; --warn-soft: rgba(196, 128, 0, 0.12);
    --danger: #c22c2c; --danger-soft: rgba(194, 44, 44, 0.09); --nav-bg: rgba(255, 255, 255, 0.95);
    color-scheme: light;
  }
}

* { box-sizing: border-box; }
html { font-size: 16px; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-fa);
  font-size: 0.9375rem;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- code & LTR islands ---------- */
.mono, code, kbd { font-family: var(--font-mono); }
.ltr { direction: ltr; unicode-bidi: isolate; text-align: left; }
code.ic {
  direction: ltr; unicode-bidi: isolate;
  font-size: 0.86em; padding: 1px 6px; border-radius: 5px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--fg);
  white-space: pre-wrap; word-break: break-word;
}

/* ---------- app shell ---------- */
.app { min-height: 100%; }
.main {
  padding-inline: var(--gutter);
  padding-block: 20px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
  max-width: 760px;
  margin-inline: auto;
  min-width: 0;
}
.main.wide { max-width: 1180px; }
.view { animation: viewIn 0.16s ease-out; }
@keyframes viewIn { from { opacity: 0.4; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.bottom-nav {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--nav-bg);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.nav-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  height: var(--nav-h); border: 0; background: none; color: var(--muted);
  font-size: 0.72rem; line-height: 1.2; min-width: 0;
}
.nav-btn svg { width: 22px; height: 22px; }
.nav-btn[aria-current="page"] { color: var(--green); }

.sidebar { display: none; }

@media (min-width: 640px) {
  :root { --gutter: 28px; }
  body { font-size: 1rem; }
}
@media (min-width: 960px) {
  .app { display: grid; grid-template-columns: 240px minmax(0, 1fr); }
  .bottom-nav { display: none; }
  .sidebar {
    display: flex; flex-direction: column; gap: 2px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    padding: 24px 14px; border-inline-end: 1px solid var(--line); background: var(--surface);
  }
  .sidebar .brand { font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.18em; color: var(--green); font-size: 0.875rem; padding: 0 10px 18px; direction: ltr; text-align: right; }
  .side-btn {
    display: flex; align-items: center; gap: 12px; padding: 8px 12px; border: 0; border-radius: var(--r-sm);
    background: none; color: var(--muted); text-align: start; font-size: 0.92rem;
  }
  .side-btn svg { width: 19px; height: 19px; flex: 0 0 auto; }
  .side-btn:hover { background: var(--surface-2); color: var(--fg); }
  .side-btn[aria-current="page"] { background: var(--green-soft); color: var(--green); }
  .side-sep { height: 1px; background: var(--line); margin: 8px 4px; }
  .main { padding-block: 32px 48px; }
}

/* ---------- typography ---------- */
.eyebrow {
  font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--muted); direction: ltr; unicode-bidi: isolate;
}
h1, h2, h3 { margin: 0; line-height: 1.45; text-wrap: balance; }
h1 { font-size: 1.5rem; font-weight: 700; }
h2 { font-size: 1.125rem; font-weight: 700; }
h3 { font-size: 0.97rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.8125rem; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.stack-xs { display: flex; flex-direction: column; gap: 4px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.row.start { align-items: flex-start; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }

/* ---------- surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; min-width: 0; }
.card.flat { background: transparent; }
.card.tight { padding: 0; overflow: hidden; }
.tap { transition: border-color 0.15s, background 0.15s; text-align: start; width: 100%; }
.tap:hover { border-color: var(--line-strong); }
.tap:active { background: var(--surface-2); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--surface-2); font-weight: 500; text-align: center;
}
.btn svg { width: 18px; height: 18px; flex: 0 0 auto; }
.btn.primary { background: var(--green); color: var(--on-green); border-color: var(--green); font-weight: 700; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); background: transparent; }
.btn.small { min-height: 38px; padding: 0 12px; font-size: 0.875rem; white-space: nowrap; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 140px; }
.icon-btn {
  display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); flex: 0 0 auto;
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.plain { border-color: transparent; background: transparent; }
.star { color: var(--muted); }
.star[aria-pressed="true"] { color: var(--warn); }
.star[aria-pressed="true"] svg { fill: currentColor; }
.back {
  display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--muted);
  padding: 6px 0; min-height: 40px; font-size: 0.875rem;
}
.back svg { width: 18px; height: 18px; }
.linkish { border: 0; background: none; color: var(--blue); padding: 0; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- progress bars ---------- */
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--green); border-radius: 99px; transition: width 0.5s ease-out; }
.blocks { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; direction: ltr; }
.blocks > i { height: 14px; border-radius: 2px; background: var(--surface-2); }
.blocks > i.on { background: var(--green); }

/* ---------- terminal ---------- */
.term {
  background: var(--term); border: 1px solid var(--term-line); border-radius: var(--r-md);
  overflow: hidden; font-family: var(--font-mono); color: var(--term-fg); min-width: 0;
}
.term-bar {
  display: flex; align-items: center; gap: 8px; direction: ltr;
  padding: 0 8px 0 12px; height: 36px; background: var(--term-bar); border-bottom: 1px solid var(--term-line);
  font-size: 0.75rem; color: var(--term-muted);
}
.term-tab {
  display: flex; align-items: center; gap: 8px; height: 100%; min-width: 0;
  padding: 0 12px; background: var(--term); border-inline: 1px solid var(--term-line); color: var(--term-fg);
}
.term-tab .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 52vw; }
.term-tab .ti { color: var(--term-green); font-weight: 700; }
.term-bar .spacer { flex: 1; }
.term-bar .tbtn { border: 0; background: none; color: var(--term-muted); font-family: var(--font-fa); font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; }
.term-bar .tbtn:hover { color: var(--term-fg); background: rgba(255, 255, 255, 0.06); }
.term-body {
  direction: ltr; text-align: left; padding: 12px 14px; font-size: 0.8125rem; line-height: 1.6;
  white-space: pre-wrap; word-break: break-word; overflow-x: auto;
}
.term-line { min-height: 1.6em; }
.term-line.err { color: var(--term-err); }
.term-line .pr { color: var(--term-fg); }
.term-line .cm { color: var(--term-green); }
.term-note {
  direction: rtl; text-align: right; font-family: var(--font-fa); font-size: 0.84rem; line-height: 1.8;
  margin: 6px 0 10px; padding: 8px 12px; border-radius: var(--r-sm);
  background: var(--term-note-bg); color: var(--term-note-fg); white-space: normal;
}
.term-note code.ic { background: rgba(0, 0, 0, 0.35); border-color: rgba(255, 255, 255, 0.12); color: var(--term-fg); }
.term-note.warn { background: var(--term-warn-bg); color: var(--term-warn-fg); }
.term-note b { font-weight: 700; color: var(--term-note-b); margin-inline-end: 6px; }
.term-note.warn b { color: var(--term-warn-b); }
.term-input-row { display: flex; align-items: baseline; gap: 0; flex-wrap: wrap; }
.term-input-row .pr { white-space: pre-wrap; color: var(--term-fg); }
.term-input {
  flex: 1; min-width: 4ch; border: 0; outline: none; background: transparent; color: var(--term-green);
  font-family: var(--font-mono); font-size: 16px; padding: 0 0 0 1ch; caret-color: var(--term-green); direction: ltr;
}
.term-input::placeholder { color: var(--term-muted); font-family: var(--font-fa); font-size: 0.8rem; }
.term.is-sleep .term-input { opacity: 0.5; }
.term.is-key .term-input-row .pr { color: #ffe08a; }
.cursor { display: inline-block; width: 0.6em; height: 1.1em; vertical-align: text-bottom; background: var(--term-green); animation: blink 1.4s steps(1) infinite; margin-left: 2px; }
@keyframes blink { 50% { opacity: 0; } }
.keys { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--term-line); background: var(--term-bar); overflow-x: auto; direction: ltr; scrollbar-width: thin; }
.key {
  flex: 0 0 auto; min-width: 40px; height: 38px; padding: 0 10px; border-radius: 7px;
  border: 1px solid var(--term-line); background: #1a1e21; color: var(--term-fg); font-family: var(--font-mono); font-size: 0.94rem;
}
.key.wide { font-size: 0.78rem; }
.key.danger-key { color: var(--term-err); }
.key.run { background: rgba(79, 209, 139, 0.14); color: var(--term-green); border-color: transparent; margin-left: auto; font-family: var(--font-fa); font-size: 0.875rem; }

/* simulator page fills the screen */
.sim-wrap { display: flex; flex-direction: column; gap: 12px; }
.sim-wrap .term { display: flex; flex-direction: column; height: calc(100dvh - var(--nav-h) - 210px - env(safe-area-inset-bottom, 0px) - env(safe-area-inset-top, 0px)); min-height: 330px; }
.sim-wrap .term-body { flex: 1; overflow-y: auto; }
@media (min-width: 960px) {
  .sim-wrap .term { height: calc(100vh - 190px); }
  .sim-wrap .term-body { font-size: 0.875rem; }
}

/* ---------- segmented control ---------- */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.seg button { min-height: 40px; border: 0; border-radius: 7px; background: none; color: var(--muted); font-size: 0.8125rem; padding: 0 6px; }
.seg.mono button { font-family: var(--font-mono); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }

/* ---------- home ---------- */
.home-top { display: flex; align-items: center; gap: 8px; }
.brand-title { font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.2em; color: var(--green); font-size: 0.94rem; direction: ltr; text-align: right; flex: 1; }
.hero-line { font-size: 1.375rem; font-weight: 700; line-height: 1.5; text-wrap: balance; }
.mini-term { cursor: pointer; }
.mini-term .term-body { padding: 14px 16px 16px; }
.cards3 { display: grid; grid-template-columns: 1fr; gap: 10px; }
.feature { display: flex; align-items: center; gap: 14px; }
.feature .ico {
  flex: 0 0 auto; width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center;
  background: var(--surface-2); color: var(--green);
}
.feature .ico svg { width: 22px; height: 22px; }
.feature .t { font-family: var(--font-mono); font-weight: 600; font-size: 0.94rem; direction: ltr; unicode-bidi: isolate; text-align: right; }
.chev { color: var(--muted); width: 18px; height: 18px; flex: 0 0 auto; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-height: 92px; }
.tile .ti-ico { color: var(--blue); display: flex; }
.tile .ti-ico svg { width: 22px; height: 22px; }
.tile .tt { font-weight: 600; line-height: 1.4; }
@media (min-width: 640px) {
  .cards3 { grid-template-columns: repeat(3, 1fr); }
  .cards3 .feature { flex-direction: column; align-items: flex-start; }
  .cards3 .chev { display: none; }
  .grid2.more { grid-template-columns: repeat(3, 1fr); }
}
.big-num { font-family: var(--font-mono); font-size: 1.75rem; font-weight: 700; direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--font-mono); font-size: 0.75rem; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); direction: ltr; unicode-bidi: isolate; white-space: nowrap; color: var(--fg); }
button.chip { min-height: 34px; padding: 0 10px; font-size: 0.8125rem; }
.chip.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.chip.caution { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.tag { font-size: 0.72rem; color: var(--muted); border: 1px solid var(--line); padding: 1px 8px; border-radius: 99px; white-space: nowrap; }
.tag.lvl1 { color: var(--green); border-color: color-mix(in srgb, var(--green) 40%, transparent); }
.tag.lvl2 { color: var(--blue); border-color: color-mix(in srgb, var(--blue) 40%, transparent); }
.tag.lvl3 { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }

/* ---------- learn ---------- */
.level-head .code { font-family: var(--font-mono); font-size: 1.375rem; font-weight: 700; letter-spacing: 0.08em; direction: ltr; unicode-bidi: isolate; }
.chapter { padding: 0; overflow: hidden; }
.chapter-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
.chapter-foot { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
.lesson-row {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; min-height: 60px;
  border: 0; border-bottom: 1px solid var(--line); background: none; text-align: start;
}
.lesson-row:last-child { border-bottom: 0; }
.lesson-row:hover:not(:disabled) { background: var(--surface-2); }
.lesson-row:disabled { cursor: default; }
.lesson-row:disabled .lt { color: var(--muted); }
.st { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 0.8125rem; border: 1.5px solid var(--line); color: var(--muted); }
.st.done { background: var(--green); border-color: var(--green); color: var(--on-green); font-weight: 700; }
.st.current { border-color: var(--blue); color: var(--blue); }
.st.current::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--blue); }
.st.started { border-color: var(--blue); border-style: dashed; }
.st.soon { border-style: dashed; }
.ln { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); letter-spacing: 0.06em; direction: ltr; unicode-bidi: isolate; }
.lt { font-weight: 500; line-height: 1.5; }

/* ---------- lesson ---------- */
.term-hero { font-family: var(--font-mono); font-size: 2.125rem; font-weight: 700; color: var(--green); direction: ltr; unicode-bidi: isolate; text-align: right; line-height: 1.25; word-break: break-word; }
.term-hero.long { font-size: 1.5rem; }
.full-form { font-family: var(--font-mono); font-size: 0.875rem; color: var(--muted); direction: ltr; unicode-bidi: isolate; text-align: right; }
.objective { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: var(--r-sm); background: var(--blue-soft); }
.objective svg { width: 18px; height: 18px; color: var(--blue); flex: 0 0 auto; margin-top: 4px; }
.lead { font-size: 1.03rem; line-height: 1.9; max-width: 62ch; }
.facts { display: flex; flex-direction: column; }
.fact { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.fact:last-child { border-bottom: 0; }
.fact .k { font-size: 0.8125rem; color: var(--muted); font-weight: 500; padding-top: 2px; }
.fact .v { min-width: 0; }
.syntax { font-family: var(--font-mono); font-size: 0.875rem; color: var(--term-green); direction: ltr; text-align: left; background: var(--term); border: 1px solid var(--term-line); border-radius: 6px; padding: 6px 10px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
.examples { display: flex; flex-direction: column; }
.ex-row { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ex-row:last-child { border-bottom: 0; }
.ex-row .ex-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.ex-cmd { font-family: var(--font-mono); font-size: 0.875rem; color: var(--term-green); background: var(--term); border-radius: 6px; padding: 6px 10px; direction: ltr; text-align: left; white-space: pre-wrap; word-break: break-word; }
.ex-tools { display: flex; gap: 4px; flex: 0 0 auto; }
.ex-tools .icon-btn { width: 38px; height: 38px; }
.mistakes { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.mistakes li { display: flex; gap: 10px; align-items: flex-start; }
.mistakes li::before { content: "✕"; color: var(--danger); font-weight: 700; flex: 0 0 auto; line-height: 1.75; }
.callout { border-radius: var(--r-sm); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
.callout svg { flex: 0 0 auto; width: 18px; height: 18px; margin-top: 4px; }
.callout.tip { background: var(--green-soft); }
.callout.tip svg { color: var(--green); }
.callout.warn { background: var(--warn-soft); }
.callout.warn svg { color: var(--warn); }
.callout.danger { background: var(--danger-soft); }
.callout.danger svg { color: var(--danger); }
.callout.info { background: var(--blue-soft); }
.callout.info svg { color: var(--blue); }
details.analogy { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
details.analogy summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; font-weight: 500; min-height: 48px; }
details.analogy summary::-webkit-details-marker { display: none; }
details.analogy summary svg { width: 16px; height: 16px; color: var(--muted); transition: transform 0.15s; }
details.analogy[open] summary svg { transform: rotate(180deg); }
details.analogy > div { padding: 0 14px 14px; color: var(--fg); opacity: 0.88; }
.recap { border: 1px dashed var(--line-strong); border-radius: var(--r-sm); padding: 12px 14px; }
.req { display: flex; align-items: center; gap: 8px; font-size: 0.84rem; color: var(--muted); }
.req .dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 0.7rem; }
.req.ok { color: var(--fg); }
.req.ok .dot { background: var(--green); border-color: var(--green); color: var(--on-green); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pager .btn { min-width: 0; }
.pager .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- practice ---------- */
.task { font-size: 1.03rem; line-height: 1.9; }
.feedback { border-radius: var(--r-sm); padding: 12px 14px; }
.feedback.ok { background: var(--green-soft); }
.feedback.ok .fh { color: var(--green); }
.feedback.no { background: var(--danger-soft); }
.feedback.no .fh { color: var(--danger); }
.feedback.mid { background: var(--blue-soft); }
.feedback.mid .fh { color: var(--blue); }
.fh { font-weight: 700; }
.shake { animation: shake 0.28s ease-in-out; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.pop { animation: pop 0.22s ease-out; }
@keyframes pop { from { transform: scale(0.97); } to { transform: none; } }
.answer-code { font-family: var(--font-mono); direction: ltr; text-align: left; background: var(--term); border-radius: 6px; padding: 8px 12px; color: var(--term-green); white-space: pre-wrap; word-break: break-word; }
.task-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; width: 100%; text-align: start; min-height: 56px; }
.task-row:last-child { border-bottom: 0; }
.task-row:hover { background: var(--surface-2); }
details.group { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); overflow: hidden; }
details.group > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: center; gap: 10px; min-height: 56px; }
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary .chev { transform: rotate(-90deg); transition: transform 0.15s; }
details.group[open] > summary .chev { transform: rotate(90deg); }
details.group[open] > summary { border-bottom: 1px solid var(--line); }

/* ---------- batch editor ---------- */
.editor {
  border: 1px solid var(--term-line); border-radius: var(--r-md); overflow: hidden; background: var(--term); min-width: 0;
}
.editor-bar { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; background: var(--term-bar); border-bottom: 1px solid var(--term-line); direction: ltr; }
.editor-bar input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--term-fg); font-family: var(--font-mono); font-size: 0.875rem; outline: none; }
.editor-wrap { display: grid; grid-template-columns: auto minmax(0, 1fr); direction: ltr; }
.gutter { padding: 12px 8px 12px 10px; color: #4b555c; font-family: var(--font-mono); font-size: 14px; line-height: 1.6; text-align: right; user-select: none; white-space: pre; border-right: 1px solid var(--term-line); }
.editor textarea {
  width: 100%; min-height: 220px; resize: vertical; border: 0; outline: none; background: transparent; color: var(--term-fg);
  font-family: var(--font-mono); font-size: 14px; line-height: 1.6; padding: 12px; direction: ltr; text-align: left; white-space: pre; overflow-x: auto; tab-size: 4;
}
.editor-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.editor-actions .args { flex: 1 1 160px; min-width: 0; min-height: 44px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-family: var(--font-mono); direction: ltr; text-align: left; }
.split { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1100px) { .split.side { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.term.short .term-body { max-height: 360px; overflow-y: auto; }

/* ---------- quiz ---------- */
.q-kind { font-size: 0.75rem; color: var(--blue); background: var(--blue-soft); padding: 2px 10px; border-radius: 99px; }
.q-text { font-size: 1.06rem; font-weight: 500; line-height: 1.85; }
.q-code { font-family: var(--font-mono); direction: ltr; text-align: left; background: var(--term); color: var(--term-fg); border: 1px solid var(--term-line); border-radius: var(--r-sm); padding: 10px 14px; white-space: pre; overflow-x: auto; font-size: 0.875rem; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 10px 14px;
  border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface-2); text-align: start;
}
.opt .mark { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-strong); flex: 0 0 auto; display: grid; place-items: center; font-size: 0.75rem; }
.opt.code { font-family: var(--font-mono); }
.opt.code .otxt { direction: ltr; unicode-bidi: isolate; text-align: left; }
.opt.right { border-color: var(--green); background: var(--green-soft); }
.opt.right .mark { background: var(--green); border-color: var(--green); color: var(--on-green); }
.opt.wrong { border-color: var(--danger); background: var(--danger-soft); }
.opt.wrong .mark { background: var(--danger); border-color: var(--danger); color: #fff; }
.opt:disabled { cursor: default; }
.text-in {
  width: 100%; min-height: 50px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--term-line);
  background: var(--term); color: var(--term-green); font-family: var(--font-mono); font-size: 16px; direction: ltr; text-align: left;
}
.order-zone { min-height: 56px; display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: var(--r-sm); border: 1px dashed var(--line-strong); }
.order-zone:empty::before { content: attr(data-empty); color: var(--muted); font-size: 0.8125rem; padding: 8px; }
.order-item { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 8px 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface-2); font-family: var(--font-mono); direction: ltr; text-align: left; width: 100%; }
.order-item .num { font-size: 0.75rem; color: var(--muted); min-width: 1.5em; }
.order-item.right { border-color: var(--green); }
.order-item.wrong { border-color: var(--danger); }
.score-big { font-family: var(--font-mono); font-size: 3rem; font-weight: 700; direction: ltr; unicode-bidi: isolate; color: var(--green); }

/* ---------- library & search ---------- */
.search-in {
  width: 100%; min-height: 48px; padding: 0 14px 0 14px; border-radius: var(--r-sm); border: 1px solid var(--line);
  background: var(--surface); font-size: 1rem;
}
.search-in:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
.cat-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.cat-row button { flex: 0 0 auto; min-height: 36px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 0.8125rem; }
.cat-row button[aria-pressed="true"] { background: var(--green-soft); color: var(--green); border-color: transparent; }
.cmd-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--line); background: none; width: 100%; text-align: start; min-height: 60px; }
.cmd-row:last-child { border-bottom: 0; }
.cmd-row:hover { background: var(--surface-2); }
.cmd-name { font-family: var(--font-mono); font-weight: 600; color: var(--green); direction: ltr; unicode-bidi: isolate; min-width: 6.5em; text-align: left; }
.sw-table { width: 100%; border-collapse: collapse; }
.sw-table td { padding: 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.sw-table tr:last-child td { border-bottom: 0; }
.sw-table td:first-child { font-family: var(--font-mono); color: var(--green); direction: ltr; text-align: left; white-space: nowrap; padding-inline-end: 14px; width: 1%; }
.result-group h3 { margin-bottom: 6px; }
mark { background: color-mix(in srgb, var(--warn) 30%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

/* ---------- challenges ---------- */
.ch-card { display: flex; gap: 12px; align-items: flex-start; }
.ch-card .st { margin-top: 2px; }

/* ---------- progress & settings ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stats.four { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 640px) { .stats.four { grid-template-columns: repeat(4, 1fr); } }
.stat { min-width: 0; }
.stat .n { font-family: var(--font-mono); font-size: 1.375rem; font-weight: 700; direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 0.75rem; color: var(--muted); line-height: 1.5; }
@media (max-width: 420px) { .stat .n { font-size: 1.125rem; } }
.lvl-line { display: flex; flex-direction: column; gap: 6px; }
.pct { font-family: var(--font-mono); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.set-row { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row .lab { font-weight: 600; }
.status-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-inline-end: 6px; }
.status-dot.on { background: var(--green); }
.status-dot.off { background: var(--warn); }
.weak { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.weak:last-child { border-bottom: 0; }

/* dialog */
.dialog-back { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.55); display: grid; place-items: center; padding: 16px; }
.dialog { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 20px; display: flex; flex-direction: column; gap: 14px; }

.toast { position: fixed; z-index: 60; inset-inline: 16px; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; pointer-events: none; }
.toast > div { background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 0.875rem; animation: pop 0.2s ease-out; }
@media (min-width: 960px) { .toast { bottom: 24px; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
h1[tabindex="-1"]:focus { outline: none; }
.term.static .term-body { max-height: 30em; overflow-y: auto; }

:root { padding-top: env(safe-area-inset-top, 0px); }

/* ============================================================
   engine/seta.js — arithmetic for SET /A (32-bit integers)
   ============================================================ */
const SetA = (() => {
  function lex(s) {
    const toks = [];
    let i = 0;
    const ops = ["<<=", ">>=", "*=", "/=", "%=", "+=", "-=", "&=", "^=", "|=", "<<", ">>", "(", ")", "!", "~", "*", "/", "%", "+", "-", "&", "^", "|", "=", ","];
    while (i < s.length) {
      const c = s[i];
      if (/\s/.test(c)) { i++; continue; }
      if (/[0-9]/.test(c)) {
        const m = s.slice(i).match(/^(0x[0-9a-f]+|0[0-7]*|[1-9][0-9]*)/i);
        const bad = s.slice(i).match(/^[0-9][0-9a-z]*/i)[0];
        if (!m || m[0].length !== bad.length) throw new Error("Invalid number.  Numeric constants are either decimal (17),\nhexadecimal (0x11), or octal (021).");
        let v = m[0].toLowerCase().startsWith("0x") ? parseInt(m[0], 16) : m[0].length > 1 && m[0][0] === "0" ? parseInt(m[0], 8) : parseInt(m[0], 10);
        toks.push({ t: "num", v: v | 0 }); i += m[0].length; continue;
      }
      if (/[A-Za-z_$#@.{}\[\]]/.test(c)) {
        const m = s.slice(i).match(/^[^\s()!~*\/%+\-<>&^|=,]+/);
        toks.push({ t: "id", v: m[0] }); i += m[0].length; continue;
      }
      const op = ops.find((o) => s.startsWith(o, i));
      if (!op) throw new Error("Missing operator.");
      toks.push({ t: "op", v: op }); i += op.length;
    }
    return toks;
  }

  function evaluate(expr, sh) {
    const toks = lex(expr);
    let p = 0;
    const peek = () => toks[p];
    const isOp = (v) => peek() && peek().t === "op" && peek().v === v;
    const getVal = (name) => {
      const raw = Shell.getVar(sh, name);
      if (raw == null) return 0;
      const n = parseInt(String(raw).trim(), /^0x/i.test(String(raw).trim()) ? 16 : 10);
      return isNaN(n) ? 0 : n | 0;
    };
    function comma() {
      let v = assign();
      while (isOp(",")) { p++; v = assign(); }
      return v;
    }
    function assign() {
      const t = peek(), n = toks[p + 1];
      if (t && t.t === "id" && n && n.t === "op" && /^(<<|>>|[*\/%+\-&^|])?=$/.test(n.v)) {
        p += 2;
        const rhs = assign();
        const cur = getVal(t.v);
        let v;
        switch (n.v) {
          case "=": v = rhs; break;
          case "+=": v = cur + rhs; break;
          case "-=": v = cur - rhs; break;
          case "*=": v = Math.imul(cur, rhs); break;
          case "/=": if (!rhs) throw new Error("Divide by zero error."); v = Math.trunc(cur / rhs); break;
          case "%=": if (!rhs) throw new Error("Divide by zero error."); v = cur % rhs; break;
          case "&=": v = cur & rhs; break;
          case "^=": v = cur ^ rhs; break;
          case "|=": v = cur | rhs; break;
          case "<<=": v = cur << rhs; break;
          case ">>=": v = cur >> rhs; break;
        }
        v |= 0;
        Shell.lib.setVar(sh, t.v, String(v));
        return v;
      }
      return bor();
    }
    function bin(next, opsList, fn) {
      return () => {
        let v = next();
        while (peek() && peek().t === "op" && opsList.includes(peek().v)) { const o = toks[p++].v; v = fn(o, v, next()) | 0; }
        return v;
      };
    }
    const mul = bin(unary, ["*", "/", "%"], (o, a, b) => {
      if (o === "*") return Math.imul(a, b);
      if (!b) throw new Error("Divide by zero error.");
      return o === "/" ? Math.trunc(a / b) : a % b;
    });
    const add = bin(mul, ["+", "-"], (o, a, b) => (o === "+" ? a + b : a - b));
    const shift = bin(add, ["<<", ">>"], (o, a, b) => (o === "<<" ? a << b : a >> b));
    const band = bin(shift, ["&"], (o, a, b) => a & b);
    const bxor = bin(band, ["^"], (o, a, b) => a ^ b);
    const bor = bin(bxor, ["|"], (o, a, b) => a | b);
    function unary() {
      if (isOp("-")) { p++; return -unary() | 0; }
      if (isOp("+")) { p++; return unary(); }
      if (isOp("!")) { p++; return unary() ? 0 : 1; }
      if (isOp("~")) { p++; return ~unary(); }
      return primary();
    }
    function primary() {
      const t = peek();
      if (!t) throw new Error("Missing operand.");
      if (t.t === "num") { p++; return t.v; }
      if (t.t === "id") { p++; return getVal(t.v); }
      if (isOp("(")) {
        p++;
        const v = comma();
        if (!isOp(")")) throw new Error("Unbalanced parenthesis.");
        p++;
        return v;
      }
      throw new Error("Missing operand.");
    }
    if (!toks.length) throw new Error("The syntax of the command is incorrect.");
    const v = comma();
    if (p < toks.length) throw new Error(isOp(")") ? "Unbalanced parenthesis." : "Missing operator.");
    return v;
  }

  return { evaluate };
})();

        case "G": return ">";
        case "L": return "<";
        case "N": return sh.drive;

        case "T": return timeStr();

        case "$": return "$";

  /* ---------- variables ---------- */
  function findKey(sh, name) {
    const ln = String(name).toLowerCase();

  const p2 = (n) => String(n).padStart(2, "0");

  /* %var:~start,len%  and  %var:old=new% */
  function applyVarMod(val, mod) {

  /* Phase 1: %VAR% expansion. In a batch file also %0-%9, %*, %% -> %

  function expandPercent(text, sh, frame) {
    let out = "";
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (c !== "%") { out += c; continue; }
      if (frame) {

  /* %~nx1 style modifiers for arguments and for-variables */

    if (!mods) return v;
    const p = VFS.parse(v, sh.drive, sh.cwd);
    const full = VFS.fmt(p.drive, p.parts);
    const name = p.parts[p.parts.length - 1] || "";
    const dot = name.lastIndexOf(".");
    const base = dot > 0 ? name.slice(0, dot) : name;
    const ext = dot > 0 ? name.slice(dot) : "";
    if (mods.includes("f")) return full;
    let r = "";
    if (mods.includes("z")) { const n = VFS.resolve(sh.fs, p.drive, p.parts).node; return n ? String(n.size || 0) : ""; }

  /* ---------- tokenizing arguments ---------- */

  /* ---------- output helpers ---------- */
  const out = (lines, text) => { String(text).split("\n").forEach((t) => lines.push({ t: "out", text: t })); };

  /* ---------- path helpers for commands ---------- */

    summary: "Sorts input.",
    usage: "SORT [/R] [[drive1:][path1]filename1] [/O [drive2:][path2]filename2]\n\n  /R         Reverses the sort order; that is, sorts Z to A,\n             then 9 to 0.\n  [drive1:][path1]filename1\n             Specifies the file to be sorted.  If not specified, the\n             standard input is sorted.\n  /O [drive2:][path2]filename2\n             Specifies the file where the sorted input is to be stored.",

  /* ---------------- MORE ---------------- */
  def("more", [], {
    summary: "Displays output one screen at a time.",
    usage: "Displays output one screen at a time.\n\nMORE [drive:][path]filename\ncommand-name | MORE\n\nIf extended features are enabled, the following commands\nare accepted at the -- More -- prompt:\n\n    <space>   Display next page\n    <ret>     Display next line\n    Q         Quit",

    return yield* lib.exec(node, ctx, io);

  def("shift", [], { summary: "Shifts the position of replaceable parameters in batch files.", usage: "Changes the position of replaceable parameters in a batch file.\n\nSHIFT [/n]\n\nAfter SHIFT, %2 becomes %1, %3 becomes %2, and so on.", keep: true }, (sh, rest, lines, rec, io, ctx) => {
    if (rest.trim() === "/?") { showUsage(lines, COMMANDS.shift); return true; }
    if (!ctx.frame) { note(lines, msg("batch_only", { cmd: "shift" })); return true; }
    const m = rest.trim().match(/^\/(\d)$/);
    const n = m ? +m[1] : 0;
    ctx.frame.args.splice(n, 1);
    return true;
  });

  def("setlocal", [], {
    summary: "Begins localization of environment changes in a batch file.",
    usage: "Begins localization of environment changes in a batch file.  Environment\nchanges made after SETLOCAL has been issued are local to the batch file.\nENDLOCAL must be issued to restore the previous settings.\n\nSETLOCAL [ENABLEDELAYEDEXPANSION | DISABLEDELAYEDEXPANSION]\n\n  ENABLEDELAYEDEXPANSION / DISABLEDELAYEDEXPANSION\n      enable or disable delayed environment variable expansion (!var!).",
    keep: true,
  }, (sh, rest, lines, rec, io, ctx) => {
    const a = rest.trim().toLowerCase();
    if (a === "/?") { showUsage(lines, COMMANDS.setlocal); return true; }
    if (!ctx.frame) { note(lines, msg("batch_only", { cmd: "setlocal" })); return true; }
    sh.localStack.push({ env: Object.assign({}, sh.env), delayed: sh.delayed });
    ctx.frame.locals++;
    if (/enabledelayedexpansion/.test(a)) sh.delayed = true;
    if (/disabledelayedexpansion/.test(a)) sh.delayed = false;
    rec.args = a ? [a] : [];
    return true;
  });
  def("endlocal", [], { summary: "Ends localization of environment changes in a batch file.", usage: "Ends localization of environment changes in a batch file.\n\nENDLOCAL", keep: true }, (sh, rest, lines, rec, io, ctx) => {
    if (!ctx.frame) { note(lines, msg("batch_only", { cmd: "endlocal" })); return true; }
    if (ctx.frame.locals > 0) { lib.endLocal(sh); ctx.frame.locals--; }
    return true;
  });

  def("pause", [], { summary: "Suspends processing of a batch file and displays a message.", usage: "Suspends processing of a batch program and displays the message\n    Press any key to continue . . .\n\nPAUSE", keep: true }, function* (sh, rest, lines, rec, io) {
    if (rest.trim() === "/?") { showUsage(lines, COMMANDS.pause); return true; }
    // "pause >nul" waits without showing the message
    const hidden = io.stdout && io.stdout.kind && io.stdout.kind !== "screen";
    yield* ask(hidden ? "" : "Press any key to continue . . . ", "key");
    return true;
  });

  def("choice", [], {
    summary: "Asks the user to pick one key from a list (sets ERRORLEVEL).",
    usage: "CHOICE [/C choices] [/N] [/CS] [/T timeout /D choice] [/M text]\n\nDescription:\n    This tool allows users to select one item from a list\n    of choices and returns the index of the selected choice.\n\n   /C    choices       Specifies the list of choices to be created.\n                       Default list is \"YN\".\n   /N                  Hides the list of choices in the prompt.\n   /CS                 Enables case-sensitive choices to be selected.\n   /T    timeout       The number of seconds to pause before a default\n                       choice is made.\n   /D    choice        Specifies the default choice after nnnn seconds.\n   /M    text          Specifies the message to be displayed before\n                       the prompt.\n\n   ERRORLEVEL is set to the index of the key that was selected from\n   the set of choices. The first choice listed returns a value of 1,\n   the second a value of 2, and so on.\n\nExamples:\n   CHOICE /C YNC /M \"Press Y for Yes, N for No or C for Cancel.\"\n   CHOICE /C ab /M \"Select a for option 1 and b for option 2.\"",
  }, function* (sh, rest, lines, rec) {
    const toks = tokenize(rest);
    let choices = "YN", hide = false, cs = false, t = null, d = null, m = "";
    for (let i = 0; i < toks.length; i++) {
      const v = toks[i].v, lv = v.toLowerCase();
      if (lv === "/?") { showUsage(lines, COMMANDS.choice); return true; }
      if (lv === "/c") choices = (toks[++i] || { v: "YN" }).v;
      else if (/^\/c:?./.test(lv) && lv !== "/cs") choices = v.replace(/^\/c:?/i, "");
      else if (lv === "/n") hide = true;
      else if (lv === "/cs") cs = true;
      else if (lv === "/t") t = parseInt((toks[++i] || { v: "0" }).v, 10);
      else if (lv === "/d") d = (toks[++i] || { v: "" }).v;
      else if (lv === "/m") m = (toks[++i] || { v: "" }).v;
      else { err(lines, `ERROR: Invalid argument/option - '${v}'.`); out(lines, 'Type "CHOICE /?" for usage.'); return 255; }
    }
    rec.args = [choices];
    if (t != null && !d) { err(lines, "ERROR: Invalid syntax. /D is mandatory when /T is specified."); return 255; }
    const list = choices.split("");
    const promptText = (m ? m + " " : "") + (hide ? "" : `[${list.map((c) => (cs ? c : c.toUpperCase())).join(",")}]?`);
    for (let guard = 0; guard < 50; guard++) {
      let a = yield* ask(promptText, "key", t != null ? { timeout: t * 1000, def: d } : {});
      if (!a && d) a = d;
      const ch = a.slice(0, 1);
      const idx = list.findIndex((c) => (cs ? c === ch : c.toLowerCase() === ch.toLowerCase()));
      if (idx >= 0) { rec.choice = list[idx]; return idx + 1; }
    }
    return 255;
  });

  def("timeout", [], {
    summary: "Waits for a number of seconds (or until a key is pressed).",
    usage: "TIMEOUT [/T] timeout [/NOBREAK]\n\nDescription:\n    This utility accepts a timeout parameter to wait for the specified\n    time period (in seconds) or until any key is pressed. It also\n    accepts a parameter to ignore the key press.\n\n    /T        timeout       Specifies the number of seconds to wait.\n                            Valid range is -1 to 99999 seconds.\n\n    /NOBREAK                Ignore key presses and wait specified time.",
  }, function* (sh, rest, lines, rec) {
    const toks = tokenize(rest).map((t) => t.v.toLowerCase());
    if (toks.includes("/?")) { showUsage(lines, COMMANDS.timeout); return true; }
    const nb = toks.includes("/nobreak");
    const nTok = toks.filter((t) => t !== "/t" && t !== "/nobreak")[0];
    const n = parseInt(nTok, 10);
    if (isNaN(n) || n < -1 || n > 99999) { err(lines, "ERROR: Invalid value for timeout (/T) specified. Valid range is -1 to 99999."); return 1; }
    rec.args = [String(n)];
    out(lines, "");
    if (n === -1) { yield* ask("Press any key to continue ...", "key"); return true; }
    const secs = Math.min(n, 10);
    const a = yield { kind: "sleep", ms: secs * 1000, interruptible: !nb, prompt: `Waiting for ${String(n).padStart(2)} seconds, press ${nb ? "CTRL+C to quit" : "a key to continue"} ...`, countdown: n };
    out(lines, `Waiting for ${a && a !== "" && !nb ? String(Math.max(0, n - 1)).padStart(2) : " 0"} seconds, press ${nb ? "CTRL+C to quit" : "a key to continue"} ...`);
    if (n > 10) note(lines, msg("timeout_cap"));
    return true;
  });

  def("exit", [], {
    summary: "Quits the CMD.EXE program or the current batch script.",
    usage: "Quits the CMD.EXE program (command interpreter) or the current batch\nscript.\n\nEXIT [/B] [exitCode]\n\n  /B          specifies to exit the current batch script instead of\n              CMD.EXE.  If executed from outside a batch script, it\n              will quit CMD.EXE\n\n  exitCode    specifies a numeric number.  if /B is specified, sets\n              ERRORLEVEL that number.",
    keep: true,
  }, (sh, rest, lines, rec, io, ctx) => {
    const m = rest.trim().match(/^(\/b)?\s*(-?\d+)?/i);
    const code = m && m[2] != null ? parseInt(m[2], 10) : null;
    if (rest.trim() === "/?") { showUsage(lines, COMMANDS.exit); return true; }
    if (ctx.frame) {
      if (code != null) sh.errorlevel = code;
      if (m && m[1]) { ctx.frame.exit = true; return true; }
      // plain EXIT ends every running batch file (and would close the window)
      for (let f = ctx.frame; f; f = f.parent) f.exit = true;
      ctx.aborted = true;
      note(lines, msg("exit_batch"));
      return true;
    }
    if (code != null) sh.errorlevel = code;
    note(lines, msg("exit"));
    return true;
  });
})();

/* ============================================================
   engine/checker.js — checks a practice task or challenge against
   the sandbox state and what the learner ran, not against exact
   text. So "md X" and "mkdir X" are both accepted when folder X
   exists afterwards.
   attempt: list of command records (one per simple command)
   extra:   { output: all text printed during the attempt, lastOutput }
   ============================================================ */
const Checker = (() => {
  const norm = (s) => String(s || "").toLowerCase().replace(/\\+$/, "");
  const last = (a) => (a.length ? a[a.length - 1] : null);
  const node = (sh, path) => {
    const p = VFS.parse(path, sh.drive, sh.cwd);
    return VFS.resolve(sh.fs, p.drive, p.parts).node;
  };
  const named = (a, v) => a.filter((r) => r.name === v || (v === "cd" && r.name === "chdir"));
  /* the words appear in this order (each on its own line) */
  function inOrder(text, words) {
    const lines = String(text).split("\n");
    let pos = -1;
    for (const w of words) {
      const i = lines.findIndex((l, k) => k > pos && l.toLowerCase().includes(String(w).toLowerCase()));
      if (i < 0) return false;
      pos = i;
    }
    return true;
  }
  const textOf = (n) => (n && n.type === "file" && !n.binary ? n.content || "" : null);

  const RULES = {
    cmd: (c, sh, a) => { const l = last(a); return !!l && l.name === c.value; },
    anyCmd: (c, sh, a) => named(a, c.value).some((r) => r.ok || c.evenIfFailed),
    ok: (c, sh, a) => { const l = last(a); return !!l && l.ok; },
    switch: (c, sh, a) => {
      const pool = c.anyRun ? a : [last(a)].filter(Boolean);
      return pool.some((r) => (r.switches || []).includes(c.value.toLowerCase()) && (!c.cmd || r.name === c.cmd));
    },
    argIncludes: (c, sh, a) => {
      const pool = c.cmd ? named(a, c.cmd) : [last(a)].filter(Boolean);
      return pool.some((r) => (r.args || []).join(" ").toLowerCase().includes(c.value.toLowerCase()));
    },
    noArgs: (c, sh, a) => { const l = last(a); return !!l && !(l.args || []).length; },
    cwd: (c, sh) => norm(Shell.cwdPath(sh)) === norm(c.value),
    drive: (c, sh) => sh.drive === c.value.toUpperCase(),
    dirExists: (c, sh) => { const n = node(sh, c.path); return !!n && n.type === "dir"; },
    dirNotExists: (c, sh) => { const n = node(sh, c.path); return !n || n.type !== "dir"; },
    fileExists: (c, sh) => { const n = node(sh, c.path); return !!n && n.type === "file"; },
    fileNotExists: (c, sh) => !node(sh, c.path),
    fileContains: (c, sh) => {
      const t = textOf(node(sh, c.path));
      if (t == null) return false;
      return [].concat(c.value).every((v) => t.toLowerCase().includes(String(v).toLowerCase()));
    },
    fileLines: (c, sh) => { const t = textOf(node(sh, c.path)); return t != null && t.replace(/\n$/, "").split("\n").filter((x) => x.trim()).length === c.value; },
    fileAttr: (c, sh) => { const n = node(sh, c.path); return !!n && !!(n.attrs && n.attrs[c.attr]) === (c.value !== false); },
    countFiles: (c, sh) => {
      const p = VFS.parse(c.path, sh.drive, sh.cwd);
      const pat = p.parts[p.parts.length - 1];
      const dir = VFS.resolve(sh.fs, p.drive, p.parts.slice(0, -1)).node;
      if (!dir) return c.value === 0;
      const re = VFS.wildcardToRegex(pat);
      const n = Object.values(dir.children).filter((x) => x.type === "file" && re.test(x.name)).length;
      return c.op === "min" ? n >= c.value : n === c.value;
    },
    usedCd: (c, sh, a) => a.some((r) => r.name === "cd" && r.ok && r.pathKind === c.value),
    usedOp: (c, sh, a) => a.some((r) => {
      const info = r.line || {};
      const ops = (info.ops || []).concat(r.redirs || [], info.redirs || []);
      return ops.includes(c.value);
    }),
    outputIncludes: (c, sh, a, x) => [].concat(c.value).every((v) => (x.output || "").toLowerCase().includes(String(v).toLowerCase())),
    outputExcludes: (c, sh, a, x) => !(x.output || "").toLowerCase().includes(String(c.value).toLowerCase()),
    lastOutputIncludes: (c, sh, a, x) => (x.lastOutput || "").toLowerCase().includes(String(c.value).toLowerCase()),
    lastOutputExcludes: (c, sh, a, x) => !(x.lastOutput || "").toLowerCase().includes(String(c.value).toLowerCase()),
    outputOrder: (c, sh, a, x) => inOrder(x.lastOutput || "", c.value),
    fileOrder: (c, sh) => { const t = textOf(node(sh, c.path)); return t != null && inOrder(t, c.value); },
    errorlevel: (c, sh) => sh.errorlevel === c.value,
    inputIncludes: (c, sh, a) => a.some((r) => String(r.input || "").toLowerCase().includes(String(c.value).toLowerCase())),
    envIncludes: (c, sh) => { const v = Shell.getVar(sh, c.name); return v != null && String(v).toLowerCase().includes(String(c.value).toLowerCase()); },
    envEquals: (c, sh) => { const v = Shell.getVar(sh, c.name); return v != null && (c.value == null || String(v).toLowerCase() === String(c.value).toLowerCase()); },
    procGone: (c, sh) => !sh.procs.some((p) => p.name.toLowerCase() === c.value.toLowerCase()),
    serviceState: (c, sh) => { const s = sh.services.find((x) => x.name.toLowerCase() === c.name.toLowerCase()); return !!s && s.state === c.value; },
    netConnected: (c, sh) => sh.net.connected === (c.value !== false),
    driveExists: (c, sh) => !!sh.fs.drives[c.value.toUpperCase()],
    driveLabel: (c, sh) => { const d = sh.fs.drives[c.drive.toUpperCase()]; return !!d && String(d.label).toLowerCase() === String(c.value).toLowerCase(); },
    driveEmpty: (c, sh) => { const d = sh.fs.drives[c.value.toUpperCase()]; return !!d && !Object.keys(d.root.children).length; },
    ranBatch: (c, sh, a) => a.some((r) => r.name === "batch"),
    dpUsed: (c, sh, a) => a.some((r) => (r.dp || []).some((l) => l.startsWith(c.value))),
    any: (c, sh, a, x) => c.of.some((sub) => evaluate([sub], sh, a, x)),
    not: (c, sh, a, x) => !evaluate([c.check], sh, a, x),
  };

  /* Returns true when every check passes. */
  function evaluate(checks, sh, attempt, extra = {}) {
    return checks.every((c) => {
      const f = RULES[c.type];
      return f ? f(c, sh, attempt, extra) : false;
    });
  }

  /* Normalize a typed answer for quiz "write the command" questions. */
  function sameCommand(input, accepted) {
    const n = (s) => String(s).trim().replace(/\s+/g, " ").toLowerCase();
    return accepted.some((a) => n(a) === n(input));
  }

  /* Build a fresh sandbox for a task spec */
  function shellFor(spec) {
    const sh = Shell.create({ admin: spec.admin, mode: spec.mode, files: spec.files });
    if (spec.start) Shell.setLocation(sh, spec.start);
    else if (spec.batch) Shell.setLocation(sh, "C:\\Users\\Student\\Desktop");
    const su = spec.setup || {};
    if (su.net === false) sh.net.connected = false;
    if (su.sysCorrupt) sh.sysCorrupt = true;
    if (su.storeCorrupt) sh.storeCorrupt = true;
    if (su.diskErrors) sh.diskErrors = Object.assign({}, su.diskErrors);
    (su.remove || []).forEach((p) => {
      const pp = VFS.parse(p, sh.drive, sh.cwd);
      const dir = VFS.resolve(sh.fs, pp.drive, pp.parts.slice(0, -1)).node;
      if (dir) VFS.remove(dir, pp.parts[pp.parts.length - 1]);
    });
    (su.mkdir || []).forEach((p) => { const pp = VFS.parse(p, sh.drive, sh.cwd); VFS.mkdirp(sh.fs, pp.drive, pp.parts); });
    (su.hide || []).forEach((p) => { const pp = VFS.parse(p, sh.drive, sh.cwd); const n = VFS.resolve(sh.fs, pp.drive, pp.parts).node; if (n) n.attrs = Object.assign({}, n.attrs, { h: true }); });
    (su.readonly || []).forEach((p) => { const pp = VFS.parse(p, sh.drive, sh.cwd); const n = VFS.resolve(sh.fs, pp.drive, pp.parts).node; if (n) n.attrs = Object.assign({}, n.attrs, { r: true }); });
    if (su.env) Object.keys(su.env).forEach((k) => Shell.lib.setVar(sh, k, su.env[k]));
    return sh;
  }


  /* Run a lesson demo in a fresh sandbox -> lines for StaticTerminal */
  function demo(spec) {
    const sh = shellFor(spec);
    const lines = [];
    spec.cmds.forEach((cmd) => {
      lines.push({ p: Shell.prompt(sh), c: cmd });
      const r = Shell.runAll(sh, cmd, (spec.inputs || []).slice(), { defaultAnswer: "" });
      r.lines.forEach((l) => {
        if (l.t === "out" || l.t === "err") lines.push({ o: l.text, e: l.t === "err" });
        else if (l.t === "cmd") lines.push({ p: l.p, c: l.c });
      });
    });
    lines.push({ p: Shell.prompt(sh), c: "" });
    return lines;
  }

  return { evaluate, sameCommand, RULES, shellFor, demo };
})();

/* ============================================================
   data/content.js — read-only access to course content.
   The UI never hard-codes lessons; it asks Content.
   ============================================================ */
const Content = (() => {
  let D = null;
  const byNum = {};
  const order = [];
  const questions = {};      // qid -> question (with lesson)
  const commands = {};       // name -> library entry
  const cmdAlias = {};       // alias -> name
  let searchIndex = null;

  function init(json) {
    D = json;
    const full = {};
    D.lessons.forEach((l) => {
      full[l.n] = l;
      (l.quiz || []).forEach((q, i) => { q.id = `L${l.n}-${i + 1}`; q.lesson = l.n; questions[q.id] = q; });
      (l.practice || []).forEach((p) => { p.lesson = l.n; });
    });
    D.curriculum.levels.forEach((lv) => {
      lv.chapters.forEach((ch) => {
        ch.lessons.forEach((o) => {
          byNum[o.n] = { ...o, level: lv.id, chapter: ch.id, chapterTitle: ch.title, full: full[o.n] || null };
          order.push(o.n);
        });
      });
    });
    (D.commands || []).forEach((c) => {
      commands[c.name] = c;
      (c.aliases || []).forEach((a) => { cmdAlias[a] = c.name; });
    });
    // link library entries to lessons
    all().forEach((l) => {
      [l.c].concat(l.aliases || [], (l.full && l.full.commands) || []).filter(Boolean).forEach((name) => {
        const c = command(name);
        if (c) { c.lessons = c.lessons || []; if (!c.lessons.includes(l.n)) c.lessons.push(l.n); }
      });
    });
    Object.values(commands).forEach((c) => { if (c.lessons) c.lessons.sort((a, b) => a - b); });
  }

  const levels = () => D.curriculum.levels;
  const level = (id) => D.curriculum.levels.find((x) => x.id === id);
  const lesson = (n) => byNum[n] || null;
  function all() { return order.map((n) => byNum[n]); }
  const available = () => all().filter((l) => l.full);
  const total = () => order.length;
  const levelLessons = (id) => all().filter((l) => l.level === id);
  const chapterLessons = (id) => all().filter((l) => l.chapter === id);
  function chapter(id) {
    for (const lv of D.curriculum.levels) for (const ch of lv.chapters) if (ch.id === id) return { ...ch, level: lv.id };
    return null;
  }
  const chapters = () => D.curriculum.levels.flatMap((lv) => lv.chapters.map((ch) => ({ ...ch, level: lv.id })));
  const tasks = () => available().flatMap((l) => l.full.practice.map((p) => ({ ...p, lesson: l.n })));
  const task = (id) => tasks().find((t) => t.id === id) || null;
  const nextLesson = (n) => { const i = order.indexOf(n); return i >= 0 && i < order.length - 1 ? byNum[order[i + 1]] : null; };
  const prevLesson = (n) => { const i = order.indexOf(n); return i > 0 ? byNum[order[i - 1]] : null; };
  const question = (qid) => questions[qid] || null;

  /* Quizzes: "L3" lesson, "C1" chapter, "V1" level, "R" review of mistakes */
  function quiz(id) {
    if (id[0] === "L") {
      const l = lesson(+id.slice(1));
      return l && l.full ? { id, kind: "lesson", title: l.t, lesson: l.n, questions: l.full.quiz } : null;
    }
    if (id[0] === "C") {
      const ch = chapter(+id.slice(1));
      if (!ch) return null;
      const qs = chapterLessons(ch.id).filter((l) => l.full).flatMap((l) => l.full.quiz);
      return qs.length ? { id, kind: "chapter", title: ch.title, chapter: ch.id, questions: qs, pick: 8 } : null;
    }
    if (id[0] === "V") {
      const lv = level(+id.slice(1));
      if (!lv) return null;
      const qs = levelLessons(lv.id).filter((l) => l.full).flatMap((l) => l.full.quiz);
      return qs.length ? { id, kind: "level", title: `Level ${lv.id} — ${lv.code}`, level: lv.id, questions: qs, pick: 15 } : null;
    }
    if (id === "R") {
      const qs = Store.mistakes().map(question).filter(Boolean);
      return { id, kind: "review", title: "مرور اشتباه‌ها", questions: qs, pick: 12 };
    }
    return null;
  }
  const chapterQuizzes = () => chapters().map((ch) => quiz("C" + ch.id)).filter(Boolean);

  /* command -> lesson number, so the Simulator can say "taught in lesson N" */
  function shellIndex() {
    const idx = {};
    all().forEach((l) => {
      if (l.c && !(l.c in idx)) idx[l.c] = l.n;
      (l.aliases || []).forEach((a) => { if (!(a in idx)) idx[a] = l.n; });
    });
    return idx;
  }

  /* ---------- command library ---------- */
  function command(name) {
    const n = String(name || "").toLowerCase();
    return commands[n] || commands[cmdAlias[n]] || null;
  }
  const commandList = () => Object.values(commands).sort((a, b) => a.name.localeCompare(b.name));
  const categories = () => D.categories || [];

  /* ---------- challenges ---------- */
  const challenges = () => D.challenges || [];
  const challenge = (id) => challenges().find((c) => c.id === id) || null;

  /* ---------- search ---------- */
  function normFa(s) {
    return String(s || "").toLowerCase()
      .replace(/[يى]/g, "ی").replace(/ك/g, "ک").replace(/[‌‏ً-ٟ]/g, "")
      .replace(/[`"'«»]/g, "").replace(/\s+/g, " ").trim();
  }
  function buildIndex() {
    const idx = [];
    commandList().forEach((c) => idx.push({ kind: "cmd", id: c.name, title: c.name, sub: c.summary, text: normFa([c.name, (c.aliases || []).join(" "), c.summary, c.full, c.category, (c.keywords || []).join(" ")].join(" ")) }));
    available().forEach((l) => {
      const f = l.full;
      idx.push({ kind: "lesson", id: l.n, title: l.t, sub: `Lesson ${l.n} · ${f.term}`, text: normFa([l.t, f.term, f.fullForm, f.summary, f.objective, l.c, (l.aliases || []).join(" "), f.meaning].join(" ")) });

/* ============================================================
   store/progress.js — learning data saved on this device only.
   One small interface so Cloud Sync can replace it later.
   ============================================================ */
const Store = (() => {
  const KEY = "cmdacademy.progress.v1";
  const empty = () => ({
    v: 2, practice: {}, quiz: {}, seen: {}, answers: {}, cmdErrors: {}, challenges: {},
    favs: { cmd: [], lesson: [], ex: [] }, days: {}, recent: [], scripts: {},
    settings: { theme: "dark", font: 1 },
  });
  let s = empty();
  let persistent = true;
  const listeners = [];

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const d = JSON.parse(raw);
        s = Object.assign(empty(), d);
        s.favs = Object.assign({ cmd: [], lesson: [], ex: [] }, d.favs || {});
        s.settings = Object.assign({ theme: "dark", font: 1 }, d.settings || {});
        s.v = 2;
      }
    } catch (e) { persistent = false; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(s)); persistent = true; } catch (e) { persistent = false; }
    listeners.forEach((f) => { try { f(); } catch (e) {} });
  }
  function today() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
  function touch() { s.days[today()] = true; }

  /* ---------- practice & challenges ---------- */
  function markPractice(id) {
    if (!s.practice[id]) { s.practice[id] = true; touch(); }
    const t = Content.task(id);
    if (t) noteLessonDone(t.lesson);
    save();
  }
  const practiceDone = (id) => !!s.practice[id];
  function markChallenge(id) { if (!s.challenges[id]) { s.challenges[id] = true; touch(); save(); } }
  const challengeDone = (id) => !!s.challenges[id];
  function cmdError(name) {
    if (!name || name === "?" || /[^\w.-]/.test(name)) return;
    s.cmdErrors[name] = (s.cmdErrors[name] || 0) + 1;
    save();
  }
  function weakCommands(n = 5) {
    return Object.entries(s.cmdErrors).sort((a, b) => b[1] - a[1]).slice(0, n).map(([cmd, count]) => ({ cmd, count }));
  }
  const markSeen = (n) => { if (!s.seen[n]) { s.seen[n] = true; save(); } };

  /* ---------- quiz ---------- */
  function answer(qid, right, lesson) {
    const a = s.answers[qid] || { right: 0, wrong: 0, lesson };
    if (right) a.right++; else a.wrong++;
    a.lastWrong = !right;
    a.lesson = lesson;
    s.answers[qid] = a;
    touch();
    save();
  }
  function setQuiz(id, score, total) {
    const prev = s.quiz[id];
    if (!prev || score / total >= prev.best / prev.total) s.quiz[id] = { best: score, total };
    if (id[0] === "L") noteLessonDone(+id.slice(1));
    touch();
    save();
  }
  const quizBest = (id) => s.quiz[id] || null;
  function accuracy() {
    let r = 0, w = 0;
    Object.values(s.answers).forEach((a) => { r += a.right; w += a.wrong; });
    return { right: r, wrong: w, pct: r + w ? Math.round((r / (r + w)) * 100) : null };
  }
  const mistakes = () => Object.keys(s.answers).filter((k) => s.answers[k].lastWrong);

  /* ---------- lessons ---------- */
  /* A lesson is done when all its practice tasks are solved
     and its Mini Quiz was passed with at least half correct. */
  function lessonParts(l) {
    if (!l || !l.full) return null;
    const ids = l.full.practice.map((p) => p.id);
    const done = ids.filter(practiceDone).length;
    const q = quizBest("L" + l.n);
    const quizOk = !!q && q.best / q.total >= 0.5;
    const pct = Math.round(((done + (quizOk ? 1 : 0)) / (ids.length + 1)) * 100);
    return { practiceDone: done, practiceTotal: ids.length, quizOk, quiz: q, pct };
  }
  function lessonDone(l) {
    const p = lessonParts(l);
    return !!p && p.practiceDone === p.practiceTotal && p.quizOk;
  }
  function noteLessonDone(n) {
    const l = Content.lesson(n);
    if (l && lessonDone(l) && !s.recent.includes(n)) { s.recent.push(n); if (s.recent.length > 20) s.recent.shift(); }
  }
  function currentLesson() { return Content.available().find((l) => !lessonDone(l)) || null; }
  function lessonStatus(l) {
    if (!l.full) return "soon";
    if (lessonDone(l)) return "done";
    const c = currentLesson();
    if (c && c.n === l.n) return "current";
    const p = lessonParts(l);
    return p && (p.practiceDone || p.quiz) ? "started" : "open";
  }
  const recentLessons = () => s.recent.slice(-5).reverse();

  /* ---------- streak ---------- */
  function streak() {
    let n = 0;
    const d = new Date();
    const key = (x) => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
    if (!s.days[key(d)]) d.setDate(d.getDate() - 1);
    while (s.days[key(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  /* ---------- favorites ---------- */
  function isFav(kind, id) { return s.favs[kind].includes(String(id)); }
  function toggleFav(kind, id) {
    id = String(id);
    const arr = s.favs[kind];
    const i = arr.indexOf(id);
    if (i >= 0) arr.splice(i, 1); else arr.push(id);
    save();
    return i < 0;
  }
  const favs = () => s.favs;

  /* ---------- batch scripts & settings ---------- */
  const scripts = () => s.scripts;
  function saveScript(name, text) { s.scripts[name] = text; save(); }
  function deleteScript(name) { delete s.scripts[name]; save(); }
  const settings = () => s.settings;
  function setSetting(k, v) { s.settings[k] = v; save(); }

  function reset() { const keep = s.settings; s = empty(); s.settings = keep; save(); }
  const isPersistent = () => persistent;
  const onChange = (f) => listeners.push(f);
  const raw = () => s;

  return {
    load, markPractice, practiceDone, markChallenge, challengeDone, cmdError, weakCommands, markSeen,
    answer, setQuiz, quizBest, accuracy, mistakes, lessonParts, lessonDone, currentLesson, lessonStatus, recentLessons,
    streak, isFav, toggleFav, favs, scripts, saveScript, deleteScript, settings, setSetting, reset, isPersistent, onChange, raw,
  };
})();

function h(tag, props, ...kids) {

      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === "style" && typeof v === "object") Object.assign(el.style, v);

}

}

}

    }
    (r.recs || []).forEach((rec) => {
      if (rec.clipboard != null) { try { navigator.clipboard.writeText(rec.clipboard).catch(() => {}); } catch (e) {} }
    });
    wait = r.wait || null;
    clearTimeout(timer);
    if (wait) {
      const parts = String(wait.prompt || "").split("\n");
      parts.slice(0, -1).forEach((p) => addLine({ t: "out", text: p }));
      if (wait.kind === "sleep") timer = setTimeout(() => resume(""), wait.ms || 0);
      else if (wait.timeout) timer = setTimeout(() => resume(""), wait.timeout);
    }
    refreshPrompt();
    scroll();
    if (!wait && acc) {
      const a = acc; acc = null;
      if (onCommand) onCommand({ recs: a.recs, rec: a.recs[a.recs.length - 1] || null, output: a.out.join("\n"), lastOutput: a.out.join("\n"), raw: a.raw });
    }
  }

  function resume(answer) {
    if (!wait) return;
    const w = wait;
    clearTimeout(timer);
    if (w.kind !== "sleep") {
      const parts = String(w.prompt || "").split("\n");
      addLine({ t: "cmd", p: parts[parts.length - 1], c: answer });
      if (acc) acc.out.push(parts[parts.length - 1] + answer);
    }
    wait = null;
    handle(Shell.run(sh, answer));
  }

  function submit(v) {
    if (wait) { resume(v); return; }
    if (v.trim()) { history.push(v); hIdx = history.length; }
    addLine({ t: "cmd", p: Shell.prompt(sh), c: v });
    if (!v.trim()) { refreshPrompt(); scroll(); return; }
    acc = { recs: [], out: [], raw: v };
    handle(Shell.run(sh, v));
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (wait && wait.kind === "sleep") { if (wait.interruptible) resume("key"); return; }
    const v = input.value;
    input.value = "";
    submit(v);
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "c" && e.ctrlKey) { e.preventDefault(); ctrlC(); return; }
    if (wait && wait.kind === "key" && e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
      e.preventDefault(); input.value = ""; resume(e.key); return;
    }
    if (wait && wait.kind === "sleep" && wait.interruptible && e.key.length === 1) { e.preventDefault(); resume("key"); return; }
    if (wait) return;
    if (e.key === "ArrowUp") { e.preventDefault(); recall(-1); }
    if (e.key === "ArrowDown") { e.preventDefault(); recall(1); }
    if (e.key === "Tab") { e.preventDefault(); complete(); }
  });
  // phones often send "input" without a usable keydown
  input.addEventListener("input", () => {
    if (wait && wait.kind === "key" && input.value) { const ch = input.value.slice(-1); input.value = ""; resume(ch); }
  });
  function recall(d) {
    if (!history.length) return;
    hIdx = Math.max(0, Math.min(history.length, hIdx + d));
    input.value = history[hIdx] || "";
  }
  /* Tab: complete a file or folder name from the current folder */
  function complete() {
    const v = input.value;
    const m = v.match(/^(.*?)("?)([^\s"]*)$/);
    if (!m) return;
    const word = m[3];
    const cut = word.lastIndexOf("\\");
    const dirPart = cut >= 0 ? word.slice(0, cut + 1) : "";
    const namePart = cut >= 0 ? word.slice(cut + 1) : word;
    const p = VFS.parse(dirPart || ".", sh.drive, sh.cwd);
    const dir = VFS.resolve(sh.fs, p.drive, p.parts).node;
    if (!dir || dir.type !== "dir") return;
    const hit = VFS.sortedChildren(dir).find((c) => c.name.toLowerCase().startsWith(namePart.toLowerCase()) && !(c.attrs && c.attrs.h));
    if (!hit) return;
    const full = dirPart + hit.name;
    input.value = m[1] + (/\s/.test(full) ? '"' + full + '"' : m[2] + full);
  }
  function insert(txt) {
    if (wait && wait.kind === "key") { resume(txt.trim() || " "); return; }
    const s = input.selectionStart ?? input.value.length, e = input.selectionEnd ?? s;
    input.value = input.value.slice(0, s) + txt + input.value.slice(e);
    input.focus();
    const p = s + txt.length;
    try { input.setSelectionRange(p, p); } catch (err) {}
  }
  function ctrlC() {
    clearTimeout(timer);
    if (wait) {
      const r = Shell.cancel(sh);
      wait = null;
      if (r) addLines(r.lines);
      if (acc) { const a = acc; acc = null; if (onCommand) onCommand({ recs: a.recs, rec: a.recs[a.recs.length - 1] || null, output: a.out.join("\n"), raw: a.raw, cancelled: true }); }
    } else {
      addLine({ t: "cmd", p: Shell.prompt(sh), c: input.value + "^C" });
      input.value = "";
    }
    refreshPrompt(); scroll(); input.focus();
  }
  body.appendChild(form);
  body.addEventListener("click", () => {
    if (window.getSelection().toString()) return;
    if (wait && wait.kind === "sleep" && wait.interruptible) { resume("key"); return; }
    input.focus();
  });

  const keyBtn = (label, fn, extra = {}) => h("button", Object.assign({ type: "button", class: "key", onClick: (e) => { e.preventDefault(); fn(); } }, extra), label);
  const keyRow = keys ? h("div", { class: "keys" },
    ["\\", ":", "..", '"', "*", ">", "|", "&", "%", "/"].map((k) => keyBtn(k, () => insert(k), { "aria-label": k })),
    keyBtn("Tab", () => { complete(); input.focus(); }, { class: "key wide" }),
    keyBtn("↑", () => { recall(-1); input.focus(); }, { "aria-label": "history" }),
    keyBtn("Ctrl+C", ctrlC, { class: "key wide danger-key", "aria-label": "Ctrl+C" }),
    h("button", { type: "button", class: "key run", onClick: () => { if (form.requestSubmit) form.requestSubmit(); else form.dispatchEvent(new Event("submit", { cancelable: true })); } }, "اجرا ↵"),
  ) : null;

  const bar = h("div", { class: "term-bar" }, h("div", { class: "term-tab" }, h("span", { class: "ti" }, ">_"), titleEl), h("div", { class: "spacer" }));
  const wrap = h("div", { class: "term" + (cls ? " " + cls : ""), dir: "ltr" }, bar, body, keyRow);

  function start() {
    clearTimeout(timer);
    wait = null; acc = null;
    clear();
    if (banner) addLines(Shell.banner());
    if (preload) preload.forEach((ln) => addLines([ln.p != null ? { t: "cmd", p: ln.p, c: ln.c } : { t: "out", text: ln.o }]));
    refreshPrompt();
  }
  start();

  return {
    el: wrap,
    bar,
    focus: () => { try { input.focus({ preventScroll: true }); } catch (e) {} },
    reset(newSh) { sh = newSh; start(); },
    note(text) { addLines([{ t: "note", text }]); scroll(); },
    /* run a command as if typed (used by "try it" buttons and the Batch editor) */
    run(text) { if (wait) ctrlC(); submit(text); },
    get sh() { return sh; },
    busy: () => !!wait,
    destroy() { clearTimeout(timer); },
  };
}

    gutter.style.height = ta.offsetHeight ? ta.offsetHeight + "px" : "";

  ta.addEventListener("input", () => { syncGutter(); if (persist) persist(nameIn.value, ta.value); });

  function save() {

    const p = VFS.parse("C:\\Users\\Student\\Desktop", "C", sh.cwd);
    const dir = VFS.resolve(sh.fs, p.drive, p.parts).node;

    VFS.writeFile(dir, n, ta.value.replace(/\r/g, "") + (ta.value.endsWith("\n") ? "" : "\n"), false);
    if (persist) persist(n, ta.value);
    return n;
  }
  function run() {
    const n = save();
    if (!n) return;
    const a = argsIn ? argsIn.value.trim() : "";
    const here = Shell.cwdPath(term.sh).toLowerCase() === "c:\\users\\student\\desktop";
    const target = here ? n : `"C:\\Users\\Student\\Desktop\\${n}"`;
    if (onRun) onRun(n);

    h("div", { class: "editor" },
      h("div", { class: "editor-bar" }, h("span", { style: { color: "var(--term-green)" } }, "📄"), nameIn),
      h("div", { class: "editor-wrap" }, gutter, ta)),
    h("div", { class: "editor-actions" }, runBtn, argsIn, h("button", { class: "btn small ghost", onClick: () => { save(); toast(T("batch_saved")); } }, icon("save"), T("batch_save"))));
  setTimeout(syncGutter, 0);
  return { el, run, save, setCode(c) { ta.value = c; syncGutter(); }, getCode: () => ta.value, nameIn, ta };
}

/* Runs a task (practice or challenge): terminal or batch editor + checks + hints */
function TaskRunner(spec, { onSolved, solvedBefore }) {
  const sh = Checker.shellFor(spec);
  const st = { attempt: [], output: "", fails: 0, solved: false, revealed: false };
  const fb = h("div", { "aria-live": "polite" });
  const answerLines = [].concat(spec.answer || []);

  function showFb(kind, content) {
    fb.innerHTML = "";
    fb.appendChild(h("div", { class: "feedback " + kind + (kind === "no" ? " shake" : " pop") }, content));
  }
  function answerBox() {
    const box = () => h("div", { class: "stack-xs" },
      h("div", { class: "answer-code" }, answerLines.join("\n")),
      spec.explain ? h("div", { class: "small" }, fmt(spec.explain)) : null);
    if (st.revealed) return box();
    const b = h("button", { class: "btn small", onClick: () => { st.revealed = true; b.replaceWith(box()); } }, T("show_answer"));
    return b;
  }
  function check(res) {
    st.attempt.push(...res.recs);
    st.output += "\n" + (res.output || "");
    if (st.solved) return;
    const extra = { output: st.output, lastOutput: res.output || "" };
    if (Checker.evaluate(spec.checks, sh, st.attempt, extra)) {
      st.solved = true;
      showFb("ok", h("div", { class: "stack-sm" }, h("div", { class: "fh" }, T("correct")), spec.success ? h("div", null, fmt(spec.success)) : null, onSolved ? onSolved() : null));
      return;
    }
    const failed = res.recs.filter((r) => !r.ok && r.name && r.name !== "batch");
    if (!spec.batch) failed.forEach((r) => Store.cmdError(r.name));
    if (res.cancelled) return;
    if ((spec.multi || spec.batch) && !failed.length && !res.recs.some((r) => r.syntaxError)) {
      if (spec.batch) { st.fails++; }
      else { showFb("mid", h("div", { class: "fh" }, T("keep_going"))); return; }
    } else st.fails++;
    const hint = (spec.hints || [])[Math.min(st.fails - 1, (spec.hints || []).length - 1)];
    showFb("no", h("div", { class: "stack-sm" },
      h("div", { class: "fh" }, T("not_yet")),
      hint ? h("div", null, h("b", { class: "mono" }, "Hint: "), fmt(hint)) : null,
      st.fails >= 2 && answerLines.length ? answerBox() : null));
  }

  const term = InteractiveTerminal({ sh, preload: spec.preload, onCommand: check, title: spec.mode === "winre" ? "Administrator: X:\\windows\\system32\\cmd.exe" : undefined, cls: spec.batch ? "short" : "" });
  let editor = null;
  if (spec.batch) {
    editor = BatchEditor({ sh, term, file: spec.batch.file || "script.bat", starter: spec.batch.starter || "", showArgs: spec.batch.args !== false && spec.batch.args !== undefined, args: typeof spec.batch.args === "string" ? spec.batch.args : "", fixedName: true });
  }
  const resetBtn = h("button", { class: "btn small ghost", onClick: () => App.render() }, icon("reset"), T("restart"));
  const el = h("div", { class: "stack" },
    h("div", { class: "card stack-sm" },
      h("p", { class: "task" }, fmt(spec.task)),
      spec.admin ? h("div", { class: "small muted" }, "🛡 " + T("admin_task")) : null,
      spec.mode === "winre" ? h("div", { class: "small muted" }, "🧰 " + T("winre_task")) : null,
      solvedBefore ? h("div", { class: "small", style: { color: "var(--green)" } }, "✓ " + T("solved_before")) : null),
    editor ? h("div", { class: "split side" }, editor.el, term.el) : term.el,
    fb);
  setTimeout(() => (editor ? editor.ta.focus() : term.focus()), 60);
  return { el, resetBtn, term };
}

    App.state.simTerm = InteractiveTerminal({ sh: App.state.simSh, banner: true, title: m === "winre" ? "X:\\windows\\system32\\cmd.exe" : "Command Prompt" });
