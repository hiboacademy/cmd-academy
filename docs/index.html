/* ============================================================
   ui/styles.css — CMD Academy design tokens + layout
   Layout: phone = single column + bottom nav;
           ≥ 960px = sidebar on the right (RTL start) + wide content.
   Dark-only by design (a terminal-first learning tool).
   ============================================================ */
:root {
  --bg: #0b0d0e;
  --surface: #131618;
  --surface-2: #1a1e21;
  --line: #262c30;
  --term: #08090a;
  --fg: #e8ebed;
  --muted: #8e979e;
  --green: #4fd18b;
  --green-soft: rgba(79, 209, 139, 0.12);
  --blue: #6cb2ff;
  --blue-soft: rgba(108, 178, 255, 0.12);
  --warn: #f2b54e;
  --warn-soft: rgba(242, 181, 78, 0.12);
  --danger: #ff6f6f;
  --danger-soft: rgba(255, 111, 111, 0.12);

  --font-fa: "Vazirmatn", "Tahoma", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, "Courier New", monospace;

  --r-sm: 8px;
  --r-md: 12px;
  --nav-h: 64px;
  --gutter: 16px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-fa);
  font-size: 15px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }

/* ---------- code & LTR islands ---------- */
.mono, code, kbd { font-family: var(--font-mono); }
.ltr { direction: ltr; unicode-bidi: isolate; text-align: left; }
code.ic {
  direction: ltr; unicode-bidi: isolate;
  font-size: 0.86em; padding: 1px 6px; border-radius: 5px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--fg);
  white-space: nowrap;
}

/* ---------- app shell ---------- */
.app { min-height: 100%; }
.main {
  padding-inline: var(--gutter);
  padding-block: 20px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
  max-width: 720px;
  margin-inline: auto;
}
.main.wide { max-width: 1080px; }
.view { animation: viewIn 0.16s ease-out; }
@keyframes viewIn { from { opacity: 0.4; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.bottom-nav {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: rgba(11, 13, 14, 0.94);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.nav-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  height: var(--nav-h); border: 0; background: none; color: var(--muted);
  font-size: 11.5px; line-height: 1.2;
}
.nav-btn svg { width: 22px; height: 22px; }
.nav-btn[aria-current="page"] { color: var(--green); }

.sidebar { display: none; }

@media (min-width: 640px) {
  :root { --gutter: 28px; }
  body { font-size: 16px; }
}
@media (min-width: 960px) {
  .app { display: grid; grid-template-columns: 240px 1fr; }
  .bottom-nav { display: none; }
  .sidebar {
    display: flex; flex-direction: column; gap: 4px;
    position: sticky; top: 0; height: 100vh;
    padding: 28px 16px; border-inline-end: 1px solid var(--line); background: var(--surface);
  }
  .sidebar .brand { font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.18em; color: var(--green); font-size: 14px; padding: 0 10px 22px; direction: ltr; text-align: right; }
  .side-btn {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; border-radius: var(--r-sm);
    background: none; color: var(--muted); text-align: start;
  }
  .side-btn svg { width: 20px; height: 20px; }
  .side-btn:hover { background: var(--surface-2); color: var(--fg); }
  .side-btn[aria-current="page"] { background: var(--green-soft); color: var(--green); }
  .side-sep { height: 1px; background: var(--line); margin: 10px 4px; }
  .main { padding-block: 36px 48px; }
}

/* ---------- typography ---------- */
.eyebrow {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--muted); direction: ltr; unicode-bidi: isolate;
}
h1, h2, h3 { margin: 0; line-height: 1.4; text-wrap: balance; }
h1 { font-size: 24px; font-weight: 700; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 15.5px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

/* ---------- surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; }
.card.flat { background: transparent; }
.tap { transition: border-color 0.15s, background 0.15s; text-align: start; width: 100%; }
.tap:hover { border-color: #39424a; }
.tap:active { background: var(--surface-2); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--surface-2); font-weight: 500;
}
.btn.primary { background: var(--green); color: #06120b; border-color: var(--green); font-weight: 700; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 38px; padding: 0 12px; font-size: 14px; white-space: nowrap; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 140px; }
.back {
  display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--muted);
  padding: 6px 0; min-height: 40px; font-size: 14px;
}
.back svg { width: 18px; height: 18px; }

/* ---------- progress bars ---------- */
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--green); border-radius: 99px; transition: width 0.5s ease-out; }
.blocks { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; direction: ltr; }
.blocks > i { height: 14px; border-radius: 2px; background: var(--surface-2); }
.blocks > i.on { background: var(--green); }

/* ---------- terminal ---------- */
.term {
  background: var(--term); border: 1px solid var(--line); border-radius: var(--r-md);
  overflow: hidden; font-family: var(--font-mono);
}
.term-bar {
  display: flex; align-items: center; gap: 8px; direction: ltr;
  padding: 0 12px; height: 36px; background: var(--surface); border-bottom: 1px solid var(--line);
  font-size: 12px; color: var(--muted);
}
.term-tab {
  display: flex; align-items: center; gap: 8px; height: 100%;
  padding: 0 12px; background: var(--term); border-inline: 1px solid var(--line); color: var(--fg);
}
.term-tab .ti { color: var(--green); font-weight: 700; }
.term-bar .spacer { flex: 1; }
.term-body {
  direction: ltr; text-align: left; padding: 12px 14px; font-size: 13px; line-height: 1.6;
  white-space: pre-wrap; word-break: break-word; overflow-x: auto;
}
.term-line { min-height: 1.6em; }
.term-line.err { color: #ff9a9a; }
.term-line .pr { color: var(--fg); }
.term-line .cm { color: var(--green); }
.term-note {
  direction: rtl; text-align: right; font-family: var(--font-fa); font-size: 13.5px; line-height: 1.8;
  margin: 6px 0 10px; padding: 8px 12px; border-radius: var(--r-sm);
  background: var(--blue-soft); color: #cfe5ff; white-space: normal;
}
.term-note.warn { background: var(--danger-soft); color: #ffd0d0; }
.term-note b { font-weight: 700; color: var(--blue); margin-inline-end: 6px; }
.term-note.warn b { color: var(--danger); }
.term-input-row { display: flex; align-items: baseline; gap: 0; }
.term-input-row .pr { white-space: pre; }
.term-input {
  flex: 1; min-width: 40px; border: 0; outline: none; background: transparent; color: var(--green);
  font-family: var(--font-mono); font-size: 16px; padding: 0 0 0 1ch; caret-color: var(--green); direction: ltr;
}
.cursor { display: inline-block; width: 0.6em; height: 1.1em; vertical-align: text-bottom; background: var(--green); animation: blink 1.4s steps(1) infinite; margin-left: 2px; }
@keyframes blink { 50% { opacity: 0; } }
.keys { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); background: var(--surface); overflow-x: auto; direction: ltr; }
.key {
  flex: 0 0 auto; min-width: 42px; height: 38px; padding: 0 10px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--surface-2); font-family: var(--font-mono); font-size: 15px;
}
.key.run { background: var(--green-soft); color: var(--green); border-color: transparent; margin-left: auto; font-family: var(--font-fa); font-size: 14px; }

/* simulator page fills the screen */
.sim-wrap { display: flex; flex-direction: column; gap: 12px; }
.sim-wrap .term { display: flex; flex-direction: column; height: calc(100dvh - var(--nav-h) - 170px - env(safe-area-inset-bottom, 0px) - env(safe-area-inset-top, 0px)); min-height: 340px; }
.sim-wrap .term-body { flex: 1; overflow-y: auto; }
@media (min-width: 960px) {
  .sim-wrap .term { height: calc(100vh - 170px); }
  .sim-wrap .term-body { font-size: 14px; }
}

/* ---------- home ---------- */
.brand-title { font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.2em; color: var(--green); font-size: 15px; direction: ltr; text-align: right; }
.hero-line { font-size: 22px; font-weight: 700; line-height: 1.5; }
.mini-term { cursor: pointer; }
.mini-term .term-body { padding: 14px 16px 16px; }
.cards3 { display: grid; grid-template-columns: 1fr; gap: 10px; }
.feature { display: flex; align-items: center; gap: 14px; }
.feature .ico {
  flex: 0 0 auto; width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center;
  background: var(--surface-2); color: var(--green);
}
.feature .ico svg { width: 22px; height: 22px; }
.feature .t { font-family: var(--font-mono); font-weight: 600; font-size: 15px; direction: ltr; unicode-bidi: isolate; text-align: right; }
.chev { color: var(--muted); width: 18px; height: 18px; flex: 0 0 auto; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (min-width: 640px) { .cards3 { grid-template-columns: repeat(3, 1fr); } .cards3 .feature { flex-direction: column; align-items: flex-start; } .cards3 .chev { display: none; } }
.big-num { font-family: var(--font-mono); font-size: 28px; font-weight: 700; direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }

/* ---------- learn ---------- */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.seg button { min-height: 40px; border: 0; border-radius: 7px; background: none; color: var(--muted); font-family: var(--font-mono); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); }
.level-head .code { font-family: var(--font-mono); font-size: 22px; font-weight: 700; letter-spacing: 0.08em; direction: ltr; unicode-bidi: isolate; }
.chapter { padding: 0; overflow: hidden; }
.chapter-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
.lesson-row {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; min-height: 60px;
  border: 0; border-bottom: 1px solid var(--line); background: none; text-align: start;
}
.lesson-row:last-child { border-bottom: 0; }
.lesson-row:hover:not(:disabled) { background: var(--surface-2); }
.lesson-row:disabled { cursor: default; }
.lesson-row:disabled .lt { color: var(--muted); }
.st { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; border: 1.5px solid var(--line); color: var(--muted); }
.st.done { background: var(--green); border-color: var(--green); color: #06120b; font-weight: 700; }
.st.current { border-color: var(--blue); color: var(--blue); }
.st.current::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--blue); }
.st.soon { border-style: dashed; }
.ln { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); letter-spacing: 0.06em; direction: ltr; unicode-bidi: isolate; }
.lt { font-weight: 500; line-height: 1.5; }
.chip { font-family: var(--font-mono); font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
.chip.danger { color: var(--danger); border-color: rgba(255, 111, 111, 0.35); }
.tag { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); padding: 1px 8px; border-radius: 99px; white-space: nowrap; }

/* ---------- lesson ---------- */
.term-hero { font-family: var(--font-mono); font-size: 34px; font-weight: 700; color: var(--green); direction: ltr; unicode-bidi: isolate; text-align: right; line-height: 1.25; word-break: break-word; }
.term-hero.long { font-size: 24px; }
.full-form { font-family: var(--font-mono); font-size: 14px; color: var(--muted); direction: ltr; unicode-bidi: isolate; text-align: right; }
.lead { font-size: 16.5px; line-height: 1.9; max-width: 62ch; }
.facts { display: flex; flex-direction: column; }
.fact { display: grid; grid-template-columns: 78px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.fact:last-child { border-bottom: 0; }
.fact .k { font-size: 13px; color: var(--muted); font-weight: 500; padding-top: 2px; }
.fact .v { min-width: 0; }
.syntax { font-family: var(--font-mono); font-size: 14px; color: var(--green); direction: ltr; text-align: left; background: var(--term); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
.callout { border-radius: var(--r-sm); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
.callout svg { flex: 0 0 auto; width: 18px; height: 18px; margin-top: 4px; }
.callout.tip { background: var(--green-soft); }
.callout.tip svg { color: var(--green); }
.callout.warn { background: var(--warn-soft); }
.callout.warn svg { color: var(--warn); }
.callout.danger { background: var(--danger-soft); }
.callout.danger svg { color: var(--danger); }
details.analogy { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
details.analogy summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; font-weight: 500; min-height: 48px; }
details.analogy summary::-webkit-details-marker { display: none; }
details.analogy summary svg { width: 16px; height: 16px; color: var(--muted); transition: transform 0.15s; }
details.analogy[open] summary svg { transform: rotate(180deg); }
details.analogy > div { padding: 0 14px 14px; color: #cfd5d9; }
.req { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); }
.req .dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 11px; }
.req.ok { color: var(--fg); }
.req.ok .dot { background: var(--green); border-color: var(--green); color: #06120b; }

/* ---------- practice ---------- */
.task { font-size: 16.5px; line-height: 1.9; }
.feedback { border-radius: var(--r-sm); padding: 12px 14px; }
.feedback.ok { background: var(--green-soft); }
.feedback.ok .fh { color: var(--green); }
.feedback.no { background: var(--danger-soft); }
.feedback.no .fh { color: var(--danger); }
.feedback.mid { background: var(--blue-soft); }
.feedback.mid .fh { color: var(--blue); }
.fh { font-weight: 700; }
.shake { animation: shake 0.28s ease-in-out; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.pop { animation: pop 0.22s ease-out; }
@keyframes pop { from { transform: scale(0.97); } to { transform: none; } }
.answer-code { font-family: var(--font-mono); direction: ltr; text-align: left; background: var(--term); border-radius: 6px; padding: 8px 12px; color: var(--green); white-space: pre-wrap; }
.task-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; width: 100%; text-align: start; min-height: 56px; }
.task-row:last-child { border-bottom: 0; }
.task-row:hover { background: var(--surface-2); }

/* ---------- quiz ---------- */
.q-kind { font-size: 12px; color: var(--blue); background: var(--blue-soft); padding: 2px 10px; border-radius: 99px; }
.q-text { font-size: 17px; font-weight: 500; line-height: 1.85; }
.q-code { font-family: var(--font-mono); direction: ltr; text-align: left; background: var(--term); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 14px; white-space: pre; overflow-x: auto; font-size: 14px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 10px 14px;
  border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface-2); text-align: start;
}
.opt .mark { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); flex: 0 0 auto; display: grid; place-items: center; font-size: 12px; }
.opt.code { font-family: var(--font-mono); }
.opt.code .otxt { direction: ltr; unicode-bidi: isolate; }
.opt.right { border-color: var(--green); background: var(--green-soft); }
.opt.right .mark { background: var(--green); border-color: var(--green); color: #06120b; }
.opt.wrong { border-color: var(--danger); background: var(--danger-soft); }
.opt.wrong .mark { background: var(--danger); border-color: var(--danger); color: #1a0606; }
.opt:disabled { cursor: default; }
.text-in {
  width: 100%; min-height: 50px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--line);
  background: var(--term); color: var(--green); font-family: var(--font-mono); font-size: 16px; direction: ltr; text-align: left;
}
.score-big { font-family: var(--font-mono); font-size: 48px; font-weight: 700; direction: ltr; unicode-bidi: isolate; color: var(--green); }

/* ---------- progress ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat .n { font-family: var(--font-mono); font-size: 22px; font-weight: 700; direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
.stat .l { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; direction: ltr; unicode-bidi: isolate; line-height: 1.4; }
@media (max-width: 420px) { .stat .n { font-size: 18px; } }
.lvl-line { display: flex; flex-direction: column; gap: 6px; }
.pct { font-family: var(--font-mono); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ============================================================
   engine/vfs.js — Virtual File System
   Everything lives in memory. Nothing touches the real device.
   Future: becomes src/engine/vfs.ts in the Vite project.
   ============================================================ */
const VFS = (() => {
  const INVALID_NAME = /[<>:"\/\\|?*]/;

  function D(name, t, children = []) {
    const map = {};
    children.forEach((c) => { map[c.name.toLowerCase()] = c; });
    return { type: "dir", name, t, children: map };
  }
  function F(name, t, content, size) {
    const n = { type: "file", name, t };
    if (typeof content === "string") { n.content = content; n.size = content.length; }
    else { n.binary = true; n.size = size || 0; }
    return n;
  }

  /* The default sandbox disk layout (C:, D:, E: = USB). */
  function createDefault() {

      D("Users", t1, [
        D("Public", t1),
        D("Student", t2, [
          D("Desktop", t2, [F("notes.txt", t3, "Remember: practice CMD every day!\n")]),
          D("Documents", t2, [
            D("Work", t2, [F("report.txt", t3, "Monthly report\nSales: 1,240\nStatus: OK\n")]),
            F("todo.txt", t3, "1. Learn dir\n2. Learn cd\n3. Create a folder with mkdir\n"),

            F("cat.jpg", t3, null, 248311),
          ]),
        ]),
      ]),
      D("Windows", t1, [
        D("System32", t1, [F("cmd.exe", t1, null, 289792), F("notepad.exe", t1, null, 201216)]),
        F("win.ini", t1, "; for 16-bit app support\n[fonts]\n[extensions]\n"),
      ]),
    ]);
    const Dd = D("", t1, [
      D("Projects", t2, [D("website", t2, [F("index.html", t2, "<h1>Hello CMD Academy</h1>\n")])]),
      D("Backup", t2, [F("readme.txt", t2, "Backups are stored here.\n")]),
    ]);
    const E = D("", t3, [D("Photos", t3), F("info.txt", t3, "USB stick for CMD Academy practice.\n")]);
    return {
      drives: {
        C: { label: "", serial: "1A2B-3C4D", free: "48,213,442,560", root: C },
        D: { label: "Data", serial: "7E10-22F5", free: "312,904,118,272", root: Dd },
        E: { label: "USB", serial: "0C3A-91B8", free: "15,021,309,952", root: E },
      },
    };
  }

  function clone(fs) { return JSON.parse(JSON.stringify(fs)); }

  /* Parse a user path into an absolute {drive, parts} using per-drive cwd.
     cwdMap: { C: ["Users","Student"], D: [], ... }, curDrive: "C" */
  function parse(input, curDrive, cwdMap) {
    let s = String(input).replace(/"/g, "").replace(/\//g, "\\").trim();
    let drive = curDrive, absolute = false, kind = "relative";
    const m = s.match(/^([a-zA-Z]):(.*)$/);
    if (m) { drive = m[1].toUpperCase(); s = m[2]; kind = "absolute"; }
    if (s.startsWith("\\")) { absolute = true; kind = "absolute"; }
    const base = absolute ? [] : (cwdMap[drive] || []).slice();
    s.split("\\").forEach((seg) => {
      const p = seg.trim();
      if (!p || p === ".") return;
      if (p === "..") { base.pop(); return; }
      base.push(p);
    });
    return { drive, parts: base, kind };
  }

  function getDrive(fs, letter) { return fs.drives[letter] || null; }

  /* Walk to a node. Returns {node, canonical:[names]} or {node:null, missingAt} */
  function resolve(fs, drive, parts) {
    const d = getDrive(fs, drive);
    if (!d) return { node: null, noDrive: true };
    let node = d.root;
    const canonical = [];
    for (let i = 0; i < parts.length; i++) {
      if (node.type !== "dir") return { node: null, missingAt: i, throughFile: true };
      const next = node.children[parts[i].toLowerCase()];
      if (!next) return { node: null, missingAt: i, parent: i === parts.length - 1 ? node : null, canonical };
      canonical.push(next.name);
      node = next;
    }
    return { node, canonical };
  }

  function fmt(drive, parts) { return drive + ":\\" + parts.join("\\"); }

  function wildcardToRegex(p) {
    const esc = p.replace(/[.+^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".*").replace(/\?/g, ".");

  }

  function mkdirp(fs, drive, parts, t) {
    const d = getDrive(fs, drive);
    let node = d.root;
    for (const p of parts) {
      let next = node.children[p.toLowerCase()];
      if (!next) { next = { type: "dir", name: p, t, children: {} }; node.children[p.toLowerCase()] = next; }
      if (next.type !== "dir") return false;
      node = next;
    }
    return true;
  }

  function sortedChildren(dir) {
    return Object.values(dir.children).sort((a, b) => a.name.localeCompare(b.name, "en", { sensitivity: "base" }));
  }

  return { createDefault, clone, parse, resolve, fmt, getDrive, wildcardToRegex, mkdirp, sortedChildren, INVALID_NAME };
})();

/* ============================================================
   engine/shell.js — Educational CMD interpreter (sandbox only)
   Parses a command line and runs it against the VFS.
   No real system command is ever executed.

const Shell = (() => {
  let MSG = {};               // Persian teaching messages (from content)
  let LESSON_OF = {};         // command -> lesson number (from curriculum)
  const DANGEROUS = ["del", "erase", "rmdir", "rd", "format", "diskpart", "bootrec", "taskkill", "robocopy", "chkdsk"];

  function setMessages(m) { MSG = m || {}; }
  function setLessonIndex(idx) { LESSON_OF = idx || {}; }
  function msg(key, vars = {}) {
    let s = MSG[key] || key;
    Object.keys(vars).forEach((k) => { s = s.split("{" + k + "}").join(vars[k]); });
    return s;
  }

  function create(opts = {}) {
    const sh = {
      fs: opts.fs ? VFS.clone(opts.fs) : VFS.createDefault(),
      drive: "C",
      cwd: { C: ["Users", "Student"], D: [], E: [] },
      env: { USERNAME: "Student", COMPUTERNAME: "ACADEMY-PC", USERPROFILE: "C:\\Users\\Student", OS: "Windows_NT" },
      log: [],

  function setLocation(sh, path) {
    const p = VFS.parse(path, sh.drive, sh.cwd);
    const r = VFS.resolve(sh.fs, p.drive, p.parts);
    if (r.node && r.node.type === "dir") { sh.drive = p.drive; sh.cwd[p.drive] = r.canonical; }
  }

  function cwdPath(sh) { return VFS.fmt(sh.drive, sh.cwd[sh.drive]); }
  function prompt(sh) { return cwdPath(sh) + ">"; }

  /* ---------- tokenizing ---------- */
  function tokenize(str) {
    const out = [];
    let cur = "", inQ = false, quoted = false;
    const push = () => { if (cur.length || quoted) out.push({ v: cur, q: quoted }); cur = ""; quoted = false; };
    for (let i = 0; i < str.length; i++) {
      const c = str[i];
      if (c === '"') { inQ = !inQ; quoted = true; continue; }
      if (!inQ && (c === " " || c === "\t")) { push(); continue; }
      if (!inQ && c === "/" && cur.length) { push(); }
      cur += c;
    }
    push();
    return out;
  }
  function hasOperator(str) {
    let inQ = false;
    for (const c of str) {
      if (c === '"') inQ = !inQ;
      else if (!inQ && "<>|&".includes(c)) return true;
    }
    return false;
  }
  function expandEnv(sh, str) {
    return str.replace(/%([A-Za-z_][A-Za-z0-9_]*)%/g, (m, name) => {
      const k = Object.keys(sh.env).find((x) => x.toLowerCase() === name.toLowerCase());
      return k ? sh.env[k] : m;
    });
  }

  function levenshtein(a, b) {
    const dp = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) dp[0][j] = j;
    for (let i = 1; i <= a.length; i++)
      for (let j = 1; j <= b.length; j++)
        dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return dp[a.length][b.length];
  }

  /* ---------- output helpers ---------- */
  const out = (lines, text) => lines.push({ t: "out", text });
  const err = (lines, text) => lines.push({ t: "err", text });
  const note = (lines, text) => lines.push({ t: "note", text });
  const warn = (lines, text) => lines.push({ t: "warn", text });

  function fmtTime(iso) {
    const d = new Date(iso);
    const p2 = (n) => String(n).padStart(2, "0");
    let h = d.getHours(); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
    return `${p2(d.getMonth() + 1)}/${p2(d.getDate())}/${d.getFullYear()}  ${p2(h)}:${p2(d.getMinutes())} ${ap}`;
  }

  const COMMANDS = {};

    aliases.forEach((a) => { COMMANDS[a] = c; });
  }

    c.usage.split("\n").forEach((l) => out(lines, l));
    note(lines, msg("usage_note"));
  }

  def("dir", [], "Displays a list of files and subdirectories in a directory.",
    "Displays a list of files and subdirectories in a directory.\n\nDIR [drive:][path][filename] [/B] [/W]\n\n  [drive:][path][filename]\n              Specifies drive, directory, and/or files to list.\n  /B          Uses bare format (no heading information or summary).\n  /W          Uses wide list format.",
    (sh, rest, lines, rec) => {
      const toks = tokenize(rest);
      const sw = toks.filter((t) => !t.q && t.v.startsWith("/")).map((t) => t.v.toLowerCase());
      const args = toks.filter((t) => t.q || !t.v.startsWith("/")).map((t) => t.v);
      rec.switches = sw; rec.args = args;
      if (sw.includes("/?")) { showUsage(lines, COMMANDS.dir); return true; }
      const bad = sw.find((s) => !["/w", "/b"].includes(s));
      if (bad) { err(lines, `Invalid switch - "${bad.slice(1)}".`); note(lines, msg("invalid_switch", { cmd: "dir" })); return false; }
      const target = args.join(" ") || ".";
      let p = VFS.parse(target, sh.drive, sh.cwd);
      let pattern = null;
      const last = p.parts[p.parts.length - 1];
      if (last && /[*?]/.test(last)) { pattern = VFS.wildcardToRegex(last); p = { ...p, parts: p.parts.slice(0, -1) }; }
      if (!VFS.getDrive(sh.fs, p.drive)) { err(lines, "The system cannot find the path specified."); note(lines, msg("drive_not_found", { drive: p.drive })); return false; }
      const r = VFS.resolve(sh.fs, p.drive, p.parts);
      let dirNode, dirParts, entries;
      if (!r.node) {
        if (r.parent) { err(lines, "File Not Found"); note(lines, msg("file_not_found")); }
        else { err(lines, "The system cannot find the path specified."); note(lines, msg("path_not_found")); }
        return false;
      }
      if (r.node.type === "file") {
        dirParts = r.canonical.slice(0, -1);
        dirNode = VFS.resolve(sh.fs, p.drive, dirParts).node;
        entries = [r.node];
      } else {
        dirNode = r.node; dirParts = r.canonical;
        entries = VFS.sortedChildren(dirNode);
        if (pattern) entries = entries.filter((e) => pattern.test(e.name));
      }
      rec.target = VFS.fmt(p.drive, dirParts);
      if (pattern && !entries.length) { err(lines, "File Not Found"); note(lines, msg("file_not_found")); return false; }
      const drv = VFS.getDrive(sh.fs, p.drive);
      const isRoot = dirParts.length === 0;
      const showDots = !isRoot && !pattern && r.node.type === "dir";
      const files = entries.filter((e) => e.type === "file");
      const dirs = entries.filter((e) => e.type === "dir");
      if (sw.includes("/b")) { entries.forEach((e) => out(lines, e.name)); return true; }
      out(lines, drv.label ? ` Volume in drive ${p.drive} is ${drv.label}` : ` Volume in drive ${p.drive} has no label.`);
      out(lines, ` Volume Serial Number is ${drv.serial}`);
      out(lines, "");
      out(lines, ` Directory of ${VFS.fmt(p.drive, dirParts)}`);
      out(lines, "");
      const dirCount = dirs.length + (showDots ? 2 : 0);
      if (sw.includes("/w")) {
        const names = (showDots ? ["[.]", "[..]"] : []).concat(entries.map((e) => (e.type === "dir" ? `[${e.name}]` : e.name)));
        const w = Math.max(15, ...names.map((n) => n.length + 2));
        const cols = Math.max(1, Math.floor(64 / w));
        for (let i = 0; i < names.length; i += cols) out(lines, names.slice(i, i + cols).map((n) => n.padEnd(w)).join("").trimEnd());
      } else {
        const t = fmtTime(dirNode.t);
        if (showDots) { out(lines, `${t}    <DIR>          .`); out(lines, `${t}    <DIR>          ..`); }
        entries.forEach((e) => {
          if (e.type === "dir") out(lines, `${fmtTime(e.t)}    <DIR>          ${e.name}`);
          else out(lines, `${fmtTime(e.t)}${num(e.size).padStart(18)} ${e.name}`);
        });
      }
      const bytes = files.reduce((s, f) => s + f.size, 0);
      out(lines, `${String(files.length).padStart(16)} File(s) ${num(bytes).padStart(14)} bytes`);
      out(lines, `${String(dirCount).padStart(16)} Dir(s) ${drv.free.padStart(15)} bytes free`);
      return true;
    });

  def("cd", ["chdir"], "Displays the name of or changes the current directory.",
    "Displays the name of or changes the current directory.\n\nCHDIR [/D] [drive:][path]\nCHDIR [..]\nCD [/D] [drive:][path]\nCD [..]\n\n  ..   Specifies that you want to change to the parent directory.\n\nType CD drive: to display the current directory in the specified drive.\nType CD without parameters to display the current drive and directory.\n\nUse the /D switch to change current drive in addition to changing current\ndirectory for a drive.",
    (sh, rest, lines, rec) => {
      let s = rest.trim();
      rec.switches = [];
      if (s === "/?") { rec.switches = ["/?"]; showUsage(lines, COMMANDS.cd); return true; }
      let changeDrive = false;
      const md = s.match(/^\/d(\s+|$)/i);
      if (md) { changeDrive = true; rec.switches = ["/d"]; s = s.slice(md[0].length).trim(); }
      s = s.replace(/"/g, "").trim();
      rec.args = s ? [s] : [];
      if (!s) { out(lines, cwdPath(sh)); rec.printed = true; return true; }
      const onlyDrive = s.match(/^([a-zA-Z]):$/);
      if (onlyDrive && !changeDrive) {
        const L = onlyDrive[1].toUpperCase();
        if (!VFS.getDrive(sh.fs, L)) { err(lines, "The system cannot find the drive specified."); note(lines, msg("drive_not_found", { drive: L })); return false; }
        out(lines, VFS.fmt(L, sh.cwd[L])); return true;
      }
      const p = VFS.parse(s, sh.drive, sh.cwd);

      const r = VFS.resolve(sh.fs, p.drive, p.parts);
      if (!r.node) { err(lines, "The system cannot find the path specified."); note(lines, msg("path_not_found")); return false; }
      if (r.node.type !== "dir") { err(lines, "The directory name is invalid."); note(lines, msg("dir_name_invalid", { name: r.node.name })); return false; }
      sh.cwd[p.drive] = r.canonical;
      rec.target = VFS.fmt(p.drive, r.canonical);
      if (p.drive !== sh.drive) {
        if (changeDrive) sh.drive = p.drive;
        else note(lines, msg("cd_other_drive", { drive: p.drive, cur: sh.drive }));

    });

  def("mkdir", ["md"], "Creates a directory.",
    "Creates a directory.\n\nMKDIR [drive:]path\nMD [drive:]path",
    (sh, rest, lines, rec) => {
      const toks = tokenize(rest);
      rec.args = toks.map((t) => t.v); rec.switches = [];
      if (toks.length === 1 && toks[0].v === "/?") { showUsage(lines, COMMANDS.mkdir); return true; }
      if (!toks.length) { err(lines, "The syntax of the command is incorrect."); note(lines, msg("syntax", { cmd: "mkdir" })); return false; }
      let ok = true;
      toks.forEach((tk) => {

        const r = VFS.resolve(sh.fs, p.drive, p.parts);
        if (r.node) { err(lines, `A subdirectory or file ${tk.v} already exists.`); note(lines, msg("already_exists")); ok = false; return; }

  def("type", [], "Displays the contents of a text file.",
    "Displays the contents of a text file or files.\n\nTYPE [drive:][path]filename",
    (sh, rest, lines, rec) => {

      if (toks.length === 1 && toks[0].v === "/?") { showUsage(lines, COMMANDS.type); return true; }
      if (!toks.length) { err(lines, "The syntax of the command is incorrect."); note(lines, msg("syntax", { cmd: "type" })); return false; }

        if (r.node.binary) { out(lines, "ÿØÿà JFIF  ☺☺ ` `  ÿÛ C ☻☺☺☻☺..."); note(lines, msg("type_binary", { ext: r.node.name.split(".").pop() })); return; }
        r.node.content.replace(/\n$/, "").split("\n").forEach((l) => out(lines, l));

  def("echo", [], "Displays messages, or turns command-echoing on or off.",
    "Displays messages, or turns command-echoing on or off.\n\n  ECHO [ON | OFF]\n  ECHO [message]",
    (sh, rest, lines, rec) => {
      rec.switches = [];
      if (rest.trim() === "/?") { showUsage(lines, COMMANDS.echo); return true; }
      if (/^[.(]/.test(rest)) { out(lines, rest.slice(1)); rec.args = rest.slice(1) ? [rest.slice(1)] : []; return true; }
      const text = rest.replace(/^\s/, "");
      rec.args = text.trim() ? [text] : [];
      if (!text.trim()) { out(lines, "ECHO is on."); return true; }
      if (/^(on|off)$/i.test(text.trim())) { note(lines, msg("echo_onoff")); return true; }

    (sh, rest, lines) => {

    "Provides help information for Windows commands.\n\nHELP [command]\n\n    command - displays help information on that command.",
    (sh, rest, lines, rec) => {
      const a = rest.trim().toLowerCase();
      rec.args = a ? [a] : [];
      if (a === "/?") { showUsage(lines, COMMANDS.help); return true; }
      if (a) {
        if (COMMANDS[a]) { showUsage(lines, COMMANDS[a]); return true; }

      }
      out(lines, "For more information on a specific command, type HELP command-name");
      const seen = new Set();
      Object.values(COMMANDS).forEach((c) => {

    });

  def("whoami", [], "Displays the current user name.", "WHOAMI\n\nDisplays user, group and privileges information for the user who is currently logged on.",
    (sh, rest, lines) => { out(lines, "academy-pc\\student"); return true; });
  COMMANDS.whoami.hidden = true;

  def("hostname", [], "Prints the name of the current host.", "Prints the name of the current host.\n\nhostname",
    (sh, rest, lines) => { out(lines, sh.env.COMPUTERNAME); return true; });
  COMMANDS.hostname.hidden = true;

  def("exit", [], "Quits the CMD.EXE program.", "Quits the CMD.EXE program (command interpreter).\n\nEXIT",
    (sh, rest, lines) => { note(lines, msg("exit")); return true; });
  COMMANDS.exit.hidden = true;

  /* ---------- main entry ---------- */
  function run(sh, rawLine) {
    const lines = [];
    const line = rawLine.replace(/\u200c/g, "").trim();
    const rec = { raw: line, name: null, args: [], switches: [], ok: false };
    const done = (ok) => { rec.ok = ok; sh.log.push(rec); return { lines, clear: !!rec.clear, rec }; };
    if (!line) return { lines, clear: false, rec: null };

    if (/^[a-zA-Z]:\\[^>]*>/.test(line)) { note(lines, msg("typed_prompt")); return done(false); }

    // Drive switch: "D:"
    const dm = line.match(/^([a-zA-Z]):\s*$/);
    if (dm) {
      const L = dm[1].toUpperCase();
      rec.name = "drive";
      rec.args = [L + ":"];
      if (!VFS.getDrive(sh.fs, L)) { err(lines, "The system cannot find the drive specified."); note(lines, msg("drive_not_found", { drive: L })); return done(false); }
      sh.drive = L; rec.target = cwdPath(sh); return done(true);
    }
    if (/^[a-zA-Z]$/.test(line) && VFS.getDrive(sh.fs, line.toUpperCase())) {
      err(lines, `'${line}' is not recognized as an internal or external command,`);
      err(lines, "operable program or batch file.");
      note(lines, msg("missing_colon", { drive: line.toUpperCase() }));
      return done(false);
    }

    const expanded = expandEnv(sh, line);
    const m = expanded.match(/^([^\s\\\/."]+)(.*)$/s);
    const firstWord = expanded.split(/\s+/)[0];
    const name = (m ? m[1] : firstWord).toLowerCase();
    let rest = m ? m[2] : "";
    rec.name = name;

    if (/[\u0600-\u06FF]/.test(firstWord)) {
      err(lines, `'${firstWord}' is not recognized as an internal or external command,`);
      err(lines, "operable program or batch file.");
      note(lines, msg("persian_kb"));
      return done(false);
    }

    if (hasOperator(rest)) { note(lines, msg("operators")); return done(false); }

    const c = COMMANDS[name];
    if (c) {
      rec.name = c.name;
      // "dir/w", "cd.." and "cd\" style glued arguments are legal in CMD
      if (rest && !/^\s/.test(rest) && name !== "echo") rest = " " + rest;
      try { return done(!!c.run(sh, rest, lines, rec)); }
      catch (e) { err(lines, "Simulator error: " + e.message); return done(false); }
    }

    if (name === "format" || name === "diskpart" || DANGEROUS.includes(name)) {
      warn(lines, name === "format" ? msg("format_warn") : msg("danger", { cmd: name }));
      if (LESSON_OF[name]) note(lines, msg("later_lesson", { cmd: name, n: LESSON_OF[name] }));
      return done(false);
    }
    if (LESSON_OF[name]) { note(lines, msg("later_lesson", { cmd: name, n: LESSON_OF[name] })); return done(false); }

    err(lines, `'${firstWord}' is not recognized as an internal or external command,`);
    err(lines, "operable program or batch file.");
    const known = Object.keys(COMMANDS).concat(Object.keys(LESSON_OF));
    let best = null, bestD = 3;
    known.forEach((k) => { const d = levenshtein(name, k); if (d < bestD) { bestD = d; best = k; } });
    const here = VFS.resolve(sh.fs, sh.drive, sh.cwd[sh.drive]).node;
    const folder = here && here.children[line.replace(/"/g, "").toLowerCase()];
    if (folder && folder.type === "dir") note(lines, msg("folder_not_command", { name: folder.name }));
    else note(lines, msg("not_recognized") + (best && bestD <= 2 ? " " + msg("suggest", { cmd: best }) : ""));
    return done(false);
  }

  function banner() {
    return [
      { t: "out", text: "Microsoft Windows [Version 10.0.22631.4317]" },
      { t: "out", text: "(c) Microsoft Corporation. All rights reserved." },
      { t: "out", text: "" },
    ];
  }

  return { create, run, prompt, cwdPath, setLocation, setMessages, setLessonIndex, banner, COMMANDS };
})();

/* ============================================================
   engine/checker.js — checks a practice task against the
   sandbox state, not against exact text. So "md X" and
   "mkdir X" are both accepted when the folder X exists.
   ============================================================ */
const Checker = (() => {
  const norm = (s) => String(s || "").toLowerCase().replace(/\\+$/, "");

  function last(attempt) { return attempt.length ? attempt[attempt.length - 1] : null; }

  const RULES = {
    cmd: (c, sh, a) => { const l = last(a); return !!l && l.name === c.value; },
    ok: (c, sh, a) => { const l = last(a); return !!l && l.ok; },
    switch: (c, sh, a) => { const l = last(a); return !!l && (l.switches || []).includes(c.value.toLowerCase()); },
    argIncludes: (c, sh, a) => { const l = last(a); return !!l && (l.args || []).join(" ").toLowerCase().includes(c.value.toLowerCase()); },
    noArgs: (c, sh, a) => { const l = last(a); return !!l && !(l.args || []).length; },
    cwd: (c, sh) => norm(Shell.cwdPath(sh)) === norm(c.value),
    drive: (c, sh) => sh.drive === c.value.toUpperCase(),
    dirExists: (c, sh) => {
      const p = VFS.parse(c.path, sh.drive, sh.cwd);
      const r = VFS.resolve(sh.fs, p.drive, p.parts);
      return !!r.node && r.node.type === "dir";
    },
    usedCd: (c, sh, a) => a.some((r) => r.name === "cd" && r.ok && r.pathKind === c.value),
  };

  /* Returns true when every check passes. */
  function evaluate(checks, sh, attempt) {
    return checks.every((c) => {
      const f = RULES[c.type];
      return f ? f(c, sh, attempt) : false;
    });
  }

  /* Normalize a typed answer for quiz "write the command" questions. */
  function sameCommand(input, accepted) {
    const n = (s) => String(s).trim().replace(/\s+/g, " ").toLowerCase();
    return accepted.some((a) => n(a) === n(input));
  }

  return { evaluate, sameCommand };
})();

/* ============================================================
   data/content.js — read-only access to course content.
   The UI never hard-codes lessons; it asks Content.
   ============================================================ */
const Content = (() => {
  let D = null;
  const byNum = {};
  let order = [];

  function init(json) {
    D = json;
    const full = {};
    D.lessons.forEach((l) => { full[l.n] = l; });
    D.curriculum.levels.forEach((lv) => {
      lv.chapters.forEach((ch) => {
        ch.lessons.forEach((o) => {
          byNum[o.n] = { ...o, level: lv.id, chapter: ch.id, chapterTitle: ch.title, full: full[o.n] || null };
          order.push(o.n);
        });
      });
    });
  }

  const levels = () => D.curriculum.levels;
  const lesson = (n) => byNum[n] || null;
  const all = () => order.map((n) => byNum[n]);
  const available = () => all().filter((l) => l.full);
  const total = () => order.length;
  const levelLessons = (id) => all().filter((l) => l.level === id);
  const chapterLessons = (id) => all().filter((l) => l.chapter === id);
  const chapter = (id) => {
    for (const lv of D.curriculum.levels) for (const ch of lv.chapters) if (ch.id === id) return { ...ch, level: lv.id };
    return null;
  };
  const tasks = () => available().flatMap((l) => l.full.practice.map((p) => ({ ...p, lesson: l.n })));
  const task = (id) => tasks().find((t) => t.id === id) || null;
  const nextLesson = (n) => { const i = order.indexOf(n); return i >= 0 && i < order.length - 1 ? byNum[order[i + 1]] : null; };

  /* Quizzes: "L3" = lesson 3 mini quiz, "C1" = chapter 1 quiz */
  function quiz(id) {
    if (id[0] === "L") {
      const l = lesson(+id.slice(1));
      return l && l.full ? { id, title: l.t, lesson: l.n, questions: l.full.quiz } : null;
    }
    if (id[0] === "C") {
      const ch = chapter(+id.slice(1));
      if (!ch) return null;
      const qs = chapterLessons(ch.id).filter((l) => l.full).flatMap((l) => l.full.quiz);
      return qs.length ? { id, title: ch.title, chapter: ch.id, questions: qs } : null;
    }
    return null;
  }
  const chapterQuizzes = () => {
    const out = [];
    D.curriculum.levels.forEach((lv) => lv.chapters.forEach((ch) => { const q = quiz("C" + ch.id); if (q) out.push(q); }));
    return out;
  };

  /* command -> lesson number, so the Simulator can say "taught in lesson N" */
  function shellIndex() {
    const idx = {};
    all().forEach((l) => {
      if (l.c) idx[l.c] = l.n;
      (l.aliases || []).forEach((a) => { idx[a] = l.n; });
    });
    return idx;
  }

  function t(key, vars = {}) {
    let s = D.ui[key] != null ? String(D.ui[key]) : key;
    Object.keys(vars).forEach((k) => { s = s.split("{" + k + "}").join(vars[k]); });
    return s;
  }

  return { init, levels, lesson, all, available, total, levelLessons, chapterLessons, chapter, tasks, task, nextLesson, quiz, chapterQuizzes, shellIndex, t, shellMessages: () => D.shell };
})();

/* ============================================================
   store/progress.js — progress saved on this device only.
   One small interface so Cloud Sync can replace it later.
   ============================================================ */
const Store = (() => {
  const KEY = "cmdacademy.progress.v1";
  const empty = () => ({ v: 1, practice: {}, quiz: {}, seen: {} });
  let s = empty();
  let persistent = true;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) s = Object.assign(empty(), JSON.parse(raw));
    } catch (e) { persistent = false; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(s)); persistent = true; } catch (e) { persistent = false; }
  }

  const markPractice = (id) => { s.practice[id] = true; save(); };
  const practiceDone = (id) => !!s.practice[id];
  const markSeen = (n) => { if (!s.seen[n]) { s.seen[n] = true; save(); } };
  function setQuiz(id, score, total) {
    const prev = s.quiz[id];
    if (!prev || score / total >= prev.best / prev.total) s.quiz[id] = { best: score, total };
    save();
  }
  const quizBest = (id) => s.quiz[id] || null;

  /* A lesson is done when all its practice tasks are solved
     and its Mini Quiz was passed with at least half correct. */
  function lessonParts(l) {
    if (!l || !l.full) return null;
    const ids = l.full.practice.map((p) => p.id);
    const done = ids.filter(practiceDone).length;
    const q = quizBest("L" + l.n);
    return { practiceDone: done, practiceTotal: ids.length, quizOk: !!q && q.best / q.total >= 0.5, quiz: q };
  }
  function lessonDone(l) {
    const p = lessonParts(l);
    return !!p && p.practiceDone === p.practiceTotal && p.quizOk;
  }
  function currentLesson() {
    return Content.available().find((l) => !lessonDone(l)) || null;
  }
  function lessonStatus(l) {
    if (!l.full) return "soon";
    if (lessonDone(l)) return "done";
    const c = currentLesson();
    return c && c.n === l.n ? "current" : "open";
  }

  function reset() { s = empty(); save(); }
  const isPersistent = () => persistent;

  return { load, markPractice, practiceDone, markSeen, setQuiz, quizBest, lessonParts, lessonDone, currentLesson, lessonStatus, reset, isPersistent };
})();

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
      else el.setAttribute(k, v === true ? "" : v);
    }
  }
  append(el, kids);
  return el;
}
function append(el, kids) {
  kids.flat(Infinity).forEach((k) => {
    if (k == null || k === false) return;
    el.appendChild(k instanceof Node ? k : document.createTextNode(String(k)));
  });
  return el;
}

/* Persian text with `code` islands -> nodes. Code is always LTR. */
function fmt(text) {
  const frag = document.createDocumentFragment();
  String(text || "").split(/(`[^`]+`)/g).forEach((part) => {
    if (!part) return;
    if (part.startsWith("`") && part.endsWith("`")) frag.appendChild(h("code", { class: "ic", dir: "ltr" }, part.slice(1, -1)));
    else frag.appendChild(document.createTextNode(part));
  });
  return frag;
}

/* Static example terminal (lesson cards, home). lines: [{p,c}|{o}] */
function StaticTerminal(lines, opts = {}) {
  const body = h("div", { class: "term-body" });
  lines.forEach((ln, i) => {
    if (ln.p != null) {
      const isLast = i === lines.length - 1;
      body.appendChild(h("div", { class: "term-line" },
        h("span", { class: "pr" }, ln.p), ln.c ? h("span", { class: "cm" }, ln.c) : null,
        (!ln.c && isLast && opts.cursor !== false) ? h("span", { class: "cursor" }) : null));
    } else body.appendChild(h("div", { class: "term-line" }, ln.o));
  });
  return h("div", { class: "term" + (opts.cls ? " " + opts.cls : ""), dir: "ltr" },
    termBar(opts.title || "Command Prompt"), body);
}

function termBar(title, extra) {
  return h("div", { class: "term-bar" },
    h("div", { class: "term-tab" }, h("span", { class: "ti" }, ">_"), title),
    h("div", { class: "spacer" }), extra || null);

/* Interactive terminal bound to a Shell instance. */
function InteractiveTerminal({ sh, preload, banner, title, onCommand, keys = true }) {
  const body = h("div", { class: "term-body", role: "log", "aria-live": "polite" });
  const prompt = h("span", { class: "pr" });
  const input = h("input", {
    class: "term-input", type: "text", dir: "ltr", autocomplete: "off", autocapitalize: "off",
    autocorrect: "off", spellcheck: "false", enterkeyhint: "send", "aria-label": Content.t("type_here"),
  });
  const form = h("form", { class: "term-input-row" }, prompt, input);
  const history = [];
  let hIdx = 0;

  function addLines(lines) {
    lines.forEach((l) => {
      if (l.t === "note" || l.t === "warn") {
        body.insertBefore(h("div", { class: "term-note" + (l.t === "warn" ? " warn" : "") },
          h("b", null, l.t === "warn" ? "هشدار" : "راهنما"), fmt(l.text)), form);
      } else if (l.t === "cmd") {
        body.insertBefore(h("div", { class: "term-line" }, h("span", { class: "pr" }, l.p), h("span", { class: "cm" }, l.c)), form);
      } else {
        body.insertBefore(h("div", { class: "term-line" + (l.t === "err" ? " err" : "") }, l.text), form);
      }
    });
  }
  function refreshPrompt() { prompt.textContent = Shell.prompt(sh); }
  function clear() { Array.from(body.children).forEach((c) => { if (c !== form) c.remove(); }); }
  function scroll() {
    body.scrollTop = body.scrollHeight;
    if (wrap.isConnected) {
      const r = form.getBoundingClientRect();
      if (r.bottom > window.innerHeight - 90 || r.top < 0) form.scrollIntoView({ block: "center", behavior: "smooth" });
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const v = input.value;
    input.value = "";
    if (v.trim()) { history.push(v); hIdx = history.length; }
    addLines([{ t: "cmd", p: Shell.prompt(sh), c: v }]);
    const r = Shell.run(sh, v);
    if (r.clear) clear(); else addLines(r.lines);
    refreshPrompt();
    scroll();
    if (onCommand && r.rec) onCommand(r);
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp") { e.preventDefault(); recall(-1); }
    if (e.key === "ArrowDown") { e.preventDefault(); recall(1); }
  });
  function recall(d) {
    if (!history.length) return;
    hIdx = Math.max(0, Math.min(history.length, hIdx + d));
    input.value = history[hIdx] || "";
  }
  function insert(txt) {
    const s = input.selectionStart ?? input.value.length, e = input.selectionEnd ?? s;
    input.value = input.value.slice(0, s) + txt + input.value.slice(e);
    input.focus();
    const p = s + txt.length;
    try { input.setSelectionRange(p, p); } catch (err) {}
  }
  body.appendChild(form);
  body.addEventListener("click", (e) => { if (!window.getSelection().toString()) input.focus(); });

  const keyRow = keys ? h("div", { class: "keys" },
    ["\\", ":", "..", "/", '"', "*", " "].map((k) => h("button", { type: "button", class: "key", onClick: () => insert(k) }, k === " " ? "␣" : k)),
    h("button", { type: "button", class: "key", "aria-label": "history", onClick: () => { recall(-1); input.focus(); } }, "↑"),
    h("button", { type: "button", class: "key run", onClick: () => form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event("submit", { cancelable: true })) }, "اجرا ↵"),
  ) : null;

  const wrap = h("div", { class: "term", dir: "ltr" }, termBar(title || "Command Prompt"), body, keyRow);

  function start() {
    clear();
    if (banner) addLines(Shell.banner());
    if (preload) preload.forEach((ln) => addLines([ln.p != null ? { t: "cmd", p: ln.p, c: ln.c } : { t: "out", text: ln.o }]));
    refreshPrompt();
  }
  start();

  return {
    el: wrap,
    focus: () => input.focus({ preventScroll: true }),
    reset(newSh) { sh = newSh; start(); },
    note(text) { addLines([{ t: "note", text }]); scroll(); },
  };
}

  const answerLines = [].concat(task.answer);

    return after || null;
  }
  function onCmd(r) {
    st.attempt.push(r.rec);

    h("div", { class: "row between" },
      h("div", { class: "eyebrow" }, `PRACTICE · LESSON ${task.lesson} · ${idx + 1}/${lessonTasks.length}`),
      h("button", { class: "btn small ghost", onClick: () => App.render() }, icon("reset"), T("restart"))),
    h("div", { class: "card" }, h("p", { class: "task" }, fmt(task.task))),
    term.el,
    fb);
  setTimeout(() => term.focus(), 60);
  return view;
}

/* ---------------- SIMULATOR ---------------- */
function SimView() {
  if (!App.state.simSh) App.state.simSh = Shell.create();
  const term = App.state.simTerm || InteractiveTerminal({ sh: App.state.simSh, banner: true, title: T("sim_title") });
  App.state.simTerm = term;
  const resetBtn = h("button", { class: "btn small ghost", onClick: () => {
    App.state.simSh = Shell.create();
    term.reset(App.state.simSh);
    term.note(T("sim_reset_done"));
    term.focus();
  } }, icon("reset"), T("sim_reset"));
  setTimeout(() => term.focus(), 60);
  return h("div", { class: "sim-wrap view" },
    h("div", { class: "row between wrap" },
      h("div", { class: "stack-sm", style: { gap: "2px" } },
        h("h1", { class: "mono", style: { fontSize: "18px", direction: "ltr", textAlign: "right" } }, "CMD Simulator"),
        h("div", { class: "muted small" }, T("sim_badge"))),
      resetBtn),
    term.el,
    h("div", { class: "muted small" }, fmt("امتحان کن: `dir` ، `cd Documents` ، `cd ..` ، `D:` ، `help`")));
}

/* ---------------- QUIZ ---------------- */
function QuizHomeView() {
  const row = (q, label) => {
    const b = Store.quizBest(q.id);
    return h("button", { class: "task-row", onClick: () => App.go("quiz-" + q.id) },
      h("span", { class: "st" + (b && b.best / b.total >= 0.5 ? " done" : "") }, b && b.best / b.total >= 0.5 ? "✓" : ""),
      h("div", { class: "grow" }, h("div", { class: "ln" }, label), h("div", { class: "small" }, fmt(q.title))),
      b ? h("span", { class: "pct small muted" }, `${b.best}/${b.total}`) : null);
  };
  return h("div", { class: "stack view" },
    h("h1", { class: "mono", style: { direction: "ltr", textAlign: "right" } }, "Quiz"),
    h("section", { class: "card chapter" },
      h("div", { class: "chapter-head" }, h("h3", null, T("quiz_chapters"))),
      Content.chapterQuizzes().map((q) => row(q, "Chapter " + q.chapter))),
    h("section", { class: "card chapter" },
      h("div", { class: "chapter-head" }, h("h3", null, T("quiz_lessons"))),
      Content.available().map((l) => row(Content.quiz("L" + l.n), "Lesson " + l.n))));
}

function QuizRunView(id) {
  const quiz = Content.quiz(id);
  if (!quiz) return NotFound();
  let run = App.state.quizRun;
  if (!run || run.id !== id) {
    const qs = id[0] === "C" ? shuffle(quiz.questions).slice(0, 8) : quiz.questions.slice();
    run = App.state.quizRun = {
      id, i: 0, score: 0, answered: false,
      qs: qs.map((q) => {
        if (q.kind === "tf") return { ...q, opts: [{ txt: T("tf_true"), ok: q.answer === true }, { txt: T("tf_false"), ok: q.answer === false }] };
        if (q.kind === "type") return { ...q };
        return { ...q, opts: shuffle(q.options.map((txt, i) => ({ txt, ok: i === q.answer }))) };
      }),
    };
  }
  const backRoute = quiz.lesson ? "lesson" + quiz.lesson : "quiz";
  const head = h("div", { class: "stack-sm" },
    backBtn(quiz.lesson ? "درس " + fa(quiz.lesson) : "Quiz", backRoute),
    h("div", { class: "eyebrow" }, (quiz.lesson ? "MINI QUIZ · LESSON " + quiz.lesson : "CHAPTER QUIZ · " + quiz.chapter)),
    h("h1", null, fmt(quiz.title)));

  if (run.i >= run.qs.length) {
    const total = run.qs.length;
    if (!run.saved) { Store.setQuiz(id, run.score, total); run.saved = true; }
    const pass = run.score / total >= 0.5;
    return h("div", { class: "stack view" }, head,
      h("div", { class: "card stack-sm pop", style: { alignItems: "center", textAlign: "center", padding: "28px 16px" } },
        h("div", { class: "eyebrow" }, T("quiz_result")),
        h("div", { class: "score-big", style: { color: pass ? "var(--green)" : "var(--warn)" } }, `${run.score} / ${total}`),
        h("p", { class: "muted" }, pass ? "عالی! این Quiz را با موفقیت گذراندی." : "کمتر از نصف درست بود. درس را یک بار دیگر مرور کن و دوباره امتحان کن.")),
      h("div", { class: "btn-row" },
        h("button", { class: "btn", onClick: () => { App.state.quizRun = null; App.render(); } }, T("quiz_retry")),
        quiz.lesson ? h("button", { class: "btn primary", onClick: () => { App.state.quizRun = null; App.go(nextAfterQuiz(quiz.lesson)); } },
          Content.nextLesson(quiz.lesson) && Content.nextLesson(quiz.lesson).full ? T("btn_next_lesson") : T("back_to_lesson"))
          : h("button", { class: "btn primary", onClick: () => { App.state.quizRun = null; App.go("quiz"); } }, T("back"))));
  }

  const q = run.qs[run.i];
  const fb = h("div", { "aria-live": "polite" });
  const nextBtn = () => h("button", { class: "btn primary block", onClick: () => { run.i++; run.answered = false; App.render(); } },
    run.i + 1 >= run.qs.length ? T("quiz_finish") : T("quiz_next"));
  const verdict = (ok) => {
    fb.innerHTML = "";
    fb.appendChild(h("div", { class: "stack-sm" },
      h("div", { class: "feedback " + (ok ? "ok pop" : "no shake") },
        h("div", { class: "fh mono", style: { direction: "ltr", textAlign: "right" } }, ok ? T("quiz_correct") : T("quiz_wrong")),
        q.explain ? h("div", null, fmt(q.explain)) : null),
      nextBtn()));
  };

  let answerUI;
  if (q.kind === "type") {
    const inp = h("input", { class: "text-in", type: "text", dir: "ltr", autocomplete: "off", autocapitalize: "off", autocorrect: "off", spellcheck: "false", enterkeyhint: "done", placeholder: "C:\\> ..." });
    const check = h("button", { class: "btn primary", type: "submit" }, T("quiz_check"));
    answerUI = h("form", { class: "stack-sm", onSubmit: (e) => {
      e.preventDefault();
      if (run.answered || !inp.value.trim()) return;
      run.answered = true;
      const ok = Checker.sameCommand(inp.value, q.accept);
      if (ok) run.score++;
      inp.disabled = true; check.disabled = true;
      inp.style.borderColor = ok ? "var(--green)" : "var(--danger)";
      if (!ok) fb.before(h("div", { class: "answer-code" }, q.show || q.accept[0]));
      verdict(ok);
    } }, inp, check);
    setTimeout(() => inp.focus({ preventScroll: true }), 60);
  } else {
    const buttons = q.opts.map((o) => {
      const b = h("button", { class: "opt" + (q.code_options ? " code" : ""), onClick: () => {
        if (run.answered) return;
        run.answered = true;
        if (o.ok) run.score++;
        buttons.forEach((x, i) => {
          x.disabled = true;
          if (q.opts[i].ok) { x.classList.add("right"); x.querySelector(".mark").textContent = "✓"; }
        });
        if (!o.ok) { b.classList.add("wrong"); b.querySelector(".mark").textContent = "✕"; }
        verdict(o.ok);
      } }, h("span", { class: "mark" }), h("span", { class: "otxt grow" }, q.code_options ? o.txt : fmt(o.txt)));
      return b;
    });
    answerUI = h("div", { class: "opts" }, buttons);
  }

  return h("div", { class: "stack view" }, head,
    h("div", { class: "bar" }, h("i", { style: { width: pct(run.i, run.qs.length) + "%" } })),
    h("div", { class: "card stack" },
      h("div", { class: "row between" },
        h("span", { class: "q-kind" }, T("kind_" + q.kind)),
        h("span", { class: "muted small" }, T("quiz_q_of", { i: fa(run.i + 1), n: fa(run.qs.length) }))),
      h("p", { class: "q-text" }, fmt(q.q)),
      q.code ? h("div", { class: "q-code" }, q.code) : null,
      answerUI),
    fb);
}
function nextAfterQuiz(n) {
  const nx = Content.nextLesson(n);
  return nx && nx.full ? "lesson" + nx.n : "lesson" + n;
}

/* ---------------- PROGRESS ---------------- */
function ProgressView() {
  const all = Content.all();
  const done = all.filter((l) => Store.lessonDone(l)).length;
  const tasks = Content.tasks();
  const pdone = tasks.filter((t) => Store.practiceDone(t.id)).length;
  const quizzes = Content.available().map((l) => Store.quizBest("L" + l.n)).filter(Boolean);
  const qScore = quizzes.length ? Math.round(quizzes.reduce((s, q) => s + q.best / q.total, 0) / quizzes.length * 100) : 0;

  const levelLine = (lv) => {
    const ls = Content.levelLessons(lv.id);
    const d = ls.filter((l) => Store.lessonDone(l)).length;
    const p = pct(d, ls.length);
    const on = Math.round(p / 10);
    return h("div", { class: "lvl-line" },
      h("div", { class: "row between" },
        h("span", { class: "mono", style: { direction: "ltr" } }, `Level ${lv.id}`),
        h("span", { class: "muted small" }, `${lv.title} · ${fa(d)}/${fa(ls.length)}`),
        h("span", { class: "pct" }, p + "%")),
      h("div", { class: "blocks", "aria-hidden": "true" }, Array.from({ length: 10 }, (_, i) => h("i", { class: i < on ? "on" : "" }))));
  };

  const confirmBox = h("div");
  const resetBtn = h("button", { class: "btn ghost small", onClick: () => {
    confirmBox.innerHTML = "";
    confirmBox.appendChild(h("div", { class: "callout warn" }, icon("warn"), h("div", { class: "stack-sm grow" },
      h("div", null, T("reset_confirm")),
      h("div", { class: "btn-row" },
        h("button", { class: "btn small", style: { borderColor: "var(--danger)", color: "var(--danger)" }, onClick: () => { Store.reset(); App.render(); } }, T("yes_reset")),
        h("button", { class: "btn small", onClick: () => { confirmBox.innerHTML = ""; } }, T("cancel"))))));
  } }, T("reset_progress"));

  return h("div", { class: "stack view" },
    h("h1", null, T("progress_title")),
    h("div", { class: "card stack" },
      h("div", { class: "row between" },
        h("div", { class: "eyebrow" }, T("overall")),
        h("div", { class: "pct big-num", style: { fontSize: "22px" } }, pct(done, all.length) + "%")),
      h("div", { class: "bar" }, h("i", { style: { width: pct(done, all.length) + "%" } })),
      Content.levels().map(levelLine)),
    h("div", { class: "stats" },
      h("div", { class: "card stat" }, h("div", { class: "n" }, `${done}/${all.length}`), h("div", { class: "l" }, T("stat_lessons"))),
      h("div", { class: "card stat" }, h("div", { class: "n" }, qScore + "%"), h("div", { class: "l" }, T("stat_quiz"))),
      h("div", { class: "card stat" }, h("div", { class: "n" }, `${pdone}/${tasks.length}`), h("div", { class: "l" }, T("stat_practice")))),
    h("p", { class: "muted small" }, Store.isPersistent() ? T("saved_local") : T("storage_off")),
    h("div", null, resetBtn),
    confirmBox);
}

function NotFound() {
  return h("div", { class: "stack view" }, h("p", { class: "muted" }, "این صفحه پیدا نشد."), h("button", { class: "btn", onClick: () => App.go("") }, T("nav_home")));
}

/* ============================================================
   app.js — boot, router and navigation shell.
   Routes: "" | learn | lessonN | practice | task-ID | sim |
           quiz | quiz-L3 | quiz-C1 | progress
   ============================================================ */
const App = (() => {
  const state = { route: "", learnLevel: 1, simSh: null, simTerm: null, quizRun: null };
  let main, navEls = [];

  const NAV = [
    { route: "", key: "nav_home", icon: "home", match: (r) => r === "" },
    { route: "learn", key: "nav_learn", icon: "learn", match: (r) => r === "learn" || r.startsWith("lesson") },
    { route: "practice", key: "nav_practice", icon: "practice", match: (r) => r === "practice" || r.startsWith("task-") },
    { route: "sim", key: "nav_sim", icon: "sim", match: (r) => r === "sim" },
    { route: "progress", key: "nav_progress", icon: "progress", match: (r) => r === "progress" },
  ];

  function view(r) {
    if (r === "") return HomeView();
    if (r === "learn") return LearnView();
    if (/^lesson\d+$/.test(r)) return LessonView(+r.slice(6));
    if (r === "practice") return PracticeView();
    if (r.startsWith("task-")) return TaskView(r.slice(5));
    if (r === "sim") return SimView();
    if (r === "quiz") return QuizHomeView();
    if (/^quiz-[LC]\d+$/.test(r)) return QuizRunView(r.slice(5));
    if (r === "progress") return ProgressView();
    return NotFound();
  }

  function render() {
    main.innerHTML = "";
    main.classList.toggle("wide", state.route === "sim");
    main.appendChild(view(state.route));
    navEls.forEach(({ el, item }) => {
      if (item.match(state.route)) el.setAttribute("aria-current", "page"); else el.removeAttribute("aria-current");
    });
  }

  function go(route) {
    if (route !== state.route && !route.startsWith("quiz-")) state.quizRun = null;
    if (route.startsWith("quiz-") && state.quizRun && "quiz-" + state.quizRun.id !== route) state.quizRun = null;
    state.route = route;
    render();
    window.scrollTo(0, 0);
    try { if (location.hash.slice(1) !== route) location.hash = route; } catch (e) {}
  }

  function boot() {
    document.documentElement.setAttribute("dir", "rtl");
    document.documentElement.setAttribute("lang", "fa");
    const data = JSON.parse(document.getElementById("cmd-content").textContent);
    Content.init(data);
    Shell.setMessages(Content.shellMessages());
    Shell.setLessonIndex(Content.shellIndex());
    Store.load();

    const sidebar = h("nav", { class: "sidebar", "aria-label": "main" },
      h("div", { class: "brand" }, Content.t("app_name")));
    const bottom = h("nav", { class: "bottom-nav", "aria-label": "main" });
    NAV.forEach((item) => {
      const s = h("button", { class: "side-btn", onClick: () => go(item.route) }, icon(item.icon), Content.t(item.key));
      const b = h("button", { class: "nav-btn", onClick: () => go(item.route) }, icon(item.icon), Content.t(item.key));
      sidebar.appendChild(s); bottom.appendChild(b);
      navEls.push({ el: s, item }, { el: b, item });
    });
    sidebar.appendChild(h("div", { class: "side-sep" }));
    const quizItem = { match: (r) => r.startsWith("quiz") };
    const qb = h("button", { class: "side-btn", onClick: () => go("quiz") }, icon("quiz"), "Quiz");
    sidebar.appendChild(qb); navEls.push({ el: qb, item: quizItem });

    main = h("main", { class: "main" });
    document.getElementById("app").append(sidebar, main, bottom);

    try { state.route = decodeURIComponent(location.hash.slice(1)); } catch (e) { state.route = ""; }
    window.addEventListener("hashchange", () => {
      const r = location.hash.slice(1);
      if (r !== state.route) { state.route = r; state.quizRun = null; render(); }
    });
    render();
  }

  return { boot, go, render, state };
})();

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", App.boot);
else App.boot();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
